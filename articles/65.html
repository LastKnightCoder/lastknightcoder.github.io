    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":65,"title":"如何调试 React 源码","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"使用 Vite 创建 React 项目，并且在 WebStorm 中调试 React 源码，效果如下："}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e432b0ac-5f5a-46b9-bb8b-23075e0cb74b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以直接调试源码，而不只是打包后的产物。"}]},{"type":"header","children":[{"type":"formatted","text":"构建 React 源码"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"为了做到能够直接调试源码，而不是压缩、混肴的产物，我们需要自己构建 React 源码，并且生成 sourcemap 文件。"}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"sourcemap（源映射）是一个文件，它提供了一种将压缩、合并或经过其他转换后的代码（如在生产环境中使用的代码）映射回原始源代码的方式。当 JavaScript 代码经过构建工具（如 Webpack、Rollup 等）处理后，代码可能会被压缩、丑化（变量名缩短等操作）或者合并成一个文件，这使得调试变得困难，因为调试工具显示的是转换后的代码，而不是开发人员编写的原始代码。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"下载"},{"type":"link","url":"https://github.com/facebook/react","openEdit":false,"children":[{"type":"formatted","text":"源码"}]},{"text":"","type":"formatted"}]},{"type":"code-block","code":"git clone git@github.com:facebook/react.git","language":"Shell","uuid":"edd981a0-88d2-4b83-a302-6868bff1989c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于 React 最新的构建结果和之前不同，和找到的参考资料不一样，因此需要 "},{"type":"formatted","text":"reset","code":true},{"type":"formatted","text":" 到之前的 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 进行构建"}]},{"type":"code-block","code":"git reset --hard 80f3d88190c07c2da11b5cac58a44c3b90fbc296","language":"Shell","uuid":"003a4479-b266-490b-b95a-41d3a079a427","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"安装依赖"}]},{"type":"code-block","code":"npm install","language":"Shell","uuid":"82b2f84f-070a-431e-b1f7-c20fa3908b23","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于 React 构建脚本依赖于 Java，因此需要确保 Java 环境已准备就绪"}]},{"type":"tabs","activeKey":"2d02ddc8-95c5-4e71-8c9c-a7f2d9b3a53c","tabsContent":[{"key":"2d02ddc8-95c5-4e71-8c9c-a7f2d9b3a53c","content":[{"type":"paragraph","children":[{"type":"formatted","text":"前往 "},{"type":"link","url":"https://www.oracle.com/cn/java/technologies/downloads/#jdk23-windows","openEdit":false,"children":[{"type":"formatted","text":"Oracle 官网"}]},{"type":"formatted","text":"下载"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5edb6669-7bc5-46e2-8373-f4582f46349d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后一直下一步就行，安装完成后不用手动设置环境变量，在命令行"}]}],"title":"Windows"},{"key":"712f1e79-c2a5-4eae-ab02-195e3d2052e6","content":[{"type":"paragraph","children":[{"type":"formatted","text":"直接使用 "},{"type":"formatted","text":"brew","code":true},{"type":"formatted","text":" 安装即可"}]},{"type":"code-block","code":"brew install java","language":"sh","uuid":"6d7eb037-1971-48db-b5cf-b0dd344b34f1","children":[{"type":"formatted","text":""}]}],"title":"Mac"}],"children":[{"type":"paragraph","children":[{"type":"formatted","text":"前往 "},{"type":"link","url":"https://www.oracle.com/cn/java/technologies/downloads/#jdk23-windows","openEdit":false,"children":[{"type":"formatted","text":"Oracle 官网"}]},{"type":"formatted","text":"下载"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5edb6669-7bc5-46e2-8373-f4582f46349d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后一直下一步就行，安装完成后不用手动设置环境变量，在命令行输入 "},{"type":"formatted","text":"java -version","code":true},{"type":"formatted","text":" 即可验证是否安装成功"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ac95c681-61bd-44d7-98a4-aeb1aab0f337.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了生成 sourcemap 文件，需要修改构建脚本的配置，脚本位于 "},{"type":"styled-text","color":"gray","children":[{"type":"formatted","text":"scripts/rollup/build.js"}]},{"type":"formatted","text":" 中，首先需要将 sourcemap 为 true"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2aa358ad-a6ee-4514-8876-54681d4d1676.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这时如果直接运行构建脚本 "},{"type":"formatted","text":"npm run build","code":true},{"type":"formatted","text":"，会发现报错"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9b84ebcd-2927-4bd2-991d-bdd23461ae3c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述问题是因为构建的过程中会进行多次转换，会生成多次 sourcemap，然后把 sourcemap 串联起来就是最终的 sourcemap。如果中间有一步转换没有生成 sourcemap，那就断掉了，也就没法把 sourcemap 串联起来了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个问题的解决只要找出没有生成 sourcemap 的那几个插件注释掉就可以了"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ea563647-7178-444f-ba58-3925d7cf70e3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_22cb8c0f-04cc-4e15-b7e5-dcf284f83d85.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b7e57410-f5c1-4d09-afef-0f3500381952.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"再次运行 "},{"type":"formatted","text":"npm run build","code":true},{"type":"formatted","text":" 就可以正常构建了"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1623204f-ee00-42f2-a877-dbf8dbcc4896.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"构建完成后，可以在 "},{"type":"styled-text","color":"gray","children":[{"type":"formatted","text":"build/node_modules"}]},{"type":"formatted","text":" 下面看到构建的产物，可以看到生成了 "},{"type":"formatted","text":"sourcemap","code":true},{"type":"formatted","text":" 文件"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9fd595b9-ba84-4068-b8f2-6c78fa334cfa.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们把 "},{"type":"formatted","text":"react","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"react-dom","code":true},{"type":"formatted","text":" 链接到全局，方便我们在项目中引用调试"}]},{"type":"code-block","code":"cd build/node_modules/react\nnpm link\n\ncd ../react-dom\nnpm link","language":"Shell","uuid":"58e06dd7-2fab-451c-a454-9ceed166be3d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"创建 React 项目并调试"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"link","url":"https://vite.dev/guide/","openEdit":false,"children":[{"type":"formatted","text":"Vite"}]},{"type":"formatted","text":" 创建一个 React 项目"}]},{"type":"code-block","code":"npm create vite@latest","language":"Shell","uuid":"41fb2f00-05e8-40b2-a2da-ca7c345f8f9d","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fb233c9a-1a75-4cb3-87d6-ffe83af7870a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"进入项目，安装依赖"}]},{"type":"code-block","code":"cd react-debug\nnpm install","language":"Shell","uuid":"6cdbe83d-964f-41a2-a094-aea4a18960a4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里不使用安装的 "},{"type":"formatted","text":"react","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"react-dom","code":true},{"type":"formatted","text":"，而是使用本地构建好并 "},{"type":"formatted","text":"link","code":true},{"type":"formatted","text":" 到全局的包"}]},{"type":"code-block","code":"npm link react\nnpm link react-dom","language":"Shell","uuid":"b0ce5c1d-9d3e-4307-ade8-a915ab565479","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了方便的在 WebStorm 中进行调试，需要进行一些配置，首先点击顶部栏的 Current File，打开一个下拉框，选择 Edit Configurations"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1868c9b2-340d-40bc-913e-03e1241e7413.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"会弹出一个配置管理弹窗，点击左上角的 "},{"type":"styled-text","color":"gray","children":[{"type":"formatted","text":"+"}]},{"type":"formatted","text":" 并选择 JavaScript Debug"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4a6c8801-4901-41c9-83e4-01fcaf9b9ce2.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"编辑调试配置，Name 就是该调试的名称，URL 就是前端项目的启动地址，这里使用的 Vite，默认启动在 http://localhost:5173"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a27eea62-d8bc-43aa-9fe6-f2722068698d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"编辑完成后，启动项目"}]},{"type":"code-block","code":"npm run dev","language":"javascript","uuid":"2bba1314-f8b2-4c9c-9cb0-eed0d6b88251","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"点击小虫的调试按钮"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_562d2f05-8e1b-4bbe-9f29-499bed8ab291.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"WebStorm 会自动打开一个 Chrome 页面"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f9e16a9c-a6d8-4db5-89f8-ff12051fa6f3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以添加一个断点，给标题添加一个点击事件并添加断点"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3511ba40-adf1-42b1-8668-af13383eb72b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"点击标题，这时会发现程序断住了，可以在 WebStorm 界面可以查看调用栈，变量等信息"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/output_87862203-c6d6-4fb1-b3fc-46052dc63995.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":
