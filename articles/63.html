      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":63,"title":"IntersectionObserver","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"如果我们需要监听某个元素是否出现在视口中，一般做法是监听 "},{"type":"formatted","text":"scroll","code":true},{"type":"formatted","text":" 事件，然后查询元素离视口顶部的距离，但是监听 "},{"type":"formatted","text":"scroll","code":true},{"type":"formatted","text":" 事件存在性能问题。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"浏览器原生提供了 "},{"type":"formatted","text":"IntersectionObserver","code":true},{"type":"formatted","text":" 监听器，可以监听某个元素是否出现在视口中。"}]},{"type":"header","children":[{"type":"formatted","text":"使用方法"}],"level":2},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"首先通过 "},{"type":"formatted","text":"new IntersectionObserver(callback, options)","code":true},{"type":"formatted","text":" 创建一个监视器，其中 "},{"type":"formatted","text":"callback","code":true},{"type":"formatted","text":" 是当监听的元素出现在视口时执行的回调函数，"},{"type":"formatted","text":"options","code":true},{"type":"formatted","text":" 是一些选项，稍后介绍。"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"然后通过监视器的 "},{"type":"formatted","text":"observe","code":true},{"type":"formatted","text":" 方法监听感兴趣的元素。"}]}]}]},{"type":"tabs","activeKey":"8959df7c-9aa0-4454-b447-eddd71c72b43","tabsContent":[{"key":"472f54b4-f245-4adf-a29b-2eaeacfb794d","title":"HTML","content":[{"type":"code-block","code":"<div id=\"box\"></div>","language":"HTML","uuid":"e33d82e0-d31f-4e74-8eaa-982d30dd3e47","children":[{"type":"formatted","text":""}]}]},{"key":"ca5f45ad-a5f0-4c75-b3e2-ea7c8e20403b","content":[{"type":"code-block","code":"#box {\n  width: 100%;\n  height: 500px;\n  background: deeppink;\n  position: relative;\n  top: calc(100vh + 100px);\n}","language":"CSS","uuid":"9ed48f92-87bc-4e02-8415-76591f013213","children":[{"type":"formatted","text":""}]}],"title":"CSS"},{"key":"8959df7c-9aa0-4454-b447-eddd71c72b43","content":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n    console.log('entries: ', entries);\n});\n\nobserver.observe(document.getElementById('box'));","language":"JavaScript","uuid":"bda079e2-4c34-4536-ad87-d7e38c129973","children":[{"type":"formatted","text":""}]}],"title":"JavaScript"}],"children":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n    console.log('entries: ', entries);\n});\n\nobserver.observe(document.getElementById('box'));","language":"JavaScript","uuid":"bda079e2-4c34-4536-ad87-d7e38c129973","children":[{"type":"formatted","text":""}]}]},{"type":"html-block","html":"<video src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-base.mp4\" style=\"max-width: 100%;\"></video>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"options"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"threshold"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"threshold","code":true},{"type":"formatted","text":" 可以指定元素与视口相交的比例来触发回调函数，它的值是一个数字或一个数组，默认是 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，即元素一出现在视口中就执行"}]},{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {  \n  console.log(entries);  \n}, {  \n  threshold: [0.5, 1]  \n});","language":"JavaScript","uuid":"99dde441-9758-41bf-afdb-dbcaf520770f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述代码表示当元素一半出现在视口中或者元素全部出现在视口中时，均会执行回调函数。"}]},{"type":"html-block","html":"<video controls src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-threshold.mp4\" style=\"max-width: 100%;\"></video>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"root"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们不止可以监听元素在视口中出现与消失，在任意可滚动的元素中均可以监听，我们通过 "},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 来指定滚动的容器，"},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 的默认值为 "},{"type":"formatted","text":"null","code":true},{"type":"formatted","text":"，当值为 "},{"type":"formatted","text":"null","code":true},{"type":"formatted","text":"，使用 "},{"type":"formatted","text":"document","code":true},{"type":"formatted","text":" 作为滚动容器。"}]},{"type":"tabs","activeKey":"440abdab-2da2-44fb-baae-78b0fa84dcbc","tabsContent":[{"key":"e69b876f-c9de-4a90-b541-66922e2ab63c","title":"HTML","content":[{"type":"code-block","code":"<div id=\"box-container\">\n  <div id=\"box\"></div>\n  <div id=\"box-after\"></div>\n</div>","language":"HTML","uuid":"88d3be1a-4b80-40ff-a3e5-664521a76381","children":[{"type":"formatted","text":""}]}]},{"key":"acd2b46b-8598-460d-8982-78e997539cbc","content":[{"type":"code-block","code":"body {\n    margin: 0;\n    padding: 0;\n}\n\n#box-container {\n    height: 300px;\n    overflow: auto;\n    width: 300px;\n    margin: 100px auto;\n}\n\n#box {\n    width: 100%;\n    height: 300px;\n    background: deepskyblue;\n    position: relative;\n    top: 300px;\n}\n\n#box-after {\n    position: relative;\n    height: 300px;\n    top: 300px;\n}","language":"CSS","uuid":"e88a8c80-7a5a-426f-9202-9a96d745f228","children":[{"type":"formatted","text":""}]}],"title":"CSS"},{"key":"440abdab-2da2-44fb-baae-78b0fa84dcbc","content":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n  console.log('entries: ', entries);\n}, {\n  threshold: [0.5, 1],\n  root: document.getElementById('box-container'),\n});\n\nobserver.observe(document.getElementById('box'));","language":"JavaScript","uuid":"3582631a-f304-47a6-8a8e-33bfb87cb160","children":[{"type":"formatted","text":""}]}],"title":"JavaScript"}],"children":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n  console.log('entries: ', entries);\n}, {\n  threshold: [0.5, 1],\n  root: document.getElementById('box-container'),\n});\n\nobserver.observe(document.getElementById('box'));","language":"JavaScript","uuid":"3582631a-f304-47a6-8a8e-33bfb87cb160","children":[{"type":"formatted","text":""}]}]},{"type":"html-block","html":"<video controls style=\"max-width: 100%;\" src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-root.mp4\"></video>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"rootMargin"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"rootMargin","code":true},{"type":"formatted","text":" 可以增大或缩小视口的区域，与 "},{"type":"formatted","text":"margin","code":true},{"type":"formatted","text":" 属性的取值相似，不过这里的 "},{"type":"formatted","text":"rootMargin","code":true},{"type":"formatted","text":" 还可以为负值。"}]},{"type":"tabs","activeKey":"8cbae387-2217-4c06-82b6-c8d22cf14961","tabsContent":[{"key":"b8c33b66-39b5-409d-96d2-fc2a7d074faf","title":"HTML","content":[{"type":"code-block","code":"<div id=\"box\"></div>","language":"HTML","uuid":"4953c071-da36-48eb-8e00-a0328241f2cb","children":[{"type":"formatted","text":""}]}]},{"key":"28cc658b-2907-4350-b54d-88490e834876","content":[{"type":"code-block","code":"#box {\n  width: 100%;\n  height: 500px;\n  background: deeppink;\n  position: relative;\n  top: calc(100vh + 100px);\n}","language":"CSS","uuid":"5ab4d6f1-2237-4267-b084-48633ce030db","children":[{"type":"formatted","text":""}]}],"title":"CSS"},{"key":"8cbae387-2217-4c06-82b6-c8d22cf14961","content":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n  console.log(entries);\n}, {\n  threshold: [0.5, 1],\n  rootMargin: '-100px 0px -100px 0px'\n});","language":"JavaScript","uuid":"59f54c9d-0336-4e8e-a46e-98066929b656","children":[{"type":"formatted","text":""}]}],"title":"JavaScript"}],"children":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n  console.log(entries);\n}, {\n  threshold: [0.5, 1],\n  rootMargin: '-100px 0px -100px 0px'\n});","language":"JavaScript","uuid":"59f54c9d-0336-4e8e-a46e-98066929b656","children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面设置了 "},{"type":"formatted","text":"rootMargin","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"-100px 0px 0px -100px","code":true},{"type":"formatted","text":"，使得视口与元素交叉区域的计算不再是蓝色，而变为了黄色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_540eb95f-5995-49f7-8593-28183036bc95.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果元素下面没有其他空间，那么元素不可能完全位于黄色区域中，"},{"type":"formatted","text":"threshold","code":true},{"type":"formatted","text":" 设置为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 没有意义。"}]},{"type":"html-block","html":"<video controls style=\"max-width: 100%;\" src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-rootMargin.mp4\"></video>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"虽然我们设置了 "},{"type":"formatted","text":"threshold: [0.5, 1]","code":true},{"type":"formatted","text":"，但是从视频可以看到出现和消失分别只打印了一次。"}]},{"type":"header","children":[{"type":"formatted","text":"entries"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"传入该回调函数的是一个数组，因为可以同时监听多个对象，多个对象可能同时出现在视口中，因此是一个数组。数组的每个元素都是对象，包含以下字段："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"intersectionRatio","code":true},{"type":"formatted","text":"：出现在视口中的元素与整体的比例"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"boundingClientRect","code":true},{"type":"formatted","text":"：元素的大小及位置信息"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"intersectionRect","code":true},{"type":"formatted","text":"：元素出现在视口中这部分的大小及位置信息"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"rootBounds","code":true},{"type":"formatted","text":"："},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 的大小及位置信息"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"target","code":true},{"type":"formatted","text":"：被监听的元素"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"time","code":true},{"type":"formatted","text":"：触发该事件的时间，单位为毫秒，页面加载时为 "},{"type":"formatted","text":"0","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"isIntersecting","code":true},{"type":"formatted","text":"：是出现还是消失"}]}]}]},{"type":"header","children":[{"type":"formatted","text":"intersectionRatio"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"intersectionRatio","code":true},{"type":"formatted","text":" 表示元素出现在视口中的部分与元素整体的比例"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a9e726ee-b158-43a6-9fc5-5253ea994252.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"boundingClientRect、intersectionRect 与 rootBounds"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"boundingClientRect","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"intersectionRect","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"rootBounds","code":true},{"type":"formatted","text":" 的值都是 "},{"type":"formatted","text":"DOMRect","code":true},{"type":"formatted","text":" 对象，提供了元素的大小以及相对于视口的位置关系，具体可以参考 "},{"type":"formatted","text":"Element.getBoundingClientRect()","code":true},{"type":"formatted","text":" 方法，各字段含义如下所示。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_26950078-f6db-4df3-bcee-6022ee255a05.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"boundingClientRect","code":true},{"type":"formatted","text":" 表示的是被监听的元素的大小与 "},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 的位置关系，"},{"type":"formatted","text":"intersectionRect","code":true},{"type":"formatted","text":" 表示元素与视口交叉区域部分的大小与 "},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 的位置关系，"},{"type":"formatted","text":"rootBounds","code":true},{"type":"formatted","text":" 表示的是 "},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 的大小与视口的位置关系。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"rootBounds","code":true},{"type":"formatted","text":" 的大小及位置均会收到 "},{"type":"formatted","text":"rootMargin","code":true},{"type":"formatted","text":" 的影响。"}]},{"type":"header","children":[{"type":"formatted","text":"target"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 表示的就是被监听的元素。"}]},{"type":"header","children":[{"type":"formatted","text":"isIntersecting"}],"level":3},{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {  \n  for (const entry of entries) {  \n    console.log(entry.isIntersecting);  \n  }  \n}, {  \n  threshold: [0.5],  \n});  \n  \nobserver.observe(document.getElementById('box'));","language":"JavaScript","uuid":"43acfe18-6db0-44f6-b5f3-bbddcc402dc0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当被监听的元素进入或消失于视口中时，均会触发回调函数的执行，"},{"type":"formatted","text":"isIntersecting","code":true},{"type":"formatted","text":" 的值可以表示是出现在视口中还是消失在视口中，当值为 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":" 时，表示出现在视口中，为 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":" 表示消失在视口中。"}]},{"type":"html-block","html":"<video style=\"max-width: 100%;\" src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-isIntersecting.mp4\"></video>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"time"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"可见性发生变化的时间，是一个高精度时间戳，单位为毫秒。"}]},{"type":"header","children":[{"type":"formatted","text":"案例"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"图片懒加载"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"如果一个页面中图片的数量太多，会影响页面的加载速度，对网站性能造成影响，我们可以当图片出现在视口中时才对图片进行加载，传统的方法需要监听 "},{"type":"formatted","text":"scroll","code":true},{"type":"formatted","text":" 事件，然后判断图片是否在视口中。但是 "},{"type":"formatted","text":"scroll","code":true},{"type":"formatted","text":" 触发的十分频繁，具有性能问题。现在可以通过 "},{"type":"formatted","text":"IntersectionObserver","code":true},{"type":"formatted","text":" 来实现，并且有较好的性能。"}]},{"type":"tabs","activeKey":"dcd8bbaa-f487-4339-b5d1-7131e5715bb4","tabsContent":[{"key":"7aba3dbc-273c-44ac-b1e9-aa9676c185d0","title":"HTML","content":[{"type":"code-block","code":"<div id=\"before\"></div>\n<div id=\"image-list\">\n  <img class=\"lazy-image\" data-src=\"images/01.jpg\" />\n  <img class=\"lazy-image\" data-src=\"images/02.jpg\" />\n  <img class=\"lazy-image\" data-src=\"images/03.jpg\" />\n  <img class=\"lazy-image\" data-src=\"images/04.jpg\" />\n</div>","language":"HTML","uuid":"7eda9347-b2c8-4af5-a560-b02f98dc83a0","children":[{"type":"formatted","text":""}]}]},{"key":"89e39b5e-bf86-4f09-85c5-304fd3f67b54","content":[{"type":"code-block","code":"#before {\n  height: calc(100vh + 10px);\n}\n\n#image-list {\n  display: flex;\n  justify-content: space-between;\n  margin: 100px 50px;\n}\n\n#image-list .lazy-image {\n  width: 200px;\n  height: 200px;\n  object-fit: cover;\n}","language":"CSS","uuid":"c12016ff-bc3e-42bd-9fb5-846f8a11a89b","children":[{"type":"formatted","text":""}]}],"title":"CSS"},{"key":"dcd8bbaa-f487-4339-b5d1-7131e5715bb4","content":[{"type":"code-block","code":"#before {\n  height: calc(100vh + 10px);\n}\n\n#image-list {\n  display: flex;\n  justify-content: space-between;\n  margin: 100px 50px;\n}\n\n#image-list .lazy-image {\n  width: 200px;\n  height: 200px;\n  object-fit: cover;\n}","language":"JavaScript","uuid":"f0456cf5-c882-4838-a56a-409d798fa8fe","children":[{"type":"formatted","text":""}]}],"title":"JavaScript"}],"children":[{"type":"code-block","code":"#before {\n  height: calc(100vh + 10px);\n}\n\n#image-list {\n  display: flex;\n  justify-content: space-between;\n  margin: 100px 50px;\n}\n\n#image-list .lazy-image {\n  width: 200px;\n  height: 200px;\n  object-fit: cover;\n}","language":"JavaScript","uuid":"f0456cf5-c882-4838-a56a-409d798fa8fe","children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们将图片的链接设置在自定义属性 "},{"type":"formatted","text":"data-src","code":true},{"type":"formatted","text":" 上，而不是 "},{"type":"formatted","text":"src","code":true},{"type":"formatted","text":" 属性，然后我们监听这些图像，当图像出现在视口中时，我们获取图像的 "},{"type":"formatted","text":"data-src","code":true},{"type":"formatted","text":" 属性，并设置到 "},{"type":"formatted","text":"src","code":true},{"type":"formatted","text":" 属性上，并且取消监听对象。"}]},{"type":"html-block","html":"<video controls=\"\" src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-%E5%9B%BE%E7%89%87%E6%87%92%E5%8A%A0%E8%BD%BD.mp4\" style=\"max-width: 100%;\"></video>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"无限滚动"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"假设有一个商品展示页，因为商品太多，我们不会一次性全部请求，而是当用户向下浏览查看商品时，当到达页面底部时，请求更多的商品进行展示。一般的做法是监听 "},{"type":"formatted","text":"scroll","code":true},{"type":"formatted","text":" 事件，查询滚动条离底部的距离，当小于一定阈值时，自动的请求数据加载。现在我们可以通过 "},{"type":"formatted","text":"IntersectionObserver","code":true},{"type":"formatted","text":" 获得更好的性能。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们在商品的下面放置一个元素，当滑到底部时，该元素出现在视口中，此时加载更多的商品。"}]},{"type":"tabs","activeKey":"742a1f5b-ce77-452d-a7c1-fbb161a9ed27","tabsContent":[{"key":"a91813db-8b32-40a6-92de-2388688e126a","title":"HTML","content":[{"type":"code-block","code":"<div id=\"goods\">\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n  <div class=\"good\"></div>\n</div>\n<div id=\"footer\"></div>","language":"HTML","uuid":"7b1e5a91-3c26-4727-96cc-ae4dac9d6776","children":[{"type":"formatted","text":""}]}]},{"key":"8c8f3c4f-cb1b-4209-b87e-6fb8c51d956f","content":[{"type":"code-block","code":"#goods {\n  width: 320px;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 20px;\n  margin: 20px auto;\n}\n\n.good {\n  height: 150px;\n  background: deeppink;\n}\n\n#footer {\n  background: transparent;\n  height: 10px;\n}","language":"CSS","uuid":"177483d0-9b85-4b93-925a-fad6e08339ab","children":[{"type":"formatted","text":""}]}],"title":"CSS"},{"key":"742a1f5b-ce77-452d-a7c1-fbb161a9ed27","content":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n  entries.forEach(entry => {\n    if (entry.isIntersecting) {\n      loadMore(10);\n    }\n  });\n}, {\n  // 扩展视口的底部区域，提前加载\n  rootMargin: '0px 0px 100px 0px'\n});\n\nconst loadMore = (n) => {\n  let appendedGoods = '';\n  for (let i = 0; i < n; i++) {\n    appendedGoods += '<div class=\"good\"></div>'\n  }\n  const goods = document.getElementById('goods');\n  goods.innerHTML = goods.innerHTML + appendedGoods;\n}\n\nconst footer = document.getElementById('footer');\nobserver.observe(footer);","language":"JavaScript","uuid":"52c2e54e-1ac1-47a6-8846-05a4623f9646","children":[{"type":"formatted","text":""}]}],"title":"JavaScript"}],"children":[{"type":"code-block","code":"const observer = new IntersectionObserver(entries => {\n  entries.forEach(entry => {\n    if (entry.isIntersecting) {\n      loadMore(10);\n    }\n  });\n}, {\n  // 扩展视口的底部区域，提前加载\n  rootMargin: '0px 0px 100px 0px'\n});\n\nconst loadMore = (n) => {\n  let appendedGoods = '';\n  for (let i = 0; i < n; i++) {\n    appendedGoods += '<div class=\"good\"></div>'\n  }\n  const goods = document.getElementById('goods');\n  goods.innerHTML = goods.innerHTML + appendedGoods;\n}\n\nconst footer = document.getElementById('footer');\nobserver.observe(footer);","language":"JavaScript","uuid":"52c2e54e-1ac1-47a6-8846-05a4623f9646","children":[{"type":"formatted","text":""}]}]},{"type":"html-block","html":"<video controls=\"\" src=\"https://video-obsidian.oss-cn-beijing.aliyuncs.com/IntersectionObserver-%E6%97%A0%E9%99%90%E5%8A%A0%E8%BD%BD.mp4\" style=\"max-width: 100%;\"></video>","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"IntersectionObserver","code":true},{"type":"formatted","text":" API 是异步的，不随着目标元素的滚动同步触发。"}]}]}],"tags":[],"bannerBg":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/sheng-hu-SJ9Z6yuSIL0-unsplash_bd1ef8d7-e05d-4950-afd1-5560eb20a6ca.jpg","createTime":1664362560000,"updateTime":1743303640485},"meta":{"type":"article","publishTime":1764821905669}};
