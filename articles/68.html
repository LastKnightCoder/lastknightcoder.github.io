      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":68,"title":"HTTP 缓存","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"缓存是一种用来提高访问数据速度的技术，通过保存曾经访问过的数据或者预先加载可能用到数据，以便下次访问数据时能更快的提供，不仅可以提高数据的访问速度，还可以减少请求次数，进一步减少数据源的压力。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在网页中，对于一些静态资源在很长的一段时间都是不变的，因此可以将数据缓存下来，在下次请求数据时，直接从缓存中读取，而不必发起网络请求，以加快资源加载速度。虽然静态资源很长一段时间不变，但是当资源发生变化时，希望用户尽快能访问到新的资源，或者有的资源时刻在发生变化，不希望是有缓存，因此需要有一套机制来设置缓存策略，这套缓存策略是通过 HTTP 的一些请求头和响应头进行设置的。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"强缓存和协商缓存"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"HTTP 缓存分为两种，强缓存和协商缓存，强缓存指的是只要资源没有过期，不发起网络请求，直接使用缓存的数据，而协商缓存指的是需要和服务器协商一下，看看缓存是否有效，如果服务器说还没有过期则使用缓存中的资源，否则服务器应当下发新的资源。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"和强缓存有关的请求头/响应头有 "},{"type":"formatted","text":"Cache-Control","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"Expires","code":true},{"type":"formatted","text":"，和协商缓存的请求头/响应头有 "},{"type":"formatted","text":"If-Modified-Since/Last-Modified","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"If-None-Match/Etag","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"强缓存拥有更高的优先级","bold":true,"color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"，协商缓存是在强缓存失效时用于验证缓存的有效性的。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"Expires"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Expires","code":true},{"type":"formatted","text":" 是一个 HTTP 1.0 引入的响应头，它的值是一个日期，语法如下："}],"disableDrag":false},{"type":"code-block","code":"Expires: \u003cday-name\u003e, \u003cday\u003e \u003cmonth\u003e \u003cyear\u003e \u003chour\u003e:\u003cminute\u003e:\u003csecond\u003e GMT","language":"HTTP","uuid":"40f5093b-9154-4f44-bc3b-7c465f0b98d0","children":[{"type":"formatted","text":""}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003cday-name\u003e","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"Mon, Tue, Wed, Thu, Fri, Sat, or Sun 其中之一（大小写敏感）"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003cday\u003e","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"两个数字表示的日期，例如， \"04\"、\"23\""}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003cmonth\u003e","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec 其中之一（大小写敏感）"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003cyear\u003e","code":true}],"disableDrag":false},{"type":"paragra tted","text":" 中减去 "},{"type":"formatted","text":"Age","code":true},{"type":"formatted","text":" 就是实际的有效期。"}],"disableDrag":false},{"type":"code-block","code":"Cache-Control: max-age=100\nAge: 100","language":"HTTP","uuid":"5e24ba47-f394-4d5a-a515-3226c33dc0aa","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于请求头，"},{"type":"formatted","text":"max-age=N","code":true},{"type":"formatted","text":" 表示允许重用 "},{"type":"formatted","text":"N","code":true},{"type":"formatted","text":" 秒内服务器生成的响应。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"有的时候在请求时会设置 "},{"type":"formatted","text":"max-age=0","code":true},{"type":"formatted","text":"，比如直接输入网址请求一个 HTML 文件时，那么本地的缓存肯定是不可以直接复用的，以保证每次请求都是最新的资源。这里 "},{"type":"formatted","text":"max-age=0","code":true},{"type":"formatted","text":" 并不表示不使用缓存，而是指需要先询问服务器响应是否可复用，如何服务器发现响应未发生改变，可以返回 "},{"type":"formatted","text":"304","code":true},{"type":"formatted","text":"  状态码那么就会使用本地的缓存。"}],"disableDrag":false},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"对于 "},{"type":"formatted","text":"-1","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"233.9","code":true},{"type":"formatted","text":" 这种值，在规范中并未定义，但是建议当作 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 处理。"}],"disableDrag":false}]},{"type":"header","children":[{"type":"formatted","text":"no-cache"}],"level":3},{"type":"paragraph","children":[{"text":"在响应头中，","type":"formatted"},{"type":"formatted","text":"no-cache","code":true},{"type":"formatted","text":" 表示本地可以存储这个响应，但是在每次决定是否复用前需要询问服务器，如果希望每次都检查内容是否更新，那么就使用这个指令。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在请求头中，"},{"type":"formatted","text":"no-cache","code":true},{"type":"formatted","text":" 的含义同响应头一致，也表示在复用缓存前先与源服务器进行验证，以确保访问的是最新的资源，"},{"type":"formatted","text":"当用户强制重新加载页面时，
