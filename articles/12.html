      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":12,"title":"Node EventEmitter 使用及实现","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":" 是 Node 提供的一个事件订阅模块，本片文章将介绍具体的使用，然后实现一遍。"}]},{"type":"header","children":[{"type":"formatted","text":"EventEmitter 的使用"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":" 为我们提供了事件订阅机制，通过引入 "},{"type":"formatted","text":"events","code":true},{"type":"formatted","text":" 模块来使用它。"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\n// 监听 data 事件\neventEmitter.on(\"data\", () => {\n    console.log(\"data\");\n});\n\n// 触发 data 事件\neventEmitter.emit(\"data\");","language":"js","uuid":"f0353c79-0f7b-4eb8-b416-ed1ee6e3163e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述代码我们使用 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 方法来为事件绑定回调函数，使用 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 方法来触发一个事件。"}]},{"type":"header","children":[{"type":"formatted","text":"on、addListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以通过 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"addListener","code":true},{"type":"formatted","text":" 方法来为某事件添加一个监听器，二者的使用是一样"}]},{"type":"code-block","code":"eventEmitter.on(\"data\", () => {\n    console.log(\"data\");\n});\n\neventEmitter.addListener(\"data\", () => {\n    console.log(\"data\");\n});","language":"js","uuid":"f6e90ec0-bad1-4bbf-a3db-9c123fb2f617","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一个参数为事件名，第二个参数为对应的回调函数，当 "},{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":" 实例对象调用 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 触发相应的事件时便会调用该回调函数，如"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n    console.log(\"data\");\n});\n\neventEmitter.addListener(\"data\", () => {\n    console.log(\"data\");\n});\n\neventEmitter.emit(\"data\");","language":"js","uuid":"e0090073-8a82-4072-8046-263772578a06","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在控制台会打印出两次 "},{"type":"formatted","text":"data","code":true}]},{"type":"code-block","code":"data\ndata","language":"js","uuid":"d698a5c1-032b-4c8a-bb22-391a6dc51eab","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"从上面的例子也可以看出，可以为同一事件绑定多个回调函数。"}]}]},{"type":"header","children":[{"type":"formatted","text":"执行顺序"}],"level":4},{"type":"paragraph","children":[{"type":"formatted","text":"当使用 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"addListener","code":true},{"type":"formatted","text":" 绑定多个回调函数时，触发的顺序就是添加的顺序，如"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n    console.log(\"data 1\");\n});\n\neventEmitter.on(\"data\", () => {\n    console.log(\"data 2\");\n});\n\neventEmitter.on(\"data\", () => {\n    console.log(\"data 3\");\n});\n\neventEmitter.emit(\"data\");","language":"js","uuid":"73d81d67-5848-4e9a-8d78-0ee42410b106","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"会在控制台依次打印出"}]},{"type":"code-block","code":"data 1\ndata 2\ndata 3","language":"js","uuid":"9870e1ec-e558-4647-b59e-7308bc689637","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"重复添加"}],"level":4},{"type":"paragraph","children":[{"type":"formatted","text":"并且使用 on 方法绑定事件时，并不会做去重检查"}]},{"type":"code-block","code":"const {EventEmitter} = require('events');\nconst eventEmitter = new EventEmitter();\n\nconst listener = () => {\n    console.log(\"lsitener\");\n}\n\neventEmitter.on(\"data\", listener);\neventEmitter.on(\"data\", listener);\neventEmitter.emit(\"data\");","language":"js","uuid":"74a9b327-3324-4e3a-9cc5-9efa75e4a21a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"控制台的打印结果为"}]},{"type":"code-block","code":"lsitener\nlsitener","language":"js","uuid":"3f7af37c-cb3d-4e37-8919-cef4d877e082","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的程序为事件绑定了两次 "},{"type":"formatted","text":"listener","code":true},{"type":"formatted","text":" 这个函数，但是内部并不会检查是否已经添加过这个回调函数，然后去重，所以上面在控制台打印出了两次 "},{"type":"formatted","text":"listener","code":true},{"type":"formatted","text":"。"}]},{"type":"header","children":[{"type":"formatted","text":"传递参数"}],"level":4},{"type":"paragraph","children":[{"type":"formatted","text":"另外回调函数还可以接收参数，参数通过 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 触发事件时传入，如"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", data => {\n    console.log(data);\n});\n\n// 为回调函数传入参数 HelloWorld!\neventEmitter.emit(\"data\", \"HelloWorld!\");","language":"js","uuid":"2b4aeeac-4814-4149-bf51-d791ec16d68d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们使用 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 触发事件时，还传递了额外的参数，这个参数会被传递给回调函数。"}]},{"type":"header","children":[{"type":"formatted","text":"同步执行"}],"level":4},{"type":"paragraph","children":[{"type":"formatted","text":"另外一个比较关心的问题，事件的触发是同步的还是异步的，我们做一个实验"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n    console.log(\"触发了 data 事件！\");\n});\n\nconsole.log(\"start\");\neventEmitter.emit(\"data\");\nconsole.log(\"end\");","language":"js","uuid":"15e634a9-cd0c-432d-9908-7d9d2d35e69c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们我们在触发事件前后都向控制台打印了信息，如果触发事件后是异步执行的，那么后面的打印语句就会先执行，否则如果是同步的话，就会先执行事件绑定的回调函数。执行结果如下"}]},{"type":"code-block","code":"start\n触发了 data 事件！\nend","language":"js","uuid":"c1b039ce-ef64-4d5f-ac63-54eed063b06b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可见事件触发是同步执行的。"}]},{"type":"header","children":[{"type":"formatted","text":"off、removeListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"off","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"removeListener","code":true},{"type":"formatted","text":" 方法的作用同 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"addListener","code":true},{"type":"formatted","text":" 的作用是相反的，它们的作用是为某个事件删除对应的回调函数"}]},{"type":"code-block","code":"const {EventEmitter} = require('events');\nconst eventEmitter = new EventEmitter();\n\nlet listener1 = () => {\n    console.log(\"listener1\");\n}\nlet listener2 = () => {\n    console.log(\"listener2\");\n}\n\neventEmitter.on(\"data\", listener1);\neventEmitter.on(\"data\", listener2);\n\n// 第一次触发，两个回调函数否会执行\neventEmitter.emit(\"data\");\n\neventEmitter.off(\"data\", listener1);\n// 第二次触发，只会执行 listener2\neventEmitter.emit(\"data\");","language":"js","uuid":"5fd8bc5d-c7c3-4c45-8008-b10ddab24918","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"控制台打印结果为"}]},{"type":"code-block","code":"listener1\nlistener2\nlistener2","language":"js","uuid":"0018af6c-c14a-47ff-bdda-e28004bc8c09","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一次触发事件时，两个事件都会触发，然后我们为事件删除了 "},{"type":"formatted","text":"listener1","code":true},{"type":"formatted","text":" 这个回调函数，所以第二次触发时，只会触发 "},{"type":"formatted","text":"listener2","code":true},{"type":"formatted","text":"。"}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"注意：如果我们使用 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 或者 "},{"type":"formatted","text":"addListener","code":true},{"type":"formatted","text":" 绑定的是一个匿名函数，那么便无法通过 "},{"type":"formatted","text":"off","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"removeListener","code":true},{"type":"formatted","text":" 去解绑一个回调函数，因为它会通过比较两个函数的引用是否相同来解绑函数的。"}]}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果对同一事件绑定了两个同样的函数，那么进行取绑时是会取消两个，还是取消一个呢？"}]},{"type":"code-block","code":"const {EventEmitter} = require('events');\nconst eventEmitter = new EventEmitter();\n\nlet listener1 = () => {\n    console.log(\"listener1\");\n}\nlet listener2 = () => {\n    console.log(\"listener2\");\n}\n\n// listener1 绑定了两次\neventEmitter.on(\"data\", listener1);\neventEmitter.on(\"data\", listener1);\neventEmitter.on(\"data\", listener2);\n\neventEmitter.off(\"data\", listener1);\neventEmitter.emit(\"data\");","language":"js","uuid":"31f93584-201e-4da7-ac6f-237fa92172e4","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"listener1\nlistener2","language":"js","uuid":"398f4b2f-e02b-4453-a94d-83fca1b8f71b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"只解绑了一个。"}]}]},{"type":"header","children":[{"type":"formatted","text":"once"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 可以绑定一个只执行一次的回调函数，当触发一次之后，该回调函数便自动会被解绑"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.once(\"data\", () => {\n    console.log(\"data\");\n});\n\neventEmitter.emit(\"data\");\neventEmitter.emit(\"data\");","language":"js","uuid":"5e9105ec-997a-4d19-a483-e1fba4926020","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述代码我们使用 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件绑定了一个回调函数，然后使用 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 方法触发了两次，因为使用 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 绑定的回调函数只会被触发一次，所以第二次触发，回调函数不会执行，所以在控制台只打印了一次 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外同 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 绑定的回调函数一样，我们同样可以通过 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 方法向回调函数传递参数"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.once(\"data\", data => {\n    console.log(data);\n});\n\neventEmitter.emit(\"data\", \"Hello\");","language":"js","uuid":"9e6f2be4-53e8-4884-9b4b-0daf47627532","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"控制台打印结果"}]},{"type":"code-block","code":"Hello","language":"js","uuid":"796fb0a4-3d53-4d95-85a7-a34b498d70a4","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"prependListener、prependOnceListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 或者 "},{"type":"formatted","text":"addListener","code":true},{"type":"formatted","text":" 为事件绑定的回调函数会被根据添加的顺序执行，而使用 "},{"type":"formatted","text":"prependLsitener","code":true},{"type":"formatted","text":" 绑定的事件回调函数会在其他回调函数之前执行"}]},{"type":"code-block","code":"const {EventEmitter} = require('events');\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n    console.log(\"on\");\n});\n\neventEmitter.prependListener(\"data\", () => {\n    console.log(\"prepend\");\n});\n\neventEmitter.emit(\"data\");","language":"js","uuid":"0ad4c2c9-2d67-41ad-a3c2-2d6dd4414046","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述代打我们先用控制台的打印结果为"}]},{"type":"code-block","code":"prepend\non","language":"js","uuid":"33526230-51de-4093-83b9-a4e47fd30fd3","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"prependOnceListener","code":true},{"type":"formatted","text":" 同 "},{"type":"formatted","text":"prependListener","code":true},{"type":"formatted","text":"，不过它绑定的回调函数只会被执行一次"}]},{"type":"code-block","code":"const {EventEmitter} = require('events');\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n    console.log(\"on\");\n});\n\neventEmitter.prependOnceListener(\"data\", () => {\n    console.log(\"prepend once\");\n});\n\neventEmitter.emit(\"data\");\neventEmitter.emit(\"data\");","language":"js","uuid":"ad2509f7-3880-4e4e-892b-a3a403441816","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们使用 "},{"type":"formatted","text":"prependOnceListener","code":true},{"type":"formatted","text":" 绑定了一个回调函数，当触发事件时，该回调函数会在其他函数之前执行，并且只会执行一次，所以当第二次我们触发函数时，该回调函数不会执行，控制台打印结果为"}]},{"type":"code-block","code":"prepend once\non\non","language":"js","uuid":"dc47734a-030a-40e9-94b2-eb3d1c96bf3b","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"removeAllListeners"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"removeAllListeners([event])","code":true},{"type":"formatted","text":" 方法可以删除事件 "},{"type":"formatted","text":"event","code":true},{"type":"formatted","text":" 绑定的所有回调函数，如果没有传入 "},{"type":"formatted","text":"event","code":true},{"type":"formatted","text":" 参数的话，那么该方法就会删除所有事件绑定的回调函数"}]},{"type":"code-block","code":"const {EventEmitter} = require('events');\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n    console.log(\"data 1\");\n});\n\neventEmitter.on(\"data\", () => {\n    console.log(\"data 2\");\n});\n\neventEmitter.emit(\"data\");\neventEmitter.removeAllListeners(\"data\");\neventEmitter.emit(\"data\");","language":"js","uuid":"ee52e613-d846-4870-8d5f-a4c3a6294dd6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面程序为 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件绑定了两个回调函数，并且在调用 "},{"type":"formatted","text":"removeAllListeners","code":true},{"type":"formatted","text":" 方法之前分别触发了一次 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件，第二次触发 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件时，不会有任何的回调函数被执行，"},{"type":"formatted","text":"removeAllListeners","code":true},{"type":"formatted","text":" 删除了 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件绑定的所有回调函数。控制台的打印结果为："}]},{"type":"code-block","code":"data 1\ndata 2","language":"js","uuid":"56ea4f88-97db-4ebc-8bdb-facd4752ce88","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"eventNames"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"eventNames","code":true},{"type":"formatted","text":" 方法我们可以知道为哪些事件绑定了回调函数，它返回一个数组"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"start\", () => {\n    console.log(\"start\");\n});\neventEmitter.on(\"end\", () => {\n    console.log(\"end\");\n});\neventEmitter.on(\"error\", () => {\n    console.log(\"error\");\n});\n\nconsole.log(eventEmitter.eventNames()); // [ 'start', 'end', 'error' ]","language":"js","uuid":"28fb4c2b-c4db-406e-a4de-5b29817e5a2d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们将某事件的所有回调函数删除后，此时 "},{"type":"formatted","text":"eventNames","code":true},{"type":"formatted","text":" 便不会返回该事件了"}]},{"type":"code-block","code":"eventEmitter.removeAllListeners(\"error\");\nconsole.log(eventEmitter.eventNames()); // [ 'start', 'end' ]","language":"js","uuid":"b74fe01a-9374-425c-9024-4d38b0f67de1","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"listenerCount"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"listenerCount","code":true},{"type":"formatted","text":" 方法可以得到某个事件绑定了多少个回调函数"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.on(\"data\", () => {\n\n});\neventEmitter.on(\"data\", () => {\n\n});\n\nconsole.log(eventEmitter.listenerCount(\"data\")); // 2","language":"js","uuid":"7be7e3d7-f870-4478-b581-f90be69ddd4d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"setMaxLsiteners、getMaxListeners"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"setMaxListeners","code":true},{"type":"formatted","text":" 是用来设置最多为每个事件绑定多少个回调函数，但是实际上是可以绑定超过设置的数目的回调函数的，不过当你绑定超过指定数目的回调函数时，会在控制台给出一个警告"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\n// 设置只能为每个回调函数绑定 1 个回调函数\neventEmitter.setMaxListeners(1);\n\n// 为 data 事件绑定了三个回调函数\neventEmitter.on(\"data\", () => {\n    console.log(\"data 1\");\n});\neventEmitter.on(\"data\", () => {\n    console.log(\"data 2\");\n});\neventEmitter.on(\"data\", () => {\n    console.log(\"data 3\");\n});","language":"js","uuid":"babd7714-cf6f-4550-8f3c-2c8c8c41f9ff","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"运行上述程序，控制台打印结果为"}]},{"type":"code-block","code":"data 1\ndata 2\ndata 3\n(node:36928) MaxListenersExceededWarning: Possible EventEmitter memory leak detected. 2 data listeners added to [EventEmitter]. Use emitter.setMaxListeners() to increase limit","language":"js","uuid":"68420d90-0db9-4c76-9f5d-6e18e8639f5b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可见事件绑定的三个回调函数都可以被触发，并且在控制台打印出了一条警告信息。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"getMaxListeners","code":true},{"type":"formatted","text":" 是获得能为每个事件绑定多少个回调函数的方法，使用 "},{"type":"formatted","text":"setMaxListeners","code":true},{"type":"formatted","text":" 设置的值时多少，返回的值就是多少"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.setMaxListeners(1);\n\nconsole.log(eventEmitter.getMaxListeners()); // 1","language":"js","uuid":"4d4e5d17-4b57-4380-a06d-d1c0cfa6e794","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果没有使用 "},{"type":"formatted","text":"setMaxLsiteners","code":true},{"type":"formatted","text":" 进行设置，那么默认能够为每个事件最多绑定 10 个回调函数，可以通过 "},{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"defaultMaxListeners","code":true},{"type":"formatted","text":" 属性获得该值"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\n\nconsole.log(EventEmitter.defaultMaxListeners); // 10","language":"js","uuid":"b5f56be2-20fa-49f9-a703-0c9522393309","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"listeners、rawListeners"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"当我们使用 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 绑定一个回调函数时，不会直接为该事件绑定该函数，而是会使用一个函数包装该函数，这个包装函数称为 "},{"type":"formatted","text":"wrapper","code":true},{"type":"formatted","text":"，然后为该事件绑定 "},{"type":"formatted","text":"wrapper","code":true},{"type":"formatted","text":" 函数，在 "},{"type":"formatted","text":"wrapper","code":true},{"type":"formatted","text":" 函数内部，设定了当执行一次之后将自己解绑的逻辑。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"listeners","code":true},{"type":"formatted","text":" 返回指定事件绑定的回调函数组成的数组，而 "},{"type":"formatted","text":"rawListeners","code":true},{"type":"formatted","text":" 也是返回指定事件绑定的回调函数组成的数组，与 "},{"type":"formatted","text":"listeners","code":true},{"type":"formatted","text":" 不同的是，对于 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 绑定的回调函数返回的是 "},{"type":"formatted","text":"wrapper","code":true},{"type":"formatted","text":"，而不是原生绑定的函数。"}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.once(\"data\", () => {\n    console.log(\"once\");\n})\n\nlet fns = eventEmitter.listeners(\"data\");\n// once 绑定的函数，不是 wrapper，内部没有解绑的逻辑，所以后面触发 data 事件时还会执行 once 绑定的函数\nfns[0]()\neventEmitter.emit(\"data\");","language":"js","uuid":"e0e29ee6-4dea-4742-8692-15fc02c22ef9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"控制台打印结果为"}]},{"type":"code-block","code":"once\nonce","language":"js","uuid":"03ed74b6-64e9-4786-9514-2714fdb028ed","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面将上面的 "},{"type":"formatted","text":"listeners","code":true},{"type":"formatted","text":" 替换为 "},{"type":"formatted","text":"rawListeners","code":true}]},{"type":"code-block","code":"const {EventEmitter} = require(\"events\");\nconst eventEmitter = new EventEmitter();\n\neventEmitter.once(\"data\", () => {\n    console.log(\"once\");\n})\n\n\nlet fns = eventEmitter.rawListeners(\"data\");\n// 因为返回的是 once 绑定函数的 wrapper，其内部有执行一次后解绑的逻辑\n// 所以后面触发事件时 once 绑定的函数不会再执行\nfns[0]()\neventEmitter.emit(\"data\");","language":"js","uuid":"ada5f502-6e0e-441e-af05-f91bbed6faa8","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"控制台的打印结果为"}]},{"type":"code-block","code":"once","language":"js","uuid":"17ac7521-09a8-4945-a63b-e263599d050f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现一个 EventEmitter"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在这个小节将从零实现一个 "},{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":"，来加深对该模块的理解。首先我们需要准备一个 "},{"type":"formatted","text":"listeners","code":true},{"type":"formatted","text":" 来存储所有绑定的回调函数，它是一个 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":" 对象，键是事件名，而值是一个数组，数组中保存的是该事件绑定的回调函数。"}]},{"type":"code-block","code":"class EventEmitter {\n    constructor() {\n        this.listeners = new Map();\n    }\n}","language":"js","uuid":"99a841a7-084e-4b3c-ac94-c0cbbb9151a8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"on、addListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 绑定回调函数时，我们先判断 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":" 集合中是否有为该事件绑定回调函数，如果有取出对应数组，并添加该回调函数进数组，没有则新建一个数组，添加该回调函数，并添加进 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":" 集合"}]},{"type":"code-block","code":"on(event, callback) {\n    if(!this.listeners.has(event)) {\n        this.listeners.set(event, []);\n    }\n    let fns = this.listeners.get(event);\n    fns.push(callback);\n}","language":"js","uuid":"27527402-6371-460d-81b2-41e003de3607","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"addListener","code":true},{"type":"formatted","text":" 的功能与 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 是一样的，我们直接调用 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 方法即可"}]},{"type":"code-block","code":"addListener(event, callback) {\n    this.on(event, callback);\n}","language":"js","uuid":"1925cae7-a92a-470b-a9c3-399c85de63cb","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"emit"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"当我们使用 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 触发事件时，我们从 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":" 取出对应的回调函数组成的数组，然后依次取出函数执行。另外我们还可以通过 "},{"type":"formatted","text":"emit","code":true},{"type":"formatted","text":" 传递参数"}]},{"type":"code-block","code":"emit(event, ...args) {\n    if(!this.listeners.has(event)) {\n        return;\n    }\n    let fns = this.listeners.get(event);\n    let values = [];\n    for(let fn of fns) {\n        values.push(fn);\n    }\n    for (let fn of values) {\n        fn(...args);\n    }\n}","language":"js","uuid":"4f7567b8-13d3-4c83-ac83-d7223e9ab0ac","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"这里你可能会觉得我写的有点复杂，所以你会觉得直接这么写更好"}]},{"type":"code-block","code":"emit(event, ...args) {\n    if(!this.listeners.has(event)) {\n        return;\n    }\n    for (let fn of fns) {\n        fn(...args);\n    }\n}","language":"js","uuid":"481bdfb3-9e4c-476e-ad1b-d9b1970d0942","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"一开始我也是这么写的，但是因为 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 绑定的函数它在执行完毕后将自己从数组中移除，并且是同步的，所以在执行循环的时候，数组是在不断变化的，使用上述的方式会使得一些回调函数会被漏掉，所以我才会先将数组中的函数复制到另一个数组，然后遍历这个新的数组，因为 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 绑定的函数它只会删除原数组中的函数，而不会删除新的这个数组，所以新数组的长度在遍历的过程不会改变，也就不会发生漏掉函数未执行的情况。"}]}]},{"type":"header","children":[{"type":"formatted","text":"prependListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"实现 "},{"type":"formatted","text":"prependListener","code":true},{"type":"formatted","text":" 的逻辑同 "},{"type":"formatted","text":"on","code":true},{"type":"formatted","text":" 一样，不过我们是往数组的最前方添加回调函数"}]},{"type":"code-block","code":"prependListener(event, callback) {\n    if(!this.listeners.has(event)) {\n        this.listeners.set(event, []);\n    }\n    let fns = this.listeners.get(event);\n    fns.unshift(callback);\n}","language":"js","uuid":"f70aa569-7db0-42ae-933d-e44ed4f67b28","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"off、removeListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"off","code":true},{"type":"formatted","text":" 方法是用来解绑事件的，在数组中找到指定的函数，然后删除即可"}]},{"type":"code-block","code":"off(event, callback) {\n    if(!this.listeners.has(event)) {\n        return;\n    }\n    let fns = this.listeners.get(event);\n    // 找出数组中的回调函数，然后删除\n    for (let i = 0; i < fns.length; i++) {\n        if(fns[i] === callback) {\n            fns.splice(i, 1);\n            break;\n        }\n    }\n    // 如果删除回调函数后，数组为空，则删除该事件\n    if (fns.length === 0) {\n        this.listeners.delete(event);\n    }\n}","language":"js","uuid":"8b938fe5-da72-4e20-aca2-fd6fc624a2bd","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"removeListener","code":true},{"type":"formatted","text":" 同 "},{"type":"formatted","text":"off","code":true},{"type":"formatted","text":" 的作用一样，我们在内部直接调用 "},{"type":"formatted","text":"off","code":true},{"type":"formatted","text":" 方法即可"}]},{"type":"code-block","code":"removeListener(event, callback) {\n    this.off(event, callback);\n}","language":"js","uuid":"da6868c9-0035-43e5-9442-1c9ceaf5db51","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"once、prependOnceListener"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 绑定一个只执行一次的函数，所以我们需要将绑定的回调函数使用一个函数包装一下，然后添加进数组中，这个包装函数我们称之为 "},{"type":"formatted","text":"wrapper","code":true},{"type":"formatted","text":"。在包装函数中，当执行一遍后会将自己从数组中删除"}]},{"type":"code-block","code":"once(event, callback) {\n    let wrapper = (...args) => {\n        callback(...args);\n        this.off(event, wrapper);\n    }\n    wrapper.once = callback;\n    this.on(event, wrapper);\n}","language":"js","uuid":"a3b587c3-bdb7-4fa9-bc75-eea14d31565f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"prependOnceListener","code":true},{"type":"formatted","text":" 的实现同 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":"，只是向数组的开头插入函数，将上面代码中的 "},{"type":"formatted","text":"push","code":true},{"type":"formatted","text":" 换为 "},{"type":"formatted","text":"unshift","code":true},{"type":"formatted","text":" 即可"}]},{"type":"code-block","code":"prependOnceListener(event, callback) {\n    let wrapper = (...args) => {\n        callback(...args);\n        this.off(event, wrapper);\n    }\n    wrapper.once = callback;\n    this.prependListener(event, wrapper);\n}","language":"js","uuid":"b0d8ab45-7cb2-443f-b21c-be1bd90c7339","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为直接绑定的不是传入 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 的函数，而是包装了一层的 "},{"type":"formatted","text":"wrapper","code":true},{"type":"formatted","text":"，如果通过传入 "},{"type":"formatted","text":"once","code":true},{"type":"formatted","text":" 的函数去进行取绑，现有的逻辑需要修改"}]},{"type":"code-block","code":"off(event, callback) {\n    if(!this.listeners.has(event)) {\n        return;\n    }\n    let fns = this.listeners.get(event);\n    // 找出数组中的回调函数，然后删除\n    for (let i = 0; i < fns.length; i++) {\n      \t// 此处修改，可正常解绑 once 对应的函数\n        if(fns[i] === callback || fns[i] === callback.once) {\n            fns.splice(i, 1);\n            break;\n        }\n    }\n    // 如果删除回调函数后，数组为空，则删除该事件\n    if (fns.length === 0) {\n        this.listeners.delete(event);\n    }\n}","language":"js","uuid":"0cfb19c9-6498-4a10-a2b8-841513c25355","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"removeAllListeners"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"直接从删除对应的事件，如果没有传入具体事件的话，则需要删除所有的事件"}]},{"type":"code-block","code":"removeAllListeners(event) {\n    // 如果没有传入 event，则删除所有事件\n    if (event === undefined) {\n        this.listeners = new Map();\n        return;\n    }\n    this.listeners.delete(event);\n}","language":"js","uuid":"b895e074-7d75-4da9-b3dd-ee5bdc955aa4","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"eventNames"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"获得已经绑定了哪些事件"}]},{"type":"code-block","code":"eventNames() {\n    return [...this.listeners.keys()];\n}","language":"js","uuid":"5f129f05-ae96-42a1-88c9-86f870708815","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"listenerCount"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"获得某事件绑定可多少个回调函数"}]},{"type":"code-block","code":"listenerCount(event) {\n    return this.listeners.get(event).length;\n}","language":"js","uuid":"08e37b6a-783f-4b9b-b766-ae68c652c8dd","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"全部代码如下"}]},{"type":"code-block","code":"class EventEmitter {\n    constructor() {\n        this.listeners = new Map();\n        this.onceToWrapper = new Map();\n    }\n\n    on(event, callback) {\n        if(!this.listeners.has(event)) {\n            this.listeners.set(event, []);\n        }\n        let fns = this.listeners.get(event);\n        fns.push(callback);\n    }\n\n    addListener(event, callback) {\n        this.on(event, callback);\n    }\n\n    emit(event, ...args) {\n        if(!this.listeners.has(event)) {\n            return;\n        }\n        let fns = this.listeners.get(event);\n        let values = [];\n        for(let fn of fns) {\n            values.push(fn);\n        }\n        for (let fn of values) {\n            fn(...args);\n        }\n    }\n\n    prependListener(event, callback) {\n        if(!this.listeners.has(event)) {\n            this.listeners.set(event, []);\n        }\n        let fns = this.listeners.get(event);\n        fns.unshift(callback);\n        \n    }\n\n    off(event, callback) {\n        if(!this.listeners.has(event)) {\n            return;\n        }\n        let fns = this.listeners.get(event);\n        // 找出数组中的回调函数，然后删除\n        for (let i = 0; i < fns.length; i++) {\n            if(fns[i] === callback || fns[i] === callback.once) {\n                fns.splice(i, 1);\n                break;\n            }\n        }\n        // 如果删除回调函数后，数组为空，则删除该事件\n        if (fns.length === 0) {\n            this.listeners.delete(event);\n        }\n    }\n\n    removeListener(event, callback) {\n        this.off(event, callback);\n    }\n\n    once(event, callback) {\n        let wrapper = (...args) => {\n            callback(...args);\n            this.off(event, wrapper);\n        }\n        wrapper.once = callback;\n        this.on(event, wrapper);\n    }\n\n    prependOnceListener(event, callback) {\n        let wrapper = (...args) => {\n            callback(...args);\n            this.off(event, wrapper);\n        }\n        wrapper.once = callback;\n        this.prependListener(event, wrapper);\n    }\n\n    removeAllListeners(event) {\n        if (event === undefined) {\n            this.listeners = new Map();\n            return;\n        }\n        this.listeners.delete(event);\n    }\n\n    eventNames() {\n        return [...this.listeners.keys()];\n    }\n\n    listenerCount(event) {\n        return this.listeners.get(event).length;\n    }\n}","language":"js","uuid":"74cccd7a-17ff-45dc-824f-32f8b2c60fa3","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考文献"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://www.freecodecamp.org/news/how-to-code-your-own-event-emitter-in-node-js-a-step-by-step-guide-e13b7e7908e1/","openEdit":false,"children":[{"type":"formatted","text":"How to code your own event emitter in Node.js: a step-by-step guide"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://nodejs.org/api/events.html","openEdit":false,"children":[{"type":"formatted","text":"Nodejs|Events"}]},{"text":"","type":"formatted"}]}]}]}],"tags":["Node","EventEmitter"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-7pl6q3_9a2bc2d5-1fa2-4b43-9395-101aab409849.jpg","createTime":1615515302000,"updateTime":1743303640463},"meta":{"type":"article","publishTime":1764822964999}};
