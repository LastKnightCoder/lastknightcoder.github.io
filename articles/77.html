,"href":"/docs/document/14/614.html","title":"Typst"},"document-item:616":{"contentType":"document-item","refId":616,"href":"/docs/document/14/616.html","title":"Tikz"},"document-item:615":{"contentType":"document-item","refId":615,"href":"/docs/document/14/615.html","title":"PlantUML"},"document-item:655":{"contentType":"document-item","refId":655,"href":"/docs/document/14/655.html","title":"Mermaid"},"document-item:620":{"contentType":"document-item","refId":620,"href":"/docs/document/14/620.html","title":"卡片"},"document-item:628":{"contentType":"document-item","refId":628,"href":"/docs/document/14/628.html","title":"微信读书"},"document-item:617":{"contentType":"document-item","refId":617,"href":"/docs/document/14/617.html","title":"Column"},"document-item:641":{"contentType":"document-item","refId":641,"href":"/docs/document/14/641.html","title":"AI 搜索"},"document-item:638":{"contentType":"document-item","refId":638,"href":"/docs/document/14/638.html","title":"同步"},"document-item:648":{"contentType":"document-item","refId":648,"href":"/docs/document/14/648.html","title":"资源存储"},"document-item:635":{"contentType":"document-item","refId":635,"href":"/docs/document/14/635.html","title":"SKILL 管理"}},"content":{"id":77,"title":"Web Locks API","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"当用户同时打开多个标签页，或者页面与 Service Worker 并行运行时，它们很可能同时读写同一份共享资源，比如 "},{"type":"formatted","text":"IndexedDB","code":true},{"type":"formatted","text":" 中的数据、通过 "},{"type":"formatted","text":"BroadcastChannel","code":true},{"type":"formatted","text":" 传递的状态，甚至是一次只允许发起一个的网络请求。如果缺少协调机制，竞态条件几乎不可避免，轻则数据不一致，重则操作被覆盖丢失。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在传统多线程编程中，「锁」正是解决这类问题的经典手段：访问共享资源之前先获取锁，拿到锁的一方独占访问权，其他竞争者排队等待，访问结束后释放锁，排队者依次获得机会。Web Locks API 将这一思路带到了浏览器环境，为标签页与 "},{"type":"formatted","text":"Worker","code":true},{"type":"formatted","text":" 之间的资源协调提供了一套原生的锁机制。不过这里的「之间」有一个隐含前提，它们必须"},{"type":"formatted","text":"同源","bold":true},{"type":"formatted","text":"。浏览器的同源策略要求协议、域名、端口三者完全一致才算同源，"},{"type":"formatted","text":"localStorage","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"IndexedDB","code":true},{"type":"formatted","text":" 等存储都遵循这一规则，Web Locks 也不例外：同源的所有标签页和 "},{"type":"formatted","text":"Worker","code":true},{"type":"formatted","text":" 共享一个锁空间，不同源之间的锁互不可见。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_03a84e74-b6bd-4e3b-8f27-13d819e041a7.webp","uuid":"934410ea-e725-4033-bcdc-b8bade84b492","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_03a84e74-b6bd-4e3b-8f27-13d819e041a7.webp","width":599.818115234375},{"type":"header","level":2,"children":[{"type":"formatted","text":"基本概念"}]},{"type":"paragraph","children":[{"type":"formatted","text":"请求锁的语法如下："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"navigator.locks.request(lockName [,options], callback)","uuid":"887d4caf-a098-42bb-a3fc-555db589563a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过"},{"type":"formatted","code":true,"text":" request"},{"type":"formatted","text":" 来请求一个锁，接收三个参数："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"锁名称，在同一锁空间下，通过相同锁名称请求锁时，只有一个请求能获取到锁，其它的请求会进入到请求队列，等到这个锁被释放时，从请求队列选择一个请求让其获取到锁。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"一个典型的请求锁的生命周期如下："}],"disableDrag":false},{"type":"code-block","language":"Markdown","code":"请求锁 → [等待队列] → 获得锁 → 执行回调 → 回调结束 → 释放锁","uuid":"04f8dfbe-734a-421d-859c-8214890b32cd","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"一个可选的配置项，可以对锁进行更高级的设置"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"回调函数，当请求获取到锁时，该回调函数将会被执行。回调函数接收一个 "},{"type":"formatted","text":"Lock","code":true},{"type":"formatted","text":" 对象作为参数，包含以下属性："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"name","code":true},{"type":"formatted","text":"：锁的名称，即请求时传入的 "},{"type":"formatted","text":"lockName","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"mode","code":true},{"type":"formatted","text":"：锁的模式，值为 "},{"type":"formatted","text":"\"exclusive\"","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"\"shared\"","code":true},{"type":"formatted","text":"，见下文「锁模式章节」"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个回调函数可以是异步的，当这个函数返回的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" "},{"type":"formatted","text":"resolved","code":true},{"type":"formatted","text":" 或者 "},{"type":"formatted","text":"rejected","code":true},{"type":"formatted","text":" 的时候，获取的锁会被自动释放"}],"disableDrag":false},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当持有锁的上下文被销毁，比如标签页关闭，Worker 终止的时候，锁也会被自动释放。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"这一点在 Service Worker（以下简称 SW）中尤其值得注意。浏览器会在 SW 空闲后自动终止它以节省资源，这意味着 SW 持有的锁可能因上下文被销毁而意外释放，导致其他标签页提前获取到锁。如果你的协调逻辑依赖 SW 长时间持有某把锁，就需要格外小心这种时序问题。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"反过来，这个特性也催生了一种「保活」技巧：在 SW 内部发起一个 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 锁请求，回调中返回一个永远不 resolve 的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":"，浏览器会认为 SW 仍有活跃的异步任务而推迟终止。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// service-worker.js\n// 利用 Web Locks 保持 Service Worker 存活\nasync function keepAlive() {\n  await navigator.locks.request('sw-keep-alive', () =\u003e {\n    // 返回一个永远不 resolve 的 Promise，阻止锁释放\n    return new Promise(() =\u003e {})\n  })\n}\n\nself.addEventListener('activate', (event) =\u003e {\n  event.waitUntil(keepAlive())\n})","uuid":"2ed517ad-fe9f-4e63-ad66-6c731b4e38b4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这种保活方式会持续占用浏览器资源，应仅在确实需要 SW 长期运行的场景下使用（如维持 WebSocket 连接、后台定时同步等），滥用会影响设备性能和电量。"}],"disableDrag":false}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 函数本身也返回一个 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":"，其结果与 "},{"type":"formatted","text":"callback","code":true},{"type":"formatted","text":" 的执行结果绑定："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"正常返回：若 ​"},{"type":"formatted","text":"callback","code":true},{"type":"formatted","text":" 正常执行并返回一个值（无论同步值还是异步 "},{"type":"formatted","text":"resolve","code":true},{"type":"formatted","text":" 的值），"},{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 会以该值 "},{"type":"formatted","text":"resolve","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 同步返回值\nconst result = await navigator.locks.request('resource', () =\u003e {\n  return 'success';\n});\nconsole.log(result); // 'success'\n\n// 异步 resolve（回调返回 Promise）\nconst num = await navigator.locks.request('resource', async () =\u003e {\n  await doSomething();\n  return 42;\n});\nconsole.log(num); // 42","uuid":"bb1a86ff-9126-4160-995f-e38da947f1b5","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"异常抛出：若 ​"},{"type":"formatted","text":"callback","code":true},{"type":"formatted","text":" 同步抛出异常，或返回的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 被 "},{"type":"formatted","text":"reject","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 会以同样的错误 "},{"type":"formatted","text":"reject","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 同步抛出异常\nawait navigator.locks.request('resource', () =\u003e {\n  throw new Error('出错了');\n}); // Promise 以 Error('出错了') reject\n\n// 异步 reject（回调内调用的异步操作失败）\nawait navigator.locks.request('resource', async () =\u003e {\n  const response = await fetch('/api/data');\n  if (!response.ok) {\n    throw new Error('请求失败');  // async 函数中抛出等价于 reject\n  }\n  return response.json();\n}); // fetch 失败时，request 的 Promise 会以同样的错误 reject","uuid":"56d9b62c-66ba-41e7-a3f6-543b39b4cd5e","children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过一个简单的场景看看该 API 的具体使用，多个 worker 访问同一变量，并且对其计数，然后写回，首先看下无锁的场景："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"const sleep = (ms) =\u003e {\n  return new Promise(resolve =\u003e {\n    setTimeout(resolve, ms)  \n  })  \n}\n\nlet counter = 0\n\nconst readCounter = async () =\u003e {\n  await sleep(Math.random() * 10)\n  return counter  \n}\n\nconst writeCounter = async (value) =\u003e {\n  await sleep(Math.random() * 10)\n  counter = value\n}\n\nconst workers = Array.from({ length: 10 })\n\nawait Promise.all(workers.map(async () =\u003e {\n  const value = await readCounter()\n  await writeCounter(value + 1) // 可能覆盖了别人写入的值\n}))\n\nconsole.log('counter', counter) // 可能是 1-10 之间的任何一个数","uuid":"ee366d6b-0d99-4edc-8bc8-bf1b31d0b68f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述代码同时发起了 "},{"type":"formatted","text":"10","code":true},{"type":"formatted","text":" 个任务，每个任务读取 "},{"type":"formatted","text":"counter","code":true},{"type":"formatted","text":" 并将其加一后写回。我们预期最后的结果是 "},{"type":"formatted","text":"10","code":true},{"type":"formatted","text":"，但实际结果可能是 "},{"type":"formatted","text":"1-10","code":true},{"type":"formatted","text":" 之间的任何一个数。因为读和写都是异步操作，读取然后写入并非原子操作，写入时会覆盖别人已经写入的值。可以认为最后一个写入的值就是最终值，而这个值取决于它读取时拿到的值。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"为了保证对公共资源的有序访问，我们可以使用锁来进行访问控制。因为同一时刻只有一个请求能获取到锁，因此它们获取到的是最新值，写入时也不会覆盖其他 worker 已写入的值。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"await Promise.all(workers.map(async () =\u003e {\n  await navigator.locks.request('counter', async () =\u003e {\n    const value = await readCounter()\n    await writeCounter(value + 1)\n  })\n}))\n\nconsole.log('counter', counter) // 10","uuid":"0f9e5597-49c0-41c9-a5b3-3cf41ec10d77","children":[{"type":"formatted","text":""}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"配置项"}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的示例只用到了 "},{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 最基本的用法，实际上第二个参数 "},{"type":"formatted","text":"options","code":true},{"type":"formatted","text":" 提供了不少实用的配置项，可以对锁的行为做更精细的控制。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"锁模式"}]},{"type":"paragraph","children":[{"type":"formatted","text":"锁有两种模式，独占锁和共享锁，通过 "},{"type":"formatted","text":"mode","code":true},{"type":"formatted","text":" 选项来配置锁的模式："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":"：独占锁，在同一时刻只能有一个请求能持有这把锁，当一个 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 的请求持有锁时，其它任意模式的请求都会被阻塞。"}],"disableDrag":false},{"type":"highlight-block","color":"green","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当不指定 "},{"type":"formatted","text":"mode","code":true},{"type":"formatted","text":" 选项的值时，默认的请求模式是独占锁。"}],"disableDrag":false}]},{"type":"code-block","language":"JavaScript","code":"navigator.locks.request('my-resource', { mode: 'exclusive' }, async () =\u003e {\n  console.log('写者 A 开始');\n  await sleep(1000);\n  console.log('写者 A 结束');\n});\n\nnavigator.locks.request('my-resource', { mode: 'exclusive' }, async () =\u003e {\n  console.log('写者 B 开始'); // 等待写者 A 释放锁后才能运行\n  await sleep(1000);\n  console.log('写者 B 结束');\n});","uuid":"842230bd-f047-4d05-89bf-d51a4d3a8790","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":"：共享锁，在同一时刻，允许有多个 "},{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":" 请求同时持有同一个锁，互不阻塞。当已有 "},{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":" 请求持有锁时，后续到达的 "},{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":" 请求同样可以获取到锁。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 这两个调用会同时运行，互不等待\nnavigator.locks.request('my-resource', { mode: 'shared' }, async () =\u003e {\n  console.log('读者 A 开始');\n  await sleep(1000);\n  console.log('读者 A 结束');\n});\n\nnavigator.locks.request('my-resource', { mode: 'shared' }, async () =\u003e {\n  console.log('读者 B 开始'); // 和读者 A 同时打印\n  await sleep(1000);\n  console.log('读者 B 结束');\n});","uuid":"d2f9c24c-c85c-4faa-9f1f-b274100cc2d1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果此时有 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 的请求尝试获取锁，那么这个请求会被阻塞，如果在此 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 的请求后有 "},{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":" 的请求到达，也会被 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 阻塞掉无法获取到锁。"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"基于以上，我们可以创建一个读写锁模式，当读取资源时我们使用 "},{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":" 模式请求锁，当写入资源时，我们使用 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 模式来请求锁："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"class ReadWriteLock {\n  constructor(resourceName) {\n    this.resourceName = resourceName\n  }\n\n  // 获取读锁（共享锁）\n  async read(callback) {\n    return navigator.locks.request(\n      this.resourceName,\n      { mode: 'shared' },\n      callback\n    )\n  }\n\n  // 获取写锁（独占锁）\n  async write(callback) {\n    return navigator.locks.request(\n      this.resourceName,\n      { mode: 'exclusive' },\n      callback\n    )\n  }\n}","uuid":"4d91234d-4423-4a57-bbbb-f066846c2d8e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面是使用示例："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"const rwLock = new ReadWriteLock('counter')\n\n// 多个读者可以同时读取\nconst readers = Array.from({ length: 5 }, (_, i) =\u003e i + 1)\nawait Promise.all(readers.map(async (id) =\u003e {\n  await rwLock.read(async () =\u003e {\n    console.log(`读者 ${id} 开始读取`)\n    const value = await readCounter()\n    console.log(`读者 ${id} 读取到值: ${value}`)\n    await sleep(100)\n    console.log(`读者 ${id} 读取结束`)\n  })\n}))\n\n// 写者需要独占访问\nconst writers = Array.from({ length: 3 }, (_, i) =\u003e i + 1)\nawait Promise.all(writers.map(async (id) =\u003e {\n  await rwLock.write(async () =\u003e {\n    console.log(`写者 ${id} 开始写入`)\n    const value = await readCounter()\n    await writeCounter(value + 1)\n    console.log(`写者 ${id} 写入完成，新值: ${value + 1}`)\n  })\n}))\n\n// 混合读写场景\nawait Promise.all([\n  // 读者 A 和 B 可以同时读取\n  rwLock.read(async () =\u003e {\n    console.log('读者 A 读取:', await readCounter())\n    await sleep(50)\n  }),\n  rwLock.read(async () =\u003e {\n    console.log('读者 B 读取:', await readCounter())\n    await sleep(50)\n  }),\n  \n  // 写者 C 需要等待所有读者完成后才能写入\n  rwLock.write(async () =\u003e {\n    const value = await readCounter()\n    await writeCounter(value + 10)\n    console.log('写者 C 写入:', value + 10)\n  }),\n  \n  // 读者 D 需要等待写者 C 完成后才能读取\n  rwLock.read(async () =\u003e {\n    console.log('读者 D 读取:', await readCounter())\n  }),\n])","uuid":"b574363a-5b9b-499e-9014-3833b4275fc9","children":[{"type":"formatted","text":""}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"非阻塞尝试"}]},{"type":"paragraph","children":[{"type":"formatted","text":"默认情况下，请求锁时如果锁不可用，请求会进入等待队列直到获取到锁。但有时候我们并不想等待，而是希望「试一试，拿不到就算了」。"},{"type":"formatted","text":"ifAvailable","code":true},{"type":"formatted","text":" 属性就是用来控制这一行为的，它是一个布尔值："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"true","code":true},{"type":"formatted","text":"：没有获取到锁就直接返回，此时执行的回调函数中，传递的锁对象 "},{"type":"formatted","text":"lock","code":true},{"type":"formatted","text":" 就是 "},{"type":"formatted","text":"null","code":true},{"type":"formatted","text":"，表示没有获取到锁"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"：默认值，没获取到锁就进入请求队列，等待锁被释放"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"有一些场景适合使用非阻塞的尝试："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"信息同步"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"假如你在后台每隔 30s 进行一次信息同步，如果上一次 30s 内没同步完，那么就放弃这次同步，这种情况就可以尝试以非阻塞的形式请求锁，如果没有请求到锁，就说明上一次的同步任务没有执行完成，锁没有释放，这个时候这次直接放弃同步就好了"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"setInterval(() =\u003e {\n  navigator.locks.request('background-sync', { ifAvailable: true }, async (lock) =\u003e {\n    if (lock === null) {\n      // 上一次任务没有执行完成，直接返回\n      return  \n    }\n    // 获取到锁，执行同步任务\n    await syncToServer()\n  })\n}, 30_000)","uuid":"649483ff-cd89-49cd-b964-600a224d54a2","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Leader 选举与广播同步"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"ifAvailable: true","code":true},{"type":"formatted","text":" 天然适合用来做轻量级的 Leader 选举：当多个标签页或 Worker 同时需要获取一份远程数据时，只有一个实例能抢到锁成为 Leader，由它负责去服务器拉取数据并更新缓存；其余拿不到锁的 Follower 通过 "},{"type":"formatted","text":"BroadcastChannel","code":true},{"type":"formatted","text":" 等待 Leader 的更新通知，从而拿到同一份最新数据。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5adb475c-7e37-4dfc-9a1f-5cb9dce40cb0.webp","alt":"","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5adb475c-7e37-4dfc-9a1f-5cb9dce40cb0.webp","width":720},{"type":"code-block","language":"JavaScript","code":"// 跨 Tab 广播通道\nconst bc = new BroadcastChannel('data_sync');\n\nasync function getData() {\n  return navigator.locks.request('data_sync', { ifAvailable: true }, async (lock) =\u003e {\n    if (!lock) {\n      // 未抢到锁，当前有 Leader 在更新，等待广播\n      return waitForLeaderBroadcast();\n    }\n\n    // 成为 Leader，负责回源\n    try {\n      const freshData = await fetchFromServer();\n      await updateCache(freshData);\n\n      // 广播给所有 Follower\n      bc.postMessage({ type: 'sync', data: freshData });\n      return freshData;\n    } catch (err) {\n      // 回源失败，广播错误让 Follower 各自兜底\n      bc.postMessage({ type: 'error', error: err.message });\n      throw err;\n    }\n  });\n}\n\n// Follower 等待 Leader 广播，超时后回退到本地缓存\nfunction waitForLeaderBroadcast(timeout = 5000) {\n  return new Promise((resolve, reject) =\u003e {\n    const timer = setTimeout(() =\u003e {\n      bc.removeEventListener('message', handler);\n      getCachedData().then(resolve).catch(reject);\n    }, timeout);\n\n    const handler = (event) =\u003e {\n      if (event.data.type === 'sync') {\n        clearTimeout(timer);\n        bc.removeEventListener('message', handler);\n        resolve(event.data.data);\n      }\n      if (event.data.type === 'error') {\n        clearTimeout(timer);\n        bc.removeEventListener('message', handler);\n        getCachedData().then(resolve).catch(reject);\n      }\n    }\n\n    bc.addEventListener('message', handler);\n  });\n}","uuid":"22597daf-89c5-4a37-a2b9-afc21710c557","children":[{"type":"formatted","text":""}]}]}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"强制抢占"}]},{"type":"paragraph","children":[{"type":"formatted","text":"ifAvailable ","code":true},{"type":"formatted","text":"拿不到锁会优雅地放弃，但有些极端场景下我们需要更激进的手段。通过配置"},{"type":"formatted","text":" steal: true","code":true},{"type":"formatted","text":" 可以强制抢占锁，它会产生以下行为："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"该请求立刻获得锁，不管是否有人持有锁"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果当前有请求正在持有锁，原持有者的回调并不会被打断，它会继续执行到结束，但锁已经被转移给了抢占者。这意味着原持有者和抢占者的回调实际上在并行操作同一资源，「失去锁的保护」指的正是这种并行带来的数据不一致风险"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果存在请求在队列中等待锁分配，这些请求全部会被终止并从队列中清除，它们会收到一个 "},{"type":"formatted","text":"AbortError","code":true}],"disableDrag":false}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7fc88862-ccd9-45a7-9aa6-c52ee4f6fdf8.webp","alt":"","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7fc88862-ccd9-45a7-9aa6-c52ee4f6fdf8.webp","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"steal","code":true},{"type":"formatted","text":" 的破坏性很大，不到迫不得已的时候不要使用，以下是一些可能会使用的场景"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"页面卸载前需要进行一些清理工作"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"window.addEventListener('beforeunload', async (event) =\u003e {\n  // 强制抢占锁以执行清理工作\n  await navigator.locks.request(\n    'database-connection',\n    { steal: true },\n    async () =\u003e {\n      // 关闭数据库连接\n      await closeDatabaseConnection()\n      // 保存未持久化的数据\n      await flushPendingWrites()\n      console.log('清理工作完成，页面可以安全卸载')\n    }\n  )\n})","uuid":"a4e5676e-be9b-4e94-bf85-7e4ef3510719","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"检测到僵尸进程，页面卡死导致锁无法被释放"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 定期检测某个锁是否被长时间占用\nasync function detectAndRecoverZombieLock(lockName, timeoutMs = 30_000) {\n  const startTime = Date.now()\n\n  try {\n    // 尝试非阻塞方式获取锁，检查状态\n    await navigator.locks.request(lockName, { ifAvailable: true }, async (lock) =\u003e {\n      if (lock) {\n        // 锁是空闲的，说明没有僵尸进程\n        return\n      }\n\n      // 锁被占用，开始轮询等待\n      while (Date.now() - startTime \u003c timeoutMs) {\n        await sleep(1000)\n\n        // 再次尝试获取锁\n        const acquired = await navigator.locks.request(\n          lockName,\n          { ifAvailable: true },\n          async (l) =\u003e !!l\n        )\n\n        if (acquired) {\n          console.log('锁已正常释放，无需强制抢占')\n          return\n        }\n      }\n\n      // 超过超时时间仍未释放，强制抢占\n      console.warn('检测到僵尸锁，执行强制抢占')\n      await navigator.locks.request(lockName, { steal: true }, async () =\u003e {\n        // 重置资源状态，清理不一致的数据\n        await resetResourceState()\n        console.log('资源状态已重置，锁已被强制释放')\n      })\n    })\n  } catch (error) {\n    console.error('锁恢复失败:', error)\n  }\n}","uuid":"315eb35d-f480-4e30-b12d-e438d3283fde","children":[{"type":"formatted","text":""}]}]}]},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"steal","code":true},{"type":"formatted","text":"​与 ​"},{"type":"formatted","text":"ifAvailable","code":true},{"type":"formatted","text":"​ ​不能同时使用，会抛出 "},{"type":"formatted","text":"NotSupportedError","code":true}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"try {\n  // 以下调用会直接抛出 NotSupportedError\n  await navigator.locks.request('my-resource', {\n    steal: true,\n    ifAvailable: true\n  }, async () =\u003e {\n    console.log('这段代码不会执行')\n  })\n} catch (error) {\n  // NotSupportedError\n  console.error(error.name) \n  // Failed to execute 'request' on 'LockManager': The 'steal' and 'ifAvailable' options cannot be used together.\n  console.error(error.message)\n}","uuid":"f943aa3f-e052-4b17-8f19-172b48198ca8","children":[{"type":"formatted","text":""}]}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"超时与取消"}]},{"type":"paragraph","children":[{"type":"formatted","text":"无论是阻塞等待还是非阻塞尝试，前面的方案都缺少一个能力：在等待过程中主动放弃。配置项中的 "},{"type":"formatted","text":"signal","code":true},{"type":"formatted","text":" 参数填补了这一空白，它的值是一个 "},{"type":"formatted","text":"AbortSignal","code":true},{"type":"formatted","text":"，允许在请求还在队列中等待锁的时候取消这次请求。被取消的请求会从等待队列中移除，"},{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 返回的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 会以 "},{"type":"formatted","text":"AbortError","code":true},{"type":"formatted","text":" 拒绝。"}],"disableDrag":false},{"type":"highlight-block","color":"blue","children":[{"type":"paragraph","children":[{"type":"formatted","text":"signal","code":true},{"type":"formatted","text":" 只能取消正在等待的请求。如果回调已经开始执行（即锁已经被获取），"},{"type":"formatted","text":"signal","code":true},{"type":"formatted","text":" 的中止不会打断回调，锁仍然会在回调结束后正常释放。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"基本用法如下："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"const controller = new AbortController()\n\nnavigator.locks.request('my-resource', { signal: controller.signal }, async () =\u003e {\n  // 获取到锁后执行的操作\n  await doWork()\n}).catch(error =\u003e {\n  if (error.name === 'AbortError') {\n    console.log('请求在等待锁时被取消')\n  }\n})\n\n// 在其他地方取消这次请求\ncontroller.abort()","uuid":"6545487e-4576-4b8f-8bac-5981bdee7efe","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"结合 "},{"type":"formatted","text":"AbortSignal.timeout()","code":true},{"type":"formatted","text":" 可以很方便地实现超时控制，避免请求在队列中无限等待："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 如果 2 秒内没有获取到锁，自动取消请求\nnavigator.locks.request(\n  'my-resource',\n  { signal: AbortSignal.timeout(2000) },\n  async () =\u003e {\n    await doWork()\n  }\n).catch(error =\u003e {\n  if (error.name === 'TimeoutError') {\n    console.log('等待锁超时，已自动取消')\n  }\n})","uuid":"4a997a24-bad9-46d6-a1a6-3a847f041126","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"以下是一些适合使用 "},{"type":"formatted","text":"signal","code":true},{"type":"formatted","text":" 的场景："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"用户触发的操作取消"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"用户发起了一个需要获取锁的操作，但在等待期间用户点击了取消按钮或者切换了页面，此时应该放弃等待，避免后续执行已经过时的操作"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"function startTask() {\n  const controller = new AbortController()\n\n  // 将 abort 绑定到取消按钮\n  cancelButton.addEventListener('click', () =\u003e controller.abort(), { once: true })\n\n  navigator.locks.request(\n    'heavy-task',\n    { signal: controller.signal },\n    async () =\u003e {\n      await performHeavyTask()\n    }\n  ).catch(error =\u003e {\n    if (error.name === 'AbortError') {\n      showToast('任务已取消')\n    }\n  })\n}","uuid":"59e64112-9700-4233-b05d-80374f46b059","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"带超时的资源竞争"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"多个标签页竞争同一资源时，如果某个标签页长时间拿不到锁，与其一直等待，不如超时后降级到本地处理，避免用户体验受损"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"async function syncWithTimeout(data) {\n  try {\n    await navigator.locks.request(\n      'cloud-sync',\n      { signal: AbortSignal.timeout(5000) },\n      async () =\u003e {\n        await syncToCloud(data)\n      }\n    )\n  } catch (error) {\n    if (error.name === 'TimeoutError') {\n      // 超时降级：先写入本地，后续再同步\n      await saveToLocalCache(data)\n      console.log('同步超时，数据已暂存本地')\n    }\n  }\n}","uuid":"affd0ffd-4a5c-44c4-b464-a9e6f34a0a16","children":[{"type":"formatted","text":""}]}]}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"死锁"}]},{"type":"paragraph","children":[{"type":"formatted","text":"了解了各种配置项的用法后，还需要警惕一个重要问题：死锁。Web Locks API 的锁不可重入，且浏览器不会自动检测或打破死锁，一旦代码逻辑不当，相关请求就会陷入永久等待。下面介绍几种典型的死锁场景。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"同锁重入"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Web Locks API 的锁是不可重入的，即使是同一个上下文重复请求已持有的锁，也会被阻塞。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"同一个上下文已经持有了某把锁，回调内部又去请求同名的锁，由于锁不可重入，内层请求会永远等待外层释放，而外层又在等内层回调结束，形成自死锁。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 错误示范：同锁重入导致永久阻塞\nawait navigator.locks.request('resource', async () =\u003e {\n  console.log('外层获取到锁')\n\n  // 试图再次获取同一个锁，会在这里永远等待\n  await navigator.locks.request('resource', async () =\u003e {\n    console.log('内层永远执行不到')\n  })\n})","uuid":"31b806e7-8780-453d-afb3-dd94bdadfd87","children":[{"type":"formatted","text":""}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"锁升级死锁"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果一个上下文先以 "},{"type":"formatted","text":"shared","code":true},{"type":"formatted","text":" 模式持有某把锁，随后又在同一把锁上请求 "},{"type":"formatted","text":"exclusive","code":true},{"type":"formatted","text":" 模式，由于独占锁需要等待所有共享锁释放，而这个共享锁正是自己持有的，于是陷入死锁。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 错误示范：共享锁内升级为独占锁\nawait navigator.locks.request('resource', { mode: 'shared' }, async () =\u003e {\n  console.log('已持有 shared 锁')\n\n  // 试图升级为 exclusive，会永远等待自己释放 shared 锁\n  await navigator.locks.request('resource', { mode: 'exclusive' }, async () =\u003e {\n    console.log('永远执行不到')\n  })\n})","uuid":"a3c20d97-7bcf-4bcf-9ae2-30cbfaba17bb","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这和同锁重入本质相同，但因为涉及模式变化，在实际使用读写锁时更容易被忽略。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"循环等待"}]},{"type":"paragraph","children":[{"type":"formatted","text":"两个（或多个）上下文各自持有一把锁，又都试图获取对方持有的那把锁，形成循环依赖，彼此永远等待。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9a043eea-de66-4bc4-93df-d6f3e20ca7aa.webp","alt":"","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9a043eea-de66-4bc4-93df-d6f3e20ca7aa.webp","width":720},{"type":"code-block","language":"JavaScript","code":"// 标签页 A\nawait navigator.locks.request('lock-x', async () =\u003e {\n  console.log('A 获取到 lock-x')\n  await sleep(100)\n\n  // 试图获取 lock-y，但此时 lock-y 被 B 持有\n  await navigator.locks.request('lock-y', async () =\u003e {\n    console.log('A 永远执行不到这里')\n  })\n})","uuid":"b17dfa96-d153-49cd-81ee-dfd7b6617ae2","children":[{"type":"formatted","text":""}]},{"type":"code-block","language":"JavaScript","code":"// 标签页 B\nawait navigator.locks.request('lock-y', async () =\u003e {\n  console.log('B 获取到 lock-y')\n  await sleep(100)\n\n  // 试图获取 lock-x，但此时 lock-x 被 A 持有\n  await navigator.locks.request('lock-x', async () =\u003e {\n    console.log('B 永远执行不到这里')\n  })\n})","uuid":"5bf3ecfa-e0d0-4ed2-8be2-70a2b1eec3c1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"两个标签页都打印完第一句后双双卡住，谁也无法继续。这种死锁不限于两个标签页，也可能发生在 Tab 与 Worker 之间，甚至多个 Worker 之间。"}],"disableDrag":false},{"type":"highlight-block","color":"yellow","children":[{"type":"paragraph","children":[{"type":"formatted","text":"避免死锁最直接的方式是​"},{"type":"formatted","text":"统一加锁顺序","textGradient":"rose","bold":true},{"type":"formatted","text":"，如果所有上下文都按相同的先后顺序请求多把锁（比如先 X 后 Y），循环等待就不会发生。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"此外，尽量减少同时持有多个锁的场景，必要时可以通过 "},{"type":"formatted","text":"ifAvailable","code":true},{"type":"formatted","text":" 非阻塞尝试来避免无限等待。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_61c1b21c-f73f-4f2d-aa0c-e46c9612d3a6.webp","alt":"","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_61c1b21c-f73f-4f2d-aa0c-e46c9612d3a6.webp","width":720}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"查询锁"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当遇到死锁或资源竞争问题时，首先需要了解当前锁的状态。Web Locks API 提供了 "},{"type":"formatted","text":"navigator.locks.query()","code":true},{"type":"formatted","text":" 方法，用来查看当前锁空间下所有锁的状态。这在调试死锁、监控资源竞争、构建开发者工具面板等场景下非常有用。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"const state = await navigator.locks.query()","uuid":"1474c8b4-e845-4b61-8cf6-f80c10f46177","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"query()","code":true},{"type":"formatted","text":" 不接受任何参数，返回一个 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":"，resolve 的值是一个 "},{"type":"formatted","text":"LockManagerSnapshot","code":true},{"type":"formatted","text":" 对象，包含两个属性："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"held","code":true},{"type":"formatted","text":"：一个数组，列出当前所有​"},{"type":"formatted","text":"正在被持有","bold":true},{"type":"formatted","text":"的锁。每个元素是一个对象，包含以下字段："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"name","code":true},{"type":"formatted","text":"：锁的名称"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"mode","code":true},{"type":"formatted","text":"：锁的模式，"},{"type":"formatted","text":"\"exclusive\"","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"\"shared\"","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"clientId","code":true},{"type":"formatted","text":"：持有该锁的上下文标识（标签页或 Worker 的唯一 ID）"}],"disableDrag":false}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"pending","code":true},{"type":"formatted","text":"：一个数组，列出当前所有​"},{"type":"formatted","text":"正在等待队列中排队","bold":true},{"type":"formatted","text":"的锁请求，每个元素的字段与 "},{"type":"formatted","text":"held","code":true},{"type":"formatted","text":" 相同"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过这两个数组，可以清晰地看到哪些锁正在被占用、被谁占用，以及有哪些请求正在排队等待。"}],"disableDrag":false},{"type":"highlight-block","color":"blue","children":[{"type":"paragraph","children":[{"type":"formatted","text":"query()","code":true},{"type":"formatted","text":" 返回的是调用时刻的快照，不会实时更新。如果需要持续监控，需要定期轮询调用。"}],"disableDrag":false}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_09f5bcda-c359-4371-a279-038a08a9fb38.webp","alt":"","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_09f5bcda-c359-4371-a279-038a08a9fb38.webp","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"下面是一个实际的调试示例，展示如何利用 "},{"type":"formatted","text":"query()","code":true},{"type":"formatted","text":" 来观察锁的状态变化："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 模拟一个长时间持有锁的任务\nnavigator.locks.request('db-write', async () =\u003e {\n  console.log('任务 A：获取到 db-write 锁，开始执行...')\n  await sleep(5000) // 模拟耗时操作\n  console.log('任务 A：执行完毕，释放锁')\n})\n\n// 再发起两个请求，它们会进入等待队列\nnavigator.locks.request('db-write', async () =\u003e {\n  console.log('任务 B：获取到锁')\n})\nnavigator.locks.request('db-write', async () =\u003e {\n  console.log('任务 C：获取到锁')\n})\n\n// 等待一小段时间，确保任务 A 已持有锁，B 和 C 进入队列\nawait sleep(100)\n\n// 查询当前锁状态\nconst state = await navigator.locks.query()\n\nconsole.log('当前被持有的锁:', state.held)\n// [{ name: \"db-write\", mode: \"exclusive\", clientId: \"xxx\" }]\n\nconsole.log('等待队列中的请求:', state.pending)\n// [\n//   { name: \"db-write\", mode: \"exclusive\", clientId: \"xxx\" },\n//   { name: \"db-write\", mode: \"exclusive\", clientId: \"xxx\" }\n// ]","uuid":"21171642-3f86-4374-a045-3650dd06cdff","children":[{"type":"formatted","text":""}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"最佳实践"}]},{"type":"paragraph","children":[{"type":"formatted","text":"前面分章节已充分讨论了 Web Locks API 的各项能力，这里将一些在实际项目中容易踩坑或值得养成习惯的点汇总在一起，方便在编码时快速对照。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"缩短持锁时间"}]},{"type":"paragraph","children":[{"type":"formatted","text":"锁的持有时间直接决定了其他请求的等待时长。回调中应该只放必须在锁保护下执行的最小操作，其余逻辑放到锁外面。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 不推荐：在锁内做了过多非必要操作\nawait navigator.locks.request('user-profile', async () =\u003e {\n  const profile = await fetchProfile()\n  await updateProfile(profile)\n  // 发送通知并不需要锁的保护，却延长了持锁时间\n  await sendNotification(profile)\n  await logAnalytics(profile)\n})\n\n// 推荐：只在锁内完成必须互斥的操作，其余移到锁外\nconst profile = await navigator.locks.request('user-profile', async () =\u003e {\n  const p = await fetchProfile()\n  await updateProfile(p)\n  return p\n})\n// 锁已释放，后续操作不会阻塞其他请求\nawait sendNotification(profile)\nawait logAnalytics(profile)","uuid":"04989b59-786b-442d-8b81-bbdd6b0b0a3c","children":[{"type":"formatted","text":""}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"锁命名规范"}]},{"type":"paragraph","children":[{"type":"formatted","text":"随着项目规模增长，锁名称容易冲突。建议用「模块:资源」的命名方式，让锁的归属一目了然，也方便通过 "},{"type":"formatted","text":"query()","code":true},{"type":"formatted","text":" 排查问题。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 不推荐：含义模糊，容易与其他模块冲突\nnavigator.locks.request('sync', callback)\nnavigator.locks.request('data', callback)\n\n// 推荐：带模块前缀，职责清晰\nnavigator.locks.request('editor:auto-save', callback)\nnavigator.locks.request('sync:cloud-push', callback)\nnavigator.locks.request('cache:invalidation', callback)","uuid":"855b8496-154b-49cc-99bf-66534c74b59c","children":[{"type":"formatted","text":""}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"统一错误处理"}]},{"type":"paragraph","children":[{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 可能产生多种错误，散落在各处处理容易遗漏。建议封装一个通用的 "},{"type":"formatted","text":"withLock","code":true},{"type":"formatted","text":" 工具函数，在一个地方统一处理所有锁相关的异常。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"Web Locks API 中常见的错误类型："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AbortError","code":true},{"type":"formatted","text":"：请求在等待队列中被 "},{"type":"formatted","text":"signal","code":true},{"type":"formatted","text":" 取消，或者被其他 "},{"type":"formatted","text":"steal","code":true},{"type":"formatted","text":" 请求清除"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"NotSupportedError","code":true},{"type":"formatted","text":"：使用了非法的配置项组合（如同时设置 "},{"type":"formatted","text":"steal","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"ifAvailable","code":true},{"type":"formatted","text":"）"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"回调内部抛出的业务异常：会通过 "},{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 向外传播"}],"disableDrag":false}]}]},{"type":"code-block","language":"JavaScript","code":"async function withLock(name, callback, options = {}) {\n  const { timeout, onTimeout, lockOptions = {} } = options\n\n  // 如果指定了超时，自动注入 signal\n  if (timeout && !lockOptions.signal) {\n    lockOptions.signal = AbortSignal.timeout(timeout)\n  }\n\n  try {\n    return await navigator.locks.request(name, lockOptions, callback)\n  } catch (error) {\n    // 超时：signal 为 AbortSignal.timeout 时抛出 TimeoutError\n    if (error.name === 'TimeoutError') {\n      console.warn(`[withLock] 获取锁 \"${name}\" 超时 (${timeout}ms)`)\n      if (onTimeout) return onTimeout()\n      throw error\n    }\n\n    // 主动取消或被 steal 清除\n    if (error.name === 'AbortError') {\n      console.warn(`[withLock] 锁请求 \"${name}\" 被取消`)\n      throw error\n    }\n\n    // 非法配置项组合\n    if (error.name === 'NotSupportedError') {\n      console.error(`[withLock] 锁 \"${name}\" 配置项不合法:`, error.message)\n      throw error\n    }\n\n    // 回调内部的业务异常，原样向外抛出\n    throw error\n  }\n}","uuid":"e1885ffc-7f05-4c9e-b9ff-0844926d83c4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用示例："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 带 5s 超时和降级逻辑\nconst data = await withLock(\n  'sync:cloud-push',\n  async () =\u003e {\n    return await pushToCloud()\n  },\n  {\n    timeout: 5000,\n    onTimeout: () =\u003e {\n      console.log('同步超时，使用本地缓存')\n      return getCachedData()\n    }\n  }\n)\n\n// 配合 ifAvailable 使用\nconst result = await withLock(\n  'background:cleanup',\n  async (lock) =\u003e {\n    if (!lock) return null  // 没拿到锁，跳过\n    await performCleanup()\n    return 'done'\n  },\n  { lockOptions: { ifAvailable: true } }\n)","uuid":"c0228afa-c068-40e3-8187-0958e66a1c2e","children":[{"type":"formatted","text":""}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"兜底超时"}]},{"type":"paragraph","children":[{"type":"formatted","text":"没有超时的锁请求一旦遇到异常情况（持有者页面卡死、意外死锁），就会永远挂起。建议对所有生产环境中的锁请求都设置一个合理的超时上限，即使你认为「正常情况下不会等太久」。"}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"// 不推荐：无超时保护\nawait navigator.locks.request('db-write', async () =\u003e {\n  await writeToDatabase(data)\n})\n\n// 推荐：始终带上超时兜底\nawait withLock('db-write', async () =\u003e {\n  await writeToDatabase(data)\n}, { timeout: 10_000 })","uuid":"63bb57bf-28a2-48c8-9b2e-368f3b22b449","children":[{"type":"formatted","text":""}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"总结"}]},{"type":"paragraph","children":[{"type":"formatted","text":"回头看，Web Locks API 做的事情其实很简单：给浏览器里的多标签页和 Worker 提供了一套正经的锁。以前要协调共享资源，要么靠 "},{"type":"formatted","text":"localStorage","code":true},{"type":"formatted","text":" 事件轮询，要么硬上 "},{"type":"formatted","text":"SharedArrayBuffer","code":true},{"type":"formatted","text":" + "},{"type":"formatted","text":"Atomics","code":true},{"type":"formatted","text":"，写起来又绕又容易出 bug。现在一个 "},{"type":"formatted","text":"request","code":true},{"type":"formatted","text":" 调用就搞定了，声明你要哪个资源、用什么模式，排队和释放的事情浏览器帮你管。锁的生命周期跟着回调函数走，回调结束锁就自动释放，从根本上杜绝了「忘记释放锁」这个经典坑。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"几个配置项也给得恰到好处。"},{"type":"formatted","text":"ifAvailable","code":true},{"type":"formatted","text":" 负责「试一下，拿不到就算了」；"},{"type":"formatted","text":"signal","code":true},{"type":"formatted","text":" 让等待可以随时喊停，不管是用户主动取消还是超时降级都能干净退出；"},{"type":"formatted","text":"steal","code":true},{"type":"formatted","text":" 是最后的杀手锏，专门留给僵尸锁这种极端情况。这几个选项组合一下，日常能遇到的并发协调场景基本都能覆盖。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"要说最需要小心的，就是锁不可重入这件事。同锁重入、锁升级、循环等待，这几种死锁模式原理都不复杂，但业务代码一层套一层的时候真的很容易踩进去。养成两个习惯就好：多把锁永远按固定顺序加，持锁回调里别再请求同一把锁。做到这两点，大部分坑都能避开。"}],"disableDrag":false},{"type":"highlight-block","color":"green","children":[{"type":"paragraph","children":[{"type":"formatted","text":"目前 "},{"type":"link","url":"https://caniuse.com/?search=Web+Locks+API","children":[{"type":"formatted","text":"Web Locks API"}]},{"type":"formatted","text":" 已在主流浏览器中获得广泛支持（Chrome 69+、Edge 79+、Safari 15.4+、Firefox 96+ 等），可放心在生产环境使用。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2475b244-fc3e-4a62-902c-8a5f175147d8.webp","alt":"Web Locks API 浏览器兼容性","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2475b244-fc3e-4a62-902c-8a5f175147d8.webp","width":720}]},{"type":"header","children":[{"type":"formatted","text":"参考资料"}],"disableDrag":false,"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"text":"","type":"formatted"},{"type":"link","url":"https://www.w3.org/TR/web-locks/","children":[{"type":"formatted","text":"W3C: Web Locks API"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"text":"","type":"formatted"},{"type":"link","url":"https://developer.mozilla.org/en-US/docs/Web/API/Web_Locks_API","children":[{"type":"formatted","text":"MDN: Web Locks API"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"text":"","type":"formatted"},{"type":"link","url":"https://huangguanhao.com/posts/frontend/web-locks-api-guide.html","children":[{"type":"formatted","text":"深入理解 Web Locks API：浏览器原生的资源锁定机制"}]},{"text":"","type":"formatted"}]}]}]}],"tags":["Web API"],"bannerBg":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-nr1vg1_4b404149-9ddc-420b-82a9-01bf25862862.webp","createTime":1775869069197,"updateTime":1776961013359},"meta":{"type":"article","publishTime":1777564337147}};
