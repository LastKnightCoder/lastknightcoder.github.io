    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":62,"title":"使用 Github Actions 部署 VuePress 博客","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"随着我 VuePress 博客中的东西越来越多，每次我打包好项目然后上传到 Github 上需要好一会儿时间，之前在一些文章中知道 Github Actions 可以帮我自动部署项目，正好今天尝试尝试。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在使用 Github Actions 以前，部署过程是这样的："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"写文章"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"生成静态文件"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"将静态文件部署到 Github Page 上"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用了 Github Actions 后，过程变为了："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"写文章"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"提交文章到 Github 上"}]}]}]},{"type":"header","children":[{"type":"formatted","text":"配置文件"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"接着我们介绍如何使用这一利器。首先你需要在你的项目下新建 .github/workflows/ 文件夹，接着在 workflows 文件夹下新增 xxx.yml 文件，这个文件名随意，但是必须是 YAML 文件，比如我新增文件名为 deploy.yml，给出我的配置内容(去掉了一些个性化的配置)"}]},{"type":"code-block","code":"name: Build and Deploy\non:\n  push:\n    branches:\n      - master\njobs:\n  build-and-deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout 🛎️\n        uses: actions/checkout@v2.3.1\n\n      - name: Install and Build 🔧 \n        run: |\n          npm install\n          npm run build\n\n      - name: Deploy 🚀\n        uses: JamesIves/github-pages-deploy-action@4.1.3\n        with:\n          BRANCH: gh-pages\n          FOLDER: docs/.vuepress/dist\n          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}","language":"YAML","uuid":"cc2fc938-914a-4dc0-8300-8a67ac719487","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当你向 Github 提交代码时，它会自动的检测 .github/workflows/ 目录，如果有配置的话，就会根据你的配置 workflow 自动部署项目。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"从上面的配置看，主要分为三个部分："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"name：这个 workflow 的名称，自己随便取"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"on：触发条件"}]},{"type":"code-block","code":"on:\n  push:\n    branches:\n      - master","language":"YAML","uuid":"950a9a7f-9cbc-4ef0-828c-0104c8fba30e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述表示当我们向 master 分支 push 时就会触发该 workflow"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"jobs：规定要执行的任务，例如上面我们定义了一个任务 build-and-deploy，每个任务包含如下配置"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"runs-on：运行所需要的虚拟机环境，Github 为我们提供了如下环境"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"ubuntu-latest，ubuntu-18.04或ubuntu-16.04"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"windows-latest，windows-2019或windows-2016"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"macOS-latest或macOS-10.14"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里我们选择了 ubuntu-latest"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"steps：任务运行的步骤"}]}]}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着我们对我们运行的步骤进行说明，我们的步骤包含三步，第一步是拉取主分支的代码"}]},{"type":"code-block","code":"- name: Checkout 🛎️\n  uses: actions/checkout@v2.3.1","language":"YAML","uuid":"1d4610b8-d830-4af2-b313-07a866643482","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二步，运行两个命令 npm install 与 npm run build"}]},{"type":"code-block","code":"- name: Install and Build 🔧 \n  run: |\n    npm install\n    npm run build","language":"YAML","uuid":"3c4e00f1-6267-4398-b6bb-c4682c92e7bf","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第三步，将 生成的静态文件夹部署到 gh-pages 分支上"}]},{"type":"code-block","code":"- name: Deploy 🚀\n  uses: JamesIves/github-pages-deploy-action@4.1.3\n  with:\n    BRANCH: gh-pages\n    FOLDER: docs/.vuepress/dist\n    ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}","language":"YAML","uuid":"7cb4568e-3b66-4c94-ba85-1fad9dc9735d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"配置密钥"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"使用 Github Actions 是需要 ACCESS-TOKEN，既然都已经会使用 Github 了，就肯定知道这个东西怎么生成了，如果不会，请求参照"},{"type":"link","url":"https://docs.github.com/en/github/authenticating-to-github/keeping-your-account-and-data-secure/creating-a-personal-access-token","openEdit":false,"children":[{"type":"formatted","text":"官方文档"}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们需要在仓库的 Setting 中选择 Secrets"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_49b2ff9a-aa7d-4f2c-8381-42aa2291ed4e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"点击右上方的 New repository secret"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f10ef731-691a-437d-99e5-00cc2a254db0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Name 必须写为 ACCESS_TOKEN，Value 就是你的 token，填写完毕点击 Add secret，如果填写没有问题的话，点击之后就会提示添加成功。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每次当你将 Vuepress 项目提交到 Github 上的时候，Github 就会自动帮你部署项目。"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_89703d06-e9db-411c-8bb9-52179d5736ac.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在 Actions 的这个选项中可以看到项目的部署情况，上面可以看到我尝试了三次，第三次成功了，前两次是踩坑，下面就介绍了我踩的两次坑。"}]},{"type":"header","children":[{"type":"formatted","text":"踩坑"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在 VuePress 官网上面，给出的构建脚本命令是"}]},{"type":"code-block","code":"npm run docs:build","language":"shell","uuid":"35e191bf-7303-4088-b237-b4ea48eb74e9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我觉得麻烦，改为了 npm run build，所以第一次运行的时候，就提示我没有这个脚本"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_795570c7-11c1-4c7e-8b8f-fe2684ddbd6b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我改过来了，所以如果你构建的脚本命令和我的不一致的话，还是要改的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一个坑，上面配置好了以后，我将我的 VuePress 博客提交到 Github，但是运行一段时间之后爆出了错误"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_647cbdef-f4a6-4989-abea-2c786d65acd8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从错误的类型看好像是超内存了，然后经过我的搜索，在 Github 的一个 issue 中找到了"},{"type":"link","url":"https://github.com/ScaCap/action-surefire-report/issues/17#issuecomment-677015255","openEdit":false,"children":[{"type":"formatted","text":"解决办法"}]},{"type":"formatted","text":"，添加下面的环境变量"}]},{"type":"code-block","code":"env:\n  NODE_OPTIONS: '--max_old_space_size=4096'","language":"YAML","uuid":"a6d83431-b06f-407c-b701-081a7deeaeb0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"更改后的配置文件如下"}]},{"type":"code-block","code":"name: Build and Deploy\non:\n  push:\n    branches:\n      - master\njobs:\n  build-and-deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout 🛎️\n        uses: actions/checkout@v2.3.1\n\n      - name: Install and Build 🔧 \n        run: |\n          npm install\n          npm run build\n        env:\n          NODE_OPTIONS: '--max_old_space_size=4096'\n\n      - name: Deploy 🚀\n        uses: JamesIves/github-pages-deploy-action@4.1.3\n        with:\n          BRANCH: gh-pages\n          FOLDER: docs/.vuepress/dist\n          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}","language":"YAML","uuid":"4e5b8009-9839-44e2-9268-500a9c2bd664","children":[{"type":"formatted","text":""}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/tabea-schimpf-W9ZIbpOzcoA-unsplash_cc72578b-8309-4837-9019-7e0fa3c2ec99.jpg","createTime":1622445611000,"updateTime":1743303640485},"meta":{"type":"article","publishTime":1764822965008}};
