      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":38,"title":"连续时间信号的抽样及其重建","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"现研究一连续信号进行抽样转换为数字信号，经数字信号处理器(DSP)或计算机处理后，再进行重建的过程，具体过程如下："}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/%E6%95%B0%E5%AD%97%E4%BF%A1%E5%8F%B7%E5%A4%84%E7%90%86_1ac8fdfb-a28d-4756-9029-532d98332239.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中采样/保持电路和 A/D 转换电路可以看做是一个理想抽样的过程，而 D/A 转换和平滑滤波可以看做是一个理想内插的过程。假设理想抽样信号为"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty} \\delta(t-nT_{s})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中"},{"type":"inline-math","tex":"T_s","children":[{"type":"formatted","text":"T_s"}]},{"type":"formatted","text":"为抽样的周期。那么模拟信号 "},{"type":"inline-math","tex":"x_a(t)","children":[{"type":"formatted","text":"x_a(t)"}]},{"type":"formatted","text":"经理想抽样后得到的抽样信号 "},{"type":"inline-math","tex":"\\hat{x}_a(t)","children":[{"type":"formatted","text":"\\hat{x}\\_a(t)"}]},{"type":"formatted","text":"为"}]},{"type":"block-math","tex":"\\hat{x}_a(t)=x_a(t) \\cdot \\sum_{n=-\\infty}^{\\infty}\\delta(t-nT_s)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"设信号"},{"type":"inline-math","tex":"x_a(t)","children":[{"type":"formatted","text":"x_a(t)"}]},{"type":"formatted","text":"的傅里叶变换为"},{"type":"inline-math","tex":"X_a(j\\Omega)","children":[{"type":"formatted","text":"X_a(j\\Omega)"}]},{"type":"formatted","text":"并且其最高频率为 "},{"type":"inline-math","tex":"\\Omega_m","children":[{"type":"formatted","text":"\\Omega_m"}]},{"type":"formatted","text":"，现研究抽样信号 "},{"type":"inline-math","tex":"\\hat{x}_a(t)","children":[{"type":"formatted","text":"\\hat{x}_a(t)"}]},{"type":"formatted","text":"的傅里叶变换"}]},{"type":"block-math","tex":"\\begin{aligned}\n\\hat{X}_a(j\\Omega)=F[\\hat{x}_a(t)]&=F[x_a(t) \\cdot \\sum_{n=-\\infty}^{\\infty}\\delta(t-nT_s)] \\\\\n&=\\frac{1}{2\\pi}X(j\\Omega)*\\frac{2\\pi}{T_s}\\sum_{n=-\\infty}^{\\infty}\\delta(\\Omega - n\\Omega_s) \\\\\n&=\\frac{1}{T_s}\\sum_{n=-\\infty}^{\\infty}X(j(\\Omega - n\\Omega_s))\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"inline-math","tex":"\\Omega_s=\\dfrac{2\\pi}{T_s}","children":[{"type":"formatted","text":"\\Omega_s=\\dfrac{2\\pi}{T_s}"}]},{"type":"formatted","text":"。从上式中就可以看出抽样信号的频谱是原信号频谱的周期延拓。"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6ccf037c-9781-48d3-ab21-3bdfe90c1eea.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"要保证频谱在周期延拓时不发生混叠，那么就要求"}]},{"type":"block-math","tex":"\\Omega_s-\\Omega_m\\geq\\Omega_m \\Rightarrow\\Omega_s\\geq2\\Omega_m","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"把 "},{"type":"inline-math","tex":"\\Omega_s=2\\Omega_m","children":[{"type":"formatted","text":"\\Omega_s=2\\Omega_m"}]},{"type":"formatted","text":" 称为奈奎斯特采样频率，这是频谱不发生混叠允许的最小采样频率，此时可以通过一低通滤波器将信号恢复出来，若频谱发生了混叠，则很难将信号重建出来。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑信号的重建，由频谱图可知，通过一低通滤波器即可将信号完全的恢复出来，假设以频率 "},{"type":"inline-math","tex":"\\Omega_s>2\\Omega_m","children":[{"type":"formatted","text":"\\Omega_s>2\\Omega_m"}]},{"type":"formatted","text":" 进行抽样，考虑这么一个低通滤波器："}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/lp_b48dd351-c275-4312-83c7-54e2121017a5.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其傅里叶反变换为"}]},{"type":"block-math","tex":"h_{LP}(t) = \\text{sinc}(\\frac{t}{T_s})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"inline-math","tex":"\\text{sinc}(t)=\\dfrac{\\sin(\\pi t)}{\\pi t}","children":[{"type":"formatted","text":"sinc(t)=\\dfrac{sin(\\pi t)}{\\pi t}"}]},{"type":"formatted","text":"，由频谱关系知"}]},{"type":"block-math","tex":"X(j\\Omega)=\\hat{X}_a(j\\Omega) \\cdot H_{LP}(j\\Omega)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以"}]},{"type":"block-math","tex":"\\begin{aligned}\nx_a(t)&=\\hat{x}_a(t) * h_{LP}(t) \\\\\n&=x_a(t) \\cdot \\sum_{n=-\\infty}^{\\infty}\\delta(t-nT_s) * h_{LP}(t) \\\\\n&=\\sum_{n=-\\infty}^{\\infty}x_a(nT_s)\\delta(t-nT_s) * \\text{sinc}(\\frac{t}{T_s}) \\\\\n&=\\sum_{n=-\\infty}^{\\infty}x_a(nT_s) \\cdot \\text{sinc}(\\frac{1}{T_s}(t-nT_s))\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这就是信号的重建，这个过程也被称为理想内插过程。"}]}],
