      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":39,"title":"信号的相关","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"有时候需要将一个信号与多个参考信号进行比较，以便确定每对信号之间的相似性，从而从相似性中提取出额外的信息。在雷达应用中，接收到的信号是目标反射回来的信号，该信号是反射信号的延迟形式，通过测量延迟，可以确定目标的位置。"}]},{"type":"header","children":[{"type":"formatted","text":"从向量的内积谈起"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"按照一般教科书的写法，一般会直接给出一个互相关的公式，比如两个能量信号序列的相关性的度量可以定义为"}]},{"type":"block-math","tex":"r_{xy}[l]=\\sum_{n=-\\infty}^{\\infty}x[n]y[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"先不解释这个公式的组成以及含义，但是我学习这个的时候一直想，为什么这个公式能够给出两个信号之间的相关性的度量。所以我打算从向量的内积开始，从向量的内积讲到这个公式，不过由于接下来的都是我的理解，我在数字信号处理的教材中还没有看到相关的介绍(可能是我读书少)，所以接下来的数学推导并不是很准确(事实上涉及的数学推导几乎没有)，重点是这种思想的理解。首先考虑两个向量，这两个向量的模长都是固定的，那么怎么描述两个向量之间的相关程度，在我看来，二者之间的夹角大小可以描述这种相关性，如果两个向量相关性高，说明两向量之间的夹角比较小，根据向量的内积"}]},{"type":"block-math","tex":"\\vec{a} \\cdot \\vec{b}=\\vert a \\vert \\vert b \\vert cos\\phi","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"inline-math","tex":"\\phi","children":[{"type":"formatted","text":"\\phi"}]},{"type":"formatted","text":" 为向量 "},{"type":"inline-math","tex":"\\vec{a}","children":[{"type":"formatted","text":"\\vec{a}"}]},{"type":"formatted","text":" 与向量 "},{"type":"inline-math","tex":"\\vec{b}","children":[{"type":"formatted","text":"\\vec{b}"}]},{"type":"formatted","text":" 之间的夹角，如果两个向量相关性越高，那么二者之间的夹角越小，所以 "},{"type":"inline-math","tex":"cos\\phi","children":[{"type":"formatted","text":"cos\\phi"}]},{"type":"formatted","text":" 越大，由于向量的模长固定，所以相关性越高也就代表着两向量的内积越大。如果用坐标形式表示，假设两个向量都是二维向量，那么向量的内积可以表示为"}]},{"type":"block-math","tex":"\\vec{a} \\cdot \\vec{b}=x_ax_b+y_ay_b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"虽然我这里用的二维向量，但是明显可以推广到无限维的情况。那么接下来我们在来看之前在文章开头定义的那个公式"}]},{"type":"block-math","tex":"r_{xy}[l]=\\sum_{n=-\\infty}^{\\infty}x[n]y[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 和序列 "},{"type":"inline-math","tex":"y[n-l]","children":[{"type":"formatted","text":"y[n-l]"}]},{"type":"formatted","text":" 可以看做是一个无限维的向量，而"}]},{"type":"block-math","tex":"x[-\\infty], ..., x[0], ..., x[\\infty]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看做是向量 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" (这里我把 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 看做是一个向量了)的坐标，相应的"}]},{"type":"block-math","tex":"y[-\\infty], ..., y[-l], ... y[\\infty]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看做向量 "},{"type":"inline-math","tex":"y[n-l]","children":[{"type":"formatted","text":"y[n-l]"}]},{"type":"formatted","text":" 的坐标，所以"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}x[n]y[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看做是向量 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 与向量 "},{"type":"inline-math","tex":"y[n-l]","children":[{"type":"formatted","text":"y[n-l]"}]},{"type":"formatted","text":" 的内积，而对于取不同的 "},{"type":"inline-math","tex":"l","children":[{"type":"formatted","text":"l"}]},{"type":"formatted","text":"，"},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 的模与 "},{"type":"inline-math","tex":"y[n-l]","children":[{"type":"formatted","text":"y[n-l]"}]},{"type":"formatted","text":" 的模都是不变的(不论序列 "},{"type":"inline-math","tex":"y[n]","children":[{"type":"formatted","text":"y[n]"}]},{"type":"formatted","text":" 是有限长还是无限长)，符合我们推导时做的假设，所以在这里我从向量的内积这个方面解释了为什么这个公式可以表示两个信号的相关性程度。"}]},{"type":"header","children":[{"type":"formatted","text":"定义"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"互相关"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"上面从向量内积的角度理解了互相关公式，接下来将按照教科书上给出严格的定义。互相关序列"},{"type":"inline-math","tex":"r_{xy}[l]","children":[{"type":"formatted","text":"r_{xy}[l]"}]},{"type":"formatted","text":"表示一对"},{"type":"formatted","text":"能量序列 ","color":"#e33a32","darkColor":"#fa7873"},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"y[n]","children":[{"type":"formatted","text":"y[n]"}]},{"type":"formatted","text":"之间相似性的度量，其定义为(假设式中的无限求和是收敛的)"}]},{"type":"block-math","tex":"r_{xy}[l]=\\sum_{n=-\\infty}^{\\infty}x[n]y[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"式中，"},{"type":"inline-math","tex":"r_{xy}[l]","children":[{"type":"formatted","text":"r_{xy}[l]"}]},{"type":"formatted","text":" 代表了序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 与序列 "},{"type":"inline-math","tex":"y[n-l]","children":[{"type":"formatted","text":"y[n-l]"}]},{"type":"formatted","text":" 之间的相关性程度，所以 "},{"type":"inline-math","tex":"r_{xy}[l]","children":[{"type":"formatted","text":"r_{xy}[l]"}]},{"type":"formatted","text":" 越大，代表序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 与序列 "},{"type":"inline-math","tex":"y[n-l]","children":[{"type":"formatted","text":"y[n-l]"}]},{"type":"formatted","text":" 的相似性越高。"}]},{"type":"header","children":[{"type":"formatted","text":"互相关的性质"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"由互相关公式"}]},{"type":"block-math","tex":"r_{xy}[l]=\\sum_{n=-\\infty}^{\\infty}x[n]y[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"则"}]},{"type":"block-math","tex":"r_{yx}[l]=\\sum_{n=-\\infty}^{\\infty}y[n]x[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"令 "},{"type":"inline-math","tex":"m=n-l","children":[{"type":"formatted","text":"m=n-l"}]},{"type":"formatted","text":"，得到"}]},{"type":"block-math","tex":"{r_{yx}[l]=\\sum_{m=-\\infty}^{\\infty}x[m]y[m-(-l)]=r_{xy}[-l]}","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"自相关"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"同理，我们定义自相关序列，只要将 "},{"type":"inline-math","tex":"y[n]","children":[{"type":"formatted","text":"y[n]"}]},{"type":"formatted","text":" 替换为 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 即可"}]},{"type":"block-math","tex":"r_{xx}[l]=\\sum_{n=-\\infty}^{\\infty}x[n]x[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于上面推导得到"}]},{"type":"block-math","tex":"r_{yx}[l]=r_{xy}[-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以得到"}]},{"type":"block-math","tex":"r_{xx}[l]=r_{xx}[-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"即自相关序列是一个偶序列。"}]},{"type":"header","children":[{"type":"formatted","text":"自相关的性质"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"另一个需要注意的是，当 "},{"type":"inline-math","tex":"l=0","children":[{"type":"formatted","text":"l=0"}]},{"type":"formatted","text":" 时，自相关序列"}]},{"type":"block-math","tex":"r_{xx}[0]=\\sum_{n=-\\infty}^{\\infty}x[n]x[n]=\\sum_{n=-\\infty}^{\\infty}\\vert x[n] \\vert^2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以 "},{"type":"inline-math","tex":"r_{xx}[0]","children":[{"type":"formatted","text":"r_{xx}[0]"}]},{"type":"formatted","text":" 的大小就是序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 的能量。根据我们之前在向量的内积中的定义"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}x[n]x[n]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看做是序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 与序列 "},{"type":"inline-math","tex":"x[n","children":[{"type":"formatted","text":"x[n"}]},{"type":"formatted","text":"] 的内积，二者之间的夹角为 0(为最小夹角，相关性最大)，所以"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}x[n]x[n] \\geq\\sum_{n=-\\infty}^{\\infty}x[n]x[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"即"}]},{"type":"block-math","tex":"r_{xx}[l]\\leq r_{xx}[0],\\quad  -\\infty \u003c l \u003c \\infty","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在这个的基础上，我们可以简单的谈一下在文章开头提到的雷达检测问题:"}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在雷达应用中，接收到的信号是目标反射回来的信号，该信号是反射信号的延迟形式，通过测量延迟，可以确定目标的位置。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里有个重点是接收到的信号是发射信号的延时，我们记接收到的信号为 "},{"type":"inline-math","tex":"h[n]","children":[{"type":"formatted","text":"h[n]"}]},{"type":"formatted","text":"，发射的信号为 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":"，如果接收到的信号是延迟 "},{"type":"inline-math","tex":"2\\text{s}","children":[{"type":"formatted","text":"2s"}]},{"type":"formatted","text":" 的话，那么 "},{"type":"inline-math","tex":"h[n]=x[n-2]","children":[{"type":"formatted","text":"h[n]=x[n-2]"}]},{"type":"formatted","text":"，假设检测的过程是，计算 "},{"type":"inline-math","tex":"h[n]","children":[{"type":"formatted","text":"h[n]"}]},{"type":"formatted","text":" 与 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 及其延迟的互相关值，得到序列 "},{"type":"inline-math","tex":"r[l]","children":[{"type":"formatted","text":"r[l]"}]},{"type":"formatted","text":"﻿"}]},{"type":"block-math","tex":"r[l]=\\sum_{n=-\\infty}^{\\infty}h[n]x[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于 "},{"type":"inline-math","tex":"h[n]=x[n-2]","children":[{"type":"formatted","text":"h[n]=x[n-2]"}]},{"type":"formatted","text":"，所以序列 "},{"type":"inline-math","tex":"r[2]","children":[{"type":"formatted","text":"r[2]"}]},{"type":"formatted","text":" 是序列 "},{"type":"inline-math","tex":"r[l]","children":[{"type":"formatted","text":"r[l]"}]},{"type":"formatted","text":" 的最大值，所以我们通过观察序列 "},{"type":"inline-math","tex":"r[l]","children":[{"type":"formatted","text":"r[l]"}]},{"type":"formatted","text":" 最大值出现的位置，就可以知道延迟的时间，从而确定目标的位置。实际上接收到的信号还附有噪声，分析的过程比这个要复杂一些，但是基本的原理还是这个，只是牵涉到了一些数学公式，我觉得把握这种思想就可以了。"}]},{"type":"header","children":[{"type":"formatted","text":"相关的归一化形式"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在之前我们提到用向量的内积表示相关性的大小，其本质是由其夹角决定的，所以我们可以直接利用夹角的余弦值来定义相关性的大小。在向量理论中："}]},{"type":"block-math","tex":"cos\\phi = \\frac{\\vec{a} \\vec{b}}{\\vert \\vec{a} \\vert \\vert \\vec{b} \\vert}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"注意到"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}\\vert x[n-l] \\vert ^2 = \\sum_{n=-\\infty}^{\\infty}\\vert x[n] \\vert ^2 = r_{xx}[0]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"而这个也可以看做事向量模长的平方。所以我们定义自相关的归一化形式为"}]},{"type":"block-math","tex":"\\rho_{xx}[l]=\\frac{r_{xx}[l]}{\\sqrt{r_{xx}[0]}\\sqrt{r_{xx}[0]}}=\\frac{r_{xx}[l]}{r_{xx}[0]}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"同理我们定义互相关的归一化形式为"}]},{"type":"block-math","tex":"\\rho_{xy}[l]=\\frac{r_{xy}[l]}{\\sqrt{r_{xx}[0]}\\sqrt{r_{yy}[0]}}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以 "},{"type":"inline-math","tex":"\\vert \\rho_{xx}[l] \\vert \\leq 1,\\vert \\rho_{xy}[l]\\leq 1 \\vert","children":[{"type":"formatted","text":"\\vert \\rho_{xx}[l] \\vert \\leq 1,\\vert \\rho_{xy}[l]\\leq 1 \\vert"}]},{"type":"formatted","text":"。"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"\\rho_{xy}[l]=1","children":[{"type":"formatted","text":"\\rho_{xy}[l]=1"}]},{"type":"formatted","text":" 代表 "},{"type":"inline-math","tex":"\\cos\\phi=1 \\Rightarrow \\phi=0","children":[{"type":"formatted","text":"\\cos\\phi=1 \\Rightarrow \\phi=0"}]},{"type":"formatted","text":"，说明这时序列的相关性最大"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"\\rho_{xy}[l]=0","children":[{"type":"formatted","text":"\\rho_{xy}[l]=0"}]},{"type":"formatted","text":" 代表 "},{"type":"inline-math","tex":"\\cos\\phi=0 \\Rightarrow \\phi=\\pi /2","children":[{"type":"formatted","text":"\\cos\\phi=0 \\Rightarrow \\phi=\\pi /2"}]},{"type":"formatted","text":"，说明这两个序列不相关"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"\\rho_{xy}[l]=-1","children":[{"type":"formatted","text":"\\rho_{xy}[l]=-1"}]},{"type":"formatted","text":" 代表 "},{"type":"inline-math","tex":"\\cos\\phi=-1 \\Rightarrow \\phi=\\pi","children":[{"type":"formatted","text":"\\cos\\phi=-1 \\Rightarrow \\phi=\\pi"}]},{"type":"formatted","text":"，说明这时序列线性负相关"}]}]}]},{"type":"header","children":[{"type":"formatted","text":"功率和周期信号的相关"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在之前的介绍中，介绍的都是能量信号的相关，对于功率信号来说，它的能量为无穷大，所以上述的定义不太适合，类似于功率信号的定义，我们定义功率信号 "},{"type":"inline-math","tex":"x[n],y[n]","children":[{"type":"formatted","text":"x[n],y[n]"}]},{"type":"formatted","text":" 的互相关为"}]},{"type":"block-math","tex":"r_{xy}[l]=\\lim\\limits_{K \\to \\infty}\\frac{1}{2K+1}\\sum_{n=-K}^{K}x[n]y[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"功率信号 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 的自相关定义为"}]},{"type":"block-math","tex":"r_{xx}[l]=\\lim\\limits_{K \\to \\infty}\\frac{1}{2K+1}\\sum_{n=-K}^{K}x[n]x[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果 "},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"\\tilde{y}[n]","children":[{"type":"formatted","text":"\\tilde{y}[n]"}]},{"type":"formatted","text":" 是周期为 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 的两个周期信号，那么其互相关序列为"}]},{"type":"block-math","tex":"r_{\\tilde{x} \\tilde{y}}[l]=\\frac{1}{N}\\sum_{n=0}^{N-1}\\tilde{x}[n]\\tilde{y}[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":" 的自相关序列为"}]},{"type":"block-math","tex":"r_{\\tilde{x} \\tilde{x}}[l]=\\frac{1}{N}\\sum_{n=0}^{N-1}\\tilde{x}[n]\\tilde{x}[n-l]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们很容易的知道，序列 "},{"type":"inline-math","tex":"r_{\\tilde{x} \\tilde{y}}[l]","children":[{"type":"formatted","text":"r_{\\tilde{x} \\tilde{y}}[l]"}]},{"type":"formatted","text":" 和序列 "},{"type":"inline-math","tex":"r_{\\tilde{x} \\tilde{x}}[l]","children":[{"type":"formatted","text":"r_{\\tilde{x} \\tilde{x}}[l]"}]},{"type":"formatted","text":" 都是周期序列，且周期为 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":"。"}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-pk8qme_b2b57b4a-a26d-41e1-bb96-d28bb5eb3d31.png","createTime":1542374222000,"updateTime":1743303640469},"meta":{"type":"article","publishTime":1767266229545}};
