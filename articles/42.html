    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":42,"title":"离散傅里叶变换","author":"","content":[{"type":"header","children":[{"type":"formatted","text":"周期序列的离散傅里叶级数展开"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"正如连续时间周期信号可以表示为一系列正弦信号的和的形式，周期序列也可以表示为一系列正弦之和的形式，假设序列 "},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":" 的周期为 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":"，那么它的基频为 "},{"type":"inline-math","tex":"\\cfrac{2\\pi}{N}","children":[{"type":"formatted","text":"\\cfrac{2\\pi}{N}"}]},{"type":"formatted","text":"，所以有"}]},{"type":"block-math","tex":"\\tilde{x}[n]=\\frac{1}{N}\\sum_{k=0}^{N-1}\\tilde{X}[k]e^{j\\frac{2\\pi}{N}kn}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里与连续时间信号不同的是，不需要无穷多个成谐波关系的复指数,只需要 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 个成谐波关系的复指数。为求傅里叶级数系数 "},{"type":"inline-math","tex":"\\tilde{X}[k]","children":[{"type":"formatted","text":"\\tilde{X}[k]"}]},{"type":"formatted","text":"，两边同时乘以 "},{"type":"inline-math","tex":"e^{-j\\frac{2\\pi}{N}rn}","children":[{"type":"formatted","text":"e^{-j\\frac{2\\pi}{N}rn}"}]},{"type":"formatted","text":"，并在 "},{"type":"inline-math","tex":"[0, N-1]","children":[{"type":"formatted","text":"0 \\backsim (N-1)"}]},{"type":"formatted","text":" 求和"}]},{"type":"block-math","tex":"\\sum_{n=0}^{N-1}\\tilde{x}[n]e^{-j\\frac{2\\pi}{N}rn}=\\sum_{k=0}^{N-1}\\tilde{X}[k]\\frac{1}{N}\\sum_{n=0}^{N-1}e^{j\\frac{2\\pi}{N}(k-r)n}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于"}]},{"type":"block-math","tex":"\\frac{1}{N}\\sum_{n=0}^{N-1}e^{j\\frac{2\\pi}{N}(k-r)n}=\n\\begin{cases}\n1, \\quad k - r = mN \\\\\n0, \\quad \\text{other}\n\\end{cases}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"代入上式，得到"}]},{"type":"block-math","tex":"\\tilde{X}[r]=\\sum_{n=0}^{N-1}\\tilde{x}[n]e^{-j\\frac{2\\pi}{N}rn}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从上看出，"},{"type":"inline-math","tex":"\\tilde{X}[r]","children":[{"type":"formatted","text":"\\tilde{X}[r]"}]},{"type":"formatted","text":" 也是周期序列，周期为 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"总结一下周期序列的展开及其系数的表示"}]},{"type":"block-math","tex":"{\\tilde{x}[n]=\\frac{1}{N}\\sum_{k=0}^{N-1}\\tilde{X}[k]e^{j\\frac{2\\pi}{N}kn}}","children":[{"type":"formatted","text":""}]},{"type":"block-math","tex":"{\\tilde{X}[k]=\\sum_{n=0}^{N-1}\\tilde{x}[n]e^{-j\\frac{2\\pi}{N}kn} }","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"周期序列的离散时间傅里叶变换"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"将周期信号的傅里叶级数纳入离散时间傅里叶变换（DTFT）的框架是有益的。但是周期序列不是绝对可和的，也不是平方可和的，所以周期序列的 DTFT 应该是冲激串的形式。为导出周期序列的 DTFT 的表达式，不妨先看一下连续周期信号的傅里叶变换。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"连续周期信号可以将其进行傅里叶级数展开"}]},{"type":"block-math","tex":"\\tilde{x}(t)=\\sum_{n=-\\infty}^{\\infty}F_ne^{jn\\Omega_0 t}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"两边同时进行傅里叶变换"}]},{"type":"block-math","tex":"\\tilde{X}(j\\Omega)=\\sum_{n=-\\infty}^{\\infty}2\\pi F_n\\delta(\\Omega -n\\Omega_0)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"同理，周期序列的傅里叶变换可以写为"}]},{"type":"block-math","tex":"\\tilde{X}(e^{jw})=\\sum_{k=0}^{N-1}\\frac{2\\pi}{N}\\tilde{X}[k]\\delta(w-\\frac{2\\pi k}{N})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为验证其正确性，对上式进行傅里叶反变换"}]},{"type":"block-math","tex":"\\begin{aligned}\n\\frac{1}{2\\pi}\\int_{0-\\epsilon}^{2\\pi-\\epsilon}\\tilde{X}(e^{jw})e^{jwn}dw&=\\frac{1}{N}\\sum_{k=0}^{N-1}\\tilde{X}[k]\\int_{0-\\epsilon}^{2\\pi-\\epsilon}\\delta(w-\\frac{2\\pi k}{N})e^{jwn}dw\\\\\n&=\\frac{1}{N}\\sum_{k=0}^{N-1}\\tilde{X}[k]e^{j\\frac{2\\pi k}{N}n} \\\\\n&=\\tilde{x}[n]\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"离散傅里叶变换"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们知道，序列进行傅里叶变换得到的频谱都是连续的，而对信号进行数字处理一般都是计算机或者专门的处理器，但无论是计算机还是专门的处理器，其存储精度及存储容量都是有限的，无法处理连续的信号。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们对连续信号进行处理时，是将其进行抽样转换为数字信号，为了无损的恢复出原信号，其抽样速率必须满足奈奎斯特抽样定理。那么可不可以对序列的频谱进行抽样处理呢？为了无损的恢复出原信号，抽样又该满足什么样的条件？假设对于一有限长的信号 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":"，其长度为 "},{"type":"inline-math","tex":"M","children":[{"type":"formatted","text":"M"}]},{"type":"formatted","text":"，其 DTFT 为 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":"，现对其频谱的主周期进行均匀的 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 点抽样，得到序列 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":"，即"}]},{"type":"block-math","tex":"X[k]=X(e^{jw})\\vert_{w=\\frac{2\\pi k}{N}}, \\quad k = 0, ... , N-1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这与我们之前对傅里叶级数的讨论十分的相似，如果把 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 看作是傅里叶级数系数，那么由 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 恢复出的信号为"}]},{"type":"block-math","tex":"\\begin{aligned}\n\\tilde{x}[n]&=\\frac{1}{N}\\sum_{k=0}^{N-1}X[k]e^{j\\frac{2\\pi kn}{N}} \\\\\n&=\\frac{1}{N}\\sum_{k=0}^{N-1}\\sum_{m=-\\infty}^{\\infty}x[m]e^{-j\\frac{2\\pi k}{N}m}e^{j\\frac{2\\pi kn}{N}} \\\\\n&=\\sum_{m=-\\infty}^{\\infty}x[m](\\frac{1}{N}\\sum_{k=0}^{N-1}e^{j\\frac{2\\pi k(n-m)}{N}}) \\\\\n&=\\sum_{m=-\\infty}^{\\infty}x[m]\\tilde{p}[n-m] \\\\\n&=x[n]*\\tilde{p}[n] \\\\\n&=x[n] * \\sum_{r=-\\infty}^{\\infty}\\delta[n-rN] \\\\\n&=\\sum_{r=-\\infty}^{\\infty}x[n-rN]\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"恢复出的信号 "},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":" 是原信号以周期 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 进行周期延拓得到的结果,如果 "},{"type":"inline-math","tex":"N\\geq M","children":[{"type":"formatted","text":"N\\geq M"}]},{"type":"formatted","text":"，那么周期延拓得到的信号没有发生混叠，那么可以取其 "},{"type":"inline-math","tex":"0\\backsim N-1","children":[{"type":"formatted","text":"0\\backsim N-1"}]},{"type":"formatted","text":" 一个周期中前 "},{"type":"inline-math","tex":"M","children":[{"type":"formatted","text":"M"}]},{"type":"formatted","text":" 个恢复原来的信号。所以我们可以通过对其频谱进行抽样来处理，并如果满足抽样点数$N$大于等于序列的长度 "},{"type":"inline-math","tex":"M","children":[{"type":"formatted","text":"M"}]},{"type":"formatted","text":"，那么就可以无损的恢复出原来的信号。这个原则叫做频域抽样定理。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"稍微总结一下上面的过程，我们首先对序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 进行傅里叶变换，然后对其频谱进行抽样得到 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":"，然后以 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 作为傅里叶级数的系数得到序列 "},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":"，如果满足频域抽样定理，那么取其主区间的前 "},{"type":"inline-math","tex":"M","children":[{"type":"formatted","text":"M"}]},{"type":"formatted","text":" 个即可恢复出原信号。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们不妨省略对序列进行傅里叶变换，然后对其进行抽样的过程，直接定义一个变换由 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 直接得到 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":"，然后省略有 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 得到 "},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":"，然后取其主周期得到 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 的过程，也直接定义一个变换由 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 直接得到 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"假设有限长序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 的长度为 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":"，并假设其有值区间为 "},{"type":"inline-math","tex":"0 \\leq n \\leq N-1","children":[{"type":"formatted","text":"0 \\leq n \\leq N-1"}]},{"type":"formatted","text":"，为了满足频域抽样定理，我们不妨设采样的点数为 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":"，这样做的好处是由 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 得到 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 时，直接取其主区间即可，不用取其前多少个。为了得到 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 这个表达式，首先得知道 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":"是怎么来的，通过上面的介绍我们知道"}]},{"type":"block-math","tex":"X[k]=X(e^{jw})\\vert_{w=\\frac{2\\pi k}{N}}, \\quad k = 0, ... , N-1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"即"}]},{"type":"block-math","tex":"X[k]=\\sum_{n=-\\infty}^{\\infty}x[n]e^{-jwn}\\vert_{w=\\frac{2\\pi k}{N}}=\\sum_{n=0}^{N-1}x[n]e^{-j\\frac{2\\pi}{N}kn}, \\quad 0\\leq k \\leq N-1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了得到 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":"，以 "},{"type":"inline-math","tex":"X[k]","children":[{"type":"formatted","text":"X[k]"}]},{"type":"formatted","text":" 为傅里叶级数系数得到 "},{"type":"inline-math","tex":"\\tilde{x}[n]","children":[{"type":"formatted","text":"\\tilde{x}[n]"}]},{"type":"formatted","text":"，并取其主区间，所以"}]},{"type":"block-math","tex":"x[n]=\\frac{1}{N}\\sum_{k=0}^{N-1}X[k]e^{j\\frac{2\\pi kn}{N}} \\quad 0 \\leq n \\leq N-1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们得到一组变换"}]},{"type":"block-math","tex":"{X[k]=\\sum_{n=0}^{N-1}x[n]e^{-j\\frac{2\\pi}{N}kn} \\quad 0\\leq k \\leq N-1}","children":[{"type":"formatted","text":""}]},{"type":"block-math","tex":"{x[n]=\\frac{1}{N}\\sum_{k=0}^{N-1}X[k]e^{j\\frac{2\\pi kn}{N}} \\quad 0 \\leq n \\leq N-1}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们把上面的变换称为离散傅里叶变换，简称 DFT。"}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-pk3kde_7b50f5e8-40ab-4ce5-b5b6-d694afeae89a.jpg","createTime":1543813465000,"updateTime":1743303640481},"meta":{"type":"article","publishTime":1764823685322}};
