    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":36,"title":"Git 对象初相识","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"Git 对象，四种类型的对象："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"tag","code":true},{"type":"formatted","text":" 对象"}]}]}]},{"type":"header","children":[{"type":"formatted","text":"blob 对象"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"所有的文件都会被存储为一个 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象，需要注意的是，"},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象只存储文件的内容，对于文件的其它信息，例如文件名，修改时间，权限等等信息均不存储（会被存储到 "},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象中），因此，如果两个文件拥有相同的内容，那么只会有一个 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 文件。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"新建一个仓库，然后添加两个文件，拥有相同的内容："}]},{"type":"code-block","code":"# 创建目录，并初始化\nxt in ~ λ mkdir git-demo\nxt in ~ λ cd git-demo\nxt in ~/git-demo λ git init\nInitialized empty Git repository in /home/xt/git-demo/.git/\n\n# 创建两个文件 a.txt b.txt 含有相同的内容\nxt in ~/git-demo on master λ echo \"Hello World\" > a.txt\nxt in ~/git-demo on master λ echo \"Hello World\" > b.txt\n# 查看 Git 对象，此时没有 Git 对象\nxt in ~/git-demo on master λ tree -a .git/objects\n.git/objects\n├── info\n└── pack","language":"bash","uuid":"bb6d7649-c299-4935-acae-3c0322e73e85","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"将两个文件添加到暂存区，然后查看 Git 对象的数量"}]},{"type":"code-block","code":"xt in ~/git-demo on master λ git add .\nxt in ~/git-demo on master λ tree -a .git/objects\n.git/objects\n├── 55\n│&nbsp;&nbsp; └── 7db03de997c86a4a028e1ebd3a1ceb225be238\n├── info\n└── pack\n\n3 directories, 1 file","language":"bash","uuid":"b8eee0ff-658f-424f-9be5-8dfdd079d8c2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"此时会发现产生了一个 "},{"type":"formatted","text":"55","code":true},{"type":"formatted","text":" 的文件夹，包含一个 "},{"type":"formatted","text":"7db03de997c86a4a028e1ebd3a1ceb225be238","code":true},{"type":"formatted","text":" 的文件，其实二者应该合为一体看 "},{"type":"formatted","text":"557db03de997c86a4a028e1ebd3a1ceb225be238","code":true},{"type":"formatted","text":"，这串字符串就是这个 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象的 "},{"type":"formatted","text":"id","code":true},{"type":"formatted","text":"，我们统称为 "},{"type":"formatted","text":"oid(Object ID)","code":true},{"type":"formatted","text":"。这个 "},{"type":"formatted","text":"oid","code":true},{"type":"formatted","text":" 是使用算法生成的，它可以保证不同的内容有不同的 "},{"type":"formatted","text":"oid","code":true},{"type":"formatted","text":"，相同的内容有着相同的 "},{"type":"formatted","text":"oid","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以通过 "},{"type":"formatted","text":"git hash-object","code":true},{"type":"formatted","text":" 命令查看内容相对应的 "},{"type":"formatted","text":"oid","code":true}]},{"type":"code-block","code":"xt in ~/git-demo on master λ echo \"Hello World\" | git hash-object --stdin\n557db03de997c86a4a028e1ebd3a1ceb225be238","language":"bash","uuid":"375d2581-f4dc-437a-a234-2252d911f598","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了防止一个文件夹下的文件更多，以 oid 的前两位划分文件夹，将对象划分到 "},{"type":"formatted","text":"00-ff","code":true},{"type":"formatted","text":" 共 256 个文件夹中。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果直接查看 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象的内容，会发现不是以文本形式存储的"}]},{"type":"code-block","code":"xt in ~/git-demo on master λ cat .git/objects/55/7db03de997c86a4a028e1ebd3a1ceb225be238\nx\u0001K��OR04b�H����/�I�\u0002A�\u0006I%","language":"bash","uuid":"f068f9d5-41d0-41cc-a1da-23db1ff4cd37","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这是因为 Git 使用了 "},{"type":"formatted","text":"zlib","code":true},{"type":"formatted","text":" 对文本内容和对象的头信息(header) 进行了压缩, 为了真实还原我们存储的文本内容, 我们可以使用 "},{"type":"formatted","text":"git cat-file","code":true},{"type":"formatted","text":" 子命令来查看"}]},{"type":"code-block","code":"# -p 查看文件内容，并以美观的方式对文件内容进行输出\nxt in ~/git-demo on master λ git cat-file -p 557db03de997c86a4a028e1ebd3a1ceb225be238\nHello World\n# -t 查看文件类型\nxt in ~/git-demo on master λ git cat-file -t 557db03de997c86a4a028e1ebd3a1ceb225be238\nblob","language":"bash","uuid":"b4d99087-dd93-453d-b71b-7215a9aefaa4","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"tree 对象"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"如果文件对应到 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象，那么文件夹对应到的就是 "},{"type":"formatted","text":"tree ","code":true},{"type":"formatted","text":"对象，文件夹中包含的文件信息（文件名、修改时间等）均存储在 "},{"type":"formatted","text":"tree ","code":true},{"type":"formatted","text":"对象中。而我们的工作区就是一个 tree 对象，我们称为 "},{"type":"formatted","text":"root-tree","code":true},{"type":"formatted","text":"。"},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象中可以包含 "},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象和 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们执行 "},{"type":"formatted","text":"git commit","code":true},{"type":"formatted","text":" 的时候，Git 会生成一个 "},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象来存储当前工作区的快照，这个 "},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象就是 "},{"type":"formatted","text":"root-tree","code":true},{"type":"formatted","text":"，可以根据 "},{"type":"formatted","text":"root-tree","code":true},{"type":"formatted","text":" 推演出该仓库的所有内容"}]},{"type":"code-block","code":"# 创建一个文件夹 src，并新增一个文件 hello.txt\nxt in ~/git-demo on master λ mkdir src\nxt in ~/git-demo on master λ echo \"Hello\" > src/hello.txt\nxt in ~/git-demo on master λ tree\n.\n├── a.txt\n├── b.txt\n└── src\n    └── hello.txt\n\n1 directory, 3 files\n\n# 添加到仓库中\nxt in ~/git-demo on master λ git add .\n# 出现了一个新的 blob 对象，对应 hello.txt 的内容\nxt in ~/git-demo on master λ tree -a .git/objects\n.git/objects\n├── 55\n│&nbsp;&nbsp; └── 7db03de997c86a4a028e1ebd3a1ceb225be238\n├── e9\n│&nbsp;&nbsp; └── 65047ad7c57865823c7d992b1d046ea66edf78\n├── info\n└── pack\n\n4 directories, 2 files","language":"bash","uuid":"3d52e693-1496-4214-a2de-214f99ed21f9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"进行一次提交"}]},{"type":"code-block","code":"# 进行一次提交\nxt in ~/git-demo on master λ git commit -am \"first commit\"\n[master (root-commit) 94f8403] first commit\n 3 files changed, 3 insertions(+)\n create mode 100644 a.txt\n create mode 100644 b.txt\n create mode 100644 src/hello.txt\n# 查看对象\nxt in ~/git-demo on master λ tree -a .git/objects\n.git/objects\n├── 1f\n│&nbsp;&nbsp; └── 8946efd983ef493e28de287f5af69f862a6728\n├── 55\n│&nbsp;&nbsp; └── 7db03de997c86a4a028e1ebd3a1ceb225be238\n├── 8c\n│&nbsp;&nbsp; └── 3c7fbcd903744b20fd7567a1fcefa99133b5bc\n├── 94\n│&nbsp;&nbsp; └── f840300469b623c45d1c92ae1edbc2c39c466d\n├── e9\n│&nbsp;&nbsp; └── 65047ad7c57865823c7d992b1d046ea66edf78\n├── info\n└── pack\n\n7 directories, 5 files","language":"bash","uuid":"49dff3d2-ba44-417f-bc9a-7f7da2764476","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看到新增了三个对象，分别是一个 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象和两个 "},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象"}]},{"type":"code-block","code":"# 查看 commit 对象信息，包含 root-tree 对象的 oid\nxt in ~/git-demo on master λ git cat-file -p master\ntree 1f8946efd983ef493e28de287f5af69f862a6728\nauthor LastKnightCoder <lastknightcoder@gmail.com> 1677897217 +0800\ncommitter LastKnightCoder <lastknightcoder@gmail.com> 1677897217 +0800\n\nfirst commit\n\n# 查看 root-tree 对象的内容\nxt in ~/git-demo on master λ git cat-file -p 1f8946efd983ef493e28de287f5af69f862a6728\n100644 blob 557db03de997c86a4a028e1ebd3a1ceb225be238    a.txt\n100644 blob 557db03de997c86a4a028e1ebd3a1ceb225be238    b.txt\n040000 tree 8c3c7fbcd903744b20fd7567a1fcefa99133b5bc    src\n# 查看 src 对应 tree 对象的内容\nxt in ~/git-demo on master λ git cat-file -p 8c3c7fbcd903744b20fd7567a1fcefa99133b5bc\n100644 blob e965047ad7c57865823c7d992b1d046ea66edf78    hello.txt","language":"bash","uuid":"567f54de-0ea0-42cf-a370-5d243a0589c8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"commit 对象"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 记录了仓库的内容快照，但是还缺少一些信息，比如提交者，提交信息，提交时间，关联快照。这就需要 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象"}]},{"type":"code-block","code":"xt in ~/git-demo on master λ git cat-file -p master\ntree 1f8946efd983ef493e28de287f5af69f862a6728\nauthor LastKnightCoder <lastknightcoder@gmail.com> 1677897217 +0800\ncommitter LastKnightCoder <lastknightcoder@gmail.com> 1677897217 +0800\n\nfirst commit","language":"bash","uuid":"f75c4d2f-0501-45f5-8036-4ad2bd325c0e","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"xt in ~/git-demo on master λ echo \"# Readme\" > README.md\nxt in ~/git-demo on master λ git add .\nxt in ~/git-demo on master λ git commit -am \"second commit\"\n[master 90643a9] second commit\n 1 file changed, 1 insertion(+)\n create mode 100644 README.md\nxt in ~/git-demo on master λ tree -a .git/objects\n.git/objects\n├── 1f\n│&nbsp;&nbsp; └── 8946efd983ef493e28de287f5af69f862a6728\n├── 55\n│&nbsp;&nbsp; └── 7db03de997c86a4a028e1ebd3a1ceb225be238\n├── 68\n│&nbsp;&nbsp; └── 181b61e87b8766a6be442bf8ea52629308cbbf\n├── 8c\n│&nbsp;&nbsp; └── 3c7fbcd903744b20fd7567a1fcefa99133b5bc\n├── 90\n│&nbsp;&nbsp; └── 643a9ce0571aa37d5603cf861ae223796b84c8\n├── 94\n│&nbsp;&nbsp; └── f840300469b623c45d1c92ae1edbc2c39c466d\n├── e9\n│&nbsp;&nbsp; └── 65047ad7c57865823c7d992b1d046ea66edf78\n├── f3\n│&nbsp;&nbsp; └── 954314c1026028e77ea3a765aadefa67b45195\n├── info\n└── pack\n\n10 directories, 8 files\nxt in ~/git-demo on master λ git cat-file -p master\ntree 68181b61e87b8766a6be442bf8ea52629308cbbf\nparent 94f840300469b623c45d1c92ae1edbc2c39c466d\nauthor LastKnightCoder <lastknightcoder@gmail.com> 1677902228 +0800\ncommitter LastKnightCoder <lastknightcoder@gmail.com> 1677902228 +0800\n\nsecond commit","language":"bash","uuid":"25b1e5a7-ae98-4f83-b6ad-e9b4a5f8bd7f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二次提交发现新增了三个 Git 对象，分别是一个 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象，一个 "},{"type":"formatted","text":"root-tree","code":true},{"type":"formatted","text":" 对象，还有一个 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象对应新建的 README.md 文件。从第二个 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象中，我们可以看到提交的信息，包括作者，提交者，提交时间和提交信息，还能看到关联的提交 parent，指向了前一个 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果用一张图解释当前的 Git 对象的关系，应当如下所示"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/Git%E5%AF%B9%E8%B1%A1.69r1dw9bjcc0.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Git 是基于快照的版本管理，而不是基于增量，这就意味着如果你修改了文件，然后进行了提交，那么会生成一个新的 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象，相应的，包含该修改文件的文件夹对应的 "},{"type":"formatted","text":"tree","code":true},{"type":"formatted","text":" 对象也会重新生成。这就会带来一个问题，如果频繁的进行 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 的话，就会导致 "},{"type":"formatted","text":"blob","code":true},{"type":"formatted","text":" 对象的数目急剧增大，虽然频繁 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 是个好习惯，但是希望在进行 "},{"type":"formatted","text":"push","code":true},{"type":"formatted","text":" 或合并之前，合并一下多个 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":"，减少 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 个数。"}]},{"type":"header","children":[{"type":"formatted","text":"tag"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"tag","code":true},{"type":"formatted","text":" 通常用来记录被认为很重要的提交, 例如软件的发行版本。我们可以创建一个不带有任何额外信息的"},{"type":"formatted","text":" tag","code":true},{"text":"，Git 称这种类型的标签为轻量级 ","type":"formatted"},{"type":"formatted","text":"tag","code":true}]},{"type":"code-block","code":"xt in ~/git-demo on master λ git tag v1.0\nxt in ~/git-demo on master λ git cat-file -t v1.0\ncommit","language":"bash","uuid":"6ee70929-b799-4f39-af4e-7d677ad837e7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"轻量级 "},{"type":"formatted","text":"tag","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象无异，它不会保存额外的信息，就是一个 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一种标签称为附注标签，可以添加额外的信息，比如标签作者，邮箱等等，它是一个 "},{"type":"formatted","text":"tag","code":true},{"type":"formatted","text":" 对象"}]},{"type":"code-block","code":"xt in ~/git-demo on master λ git tag -a v2.0 -m \"v2.0\"\nxt in ~/git-demo on master λ git cat-file -t v2.0\ntag\nxt in ~/git-demo on master λ git cat-file -p v2.0\nobject b9e8d5d9952aea0baac5c19f4ebad48ba623b5f4\ntype commit\ntag v2.0\ntagger LastKnightCoder <lastknightcoder@gmail.com> 1677910987 +0800\n\nv2.0","language":"bash","uuid":"0842f143-581a-4e27-878d-f3c9f9d72b4b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"tag","code":true},{"type":"formatted","text":" 对象中除了保存了指向的 "},{"type":"formatted","text":"commit","code":true},{"type":"formatted","text":" 对象的 "},{"type":"formatted","text":"oid","code":true},{"type":"formatted","text":"，还保存了标签的一些信息。"}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://mp.weixin.qq.com/s/UTETcreecYfotJzlR1fAkw","openEdit":false,"children":[{"type":"formatted","text":"15分钟学会如何找到对象！阿里云程序员详解Git对象和引用原理"}]},{"text":"","type":"formatted"}]}]}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-3zvv3d_46d18b15-f245-4aac-b365-5a94c7b54b42.jpg","createTime":1704639871102,"updateTime":1743303640468},"meta":{"type":"article","publishTime":1764774821985}};
