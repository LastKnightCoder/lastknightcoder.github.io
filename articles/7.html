    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":7,"title":"远程访问 jupyter","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"最近又开始折腾了 jupyter 了，因为实验室的网络环境太差，每次我使用 conda 开启一个新的环境，然后下载一些新的包时会非常的慢，慢我还能忍，问题是经常下载失败，浪费我的时间😭，接着我想到我有一台腾讯云的服务器，我就想在服务器上下载 jupyter，然后远程访问。"}]},{"type":"header","children":[{"type":"formatted","text":"下载 Miniconda"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先需要下载 Miniconda，我没有下载 Anaconda，因为我不需要那么多的包，按需下载即可"}]},{"type":"code-block","code":"wget https://repo.continuum.io/miniconda/Miniconda3-latest-Linux-x86_64.sh","language":"Shell","uuid":"d65e5f9e-f261-450a-a8f8-0f109ce710ef","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果没有 "},{"type":"formatted","text":"wget","code":true},{"type":"formatted","text":" 命令，可以通过 "},{"type":"formatted","text":"yum -y install wget","code":true},{"type":"formatted","text":" 进行下载。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里下载了一个 shell 脚本，运行该脚本即可自动完成 Miniconda 的下载"}]},{"type":"code-block","code":"chmod +x Miniconda3-latest-Linux-x86_64.sh # 添加可执行权限\n./Miniconda3-latest-Linux-x86_64.sh        # 执行脚本","language":"Shell","uuid":"4d4afcc0-0aa9-4096-9b21-3a21e940c129","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在下载的期间会问一些问题，回答 yes 即可。安装完毕之后，重新进入命令行，输入"}]},{"type":"code-block","code":"conda -V","language":"Shell","uuid":"8f013648-c7a6-46b0-a369-10aaa90f4535","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果正确输出了版本号就说明下载成功了。"}]},{"type":"header","children":[{"type":"formatted","text":"下载 jupyter"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"下面我们新建一个环境，环境名就叫做 jupyter 好了"}]},{"type":"code-block","code":"conda create -n jupyter","language":"Shell","uuid":"9f1780b4-9a1e-495a-932b-37140a9f4196","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后激活环境"}]},{"type":"code-block","code":"conda activate jupyter","language":"Shell","uuid":"4924c78f-5a21-408c-aa6b-cde1c083977a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着下载 jupyter"}]},{"type":"code-block","code":"conda install jupyter","language":"Shell","uuid":"dfbbf2f0-cdb1-4320-afa4-522de13e69a2","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"配置密码"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们要远程访问 jupyter，就需要配置密码来进行登录，在命令行输入 ipython (下载 jupyter 的时候就已经下载好了 ipython) 便可以进入一个 python 交互式 shell"}]},{"type":"code-block","code":"ipython","language":"Shell","uuid":"03b5a973-a3ed-45a4-81be-72af4ad29fb0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"依次输入下面的命令"}]},{"type":"code-block","code":"from notebook.auth import passwd\npasswd()","language":"Python","uuid":"6aa5b969-7b2e-44fe-964e-39cee94c1678","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着便会提示你输入密码，输入密码后会给你一个密文字符串，如"}]},{"type":"code-block","code":"'sha1:43b95b731276:5d330ee6f6054613b3ab4cc59c5048ff7c70f549'","language":"Shell","uuid":"d4a5808b-2c46-4ca0-b8fe-af58ccfb8b5e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个密文字符串在 jupyter 的配置文件中会用到，先保存/复制下来。"}]},{"type":"header","children":[{"type":"formatted","text":"jupyter 配置文件"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"接着我们便要配置 jupyter 的配置文件，在命令行运行"}]},{"type":"code-block","code":"jupyter notebook --generate-config","language":"Shell","uuid":"5707c257-f400-4a7f-925d-2ba83c89a1e8","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"会生成 ~/.jupyter/jupyter_notebook_config.py 这个文件，我们打开编辑"}]},{"type":"code-block","code":"vi ~/.jupyter/jupyter_notebook_config.py","language":"Shell","uuid":"d96c76ba-6783-4f0b-9c14-907ecf32ceff","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在其中添加如下配置"}]},{"type":"code-block","code":"c.NotebookApp.ip='*' #设置远程访问 jupyter 的ip，*表示所有 ip 都可以访问\nc.NotebookApp.allow_remote_access = True # 允许远程访问\nc.NotebookApp.password = 'sha1:5df252f58b7f:bf65d53125bb36c085162b3780377f66d73972d1' #填写刚刚生成的密文  \nc.NotebookApp.open_browser = False # 禁止notebook启动时自动打开浏览器(在 linux 服务器一般都是 ssh 命令行访问，没有图形界面的。所以，启动也没啥用)  \nc.NotebookApp.port =8888 #指定访问的端口，默认是8888","language":"Python","uuid":"72504f4f-7ad5-4927-b9ee-1434d730b302","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"启动 jupyter"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"下面我们就可以在命令行输入如下命令启动 jupyter"}]},{"type":"code-block","code":"jupyter notebook --allow-root","language":"Shell","uuid":"77f24ad5-ce46-4544-a9ff-5e8ccabe19ba","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个命令启动后会在前台运行，如果我们希望 jupyter 在后台运行，我们可以运行下面的命令"}]},{"type":"code-block","code":"nohup jupyter notebook --allow-root > jupyter.log 2>&1 &","language":"Shell","uuid":"d5b8318a-99ab-4746-9590-5dc67f593db0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为我们便可以在本机通过服务器的公网 ip:8888 的方式来访问该 jupyter notebook。"}]},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"PS：如果你想在服务器停止 juputer，首先运行"}]},{"type":"code-block","code":"ps","language":"Shell","uuid":"98a6c875-ba9d-4e22-84a3-421f293dc377","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"该命令可以显示正在运行的进程，我们找到 jupyter 进程的 pid，然后通过"}]},{"type":"code-block","code":"kill -9 pid","language":"Shell","uuid":"98e39b3c-11b8-448a-a20a-709c2f8287f0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"来杀死 jupyter 服务，即可停止 jupyter。"}]}]},{"type":"header","children":[{"type":"formatted","text":"参考文献"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://www.jianshu.com/p/47ed480daccc","openEdit":false,"children":[{"type":"formatted","text":"linux 中安装miniconda"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://fuhailin.github.io/remote-jupyter-notebook/","openEdit":false,"children":[{"type":"formatted","text":"Linux上配置Jupyter Notebook远程访问"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://blog.csdn.net/weixin_42561002/article/details/85382922","openEdit":false,"children":[{"type":"formatted","text":"云服务器中让jupyter后台运行的方法(三)"}]},{"text":"","type":"formatted"}]}]}]}],"tags":["jupyter","远程访问","conda"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-3kp6yv_54cb5a30-75b4-4401-aa7a-12c947c4790d.jpg","createTime":1622805240000,"updateTime":1743303640462},"meta":{"type":"article","publishTime":1764820859515}};
