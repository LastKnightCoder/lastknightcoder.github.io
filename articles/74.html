nt-item:821":{"contentType":"document-item","refId":821,"href":"/docs/document/14/821.html","title":"0.37.0"},"document-item:823":{"contentType":"document-item","refId":823,"href":"/docs/document/14/823.html","title":"0.38.0"},"document-item:825":{"contentType":"document-item","refId":825,"href":"/docs/document/14/825.html","title":"0.39.0"},"document-item:827":{"contentType":"document-item","refId":827,"href":"/docs/document/14/827.html","title":"0.40.0"},"document-item:829":{"contentType":"document-item","refId":829,"href":"/docs/document/14/829.html","title":"0.41.0"},"document-item:831":{"contentType":"document-item","refId":831,"href":"/docs/document/14/831.html","title":"0.42.0"},"document-item:833":{"contentType":"document-item","refId":833,"href":"/docs/document/14/833.html","title":"0.43.0"},"document-item:835":{"contentType":"document-item","refId":835,"href":"/docs/document/14/835.html","title":"0.44.0"},"document-item:836":{"contentType":"document-item","refId":836,"href":"/docs/document/14/836.html","title":"0.44.1"},"document-item:847":{"contentType":"document-item","refId":847,"href":"/docs/document/14/847.html","title":"0.44.2"}},"content":{"id":74,"title":"2025 年终总结","author":"","content":[{"type":"header","children":[{"type":"formatted","text":"回顾"}],"disableDrag":false,"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"先看下去年定下的目标完成情况，只完成了一半 ... ..."}]},{"type":"check-list","children":[{"type":"check-list-item","checked":false,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"吉他能顺利的弹几首曲子"}]}]},{"type":"check-list-item","checked":true,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"运动和减肥，把体重保持在 120 斤"}]}]},{"type":"check-list-item","checked":false,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"精通 React 源码"}]}]},{"type":"check-list-item","checked":false,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"精研各种可视化技术（Canvas、SVG、WebGL）、精研动画"}]}]},{"type":"check-list-item","checked":false,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"输出 20 篇文章"}]}]},{"type":"check-list-item","checked":true,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"输出 50 张卡片"}]}]},{"type":"check-list-item","checked":true,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"读十本文学小说"}]}]},{"type":"check-list-item","checked":true,"children":[{"type":"paragraph","disableDrag":true,"children":[{"type":"formatted","text":"笔记软件支持思维导图，支持高级表格"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"先对没有完成的进行复盘："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"吉他自从离职后就再也没有练习过，实在是左手的和弦太难按了，挫败感有点强，感觉不到进步；离职在家后生活不规律，没有固定的练习时间，然后一旦丢了习惯，就很难捡回来了，搬家后更是都没打开过琴包"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在开始找工作的时间把《React 设计原理》看了五六遍，但是也不敢说精通，勉强应付面试，找到工作后基本就没有动力去学，这个不给自己找理由，制定了计划却没有执行，完全是畏难，这个一定要找到合适的办法改正"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我对可视化非常感兴趣，这个其实一开始有学 3D，应该也是离职后作息打断了，不规律导致很多习惯都断了，没有进一步的制作计划，这样就会导致总会避开去学习，对于这种有点困难的事情还是要制作计划强迫自己去做，去打卡，只要开始了，把习惯培养起来就没什么问题了"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输出 20 篇文章，实在是惭愧，把目标定的这么高，但是今年居然只写了一篇文章，还是非常简答的文章，实在是不应该这样，离目标太远了，一个原因是之前会直接形成一篇文章的内容被我写成了卡片，但是又没有形成体系去写一篇文章，另一个就是文章毕竟是需要深挖的，今年的确没有深挖技术，自从使用上了 AI，脑子都动的少了，基本功都快丢了，之前看到一句话"}]},{"type":"blockquote","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"很多以前信手拈来随手就可以写出来的代码，现在没有 AI 就啥都不想干了。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"简直就是我的真实写照了，真的没有 AI 我现在都不想开始写代码，这是好事还是坏事，有 AI 我的效率的确提高了非常多，但是也形成了非常强的依赖，动脑思考的时间少了，能力提升的也很慢，但是你让我不用，实在是不可能了，争取在这两者之间达到一个平衡，现在离开 AI 就完全没法干活了，极度失衡"}],"disableDrag":false}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"经过以上复盘，我发现对于比较难的事情，比如深挖技术，还是需要清晰的下一步行动计划，不能靠意志力去做这件事情，因为人总是趋易避难，而且人会放大困难，导致难以轻易踏入，得奔着遇到问题解决问题的思路，先淌进去这趟浑水，遇到问题解决问题，这样才能快速进步。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"完成的 Flag："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"运动和减肥，今年其实有两次减肥的阶段，一次是 2 月份到 4 月份，两个月不到，减到了 115 斤，但是中间很快就反弹了，到了十月份，已经反弹到了 135 斤，然后从 10 月初到 11 月底，也是两个月不到，减到 118 斤左右，然后停止了，目前感觉又在暴饮暴食，有反弹的趋势了，要开始注意这方面了，不能反复，有点打击人，不过总体还是满意的，达成了目标，减肥的那段期间每天早起运动，吃的也少，实在有点难熬"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"看了一本和控制血糖有关的书《控糖革命》，这本书的观点还是蛮让人启发的，改变饮食顺序居然对血糖的影响这么大，但是我没有很好的实践，因为我吃什么都是点外卖，没啥蔬菜😂"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输出 50 张卡片，年初是 437，现在是 547，增加了 110 张卡片，远超目标，但是我觉得其实可以做的更好，大部分的卡片都是在四月份找工作的时候记的，其余时间都记得不大，每个月三四张左右，我觉得有非常大的改进空间"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_942dcf39-d50d-4241-8df0-a620f272df0e.webp","uuid":"a7603aed-2201-4c37-82dd-896476078ddb","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_942dcf39-d50d-4241-8df0-a620f272df0e.webp","width":464.8545453561785}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"关于读书，读书的习惯还是保持的不错，今年也是阅读了有五六十本书，阅读的很多都是传记和文学书，对于专业书阅读的少了很多，也是趋易避难，另外一个原因也是没有方向，不知道读什么书，最好的办法还是要根据自己的项目、自己面临的问题、自己想了解的领域去读书，不能为了强行读书而读书，因为我花在构建自己知识体系、深挖技术的时间少，所以导致这方面的书也看的少，这部分希望来年改善"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"笔记软件的进展完全就是"},{"type":"formatted","text":"超超超预期","bold":true},{"type":"formatted","text":"，完成了相当多的功能，这是我去年定下这个目标完全没有想到的，自从接触到 AI 写代码之后，笔记软件的代码数量从 5w 膨胀到了 35w，那 5w 行代码是我手写了接近两年的工作量，这意味着今年是我过去两年工作量的六倍，如果按照之前的速度纯手写，我要写十二年！"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"AI 带来的效率根本无法想象，并且因为 AI 写代码太快了，带来的反馈也很强烈，导致花更多的时间在笔记软件开发上，上面很多任务没有完成，有很大一部分原因就是我把时间基本都投入到笔记软件开发上了，时间实在是不够用。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"高投入带来高回报，笔记软件完成了非常多的功能："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"架构迁移，从 Tauri 迁移到 Electron，Tauri 在 Mac 上还是有很多问题，升级到 Electron 后再也不用头疼了"}]}]},{"type":"list-item","allContent":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"编辑器能力增强"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"typst，plantUML，tikz，charts 等各种绘图插件"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"已有插件能力完善"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"图片能力完善，裁切，对齐，缩放，描述等"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"列表 tab 快捷键强化，支持 emoji 图表"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"... ..."}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持 Tailwind 动态样式注入"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持 React 模板中心"}]}]}]}],"isFold":false,"children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"编辑器能力增强"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"typst，plantUML，tikz，charts 等各种绘图插件"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"已有插件能力完善"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"图片能力完善，裁切，对齐，缩放，描述等"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"列表 tab 快捷键强化，支持 emoji 图表"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"... ..."}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持 Tailwind 动态样式注入"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持 React 模板中心"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"同步系统"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持多种同步方式，Github，S3，WebDav"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持同步本地文件内容"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"白板完善，支持了很多新的元素，以及交互上的完善"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"思维导图，没有想象中的难，花了一个下午就把核心布局算法实现了"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"Frame，Column，为元素进行分组，两组不同的组织形式"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持在白板内嵌套白板，这部分是参考了 Milanote，可以在白板间形成关系"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持草图风格，向制作出类似于 Exclidraw 风格的元素"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"数据库"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"类似于 Notion 的数据库，目前支持表格、画廊、日历和看板视图，除了笔记之外，还有一些资料需要管理，比如收藏的文章，收藏的博主，账号管理，通过表格整理的方式还是比较直观，目前卡片也支持了数据库的视图"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这部分可能对 J 人有用，我纯纯的 P 人，就只是用来收集点资料，完全不会作为规划的工具"}]},{"type":"highlight-block","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"一开始这个功能完全让 AI 去写，实在是太贪心了，对于这种复杂的设计，AI 还是 hold 不住，很难一步到位，如果一步不能到位，这些中间结果除非你仔细阅读并了解其实现思路（有可能是错的思路），否则根本是用不了的，也不敢用，而且现在效率这么高，时间这么宝贵，哪里舍得花时间去 Review 呢，所以从一开始我们就要设计好架构，让 AI 去填空，而不是创造，AI 模仿能力去非常强的，所以最好的架构就是插件架构，AI 根据已有插件实现新的插件简直不要太容易，但是很考验代码架构的设计能力了。"}]}],"color":"blue"}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"Markdown 导入导出的支持"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"实现了类似于 Typora 的所见即所得的编辑器，这是我一开始准备写这个软件的初衷，也是终于完成了，因为支持 Markdown 的导入，也能非常方便的接入很多 AI 的能力。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"目前遇到的难点是在编辑视图和源码视图，光标位置精准映射的问题，如果能解决这个问题，对于编辑器扩展 AI 功能有很大的想象空间，毕竟 AI 输出的是纯文本，直接让其输出 JSON 这样的数据结构出错的概率还是很大的，直接输出 Markdown，然后解析为我们的格式，如果能知道映射关系，就能精准的插入，实现精准编辑"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"AI 能力集成"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"向量数据库，通过嵌入模型将内容变成向量，存储到向量数据库中，由于 AI 对语义的精准把控，其相关性搜索比关键词搜索效果要好太多，目前已集成到全局搜索、相关内容搜索以及聊天的知识库增强，将私有知识库作为聊天的数据源，可以更精准的回答问题"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"聊天支持工具调用，内置了十几个工具，比如查询日记，查询日历等等，相当于你的私人管家，你可以问它日程安排，也可以问某年某月你在哪里，和谁在一起，正在做什么，甚至可以在聊完一个技术点之后，直接生成灵感笔记"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"同时聊天也支持更多模态的输入，不仅仅是文字，还支持图片、PDF，未来还会支持音视频"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"网页剪藏"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持使用 AI 将网页支持转为 Markdown，然后解析富文本格式，精确度非常的高，不仅不用害怕网页突然下线，还可以基于已有的编辑能力对内容进行批注，甚至可以接入 AI，基于文档内容进行对话，更好更快速的理解内容"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"另外意料之外的一个能力，往往我们在看外文文章时，需要边翻译边看，现在利用 AI，可以在解析为文档的同时，还能进行翻译，让语言不在成为问题"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"音视频转录，支持使用本地音频转录模型提取音频内容，并且能提取精确的时间戳，之后还可以利用 AI 对转录的内容进行总结，可以快速概览内容，找到重点"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"播客生成，先使用 AI 对文档进行理解，生成多人播客的脚本，然后使用 TTS 的能力生成语音并且进行合并，有的时候发现不想看笔记，但是听音频还是能听下去的，对我来说是一个不错的学习和复习手段"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"闪卡生成，让 AI 基于文档，生成闪卡，之前看到一本书，提取是激活神经元效率最高的一种方法，而测验无疑能极大的激发用户对掌握的知识的提取，通过间隔复习，可以不断强化神经元的连接"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我的目标是做一个类似于 NotebookLM 的产品，集成向量数据库、支持多模态的数据输入、可以根据项目中的所有资料与 AI 对话，并且可以根据内容生成播客、闪卡、测验、PPT 等等，以加快信息处理的效率"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"日记、日历、待办、进度管理、番茄钟，集成了大量效率工具，这部分和笔记管理无关，主要是个人事项的管理，不过有很多也是可以和笔记联动，每个功能之间都会有连接"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"发布系统"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"支持将卡片、文章、项目、数据库作为网页发布，可推送到 Github Pages 或 S3 上，也是一直想做的功能，一开始还想动态构建，发现实在太复杂了，中间毙了好几次，不过有一次 AI 给了我灵感，可以先准备一套模板，就直接取 window 上的数据，提前构建好模板，然后在编译实际的内容时，根据不同的内容选择不同的模板注入数据，又快又稳又好。"}]}]}]}]}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"关于工作"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"三月份，收到了裁员通知，有点意外又有点不意外。不意外的点在于，去年我就和 leader 提过一次离职，已经被打上了不稳定的标签，留我无益；意外的点在于，我不是最差的，甚至自我认为还是比较优秀的，从能力上看不应该是我。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"不过对我来说是件好事，在此之前我就在偷偷准备面试了，如果能拿一笔补偿再走，这不白赚一笔嘛。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"回想在阿里的两年半，坚持不忍直视，压力爆炸，毫无夸张的讲，后期每个周末都没法好好休息，可以说每天都在焦虑下周的事情，想着有几个 bug 没解完，也没有思路，下周又要和谁打交道，好麻烦，又要写方案设计，又要挨喷，每个周日晚上都会失眠，因为一闭眼再次睁开就要去上班了，舍不得睡，根本没有办法去好好的享受当下，为此我特意买了本书《当下的力量》，这本书看了两遍，看的时候有点用，但是当事情发生的时候，那种焦虑感又涌了上来，有一段时间想到我还要这么打工 40 年，怎么撑的下去，只有一个字熬。现在去回想当时的状态都是心有余悸。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"因此本想着离职后好好休息一两个月，但是一时竟不知道干什么，我也不喜欢旅游，唯一的爱好开发我的笔记软件，但也总有厌倦的时候，所以就开始投递简历，疯狂面试，每天看各种八股文，挖掘自己的项目，看看有哪些值得说的，如何表达让面试官觉得是个亮点，从一开始的一开始面试就紧张到流汗，到后面一面二面没有什么压力了，不过面试还是有点难熬的，特别是在等面试结果的时候，不过好在有惊无险，大部分的面试都通过了"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2b247684-8c6a-48c2-bf43-a0cf5b3c2a4d.webp","uuid":"682cd509-c32a-49fb-aa24-76c9daeceaa3","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2b247684-8c6a-48c2-bf43-a0cf5b3c2a4d.webp","width":1104},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"手里面拿了好几个 offer，现在是幸福的烦恼了，因为拿到 offer 的时间都不一样，只能靠拖来等各家的价码都出来，最终留下了两家，字节和另一家小公司，按道理说这还有啥选的，肯定选字节啊，其实我一开始也是想选的，但是一直被这家公司的 WLB 所打动，一直摇摆不定，直到这家小公司邀请我去现场感受下，我其实在上飞机之前还是倾向于字节的，因为大公司，薪资也不错，这边还不知道给什么价码，不过我到了现场之后，才发现和我想象的小公司完全不一样，办公区、办公设备完全是大厂的配置，甚至更好，而且氛围也不错，也不加班，有稳定的赚钱业务，基本上不会裁员，我心动了，在和 HR 进行一番薪资谈判后，给的钱还是很有诚意的，总包比字节少一点，但是从时薪算，完全是赚的，想到之前那种压力爆棚的状态，实在不想去大厂感受这种压力爆炸的状态，我第二天就签了 offer。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"现在也在新公司待了半年有余了，真的不加班，每天到点打卡就下班了，以前我觉得打卡不好，一点都不自由，但是现在我发现打卡的好处了，到点打卡就可以下班，虽然大厂上班不打卡，但是下班也不打卡呀，有点恐怖了。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"之前在阿里上班，一到傍晚的时候就偏头痛、腰痛，现在基本没有发生过，换了环境，毛病都少了很多，之前看的那么多书怎么调解自己，真不如换个环境，啥毛病都没有，现在也不焦虑了，只是偶尔有时候不想去上班，"},{"type":"emoji","emoji":"stuck_out_tongue_winking_eye","nativeEmoji":"😜","shortcodes":":stuck_out_tongue_winking_eye:","defaultOpen":false,"children":[{"type":"formatted","text":""}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在这里有点不太适应的是没啥朋友，组本来人就少，志同道合能交心的就更少了，还是比较怀念刚毕业一同入职的小伙伴，这真是战友情了。"}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"关于学习的思考"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"今年开始对学习方法有很多的思考，正在摸索知识管理的 SOP，我对于输入有一个比较好的处理，但是对于信息处理和输出做的不太好，现在想结合 AI 把信息处理这部分做的更加简单，输出这部分希望在前两步做好之后是一件水到渠成的事情，但是这是最需要动脑的部分，恐怕没那么简单，现在就是要想办法让自己能持续的输出，形成习惯和标准，而不是零零散散、毫无章法的状态。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"目前我粗略的想法是："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输入"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"各种输入来源，包括电子书，实体书，视频，音频，文章等，这一部分只要求产生思考，产生问题，不要求在看完后立刻写出笔记，而是将不懂或者引发思考的部分收集起来，放入问题管理中。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这样做解决了什么问题？以往总是要求自己写读后感，记笔记，否则这件事情就感觉白做了一样，但是立即写读后感很难，因为就是没有那么深的感悟；而记笔记，如果只是机械的记忆，不经过脑子，那记了也是白记，重点在于要让神经元激活，让脑子转起来，记笔记的一个坏处就是，记的笔记和当前参考的资料高度相关，脱离了资料可能笔记都没有意义，以及资料的片面性，只代表了一部分观点，总而言之，笔记和资料绑定了。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"另外如果我不要求必须产生输出，那么就减少了负罪感，就会降低我做这件事情的门槛，做总是比不做好的，看了书总比不看好的，总儿言之，能快速行动。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"那不要求记笔记、写读后感，会相当于白读吗，不会，因为我要求在这个过程中记录问题、不懂的概念、不同的想法、令人深思的表述等，统统可以记下来，沉淀到问题管理体系中，输入的这一步就完成了。"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"信息处理"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"根据问题管理中问题和想法进行广泛的资料收集，以及询问 AI，我的想法是在这个过程中可以借助项目和白板来帮助消化和组织内容"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"项目，也就是我预期的 NotebookLM，将你收集的所有资料都放在一个地方，然后使用嵌入模型对资料进行向量化，然后你就可以随便的使用 AI 对收集的资料进行提问，甚至让 AI 生成测试题，生成播客，生成视频来加速你对信息的消化"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"白板，通过白板，可以更加直观的将材料进行连接，发现相互支撑或者相反的观点，激发头脑风暴，引发思考"}]}]}]},{"type":"highlight-block","disableDrag":false,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"这二者甚至可以共享资料源，一份资料的不同视图，各有用途。"}],"disableDrag":false}],"color":"green"},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这部分的产出是永久卡片，不论是和 AI 不断交互，还是在尝试建立资料间联系，都是在主动学习，在主动学习的状态下，非常容易激活大脑的神经元，产生思考，把这些模糊的思考写下来，让其变得清晰"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"构建知识体系"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在输出卡片的时候，我们需要为卡片和已有的卡片建立"},{"type":"formatted","text":"联系","bold":true,"color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"，当我们为卡片建立联系后，如果我们为其建立图谱，我们可以发现有些卡片会聚集在一起，这些聚集在一起的网络就是卡片自下而上形成的主题"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4a7cf2d5-5589-4468-8220-f763ac3b960a.webp","uuid":"3a13fda8-d907-4a72-be32-78fd9c408d42","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4a7cf2d5-5589-4468-8220-f763ac3b960a.webp","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候，我们可以对聚集的网络或游离的卡片进行查漏补缺，去主动的发现缺失的部分并进行补全，也可以继续深入某个主题，产生更加深刻的洞见，不断壮大网络。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这些卡片就像是人脑的神经元一样，卡片之间的连接就像是神经元之间的通路，对于人类的大脑来讲，我们学习的本质就是在形成新的神经连接，神经连接越多，我们就能快速的从信息中提取出内容，一眼看出本质，产生令人惊叹的直觉，同理卡片之间的连接越多，我们通过其可以达到同样的效果，这个卡片网络就是我们的知识体系，也是我们的第二大脑。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"只要我们每次在添加卡片时，"},{"type":"formatted","text":"都去考虑和已有的卡片的联系，产生新的连接","bold":true},{"type":"formatted","text":"，那么随着卡片数量的增多，我们的第二大脑会越来越强，我们的知识体系在有序的生长。否则如果只是机械堆积卡片而不产生联系，卡片数量越多越是趋于无序，卡片之间无法形成知识体系，得到的是一团浆糊，这种情况下接收到信息后，信息无法在卡片之间流动，自然就无法提取出什么内容，越多越乱，根本无法为我所用。"}]}]}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"关于 AI 的冲击"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"今年可以认为是 AI 编码的元年。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在去年，只有像 Github Copliot 这样的产品，它提供的能力是在你写下代码的时候，模型根据上下文推断出你会输入的内容，你只需要按下 tab 即可进行补全，现在看来是一个不起眼的功能，但是在当时，我觉得效率提升非常多，已经有轻度依赖，有的时候我会等待 AI 给出提示，然后我按下 tab 就行了。不过这个时候还是完全以人为主导，对于完全把事情交给 AI，几乎是不可能的。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"除了 Github Copliot 这款产品，那个时候还会频繁听到 Cursor 这款产品，它的 tab 能力更强，它不仅可以预测你下一个会输入的内容，甚至可以预测你还会修改哪里，一直按 tab 就可以完成一连串的修改，相比于 Github Copliot 又是一次效率提升，我赞不绝口，在内部会议上也是多次提及。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"那个时候 Cursor 已经提供了 Agent 能力，但是我觉得为时尚早，模型还没有那么厉害，对 AI 自动写代码这件事情完全不信任，因此这个能力我连试都没试。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"直到今年春节，DeepSeek R1 问世，震惊国内外，当时我正在重构我的编辑器架构，牵涉到大量的 Rust 代码迁移到 Node，本着试一试的想法，我就试了试开源的 Cline 接入 DeepSeek 帮我进行代码迁移，的确节省了我一大把时间，特别是关于 SQL 迁移那块，但是也有很多错误，还是不能够完全放心，对于困难的工作还是无法完成，也没放在心上。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"后面经历了两件事情，让我对 AI 的能力有了新的认识："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"问了 DeepSeek 一道我经历过的面试题，这道面试题卡了我很久，结束面试后进行了复盘，并且想出了「我自认为正确」的解法，之前让各种模型都试过，包括 GPT，给出的代码都不能满足需求，但是我给 DeepSeek，经过一番思考后，它给出了正确的解法，并且让我意识到我之前的解法问题所在，我开始觉得模型的能力比我厉害了"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在开发一个项目的时候，服务端有一套轨迹点压缩算法，不过是用 Java 写的，我需要将其迁移为 JavaScript，这个算法我是完全不懂，搜了也看不懂的那种，于是试着让 DeepSeek 试了下，手动的复制了所有相关的 Java 代码输入给了它，让它输出 JavaScript 的代码，当然没有一次成功，但是折腾了半天，它写出了正确的代码，跑通了测试用例，我看到输出的 JavaScript 的代码，其中包含各种二进制的操作，以及 Java 和 JavaScript 二进制表示的不同的注释，我觉得给我一两个礼拜我都未必能写出来，但是 DeepSeek 只用了半天"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"经过这两件事情，我对 AI 的能力开始正视起来，我觉得它已经有超越我的能力了，它是不是真的可以不要人类的参与去写代码了，虽然直接试过 Cline + DeepSeek 的组合，效果不尽人意，不过我还是决定尝试更强的 Cursor 的 Agent 能力，在淘宝花了 20 大洋买了个账号，没想到这一试就再也回不去了。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我将其用到了我的笔记软件项目中，具体开发的什么功能我已经忘记了，我就记得当时使用的模型是 Sonnet 3.5 和 Sonnet 3.7，给我的震惊很大，之前脑子里充满了各种想法，但是没时间做，或者说舍不得投入时间去做，现在可以直接让 Cursor 完成。我越用越兴奋，真的是暗无天日的用 Cursor 开发了半个多月，每天起来第一件事就是写代码，直至上床睡觉，直到有一天我意识到我要投简历了，我才减少投入的时间。我记得在使用之前，我的简历上写的是我的编辑器项目代码行数是 5w+ 行，等过了一个月，我把它更新为了 10w+ 行，嗯，是的，一个多月顶我过去接近两年的开发量，AI 就是这么恐怖。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这个时候 AI 写的代码我还是会去进行 Review 的，毕竟有的时候还是不靠谱的。不过随着不断的磨合，我开始了解 AI 擅长什么，不擅长什么，并且随着模型能力的越来越强，大部分的时候就是一直 Keep 就行，我感觉我从一个软件开发工程师变成了一名软件测试工程师，生成完代码后看看功能好不好使，看看控制台有没有报错，有的话就贴给它，让它继续根据错误修改。只有在它搞不定的时候，比如一个开发一个比较复杂的新功能，没有代码参考，我需要先进行架构设计，或者让它进行计划，我看下计划有没有问题，不断的交互，不断修改计划，直到输出一份我满意的计划，然后按照计划开干。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我现在开发新功能有更好的办法了，找一个开源项目，下载到本地，让它探索项目，输出一份计划，这种模仿的能力 AI 超强，基本上都是没问题的，因此开发新功能也是飞快。到了现在，我的编辑器代码行数已经来到了 35w+，代码的增长速度似乎没有随着项目的增大而变缓，它们已经进化到可以驾驭大型项目了，当然也是有我一直在把关，没有让代码腐化，如果一开始就设计好架构，只是让 AI 填空的话，代码不会变烂，而且随着模型变强，写的代码也更好了。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"正如我上述所说，我大部分的时间不是软件开发师，小部分时间的架构设计，大部分时间的软件测试，至于写代码的时间，可以忽略不计，因为如果我知道怎么写的话，完全可以把步骤讲明白指挥 AI 去写，干嘛要我手动写，写的又没有 AI 快。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"所以在这个 AI 的时代，我们的竞争力是什么，我觉得是架构能力、深入技术底层的丰厚内功能力，就像是那个故事，一个工程师花了一个小时，画了一条线，收了一万美元，知道在哪里画这条线值 9999 美元，画线只值一美元，在 AI 时代，只有架构能力强，内功强，才知道怎么做，做什么，这块能力值 9999 美元，而具体怎么做，AI 完全可以胜任，做的部分已经不那么重要了，因此价值变得低了，并且价值会越来越低，如果想在这块去和 AI 竞争，那真是难以望其项背。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"只有当你知道的比 AI 知道更多的时候你才能指挥它，一旦它开始超越你，拥有比你强的架构能力，或者它生成的内容你已经无法判断对错的时候，也许就是淘汰的时候了，这个时候有多久呢，我学习架构的能力能追的上它进化的速度吗？"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"程序员这个职业不会消失，但是可以预见的是，这个行业需要的人会越来越少，因为一个人半年的工作量可以顶以前十年的工作量，或者说顶 20 个人半年的工作量（考虑到沟通等损耗，甚至不止 20 个人），也许每家公司只会有几个资深的架构师，每天制定方案指挥 AI 干活，然后 Review 代码，不行就打回重写，可以就继续迭代，说不定程序员会以这种方式结束 996 😂。"}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"关于未来的计划"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"虽然计划总是赶不上变化，但以终为始，日子得有个盼头："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"维持体重，现在 120 斤左右的体重蛮好的，不要胖回去了"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"培养兴趣爱好，不要每天写代码了，多个人打打交道，多出去走走，不行报个班学学"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"笔记软件的大部分功能都开发的差不多了，还有几个需要打磨的就留给明年了"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"移动端支持，我比较中意 Tauri，但是项目跑不起来也是伤，希望明年能搞定"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"类 NotebookLM，实现 Vibe Learning"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"争取在三周年的时候开源，结识到新的朋友，一起完善项目"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"学习方面，说实话，AI 的发展速度让我不知道学习什么有用，有点意兴阑珊了"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"AI，我现在对使用 AI 去完成之前做不到的事情比较感兴趣，去尝试构建一些 Agent 解决问题"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"开源项目，正如我之前所说，在 AI 时代，真的需要的是架构能力，解决问题的能力，而培养架构能力就是去看优秀的开源项目，因此未来会去深入研究开源项目源码"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"React"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"Vue"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"动画"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"以前老想着系统学习 CSS，完全没有必要，够用就行，把时间花在感兴趣的部分"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我对实现各种动画就非常感兴趣，多学习一些案例，看看人家实现动画的思路"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"3D，不是 3D 开发，而是建模，我想学 Blender，真的一直想学"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"工作，工作就很佛系，涨薪目前看不太可能，晋升，那更不可能，根本没有职级，就希望明年没有啥幺蛾子，让我平平淡淡的度过，我对能从工作中收获什么不抱有希望，别折磨我就行"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"可以尝试学习课程制作，之前的梦想就是想当老师，之前还想过直播当老师呢，可以学习一些制作动画什么的，做一些教程"}]}]}]}],"tags":[],"bannerBg":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-yqqvv7_535e766a-9c77-442f-bc5a-f506a064ac68.webp","createTime":1766304206355,"updateTime":1766323814555},"meta":{"type":"article","publishTime":1777775444273},"settings":{"appearance":{"image":{"borderRadius":"md","shadow":"sm"}}}};
