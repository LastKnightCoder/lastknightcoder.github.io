}\nx_2 - x_1 &= (x - \\text{newMinX}) - (x - \\text{minX}) &= \\cfrac{\\text{offsetX}}{\\text{zoom}} \\\\\ny_2 - y_1 &= (y - \\text{newMinY}) - (y - \\text{minY}) &= \\cfrac{\\text{offsetY}}{\\text{zoom}}\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"得到"}],"disableDrag":false},{"type":"block-math","tex":"\\begin{aligned}\n\\text{newMinX} &= \\text{minX} - \\cfrac{\\text{offsetX}}{\\text{zoom}} \\\\\n\\text{newMinY} &= \\text{minY} - \\cfrac{\\text{offsetY}}{\\text{zoom}}\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"缩放"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"要实现缩放，只需要改变视口大小与 CSS 大小的比例关系即可。设 SVG 的 CSS 宽高为"},{"type":"inline-math","tex":"(\\text{width}, \\text{height})","children":[{"type":"formatted","text":"(width, height)"}]},{"type":"formatted","text":"，要实现 "},{"type":"inline-math","tex":"\\text{zoom}","children":[{"type":"formatted","text":"zoom"}]},{"type":"formatted","text":" 倍的缩放，那么只要将视口的宽度和高度设置为 "},{"type":"inline-math","tex":"(\\dfrac{\\text{width}}{\\text{zoom}}, \\dfrac{\\text{height}}{\\text{zoom}})","children":[{"type":"formatted","text":"(\\frac{width}{zoom}, \\frac{height}{zoom})"}]},{"type":"formatted","text":"﻿即可。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们希望在进行缩放时，某个点相对于视口保持不变呢，考虑一个场景，在滚动滚动时我们缩放画布，但是希望此时鼠标所在的点相对于视口是不变的"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/%E7%BC%A9%E6%94%BE_1e144945-7fad-4082-9ac4-c23f6f2b9cd5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/%E7%BC%A9%E6%94%BE_1e144945-7fad-4082-9ac4-c23f6f2b9cd5.png","width":671},{"type":"paragraph","children":[{"type":"formatted","text":"假设以点 "},{"type":"inline-math","tex":"(x, y)","children":[{"type":"formatted","text":"(x, lientX,\n         y: e.clientY,\n       }\n    }\n    \n    const handlePointerMove = (e) =\u003e {\n      if (!startPosition || !boardContainer || !board) return;\n      const { width, height } = boardContainer.getBoundingClientRect();\n      const endPosition = {\n          x: e.clientX,\n          y: e.clientY\n      }\n      const offsetX = endPosition.x - startPosition.x;\n      const offsetY = endPosition.y - startPosition.y;\n      const newMinX = minX - offsetX / zoom;\n      const newMinY = minY - offsetY / zoom;\n      board.setAttribute('viewBox', `${newMinX} ${newMinY} ${width / zoom} ${height /zoom}`);\n    }\n\n    const handlePointerUp = (e) =\u003e {\n      if (!startPosition || !boardContainer || !board) return;\n      const { width, height } = boardContainer.getBoundingClientRect();\n      const endPosition = {\n          x: e.clientX,\n          y: e.clientY\n      }\n      const offsetX = endPosition.x - startPosition.x;\n      const offsetY = endPosition.y - startPosition.y;\n      const newMinX = minX - offsetX / zoom;\n      const newMinY = minY - offsetY / zoom;\n      board.setAttribute('viewBox', `${newMinX} ${newMinY} ${width / zoom} ${height /zoom}`);\n      minX = newMinX;\n      minY = newMinY;\n      startPosition = null;\n    }\n    \n    const handleWheel = (e) =\u003e {\n      if (!boardContainer || !board) return;\n      e.preventDefault();\n      const { width, height, x: containerX, y: containerY } = boardContainer.getBoundingClientRect();\n\n      const x = e.clientX;\n      const y = e.clientY;\n\n      const offsetX = x - containerX;\n      const offsetY = y - containerY;\n      let newZoom;\n      if (e.deltaY \u003c 0) {\n          newZoom = Math.min(zoom * 1.1, 10);\n      } else {\n          newZoom = Math.max(zoom * 0.9, 0.1);\n      }\n      const newMinX = minX + offsetX * (1 / zoom - 1 / newZoom);\n      const newMinY = minY + offsetY * (1 / zoom - 1 / newZoom);\n      board.setAttribute('viewBox', `${newMinX} ${newMinY} ${width / newZoom} ${height / newZoom}`);\n      zoom = newZoom;\n      minX = newMinX;\n      minY = newMinY;\n    }\n    \n    boardContainer.addEventListener('pointerdown', handlePointerDown);\n    boardContainer.addEventListener('pointermove', handlePointerMove);\n    boardContainer.addEventListener('pointerup', handlePointerUp);\n    boardContainer.addEventListener('wheel', handleWheel);\n    \n    return () =\u003e {\n      if (boardContainer) {\n        boardContainer.removeEventListener('pointerdown', handlePointerDown);\n        boardContainer.removeEventListener('pointermove', handlePointerMove);\n      \tboardContainer.removeEventListener('pointerup', handlePointerUp);\n      \tboardContainer.removeEventListener('wheel', handleWheel);\n      }\n    }\n  }, [])\n  \n  return (\n  \t\u003cdiv ref={containerRef} style={{ width: '100%', height: 500, border: '2px dashed #aaa' }}\u003e\n      \u003csvg ref={svgRef} width=\"100%\" height=\"100%\"\u003e\n        \u003crect x=\"100\" y=\"100\" width=\"200\" height=\"100\" fill=\"#e77c8e\" fill-opacity=\"0.5\" /\u003e\n      \u003c/svg\u003e\n    \u003c/div\u003e\n  )\n}\n","children":[{"type":"formatted","text":""}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/tomas-malik-FvdhbmLx9eI-unsplash_da8d2df2-e526-4ed2-be2b-27b8b8fe307d.jpg","createTime":1727101716586,"updateTime":1765546300532},"meta":{"type":"article","publishTime":1767266229546}};
