及这些变化是如何发生的。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"​​​​​具体地说，要学习，人们必须改变自己的大脑，更具体地说，是必须改变大脑的神经连接。","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"人的大脑中大约有 850 亿个神经元，其数量在胎儿期就已经生成，在出生后总量基本不会发生变化，但是"},{"type":"formatted","text":"​​​​​神经连接是可以改变的，并且是高度可变的","bold":true,"textGradient":"ocean"},{"type":"formatted","text":"。","textGradient":"ocean"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"通过学习和训练可以形成新的连接或加强已有的连接，这就像在一片茂密的森林中行走。原本没有路，但如果你不断重复走同一条路线，杂草会被踩平，小径会变宽，最终变成一条高速公路。"},{"type":"formatted","text":"走不存在的路就是在尝试​​​​​形成的新的连接，而重复的走这条路线就是在加强神经连接。","textGradient":"ocean","bold":true},{"type":"formatted","text":"对于不常使用的技能，即使原来是一条小径，因为不常光顾，导致杂草丛生，原本的小径再次长满杂草，使得小径变得越来越窄，越来越难以通行，同样对于大脑连接也是，不常被激活的神经元连接会逐渐减弱甚至被大脑裁剪掉以节省能量，从而产生「遗忘」。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这个时候你可能会想问一个问题，这些相互连接的神经网络到底是怎么起作用的呢？为什么一段文字、几串音符能唤起我们丰富的情感与想象？"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"实际上，我们脑中的神经网络是以分层的形式去处理信息的，当我们接收到外部的信息时，最直接的就是物理刺激，比如光线和声音，光线和声音造成的刺激会激活一些最底层的神经元，这些神经元只能处理简单的信息，比如光线强弱、边缘、颜色、音量、音调等，处理这些信息的神经元被激活后，会传导到所连接的下一层神经元，这一层的神经元可以将零碎的信息整合为更有意义的模式，比如将边缘和颜色整合为形状，将音量和音调组合成旋律片段，随着神经元的继续传导，通过组合上一层神经元传递的整合信息，我们能理解越来越抽象的概念，此时接收到的外部信息不再仅仅代表物理刺激，而是开始承载意义、情感、逻辑和规律。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我们理解一个复杂概念，需要经过神经元的层层接力才行，如果神经网络稀疏或者强度不够，只能在浅层打转，只能看到事情的表面。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这也解释了为什么有的人一眼就能看到事情的本质，不是因为他们天赋异禀，存在天生的直觉，而是因为他们早已在自己的大脑中建立起了一条​"},{"type":"formatted","text":"针对特定领域的、连接丰富且强度极高的“神经高速公路”","bold":true},{"type":"formatted","text":"。当相关信息输入时，这条通路能被瞬间激活，信息可以毫不费力地直达高层处理区域，从而让他们迅速地、近乎直觉地把握住事物的核心规律和深层逻辑。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"​​​​​所以建立新的、高强度的神经连接才是学习的本质，也是我们学习的目的。","bold":true,"textGradient":"ocean"}]},{"type":"header","disableDrag":false,"children":[{"text":"赫布法则","type":"formatted","darkColor":"#fa7873"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"为了建立新的、高强度的神经连接，我们需要了解神经连接是通过什么机制建立的？又是如何得到加强的？"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在1949年，赫布就在其著作《行为的组织》中揭示了这一机制："}]},{"type":"blockquote","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"当细胞 A 的轴突足以接近以激发细胞 B，并"},{"type":"formatted","text":"「","textGradient":"rose"},{"type":"formatted","text":"​​​​​反复或持续」","bold":true,"textGradient":"rose"},{"type":"formatted","text":"地参与对细胞 B 的激发时，这两个细胞或其中一个会发生某种生长过程或代谢变化，从而使 A 激发 B 的效率增加。"}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"简单来说，赫布法则的核心就是："},{"type":"formatted","text":"「","textGradient":"ocean"},{"type":"formatted","text":"​​​​​如果两个神经元总是同时被激活，它们之间的连接就会变强」","bold":true,"textGradient":"ocean"},{"type":"formatted","text":"​。这意味着，​要想产生强有力的神经连接，首要条件就是你必须去激活它。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"接下来的问题是：如何才能高效地激活神经元？一个关键的技巧就是​"},{"type":"formatted","text":"主动学习。","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"主动学习要求大脑处于高度唤醒状态，迫使相关的神经元进行高强度的协同放电，根据赫布法则，同时激发的神经元产生连接的概率更大。相反，被动学习（如漫无目的地听课或机械阅读）时，信号只是匆匆掠过大脑皮层，神经元被激活的强度和频率都不够，留下的记忆痕迹微乎其微。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"有研究数据强有力的证明了这一点：在 225 项研究中，研究者对比了理工科学生在讲授式与主动参与式教学下的表现，主动参与式教学优势明显，挂科率降低了 12%。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d6e80c58-06f5-4362-80f6-a369e8306d8b.webp","uuid":"a816c498-749c-4492-8a18-8bdf44660683","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d6e80c58-06f5-4362-80f6-a369e8306d8b.webp","width":515,"description":"","align":"center","alt":""},{"type":"highlight-block","color":"yellow","children":[{"type":"paragraph","children":[{"type":"formatted","text":"这并不意味着我们要彻底摒弃讲授式教学。问题的症结不在于讲授本身，"},{"type":"formatted","text":"​​​​​而在于是否唤醒了学习者的大脑","bold":true,"textGradient":"rose"},{"type":"formatted","text":"。即便是听讲，如果老师能讲的深入浅出，引人入胜，让学生的大脑能同步构建模型、推演逻辑，那么学生相关区域的神经元也会反复持续激活，同样可以达到很好的学习效果。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"当然经常发生的情况是，一旦没有跟上，无论是因为分心还是内容本来就晦涩难懂，我们集中力就开始涣散了，这就意味着我的大脑没有激活。从这个角度讲，预习还是很有必要的，提前补充背景信息以及提前了解到难点，产生问题，在上课的时候就可以相对轻松的跟上节奏，注意力也不容易涣散，并且因为脑中一直在思考着预习产生的疑问，大脑始终处于激活状态，更容易建立神经连接。"}]}],"calloutType":"note","title":"注意"},{"type":"paragraph","children":[{"type":"formatted","text":"举一个生活中常见的例子，乘客与司机。如果你作为一名乘客，即使多次往返于某个地点，但是你依旧不会记得路线，因为作为乘客，大脑处于被动模式，无需处理空间决策，负责导航的神经回路未能得到有效激活。而如果你作为司机，因为司机必须时刻保持警觉，主动进行路径规划与路况判断，大脑高度参与，迫使相关神经元进行持续且强烈的协同放电，即使仅往返一两次，也很快就能记住路线。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但仅仅激活还不够，你还需要"},{"type":"formatted","text":"​​​​​激活对的神经元。","bold":true,"textGradient":"sunset"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"试想，你在上课的时候脑子却在回味刚刚看到的热点新闻，此时你的大脑的确被激活了，甚至还有点兴奋，但那是处理娱乐信息的神经元被激活了，与当前学习的内容无关，与处理当前学习内容的神经元无法被激活，学习效果大打折扣。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"很多人自认为大脑性能强大，可以一心多用，同时处理多个任务。"},{"type":"formatted","text":"​​​​​遗憾的是，从神经生物学的角度看，多任务处理是个伪命题。","bold":true,"textGradient":"sunset"},{"type":"formatted","text":"人类的前额叶皮质（负责决策和注意力的区域）存在生理瓶颈，它在同一时间只能串行处理一个高认知负荷的任务。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"所谓的多任务，实则是注意力在不同任务间的高频切换。这种切换不仅消耗巨大的能量，更会导致注意残留，即当从任务 A 切换到任务 B 时，大脑的一部分资源还残留在 A 上，这与赫布所阐述的"},{"type":"formatted","text":"「反复且持续」","textGradient":"ocean"},{"type":"formatted","text":"的激发条件不符，会导致无法深入理解当前的知识。"}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"提取练习"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"提取练习就是一遍遍的回忆某个知识点，每次我们尝试提取记忆时都会激活相应的神经元，而反复的提取则是在持续的激活相应的神经元，提取练习是「反复且持续」这一策略的最佳运用，是最有效的学习策略之一。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"有相当多高水平的研究证明了提取练习的有效性"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_66187218-7bc2-472c-b34e-92c1ee54efde.webp","uuid":"a84fb3a3-631c-477e-b9e4-0f9002d11b5e","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_66187218-7bc2-472c-b34e-92c1ee54efde.webp","width":562.4018923452622,"alt":""},{"type":"paragraph","children":[{"type":"formatted","text":"从图 (a) 可以随着提取次数的增加，记忆的重现率在增加，并且有趣的现象是：随着提取次数的增加，个体的差异性在减小，这说明"},{"type":"formatted","text":"提取练习对资质比较差的学习者也有效","textGradient":"ocean"},{"type":"formatted","text":"；从图 (b) 可以看到，随着提取记忆成功的次数越多，重现率也越高，这说明提取有利于长期记忆。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在实际学习中，我们有很多场景可以运用这一策略，比如测验。在进行测验时，我们需要提取记忆来回答问题，这无疑是一个非常好的提取练习的方式。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"下图演示一项实验结果，该实验将被试分为 3 组，每组有 8 个学习时段，第一组的 8 个时段都用于学习；第二组的 6 个时段用于学习，2 个时段用于测试，即通过回答问题来进行提取练习；第三组用于测试和学习的时段一样多（4个时段的学习和4个时段的测试）​。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1a304458-d060-4fd3-a13e-e02315e81a38.webp","uuid":"746583fc-26f2-41fe-b7fe-72342347fadc","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1a304458-d060-4fd3-a13e-e02315e81a38.webp","width":441.2782040315657,"alt":""},{"type":"paragraph","children":[{"type":"formatted","text":"从实验结果可以看到"},{"type":"formatted","text":"进行的测试越多，即进行的提取练习越多，越能显著提高学习成功率。","textGradient":"ocean"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"这个结论有一个重要的推论："},{"type":"formatted","text":"测验和考试应当作为学习的一部分，而不是作为验证效果的工具。","textGradient":"ocean"},{"type":"formatted","text":"很多人把考试看成学习结束后的检验，但从提取练习的角度看，考试本身就是学习，而且是效率极高的那种。 "}],"disableDrag":false},{"type":"highlight-block","calloutType":"tip","title":"","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我现在还记得《通信原理》这门课我是班上唯二的 90 分之一，我觉得最大的原因就是我把这本书的课后习题全部做了一遍，不得不说，这个过程很痛苦，但是效果也是真的好。"}]}],"color":"green"},{"type":"paragraph","disableDrag":false,"children":[{"text":"在复习时我们也可以使用提取练习这一策略。很多人在复习时，只是重复阅读之前的笔记，这已经被证明了是最低效的学习方法。正确的做法应该是我们遮住一部分的笔记内容，对内容提出问题，尝试回忆课堂内容，进行回答，回答不上来说明掌握的不好，这个时候在阅读笔记，然后重复，直到在不需要查看答案的情况下能回答出来。","type":"formatted"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"以及很多人在做错题本时，会直接把答案抄上去，复习时也只是机械的重复阅读，根据我们上面的理论，这是一种非常被动的学习策略，根本无法激活我们的神经元，正确的做法应该是在不参考答案的情况下回答该问题，如果在经过努力后还是不行，可以看答案，但是绝对不是就这样结束，然后依旧尝试提取记忆回答问题，直到不需要查看答案就可以解决问题，这种方式就是在强迫你进行提取练习，这样才能激活神经元。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"还有一个比较常见的场景是我们在学习单词拼写时，绝对不要去重复的抄写，一旦陷入这种机械性的重复，大脑就会进入被动模式，神经元不会被激活，无法记住东西，真正有用的策略就是在不存在任何参考的情况凭借自己的记忆将其写出来，强迫自己进行提取练习。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这些场景背后的逻辑都是一样的：强迫自己提取，而不是被动地接收。如果觉得手动管理太麻烦，Anki 这类软件可以帮你系统地做这件事。它通过「闪卡」的形式，让你在不参考答案的情况下回答问题，本质上就是把提取练习流程化了。"}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"费曼学习法与写作"}]},{"type":"paragraph","children":[{"type":"formatted","text":"费曼是诺贝尔物理学奖得主，他有一个著名的观点："},{"type":"formatted","text":"​​​​如果你不能用简单的语言向一个门外汉解释清楚某个概念，那就说明你自己还没有真正理解它。","textGradient":"ocean","bold":true}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这个观点背后的神经科学原理，其实就是我们前面讨论的内容。当你试图向别人解释一个概念时，你需要从记忆中提取相关知识，这本身就是一次提取练习。但更关键的是，你还需要把知识按照对方能理解的逻辑重新组织——用不同的语言、打比方、举例子来表达。这个重新组织的过程非常重要，因为它会同时激活多个神经网络：处理新知识的神经网络、存储已有经验的神经网络、负责类比推理的神经网络等等。根据赫布法则，这些同时被激活的神经元之间会建立新的连接，而这些连接恰恰是你现有知识体系与新学知识之间的桥梁。这些跨网络的连接一旦形成，不仅让新知识更容易被记住，也让它更容易在未来被激活和应用。"},{"type":"formatted","text":"​​​​这就是为什么「以教为学」会如此有效。","textGradient":"rose","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"但实际上我们很少有机会向别人讲解知识。这时候，写作就成了费曼学习法的最佳替代，甚至在某些方面比口头讲解更有优势。很多人把写作理解成\"把脑中想好的东西记录下来\"，这其实是对写作最大的误解。"},{"type":"formatted","text":"​​​​写作不仅仅是思考的结果，它本身就是思考的过程。","textGradient":"ocean","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"你可能有过这样的体验：脑子里觉得自己想明白了，但一动笔就发现写不出来。这不是因为你表达能力差，而是因为大脑会欺骗你——它让你以为自己懂了，实际上并没有。大脑的工作记忆容量很有限（大约只能同时处理 4-7 个信息块），而且它还会自动\"脑补\"缺失的细节，让你产生\"我已经理解了\"的错觉。但当你开始写作时，那些逻辑链条中缺失的环节、概念之间模糊的联系、没想清楚的细节、自相矛盾的观点，这些漏洞就会一一暴露。写作逼着你把这些问题解决掉，你需要不断地思考、调整、重写，在这个过程中，你的理解才真正深入下去，相关的神经连接才真正建立起来。"}]},{"type":"highlight-block","color":"blue","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我自己就有很深的体会。学《数字信号处理》的时候，我用写博客的方式记笔记，一个学期写了 20 多篇。写的过程中不知道卡了多少次——上课明明觉得听懂了，一写就发现说不清楚。每次卡住就得重新翻书、查资料、琢磨，直到能用自己的话顺畅地写出来。等我写完这些文章，真的就感觉这门课通透了。考试的时候思路特别顺，很快就写完提前交卷了。更关键的是，过了这么多年，虽然具体公式记不清了，但我觉得随时都能捡起来，因为那条\"神经高速公路\"已经修好了，只是长了点草，除除草就能通车。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"写作还有个特别大的好处，就是会产生复利。你写下的每一篇文章、每一张卡片，不只是帮你理解了当下的知识点，它还成了你知识体系里的一个节点。写得越多，节点之间的连接就越多，整个知识网络就会像滚雪球一样越滚越大。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"更有意思的是，"},{"type":"formatted","text":"​​​​写得越多，灵感反而越多。","textGradient":"sunset","bold":true},{"type":"formatted","text":"这听起来好像反了——不应该是有灵感才写吗？但实际情况恰恰相反。当你持续写作，你会发现写着写着突然想到另一个话题，学到新东西马上能和之前写的内容联系起来，看到个现象立刻能从好几个角度去分析。为什么？因为你通过写作建了一张知识网，新信息一进来，就会激活网络里的好多节点，产生各种意想不到的连接，灵感就是这么来的。反过来，如果你只是看看书、收藏收藏文章、划划线，知识就像水一样从脑子里流过去了，留不下什么，自然也不会有灵感。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"那具体怎么做呢？最重要的就是用自己的话写，不要抄书，不要复制粘贴。你可以想象在给一个聪明但完全不懂这个领域的朋友解释，或者想象在给未来的自己讲，未来的你看到这段话能不能看懂？这个标准虽然简单，但特别管用，能检验你到底懂没懂。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"还有很多人不敢写，总想着等\"完全理解了\"再动笔。其实反了，恰恰是通过写，你才能真正理解。初稿肯定是粗糙的，没关系，先写出来再慢慢打磨。每次写新东西的时候，想想它和已有知识的联系，这些连接才是精髓。坚持写，每天写一点，时间长了你会发现自己的变化。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"​​​​写作不是学习的终点，写作就是学习本身。","textGradient":"ocean","bold":true},{"type":"formatted","text":"当你把写作变成学习的一部分，你就掌握了最强大的学习工具。"}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"间隔重复"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"正如上文所说，要反复且持续地激活神经元才能建立连接，但建立连接还不够，还需要通过反复激活去强化这些连接。可这里就出现了一个矛盾：我们需要反复激活神经元，但如果在短时间内多次反复激活同一组神经元，大脑反而会变得不敏感，神经元的活动强度会下降。这种现象叫做"},{"type":"formatted","text":"「","textGradient":"ocean"},{"type":"formatted","text":"重复抑制」","bold":true,"textGradient":"ocean"},{"type":"formatted","text":"。就像你反复闻同一种气味，过一会儿就闻不到了一样，大脑对重复的刺激会逐渐\"麻木\"。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"那该怎么办呢？答案就是"},{"type":"formatted","text":"间隔重复","bold":true},{"type":"formatted","text":"——把学习时间分散开来，而不是集中在一起。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"为什么间隔学习会更有效？想象一下，当你把学习时间分散开来，每次重新学习时，大脑都需要重新激活相关的神经网络。这个重新激活的过程本身就是一次提取练习，而且因为间隔了一段时间，大脑不会因为重复抑制而降低敏感度，每次激活都能保持较高的强度。相反，如果你在短时间内反复学习同一内容，大脑会逐渐\"习惯\"这些刺激，神经元的反应会越来越弱，学习效率自然就下降了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"更有意思的是，研究发现，"},{"type":"formatted","text":"大脑会在睡眠期间自发地重新激活白天学习时激活的神经元","textGradient":"ocean"},{"type":"formatted","text":"。这个过程被称为\"记忆重放\"，它会帮助大脑巩固白天学习的内容，把短期记忆转化为长期记忆。如果你采用间隔学习，每次学习之间都有睡眠时间，那么大脑就有多次机会进行记忆重放和巩固。而如果你采用集中学习，一次性学完，那就只有一次巩固的机会。这就像是给大脑多次\"复盘\"的机会，每次睡眠都在帮你加深记忆。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"还有一个关键因素是时间。从神经元被激活到真正建立稳固的连接，大脑需要经历一系列复杂的分子活动，这个过程需要时间，从几秒到几天不等。如果两次激活之间留出了足够的时间，那么每次激活的效果是可以累加的；但如果集中激活，前一次激活的效果还没来得及巩固，后一次激活就来了，效果反而会相互干扰，无法累加。这也解释了为什么临时抱佛脚虽然能应付考试，但过后很快就忘得一干二净——你没有给大脑足够的时间去真正建立那些神经连接。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"间隔重复的另一个好处就是可以对抗遗忘。根据艾宾浩斯遗忘曲线，我们学习的内容会随着时间快速遗忘。但每次复习都会重新激活相关的神经连接，让它们变得更强，遗忘的速度也会变慢。间隔重复就是在遗忘发生之前及时复习，不断强化记忆，最终让知识真正进入长期记忆。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"那么问题来了，最佳间隔时间是多久？这个问题没有标准答案，因为"},{"type":"formatted","text":"最佳间隔时间取决于你想记住多久","textGradient":"ocean"},{"type":"formatted","text":"。如果你只是想应付明天的考试，那今天晚上复习就够了；但如果你想长期记住，那就需要更长的间隔时间。一般来说，间隔时间应该逐渐增加——第一次复习可能是学习后的几小时或一天，第二次可能是几天后，第三次可能是几周后，以此类推。不过好消息是，"},{"type":"formatted","text":"只要间隔时间不是太长导致完全遗忘，无论间隔多久，间隔学习都比集中学习效果好","textGradient":"ocean"},{"type":"formatted","text":"。所以不用过分纠结具体的间隔时间，关键是要分散学习，而不是集中突击。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在实际学习中，我们可以通过很多方式来运用间隔学习。最简单的就是分散安排学习时间，提高学习频率，减少单次时长。比如学校安排课程，6 节一小时的课就比 2 节三小时的课更合理。做作业或自习时也是一样，与其周末一次性学 6 个小时，不如每天学 1 个小时，坚持一周。这样不仅学习效果更好，也不会那么累。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"还有一个特别有用的技巧叫交叉学习，指的是在学习过程中穿插不同的主题或技能，而不是一次性学完一个再学下一个。"}]},{"type":"highlight-block","color":"purple","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我自己就有这样的体会。我有时候会同时读多本书，换着读。同样是一个月读三本书，一种方式是读完一本再读下一本，另一种是三本书交叉着读。我发现交叉着读的效果明显更好——不仅记得更牢，而且更容易发现不同书之间的联系。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"这其实就是间隔重复的一种实践。当我从书 A 切换到书 B，再切换到书 C，然后再回到书 A 时，中间已经间隔了一段时间，大脑需要重新激活相关的神经网络，这本身就是一次提取练习。而且不同书籍之间的切换还能避免重复抑制，让大脑保持新鲜感。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"说到这里，我想提醒一点：很多人觉得考前突击效果好，因为短时间内反复看同样的内容，会产生一种\"我已经掌握了\"的错觉。"},{"type":"formatted","text":"但这是大脑在欺骗你","textGradient":"sunset"},{"type":"formatted","text":"。短时间内的多次重复会让你对内容产生熟悉感，但这种熟悉感不等于真正的理解和记忆。等到考试过后几天，你会发现自己几乎全忘了。"},{"type":"formatted","text":"间隔学习虽然反直觉，但它才是真正有效的学习方式","textGradient":"ocean"},{"type":"formatted","text":"。它要求你在感觉快要忘记的时候再去复习，这个过程会让你觉得有点吃力，但正是这种"},{"type":"formatted","text":"「必要难度」","textGradient":"ocean"},{"type":"formatted","text":"让学习变得更有效。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"记住，"},{"type":"formatted","text":"学习不是一次性的事情，而是一个持续强化的过程","textGradient":"ocean"},{"type":"formatted","text":"。只有通过间隔重复，才能让知识真正内化为你的一部分。"}],"disableDrag":false},{"type":"header","level":2,"children":[{"type":"formatted","text":"个人实践"}]},{"type":"paragraph","children":[{"type":"formatted","text":"前面我们讨论了很多理论——神经连接、赫布法则、提取练习、费曼学习法、间隔重复。但理论和实践之间往往存在一道鸿沟：知道原理是一回事，真正落地又是另一回事。这一节我想分享我自己是怎么做的，整个过程可以看作信息走了一圈：从外面进来，在脑子里被加工，再输出去，最后通过反馈来校准方向。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"信息采集"}]},{"type":"paragraph","children":[{"type":"formatted","text":"学习的第一步是选择学什么、从哪里学，但这一步往往被严重低估。很多人读了大量的书，却感觉什么都没学到，然后开始怀疑是自己的问题，记忆力不好、理解力差、不够努力。但真正的问题往往不在于此，而在于书本身的质量。"},{"type":"formatted","text":"​","textGradient":"rose"},{"type":"formatted","text":"烂书最大的危害不是浪费时间，而是让你怀疑自己。","bold":true,"textGradient":"rose"},{"type":"formatted","text":"一本逻辑混乱、概念模糊的书，读再多遍也无法在大脑中建立清晰的神经连接，因为输入本身就是噪音。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"所以怎么找到好书？首先得先知道有哪些书。被动的信息源是一些博主的推荐，或者信息流的推荐，比较主动的是别人推荐了一本书，然后在豆瓣上查看评分和评论，然后看一下哪些书单包括了这本书，一般情况下书单中其它书的质量也不错。我对书的筛选标准比较简单，就是看评分，豆瓣评分或者微信读书的评分，评分比较低或者评论比较差的我都不考虑看，毕竟书多到看不完，为什么要看一本费力不讨好的书。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_494f475f-7e99-4744-aa33-723730383dfc.webp","uuid":"de8b20d4-afa7-4592-a1f8-22c707a7c4b2","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_494f475f-7e99-4744-aa33-723730383dfc.webp","width":720},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"另外，每本书都预设了自己的读者群体，适合别人的不一定适合你。入门时不必一上来就啃厚重的经典，先找一本薄的，从整体上摸清这个领域有哪些模块，再去找更具体的书深入某个方向，效率会高很多。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当然，书只是其中一种形式。博客、播客、视频课程，都是很好的补充，有时候甚至比书更合适。有些知识光靠文字很难建立直觉，视频能让你看到过程；有些领域的前沿进展，博客和播客比书更新得快。关键不在于形式，而在于质量，以及它是否适合你当下的水平。"}],"disableDrag":false},{"type":"highlight-block","color":"green","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我的大学课程大部分都是通过慕课学习的——浙大的《微积分》、哈工大的《计算机组成原理》、南大的《操作系统》、电子科大的《数字信号处理》、北邮的《通信原理》、东南大学的《信号与系统》、国防科技大学的《数字逻辑电路》、西安电子科技大学的《高频电子线路》和《微机原理》。完全是吃百家饭长大的。学校老师讲得不好，不代表这门课就没有好老师，换一个老师就行了。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"好的材料只是起点，真正的挑战在于接下来，如何处理这些信息。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"信息处理"}]},{"type":"paragraph","children":[{"type":"formatted","text":"很多人学习时有一种错觉：只要坐在那里，眼睛扫过文字，耳朵听着讲解，信息就自然进入了大脑。但根据我们前面讨论的内容，这种被动接收几乎不会激活神经元，信息只是从感官流过，没有留下任何痕迹。真正有效的信息处理，关键在于一个反直觉的动作：​"},{"type":"formatted","text":"主动打断","bold":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我以前读书的方式是不管怎样先把一章读完，遇到不懂的地方也先跳过，告诉自己\"读完再说\"。结果是中间有一个概念没搞懂，后面的内容就像天书，越读越茫然。更糟糕的是，读着读着目的就变了，不是为了搞懂内容，而是为了把书读完，本末倒置。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"现在我的做法完全不同。读书时，我会刻意留意两种信号：突然冒出的灵感，以及读不懂的困惑。这两种信号都在告诉你：停下来，这里有东西值得深挖。停下来之后做什么？不是做笔记，而是提出问题。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"​","textGradient":"ocean"},{"type":"formatted","text":"记录问题，而不是记录知识点","bold":true,"textGradient":"ocean"},{"type":"formatted","text":"，这是我觉得最关键的一个转变。传统笔记是把书里的内容抄一遍，本质上还是被动的，你只是在复述别人的思路。而问题不同，问题是你自己的，它代表了你理解到的地方和还没理解到的地方之间的那条缝。比如我经常会问这样的问题：为什么要这样设计？不这样会发生什么？这个东西出现之前，大家是怎么解决这个问题的？只有搞清楚这些，才真正知道学的是什么、能用在哪里。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a933a66a-c6f7-4d98-8d59-88898c80ecec.webp","uuid":"c8608373-4f84-4872-bb7a-4a9ab5e9ec87","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a933a66a-c6f7-4d98-8d59-88898c80ecec.webp","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"把问题记录下来之后，再去深挖：搜索、看文章、问 AI。现在有了 AI，这个过程顺畅了很多。以前有问题找不到人解答，只能靠网络搜索，碰运气。现在 AI 基本上什么都懂，更重要的是，你可以和它来回追问，不断逼近问题的本质。但要注意，AI 是用来帮你思考的，不是用来替你思考的。用它来验证自己的理解、追问自己没想清楚的地方，和直接让它给你答案，效果天差地别。"}],"disableDrag":false},{"type":"highlight-block","color":"yellow","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我现在读书的节奏大概是这样的：读到不懂的地方，如果不影响后续阅读，就先把问题记下来继续读；如果这个概念是后面内容的前提，就马上停下来，问 AI 把它搞清楚，再继续。每次读完一段，我会停下来问自己：这段在说什么？如果说不清楚，就重读。这个过程比一口气读完要慢很多，但留下的东西也多得多。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"当然，你觉得懂了，并不代表真的懂了。大脑会欺骗你，让你产生\"我已经理解了\"的错觉。真正的检验，在于输出。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"输出"}]},{"type":"paragraph","children":[{"type":"formatted","text":"费曼学习法告诉我们要用自己的话解释，但它没有告诉我们用什么方式。在实际学习中，我们很少有机会随时找人讲解，这时候就需要一个替代方案。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"很多人的第一反应是做笔记。但传统笔记有一个根本性的问题：它是按照书的结构组织的，而不是按照你自己的理解组织的。按章节抄下来的笔记，一旦脱离这本书，就变成了孤立的碎片，很难和你已有的知识体系产生连接。更重要的是，抄笔记本质上是复制，复制不需要理解，手在动，大脑依然是被动的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"​","textGradient":"ocean"},{"type":"formatted","text":"真正有效的输出，是用自己的话重新组织，而不是用别人的话复述。","bold":true,"textGradient":"ocean"},{"type":"formatted","text":"重新组织的过程会暴露你理解中的漏洞，那些你以为自己懂了、但其实只是\"见过\"的地方，在你试图用自己的语言表达时，会立刻原形毕露。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我现在的做法是以问题为单位沉淀卡片。每张卡片对应一个问题，用自己的话回答，可以补充背景、加入类比、扩展延伸，不受书中上下文的限制。卡片和卡片之间可以建立关联，就像神经元之间建立连接一样，当你发现两张卡片之间存在某种联系，把它们连起来，这个连接本身就是一次新的理解。随着卡片越积越多，这张知识网络会越来越密，新知识进来时，能激活的节点也越来越多。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9abada8f-0d44-4e4d-997a-da545d1ee6aa.webp","uuid":"f485e951-2f7c-4b31-92e4-8d124e5563fc","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9abada8f-0d44-4e4d-997a-da545d1ee6aa.webp","width":652.3160627335787},{"type":"paragraph","children":[{"type":"formatted","text":"写作则是输出里要求最高的一种。前面我们已经讨论过写作作为费曼学习法的实践，这里再补一点：写给别人看和写给自己看，是完全不同的两件事。写给自己，可以有很多含糊的地方；写给别人，每一个逻辑跳跃都得填满，每一个隐含的前提都得说清楚。这个过程逼着你把理解推到一个更深的地方。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"反馈"}]},{"type":"paragraph","children":[{"type":"formatted","text":"学习是一个长期的过程，而长期坚持一件事，最大的敌人不是懒惰，而是感受不到进展。没有反馈，你不知道自己有没有进步，不知道方向对不对，时间久了，动力自然会消耗殆尽。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"反馈有很多种形式，但最有价值的不是别人的认可，而是你自己感受到的那种。某个困扰了你很久的概念，某天突然想通了，那种豁然开朗的感觉；用新学的知识解决了一个实际问题，发现它真的管用；和别人聊起某个话题，发现自己能说清楚、对方也听懂了，这些都是信号，告诉你神经连接正在建立，学习正在发生。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"​","textGradient":"ocean"},{"type":"formatted","text":"要学会留意并珍视这些信号。","bold":true,"textGradient":"ocean"},{"type":"formatted","text":"它们不是偶然的，而是你持续投入的结果。当这些信号越来越频繁，学习就会从一件需要意志力坚持的事，变成一件自然而然想去做的事。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"当然，外部反馈也很重要。把你学到的东西写出来分享，和别人讨论，这些不只是传播知识，更是在给自己创造反馈的机会。别人的问题会让你发现自己没想清楚的地方，别人的视角会让你看到自己的盲区。比如这篇文章，如果你觉得有用，给我点个反馈，哈哈。"}],"disableDrag":false}],"tags":[],"bannerBg":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-powrye_64e8052d-3143-4bea-ab22-6ad667bb1af1.webp","createTime":1774256022518,"updateTime":1777215233735},"meta":{"type":"article","publishTime":1781255907862},"settings":{"appearance":{"image":{"borderRadius":"md","shadow":"sm"}}}};
