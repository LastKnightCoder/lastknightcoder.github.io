      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":70,"title":"面试题：缓存异步函数","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"记一次面试题，当时写了很久都没有实现，特此记录。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"题目介绍"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"实现一个函数可以对异步函数的结果进行缓存"}],"disableDrag":false},{"type":"code-block","code":"const cacheAsyncFunc = (asyncFunc) => {\n  // TODO\n}\n\nconst asyncAdd = (num1, num2) => {\n  console.log(`perform asyncAdd ${num1} ${num2}`)\n  return new Promise((resolve) => {\n    setTimeout(() => {\n      resolve(num1 + num2)\n    }, 1000)\n  })\n}\n\nconst cacheAdd = cacheAsyncFunc(asyncAdd);\n\ncacheAdd(1, 2).then(res => console.log(res))\ncacheAdd(2, 3).then(res => console.log(res))\ncacheAdd(1, 2).then(res => console.log(res))","language":"JavaScript","uuid":"ca0d81b5-cb7f-4d9b-b36b-07b770824484","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实现 "},{"type":"formatted","text":"cacheAsyncFunc","code":true},{"type":"formatted","text":" 使其输出为"}],"disableDrag":false},{"type":"code-block","code":"perform asyncAdd 1 2\nperform asyncAdd 2 3\n3\n5\n3","language":"JavaScript","uuid":"f10b758b-db76-4990-b458-1ed7c25fb5bd","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"初步实现"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先我实现了一个显而易见的版本"}],"disableDrag":false},{"type":"code-block","code":"const cacheAsyncFunc = (asyncFunc) => {\n  const cache = new Map();\n\n  return (...args) => {\n    const key = JSON.stringify(args);\n\n    if (cache.has(key)) {\n      return cache.get(key);\n    }\n\n    const result = asyncFunc(...args);\n    cache.set(key, result);\n    return result;\n  };\n};","language":"JavaScript","uuid":"05f35508-2822-4ddf-b050-cfdedba5802a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是其实际结果是"}],"disableDrag":false},{"type":"code-block","code":"perform asyncAdd 1 2\nperform asyncAdd 2 3\n3\n3\n5","language":"JS","uuid":"be0995c1-5d9c-4fec-8ab3-1d2b8d534e69","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看到输出的结果是 "},{"type":"formatted","text":"3 3 5","code":true},{"type":"formatted","text":"，而不是 "},{"type":"formatted","text":"3 5 3","code":true},{"text":"，我就是卡在这里百思不得其解。","type":"formatted"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"原因分析"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"先解释原因，要从宏任务和微任务的角度考虑："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"第一次执行 "},{"type":"formatted","text":"cacheAdd(1, 2)","code":true},{"type":"formatted","text":" 时无缓存，会执行 "},{"type":"formatted","text":"asyncAdd(1, 2)","code":true},{"type":"formatted","text":"，此时会执行 "},{"type":"formatted","text":"setTimeout","code":true},{"type":"formatted","text":"，返回一个 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":"，记为 "},{"type":"formatted","text":"p1","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"第二次执行 "},{"type":"formatted","text":"cacheAdd(2, 3)","code":true},{"type":"formatted","text":" 也无缓存，会执行 "},{"type":"formatted","text":"asyncAdd(2, 3)","code":true},{"type":"formatted","text":"，此时又会执行 "},{"type":"formatted","text":"setTimeout","code":true},{"type":"formatted","text":"，返回一个 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":"，记为 "},{"type":"formatted","text":"p2","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"第三次执行 "},{"type":"formatted","text":"cacheAdd(1, 2)","code":true},{"type":"formatted","text":"，存在缓存，将之前缓存的 "},{"type":"formatted","text":"p1","code":true},{"text":" 返回","type":"formatted"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"1s","code":true},{"type":"formatted","text":" 后定时器结束，宏任务队列会存在两个待执行的任务，第一个任务会执行 "},{"type":"formatted","text":"resolve(3)","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"p1","code":true},{"type":"formatted","text":" 变为 "},{"type":"formatted","text":"fullfilled","code":true},{"type":"formatted","text":"，将 "},{"type":"formatted","text":"then","code":true},{"type":"formatted","text":" 中的两个回调函数扔进微任务队列，宏任务执行完成，开始执行微任务队列中所有的微任务，所以会先打印两次 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":"，接着执行第二个 "},{"type":"formatted","text":"setTimeout","code":true},{"type":"formatted","text":" 注册的宏任务，执行 "},{"type":"formatted","text":"resolve(5)","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"p2","code":true},{"type":"formatted","text":" 变为 "},{"type":"formatted","text":"fullfiled","code":true},{"type":"formatted","text":"，把 "},{"type":"formatted","text":"p2.then","code":true},{"type":"formatted","text":" 注册的回调函数扔进微任务队列，宏任务执行完成，执行微任务，打印 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解决方案"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在分析出原因后，我以为需要从宏任务和微任务的角度去解决这个问题，所以我给出了下面的解法"}],"disableDrag":false},{"type":"callout","calloutType":"danger","title":"最开始的思路","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"为了保证执行顺序，就不能直接返回缓存的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 了，而应该返回一个新的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":"，这个新的 "},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 应该在下一个宏任务中才变为 "},{"type":"formatted","text":"fullfilled","code":true},{"text":"，这样就可以保证执行顺序","type":"formatted"}]},{"type":"code-block","code":"const executeInNextFrame = (callback) => {\n  const channel = new MessageChannel();\n  const { port1, port2 } = channel;\n  port2.onmessage = callback;\n  port1.postMessage(null);\n}\n\nconst cacheAsyncFunc = (asyncFunc) => {\n  const cache = new Map();\n\n  return (...args) => {\n    const key = JSON.stringify(args);\n\n    if (cache.has(key)) {\n      return new Promise((resolve, reject) => {\n        cache.get(key).then((value) => {\n          executeInNextFrame(() => {\n            resolve(value);\n          })\n        }, reject);\n      })\n    }\n\n    const result = asyncFunc(...args);\n    cache.set(key, result);\n    return result;\n  };\n};\n\nconst asyncAdd = (num1, num2) => {\n  console.log(`perform asyncAdd ${num1} ${num2}`);\n  return new Promise((resolve) => {\n    setTimeout(() => {\n      resolve(num1 + num2);\n    }, 1000);\n  });\n};","language":"JavaScript","uuid":"782b61e7-b078-45ed-aea6-eff304c94f26","children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"实现上述能力后，我还有点沾沾自喜，竟能想到如此精妙绝伦的解法，把题目给各种 AI 后，发现 AI 给出的解法和我一开始的解法一样，也不过如此，此时我已经有点飘了，却不知我在愚昧之巅，后来 DeepSeek R1 出来，让 DeepSeek R1 试了下，我才知道我是小丑，现在回想，真是太蠢了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"上面基于宏任务的解法根本无法保证顺序性，在加一个例子就可以看到"}],"disableDrag":false},{"type":"code-block","code":"cacheAdd(1, 2).then(res => console.log(res))\ncacheAdd(2, 3).then(res => console.log(res))\ncacheAdd(1, 2).then(res => console.log(res))\ncacheAdd(3, 3).then(res => console.log(res))","language":"JavaScript","uuid":"13064976-4829-42ac-bb5c-b2b6abb71974","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"perform asyncAdd 1 2\nperform asyncAdd 2 3\nperform asyncAdd 3 3\n3\n5\n6\n3","language":"","uuid":"128ddb7a-902f-4ada-bc15-063e4d9b2f11","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为第二个 "},{"type":"formatted","text":"cacheAdd(1, 2)","code":true},{"type":"formatted","text":" 是在下一个宏任务队列中，而 "},{"type":"formatted","text":"cacheAdd(3, 3)","code":true},{"type":"formatted","text":" 则是在微任务队列中，所以 "},{"type":"formatted","text":"cacheAdd(3, 3)","code":true},{"type":"formatted","text":" 的结果先于第二个 "},{"type":"formatted","text":"cacheAdd(1, 2)","code":true},{"type":"formatted","text":" 完成，输出顺序不对。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"最朴素的想法，要保证执行顺序，就得使用"},{"type":"formatted","text":"队列","bold":true,"color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"，把结果都放入到队列中，必须等上一个结果完成后（无论是成功还是失败），才能将后面的结果置位、问完成，思路非常简单"}]},{"type":"code-block","code":"const cacheAsyncFunc = (asyncFunc) => {\n  const cache = new Map();\n  const resQueue = [];\n  let isChecking = false;\n\n  const check = () => {\n    if (resQueue.length === 0) {\n      isChecking = false;\n      return;\n    }\n    const { result, resolve, reject } = resQueue.shift();\n    result.then(resolve, reject).finally(check);\n  }\n\n  return (...args) => {\n    const key = JSON.stringify(args);\n\n    let result;\n    if (cache.has(key)) {\n      result = cache.get(key);\n    } else {\n      result = asyncFunc(...args);\n      cache.set(key, result);\n    }\n\n    const { promise, resolve, reject } = Promise.withResolvers();\n    resQueue.push({\n      result,\n      resolve,\n      reject,\n    });\n\n    if (!isChecking) {\n      isChecking = true;\n      check();\n    }\n\n    return promise;\n  };\n};","language":"JavaScript","uuid":"b9de9911-c082-4df3-b4b5-cefe745e271d","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"","language":"","uuid":"8352eebe-a9bb-4fa5-b1ec-e3cf6733aaf9","children":[{"type":"formatted","text":""}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/sean-pierce-d4BXj4TE3vE-unsplash_7e981482-da25-4bf1-8b8b-092e670e3688.jpg","createTime":1734359074210,"updateTime":1747382615603},"meta":{"type":"article","publishTime":1764820859525}};
