    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":4,"title":"1px 有多大","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"现在有一个灵魂问题，"},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":" 的大小是多大?"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"要回答这个问题，首先要区分两种像素，一种是物理像素(或者称为设备像素)，一种是逻辑像素(或者称为设备独立像素、CSS 像素)，我们讨论的是一个 CSS 像素有多大。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"屏幕是通过一个个的发光体发出不同的颜色的光让我们看到画面的，这一个个的发光体的大小可以认为是一个物理像素大小。不同的机器像素的密度是不同的，一般我们衡量密度的方法为每英寸上有多少像素(pixel per inch, ppi)，以我的机器为例，我的屏幕分辨率为 "},{"type":"inline-math","tex":"2560 \\times 1600","children":[{"type":"formatted","text":"2560 \\times 1600"}]},{"type":"formatted","text":"，而我的屏幕尺寸为 13.3 英寸(对角线的长度)，所以我的屏幕的 "},{"type":"formatted","text":"ppi","code":true},{"type":"formatted","text":" 为"}],"disableDrag":false},{"type":"block-math","tex":"\\dfrac{\\sqrt{(2560^2 + 1600^2)}}{13.3} = 227 \\text{ppi}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以在我的机器上一个物理像素的长度为 "},{"type":"formatted","text":"1/ppi = 1/227 = 0.0044","code":true},{"text":" 英寸。","type":"formatted"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"那 CSS 像素与物理像素之间有什么关系呢。在比较早以前，1 个 CSS 像素就是一个物理像素的大小，所以 "},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":" 的计算公式为 "},{"type":"formatted","text":"1px = 1 /ppi","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是随着苹果提出了 Retina 屏幕的概念，这种屏幕的特点就是高分辨率，在相同的尺寸下具有两倍甚至三倍的像素点，如果这时 "},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":" 的计算方式不变的话，随着 "},{"type":"formatted","text":"ppi","code":true},{"type":"formatted","text":" 的增大，"},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":" 就越小，在相同尺寸的高分辨率的屏幕下显示的很小，这十分的不合理，因此我们需要提出一种与设备无关的像素单位，也就是 CSS 像素。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"CSS 像素与物理像素之间的关系使用 Device Pixel Ratio(dpr) 来定义，它表示一个 CSS 像素长度相当于 "},{"type":"formatted","text":"dpr","code":true},{"type":"formatted","text":" 个物理像素长度，"},{"type":"formatted","text":"dpr","code":true},{"type":"formatted","text":" 可以通过在系统设置里面设置缩放定义（当缩放网页时，修改的也是 "},{"type":"formatted","text":"dpr","code":true},{"type":"formatted","text":" 的值）"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202112041620112021-12-04-16-20-12.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202112041620112021-12-04-16-20-12.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"我设置的系统缩放为 200%，也就是说 "},{"type":"formatted","text":"dpr = 2","code":true},{"type":"formatted","text":"，一个 CSS 像素长度相当于两个物理像素长度，也就是说在我的电脑上 CSS 的长度为 "},{"type":"formatted","text":"2/227 = 0.0088","code":true},{"type":"formatted","text":" 英寸。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"CSS 像素的长度在不同的电脑上依据 "},{"type":"formatted","text":"ppi","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"dpr","code":true},{"type":"formatted","text":" 的值具有不同的大小，它的计算公式为"}],"disableDrag":false},{"type":"block-math","tex":"1\\text{px} = \\dfrac{\\text{dpr}}{\\text{ppi}}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://www.w3.org/TR/CSS2/syndata.html#:~:text=The%20reference%20pixel%20is%20the%20visual%20angle%20of%20one%20pixel%20on%20a%20device%20with%20a%20pixel%20density%20of%2096dpi%20and%20a%20distance%20from%20the%20reader%20of%20an%20arm%27s%20length.","openEdit":false,"children":[{"type":"formatted","text":"W3C CSS specification"}]},{"type":"formatted","text":" 从视觉的角度给出了一个参考长度"}],"disableDrag":false},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"he reference pixel is the visual angle of one pixel on a device with a pixel density of 96 DPI and a distance from the reader of an arm’s length."}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"人在离屏幕一臂之遥的位置看去，一个像素的大小看上去是 1/96 英寸的长度。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是我们靠计算机比较近，一般不会有一臂之长，为了使得人眼看的比较舒服，一个 CSS 像素长度会小于 "},{"type":"inline-math","tex":"1/96","children":[{"type":"formatted","text":"1/96"}]},{"type":"formatted","text":" 英寸，我粗略统计不同计算机的 CSS 像素长度一般在 "},{"type":"inline-math","tex":"[1/100, 1/130]","children":[{"type":"formatted","text":"[1/100, 1/130]"}]},{"type":"formatted","text":"英寸 之间，举几个🌰："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我的笔记本电脑的 "},{"type":"formatted","text":"ppi","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"227","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"dpr","code":true},{"type":"formatted","text":" 我设置为 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":"，那么我的 CSS 像素长度为"}],"disableDrag":false},{"type":"block-math","tex":"\\dfrac{2}{227} = \\dfrac{1}{113.5}","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我的显示器分辨率为 "},{"type":"inline-math","tex":"2560 \\times 1440","children":[{"type":"formatted","text":"2560 \\times 1440"}]},{"type":"formatted","text":"，尺寸为 "},{"type":"formatted","text":"27","code":true},{"type":"formatted","text":"寸，"},{"type":"formatted","text":"dpr","code":true},{"type":"formatted","text":" 设置为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"，所以其 CSS 像素长度为为"}],"disableDrag":false},{"type":"block-math","tex":"\\dfrac{1}{\\sqrt{(2560^2 + 1440^2)} / (27)} \\approx \\dfrac{1}{109}","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"实验室同学的电脑分辨率是 "},{"type":"inline-math","tex":"1920 \\times 1080","children":[{"type":"formatted","text":"1920 \\times 1080"}]},{"type":"formatted","text":"，屏幕大小为 15.6寸，推荐系统缩放比为 125%，也就是说 "},{"type":"formatted","text":"dpr = 1.25","code":true},{"type":"formatted","text":"，此时它的 CSS 像素长度为"}],"disableDrag":false},{"type":"block-math","tex":"\\dfrac{1.25}{\\sqrt{(1920^2 + 1080^2)} / (15.6)} \\approx \\dfrac{1}{113}","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"最新款 MacBook Pro(2021 年)，官网上给出的 "},{"type":"formatted","text":"ppi = 254","code":true},{"type":"formatted","text":"，它们的 "},{"type":"formatted","text":"dpr = 2","code":true},{"type":"formatted","text":"，所以它们的 CSS 像素长度为"}],"disableDrag":false},{"type":"block-math","tex":"\\dfrac{2}{254} = \\dfrac{1}{127}","children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们使用手机时，手机离我们的距离相比于电脑离我们的距离更加的近，所以手机上的 CSS 像素长度更短，这样我们才会看的更加的舒服，否则太大的话，靠的太近看到的都是一个个像素点，体验感不好。以苹果手机为例，它的 CSS 长度大约为 "},{"type":"formatted","text":"1/163","code":true},{"type":"formatted","text":" 英寸，大部分的安卓手机是 "},{"type":"formatted","text":"1 / 160","code":true},{"type":"formatted","text":" 英寸，相差不大。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"可见在不同的机器上一个 CSS 像素长度是不一样的，不过它们都在一定的范围之内，以保证我们在合适的距离之内看的舒服。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在早期，大家都默认一英寸等于 "},{"type":"formatted","text":"96px","code":true},{"type":"formatted","text":"，为了延续传统，Web 中的 "},{"type":"formatted","text":"1in","code":true},{"type":"formatted","text":" 是依据 "},{"type":"formatted","text":"px","code":true},{"type":"formatted","text":" 定义的，始终定义为 "},{"type":"formatted","text":"1in = 96px","code":true},{"type":"formatted","text":"，但是我们知道一般 "},{"type":"formatted","text":"1px < 1/96 英寸","code":true},{"type":"formatted","text":"，因此实际上的 "},{"type":"formatted","text":"1in < 1英寸","code":true},{"type":"formatted","text":"，对于 "},{"type":"formatted","text":"cm","code":true},{"type":"formatted","text":" 这个单位也是一样，它定义为 "},{"type":"formatted","text":"1in = 2.54cm","code":true},{"type":"formatted","text":"，同样在网页中 "},{"type":"formatted","text":"1cm < 1厘米","code":true},{"type":"formatted","text":"，所以在实际中，我们非常少使用 "},{"type":"formatted","text":"in","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"cm","code":true},{"type":"formatted","text":" 作为单位，因为它的数值不准确，会带来误解。"}],"disableDrag":false},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在网页中，所有的单位最终都会被换算为 px，虽然我们设置的字体大小为 0.25in，但是在实际显示的时候已经被换算为了 px，也就是 24px，我们一般称换后的值为计算值。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202112041838582021-12-04-18-38-59.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202112041838582021-12-04-18-38-59.png","width":720}]}],"tags":["CSS","px","深入思考"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-y8o7yg_6623f0c3-10fb-438f-a676-b04dabfa694c.jpg","createTime":1644891335000,"updateTime":1762948877035},"meta":{"type":"article","publishTime":1764775995602}};
