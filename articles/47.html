    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":47,"title":"TypeScript之类型守卫","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"一个值可能同时具有多种可能的类型，在断言为具体的类型之前只能使用公共的属性和方法"}]},{"type":"code-block","code":"const strOrNum: string | number = \"a\";\n// ❎\nstrOrNum.toLowerCase();\n// ✅\n(strOrNum as string).toLowerCase();","language":"TypeScript","uuid":"54136a83-412a-4cc6-837c-d75d0a9b0354","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"as","code":true},{"type":"formatted","text":" 断言为主动断言，还可以通过一些方法判断类型，ts 可以帮助将类型进行收缩"}]},{"type":"code-block","code":"const strOrNum: string | number = \"a\";\nif (typeof strOrNum === 'string') {\n  // 经过 typeof 判断后，类型收缩到 string 类型\n  // 不用手动断言即可直接使用 string 下的方法\n  strOrNum.toLowerCase();\n} else {\n  // 此处会将 string 这种可能性去掉，因此只能是 number\n  // 可以使用 number 独有的方法\n  strOrNum.toFixed(2);\n}","language":"TypeScript","uuid":"6a4df4b4-cea2-48c0-a8ce-c80a5037e0cd","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"根据分支的判断条件，ts 会尝试推导类型，将值可能的类型进行尽可能的收窄，这种类型推断的行为称之为"},{"type":"formatted","text":"类型守卫","bold":true},{"type":"formatted","text":"。"},{"type":"formatted","text":"typeof","code":true},{"type":"formatted","text":" 是一种常见的类型守卫，除此之外，还有其它的类型守卫，如："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"===","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"in","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"instanceof","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"类型守卫函数"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"断言函数"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"===","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"!==","code":true},{"type":"formatted","text":" 一般用于字面量类型的判断"}]},{"type":"code-block","code":"const oneOr1: \"one\" | 1 = 1;\n\nif (oneOr1 === 1) {\n  // 是数字 1\n} else {\n  // 是英文 one\n}","language":"TypeScript","uuid":"89f2be9d-693f-45ed-973f-d2857df9190d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"也可用于对象属性的字面量判断，从而区分类型"}]},{"type":"code-block","code":"enum EType {\n\tDOG = 1,\n  CAT = 2\n}\n\ninterface Dog {\n  type: EType.DOG;\n  name: string;\n}\n\ninterface Cat {\n  type: EType.CAT;\n  name: string;\n}\n\nconst dogOrCat = {\n  type: EType.DOG,\n  name: '旺财'\n}\n\nif (dogOrCat.type === EType.DOG) {\n  // 是 Dog 类型\n} else {\n  // 是 Cat 类型\n}","language":"TypeScript","uuid":"436726ab-0449-40d5-b908-e68ea633f4de","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"===","code":true},{"type":"formatted","text":" 判断对象的属性来收缩对象类型时，要确保该属性是"},{"type":"formatted","text":"字面量类型","bold":true,"highlight":true},{"type":"formatted","text":"，比如我将 "},{"type":"formatted","text":"Dog","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"Cat","code":true},{"type":"formatted","text":" 的类型都声明为 "},{"type":"formatted","text":"EType","code":true},{"type":"formatted","text":" 就无法进行类型推断"}]},{"type":"code-block","code":"interface Dog {\n  type: EType;\n  name: string;\n}\n\ninterface Cat {\n  type: EType;\n  name: string;\n}","language":"TypeScript","uuid":"5e121f6f-37ae-456b-aaae-4d02db5fcd46","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这种情况下可以使用"},{"type":"formatted","text":"自定义类型守卫","bold":true},{"type":"formatted","text":"，见下。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"in","code":true},{"text":" 操作符可以判断某个属性是否存在于对象中，如果某个对象具有独一无二的属性，通过此判断可以将类型收缩到此对象类型","type":"formatted"}]},{"type":"code-block","children":[{"type":"formatted","text":""}],"code":"interface Foo {\n  fooOnly: boolean;\n  shared: number;\n}\n\ninterface Bar {\n  barOnly: boolean;\n  shared: number;\n}\n\ndeclare const i: Foo | Bar;\nif ('barOnly' in i) {\n  // 收缩为 Bar 类型\n} else {\n  // 收缩为 Foo 类型\n}","language":"TypeScript","uuid":"39dec1a9-1e17-42d3-9824-05f1f9680323"},{"type":"paragraph","children":[{"type":"formatted","text":"instanceof","code":true},{"type":"formatted","text":" 是用来判断值是否是某个类的示例"}]},{"type":"code-block","code":"class Foo {\n\tfoo();\n}\n\nclass Bar {\n\tbar();\n}\n\ndeclare const input: Foo | Bar;\n\nif (input instanceof Foo) {\n  // 收缩为 Foo 的实例，可以调用 foo 方法\n  input.foo();\n} else {\n  // 收缩为 Bar 的实例\n  input.bar();\n}","language":"TypeScript","uuid":"0f33cc47-027c-4b8b-aa41-ca8901abc921","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑如下两个类型"}]},{"type":"code-block","code":"interface Foo {\n  type: string;\n}\n\ninterface Bar {\n  type: number;\n}","language":"TypeScript","uuid":"31473eae-abbb-4b45-8c79-2ef7f52824ee","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Foo","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"Bar","code":true},{"type":"formatted","text":" 都包含有 "},{"type":"formatted","text":"type","code":true},{"type":"formatted","text":" 类型，并且是不同的类型，但是我们却不能通过判断 "},{"type":"formatted","text":"type","code":true},{"type":"formatted","text":" 的类型使得类型进行收缩"}]},{"type":"code-block","code":"declare const a: Foo | Bar;\nif (typeof a.type === 'string') {\n  // 不能将 a 收缩到 Foo 类型\n}","language":"TypeScript","uuid":"0648995d-8794-45ed-9964-651af4529eb5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候可以使用自定义的类型守卫"}]},{"type":"code-block","code":"function isFoo(val: Foo | Bar) val is Foo  {\n  return typeof val.type === 'string';\n}\n\nif (isFoo(a)) {\n  // 可以收缩到 Foo 类型\n}","language":"TypeScript","uuid":"71ea6a45-175e-4126-9ec7-0c9163da0506","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"标准库的 "},{"type":"formatted","text":"Array.isArray","code":true},{"type":"formatted","text":" 方法就是通过这种方式将类型收缩到数组的："}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/image.73el2m1zoh40.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"还有一种方法可以收缩类型，那就是断言，断言一般常见于测试中，一旦断言失败，就表示未达到预期，抛出异常，退出程序。因此能运行到断言后面的代码，就表示断言通过了，可以通过这一特性来收缩类型"}]},{"type":"code-block","code":"function assertIsNumber(val: any): assert val is number {\n  if (!typeof val !== 'number') {\n    throw new Error();\n  }\n}\n\nconst val: number | string = 12;\nassertIsNumber(val);\n\n// 运行到这里，说明上面的断言通过了，此时 val 的类型一定是 number\nval * 100;","language":"TypeScript","uuid":"96f5675a-eba4-4c90-a524-8fb0939c1ba1","children":[{"type":"formatted","text":""}]}],"tags":["TypeScript"],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/C__Users_pc_.editor_resources_michiel-annaert-nE9eUMw8SV0-unsplash_a5de4560-b9aa-4422-9ed2-354c8ed4f462_55d1d58d-63b6-4ab6-960f-6cbf2883362f.jpg","createTime":1720063275870,"updateTime":1743303640482},"meta":{"type":"article","publishTime":1764820859520}};
