    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":20,"title":"使用 Notion 作为视频托管","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"有的时候希望在博客里面添加视频，博客托管在 Github Page 上，但是视频一般比较大，也就没有办法将其上传到 Github 上，一般来说我们可以讲视频上传到视频托管平台，比如 bilibili 和 Youtube。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于国内将视频上传到 bilibili 是一个比较好的选择，但是在博客中嵌入的 bilibili 的清晰度最高只有 720P，如果需要更高清晰度则需要前往 B站 观看，如果可以的话，我并不希望读者离开我的博文去观看视频，最好能在本页面观看。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"将视频上传到 Youtube 上没有清晰度的限制，但是因为墙的存在，视频很可能无法访问。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"除此之外，有些视频可能无法上传到视频托管平台，例如电影，由于版权，上传的视频不能过审，也无法提供视频托管服务。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"后来我发现可以将视频放在 Notion，对于 Pro Plan 可以上传无限容量的文件，当然就可以上传视频，因为它是一个网页应用，我们可以拿到视频的播放地址，我们可以将视频地址拿过来嵌入到自己的博客中，这样就可以播放视频了，并且也没有清晰度的限制，唯一的缺点可能就是播放速度可能不是很快，但是因为上传到 Notion 是不用审核的，咱们可以分享一些电影。"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202110142140352021-10-14-21-40-36.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是很快我发现天真了，链接很快就失效，Notion 做了相关处理，视频链接是有时间限制的，但是后面我想到 Notion 提供了 API 来访问页面的内容，那我们可以在每次打开博客的时候对相关页面进行访问，拿到最新的链接进行播放即可，说干就干。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"按照 Notion "},{"type":"link","url":"https://developers.notion.com/docs/getting-started","openEdit":false,"children":[{"type":"formatted","text":"官网指南"}]},{"type":"formatted","text":"，首先需要前往 https://www.notion.so/my-integrations 创建一个 integrations，具体按照它的来操作，比如我创建了一个名字为 test 的 integrations，创建好之后会给你一个字符串密钥，我们就可以通过这个密钥来访问相关页面。"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202110142148482021-10-14-21-48-49.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们将需要被访问的页面 share 到该 integrations 中，"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202110150133482021-10-15-01-33-48.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后就可以使用 Notion 提供 JS 接口来访问相关页面，首先新建一个 npm 项目，并下载依赖"}]},{"type":"code-block","code":"npm install @notionhq/client","language":"bash","uuid":"2a5c506e-c160-498d-aa83-6f02aa7a66b4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后通过下面的代码访问页面内容"}]},{"type":"code-block","code":"const { Client } = require(\"@notionhq/client\");\nconst notion = new Client({\n  auth: \"integrations密钥\",\n});\n\n(async () =\u003e {\n  const res = await notion.blocks.children.list({\n    block_id: \"块ID\",\n  });\n  const { results } = res;\n  console.log(results);\n})();","language":"js","uuid":"f32ffbb3-83b4-4f38-b2c3-cf5832f348f8","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面的代码中，我们使用 "},{"type":"formatted","text":"notion.blocks.children.list","code":true},{"type":"formatted","text":" 来获得指定块 ID 包含的所有内容，注意到页面也是一个块，而页面的块 ID 可以通过网页地址拿到"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202110142158162021-10-14-21-58-17.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述代码的运行结果为"}]},{"type":"code-block","code":"[\n  {\n    object: 'block',\n    id: '3b628e1d-84da-4c6c-900d-b6e4a285xxxx',\n    created_time: '2021-02-19T07:18:00.000Z',\n    last_edited_time: '2021-02-22T07:24:00.000Z',\n    has_children: false,\n    archived: false,\n    type: 'video',\n    video: { caption: [Array], type: 'file', file: [Object] }\n  },\n  {\n    object: 'block',\n    id: '5adccff1-b93f-4d1e-a079-0d20d1a5xxxx',\n    created_time: '2021-09-28T00:09:00.000Z',\n    last_edited_time: '2021-09-28T00:09:00.000Z',\n    has_children: false,\n    archived: false,\n    type: 'paragraph',\n    paragraph: { text: [] }\n  }\n]","language":"json","uuid":"fbb1ae14-bf4b-46c9-8c30-6f3f7511b5de","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"返回结果是一个数组，包含两个元素，都是对象，第一个元素中的 "},{"type":"formatted","text":"type","code":true},{"type":"formatted","text":" 属性为 "},{"type":"formatted","text":"video","code":true},{"type":"formatted","text":"，就是我们想要的结果，注意到这个对象有一个 id 属性，这是这个视频块的 "},{"type":"formatted","text":"blcok_id","code":true},{"type":"formatted","text":"。拿到视频的块 ID 后，我们可以使用 "},{"type":"formatted","text":"notion.blocks.retrieve","code":true},{"type":"formatted","text":" 拿到指定块的内容"}]},{"type":"code-block","code":"const { Client } = require(\"@notionhq/client\");\nconst notion = new Client({\n  auth: \"integrations密钥\",\n});\n\n(async () =\u003e {\n  const res = await notion.blocks.retrieve({\n    block_id: \"3b628e1d-84da-4c6c-900d-b6e4a285xxxx\",\n  });\n  console.log(res);\n})();","language":"js","uuid":"961d0e58-65f0-4171-bed9-becdf06e2fb0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"打印结果为"}]},{"type":"code-block","code":"{\n  object: 'block',\n  id: '3b628e1d-84da-4c6c-900d-b6e4a285xxxx',\n  created_time: '2021-02-19T07:18:00.000Z',\n  last_edited_time: '2021-02-22T07:24:00.000Z',\n  has_children: false,\n  archived: false,\n  type: 'video',\n  video: {\n    caption: [ [Object] ],\n    type: 'file',\n    file: {\n      url: 'https://s3.us-west-2.amazonaws.com/secure.notion-static.com/6f8c2891-109a-4b5f-8700-1f0214784b36/-.mp4?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAT73L2G45O3KS52Y5%2F20211014%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20211014T140553Z&X-Amz-Expires=3600&X-Amz-Signature=c42b604dacab8e48efc58b6ba48ca6b83141dbea49467b2529a73e833ca2caa8&X-Amz-SignedHeaders=host',\n      expiry_time: '2021-10-14T15:05:53.554Z'\n    }\n  }\n}","language":"json","uuid":"55fe6046-9103-42d0-b0fb-2fdccf0c184e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"video 属性中的 file 属性给出了视频的地址以及失效时间，虽然有失效时间，但是我们每次都可以通过 API 拿到新的视频播放地址，视频就会永久有效，我们可以抽离出一个 Vue 组件，该 Vue 组件接收一个视频的块 ID"}]},{"type":"code-block","code":"\u003ctemplate\u003e\n  \u003cdiv\u003e\n    \u003cvideo ref=\"video\"\u003e\u003c/video\u003e\n  \u003c/div\u003e\n\u003c/template\u003e\n\n\u003cscript\u003e\n  import { Client } from \"@notionhq/client\";\n  const notion = new Client({\n    auth: \"integrations密钥\",\n  });\n\n  export default {\n    name: \"NotionVideo\",\n    props: [\"block_id\"],\n    mounted() {\n      const video = this.$refs.video;\n      (async () =\u003e {\n        const res = await notion.blocks.retrieve({\n          block_id: this.block_id,\n        });\n        video.src = res.video.file.url;\n      })();\n    },\n  };\n\u003c/script\u003e\n\n\u003cstyle scoped\u003e\n  video {\n    max-width: 100%;\n    object-fit: contain;\n    border-radius: 5px;\n  }\n\u003c/style\u003e","language":"Vue","uuid":"a0da6e00-f140-4879-9aa8-01723d77ccd7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后如下使用"}]},{"type":"code-block","code":"\u003cNotionVideo block_id=\"3b628e1d-84da-4c6c-900d-b6e4a285xxxx\" /\u003e","language":"vue","uuid":"78fe2679-f87a-4b3c-aa2b-042197bc8480","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是万万没有想到，不能跨域！！！"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202110142229092021-10-14-22-29-09.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了解决跨域的问题，我们必须使用一个服务器中转请求，并在该服务器中处理跨域问题，但是我没有服务器，这就意味着我需要租一个服务器，但是咱没钱啊，此时我的脑海里想起可不可以使用我的电脑作为服务器呢，但是我的电脑因为到处移动，它的 IP 是不断变化的，无法提供稳定的服务，总不可能每次变 IP 我都要重新改一下请求地址并部署一次项目吧。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后我想到了内网穿透，之前用过内网穿透提供网页服务，然后我发现免费的内网穿透实在是太差劲了，而且有的平台要实名认证，我这也不敢将自己的信息暴露，我对他们是不信任的，那么似乎陷入了死胡同。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是天无绝人之路，我想到了 Serverless 服务，很多企业提供免费的函数调用，每月前一百万次调用免费，这简直就是免费，因为我根本就不可能调用一百万次。提供这样产品的企业很多，我最终选择了腾讯云提供的 Serverless 服务，因为腾讯打的广告多，之前折腾过但是没有成功，这次继续折腾。经过折腾，发现最简单的使用过程如下，首先在本地编写代码，然后将代码打包成 zip 上传即可，需要注意的是："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"入口文件为 app.js"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"监听的端口号必须为 9000"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"所需要的依赖，即 node_modules 文件夹需要一起打包"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下所示"}]},{"type":"code-block","code":"const Koa = require(\"koa\");\nconst app = new Koa();\n\nconst { Client } = require(\"@notionhq/client\");\nconst notion = new Client({\n  auth: \"integrations密钥\",\n});\n\n// 跨域处理\napp.use(async (ctx, next) =\u003e {\n  ctx.set(\"Access-Control-Allow-Origin\", \"*\");\n  ctx.set(\n    \"Access-Control-Allow-Headers\",\n    \"Content-Type, Content-Length, Authorization, Accept, X-Requested-With , yourHeaderFeild\"\n  );\n  ctx.set(\"Access-Control-Allow-Methods\", \"PUT, POST, GET, DELETE, OPTIONS\");\n  if (ctx.method == \"OPTIONS\") {\n    ctx.body = 200;\n  } else {\n    await next();\n  }\n});\n\napp.use(async (ctx, next) =\u003e {\n  const query = ctx.query;\n  const { block_id } = query;\n  if (!block_id) {\n    ctx.body = {};\n    await next();\n  }\n  const res = await notion.blocks.retrieve({\n    block_id,\n  });\n  ctx.body = {\n    url: res.video.file.url,\n  };\n});\n\n// Web 类型云函数，只能监听 9000 端口\napp.listen(9000, () =\u003e {\n  console.log(`Server start on http://localhost:9000`);\n});","language":"js","uuid":"ebfc44a7-acf1-478c-8a44-b0bdf20db396","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"注意到在代码中做了跨域处理，所以就不存在跨域的问题。然后我们点击部署，接着会给出一个访问地址，我们就可以通过访问地址来请求服务。"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202110150116212021-10-15-01-16-22.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面我们就需要更改 NotionVideo.vue 文件，使用 fetch 方法访问腾讯云给出的访问路径"}]},{"type":"code-block","code":"\u003ctemplate\u003e\n  \u003cdiv\u003e\n    \u003cvideo ref=\"video\" controls\u003e\u003c/video\u003e\n  \u003c/div\u003e\n\u003c/template\u003e\n\n\u003cscript\u003e\n  export default {\n    name: \"NotionVideo\",\n    props: [\"block_id\"],\n    mounted() {\n      const video = this.$refs.video;\n      fetch(`腾讯云访问路径/?block_id=${this.block_id}`)\n        .then((res) =\u003e res.json())\n        .then((data) =\u003e {\n          const { url } = data;\n          if (!url) {\n            return;\n          }\n          video.src = url;\n        })\n        .catch((e) =\u003e {\n          console.log(\"视频加载失败\");\n        });\n    },\n  };\n\u003c/script\u003e\n\n\u003cstyle scoped\u003e\n  video {\n    max-width: 100%;\n    object-fit: contain;\n    border-radius: 5px;\n  }\n\u003c/style\u003e","language":"vue","uuid":"f19a3a4c-2b39-44c8-b5f8-f47ba92e15af","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面我们便可以通过如下方式访问视频"}]},{"type":"code-block","code":"\u003cNotionVideo block_id=\"3b628e1d-84da-4c6c-900d-b6e4a285xxxx\" /\u003e","language":"Vue","uuid":"e55d4e94-d4d3-4b0c-a0b4-5dfe04ba1c12","children":[{"type":"formatted","text":""}]}],"tags":["Notion","视频托管"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-k71rom_82a12a88-b4cd-4bcf-9fda-b55a97ce04ee.jpg","createTime":1637572352000,"updateTime":1743303640466},"meta":{"type":"article","publishTime":1764823685319}};
    </script>
