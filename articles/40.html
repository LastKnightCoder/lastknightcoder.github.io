      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":40,"title":"离散时间傅里叶变换","author":"","content":[{"type":"header","children":[{"type":"formatted","text":"定义"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们定义离散时间傅里叶(DTFT)变换为"}]},{"type":"block-math","tex":"X(e^{jw})=\\sum_{n=-\\infty}^{\\infty}x[n]e^{-jwn}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其实我在书上看到这里的时候不太理解为什么离散傅里叶变换要这么定义，其实书上直接给出这么一个公式有一点马后炮的感觉，我想知道这个公式为什么这么定义，想知道的是一个设计的过程，这么定义为什么能够给出频谱密度，所以接下来谈谈我的理解。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"说到频谱密度的话，我们其实对连续傅里叶变换比较了解，并且知道为什么连续傅里叶变换为什么能反映连续信号的频谱密度，所以我打算从连续时间信号进行入手。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑离散时间信号 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 是对连续时间信号 "},{"type":"inline-math","tex":"x_a(t)","children":[{"type":"formatted","text":"x_a(t)"}]},{"type":"formatted","text":" 的抽样，抽样的周期为"},{"type":"inline-math","tex":"T_s","children":[{"type":"formatted","text":"T_s"}]},{"type":"formatted","text":"，得到抽样信号 "},{"type":"inline-math","tex":"\\hat{x}_a(t)","children":[{"type":"formatted","text":"\\hat{x}_a(t)"}]},{"type":"formatted","text":"，假设连续时间信号的傅里叶变换为 "},{"type":"inline-math","tex":"X(j\\Omega)","children":[{"type":"formatted","text":"X(j\\Omega)"}]},{"type":"formatted","text":"(在接下来的表示中，连续时间信号的频域符号用 "},{"type":"inline-math","tex":"\\Omega","children":[{"type":"formatted","text":"\\Omega"}]},{"type":"formatted","text":" 表示，离散时间信号频域符号用 "},{"type":"inline-math","tex":"w","children":[{"type":"formatted","text":"w"}]},{"type":"formatted","text":" 表示)，那么抽样信号 "},{"type":"inline-math","tex":"\\hat{x}_a(t)","children":[{"type":"formatted","text":"\\hat{x}_a(t)"}]},{"type":"formatted","text":" 的傅里叶变换为"}]},{"type":"block-math","tex":"\\hat{x}_a(t)=x_a(t)\\sum_{n=-\\infty}^{\\infty}\\delta(t-nT_s)=\\sum_{n=-\\infty}^{\\infty}x_a(nT_s)\\delta(t-nT_s)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于 "},{"type":"inline-math","tex":"\\delta(t-nT_s)","children":[{"type":"formatted","text":"\\delta(t-nT_s)"}]},{"type":"formatted","text":" 的傅里叶变换为 "},{"type":"inline-math","tex":"e^{-j\\Omega nT_s}","children":[{"type":"formatted","text":"e^{-j\\Omega nT_s}"}]},{"type":"formatted","text":"，所以"}]},{"type":"block-math","tex":"\\hat{X}(j\\Omega)=\\sum_{n=-\\infty}^{\\infty}x_a(nT_s)e^{-j\\Omega nT_s}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"仔细观察这个表达式，虽然从这个表达式中看不出 "},{"type":"inline-math","tex":"\\hat{X}_a(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}_a(j\\Omega)"}]},{"type":"formatted","text":" 与 "},{"type":"inline-math","tex":"X(j\\Omega)","children":[{"type":"formatted","text":"X(j\\Omega)"}]},{"type":"formatted","text":" 的关系，但是敏锐的人已经发现了这个表达式与我们所定义的离散时间傅里叶变换之间的联系，如果用 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 替换 "},{"type":"inline-math","tex":"x[nT_s]","children":[{"type":"formatted","text":"x[nT_s]"}]},{"type":"formatted","text":" (这样的替换显然是合理的)，并且令 "},{"type":"inline-math","tex":"w=\\Omega T_s","children":[{"type":"formatted","text":"w=\\Omega T_s"}]},{"type":"formatted","text":"，我们就可以得到离散时间傅里叶变换的表达式"}]},{"type":"block-math","tex":"X(e^{jw})=\\sum_{n=-\\infty}^{\\infty}x[n]e^{-jwn}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们似乎解决了 DTFT 的由来，但是没有解决为什么 DTFT 能够表示信号的频谱，为了解决这个问题，我们还是要研究一下 "},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" ,由于"}]},{"type":"block-math","tex":"\\hat{x}_a(t)=x_a(t)\\sum_{n=-\\infty}^{\\infty}\\delta(t-nT_s)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"而"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}\\delta(t-nT_s)\\xrightarrow{CTFT}\\frac{2\\pi}{T_s}\\sum_{n=-\\infty}^{\\infty}\\delta(\\Omega-n\\Omega_s), \\, \\Omega_s=\\frac{2\\pi}{T_s}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个傅里叶变换不熟悉的去翻阅资料，因为在这里推导的话可能会破坏思路的连续性，所以就不进行推导了。所以得到 "},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" 的另一表达形式"}]},{"type":"block-math","tex":"\\begin{aligned}\n  \\hat{X}(j\\Omega)\n  &=\\frac{1}{2\\pi} X(j\\Omega) * \\frac{2\\pi}{T_s} \\sum_{n=-\\infty}^{\\infty} \\delta(\\Omega-n\\Omega_s) \\\\\n  &=\\frac{1}{T_s} \\sum_{n=-\\infty}^{\\infty} X(j(\\Omega -n\\Omega_s))\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"看到这里就明朗了，从表达式上看，"},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" 与 "},{"type":"inline-math","tex":"X(j\\Omega)","children":[{"type":"formatted","text":"X(j\\Omega)"}]},{"type":"formatted","text":" 的关系为 "},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" 是 "},{"type":"inline-math","tex":"X(j\\Omega)","children":[{"type":"formatted","text":"X(j\\Omega)"}]},{"type":"formatted","text":" 以 "},{"type":"inline-math","tex":"\\Omega_s","children":[{"type":"formatted","text":"\\Omega_s"}]},{"type":"formatted","text":" 为周期进行周期延拓。如果 "},{"type":"inline-math","tex":"\\Omega_s","children":[{"type":"formatted","text":"\\Omega_s"}]},{"type":"formatted","text":" 足够大(如果知道抽样定理，就知道 "},{"type":"inline-math","tex":"\\Omega_s \\geq 2\\Omega_m","children":[{"type":"formatted","text":"\\Omega_s \\geq 2\\Omega_m"}]},{"type":"formatted","text":" 即可，"},{"type":"inline-math","tex":"\\Omega_m","children":[{"type":"formatted","text":"\\Omega_m"}]},{"type":"formatted","text":" 是 "},{"type":"inline-math","tex":"x_a(t)","children":[{"type":"formatted","text":"x_a(t)"}]},{"type":"formatted","text":" 的最高频率)使得 "},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" 没有发生混叠的话，那么 "},{"type":"inline-math","tex":"X(j\\Omega)","children":[{"type":"formatted","text":"X(j\\Omega)"}]},{"type":"formatted","text":" 只是 "},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" 的一个周期。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"根据"}]},{"type":"block-math","tex":"X(e^{jw})=\\hat{X}(j\\Omega)\\vert_{w=\\Omega T_s}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以就可以知道为什么 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":" 为什么可以表示信号的频谱。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为 "},{"type":"inline-math","tex":"\\hat{X}(j\\Omega)","children":[{"type":"formatted","text":"\\hat{X}(j\\Omega)"}]},{"type":"formatted","text":" 是一个周期信号，根据"}]},{"type":"block-math","tex":"X(e^{jw})=\\hat{X}(j\\Omega)\\vert_{w=\\Omega T_s}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以 "},{"type":"inline-math","tex":"X(je^{jw})","children":[{"type":"formatted","text":"X(je^{jw})"}]},{"type":"formatted","text":" 也是一个周期信号，其周期为 "},{"type":"inline-math","tex":"2\\pi","children":[{"type":"formatted","text":"2\\pi"}]},{"type":"formatted","text":" ,如下证明"}]},{"type":"block-math","tex":"X(e^{j(w+2\\pi)})=\\sum_{n=-\\infty}^{\\infty}x[n]e^{-j(w+2\\pi)n}=\\sum_{n=-\\infty}^{\\infty}x[n]e^{-jwn}=X(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在 "},{"type":"inline-math","tex":"[-\\pi,\\pi]","children":[{"type":"formatted","text":"[-\\pi,\\pi]"}]},{"type":"formatted","text":" 上，"},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":" 就包含了原模拟频谱的所有信息，所以离散时间傅里叶反变换的公式定义为"}]},{"type":"block-math","tex":"x[n]=\\frac{1}{2\\pi}\\int_{-\\pi}^{\\pi}X(e^{jw})e^{jwn}dw","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"对称性质"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"共轭对称序列 "},{"type":"inline-math","tex":"x_{cs}[n]=\\dfrac{1}{2}(x[n]+x^{*}[-n])","children":[{"type":"formatted","text":"x_{cs}[n]=\\dfrac{1}{2}(x[n]+x^{*}[-n])"}]},{"type":"formatted","text":" 以及共轭反对称序列 "},{"type":"inline-math","tex":"x_{ca}[n]=\\frac{1}{2}(x[n]-x^{*}[-n])","children":[{"type":"formatted","text":"x_{ca}[n]=\\frac{1}{2}(x[n]-x^{*}[-n])"}]},{"type":"formatted","text":"，同理，我们定义 "},{"type":"inline-math","tex":"X_{cs}(e^{jw})=\\dfrac{1}{2}(X(e^{jw})+X^{*}(e^{-jw}))","children":[{"type":"formatted","text":"X_{cs}(e^{jw})=\\dfrac{1}{2}(X(e^{jw})+X^{*}(e^{-jw}))"}]},{"type":"formatted","text":" 为 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":" 的共轭对称部分，"},{"type":"inline-math","tex":"X_{ca}(e^{jw})=\\dfrac{1}{2}(X(e^{jw})-X^{*}(e^{-jw}))","children":[{"type":"formatted","text":"X_{ca}(e^{jw})=\\dfrac{1}{2}(X(e^{jw})-X^{*}(e^{-jw}))"}]},{"type":"formatted","text":" 为 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":" 的共轭反对称部分。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"假设复序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 的 DTFT 为 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":"，那么 "},{"type":"inline-math","tex":"x^{*}[n]","children":[{"type":"formatted","text":"x^{*}[n]"}]},{"type":"formatted","text":" 的 DTFT 为"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}x^{*}[n]e^{-jwn}=(\\sum_{n=-\\infty}^{\\infty}x[n]e^{-(-jwn)})^{*}=X^{*}(e^{-jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"x[-n]","children":[{"type":"formatted","text":"x[-n]"}]},{"type":"formatted","text":" 的 DTFT 为"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}x[-n]e^{-jwn}=\\sum_{m=-\\infty}^{\\infty}x[m]e^{-(-jwm)}=X(e^{-jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以综合以上二者得到 "},{"type":"inline-math","tex":"x^{*}[-n]","children":[{"type":"formatted","text":"x^{*}[-n]"}]},{"type":"formatted","text":" 的 DTFT 为 "},{"type":"inline-math","tex":"X^{*}(e^{jw})","children":[{"type":"formatted","text":"X^{*}(e^{jw})"}]},{"type":"formatted","text":"﻿"}]},{"type":"paragraph","children":[{"type":"formatted","text":"该序列实部的 DTFT 为"}]},{"type":"block-math","tex":"DTFT[x_{re}[n]]=DTFT[\\frac{1}{2}(x[n]+x^{*}[n])]=\\frac{1}{2}(X(e^{jw})+X^{*}(e^{-jw}))=X_{cs}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"虚部的 DTFT 为"}]},{"type":"block-math","tex":"DTFT[jx_{im}[n]]=DTFT[\\frac{1}{2}(x[n]-x^{*}[n])]=\\frac{1}{2}(X(e^{jw})-X^{*}(e^{-jw}))=X_{ca}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"共轭对称部分的 DTFT 为"}]},{"type":"block-math","tex":"DTFT[x_{cs}[n]]=DTFT[\\frac{1}{2}(x[n]+x^{*}[-n])]=\\frac{1}{2}(X(e^{jw})+X^{*}(e^{jw}))=X_{re}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"共轭反对称部分的 DTFT 为"}]},{"type":"block-math","tex":"DTFT[x_{ca}[n]]=DTFT[\\frac{1}{2}(x[n]-x^{*}[-n])]=\\frac{1}{2}(X(e^{jw})-X^{*}(e^{jw}))=jX_{im}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"简单的把上面的公式总结一下"}]},{"type":"block-math","tex":"\\color{red}x_{re}[n]\\xleftrightarrow{DTFT}X_{cs}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"block-math","tex":"\\color{red}jx_{im}[n]\\xleftrightarrow{DTFT}X_{ca}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"block-math","tex":"\\color{red}x_{cs}[n]\\xleftrightarrow{DTFT}X_{re}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"block-math","tex":"\\color{red}x_{ca}[n]\\xleftrightarrow{DTFT}jX_{im}(e^{jw})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这就是 DTFT 的一些对称性质。"}]},{"type":"header","children":[{"type":"formatted","text":"收敛条件"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"从 DTFT 的表达式看，这是一个无穷级数的求和，所以是有收敛条件的。如果如果信号满足"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}\\vert x[n]\\vert \u003c \\infty","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"那么称序列 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 绝对可和，并且由于"}]},{"type":"block-math","tex":"\\vert X(e^{jw})\\vert=\\vert \\sum_{n=-\\infty}^{\\infty}x[n]e^{-jwn}\\vert \\leq \\sum_{n=-\\infty}^{\\infty}\\vert x[n] \\vert\\vert e^{-jwn}\\vert\u003c\\infty","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"即如果 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 是绝对可和的话，那么 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":" 一定存在，所以 "},{"type":"inline-math","tex":"x[n]","children":[{"type":"formatted","text":"x[n]"}]},{"type":"formatted","text":" 绝对可和是离散时间傅里叶 "},{"type":"inline-math","tex":"X(e^{jw})","children":[{"type":"formatted","text":"X(e^{jw})"}]},{"type":"formatted","text":" 存在的充分条件。这种收敛称为一致收敛。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑另一种收敛为均方收敛，有的信号不是绝对可和信号，但是"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}\\vert x[n]\\vert^2 \u003c \\infty","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"该种收敛不是一致收敛，所以会产生 Gibbs 现象。另一信号是既不是绝对可和信号，也不是平方可和信号(比如常数,单位阶跃信号 "},{"type":"inline-math","tex":"\\mu[n]","children":[{"type":"formatted","text":"\\mu[n]"}]},{"type":"formatted","text":")，为了定义其傅里叶变换，引入了狄拉克函数 "},{"type":"inline-math","tex":"\\delta(t)","children":[{"type":"formatted","text":"\\delta(t)"}]},{"type":"formatted","text":"，关于狄拉克函数在信号与系统中有详细介绍，这里不多讲。"}]},{"type":"header","children":[{"type":"formatted","text":"常见 DTFT 变换对"}],"level":2},{"type":"highlight-block","color":"orange","children":[{"type":"block-math","tex":"\\delta[n]\\xleftrightarrow{DTFT}1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"证明："}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}\\delta[n]e^{-jwn}=1","children":[{"type":"formatted","text":""}]}]},{"type":"highlight-block","color":"orange","children":[{"type":"block-math","tex":"1(-\\infty \u003c n \u003e \\infty)\\xleftrightarrow{DTFT}\\sum_{k=-\\infty}^{\\infty}2\\pi \\delta(w+2\\pi k)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"证明：由于常数1既不是绝对可和序列，也不是平方可和序列，所以其傅里叶变换为带有狄拉克函数，证其傅里叶变换比较困难，可以从其反变换入手"}]},{"type":"block-math","tex":"\\frac{1}{2\\pi}\\int_{-\\pi}^{\\pi}\\sum_{k=-\\infty}^{\\infty}2\\pi \\delta(w+2\\pi k)dw=1","children":[{"type":"formatted","text":""}]}]},{"type":"highlight-block","color":"orange","children":[{"type":"block-math","tex":"\\mu[n]\\xleftrightarrow{DTFT}\\frac{1}{1-e^{-jw}}+\\sum_{k=-\\infty}^{\\infty}\\pi \\delta(w+2\\pi k)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"证明："},{"type":"inline-math","tex":"\\mu[n]","children":[{"type":"formatted","text":"\\mu[n]"}]},{"type":"formatted","text":" 既不是绝对可和序列，也不是平方可和序列，还是得从另外的方法去证，将 "},{"type":"inline-math","tex":"\\mu[n]","children":[{"type":"formatted","text":"\\mu[n]"}]},{"type":"formatted","text":" 分解为偶部和奇部，则其偶部为"}]},{"type":"block-math","tex":"y_{ev}[n]=\\frac{1}{2}(\\mu[n]+\\mu[-n])=\\frac{1}{2}+\\frac{1}{2}\\delta[n]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其傅里叶变换为"}]},{"type":"block-math","tex":"Y_{ev}(e^{jw})=\\sum_{k=-\\infty}^{\\infty}\\pi \\delta(w+2\\pi k)+\\frac{1}{2}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其奇部为"}]},{"type":"block-math","tex":"y_{od}[n]=\\frac{1}{2}(\\mu[n]-\\mu[-n])=\\frac{1}{2}(2\\mu[n]-(\\mu[n]+\\mu[-n]))=\\mu[n]-\\frac{1}{2}-\\frac{1}{2}\\delta[n]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以"}]},{"type":"block-math","tex":"\\begin{aligned}\n&\\quad y_{od}[n]-y_{od}[n-1]=\\frac{1}{2}(\\delta[n]+\\delta[n-1]) \\\\\n&\\Rightarrow (1-e^{-jw})Y_{od}(e^{jw})=\\frac{1}{2}(1+e^{-jw}) \\\\\n&\\Rightarrow Y_{od}(e^{jw})=\\frac{1}{2}\\frac{1+e^{jw}}{1-e^{jw}}=-\\frac{1}{2}+\\frac{1}{1-e^{jw}}\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"得到"}]},{"type":"block-math","tex":"\\mu[n]\\xrightarrow{DTFT}Y_{ev}(e^(jw))+Y_{od}(e^{jw})=\\frac{1}{1-e^{-jw}}+\\sum_{k=-\\infty}^{\\infty}\\pi \\delta(w+2\\pi k)","children":[{"type":"formatted","text":""}]}]},{"type":"highlight-block","color":"orange","children":[{"type":"block-math","tex":"e^{jw_0n}\\xleftrightarrow{DTFT}\\sum_{k=-\\infty}^{\\infty}2\\pi \\delta(w-w_0+2\\pi k)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"证明：根据"}]},{"type":"block-math","tex":"1\\xrightarrow{DTFT}\\sum_{n=-\\infty}^{\\infty}e^{-jwn}=\\sum_{k=-\\infty}^{\\infty}2\\pi \\delta(w+2\\pi k)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对 "},{"type":"inline-math","tex":"e^{jw_{0}n}","children":[{"type":"formatted","text":"e^{jw_{0}n}"}]},{"type":"formatted","text":" 进行变换"}]},{"type":"block-math","tex":"e^{jw_0n}\\xrightarrow{DTFT}\\sum_{n=-\\infty}^{\\infty}e^{-j(w-w_0)n}=\\sum_{k=-\\infty}^{\\infty}2\\pi \\delta(w-w_0+2\\pi k)","children":[{"type":"formatted","text":""}]}]},{"type":"highlight-block","color":"orange","children":[{"type":"block-math","tex":"\\alpha^n\\mu[n](\\vert \\alpha \\vert \u003c 1)\\xleftrightarrow{DTFT}\\frac{1}{1-\\alpha e^{-jw}}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"证明：该序列是绝对可和序列，所以可用 DTFT 的定义直接求和"}]},{"type":"block-math","tex":"\\sum_{n=-\\infty}^{\\infty}\\alpha^{n}\\mu[n]e^{-jwn}=\\sum_{n=0}^{\\infty}(\\alpha e^{-jw})^n=\\frac{1}{1-\\alpha e^{-jw}}","children":[{"type":"formatted","text":""}]}]}],"tags":[],"bannerBg":
