    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":60,"title":"TypeScript 入门指南","author":"","content":[{"type":"header","children":[{"type":"formatted","text":"介绍"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"TypeScript 是什么"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"TypeScript 是什么? 引用官方的定义"}],"disableDrag":false},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"TypeScript is a typed superset of JavaScript that compiles to plain JavaScript. Any browser. Any host. Any OS. Open source."}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"简单翻译就是"}],"disableDrag":false},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"TypeScript 是 JavaScript 的超集，并且可以被编译成 JavaScript。它可以运行在任何浏览器，任何主机，任何操作系统上。并且它是开源的。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"看到这里你可能对 TypeScript 还是没有什么感觉，其实在我看来 TypeScript 是对 JavaScript 做了各种限制，这里说的限制并不是贬义的意思，因为 JavaScript 实在是太灵活了，很多的问题只有在运行的时候才会暴露出来，比如对于函数，即使定义时要求传两个参数，但是在使用时却可以传入任意的参数，所以你无法限制使用该函数的用户传入正确的参数，如果碰到不仔细看 API 文档的用户，鬼知道它使用的时候会传入什么，出了问题说不定会甩锅你兼容性做的不好。而 TypeScript 则限制了这一点，在使用时传入的参数必须与定义传入的相同，并且有提示每个参数的作用，用户使用该函数时必须按规定的来。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"TypeScript 的优势"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"那么 TypeScript 可以为我们带来什么好处："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"错误在编译时就可以暴露出来，而不必等到运行时才暴露出来"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如下 js 文件"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2765a19a-e611-4ce1-a88c-2c2a01aafbc4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2765a19a-e611-4ce1-a88c-2c2a01aafbc4.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如上，一不小心将变量名写错了，写成了 "},{"type":"formatted","text":"MyNane","code":true},{"type":"formatted","text":"，这种错误是很有可能发生的，但是在很多的时候我们自己却很难发现，只有当我们运行该程序报错的时候，我们才有可能根据报错信息，确定报错的原因；更糟糕的是，如果报错的信息不明确，你几乎无法确定是哪里出现问题，到时候要靠一双肉眼去找出这么一个小小的不同，曾经我就有因为变量名写错的问题，我找了半个小时。但是如果我们使用 TypeScript 的话，这样的问题在编译时就会被发现，如下 ts 文件"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1487fa64-1202-4cb2-b040-2da1bb4d8632.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1487fa64-1202-4cb2-b040-2da1bb4d8632.png"},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以发现，在 "},{"type":"formatted","text":"MyNane","code":true},{"type":"formatted","text":" 下面出现了红色的波浪线，将鼠标放在上面，还会贴心的给出提示。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"智能提示"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"对于现代的程序员来说，代码的智能提示那是能够大大的提高工作效率的，不仅如此，还可以减少出错的概率，如果你手动写出一个对象的方法名，出错的概率可是很高的，特别是对于一些英语不好的同学。但是问题来了，因为 JavaScript 不是静态类型，而是动态类型，所有的变量都使用 "},{"type":"formatted","text":"var","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"let","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"const","code":true},{"type":"formatted","text":" 声明，而不是像 C 语言这样静态类型语言，不同的类型使用不同的关键字，如 "},{"type":"formatted","text":"int","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"char[]","code":true},{"type":"formatted","text":" 等等。所以这就意味着 JavaScript 这个类型是可变的，一会儿这是字符串类型，一会儿是数字类型，编译器在编译阶段根本不能确定你是什么类型，所以无法给出相应类型的特有方法，比如字符串类型的 "},{"type":"formatted","text":"toUpperCase()","code":true},{"type":"formatted","text":" 方法，如下 js 文件"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f4c6173744b6e69676874436f6465722f696d6167652d666f722d32303232406d61737465722f323032303035323931303430323032322d31302d32332d32302d32362d33312e676966_e7126af3-dfe3-4814-974e-710dcece7938.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f4c6173744b6e69676874436f6465722f696d6167652d666f722d32303232406d61737465722f323032303035323931303430323032322d31302d32332d32302d32362d33312e676966_e7126af3-dfe3-4814-974e-710dcece7938.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"如上，上面的函数的功能是将传入的单词首字母大写，我们只是简单的调用字符串对象的函数 "},{"type":"formatted","text":"toUpperCase()","code":true},{"type":"formatted","text":"，但是我们发现当我们打出 word. 时没有给出任何的提出，因为 JavaScript 根本不能确定你传入的是不是字符串，毕竟 JavaScript 是如此的灵活，使用时你可以传入任何类型的参数。但是对于 TypeScript 就不一样了，因为它会对参数的类型做出限制，如下"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f4c6173744b6e69676874436f6465722f696d6167652d666f722d32303232406d61737465722f323032303035323931303436323032322d31302d32332d32302d32372d31302e676966_905e248f-36e7-4145-a558-b2890214f131.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f4c6173744b6e69676874436f6465722f696d6167652d666f722d32303232406d61737465722f323032303035323931303436323032322d31302d32332d32302d32372d31302e676966_905e248f-36e7-4145-a558-b2890214f131.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"我们限制了传入的参数必须为 "},{"type":"formatted","text":"string","code":true},{"type":"formatted","text":" 类型，在编译的阶段，我们能够肯定传入的一定是 "},{"type":"formatted","text":"string","code":true},{"type":"formatted","text":" 类型，所以在函数的方法里面，当我们输入 "},{"type":"formatted","text":"word","code":true},{"type":"formatted","text":". 时会给出字符串对象的所有方法。除此之外，我们还规定了函数必须传入什么类型，这样用户在使用时就不能随便的传入参数，所有的一切必须按规定的来，这又无形的减少了 bug 的产生，并且用户在调用该方法时，还会给出提出，需要传入什么参数类型，必要的时候还可以给出传入参数的意义，如下"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f4c6173744b6e69676874436f6465722f696d6167652d666f722d32303232406d61737465722f323032303035323931303537323032322d31302d32332d32302d32372d34352e676966_7dbe7e14-05dc-49e2-b639-3ffe0e26825a.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f4c6173744b6e69676874436f6465722f696d6167652d666f722d32303232406d61737465722f323032303035323931303537323032322d31302d32332d32302d32372d34352e676966_7dbe7e14-05dc-49e2-b639-3ffe0e26825a.gif"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"TypeScript 的好处还不止这一些，不过就我列举的这两个，就有足够的理由来学 TypeScript 了，TypeScript 更多的好处就需要你在使用的过程中慢慢理会了。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"入门使用"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"下面就将介绍 TypeScript 的安装，以及如何将 TypeScript 转化为 JavaScript 代码，毕竟浏览器和 Node 只能运行 JavaScript 代码。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"安装 TypeScript"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"在安装 TypeScript 之前，确保你的计算机按照好了 Node，如果没有安装，可以去网上搜如何安装，教程很多。安装完成之后，使用 npm 下载 typescript"}],"disableDrag":false},{"type":"code-block","code":"npm install -g typescript","language":"shell","uuid":"58f35d0f-32da-4ed4-bbf9-105a3a01eaee","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"查看版本(主要是验证是否成功安装)"}],"disableDrag":false},{"type":"code-block","code":"tsc -V\n\nVersion 3.8.3","language":"shell","uuid":"ff430825-fc13-4d8e-b336-069fab218312","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"编写 TypeScript 程序"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"新建 greeter.ts"}],"disableDrag":false},{"type":"code-block","code":"function greeter(person: string) {\n    return \"Hello \" + person;\n}\n\nlet user = 'XT';\nconsole.log(greeter(user));","language":"ts","uuid":"021d6d3c-b42e-4f50-89b4-39cab887d098","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在命令行中使用 "},{"type":"formatted","text":"tsc","code":true},{"type":"formatted","text":" 命令将它编译为 js"}],"disableDrag":false},{"type":"code-block","code":"tsc greeter.ts","language":"js","uuid":"ca8fc092-ec12-4b8c-a95e-dd97ff348da7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这时会在该目录下生成 greeter.js，greeter.js 的内容为"}],"disableDrag":false},{"type":"code-block","code":"function greeter(person) {\n    return \"Hello \" + person;\n}\nvar user = 'XT';\nconsole.log(greeter(user));","language":"js","uuid":"ea6431ed-bb6b-462b-8ed4-3f14f32d3229","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着我们使用 node 运行该 js 文件"}],"disableDrag":false},{"type":"code-block","code":"node greeter.js","language":"js","uuid":"d2f8de63-6d51-4491-a8a4-e16c00225e5f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}],"disableDrag":false},{"type":"code-block","code":"Hello XT","language":"js","uuid":"d35d68b8-585b-47c8-88c5-afbdaeee648c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们一般的流程为，编写 ts 文件，然后使用 "},{"type":"formatted","text":"tsc","code":true},{"type":"formatted","text":" 编译为 js 文件，然后使用 node 运行 js 文件查看结果，那有没有什么工具帮我们做这件事情，一个命令直接到位。这里我们推荐使用 "},{"type":"formatted","text":"ts-node","code":true},{"type":"formatted","text":"，该命令可以一步到位，就相当于是直接运行 ts 文件，首先下载 "},{"type":"formatted","text":"ts-node","code":true}],"disableDrag":false},{"type":"code-block","code":"npm install -g ts-node","language":"shell","uuid":"f35f2260-7c95-4c01-90bf-566c58ce7f2e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们可以直接使用 "},{"type":"formatted","text":"ts-node greeter.ts","code":true},{"type":"formatted","text":" 查看结果。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"基本类型"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"TypeScript 与 JavaScript 最大的不同就是 TypeScript 是一个有类型的语言，我们一般使用下面的方式声明变量"}],"disableDrag":false},{"type":"code-block","code":"let 变量名: 类型 = 值;","language":"ts","uuid":"2386ca8d-d831-4c0d-a14d-41beb0132dae","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"那么 TypeScript 有哪些类型呢? 下面就简单介绍一下。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"boolean"}],"level":3},{"type":"code-block","code":"// 值只能为true或者false\nlet isDone: boolean = false;","language":"ts","uuid":"357f620c-3548-4449-8775-3b26c9277595","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"number"}],"level":3},{"type":"code-block","code":"let decNumber: number = 20; // 十进制\nlet hexNumber: number = 0x14; // 十六进制 20\nlet binNumber: number = 0b10100; // 二进制 20\nlet octNumber: number = 0o24; //八进制 20","language":"ts","uuid":"59b2c4b4-d0d8-4c02-b900-26590d91fa96","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"string"}],"level":3},{"type":"code-block","code":"let name: string = \"bob\"; // 单引号，双引号都可以\nlet greetStr: string = `Hello ${name}`; // 支持模板字符串","language":"ts","uuid":"25a7d67b-1001-4a1b-a66b-37ed599cba8a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"数组(Array)"}],"level":3},{"type":"code-block","code":"let list: number[] = [1, 2, 3]; // 数字数组\nlet list: Array<number> = [1, 2, 3]; // 数组泛型","language":"ts","uuid":"b8e1509b-22d5-46ce-b53e-c48a2fe120ce","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"元组(Tuple)"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"规定了数组的长度，以及每个元素的类型"}],"disableDrag":false},{"type":"code-block","code":"let x: [string, number]; // x有两个元素，第一个元素为字符串，第二个元素为数字\nx = [\"hello\", 1]","language":"ts","uuid":"4b44877d-a81f-44f7-8faa-8afccf66b94c","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"enum"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"枚举类型"}],"disableDrag":false},{"type":"code-block","code":"enum Color {\n    Red,\n    Green,\n    Blue\n}\n\nlet colorName: Color = Color.Blue;","language":"ts","uuid":"3191822f-7971-4970-98af-9ada6c22ff08","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"any"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"任意类型，与写 JavaScript 一样"}],"disableDrag":false},{"type":"code-block","code":"// 不清楚是什么类型，或者不希望做语法检查，就相当于写JavaScript\nlet notSure: any = 4;\nnotSure = false;\n\nlet list: any[] = [1, true, \"a\"]","language":"ts","uuid":"2af94352-a5d4-46de-a871-390fc0f6ba64","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"void"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"void","code":true},{"type":"formatted","text":" 一般用于表示函数不返回任何值，将它声明为一个变量没有意义"}],"disableDrag":false},{"type":"code-block","code":"// 不返回任何值\nfunction printUser(user): void {\n    console.log(user)\n}\n\n// 声明一个void类型变量是没有意义的\nlet x: void = null; // 只能被赋值为null和undefined","language":"ts","uuid":"5a5967e4-035f-4b6e-be56-b4b7a1a5194f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"undefined, null"}],"level":3},{"type":"code-block","code":"let u: undefined = undefined; // 通常声明变量意义不大\nlet n: null = null;","language":"ts","uuid":"ea13967e-91fd-4a5f-b9e6-c2613b6965c7","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"never"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"函数抛出异常或者死循环是可以使用 "},{"type":"formatted","text":"never","code":true},{"type":"formatted","text":" 作为返回值"}],"disableDrag":false},{"type":"code-block","code":"// 表示不存在的数据类型 函数抛出异常的时候就可以用never \n// never是任何类型的子类型，可以赋值给任何的类型\nfunction error(message: string): never {\n    throw new Error(message)\n}\n\nfunction fail() {\n    return error(\"something error\");\n}\n\n// 无限循环，函数不能结束，也可以返回never\nfunction inifiniteLoop(): never {\n    while (true) {\n\n    }\n}","language":"ts","uuid":"6726a7e3-ea65-4c81-8c5e-1dad52e1eb2f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"object"}],"level":3},{"type":"code-block","code":"// 表示非原始类型\ndeclare function create(o: object | null): void;\n\ncreate({prop: 0});","language":"ts","uuid":"dab9b1fe-c7ea-48d0-8773-379f49fcd3b1","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当没有将变量声明为某个基本类型时，TypeScript 会进行类型推断，如"}],"disableDrag":false},{"type":"code-block","code":"let str = 'hello'; // str 会被推断为 string 类型","language":"ts","uuid":"15b99e92-72b6-4406-a472-c0aaed96fbe2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如上，变量 "},{"type":"formatted","text":"str","code":true},{"type":"formatted","text":" 会被推断为 "},{"type":"formatted","text":"string","code":true},{"type":"formatted","text":" 类型，这时 "},{"type":"formatted","text":"str","code":true},{"type":"formatted","text":" 不能被赋值为别的类型"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0389c41b-52ee-47a3-8e7d-b36dc6642b1b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0389c41b-52ee-47a3-8e7d-b36dc6642b1b.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如果变量在声明时并没有被赋值，那么它的类型会被推断为 "},{"type":"formatted","text":"any","code":true},{"type":"formatted","text":"，这时它可以被赋予任何类型的值"}],"disableDrag":false},{"type":"code-block","code":"let str; // str 被推断为 any，可以为赋予任何类型的值\nstr = 'hello';\nstr = 2;","language":"ts","uuid":"99a7a096-b395-4474-8fb7-5905f475cd21","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af562c20-a5a5-4200-b535-54ce45dc4fc6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af562c20-a5a5-4200-b535-54ce45dc4fc6.png"}]},{" e5950a68371b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们定义了 "},{"type":"formatted","text":"Person","code":true},{"type":"formatted","text":" 接口可以有任意的属性，该属性的键值为 "},{"type":"formatted","text":"string","code":true},{"type":"formatted","text":" 类型，值为 "},{"type":"formatted","text":"any","code":true},{"type":"formatted","text":" 类型。一旦定义了任意属性，那么确定属性和可选属性的类型必须为任意属性所规定的类型的子集。比如修改上面的接口"}],"disableDrag":false},{"type":"code-block","code":"interface Person {\n    name: string;\n    age?: number;\n    [propName: string]: string;\n}","language":"ts","uuid":"d164d4c2-7b7a-4327-bde4-32ea00492b1a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为 "},{"type":"formatted","text":"age","code":true},{"type":"formatted","text":" 的值类型为 "},{"type":"formatted","text":"number","code":true},{"type":"formatted","text":"，而任意属性规定的值类型为 "},{"type":"formatted","text":"string","code":true},{"type":"formatted","text":"，所以会报错"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5eece18a-c982-4dbf-9e4d-e41e3b8ae1d0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5eece18a-c982-4dbf-9e4d-e41e3b8ae1d0.png"},{"type":"header","children":[{"type":"formatted","text":"类"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"类可以看做是创建对象的模板，我们使用 "},{"type":"formatted","text":"class","code":true},{"type":"formatted","text":" 来定义一个类，一个类中有属性和方法"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    public name: string;\n    public age: number;\n\n    constructor(name:string, age: number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nlet tom = new Person(\"Tom\", 3);","language":"ts","uuid":"36af0468-4912-458e-85db-279e91df9a57","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以通过类来大量的创建对象。在类中有一个方法 "},{"type":"formatted","text":"constructor()","code":true},{"type":"formatted","text":"，这个方法叫做构造函数，它的功能是用来初始化属性的。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"继承"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们使用 "},{"type":"formatted","text":"extends","code":true},{"type":"formatted","text":" 关键字来实现继承"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    public name: string;\n    public age: number;\n\n    constructor(name:string, age: number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nclass Student extends Person {\n    public score: number;\n    constructor(name: string, age: number, score: number) {\n        super(name, age);\n        this.score = score;\n    }\n}","language":"ts","uuid":"8e106b02-c842-45b2-8e91-ca37e56145ca","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过继承，我们复用父类的属性和方法。在上面我们使用了 "},{"type":"formatted","text":"super","code":true},{"type":"formatted","text":"，该方法的作用是调用父类的构造函数初始化父类的属性。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"访问权限"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"访问权限有三种，分别为 "},{"type":"formatted","text":"public","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"private","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"protected","code":true},{"type":"formatted","text":" 三种，在上面我们使用的都是 "},{"type":"formatted","text":"public","code":true},{"type":"formatted","text":" 访问权限，使用该权限，可以在任何地方被访问到，例如"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    public name: string;\n    public age: number;\n\n    constructor(name:string, age: number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nlet tom = new Person(\"Tom\", 3);\n// 可以直接访问\nconsole.log(tom.name, tom.age); // Tom 3","language":"ts","uuid":"666cbf77-ab31-4d4d-b417-6fdfffce0199","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果使用 "},{"type":"formatted","text":"private","code":true},{"type":"formatted","text":"，那么该属性只能在类内部才能被访问，在类的外部不能被访问，如"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    private name: string;\n    public age: number;\n\n    constructor(name:string, age: number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nlet tom = new Person(\"Tom\", 3);\n\nconsole.log(tom.name, tom.age);","language":"ts","uuid":"17746506-a30d-4fae-afc9-0bab2e577c59","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们将 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 的访问权限修改为了 "},{"type":"formatted","text":"private","code":true},{"type":"formatted","text":"，这个时候不能再类外被直接访问，所以上面通过 "},{"type":"formatted","text":"tom.name","code":true},{"type":"formatted","text":" 访问属性 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 会报错"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cb1b4882-1242-46a8-a690-def48769fa4f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cb1b4882-1242-46a8-a690-def48769fa4f.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如果使用 "},{"type":"formatted","text":"protected","code":true},{"type":"formatted","text":" 修饰，那么该属性只能在该类内部及其子类中才能被访问，除此之外不能被访问，如下"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    protected name: string;\n    public age: number;\n\n    constructor(name:string, age: number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nclass Student extends Person {\n    public score: number;\n    constructor(name: string, age: number, score: number) {\n        super(name, age);\n        this.score = score;\n    }\n\n    // 在子类中可以被访问\n    public getName(): string {\n        return this.name;\n    }\n}\n\nlet alice = new Student(\"Alice\", 4, 5);\n\nconsole.log(alice.getName()); // Alice\n\n// 下行语句会报错\nconsole.log(alice.name);","language":"ts","uuid":"b7e4fe33-789b-4fd8-8308-45383dcc7056","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如上所示，父类 "},{"type":"formatted","text":"Person","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 属性使用 "},{"type":"formatted","text":"protected","code":true},{"type":"formatted","text":" 修饰，所以在子类 "},{"type":"formatted","text":"Student","code":true},{"type":"formatted","text":" 中可以访问，但是在父类和子类的外部不能访问"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7a548a85-8ff8-4dab-8eea-b94800402e19.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7a548a85-8ff8-4dab-8eea-b94800402e19.png"},{"type":"header","children":[{"type":"formatted","text":"静态属性"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以使用 "},{"type":"formatted","text":"static","code":true},{"type":"formatted","text":" 关键声明静态属性以及静态方法，静态属性和方法是属于类的，而不是具体的对象，使用属性和方法要使用类名调用，如下"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    public static max_age:number = 100;\n    public name:string;\n    public age:number;\n    constructor(name:string, age:number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nlet person = new Person(\"Tom\", 15);\n\n// 通过类对象访问实例属性\nconsole.log(person.name); // Tom\n// 通过类访问静态属性\nconsole.log(Person.max_age); // 100","language":"ts","uuid":"67e31bc7-0023-4153-98a9-3b2cbcf1482c","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"readonly"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以使用 "},{"type":"formatted","text":"readonly","code":true},{"type":"formatted","text":" 来修饰类的属性，来表示该属性是只读的，只有在构造函数中初始化该属性，如下"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    public readonly name:string;\n    public age:number;\n    constructor(name:string, age:number) {\n        this.name = name;\n        this.age = age;\n    }\n}\n\nlet person = new Person(\"Alice\", 12);\n\nperson.name = \"Bob\";","language":"ts","uuid":"1dc0a08b-a1b4-4ece-b868-891ddd38d21b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面我们声明了 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 属性为 "},{"type":"formatted","text":"readonly","code":true},{"type":"formatted","text":"，表明 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 属性是只读的，但是在后面我们试图修改该属性，这个时候将会报错"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_04fb9bd7-c484-4ca4-b3a4-b8fa1d4c2a29.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_04fb9bd7-c484-4ca4-b3a4-b8fa1d4c2a29.png"},{"type":"header","children":[{"type":"formatted","text":"实现接口"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"接口的另一个作用就是对类进行抽象，一个类可以实现接口，当类实现接口时，要求类中必须有接口中定义的属性和方法，如下"}],"disableDrag":false},{"type":"code-block","code":"interface IPerson {\n    name: string;\n    age: number;\n    gender: string;\n}\n\nclass Person implements IPerson{\n    public name:string;\n    public age:number;\n    public gender: string;\n    constructor(name:string, age:number, gender:string) {\n        this.name = name;\n        this.age = age;\n        this.gender = gender;\n    }\n}\n\nlet person = new Person(\"Alice\", 12, \"male\");","language":"ts","uuid":"75bd988a-bb89-4891-a1ef-1c4e93874a66","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其实我对接口的理解，其实就是定义了一个标准。定义了标准之后，对于具体的实现就不关心了，可以和具体的实现解耦。假设我们有一个方法接受一个操作数据库的对象，但是对于不同的厂家(数据库)，具体怎么操作数据库都是不一样的，所以这个对象不能写死是怎么类型。所以我们应该定义操作数据库的标准，比如操作数据库的方法名，方法接收的参数，而对于具体的实现应该由各自的产商编写。只要这些厂商实现了我们的标准，那么它就可以用，类比过来，我们定义的标准就是接口，而各自厂商的实现就是实现了接口的类。"}],"disableDrag":false},{"type":"code-block","code":"interface OperateDatabase {\n    save: () => void;\n}\n\nfunction saveData(obj: OperateDatabase): void {\n    obj.save();\n}","language":"ts","uuid":"121d0a1b-395a-4547-9ba1-536c553a0e54","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面我们定义一个操作数据库的接口 "},{"type":"formatted","text":"OperateDatabase","code":true},{"type":"formatted","text":"，并且定义了一个方法 "},{"type":"formatted","text":"saveData()","code":true},{"type":"formatted","text":"，该方法接收一个接口，注意这里我们没有指定是某个特定的对象类型，否则的就会与该类型绑定在一起。接着我们可以两个类实现该接口"}],"disableDrag":false},{"type":"code-block","code":"class MysqlDatabase implements OperateDatabase {\n    save() {\n        console.log(\"mysql 保存数据\");\n    }\n}\n\nclass RedisDatabase implements OperateDatabase {\n    save() {\n        console.log(\"redis 保存数据\");\n    }\n}","language":"ts","uuid":"3f9d72b5-a4f6-427e-987d-9be0f6dc3f24","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这两个类就相当于是这个标准的具体实现。当我们调用 "},{"type":"formatted","text":"saveData","code":true},{"type":"formatted","text":" 方法时，将具体的实现类传入即可"}],"disableDrag":false},{"type":"code-block","code":"saveData(new MysqlDatabase()); // mysql 保存数据\nsaveData(new RedisDatabase()); // redis 保存数据","language":"ts","uuid":"e286dc90-0895-42dc-8039-3abc7cb44049","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"声明合并"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"函数的合并"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"现在有这么一个函数，它可以接受一个参数，这个参数可以是字符串或者数字，它的功能是将传入的数字或者字符串反转，比如输入 "},{"type":"formatted","text":"123","code":true},{"type":"formatted","text":"，则输出 "},{"type":"formatted","text":"321","code":true},{"type":"formatted","text":"，输入 "},{"type":"formatted","text":"hello","code":true},{"type":"formatted","text":"，则输出 "},{"type":"formatted","text":"olleh","code":true},{"type":"formatted","text":"，我们可以定义类如下"}],"disableDrag":false},{"type":"code-block","code":"function reverse(x: number | string): number|string{\n    if (typeof x === 'number') {\n        return Number(x.toString().split('').reverse().join(''));\n    } else {\n        return x.toString().split('').reverse().join('');\n    }\n}","language":"ts","uuid":"0b5a5794-82d7-4c57-9474-6c1d986ae985","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个函数的定义有一个缺点，不能精确的表达输入数字时，输出也是数字，输入是字符串时，输出也是字符串。我们可以重载 "},{"type":"formatted","text":"reverse","code":true},{"type":"formatted","text":" 的多个定义"}],"disableDrag":false},{"type":"code-block","code":"function reverse(x: number): number;\nfunction reverse(x: string): string;\nfunction reverse(x: number | string): number|string{\n    if (typeof x === 'number') {\n        return Number(x.toString().split('').reverse().join(''));\n    } else {\n        return x.toString().split('').reverse().join('');\n    }\n}","language":"ts","uuid":"dfe411b7-fcff-48f9-be11-5999797509aa","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"接口的合并"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"当我们定义了两个相同名字的接口时，接口中的属性会自动进行合并"}],"disableDrag":false},{"type":"code-block","code":"interface Person {\n    name: string;\n}\n\ninterface Person {\n    age: number;\n}","language":"ts","uuid":"076ea243-686c-433a-9bfd-08dde41c2e87","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"相当于"}],"disableDrag":false},{"type":"code-block","code":"interface Person {\n    name: string;\n    age: number;\n}","language":"ts","uuid":"fbc4b352-54aa-460f-936e-44a1c7dbdd78","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果两个接口有相同的属性，只要它们返回的值的类型相同，就不会有问题，如下"}],"disableDrag":false},{"type":"code-block","code":"interface Person {\n    name: string;\n    gender: string;\n}\n\ninterface Person {\n    age: number;\n    gender:string;\n}","language":"ts","uuid":"35d16449-08d8-43b9-9c5b-21c46673f51f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在两个接口中，它们有相同的属性名 "},{"type":"formatted","text":"gender","code":true},{"type":"formatted","text":"，并且它们的定义时一样的，它们的合并也没有问题，相当于如下"}],"disableDrag":false},{"type":"code-block","code":"interface Person {\n    name: string;\n    age: number;\n    gender:string;\n}","language":"ts","uuid":"d2903cdb-4bca-4332-8a24-0b15839e58d0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果有相同的属性，但是定义却不同，即值的类型不同，那么会报错"}],"disableDrag":false},{"type":"code-block","code":"interface Person {\n    name: string;\n    gender: string;\n}\n\ninterface Person {\n    age: number;\n    gender:number;\n}","language":"ts","uuid":"fc1e694e-c8cb-4673-973a-27486f26d420","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面两个接口的 "},{"type":"formatted","text":"gender","code":true},{"type":"formatted","text":" 的定义不同，报错如下"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0d4d90cd-c90c-4fb9-adb6-423165ec7322.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0d4d90cd-c90c-4fb9-adb6-423165ec7322.png"},{"type":"header","children":[{"type":"formatted","text":"类型断言"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"有时候我们需要将一个不确定的类型断言为具体的类型，比如将一个联合类型断言为其中的某一个具体的类型，这样就可以使用它特有的方法。类型断言的语法为"}],"disableDrag":false},{"type":"code-block","code":"值 as 类型","language":"ts","uuid":"e37e579b-7968-4e13-ba07-b429f7ba9e8e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"或者"}],"disableDrag":false},{"type":"code-block","code":"<类型>值","language":"ts","uuid":"7878840b-3447-4fbc-90f3-45271f8b0753","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面两种方法都是将值断言为某个具体的类型。因为在 "},{"type":"formatted","text":"React","code":true},{"type":"formatted","text":" 中只支持 "},{"type":"formatted","text":"as","code":true},{"type":"formatted","text":" 语法，所以推荐使用第一种方法。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"联合类型断言为其中具体类型"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"就如上面所说，有时候我们希望将联合类型断言为具体的类型，这样我们就可以使用类型特有的方法，否则只能使用二者公共的方法。我们第一个形状类型"}],"disableDrag":false},{"type":"code-block","code":"interface Circle {\n    radius: number;\n}\n\ninterface Square {\n    size: number;\n}\n\ninterface Rectangle {\n    width: number;\n    height: number;\n}\n\ntype Shape = Circle | Square | Rectangle;","language":"ts","uuid":"20ae77ef-38b8-43bc-bfc8-9d2b1b7930de","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着我们定义一个方法，该方法接收 "},{"type":"formatted","text":"Shape","code":true},{"type":"formatted","text":" 类型的参数，返回面积，我们可能会这么写"}],"disableDrag":false},{"type":"code-block","code":"function getArea(s: Shape): number {\n    if (typeof s.radius === 'number') {\n        return 3.14159 * s.radius * s.radius;\n    } else if (typeof s.size === 'number') {\n         return s.size * s.size;\n    } else {\n        return s.width * s.height;\n    }\n}","language":"ts","uuid":"a2ef8a7f-11b5-4bea-9874-735f0de8fb2f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是你会发现一片报红"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_26b44acb-3988-4fb6-8888-58954b13ee37.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_26b44acb-3988-4fb6-8888-58954b13ee37.png"},{"type":"paragraph","children":[{"type":"formatted","text":"因为传入的类型 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":" 根本无法确定是什么具体的类型，我们只能访问 "},{"type":"formatted","text":"Circle","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"Square","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"Rectangle","code":true},{"type":"formatted","text":" 的公共属性和方法，所以当我们访问他们特有的属性时就会报错，比如 "},{"type":"formatted","text":"s.radius","code":true},{"type":"formatted","text":"，所以在访问具体的属性进行判断时，我们要断言为具体的类型，修改如下"}],"disableDrag":false},{"type":"code-block","code":"function getArea(s: Shape): number {\n    if (typeof (s as Circle).radius === 'number') {\n        s = s as Circle;\n        return 3.14159 * s.radius * s.radius;\n    } else if (typeof (s as Square).size === 'number') {\n        s = s as Square;\n         return s.size * s.size;\n    } else {\n        s = s as Rectangle;\n        return s.width * s.height;\n    }\n}","language":"ts","uuid":"628f1b64-ffcd-425f-a4d8-526e971ca31f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们首先进行断言为具体的类型，然后进行判断。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"父类或接口断言为子类或实现类"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"有时候我们需要将父类或接口断言为具体的子类，这样就可以使用子类特有的属性或方法。首先定义一个父类和两个子类"}],"disableDrag":false},{"type":"code-block","code":"class Person {\n    name: string;\n    age: number;\n\n    constructor(name: string, age: number) {\n        this.name = name;\n        this.age = age;\n    }\n\n}\n\nclass Student extends Person{\n    score: number;\n    constructor(name:string, age: number, score: number) {\n        super(name, age);\n        this.score = score;\n    }\n}\n\nclass Teacher extends Person{\n    level: number;\n    constructor(name:string, age: number, level: number) {\n        super(name, age);\n        this.level = level;\n    }\n}","language":"ts","uuid":"c2e5bef9-9a81-4a15-9025-3306dd01f0e7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着定义一个方法，该方法接收 "},{"type":"formatted","text":"Person","code":true},{"type":"formatted","text":" 类型的参数，我们需要断言为具体的子类才能使用子类的属性和方法"}],"disableDrag":false},{"type":"code-block","code":"function isStudent(p: Person) {\n    if (typeof (p as Student).score === 'number') {\n        return true;\n    } else {\n        return false;\n    }\n}\n\nconsole.log(isStudent(new Student('Bob', 15, 100))); // true","language":"ts","uuid":"73344713-a741-4d50-8dd5-629760fe6c82","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"泛型"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在定义函数、类和接口时，并不具体指定具体的类型，而是使用一个占位符表示类型，具体的类型在使用的时候传入决定。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"函数泛型"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们定义一个函数创建一个数组，并设置默认值，数组中存储的具体类型等到使用时确定"}],"disableDrag":false},{"type":"code-block","code":"function createArray<T>(length: number, defaultValue: T): Array<T> {\n    let x = new Array<T>(length);\n    for (let i = 0; i < length; i++) {\n        x.push(defaultValue);\n    }\n    return x;\n}","language":"ts","uuid":"36fa8936-84ba-435c-891c-a146914c9749","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"该函数接收两个参数，第一个参数为数组的长度，第二个参数为默认值。该数组的类型我们使用泛型 T 代替，具体的类型在使用时确定，如创建一个长度为 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":"，类型为 "},{"type":"formatted","text":"number","code":true},{"type":"formatted","text":"，默认值为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 的数组，如下"}],"disableDrag":false},{"type":"code-block","code":"let arr = createArray<number>(5, 0);\nconsole.log(arr); // [ <5 empty items>, 0, 0, 0, 0, 0 ]","language":"ts","uuid":"793d9a5d-1d1f-45e1-91e0-3560bec079c4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为我们不知道泛型的具体类型，所以不能随意操作它的属性和方法，这个时候我们可以对象泛型做出约束，以便我们可以使用特定的属性或方法，如要求泛型必须符合某个接口"}],"disableDrag":false},{"type":"code-block","code":"interface Length {\n    length: number;\n}\n\nfunction getLength<T extends Length>(t: T):number {\n    return t.length;\n}","language":"ts","uuid":"bf0f5f86-0936-448d-8d2d-578ef4a9ef1c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们要求泛型 "},{"type":"formatted","text":"T","code":true},{"type":"formatted","text":" 继承了接口 "},{"type":"formatted","text":"Length","code":true},{"type":"formatted","text":"，即传入的对象 "},{"type":"formatted","text":"t","code":true},{"type":"formatted","text":" 必须含有属性 "},{"type":"formatted","text":"length","code":true}],"disableDrag":false},{"type":"code-block","code":"console.log(getLength(\"123\")); // 3","language":"ts","uuid":"9e8413f6-67a2-4ec6-b1d3-b5eb527b4d7d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"接口泛型"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"同样的，我们也可以在接口中使用泛型"}],"disableDrag":false},{"type":"code-block","code":"interface CreateArrayFunc<T> {\n    (length: number, defaultValue: T): Array<T>\n}\n\nlet createArray: CreateArrayFunc<number>;\n\ncreateArray = function<T>(length: number, defaultValue: T) {\n    let x: T[] = [];\n    for(let i = 0; i < length; i++) {\n        x.push(defaultValue);\n    }\n    return x;\n}\n\nconsole.log(createArray(5, 3)); // [ 3, 3, 3, 3, 3 ]","language":"ts","uuid":"a2d21b0b-6dc5-4cba-bccc-4e6930741948","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"类泛型"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们也可以在类中使用泛型"}],"disableDrag":false},{"type":"code-block","code":"class Stack<T> {\n    data: T[];\n    size: number;\n    constructor(capacity: number) {\n        this.data = new Array<T>(capacity);\n        this.size = 0;\n    }\n\n    push (item: T): void {\n        this.data.push(item);\n        this.size++;\n    }\n\n    pop (): T {\n        this.size--;\n        return this.data.pop() as T;\n    }\n    \n    printStack(): void {\n        console.log(this.data);\n    }\n}","language":"ts","uuid":"3aa432c5-2f4d-4143-8a22-8a93ffb37076","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们定义了一个 "},{"type":"formatted","text":"Stack","code":true},{"type":"formatted","text":" 栈，它里面存储的类型是一个泛型，在我们使用的时候确定，如下"}],"disableDrag":false},{"type":"code-block","code":"// 定义了一个存储 number 类型数据的栈 容量为10\nlet stack = new Stack<number>(10); \n\nstack.push(10);\nstack.push(5);\n\nstack.printStack(); // [ <10 empty items>, 10, 5 ]","language":"ts","uuid":"37bc3f10-c1e4-4a38-841b-57a23941474a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://ts.xcatliu.com/","openEdit":false,"children":[{"type":"formatted","text":"TypeScript入门教程"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://juejin.im/post/5d8efeace51d45782b0c1bd6","openEdit":false,"children":[{"type":"formatted","text":"TypeScript安利指南"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliy
