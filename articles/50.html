    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":50,"title":"防抖与节流","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"防抖与节流是两个出于性能考虑提出的概念，如果在短时间内多次触发同一函数，可能会产生页面的卡顿，以及性能的降低，针对这种情况，提出了防抖与节流两个解决方案。"}]},{"type":"header","children":[{"type":"formatted","text":"防抖与节流的概念"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"为了解释如上的两个概念，我们以一个例子开始。有一个搜索框，当用户输入搜索内容时，会同时向后端发起请求，给出相近的词条以给用户提示"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果当每次用户输入一个字符都向都端发起一个请求，那么发起请求的次数就太频繁了，这时有两种策略："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当用户停止输入一段时间后，例如 500ms，我们向后端发起一个请求"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"每隔固定的时间向后端发起一个请求"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一种策略我们叫做防抖，第二种策略我们称为节流。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"有一个形象的比喻，以公交车发车为例，有两种发车方案："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当乘客上车后，如果经过一段时间没有乘客上车了，就发车"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"发车时间固定，每隔一段时间发一次车"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们将发车比喻为向后端发起一个请求，那么这两种发车的策略就分别对应为防抖和节流。"}]},{"type":"header","children":[{"type":"formatted","text":"防抖实现"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们要实现一个 "},{"type":"formatted","text":"debounce","code":true},{"type":"formatted","text":" 函数，该函数接收一个函数以及时间，返回一个函数，"},{"type":"formatted","text":"debounce","code":true},{"type":"formatted","text":" 函数的作用就是将一个普通的函数变为防抖的函数，即多次调用该函数，只有经过指定时间后，函数才会触发一次"}]},{"type":"code-block","code":"const debounce = (fn, time) => {\n    let timerId\n\n    return function(...args) {\n        clearTimeout(timerId)\n        timerId = setTimeout(() => {\n            fn.apply(this, args)\n        }, time)\n    }\n}","language":"js","uuid":"f4a62dd0-305d-4885-849e-afcc4f4ed87e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面有几个注意事项："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"timerId","code":true},{"type":"formatted","text":" 要放在返回的函数之外，形成闭包，以确保每次调用函数时访问的是同一个 "},{"type":"formatted","text":"timerId","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"返回的函数不要写成箭头函数的形式"}]},{"type":"code-block","code":"// 不要写成这样\nreturn (...args) => {\n    \n}","language":"js","uuid":"190e6ab2-c797-4d4f-b3dd-0041a0692494","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为这样会丢失 "},{"type":"formatted","text":"this","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"最后要通过 "},{"type":"formatted","text":"apply","code":true},{"type":"formatted","text":" 方法将 "},{"type":"formatted","text":"this","code":true},{"type":"formatted","text":" 传入"}]}]}]},{"type":"header","children":[{"type":"formatted","text":"节流实现"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们要实现一个 "},{"type":"formatted","text":"throttle","code":true},{"type":"formatted","text":" 函数，该函数的作用是将一个普通函数转化为节流函数，也接收两个参数，第一个参数为函数，第二个函数为时间，当多次调用该函数，在一段时间内只能触发一次"}]},{"type":"code-block","code":"const throttle = (fn, time) => {\n    let pre = 0;\n\n    return function(...args) {\n        let now = Date.now();\n        if (now - pre > time) {\n            fn.apply(this, args);\n            pre = now;\n        }\n    }\n}","language":"js","uuid":"c61bc2bb-66c6-486d-af95-ecf044a9f397","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"pre","code":true},{"type":"formatted","text":" 表示上一次执行的时间，默认值为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，这样第一次调用该函数时会立即执行该函数。每次执行函数时，判断距上次执行已经经过的时间 "},{"type":"formatted","text":"Date.now() - start","code":true},{"type":"formatted","text":" 是否大于设定的时间，大于则执行，小于则不执行，以达到节流的目的，执行函数后，设置 "},{"type":"formatted","text":"pre","code":true},{"type":"formatted","text":" 为当前函数执行时的时刻。"}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"返回的函数不能写为箭头函数，同样是因为会丢失 "},{"type":"formatted","text":"this","code":true},{"type":"formatted","text":"。"}]}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/C__Users_pc_.editor_resources_janis-dzenis-2BYcUe94cIY-unsplash_4662836a-e53a-46dd-80b0-121ca99fb5fd_7cf43790-849f-4cac-b6ee-c71b261ba16f.jpg","createTime":1588204800000,"updateTime":1743303640482},"meta":{"type":"article","publishTime":1764821905640}};
