    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":14,"title":"跑马灯动画","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"本篇文章介绍了如何实现支持动态加减速的跑马灯动画，效果如下："}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625150270025.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的动画主要实现了两个功能："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"文字的无缝衔接"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"动画的动态加减速"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先给出例子用到的 html 与 css 代码"}]},{"type":"code-block","code":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument\u003c/title\u003e\n    \u003clink rel=\"stylesheet\" href=\"index.css\"\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003cdiv class=\"container\"\u003e\n        \u003cdiv class=\"nowrap\"\u003e\n            \u003cp class=\"txt\"\u003e朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cbutton id=\"speedUp\"\u003e加速\u003c/button\u003e\u003cbutton id=\"slowDown\"\u003e减速\u003c/button\u003e\n    \u003c/div\u003e\n\n    \u003cscript type=\"module\"\u003e\n        import './index.js'\n    \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e","language":"html","uuid":"4e17feb7-0222-4f09-bdb0-e3d9ee28f5ca","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"* {\n    padding: 0;\n    margin: 0;\n    box-sizing: border-box;\n}\n\n.container {\n    width: 500px;\n    margin: 100px auto;\n}\n\n.nowrap {\n    width: 100%;\n    white-space: nowrap;\n    overflow: hidden;\n}","language":"css","uuid":"30c3a515-cb95-41a7-a61f-3f83583f378e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"制作动画的手段有很多种，使用 JavaScript 以及 CSS 均可实现，不过 CSS 的性能较好，所以本文使用 CSS 来实现动画。"}]},{"type":"header","children":[{"type":"formatted","text":"动画的无缝衔接"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"一开始我都不明白什么叫动画的无缝衔接，后来我看到了不是无缝衔接的例子瞬间就明白了，如下"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625150660387.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以观察到第一次动画完毕以后非常突兀的来到了文字的开头，与上面无缝衔接的动画想比，可以感觉到无缝衔接动画非常的流畅，所以如何实现动画的无缝衔接呢? 答案就是将内容复制两份，这样当文字滚动在最后时出现的就不是空白，而是开头的文字。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为我们使用的是 "},{"type":"formatted","text":"transform: translateX()","code":true},{"type":"formatted","text":" 来制作动画，所以我们要获取复制前文本的长度，以确定最终变换的距离，以及为了实现动画的速度与文本的长短无关，那么动画运动的总时间是与文本的长度成正比的，这个比例系数自然就是速度了 。上面这一切都表明我们的动画的创建是与文本长度有关的，而文本的长度我们事前不知道，所以动画的创建也是动态的，我们通过向 DOM 插入一个 "},{"type":"formatted","text":"style","code":true},{"type":"formatted","text":" 标签来动态创建动画。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"创建动画相关的代码如下"}]},{"type":"code-block","code":"// 动画的速度，实际测试大约为 1s 两个字\nlet speed = 36\n\n// 动态插入 keyframe\nconst style = document.createElement('style');\ndocument.getElementsByTagName('head')[0].appendChild(style)\n\nconst createKeyFrame = (width, name) =\u003e {\n    const keyframe = `\n        @keyframes ${name} {\n            0% {\n                transform: translateX(0px);\n            }\n            100% {\n                transform: translateX(-${width}px);\n            }\n        }\n        .${name} {\n            animation: ${name} ${(Math.abs(width)/speed).toFixed(2)}s linear infinite;\n        }\n    `\n    style.innerHTML = keyframe\n}","language":"js","uuid":"6e698768-31f5-4a35-860e-43e5abb1a8fd","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面 "},{"type":"formatted","text":"createKeyFrame","code":true},{"type":"formatted","text":" 函数用以动态创建一个动画，该函数接收两个参数 "},{"type":"formatted","text":"width","code":true},{"type":"formatted","text":" 表示文本的长度以及 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 表示动画的名称，除了创建一个动画，我们还创建一个名字与动画名相同的类，我们只要为元素添加这个类，这个类便会拥有这个动画，动画的执行次数为无限次。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"准备好这些以后，我们便可以开始为文本应用动画了，在应用动画之前，我们首先需要获得文本的长度，然后将文本复制一遍插入到原文本后面，如下"}]},{"type":"code-block","code":"// 包含文字的元素\nconst txt = document.getElementsByClassName('txt')[0]\n// 文本的长度\nlet textWidth = 0\nconst initAnimation = () =\u003e {\n    // 获得文本长度，控制动画时间，以及 transform 的距离\n    textWidth = txt.scrollWidth\n\n    // 如果宽度足够显示所有的文字，则没有必要使用动画\n    if (textWidth \u003c= 500) {\n        // 不仅不添加动画，而且要移除之前添加的动画\n        txt.classList.remove('slow', 'temp-slow', 'fast', 'temp-fast')\n        return\n    }\n\n    // 获得文本内容\n    const textContent = txt.textContent\n    // 在后面设置添加相同的文字，做到动画的无缝衔接\n    txt.textContent = textContent + textContent\n    \n    // 动态制作动画\n    createKeyFrame(textWidth, 'slow')\n    // 应用动画\n    txt.classList.add('slow')\n}\ninitAnimation()","language":"js","uuid":"ce9a3a76-7b09-4a3b-87f5-dc9661dbd18f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的程序首先获得文本的长度，这里有一个小细节，如果文本的长度小于容器的长度的话，那么就没必要使用动画，在这里我们移除了一些类，这些类后面会用到，这里只要理解这个行为是移除所有动画即可。如果文本的长度大于容器的长度，我们接下来就来取得文本的内容，然后复制一份并且添加原文本的后面，接着添加动画，并且为元素应用动画，此时效果看起来是这样"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625152644530.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"此时我们已经实现了动画的无缝衔接，但是加减速功能还没有实现。"}]},{"type":"header","children":[{"type":"formatted","text":"动画动态加减速"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"改变动画的持续时间"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"那么如何实现动画的动态加减速呢，首先自然而然的一个想法就是直接改变动画的总时间，我们先以加速为例"}]},{"type":"code-block","code":"// 是否处于加速状态\nlet speeded = false\n\nconst upBtn = document.getElementById('speedUp')\nconst speedUp = () =\u003e {\n    // 如果已经处于加速状态，则直接返回\n    if (speeded) {\n        return\n    }\n\n    // 设置为加速状态\n    speeded = true\n\n    // 速度变为原来四倍\n    speed = speed * 4\n    // 改变动画的运行时间\n    txt.style.animationDuration = textWidth / speed + 's'\n}\nupBtn.addEventListener('click', speedUp)","language":"js","uuid":"fe63b5f3-1f7c-4bc4-92e8-7c66a499976d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们为加速按钮添加了一个点击事件，为了防止多次触发加速，我们使用一个变量 "},{"type":"formatted","text":"speeded","code":true},{"type":"formatted","text":" 来记录元素是否处于加速状态，如果已经处于加速状态，则函数直接返回，否则我们将速度变为原来的四倍，当然不要忘了将元素设置为处于加速状态，然后设置动画的执行时间为 "},{"type":"formatted","text":"textWidth / speed","code":true},{"type":"formatted","text":"，我们来看看实际效果"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625153417380.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以观察到，当我们点击加速的那个瞬间，动画似乎不对劲，但是哪里不对劲，因为速度太快我没有观察处理，不过我们可以使用数据来告诉我们答案，我们打印改变动画持续时间前后元素的 "},{"type":"formatted","text":"transfrom","code":true},{"type":"formatted","text":" 的值，首先我们定义一个函数来获得元素的 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 的值"}]},{"type":"code-block","code":"const getTranslateX = ele =\u003e {\n    return +window.getComputedStyle(ele).transform.split(',')[4]\n}","language":"js","uuid":"afab77c2-60f7-4b2f-8448-f2ccaf5f4418","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"上面的函数是怎么得到?"}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先我们通过 "},{"type":"formatted","text":"window.getComputedStyle(ele).transform","code":true},{"type":"formatted","text":" 来获取元素的 "},{"type":"formatted","text":"transform","code":true},{"type":"formatted","text":" 属性，它是一个形如下面的字符串"}]},{"type":"code-block","code":"matrix(1, 0, 0, 1, -97.8686, 0)","language":"js","uuid":"3a94aa65-f097-42f3-87f3-2fc65491584d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"倒数第二个数字 "},{"type":"formatted","text":"-97.8686","code":true},{"type":"formatted","text":" 表示的就是 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" (针对二维的情况，没有 "},{"type":"formatted","text":"translateZ","code":true},{"type":"formatted","text":")，所以我们通过 , 分割字符串，然后获得第五个即下标为 "},{"type":"formatted","text":"4","code":true},{"type":"formatted","text":" 的字符串即为 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 的值，因为是字符串，所以我在前方加了一元运算符 + 将字符串转换为数字。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们在改变动画运行时间前后打印此时的 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 的值"}]},{"type":"code-block","code":"const speedUp = () =\u003e {\n    if (speeded) {\n        return\n    }\n    \n    speeded = true\n    speed = speed * 4\n\n    console.log('加速前', getTranslateX(txt))\n    txt.style.animationDuration = textWidth / speed + 's'\n    console.log('加速后', getTranslateX(txt))\n}","language":"js","uuid":"a145d18b-3e80-404e-aa48-b2c97e290e0c","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625154160556.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以观察到点击前后 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 的值发生了相当大的突变，这里我给出一个解释，假设你一开始以 "},{"type":"formatted","text":"2m/s","code":true},{"type":"formatted","text":" 的速度进行奔跑，跑了 "},{"type":"formatted","text":"2s","code":true},{"type":"formatted","text":"，此时你应该处于 "},{"type":"formatted","text":"4m","code":true},{"type":"formatted","text":" 的位置，这时你的速度变为 "},{"type":"formatted","text":"4m/s","code":true},{"type":"formatted","text":"，所以浏览器认为你的位置应该处于 "},{"type":"formatted","text":"8m","code":true},{"type":"formatted","text":" 的位置，在这个时刻，你的位置发生了突变。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"那怎么解决这个问题呢? 我的第一个想法是，既然是因为突然加速太快导致严重的突变，那么我慢慢的改变速度(即动画的运行时间)是否就没有这么严重的卡顿问题呢，咱们来试一试"}]},{"type":"code-block","code":"const speedUp = () =\u003e {\n    if (speeded) {\n        return\n    }\n\n    // 获得当前的动画持续时间\n    let duration = window.getComputedStyle(txt).animationDuration\n    // 每次动画持续时间减少 0.1s\n    duration = parseFloat(duration).toFixed(1) - 0.1\n    txt.style.animationDuration = Math.max(duration, textWidth/(speed * 4)) + 's'\n\n    // 没有达到指定的动画时间时，就持续调用加速动画\n    if(duration \u003e textWidth/speed/4) {\n        setTimeout(speedUp, 10)\n    } else {\n        speeded = true\n    }\n}","language":"js","uuid":"a0e12167-a170-45aa-b761-0de6511818f2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们首先获得当前动画的持续时间，然后将该动画的持续时间减少 "},{"type":"formatted","text":"0.1s","code":true},{"type":"formatted","text":"，如果当前的动画的持续时间没到达到预期的运行时间 "},{"type":"formatted","text":"textWidth/(speed * 4)","code":true},{"type":"formatted","text":"，那么就会持续的调用加速函数，时间间隔为 "},{"type":"formatted","text":"10ms","code":true},{"type":"formatted","text":"，直至达到希望的时间，我们来看看效果"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625154867508.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以看到文本没有发生突变，并且动画逐渐的加速起来了，从图中看的效果比较好，如果能够接受逐渐加速的解决方案，似乎已经满足了我们的需求。但是实际的效果比动图所示的效果差，由于录制 GIF 软件帧率的原因，导致效果很好，从我实际观察看，有两个瑕疵："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"速度越来越快，甚至加速过程中的速度超过了最后加速后的速度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"有卡顿的效果"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"对此我比较苦恼，开始从数学上是分析原因，这里不给出数学上的推导，给出我得到的两个结论："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"加速过程中越来越快的问题可以通过改变加速函数的运行时间间隔来解决，当速度较慢时，时间间隔可以较短，此时的突变距离短，看不出来，当速度较快时，需要加长时间间隔，以减缓速度，但是会导致加速时间过长"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"卡顿的原因是因为突变，也可以通过改变时间间隔减缓症状，但是消除卡顿的效果会导致加速时间很长(突变是一定有的，不过从效果上感觉不到)"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"基于上述结论，我得到一个简单的时间间隔加速公式(公式没有数学推导)"}]},{"type":"code-block","code":"setTimeout(speedUp, -5 * (duration - textWidth/(speed * 4)) + 75)","language":"js","uuid":"7ae3c7ea-626f-4015-aa79-798073de157c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这是一个线性函数，当持续时间越接近于最终持续时间，间隔就越长，效果有所改善，但是还是有卡顿效果。"}]},{"type":"header","children":[{"type":"formatted","text":"创建多个新动画"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"那有没有更好的解决办法，似乎我已经做到了极致，经过我苦思冥想，最终还是想出来了。既然我改变动画持续时间会导致突变，那么我可不可以同时改变两个值，比如动画名称以及动画持续时间，我脑中开始浮现一种思路，抛弃原来的动画，创建一个新动画，不过创建一个新的动画会导致突然回到原点，我们只要记录原先旧动画 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 的位置，将其设置为新动画的起点，那新旧动画不就衔接上了吗? 我们的 "},{"type":"formatted","text":"createKeyFrame","code":true},{"type":"formatted","text":" 函数还不支持设置动画原点的功能，我们将其加上"}]},{"type":"code-block","code":"const createKeyFrame = (width, name, startPosition = 0) =\u003e {\n    const keyframe = `\n        @keyframes ${name} {\n            0% {\n                transform: translateX(${startPosition}px);\n            }\n            100% {\n                transform: translateX(-${width}px);\n            }\n        }\n        .${name} {\n            animation: ${name} ${(Math.abs(width + startPosition)/speed).toFixed(2)}s linear infinite\n        }\n    `\n    style.innerHTML = keyframe\n}","language":"js","uuid":"0e9092c0-6904-4585-aa52-5f3b9303f2f6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们为函数添加了一个新的参数 "},{"type":"formatted","text":"startPosition","code":true},{"type":"formatted","text":"，它的默认值为 0 (这意味原先的代码不必修改)，然后我们修改了两处："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"动画的起始设置为了 "},{"type":"formatted","text":"translateX(${startPosition}px)","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"动画的运行时间设置为 "},{"type":"formatted","text":"${(Math.abs(width + startPosition)/speed).toFixed(2)}s","code":true},{"type":"formatted","text":"，因为 "},{"type":"formatted","text":"startPosition","code":true},{"type":"formatted","text":" 为负数，所以这里是 "},{"type":"formatted","text":"width + startPosition","code":true}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们修改加速函数的逻辑"}]},{"type":"code-block","code":"const speedUp = () =\u003e {\n    if (speeded) {\n        return\n    }\n\n    speeded = true\n    speed = speed * 4\n\n    // 获得当前的 translateX\n    const translateX = getTranslateX(txt)\n    \n    // 移除之前添加的慢动画\n    txt.classList.remove('slow')\n    // 创建一个名为 temp-fast 的新动画\n    createKeyFrame(textWidth, 'temp-fast', translateX)\n    // 添加新动画\n    txt.classList.add('temp-fast')\n}","language":"js","uuid":"ec6588f3-2dde-445c-a92d-1dd275f6826e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的代码非常的简单，不多解释了，我们来看看效果"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625156643332.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们点击加速按钮的时候，可以观察到动画十分的流畅，没有丝毫的突变，就是有一个缺点就是新动画的开头不是文本的开头，我们接下来解决这个问题，思路很简单，当当前这个动画执行完毕时，我们再次创建一个动画起始位置为文本原点的新动画，然后移除原来的动画，添加新动画。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我最开始的想法是使用 "},{"type":"formatted","text":"setTimeout","code":true},{"type":"formatted","text":" 不断读取当前的 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":"，当 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 与文本的长度很接近时(具体有多接近才叫接近，通过观察控制台，我发现大约在 "},{"type":"formatted","text":"3px","code":true},{"type":"formatted","text":" 以内)，可以认为这个动画执行完毕了，这时我们创建这个新动画，该新动画的的起点为文本的原点。"}]},{"type":"code-block","code":"const speedUp = () =\u003e {\n    if (speeded) {\n        return\n    }\n\n    speeded = true\n    speed = speed * 4\n\n    // 获得当前的 translateX\n    const translateX = getTranslateX(txt)\n\n    // 移除之前添加的慢动画\n    txt.classList.remove('slow')\n    // 创建一个名为 temp-fast 的新动画\n    createKeyFrame(textWidth, 'temp-fast', translateX)\n    // 添加新动画\n    txt.classList.add('temp-fast')\n\n    const reset = () =\u003e {\n        const x = getTranslateX(txt)\n        if ((textWidth + x) \u003c 3) {\n            // 移除临时的快动画\n            txt.classList.remove('temp-fast')\n            // 创建起始位置为文本原点的动画\n            createKeyFrame(textWidth, 'fast')\n            // 添加新动画\n            txt.classList.add('fast')\n        } else {\n            setTimeout(reset, 1)\n        }\n    }\n    reset()\n}","language":"js","uuid":"d678879b-8acb-484c-8706-0b31ca8f0933","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们来看看实际的效果如何"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625157285140.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可见加速过程十分的流畅，没有任何的卡顿，以及动画也能回到文本的原点了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是使用定时器耗费性能比较严重，其实我们只要监听添加的临时动画执行完毕的事件即可，这样既准确，效率又高。那么我们创建的临时动画的执行次数不能是无限次的，而是一次，我们的 "},{"type":"formatted","text":"createKeyFrame","code":true},{"type":"formatted","text":" 函数不支持，我们再次改造，为了不修改原来的代码，我们默认执行次数为无限次，如下"}]},{"type":"code-block","code":"const createKeyFrame = (width, name, startPosition = 0, iterateCount = 'infinite') =\u003e {\n    const keyframe = `\n        @keyframes ${name} {\n            0% {\n                transform: translateX(${startPosition}px);\n            }\n            100% {\n                transform: translateX(-${width}px);\n            }\n        }\n        .${name} {\n            animation: ${name} ${(Math.abs(width + startPosition)/speed).toFixed(2)}s linear ${iterateCount}\n        }\n    `\n    style.innerHTML = keyframe\n}","language":"js","uuid":"e58b2775-98a5-4262-a479-0174a5f43a87","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着我们修改加速函数的逻辑，如下"}]},{"type":"code-block","code":"const speedUp = () =\u003e {\n    if (speeded) {\n        return\n    }\n\n    speeded = true\n    speed = speed * 4\n\n    // 获得当前的 translateX\n    const translateX = getTranslateX(txt)\n\n    // 移除之前添加的慢动画\n    txt.classList.remove('slow')\n    // 创建一个名为 temp-fast 的新动画，执行一次\n    createKeyFrame(textWidth, 'temp-fast', translateX, 1)\n    // 添加新动画\n    txt.classList.add('temp-fast')\n\n    txt.onanimationend = () =\u003e {\n        txt.classList.remove('temp-fast')\n        // 创建起始位置为文本原点的动画\n        createKeyFrame(textWidth, 'fast')\n        // 添加新动画\n        txt.classList.add('fast')\n    }\n\n}","language":"js","uuid":"81f9affd-c1d6-4ebd-b8a0-a429353d639d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的代码修改有两处，第一处是创建临时动画时传入了动画的执行次数"}]},{"type":"code-block","code":"createKeyFrame(textWidth, 'temp-fast', translateX, 1)","language":"js","uuid":"2ff969c8-6f04-4bf9-977a-fe587e161d60","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二处就是将定时器的逻辑改为了监听事件"}]},{"type":"code-block","code":"txt.onanimationend = () =\u003e {\n    txt.classList.remove('temp-fast')\n    // 创建起始位置为文本原点的动画\n    createKeyFrame(textWidth, 'fast')\n    // 添加新动画\n    txt.classList.add('fast')\n}","language":"js","uuid":"bd5a8137-53f7-4534-ab82-2bc401d6d31f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这次我们来看效果如下"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1625157889578.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个动画真的非常的丝滑，比德芙还丝滑。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"同样的我们加上减速的逻辑，其思路同加速一模一样，我们直接呈上代码"}]},{"type":"code-block","code":"const downBtn = document.getElementById('slowDown')\nconst slowDown = () =\u003e {\n    if (!speeded) {\n        return\n    }\n    speeded = false\n    speed = speed / 4\n\n    const translateX = getTranslateX(txt)\n    \n    txt.classList.remove('fast', 'temp-fast')\n    // 创建临时慢动画\n    createKeyFrame(textWidth, translateX, 'temp-slow', 1)\n    txt.classList.add('temp-slow')\n\n    txt.onanimationend = () =\u003e {\n        txt.classList.remove('temp-slow')\n        // 创建起始位置为文本原点的动画\n        createKeyFrame(textWidth, 'slow')\n        // 添加新动画\n        txt.classList.add('slow')\n    }\n}\ndownBtn.addEventListener('click', slowDown)","language":"js","uuid":"0b382f95-703a-4ba7-b1cd-0cb66d75e180","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"逻辑可以说同加速一模一样了，不过有一个地方不同，因为当我们点击减速时，动画可能处于临时加速状态，也可能处于真正的加速状态，所以创建临时慢动画之前，两个动画都要移除"}]},{"type":"code-block","code":"txt.classList.remove('fast', 'temp-fast')","language":"js","uuid":"8b1e6f28-cf3a-4e89-b5e8-62543d817feb","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"同理点击加速按钮时也是同理，在创建临时快动画之前，我们要移除两个慢动画"}]},{"type":"code-block","code":"txt.classList.remove('slow', 'temp-slow')","language":"js","uuid":"c65478f4-e495-44a8-b6ee-385be9648cd5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在这里呼应一下前文，我们说当文本的长度小于容器的长度时(我们的实际文本是可以动态改变的，所以之前的文本可能处于动画状态，当改变文本后其长度就可能小于容器长度)，我们不添加动画，并且移除所有动画"}]},{"type":"code-block","code":"if (textWidth \u003c= 500) {\n    // 不仅不添加动画，而且要移除之前添加的动画\n    txt.classList.remove('slow', 'temp-slow', 'fast', 'temp-fast')\n    return\n}","language":"js","uuid":"c02eb602-0ccd-45e6-af0a-01c893912c0e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在是不是感觉豁然开朗呢！"}]},{"type":"header","children":[{"type":"formatted","text":"总结"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"本文探讨了跑马灯动画，一个是跑马灯动画的无缝衔接，解决办法是复制相同的文本，如果你已经理解了该动画的原理，你可以马上明白，不需要复制所有的文本，只需要复制的文本长度能够覆盖容器的长度即可。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一个我们探讨了动画的加减速，我们首先阐述了我们遇到的问题，那就是 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":" 的突变，针对这个问题我首先提出缓慢的改变动画的持续时间，以减少急剧的突变，该种方法某种程度上的确减缓突变的症状，但是会有一段加速的时间，以及突变不可避免，只是轻重而已，从效果上看有卡顿效果；除此之外我又提出了另外一种解决办法，那就是在点击加速时，记录此时的 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":"，并且抛弃原来的动画，另起炉灶创建一个临时新动画，为了不产生突变，临时新动画的起点设置为此时的 "},{"type":"formatted","text":"translateX","code":true},{"type":"formatted","text":"，然后监听该临时动画的动画完毕事件，在事件处理函数中我们添加一个动画起点位置为文本原点的真正的新动画，从效果上看真的是十分的丝滑。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外本文的动画全部使用 CSS 实现，所以它的性能十分的好。","bold":true}]}],"tags":["跑马灯","动画","动态加减速"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-d6dyx3_cee2e83b-d7f8-49d7-83b8-591b693694f9.jpg","createTime":1625220672000,"updateTime":1743303640463},"meta":{"type":"article","publishTime":1767266229524}};
