    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":69,"title":"深拷贝的实现","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"什么是拷贝？对一个变量进行拷贝是指将其表示的数据复制到另一个变量中，大部分情况下的目的是为了避免直接修改原始数据，以便后续进行多种不同的处理或对比。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"最简单的拷贝行为，直接将一个变量赋值给另一个变量"}],"disableDrag":false},{"type":"code-block","code":"let a = 1;\nlet b = a;\nb = 2;\nconsole.log(a, b); // 1, 2","language":"JavaScript","uuid":"8f913376-0589-4d7d-a0d2-463dfa6ab843","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"const originalObj = {\n    a: 1\n}\nconst copyObj = originalObj;\ncopyObj.a = 2;\nconsole.log(originalObj.a, copyObj.a); // 2, 2","language":"JavaScript","uuid":"770f270e-2864-4cd6-a880-a1a8135d1280","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以看到，这种直接赋值的方式对于基本数据类型和对象是不一样的，对于基本数据类型（"},{"type":"formatted","text":"number","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"string","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"null","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"undefined","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"boolean","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"symbol","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"BigInt","code":true},{"type":"formatted","text":"）直接赋值是完全隔离的，对拷贝的修改不会影响原数据，而对于对象（包括数组、日期、函数等特殊对象）直接进行赋值拷贝，"},{"type":"formatted","text":"拷贝的仅仅是引用","color":"#e33a32","darkColor":"#fa7873","bold":true},{"type":"formatted","text":"，因此对通过拷贝所持有的引用对数据进行的修改也会影响原来的对象。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"因此对于对象的拷贝不能通过直接赋值来达到目的，而是需要将引用的数据进行拷贝，根据拷贝方式的不同，分为浅拷贝和深拷贝。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"浅拷贝即只复制对象的一层属性，常见的方式有"}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: 1\n}\nconst copyObj = {};\nfor (let key in obj1) {\n    obj2[key] = obj1[key];\n}","language":"JavaScript","uuid":"8f044d89-7bf5-470d-8ff0-88ca4fac1b25","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"const originalObj = {\n    a: 1\n}\nconst copyObj = { \n    ...obj1\n}","language":"JavaScript","uuid":"00fdb771-defb-4694-afd9-c9f216703eb3","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"const originalObj = {\n    a: 1\n}\nconst copyObj = Object.assign({}, originalObj);","language":"JavaScript","uuid":"f148df4b-57e1-48bd-a462-a525dd092a23","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果对象的属性的值也是一个对象，那么就会存在问题，复制的仍然是一个引用，对该引用的修改同样会影响原对象"}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: {\n        b: 1\n    }\n}\nconst copyObj = Object.assign({}, originalObj);\ncopyObj.a.b = 2;\nconsole.log(originalObj.a.b, copyObj.a.b); // 2 2","language":"JavaScript","uuid":"f5033822-9a7d-461d-83a6-fa56705609db","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果希望对拷贝的值的修改完全不影响原对象，这种情况下就需要进行深拷贝了。"}],"disableDrag":false},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"大部分情况下不需要使用深拷贝，原因："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"浅拷贝够用了"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"深拷贝性能较低"}],"disableDrag":false}]}]}]},{"type":"header","children":[{"type":"formatted","text":"JSON.parse、JSON.stringify"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"一种序列化的方式是将对象先序列为字符串，然后根据字符串重新反序列化为对象，该种方式创建的对象是完全开辟一块新的内存空间，和原来的对象没有任何关系："}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: {\n        b: 1\n    }\n}\nconst copyObj = JSON.parse(JSON.stringify(originalObj));\ncopyObj.a.b = 2;\n\nconsole.log(originalObj.a.b, copyObj.a.b); // 1 2","language":"JavaScript","uuid":"7f0facbc-cd32-4544-8e03-3de0924dba35","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是该种方式有很多缺点："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"只能处理被序列化的对象，对于特殊类型的对象在反序列化时会丢失特定的类型信息"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Date","code":true},{"type":"formatted","text":" 会被序列化为字符串"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"RegExp","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"Promise、Map、Set、WeakMap、WeakSet","code":true},{"type":"formatted","text":" 会被序列化为空对象"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Function","code":true},{"type":"formatted","text":" ，DOM 对象会被忽略"}],"disableDrag":false}]}]},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: new Date(),\n    c: new RegExp('\\\\d{2}'),\n    d: function () {\n        return 'hello'\n    },\n    e: Promise.resolve('world'),\n    f: new Map([['a', 1], ['b', 2]]),\n    g: new Set([1, 2, 3]),\n    h: new WeakMap(),\n    i: new WeakSet()\n}\nconst copyObj = JSON.parse(JSON.stringify(originalObj));","language":"JavaScript","uuid":"6e6e5e93-e61b-4728-85e5-6c2dc6592ebc","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2ce054a3-ba08-44ff-9851-3b8ebad6bfeb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2ce054a3-ba08-44ff-9851-3b8ebad6bfeb.png"}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"无法处理循环引用，如果对象中存在循环引用，则 "},{"type":"formatted","text":"JSON.stringify","code":true},{"type":"formatted","text":" 会发生错误"}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {}\noriginalObj.self = originalObj;\nconst copyObj = JSON.parse(JSON.stringify(originalObj));","language":"JavaScript","uuid":"4a60b019-2ac7-4ee7-abd7-2a706b7a4c5b","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_11373c8e-c8e7-4727-9d14-d6b9884b65a1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_11373c8e-c8e7-4727-9d14-d6b9884b65a1.png"}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"对 "},{"type":"formatted","text":"undefined","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"symbol","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"BigInt","code":true},{"type":"formatted","text":" 这些值的无法处理，对于值为 "}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"undefined","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"symbol","code":true},{"type":"formatted","text":" 的属性在序列化会被忽略"}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: \"Hello\",\n    c: true,\n    d: null,\n    e: undefined,\n    f: Symbol(\"symbol\"),\n}\nconst copyObj = JSON.parse(JSON.stringify(originalObj));","language":"JavaScript","uuid":"15fd833d-aac8-4a1e-b729-9f56eff3b6dc","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b0d57a2c-8c40-4730-827c-275aab1c8d80.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b0d57a2c-8c40-4730-827c-275aab1c8d80.png"}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"BigInt","code":true},{"type":"formatted","text":" 则会报错"}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: BigInt(123),\n}\nconst copyObj = JSON.parse(JSON.stringify(originalObj));","language":"JavaScript","uuid":"657c5ca5-38f8-4ae5-b487-e54c4e0891cf","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ad968b60-4caa-46fe-a627-5aa79194d68a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ad968b60-4caa-46fe-a627-5aa79194d68a.png"}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"NaN","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"Infinity","code":true},{"type":"formatted","text":" 会被序列化为 "},{"type":"formatted","text":"null","code":true}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: NaN,\n    c: Infinity,\n}\nconst copyObj = JSON.parse(JSON.stringify(originalObj));","language":"JavaScript","uuid":"56fd1b73-c4de-4cfc-9381-50d588f9227c","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8861ec48-2dc1-408a-9a0e-6e2be3a617bb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8861ec48-2dc1-408a-9a0e-6e2be3a617bb.png"}]}]},{"type":"header","children":[{"type":"formatted","text":"structuredClone 和 postMessage"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"浏览器提供了一个  "},{"type":"formatted","text":"structuredClone","code":true},{"type":"formatted","text":"  API，它可以对数据进行深拷贝，它会递归的对输入对象进行拷贝，并且在递归的过程中会维护一个存储访问过的对象的表，防止无限递归和解决循环引用的问题。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"该 API 较新，可能存在"},{"type":"link","url":"https://caniuse.com/?search=structuredClone%20","openEdit":false,"children":[{"type":"formatted","text":"兼容性"}]},{"type":"formatted","text":"问题"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_42c9963e-ec38-4ac5-bfd6-a82a7235b10d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_42c9963e-ec38-4ac5-bfd6-a82a7235b10d.png"},{"type":"paragraph","children":[{"type":"formatted","text":"另外它只能拷贝可序列化的数据，如果存在不可序列化的数据则会报错，下面这些数据是不可序列化的："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Symbol","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Function","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Promise","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"WeakMap","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"WeakSet","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"DOM 对象"}],"disableDrag":false}]}]},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: \"Hello\",\n    c: true,\n    d: undefined,\n    e: null,\n    f: NaN,\n    g: Infinity,\n    h: new Date(),\n    i: /\\d{2}/,\n    j: new Map([['a', 1], ['b', 2]]),\n    k: new Set([1, 2, 3]),\n    l: {\n        a: 1,\n    }\n}\noriginalObj.self = originalObj;\n\nconst copyObj = structuredClone(originalObj);\ncopyObj.j.set('c', 3);\ncopyObj.k.add(4);\ncopyObj.l.a = 2;","language":"JavaScript","uuid":"b7e211b8-8c19-4cb3-958d-507b62eabeed","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b86298bb-b4dc-4115-962e-f62c7d9a67d4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b86298bb-b4dc-4115-962e-f62c7d9a67d4.png"},{"type":"paragraph","children":[{"type":"formatted","text":"也可以使用 "},{"type":"formatted","text":"MessageChannel","code":true},{"type":"formatted","text":" 对数据进行拷贝，使用 "},{"type":"formatted","text":"postMessage","code":true},{"type":"formatted","text":" 传递数据时，也是深拷贝，其使用的算法和 "},{"type":"formatted","text":"structuredClone","code":true},{"type":"formatted","text":" 相同，不同之处在于 "},{"type":"formatted","text":"MessageChannel","code":true},{"type":"formatted","text":" 拷贝数据是异步的"}],"disableDrag":false},{"type":"code-block","code":"const deepCopy = (obj) => {\n    const channel = new MessageChannel();\n    return new Promise((resolve) => {\n        channel.port2.onmessage = (e) => {\n            resolve(e.data);\n        }\n        channel.port1.postMessage(obj);\n    });\n}","language":"JavaScript","uuid":"e80787b3-7224-4ce8-a1b9-cedbcb5a6db5","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8a39e453-6f72-474f-92d4-cf30b540a256.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8a39e453-6f72-474f-92d4-cf30b540a256.png"},{"type":"header","children":[{"type":"formatted","text":"手动递归拷贝"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"除了使用已有的 API，还可以手动递归对象来进行深拷贝。首先实现基本的递归拷贝"}],"disableDrag":false},{"type":"code-block","code":"const deepCopy = (value) => {\n    if (typeof value !== 'object' || value === null) {\n        return value;\n    }\n    const newObj = Array.isArray(value) ? [] : {};\n    for (const key in value) {\n        if (value.hasOwnProperty(key)) {\n            newObj[key] = deepCopy(value[key]);\n        }\n    }\n    return newObj;\n}","language":"JavaScript","uuid":"9097949b-c01f-45e4-a084-a69f171f7bc6","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: 'hello',\n    c: true,\n    d: undefined,\n    e: null,\n    f: NaN,\n    g: Infinity,\n    h: {\n        a: 1,\n    },\n    i: [1, 2, 3]\n}\n\nconst copyObj = deepCopy(originalObj);\ncopyObj.h.a = 2;\ncopyObj.i.push(4);","language":"JavaScript","uuid":"d6e96be5-4506-4065-8a02-b6bc2147c87e","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_93c3e1b9-798b-426b-b999-374b1f0246c9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_93c3e1b9-798b-426b-b999-374b1f0246c9.png"},{"type":"paragraph","children":[{"type":"formatted","text":"对于基本的对象和数组拷贝没有问题，但是如果存在循环引用，如果自己引用自己，两个对象之间互相引用等，那么就会陷入无限的递归，直至爆栈"}],"disableDrag":false},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: 'hello',\n    c: true,\n    d: undefined,\n    e: null,\n    f: NaN,\n    g: Infinity,\n    h: {\n        a: 1,\n    },\n    i: [1, 2, 3]\n}\noriginalObj.self = originalObj;\n\nconst copyObj = deepCopy(originalObj);","language":"JavaScript","uuid":"f972c182-924d-4923-9494-25884a57018c","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8302f60d-2c2c-48fa-80ce-71842a755a12.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8302f60d-2c2c-48fa-80ce-71842a755a12.png"},{"type":"paragraph","children":[{"type":"formatted","text":"为了解决这个问题，需要在递归的过程中维护已处理过的对象，当后续访问到相同对象时，直接返回该对象而不用递归处理"}],"disableDrag":false},{"type":"code-block","code":"const deepCopy = (value, weakMap = new WeakMap()) => {\n    if (weakMap.has(value)) return weakMap.get(value);\n    if (typeof value !== 'object' || value === null) {\n        return value;\n    }\n    const newObj = Array.isArray(value) ? [] : {};\n    weakMap.set(value, newObj);\n    for (const key in value) {\n        if (value.hasOwnProperty(key)) {\n            newObj[key] = deepCopy(value[key], weakMap);\n        }\n    }\n    return newObj;\n}","language":"JavaScript","uuid":"13db24f2-5b7c-4aa6-9abf-c31eee4784e5","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_28812919-419f-4fe9-8fef-2522308ad701.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_28812919-419f-4fe9-8fef-2522308ad701.png"},{"type":"paragraph","children":[{"type":"formatted","text":"接下来需要对一些特殊的对象进行处理，如 "},{"type":"formatted","text":"Function","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"Date","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"Set","code":true},{"type":"formatted","text":" 等，对于不能进行深拷贝的对象当作普通对象处理，如 "},{"type":"formatted","text":"WeakMap","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"WeakSet","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"Promise","code":true},{"type":"formatted","text":" 等"}],"disableDrag":false},{"type":"code-block","code":"const deepCopy = (value, weakMap = new WeakMap()) => {\n    if (weakMap.has(value)) return weakMap.get(value);\n    if (typeof value !== 'object' || value === null) {\n        return value;\n    }\n    let newObj;\n    if (typeof value === 'function') {\n        newObj = new Function('return ' + value.toString())();\n    } else if (Array.isArray(value)) {\n        newObj = [];\n    } else if (value instanceof Date) {\n        newObj = new Date(value);\n    } else if (value instanceof RegExp) {\n        const { source, flags } = value;\n        newObj = new RegExp(source, flags);\n        // lastIndex 不可遍历\n        newObj.lastIndex = value.lastIndex;\n    } else if (value instanceof Map) {\n        newObj = new Map();\n        for (const [key, val] of value) {\n            newObj.set(deepCopy(key, weakMap), deepCopy(val, weakMap));\n        }\n    } else if (value instanceof Set) {\n        newObj = new Set();\n        for (const val of value) {\n            newObj.add(deepCopy(val, weakMap));\n        }\n    } else {\n        newObj = {};\n    }\n    weakMap.set(value, newObj);\n    for (const key in value) {\n        if (value.hasOwnProperty(key)) {\n            newObj[key] = deepCopy(value[key], weakMap);\n        }\n    }\n    return newObj;\n}","language":"JavaScript","uuid":"78fad060-439b-4b55-96cb-3512b1032e05","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"const originalObj = {\n    a: 1,\n    b: 'hello',\n    c: true,\n    d: undefined,\n    e: null,\n    f: NaN,\n    g: Infinity,\n    h: Symbol(\"symbol\"),\n    i: BigInt(123),\n    j: {\n        a: 1,\n    },\n    k: [1, 2, 3],\n    l: new Date(),\n    m: /\\d{2}/,\n    n: new Map([['a', 1], ['b', 2]]),\n    o: new Set([1, 2, 3]),\n    p: new WeakMap(),\n    q: new WeakSet(),\n    r: function () {\n        return 'Hello'\n    },\n    s: Promise.resolve(\"Hello\")\n}\noriginalObj.self = originalObj;\n\nconst copyObj = deepCopy(originalObj);\ncopyObj.j.a = 2;\ncopyObj.k.push(4);\ncopyObj.n.set('c', 3);\ncopyObj.o.add(4);\nconst value = copyObj.r();\nconsole.log(value); // Hello","language":"JavaScript","uuid":"e1216959-bd22-4e12-adcc-eb02de7d8576","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9fd48582-11f2-4a10-b187-61a840be0445.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9fd48582-11f2-4a10-b187-61a840be0445.png"},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://developer.mozilla.org/en-US/docs/Web/API/Window/structuredClone","openEdit":false,"children":[{"text":"Window: structuredClone() method","type":"formatted"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":""},{"type":"link","url":"https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm","openEdit":false,"children":[{"type":"formatted","text":"The structured clone algorithm"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://www.cnblogs.com/echolun/p/16157161.html","openEdit":false,"children":[{"type":"formatted","text":"JS 从零手写一个深拷贝（进阶篇）"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/evgeni-tcherkasski-m9FIXWpx6bI-unsplash_bbd66ad3-7e35-4edc-9f8c-f2ef3f26a895.jpg","createTime":1734053984486,"updateTime":1757771214524},"meta":{"type":"article","publishTime":1764821905670}};
