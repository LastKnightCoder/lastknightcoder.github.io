    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":22,"title":"排序算法","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"本篇文章将对常见的排序算法进行介绍，包括："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"选择排序"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"插入排序"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"希尔排序"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"归并排序"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"快速排序"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"堆排序"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了对实现的算法进行测试，我们准备一个工具类 "},{"type":"formatted","text":"Helper","code":true},{"type":"formatted","text":"，里面包括我们由于测试算法正确与否的方法以及性能测试的代码，包括交换数组中的两个元素(这个操作在排序时经常用到，所以抽象出一个方法)，还有产生一个指定容量和范围的随机数组，还有判断数组是否有序的函数以及性能测试的函数"}]},{"type":"code-block","code":"import java.util.Arrays;\nimport java.util.Random;\n\npublic class Helper {\n    \n    //交换arr[i]和arr[j]\n    public static void swap(int[] arr, int i, int j) {\n        int temp = arr[i];\n        arr[i] = arr[j];\n        arr[j] = temp;\n    }\n    \n    //产生一个范围在rangeL-rangeR，容量为n的数组\n    public static int[] generateArray(int n, int rangeL, int rangeR) {\n        Random random = new Random();\n        int[] arr = new int[n];\n        for (int i = 0; i < n; i++) {\n            arr[i] = random.nextInt(rangeR - rangeL + 1) + rangeL;\n        }\n\n        return arr;\n    }\n    \n    //判断数组是否有序(从小到大)\n    public static boolean isSorted(int[] arr) {\n        for (int i = 0; i < arr.length - 1; i++) {\n            if (arr[i] > arr[i + 1]) {\n                return false;\n            }\n        }\n        return true;\n    }\n    \n    //测试排序需要的时间 需要传入一个函数接口Sort\n    public static double testTime(int[] arr, Sort sort) {\n        long startTime = System.nanoTime();\n        sort.sort(arr);\n        long endTime = System.nanoTime();\n        \n        return (endTime - startTime) / 1000000000.0;\n    }\n}","language":"java","uuid":"f7238232-58c2-4dea-87d8-08d38415d763","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"formatted","text":"testTime","code":true},{"type":"formatted","text":" 需要传入一个函数式接口 "},{"type":"formatted","text":"Sort","code":true},{"type":"formatted","text":"，该接口定义如下"}]},{"type":"code-block","code":"public interface Sort {\n    public void sort(int[] arr);\n}","language":"java","uuid":"510ff062-dfa5-4b06-8aae-a62fa0fb129a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们在调用该方法时，只要将我们的排序算法的方法引用传入即可。"}]},{"type":"header","children":[{"type":"formatted","text":"选择排序"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"为了描述的精确性，我们把数组分为两部分，一部分是已经排好序的区域，一部分是未排序的区域"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231500502022-04-23-15-00-51.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"选择排序的策略就是在未排序的区域找出最小元素的位置，然后将它交换到未排序区域的最前方，然后已排序区域向前扩大一位，然后接着上面策略，直至未排序的区域为空，排序结束。下面以一个例子进行说明，我们默认蓝色区域代表已排序区域，白色区域代表未排序区域"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231501082022-04-23-15-01-08.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下"}]},{"type":"code-block","code":"public class SelectionSort {\n\n    public static void sort(int[] arr) {\n        if (arr == null || arr.length < 2) {\n            return;\n        }\n\n        for (int i = 0; i < arr.length; i++) {\n            int minIndex = i;\n\n            for (int j = i + 1; j < arr.length; j++) {\n                if (arr[j] < arr[minIndex]) {\n                    minIndex = j;\n                }\n            }\n            Helper.swap(arr,minIndex,i);\n            minIndex = i + 1;\n        }\n    }\n\n    public static void main(String[] args) {\n        //对100000个数进行排序\n        int n = 100000;\n        //产生随机数组\n        int[] arr = Helper.generateArray(n, 0, n);\n        //传入排序算法的引用，得到排序所需时间\n        double time = Helper.testTime(arr,SelectionSort::sort);\n        //确定算法是否排好序\n        System.out.println(\"isSorted: \" + Helper.isSorted(arr));\n        //打印排序所需时间\n        System.out.println(time + \"s\");\n    }\n}","language":"java","uuid":"8875c29b-e9af-43ee-80e2-dba71e13628b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"isSorted: true\n7.319637673s","language":"java","uuid":"607abd87-4dd3-4c6a-8e8a-5a99f488e69a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可见算法已经排好序，并且选择排序对 100000 个数据排序所需的时间为 7.32s 左右。"}]},{"type":"header","children":[{"type":"formatted","text":"插入排序"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"插入排序就像是你在打斗地主，当你摸牌时你对牌的排序。向上面一样，我们将数组分为已排序的部分和未排序的部分，已排序的部分就是你已经排好序的牌，现在你又摸到了一张牌，那么你是不是会将这张牌与排好序的牌进行比较，插入到合适的位置，然后继续摸下一张牌，然后又进行插入排序，直到牌已经摸完了(未排序的部分为空)，那么你就已经拍好序了，下面看一个例子"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231501552022-04-23-15-01-55.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码为"}]},{"type":"code-block","code":"public class InsertSort {\n\n    public static void sort(int[] arr) {\n        //i = 1开始，因为默认第一张牌是排好序的\n        for (int i = 1; i < arr.length; i++) {\n            for (int j = i; j > 0; j--) {\n                //如果后面比前面小，进行交换\n                if (arr[j - 1] > arr[j]) {\n                    Helper.swap(arr,j - 1, j);\n                } else {\n                    //如果后面比前面大，结束交换\n                    break;\n                }\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        int n = 100000;\n        int[] arr = Helper.generateArray(n, 0, n);\n        double time = Helper.testTime(arr,InsertSort::sort);\n        System.out.println(\"isSorted: \" + Helper.isSorted(arr));\n        System.out.println(time + \"s\");\n    }\n}","language":"java","uuid":"a8af13fb-7c5c-431a-9109-a622b6e5f6c5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"isSorted: true\n8.863959818s","language":"java","uuid":"93b01504-b562-4854-b54c-698a6a38f497","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这表明插入排序对 100000 个数据排序所需的时间为 8.86s 左右。它的速度比选择排序还要慢一些，这是因为插入排序中含有大量的交换操作，如果我们将上面的交换操作替换为赋值操作"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231502192022-04-23-15-02-19.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public static void sort(int[] arr) {\n    for (int i = 1; i < arr.length; i++) {\n        int e = arr[i]; //保存要插入的元素\n        int j; //记录要插入的位置\n        for (j = i; j > 0; j--) {\n            if (arr[j - 1] > e) {\n                //向后移动\n                arr[j] = arr[j - 1];\n            } else {\n                break;\n            }\n        }\n        arr[j] = e;\n    }\n}","language":"java","uuid":"095e677b-387d-455c-b912-2dbcd44171a6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这时需要的时间为"}]},{"type":"code-block","code":"isSorted: true\n2.293106947s","language":"java","uuid":"a7671a3f-799c-479c-a381-e48b123a1174","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"并且对于近乎有序的数组，插入排序的速度非常的快，甚至比后面要介绍的 "},{"type":"inline-math","tex":"O(N \\log N)","children":[{"type":"formatted","text":"O(N \\log N)"}]},{"type":"formatted","text":" 的速度还要快。"}]},{"type":"header","children":[{"type":"formatted","text":"希尔排序"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"希尔排序是对插入排序的改进。既然是改进，那么我们就要知道插入排序有什么问题：如果有一个很小的数在数组的后方，那么这个数就会进行很长时间的交换才能插入到合适的位置，这明显是一个比较慢的过程"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231503072022-04-23-15-03-08.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"而希尔排序将解决这一个问题，希尔排序首先将数组分组，比如"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231503232022-04-23-15-03-24.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的示例中，我们从每隔 3 个一组到每隔 2 个一组最后每隔 1 个一组，我们把上面的 "},{"type":"formatted","text":"\"3,2,1\"","code":true},{"type":"formatted","text":" 称之为增幅序列 "},{"type":"formatted","text":"h","code":true},{"type":"formatted","text":"，不同的递增序列对算法的性能也有影响，有很多的论文研究了不同的递增序列，但都无法证明某个递增序列是最好的，下面的程序考虑使用 "},{"type":"formatted","text":"\"1, 4, 13, ...\"","code":true},{"type":"formatted","text":" 这个递增序列"},{"type":"formatted","text":"(h = 1, h = 3 \\* h + 1)","code":true},{"type":"formatted","text":"，代码如下"}]},{"type":"code-block","code":"public class ShellSort {\n\n    public static void sort(int[] arr) {\n        int N = arr.length;\n        int h = 1;\n        while (h < N / 3) {\n            h = 3*h + 1; // 1 4 13 40 121 ...\n        }\n\n        // h = 1的时候就是对整个数组进行插入排序\n        while (h >= 1) {\n            //每隔h个元素(将数组分成了h组)进行插入排序\n            for (int i = h; i < N; i++) {\n                for (int j = i; j > h - 1; j -= h) {\n                    if (arr[j - h] > arr[j]) {\n                        Helper.swap(arr, j, j-h);\n                    } else {\n                        break;\n                    }\n                }\n            }\n            h = h/3;\n        }\n    }\n\n    public static void main(String[] args) {\n        int n = 100000;\n        int m = 10;\n        double time = 0;\n        for (int i = 0; i < m; i++) {\n            int[] arr = Helper.generateArray(n, 0, n);\n            time += Helper.testTime(arr, ShellSort::sort);\n            System.out.println(\"isSorted: \" + Helper.isSorted(arr));\n        }\n        time = time / m;\n        System.out.println(time + \"s\");\n    }\n\n}","language":"java","uuid":"ad51de28-f858-4c47-b603-f98bdc3e1fcb","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"isSorted: true\n0.0292856418s","language":"java","uuid":"74c5a649-1b9f-4767-9bad-bade7ef0c0f2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"希尔排序 10 次平均所需的时间只有 0.03s，与选择排序和插入排序不是一个等级上的。"}]},{"type":"header","children":[{"type":"formatted","text":"归并排序"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"自顶向下的归并排序"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"归并排序的思想是将数组一分为二，然后对左、右两边的数组进行排序，然后将左右两边的已经有序数组进行融合成一个有序的数组，而左右两边的排序问题也可以按照上面的思想进行，直到数组只剩下一个元素，我们认为已经是有序的了，然后向上进行融合"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231503562022-04-23-15-03-56.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面的代码简要的简述了上面的过程"}]},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class MergeSort {\n\n    public static void sort(int[] arr) {\n        if (arr == null || arr.length < 2) {\n            return ;\n        }\n\n        mergeSort(arr,0, arr.length-1);\n    }\n\n    private static void mergeSort(int[] arr, int left, int right) {\n        //如果只有一个元素，可认为是有序的了\n        if (left == right) {\n            return ;\n        }\n\t\t\n        int mid = left + (right - left) / 2;\n        //对左右两边进行排序\n        mergeSort(arr,left,mid);\n        mergeSort(arr,mid + 1, right);\n\t\t\n        //融合左右两边的数组\n        merge(arr,left,right);\n    }\n}","language":"java","uuid":"64bace94-1adc-4352-b270-db10ffb782c3","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在的关键是如何融合左右两个有序的数组为一个有序的数组，来看下面这个例子"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231504122022-04-23-15-04-13.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"private static void merge(int[] arr, int left, int right) {\n    //要融合的数组\n    int[] help = new int[right - left + 1];\n    int mid = left + (right - left) / 2;\n    //左右数组的首部\n    int p1 = left;\n    int p2 = mid + 1;\n    //要融合数组的首部\n    int i = 0;\n    //如果两个数组都没有遍历完毕\n    while (p1 <= mid && p2 <= right) {\n        if (arr[p1] <= arr[p2]) {\n            help[i++] = arr[p1++];\n        } else {\n            help[i++] = arr[p2++];\n        }\n    }\n    //如果p2遍历完毕了，将p1中剩下的元素复制到融合的数组中\n    while (p1 <= mid) {\n        help[i++] = arr[p1++];\n    }\n    //同上\n    while (p2 <= right) {\n        help[i++] = arr[p2++];\n    }\n    //将融合的数组按序赋值给我们要排序的数组\n    for (int j = left; j <= right; j++) {\n        arr[j] = help[j - left];\n    }\n}","language":"java","uuid":"599329e5-d689-475a-8fd8-13ef4ac701b7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们来测试一下 10 次平均所需时间为"}]},{"type":"code-block","code":"isSorted: true\n0.0334043239s","language":"java","uuid":"5de20d4f-7e4a-4827-a22d-fe192837e937","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"归并排序是 "},{"type":"inline-math","tex":"O(N \\log N)","children":[{"type":"formatted","text":"O(N \\log N)"}]},{"type":"formatted","text":" 级别的算法，比选择排序和插入排序要快很多。"}]},{"type":"header","children":[{"type":"formatted","text":"优化"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们在对左右两个数组排好序之后，直接进行了 "},{"type":"formatted","text":"merge","code":true},{"type":"formatted","text":" 操作"}]},{"type":"code-block","code":"mergeSort(arr,left,mid);\nmergeSort(arr,mid + 1, right);\nmerge(arr,left,right);","language":"java","uuid":"b21c466d-fb52-4202-8907-61c37f06bd96","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果考虑到如下情况"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231504452022-04-23-15-04-45.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"mergeSort(arr,left,mid);\nmergeSort(arr,mid + 1, right);\nif (arr[mid] > arr[mid + 1])\n    merge(arr,left,right);","language":"java","uuid":"c2f89a76-59cd-4d36-b787-ce58f19ab5ca","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们还可以进行优化，在上面我们提到，插入排序在数组近乎有序的情况下排序的速度非常的快，所以我们可以考虑当数组被划分到小于一定的规模(当数组小于一定规模时，近乎有序的概率很大)时我们不在向下划分，而是转而用插入排序，所以我们在 "},{"type":"formatted","text":"Helper","code":true},{"type":"formatted","text":" 中添加一个方法"}]},{"type":"code-block","code":"public static void insertSort(int[] arr, int l, int r) {\n    for (int i = l + 1; i <= r; i++) {\n        int e = arr[i]; //保存要插入的元素\n        int j; //记录要插入的位置\n        for (j = i; j > l; j--) {\n            if (arr[j - 1] > e) {\n                arr[j] = arr[j - 1];\n            } else {\n                break;\n            }\n        }\n        arr[j] = e;\n    }\n}","language":"java","uuid":"4384cd17-824f-451e-94e9-0131e2d7b467","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个方法与插入排序的算法很相似，不过规定了对什么范围的数组进行排序，所以归并排序的算法可以修改如下"}]},{"type":"code-block","code":"private static void mergeSort(int[] arr, int left, int right) {\n    //当数组小于15时，使用插入排序\n    if (right - left < 15) {\n        Helper.insertSort(arr, left, right);\n        return;\n    }\n    \n    int mid = left + (right - left) / 2;\n    mergeSort(arr,left,mid);\n    mergeSort(arr,mid + 1, right);\n    if (arr[mid] > arr[mid + 1])\n        merge(arr,left,right);\n}","language":"java","uuid":"bf860c6c-3bca-40fb-a9ca-a8b93a427f54","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"再次测试 10 次平均所需时间"}]},{"type":"code-block","code":"isSorted: true\n0.028484280499999997s","language":"java","uuid":"3c9d3406-6282-4912-8ed6-9acb68bd0a54","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"自底向上的归并排序"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们在上面使用的归并排序是自顶向下使用递归来完成的，但是我们不一定要自顶向下的完成这个排序过程，而是可以自底向上进行排序，首先将底层的序拍好，然后进行 "},{"type":"formatted","text":"merge","code":true},{"type":"formatted","text":" 一路向上完成排序"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231505002022-04-23-15-05-00.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public static void sortBU(int[] arr) {\n    if (arr == null || arr.length < 2) {\n        return ;\n    }\n    //每轮2*sz个元素，为什么不直接sz = 2, 因为我们后面传入mid是要/2，所以这里的粒度就为sz\n    for (int sz = 1; sz <= arr.length; sz += sz) {\n        //mid <= arr.length - 1\n        for (int i = 0; i + sz < arr.length; i += (sz + sz)) {\n            //小数组使用插入排序\n            if (2 * sz < 15) {\n                Helper.insertSort(arr,i, i + sz + sz - 1);\n                continue;\n            }\n            //只有当右边最小比左边最大还大时才需要merge\n            if (arr[i + sz -1] > arr[Math.min(i + sz, arr.length - 1)]) //防止越界\n                merge(arr, i, i + sz - 1, Math.min(i + sz + sz - 1, arr.length - 1)); //防止越界\n        }\n    }\n}\nprivate static void merge(int[] arr, int left, int mid, int right) {\n    int[] help = new int[right - left + 1];\n    int p1 = left;\n    int p2 = mid + 1;\n    int i = 0;\n    while (p1 <= mid && p2 <= right) {\n        if (arr[p1] <= arr[p2]) {\n            help[i++] = arr[p1++];\n        } else {\n            help[i++] = arr[p2++];\n        }\n    }\n    while (p1 <= mid) {\n        help[i++] = arr[p1++];\n    }\n    while (p2 <= right) {\n        help[i++] = arr[p2++];\n    }\n    for (int j = left; j <= right; j++) {\n        arr[j] = help[j - left];\n    }\n}","language":"java","uuid":"d07bada5-8b18-4367-8c05-80628e3e53f8","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"你可能发现这次的 "},{"type":"formatted","text":"merge","code":true},{"type":"formatted","text":" 需要自己传入 "},{"type":"formatted","text":"mid","code":true},{"type":"formatted","text":" 值，而不是自己计算。可以思考一下为什么? 现在我们测试一下自底向上排序所需要的时间"}]}]},{"type":"code-block","code":"isSorted: true\n0.031012182500000006s","language":"java","uuid":"f544bd79-d809-4a68-b535-1772026d925b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"自底向上的排序会比自顶向下的排序慢，但是自底向上的排序有一个非常重要的特点，它没有利用数组随机访问的特点，即数组通过下标对元素访问(插入排序中有，但是你可以不优化这里)，这意味着我们可以对链表使用自底向上的排序。"}]},{"type":"header","children":[{"type":"formatted","text":"快速排序"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"基本算法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"在看快速排序算法前我们先来看一个问题，给定一个数，要求数组左边的数都小于等于这个数，数组右边的数都大于这个数，请问这个算法怎么写。首先我们将数组标记为小于等于区和大于区，并用 "},{"type":"formatted","text":"less","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"more","code":true},{"type":"formatted","text":" 标记区域的范围，所有 "},{"type":"formatted","text":"index <= less","code":true},{"type":"formatted","text":" 的元素都小于指定数，所有 "},{"type":"formatted","text":"index >= more","code":true},{"type":"formatted","text":" 的都大于指定数，下图将讲解具体的算法"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231505582022-04-23-15-05-59.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的过程我们称为 partition，对应的代码如下"}]},{"type":"code-block","code":"int e = 6;\npublic static int partition(int[] arr, int L, int R) {\n    int less = L - 1;\n    int more = R + 1;\n    int cur = L;\n    while (cur < more) {\n        if (arr[cur] <= e) {\n            //如果当前元素小于指定元素 less和cur向前移动\n            less++;\n            cur++;\n        } else if (arr[cur] > e) {\n            Helper.swap(arr,--more,cur);\n        } else {\n            cur++;\n        }\n    }\n    //返回两个数组的分界处\n    return less;\n}","language":"java","uuid":"fa6f3914-03a9-4db9-a38e-9affe9f256ec","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"那么快速排序的思想就是选定一个数(一般我们选择要排序范围内的最后一个数 "},{"type":"formatted","text":"arr[R]","code":true},{"type":"formatted","text":")，要求左边的数比这个数小(或等于)，右边的数比这个数大。然后又接着对左右两边的数进行上述的分割(partition)，直至分割后的数组只剩下一个元素，可认为是有序的，这时数组就是有序的了"}]},{"type":"code-block","code":"public class QuickSort {\n    public static void sort(int[] arr) {\n        if (arr == null || arr.length < 2) {\n            return;\n        }\n\n        quickSort(arr,0,arr.length-1);\n    }\n\n    public static void quickSort(int[] arr, int l, int r) {\n        //当数组较小时，使用插入排序\n        if (r - l < 15) {\n            Helper.insertSort(arr, l, r);\n            return;\n        }\n        \n        if (l < r) {\n            int p = partition(arr, l, r);\n            quickSort(arr, l, p);\n            quickSort(arr, p + 1, r);\n        }\n    }\n\n    public static int partition(int[] arr, int L, int R) {\n        int less = L - 1;\n        int more = R + 1;\n\n        int cur = L;\n        while (cur < more) {\n            if (arr[cur] <= arr[R]) {\n                less++;\n                cur++;\n            } else if (arr[cur] > arr[R]) {\n                Helper.swap(arr,--more,cur);\n            }\n        }\n        \n        return less;\n    }\n}","language":"java","uuid":"cc6ae6aa-ded3-499d-b953-03e1ba22f52b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"测试此时 10 次平均所需的时间"}]},{"type":"code-block","code":"isSorted: true\n0.023240137399999996s","language":"java","uuid":"7c520082-0201-434b-bda9-fa9fae374de8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"随机快排"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"但是此时有一个问题，如果此时数组是近乎有序的，那么我们根据最后一个元素划分元素会划分出左右两边的数组失衡"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231506162022-04-23-15-06-17.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们不能选择最后一个元素，而是选择一个随机的元素，我们只要在上面的程序中加入下面的一行代码即可"}]},{"type":"code-block","code":"if (l < r) {\n    //随机一个下标和最后一个元素交换\n    Helper.swap(arr, (int)Math.random() * (r - l + 1) + l, r); // 随机快排\n    int p = partition(arr, l, r);\n    quickSort(arr, l, p);\n    quickSort(arr, p + 1, r);\n}","language":"java","uuid":"abd8bb19-e722-4912-96da-00fb42be7ad9","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"三路快排"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"考虑这么一种情况，如果数组中有十分多的重复元素，那么就会有元素重复的子数组，这时应该就不应该排序了，但是我们的算法还是会把数组继续切分为更小的数组进行排序，这就有很大的改进潜力。所以我们考虑我们的 partition 算法不再划分为两部分，而是划分为三部分，小于，等于和大于三个区域"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231506322022-04-23-15-06-32.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们修改上面的排序算法如下"}]},{"type":"code-block","code":"public static void quickSort(int[] arr, int l, int r) {\n    if (r - l < 15) {\n        Helper.insertSort(arr, l, r);\n        return;\n    }\n    if (l < r) {\n        Helper.swap(arr, (int)Math.random() * (r - l + 1) + l, r); // 随机快排\n        //p得到的是等于区的范围\n        int[] p = partition(arr,l,r);\n        //对等于区不用排序\n        quickSort(arr,l,p[0] - 1);\n        quickSort(arr,p[1] + 1, r);\n    }\n}\npublic static int[] partition(int[] arr, int L, int R) {\n    int less = L - 1;\n    int more = R;\n    int cur = L;\n    while (cur < more) {\n        if (arr[cur] < arr[R]) {\n            //与less的前一个元素进行交换 并且less和cur向前移动\n            Helper.swap(arr,++less,cur++);\n        } else if (arr[cur] > arr[R]) {\n            //与more的后一个元素进行交换 并且more向后移动，并且cur和less都不移动\n            Helper.swap(arr,--more,cur);\n        } else {\n            //如果等于，将cur向前移动即可\n            cur++;\n        }\n    }\n    \n    //最后将最后一个元素与more位置的元素进行交换\n    Helper.swap(arr,R,more);\n    //返回等于区的左右下标\n    return new int[]{less+1,more};\n}","language":"java","uuid":"e0cadf21-9ae3-4e82-92fd-adb535b2c8bf","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"堆排序"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"堆的有关知识可以参考优先队列和堆，如果你已经仔细的阅读了话，相比你已经熟悉了堆的性质了，那么下面就直接上代码了"}]},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class HeapSort {\n\n    public static void sort(int[] arr) {\n        if (arr == null || arr.length < 2) {\n            return;\n        }\n\n        //将数组变成堆结构\n        for (int i = 0; i < arr.length; i++) {\n            heapInsert(arr,i);\n        }\n\n        int heapSize = arr.length;\n        while (heapSize > 0) {\n            Helper.swap(arr,0,--heapSize);\n            heapify(arr,0,heapSize);\n        }\n    }\n\n    public static void heapInsert(int[] arr, int index) {\n        while (arr[index] > arr[(index-1)/2]) {\n            Helper.swap(arr,index,(index-1)/2);\n            index = (index - 1)/2;\n        }\n\n    }\n\n    public static void heapify(int[] arr, int index, int heapSize) {\n        int left = 2 * index + 1;\n\n        while (left < heapSize) {\n            int right = left + 1;\n            //假设左更大\n            int larger = left;\n            //如果右比左大 改变larger为右\n            if (right < heapSize && arr[right] > arr[left]) {\n                larger = right;\n            }\n\n            //如果父比左右子节点都大，说明还是堆，直接退出循环\n            if (arr[larger] < arr[index]) {\n                break;\n            }\n\n            //如果不是，那么就和比较大的交换交换\n            Helper.swap(arr,larger,index);\n            index = larger;\n            left = index * 2 + 1;\n        }\n    }\n\n    public static void main(String[] args) {\n        int n = 100000;\n        int m = 10;\n        double time = 0;\n        for (int i = 0; i < m; i++) {\n            int[] arr = Helper.generateArray(n, 0, n);\n            time += Helper.testTime(arr, HeapSort::sort);\n            System.out.println(\"isSorted: \" + Helper.isSorted(arr));\n        }\n        time = time / m;\n        System.out.println(time + \"s\");\n    }\n}","language":"java","uuid":"81bff158-1e3f-4113-904e-a564f6c43cc7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"测试 10 次平均所需时间为"}]},{"type":"code-block","code":"isSorted: true\n0.060118443099999995s","language":"java","uuid":"b782108e-3108-477e-b022-6da942fa2afd","children":[{"type":"formatted","text":""}]}],"tags":["排序算法","选择排序","插入排序","希尔排序","归并排序","快速排序","堆排序"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-8opwwy_b994a5fe-df4a-409d-8dd5-8d65c0365610.jpg","createTime":1617420335000,"updateTime":1743303640466},"meta":{"type":"article","publishTime":1764822965002}};
