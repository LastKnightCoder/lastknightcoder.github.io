    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":5,"title":"Node Stream 详解","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"假设我们有这么一个需求，我们需要复制一个文件中的内容到另一个文件中，我们会写出以下代码"}]},{"type":"code-block","code":"const fs = require('fs');\nconst path = require('path');\n\nconst copy = (source, target) => {\n    fs.readFile(path.resolve(source), (err, data) => {\n        if(err) {\n            throw new Error(err.toString());\n            return;\n        }\n        fs.writeFile(path.resolve(target), data, (err) => {\n            if(!err) {\n                console.log(\"复制成功！\");\n            }\n        })\n    })\n}","language":"js","uuid":"7a27602b-8b1b-4b97-99e2-1a3a744a1c75","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的代码很简单，就是先读取 "},{"type":"formatted","text":"source","code":true},{"type":"formatted","text":" 文件里面的内容，然后将内容写入到 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 文件中。它的特点是需要读取完 "},{"type":"formatted","text":"source","code":true},{"type":"formatted","text":" 里面的所有内容，然后将内容写入到 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 中。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这样做就有一个缺点，当我们读取大文件时，可能会发生内存不够用的情况，因为它会先将文件的所有内容都读取到内存；另外还就是时间，一次性读取一个大文件到内存，是需要比较长的时间的，用户可能会有卡顿的感觉。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一种解决办法就是边读边写，读取部分文件内容，然后将内容写入到新文件中，这样在内存中的数据只是部分内容，不会占有太多的内存，由于是边读编写，用户可以很快的得到响应，提高用户体验。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在"},{"type":"link","url":"https://www.cnblogs.com/vajoy/p/6349817.html","openEdit":false,"children":[{"type":"formatted","text":"网上"}]},{"type":"formatted","text":"找到一幅动图来形象的展示使用流前后数据的流动情况"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting/raw/master/20210305123350.gif","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting/raw/master/20210305123407.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Node.js 给我们提供 Stream 的 API，它是专门用来处理大文件的。因为数据是一部分一部分的处理，就像是水流一样，所以这个模块的名称就称为 Stream。"}]},{"type":"code-block","code":"const fs = require('fs');\n\nfunction copy(source, target) {\n    const rs = fs.createReadStream(source);\n    const ws = fs.createWriteStream(target);\n\n    rs.on('data', data => {\n        ws.write(data);\n    });\n\n    rs.on('end', () => {\n        ws.end();\n    });\n}","language":"js","uuid":"f29280b7-1d1f-4e18-aa87-af84aa234f9e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面代码的细节将在后文揭晓。"}]},{"type":"header","children":[{"type":"formatted","text":"Stream 的分类"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Stream 可以分为四类"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Readable：可读流，数据的提供者"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Writeable：可写流，数据的消费者"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Duplex：可写可读流(双工流)"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Transform：是 Duplex 的特殊情况，转换流，对输入的数据进行处理，然后输出"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"可读流与可写流是基础，常见的可读流与可写流如下："}]},{"type":"table","children":[{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"可读流"}]},{"type":"table-cell","children":[{"type":"formatted","text":"可写流"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"HTTP Request"}]},{"type":"table-cell","children":[{"type":"formatted","text":"HTTP Response"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"fs read streams"}]},{"type":"table-cell","children":[{"type":"formatted","text":"fs write streams"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"process.stdin"}]},{"type":"table-cell","children":[{"type":"formatted","text":"process.stdout"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"TCP sockets"}]},{"type":"table-cell","children":[{"type":"formatted","text":"TCP sockets"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"zlib streams"}]},{"type":"table-cell","children":[{"type":"formatted","text":"zlib streams"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"crypto streams"}]},{"type":"table-cell","children":[{"type":"formatted","text":"cypoto streams"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"Stream 是 EventEmitter 的实例，有自定义的事件。"}]},{"type":"header","children":[{"type":"formatted","text":"Readable Stream"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"可读流有两个模式，暂停模式与流动模式。当我们创建一个流时，如果我们监听了 "},{"type":"formatted","text":"readable","code":true},{"type":"formatted","text":" 事件，它就会来到暂停模式，在暂停模式下，它会不断的读取数据到缓冲区，当读取到的数据超过预设的大小时，它由属性 "},{"type":"formatted","text":"highWaterMark","code":true},{"type":"formatted","text":" 指定(默认为 64kB)，便会触发 "},{"type":"formatted","text":"readable","code":true},{"type":"formatted","text":" 事件，"},{"type":"formatted","text":"readable","code":true},{"type":"formatted","text":" 事件的触发有两种情况："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"缓存区中的数据达到 "},{"type":"formatted","text":"highWaterMark","code":true},{"type":"formatted","text":" 预设的大小"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"数据源的数据已经被读取完毕"}]}]}]},{"type":"code-block","code":"const fs = require('fs');\n\nconst rs = fs.createReadStream('a.txt', {\n    highWaterMark: 1 // 缓存区最多存储 1 字节\n});\n\nrs.on('readable', () => {\n    let data;\n    while(data=rs.read()) {\n        console.log(data.toString());\n    }\n})","language":"js","uuid":"52e10956-0003-4c7b-b89f-36fedd7b6ad0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的程序设置 "},{"type":"formatted","text":"highWaterMark","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"，即每次读取到一个字节便会触发 "},{"type":"formatted","text":"readable","code":true},{"type":"formatted","text":" 命令，每次当触发 "},{"type":"formatted","text":"readable","code":true},{"type":"formatted","text":" 命令时，我们调用可读流的 "},{"type":"formatted","text":"read([size])","code":true},{"type":"formatted","text":" 方法从缓冲区中读取数据(读取到的数据为 "},{"type":"formatted","text":"Buffer","code":true},{"type":"formatted","text":")，然后打印到控制台。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们为可读流绑定 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件时，可读流便会切换到流动状态，当位于流动状态时，可读流会自动的从文件中读取内容到缓冲区，当缓冲区中的内容大于设定的 "},{"type":"formatted","text":"highWaterMark","code":true},{"type":"formatted","text":" 的大小时，便会触发 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件，将缓冲区中的数据传递给 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件绑定的函数。以上过程会自动不断进行。当文件中的所有内容都被读取完成时，那么就会触发 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":" 事件。"}]},{"type":"code-block","code":"const fs = require('fs');\n\nconst rs = fs.createReadStream('a.txt', {\n    highWaterMark: 2\n});\n\nrs.on('data', data => {\n    console.log(data.toString());\n});\n\nrs.on('end', () => {\n    console.log(\"文件读取完毕！\");\n});","language":"js","uuid":"e5e7201f-fa89-4e3e-8925-2b4e025bcdce","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"暂停模式像是手动步枪，而流动模式则像是自动步枪。暂停模式与流动模式也可以相互切换，通过 "},{"type":"formatted","text":"pause()","code":true},{"type":"formatted","text":" 可以从流动状态切换到暂停状态，通过 "},{"type":"formatted","text":"resume()","code":true},{"type":"formatted","text":" 则可以从暂停模式切换到流动模式。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"可读流的一个经典实例就是 "},{"type":"formatted","text":"http","code":true},{"type":"formatted","text":" 中的请求对象 "},{"type":"formatted","text":"req","code":true},{"type":"formatted","text":"，下面的程序展示了通过监听 "},{"type":"formatted","text":"req","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件来读取 HTTP 请求体中的内容"}]},{"type":"code-block","code":"const http = require('http');\n\nconst app = http.createServer();\n\napp.on('request', (req, res) => {\n    let datas = [];\n    req.on('data', data => {\n        datas.push(data);\n    });\n\n    req.on('end', () => {\n        req.body = Buffer.concat(datas);\n        // 当读取完 body 中的内容之后，将内容返回给客户端\n        res.end(req.body);\n    });\n})\n\napp.listen(3000, () => {\n    console.log(\"服务启动在 3000 端口... ...\");\n})","language":"js","uuid":"144abee4-4c01-4a7c-8c61-9c098429478e","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting/raw/master/20210305204222.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Writable Stream"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"可写流与可读流相似，当我们向可写流写入数据时(通过可写流的 "},{"type":"formatted","text":"write()","code":true},{"type":"formatted","text":" 方法写数据)，会直接将数据写入到文件中，如果写入的数据比较慢的话，那就就会将数据写入到缓冲区，当缓冲区中的内容达到 "},{"type":"formatted","text":"highWaterMark","code":true},{"type":"formatted","text":" 设定的大小时，"},{"type":"formatted","text":"write","code":true},{"type":"formatted","text":" 方法就会返回一个 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"，表明不能接受更多的数据了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当缓冲区中的数据全部被消费完了(写入了文件中或者被别的流消费了)，那么就会触发 "},{"type":"formatted","text":"drain","code":true},{"type":"formatted","text":" 事件。"}]},{"type":"code-block","code":"const fs = require('fs');\n\nconst ws = fs.createWriteStream('b.txt', {\n    highWaterMark: 16 * 1024\n});\n\nfunction writeMillionTimes(writer, data, encoding, callback) {\n    let i = 10000;\n    \n    write();\n\n    function write() {\n        // 表示是否可以向可写流中写入数据\n        let ok = true;\n        while(i-- > 0 && ok) {\n            // 当 writer.write() 方法返回  false 表示不可写入数据\n            ok = writer.write(data, encoding, i === 0 ? callback : null);\n        }\n\n        if(i > 0) {\n            // 说明 ok 为 false，即不能向缓冲区中写入内容了\n            console.log(\"drain\", i);\n            // 监听 drain 事件，当队列消费完毕时继续调用 write() 方法写入\n            writer.once('drain', write);\n        }\n    }\n}\n\nwriteMillionTimes(ws, 'simple', 'utf-8', () => {\n    console.log(\"end\");\n})","language":"js","uuid":"de22c74c-a226-4e58-810e-3e70170d1478","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"drain 7268\ndrain 4536\ndrain 1804\nend","language":"js","uuid":"7e872b0f-511b-413e-9d36-bdb2405e3382","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"说明有三次缓冲区中的内容达到了 16KB，可以验算上面的数字之间的差值，在乘以 6(simple 的字节数)，大小大约为 "},{"type":"inline-math","tex":"16 \\times 1024","children":[{"type":"formatted","text":"16 \\times 1024"}]},{"type":"formatted","text":" 左右，如"}]},{"type":"block-math","tex":"(7268 - 4536) * 6 = 16392 \\approx 16384 = 16 * 1024","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们还可以调用可写流的 "},{"type":"formatted","text":"end()","code":true},{"type":"formatted","text":" 方法，表示将缓存中的内容清空写入文件，并关闭文件，此时会触发 "},{"type":"formatted","text":"close","code":true},{"type":"formatted","text":" 事件"}]},{"type":"code-block","code":"const fs = require('fs');\n\nconst ws = fs.createWriteStream('b.txt');\n\nws.write('Hello');\nws.write('World');\nws.end('!');\n\nws.on('close', () => {\n    console.log(\"close\"); // close\n})","language":"js","uuid":"0547ac71-0e47-471f-9ea5-7636dc27bb61","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当调用 "},{"type":"formatted","text":"end()","code":true},{"type":"formatted","text":" 方法之后就不能调用 "},{"type":"formatted","text":"write()","code":true},{"type":"formatted","text":" 方法了，否则会报错"}]},{"type":"code-block","code":"const fs = require('fs');\n\nconst ws = fs.createWriteStream('b.txt');\n\nws.write('Hello');\nws.write('World');\nws.end('!');\n\n// Error [ERR_STREAM_WRITE_AFTER_END]: write after end\nws.write('write again'); ","language":"js","uuid":"52d439d1-f5a5-4336-837b-1a1edd12b7f5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当调用 "},{"type":"formatted","text":"end()","code":true},{"type":"formatted","text":" 方法之后，并且数据缓冲区中的数据已经写入之后会触发可写流的 "},{"type":"formatted","text":"finish","code":true},{"type":"formatted","text":" 事件"}]},{"type":"code-block","code":"const fs = require('fs');\n\nconst ws = fs.createWriteStream('b.txt');\n\nws.write('Hello');\nws.write('World');\nws.end('!');\n\nws.on('close', () => {\n    console.log(\"close\");\n});\n\nws.on('finish', () => {\n    console.log(\"finish\");\n});","language":"js","uuid":"f7d794a3-b991-40dc-a60b-9b268840bb63","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"打印结果是"}]},{"type":"code-block","code":"finish\nclose","language":"js","uuid":"28790e2d-b3c5-4c3b-8cbf-db816ceb4eec","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"说明 "},{"type":"formatted","text":"finish","code":true},{"type":"formatted","text":" 事件会在 "},{"type":"formatted","text":"close","code":true},{"type":"formatted","text":" 事件之前被触发。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"可写流的经典例子就是 "},{"type":"formatted","text":"http","code":true},{"type":"formatted","text":" 模块的响应对象 "},{"type":"formatted","text":"res","code":true},{"type":"formatted","text":"，下面的程序演示了当请求到来时，我们读取一个 "},{"type":"formatted","text":"html","code":true},{"type":"formatted","text":" 页面返回给客户端"}]},{"type":"code-block","code":"const http = require('http');\nconst fs = require('fs');\n\nconst app = http.createServer();\n\napp.on('request', (req, res) => {\n    const rs = fs.createReadStream('index.html');\n    \n    rs.on('data', data => {\n        res.write(data);\n    })\n\n    rs.on('end', () => {\n        res.end()\n    });\n});\n\napp.listen(3000, () => {\n    console.log(\"服务启动在 3000 端口 ... ...\");\n})","language":"js","uuid":"ce8c542d-16e9-4818-b09f-e494ffc52113","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Duplex Stream 与 Transform Stream"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"Duplex，即双工的意思，它既可以接收数据，也可以输出数据，它的输入和输出之间可以没有任何的关系，就像是一个部件内部有两个独立的系统。Duplex 继承了可读流(Readable)，并且拥有可写流(Writable)的所有方法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Transform Stream 继承了 Duplex Stream，它同样具有可读流与可写流的能力，并且它的输出与输入之间是有关系的，中间做了一次转换。常见的转换流有 "},{"type":"formatted","text":"zlib","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"crypto","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"出于文章结构的考虑，在这里不详细讲解这两个流，在后文中会实现这两个流，以加深对这两个流的理解。"}]},{"type":"header","children":[{"type":"formatted","text":"pipe"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以混合使用可读流与可写流来进行文件的复制"}]},{"type":"code-block","code":"const fs = require('fs');\n\nfunction copy(source, target) {\n    const rs = fs.createReadStream(source);\n    const ws = fs.createWriteStream(target);\n\n    rs.on('data', data => {\n        ws.write(data);\n    });\n\n    rs.on('end', () => {\n        ws.end();\n    });\n}\n\ncopy('a.txt', 'b.txt');","language":"js","uuid":"40f00a7e-b153-4cd8-b89b-0de060050118","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是上面的写法却不被建议使用，因为没有考虑到可读流与可写流速度之间的差异，如果可读流输出数据的速度大于可写流写入数据的速度，这个时候就会有数据一直堆压在缓存区，导致占用过高的内存，专业术语叫做积压。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们需要改善上面的程序，具体做法就是当 "},{"type":"formatted","text":"write()","code":true},{"type":"formatted","text":" 方法返回 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":" 时，我们切换可读流的模式为暂停模式，当可写流触发了 "},{"type":"formatted","text":"drain","code":true},{"type":"formatted","text":" 事件时，我们便将可读流的状态切换为流动模式"}]},{"type":"code-block","code":"const fs = require('fs');\n\nfunction copy(source, target) {\n    const rs = fs.createReadStream(source);\n    const ws = fs.createWriteStream(target);\n\n    rs.on('data', data => {\n        if (!ws.write(data)) {\n            rs.pause();\n        }\n    });\n\n    rs.on('end', () => {\n        ws.end();\n    });\n\n    ws.on('drain', () => {\n        rs.resume();\n    })\n}","language":"js","uuid":"b2a42b0b-09f9-47b2-8825-1ddf1e340f6a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"那是不是每次我们使用流都需要写这么多的代码，当然不是。官方为可读流提供了一个 "},{"type":"formatted","text":"pipe(ws)","code":true},{"type":"formatted","text":" 方法，"},{"type":"formatted","text":"pipe","code":true},{"type":"formatted","text":" 方法接收一个可写流，它的作用就是将可读流中数据写入到可写流中去，并且它内部有做速度差异的处理。所以上面的写法可以改为下面的版本"}]},{"type":"code-block","code":"const fs = require('fs');\n\nfunction copy(source, target) {\n    const rs = fs.createReadStream(source);\n    const ws = fs.createWriteStream(target);\n\n    rs.pipe(ws);\n}","language":"js","uuid":"f35cdb4f-ac13-4b28-b119-ec155b89a330","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们调用 "},{"type":"formatted","text":"pipe","code":true},{"type":"formatted","text":" 方法时，会触发可写流的 "},{"type":"formatted","text":"pipe","code":true},{"type":"formatted","text":" 事件。"},{"type":"formatted","text":"pipe","code":true},{"type":"formatted","text":" 的实现参考如下"}]},{"type":"code-block","code":"Readable.prototype.pipe = function(ws) {\n    this.on('data', data => {\n        if (!ws.write(data)) {\n            this.pause();\n        }\n    });\n\n    ws.on('drain', () => {\n        this.resume();\n    });\n\n    // 触发 pipe 事件\n    ws.emit('pipe', this);\n\n    // 返回可写流，以支持链式调用\n    return ws;\n}","language":"js","uuid":"2f13cc8e-33ce-4957-aaec-303184dbbf9a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里给出官网画的一个有关 "},{"type":"formatted","text":"pipe","code":true},{"type":"formatted","text":" 的流程图"}]},{"type":"code-block","code":"                                                     +===================+\n                         x-->  Piping functions   +-->   src.pipe(dest)  |\n                         x     are set up during     |===================|\n                         x     the .pipe method.     |  Event callbacks  |\n  +===============+      x                           |-------------------|\n  |   Your Data   |      x     They exist outside    | .on('close', cb)  |\n  +=======+=======+      x     the data flow, but    | .on('data', cb)   |\n          |              x     importantly attach    | .on('drain', cb)  |\n          |              x     events, and their     | .on('unpipe', cb) |\n+---------v---------+    x     respective callbacks. | .on('error', cb)  |\n|  Readable Stream  +----+                           | .on('finish', cb) |\n+-^-------^-------^-+    |                           | .on('end', cb)    |\n  ^       |       ^      |                           +-------------------+\n  |       |       |      |\n  |       ^       |      |\n  ^       ^       ^      |    +-------------------+         +=================+\n  ^       |       ^      +---->  Writable Stream  +--------->  .write(chunk)  |\n  |       |       |           +-------------------+         +=======+=========+\n  |       |       |                                                 |\n  |       ^       |                              +------------------v---------+\n  ^       |       +-> if (!chunk)                |    Is this chunk too big?  |\n  ^       |       |     emit .end();             |    Is the queue busy?      |\n  |       |       +-> else                       +-------+----------------+---+\n  |       ^       |     emit .write();                   |                |\n  |       ^       ^                                   +--v---+        +---v---+\n  |       |       ^-----------------------------------<  No  |        |  Yes  |\n  ^       |                                           +------+        +---v---+\n  ^       |                                                               |\n  |       ^               emit .pause();          +=================+     |\n  |       ^---------------^-----------------------+  return false;  <-----+---+\n  |                                               +=================+         |\n  |                                                                           |\n  ^            when queue is empty     +============+                         |\n  ^------------^-----------------------<  Buffering |                         |\n               |                       |============|                         |\n               +> emit .drain();       |  ^Buffer^  |                         |\n               +> emit .resume();      +------------+                         |\n                                       |  ^Buffer^  |                         |\n                                       +------------+   add chunk to queue    |\n                                       |            <---^---------------------<\n                                       +============+","language":"text","uuid":"2b30d3a4-adb9-4981-a512-d7e5a0d5cb91","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现流"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在本节中我们来实现具体的流，通过实现流可以进一步加深对 Stream 内部工作细节的理解。"}]},{"type":"header","children":[{"type":"formatted","text":"实现可读流"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们都是通过 "},{"type":"formatted","text":"fs.createReadableStream()","code":true},{"type":"formatted","text":" 方法来得到一个可读流的，在这里我们自己实现一个可读流。实现可读流只需要继承 "},{"type":"formatted","text":"Readable","code":true},{"type":"formatted","text":" 类，然后实现 "},{"type":"formatted","text":"_read()","code":true},{"type":"formatted","text":" 方法即可"}]},{"type":"code-block","code":"const { Readable } = require('stream');\n\nclass IeteratorReadableStream extends Readable {\n    constructor(iterator) {\n        super();\n        this.iterator = iterator;\n    }\n\n    _read() {\n        let data = this.iterator.next();\n        // console.log(data);\n        if(data.done) {\n            this.push(null);\n        } else {\n            // 必须 push 字符串或者 Buffer\n            this.push(data.value+'');\n        }\n    }\n}\n\nmodule.exports = IeteratorReadableStream;","language":"js","uuid":"201cd119-740c-40e7-bac8-10ae51220599","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述我们实现了一个可读流，可读流接收一个迭代器作为参数，这个迭代器作为这个可读流的数据源。可读流会自动的调用 "},{"type":"formatted","text":"_read","code":true},{"type":"formatted","text":" 获取数据，在 "},{"type":"formatted","text":"_read","code":true},{"type":"formatted","text":" 方法中我们从迭代器中获取数据，并且调用了 "},{"type":"formatted","text":"push","code":true},{"type":"formatted","text":" 方法，该方法的作用就是将数据放入到缓存区中，只能向其中 "},{"type":"formatted","text":"push","code":true},{"type":"formatted","text":" 字符串或者 "},{"type":"formatted","text":"Buffer","code":true},{"type":"formatted","text":"，当我们向其中 "},{"type":"formatted","text":"push null","code":true},{"type":"formatted","text":" 时就表示数据已经被全部读取完毕。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以可读流的执行逻辑为，每次调用 "},{"type":"formatted","text":"_read","code":true},{"type":"formatted","text":" 方法从数据源读取数据，并将数据存入缓存区，然后触发 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件，将缓存区中的数据作为参数传递给 "},{"type":"formatted","text":"data","code":true},{"type":"formatted","text":" 事件绑定的回调函数，循环上述过程直到向缓存区 "},{"type":"formatted","text":"push null","code":true},{"type":"formatted","text":" 时，就表示数据源中的数据已经被读取完毕，此时会触发 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":" 事件。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们创建一个迭代器作为数据源传入"}]},{"type":"code-block","code":"const IeteratorReadableStream = require('./IteratorReadableStream');\n\nfunction *getData() {\n    for(let i = 0; i < 5; i++) {\n        yield i;\n    }\n}\n\nlet rs = new IeteratorReadableStream(getData());\n\nrs.on('data', data => {\n    console.log(data.toString());\n});\n\nrs.on('end', () => {\n    console.log(\"迭代结束\");\n});","language":"js","uuid":"0324c3cb-f6ad-48eb-a4a9-576430df4147","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"0\n1\n2\n3\n4\n迭代结束","language":"js","uuid":"a48727ba-e21a-4be5-a832-2212dcb812a2","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现可写流"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"实现可写流的过程同实现可读流的过程类似，首先需要继承 "},{"type":"formatted","text":"Writable","code":true},{"type":"formatted","text":" 类，接着实现 "},{"type":"formatted","text":"_write","code":true},{"type":"formatted","text":" 方法即可"}]},{"type":"code-block","code":"const fs = require('fs');\nconst { Writable } = require('stream');\n\nclass FileWritableStream extends Writable {\n    constructor(filepath) {\n        super();\n        this.filepath = filepath;\n    }\n\n    _write(chunk, encoding, callback) {\n        fs.appendFile(this.filepath, chunk, {\n            encoding\n        }, callback)\n    }\n}","language":"js","uuid":"aa56c00b-7c87-472b-8ce8-c395677d68bc","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们实现了一个可写流，这个可写流接收一个文件路径作为参数，它的作用就是向这个文件中追加数据，每次当我们调用可写流的 "},{"type":"formatted","text":"write()","code":true},{"type":"formatted","text":" 方法时，它会向缓冲区写入数据，当达到阈值时，便会调用 "},{"type":"formatted","text":"_write()","code":true},{"type":"formatted","text":" 方法将数据新增到文件中。"}]},{"type":"code-block","code":"process.stdin.pipe(new FileWritableStream('c.txt'));","language":"js","uuid":"7762961b-7ae0-4b38-9cba-d4353dd95f17","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面这行代码的作用就是将从标准输入的字符输出到 "},{"type":"formatted","text":"c.txt","code":true},{"type":"formatted","text":" 中。"}]},{"type":"header","children":[{"type":"formatted","text":"实现双工流"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"Duplex Stream 既可以作为可读流，也可以作为可写流，并且它的输入与输出之间可以没有关系。Duplex Stream 继承了 Readable，并且拥有 Writable 的所有，我们只要分别实现 "},{"type":"formatted","text":"_read()","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"_write()","code":true},{"type":"formatted","text":" 方法即可"}]},{"type":"code-block","code":"const { Duplex } = require('stream');\n\nclass CustomDuplexStream extends Duplex {\n    constructor() {\n        super();\n        this.currentCharCode = 65;\n    }\n\n    _read() {\n        if(this.currentCharCode <= 90) {\n            this.push(String.fromCharCode(this.currentCharCode++))\n        } else {\n            this.push(null);\n        }\n    }\n\n    _write(chunk, encoding, callback) {\n        console.log(chunk.toString());\n        callback();\n    }\n}","language":"js","uuid":"d71c4c93-e528-4117-9bae-071546fe9748","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面双工流的可读流部分就是将大写的 26 个字母添加进了缓存区，而可写流部分就是直接将数据输出到控制台。可见双工流可读流与可写流之间并没有任何的关系"}]},{"type":"code-block","code":"const dp = new CustomDuplexStream();\n\ndp.write(\"1\");\ndp.write(\"2\");\ndp.end();\n\ndp.pipe(process.stdout);","language":"js","uuid":"efb4cb75-2d77-4ad2-8f99-efcef9d62096","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"1\n2\nABCDEFGHIJKLMNOPQRSTUVWXYZ","language":"js","uuid":"f098a99e-2a47-4672-8956-9b278c72fa8f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现转换流"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"Tranform Stream 是 Duplex 的特例，它也是一个双工流，不过它的输入和输出之间有关联，它的内部通过 "},{"type":"formatted","text":"_transform()","code":true},{"type":"formatted","text":" 方法将可写流接收到的数据经过转换后传入到可读流中，所以我们要实现转换流，只需要实现 "},{"type":"formatted","text":"_transform()","code":true},{"type":"formatted","text":" 方法即可"}]},{"type":"code-block","code":"const { Transform } = require('stream');\n\nclass UpperTransformStream extends Transform {\n    _transform(chunk, encoding, callback) {\n        this.push(chunk.toString().toUpperCase());\n        callback();\n    }\n}","language":"js","uuid":"dced8a3e-e4f2-49f8-a246-64b14d594ff5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们实现了一个转换流，它可以将输入的小写字符转化为大写字符然后输出"}]},{"type":"code-block","code":"const ts = new UpperTransformStream();\nconst rs = fs.createReadStream('a.txt');\nrs.pipe(ts).pipe(process.stdout);","language":"js","uuid":"0b063252-cece-4326-a97f-8bc3a313c9f2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面程序会读取 a.txt 中的所有字符，将字符转换为大写然后输出在控制台。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"转换流在实际应用中还是比较多的，这里介绍一个 Node.js 内置的转换流 "},{"type":"formatted","text":"zlib","code":true},{"type":"formatted","text":"，它的作用对文件进行解压缩，将文件压缩为压缩文件，或者将压缩文件解压为正常文件，这不就是一个典型的转换流嘛！"}]},{"type":"code-block","code":"const zlib = require('zlib');\nconst fs = require('fs');\n\nconst args = process.argv.slice(2);\n\nconst source = fs.createReadStream(args[0]);\nconst target = fs.createWriteStream(args[1]);\nconst gzip = zlib.createGzip();\n\nsource.pipe(gzip).pipe(target);","language":"js","uuid":"b827fd74-2c4f-443f-a1c5-918958ef066a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"文件大小从 201KB 压缩到了 51KB。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"同样的我们也可以通过 "},{"type":"formatted","text":"zlib.createGunzip()","code":true},{"type":"formatted","text":" 来创建一个解压缩的转换流，具体细节同压缩文件相同，不做介绍。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"本篇文章到此结束，想必到这里已经对 Stream 的使用已经有所了解了，但是本篇文章并没有列举所有有关 Stream 的 API，如果想更加详细的了解 Stream 的 API，那么接下去就可以阅读"},{"type":"link","url":"http://nodejs.cn/api/stream.html","openEdit":false,"children":[{"type":"formatted","text":"官方文档"}]},{"type":"formatted","text":"了。"}]},{"type":"header","children":[{"type":"formatted","text":"参考文献"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://jscomplete.com/learn/node-beyond-basics/node-streams","openEdit":false,"children":[{"type":"formatted","text":"Node's Stream"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://nodejs.org/zh-cn/docs/guides/backpressuring-in-streams/","openEdit":false,"children":[{"type":"formatted","text":"数据流中的积压问题"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://mp.weixin.qq.com/s/D54-txCSPjKdK-QewPG9Kw","openEdit":false,"children":[{"type":"formatted","text":"深入理解 Node.js Stream 内部机制"}]},{"text":"","type":"formatted"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://tech.meituan.com/2016/07/08/stream-basics.html","openEdit":false,"children":[{"type":"formatted","text":"Node.js Stream - 基础篇"}]},{"text":"","type":"formatted"}]}]}]}],"tags":["Node","Stream"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-l36282_06c795e1-2a47-482b-8905-c4ba54174610.jpg","createTime":1615004040000,"updateTime":1743303640462},"meta":{"type":"article","publishTime":1764820859514}};
