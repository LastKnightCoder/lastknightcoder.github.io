    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":25,"title":"Tauri 应用使用 Gtihub Actions 构建踩坑","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"今天为我的编辑器加上了 Github Actions，发布后自动构建 Windows、Mac 和 Linux 应用，折腾了一个小时，有两个坑，特此记录："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"pnpm install","code":true},{"type":"formatted","text":" 需要加上 "},{"type":"formatted","text":"--no-frozen-lockfile","code":true},{"type":"formatted","text":" 选项，否则报错"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_c8130da3-013c-4af8-935d-17a843a5cb76.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"初步判断时本地的 pnpm 版本和 Github Actions 设置的不一样，所以不能使用 lock 文件"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"打包应用时要设置环境变量 "},{"type":"formatted","text":"NODE_OPTIONS: \"--max_old_space_size=4096\"","code":true},{"text":"，否则内存不够","type":"formatted"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_e2a7003d-2eae-4005-8712-363578f4d6d1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"完整的配置文件"}]},{"type":"code-block","code":"on:\n  push:\n    tags:\n      - v*\n\njobs:\n  create-release:\n    permissions:\n      contents: write\n    runs-on: ubuntu-20.04\n    outputs:\n      release_id: ${{ steps.create-release.outputs.result }}\n\n    steps:\n      - uses: actions/checkout@v3\n      - name: setup node\n        uses: actions/setup-node@v3\n        with:\n          node-version: 16\n      - name: get version\n        run: echo \"PACKAGE_VERSION=$(node -p \"require('./package.json').version\")\" >> $GITHUB_ENV\n      - name: create release\n        id: create-release\n        uses: actions/github-script@v6\n        with:\n          script: |\n            const { data } = await github.rest.repos.createRelease({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              tag_name: `app-v${process.env.PACKAGE_VERSION}`,\n              name: `Card Editor v${process.env.PACKAGE_VERSION}`,\n              body: '可见即所得编辑器',\n              draft: true,\n              prerelease: false\n            })\n            return data.id\n\n  build-tauri:\n    needs: create-release\n    permissions:\n      contents: write\n    strategy:\n      fail-fast: false\n      matrix:\n        platform: [macos-latest, ubuntu-20.04, windows-latest]\n\n    runs-on: ${{ matrix.platform }}\n    steps:\n      - uses: actions/checkout@v3\n      - uses: pnpm/action-setup@v2\n        name: Install pnpm\n        with:\n          version: 8\n          run_install: false\n      - name: setup node\n        uses: actions/setup-node@v3\n        with:\n          node-version: 16\n          cache: 'pnpm'\n      - name: install Rust stable\n        uses: dtolnay/rust-toolchain@stable\n      - name: install dependencies (ubuntu only)\n        if: matrix.platform == 'ubuntu-20.04'\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf\n      - name: install frontend dependencies\n        run: pnpm install --no-frozen-lockfile\n      - uses: tauri-apps/tauri-action@v0\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          NODE_OPTIONS: \"--max_old_space_size=4096\"\n        with:\n          releaseId: ${{ needs.create-release.outputs.release_id }}\n\n  publish-release:\n    permissions:\n      contents: write\n    runs-on: ubuntu-20.04\n    needs: [create-release, build-tauri]\n\n    steps:\n      - name: publish release\n        id: publish-release\n        uses: actions/github-script@v6\n        env:\n          release_id: ${{ needs.create-release.outputs.release_id }}\n        with:\n          script: |\n            github.rest.repos.updateRelease({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              release_id: process.env.release_id,\n              draft: false,\n              prerelease: false\n            })","language":"yaml","uuid":"31b18f1c-e4c7-45e0-a078-daae80313790","children":[{"type":"formatted","text":""}]}],"tags":["Github Actions","tauri","踩坑"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-mdmz51_dfe997c7-7b70-43a0-a61d-e31bbde24071.jpg","createTime":1697804118496,"updateTime":1743303640467},"meta":{"type":"article","publishTime":1764821905621}};
