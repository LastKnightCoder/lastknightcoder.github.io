/14/829.html","title":"0.41.0"},"document-item:831":{"contentType":"document-item","refId":831,"href":"/docs/document/14/831.html","title":"0.42.0"},"document-item:833":{"contentType":"document-item","refId":833,"href":"/docs/document/14/833.html","title":"0.43.0"},"document-item:835":{"contentType":"document-item","refId":835,"href":"/docs/document/14/835.html","title":"0.44.0"},"document-item:836":{"contentType":"document-item","refId":836,"href":"/docs/document/14/836.html","title":"0.44.1"},"document-item:847":{"contentType":"document-item","refId":847,"href":"/docs/document/14/847.html","title":"0.44.2"},"document-item:854":{"contentType":"document-item","refId":854,"href":"/docs/document/14/854.html","title":"0.45.0"},"document-item:855":{"contentType":"document-item","refId":855,"href":"/docs/document/14/855.html","title":"0.45.1"},"document-item:856":{"contentType":"document-item","refId":856,"href":"/docs/document/14/856.html","title":"0.45.2"},"document-item:858":{"contentType":"document-item","refId":858,"href":"/docs/document/14/858.html","title":"0.46.0"},"document-item:859":{"contentType":"document-item","refId":859,"href":"/docs/document/14/859.html","title":"0.46.1"},"document-item:860":{"contentType":"document-item","refId":860,"href":"/docs/document/14/860.html","title":"0.46.2"},"document-item:862":{"contentType":"document-item","refId":862,"href":"/docs/document/14/862.html","title":"0.47.0"},"document-item:863":{"contentType":"document-item","refId":863,"href":"/docs/document/14/863.html","title":"0.47.1"},"document-item:864":{"contentType":"document-item","refId":864,"href":"/docs/document/14/864.html","title":"0.47.2"},"document-item:866":{"contentType":"document-item","refId":866,"href":"/docs/document/14/866.html","title":"0.48.0"},"document-item:867":{"contentType":"document-item","refId":867,"href":"/docs/document/14/867.html","title":"0.48.1"},"document-item:868":{"contentType":"document-item","refId":868,"href":"/docs/document/14/868.html","title":"0.48.2"},"document-item:870":{"contentType":"document-item","refId":870,"href":"/docs/document/14/870.html","title":"0.49.0"},"document-item:871":{"contentType":"document-item","refId":871,"href":"/docs/document/14/871.html","title":"0.49.1"},"document-item:873":{"contentType":"document-item","refId":873,"href":"/docs/document/14/873.html","title":"0.50.0"},"document-item:876":{"contentType":"document-item","refId":876,"href":"/docs/document/14/876.html","title":"0.51.0"}},"content":{"id":87,"title":"CSS Scroll-driven Animation","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"在过去，我们要制作滚动动画时，一般会使用 JavaScript 监听 "},{"type":"formatted","text":"scroll","code":true},{"type":"formatted","text":" 事件，读取 "},{"type":"formatted","text":"scrollTop","code":true},{"type":"formatted","text":" 等位置数据来计算动画进度，然后修改元素的样式。对于元素入场和离场这类效果，也可以通过 "},{"type":"formatted","text":"IntersectionObserver","code":true},{"type":"formatted","text":" 获取元素与视口的交叉状态。在更复杂的场景中，我们通常会使用专业动画库，例如 GSAP 的 ScrollTrigger 插件。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"这类方案真正复杂的地方，不只是进度计算本身。为了让滚动位置与动画状态始终保持同步，我们还要处理事件监听与清理、组件挂载与卸载、页面尺寸变化后的重新计算，以及动态内容引起的布局偏移。如果动画发生在嵌套滚动区域中，还需要准确找到真正的滚动容器，并在容器变化时重新建立监听。当多个元素需要共享同一滚动进度、按照不同阶段协同变化时，开发者还要维护公共进度和各自的映射区间，代码很容易分散在状态管理、生命周期和动画逻辑之中。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"CSS Scroll-driven Animations 将这些工作转化为声明式的时间轴配置。我们可以直接把滚动容器的滚动进度，或某个元素相对于其滚动视口的可见进度，作为 CSS 动画的时间轴，无需持续在 JavaScript 中读取位置并同步样式。多个元素也可以引用同一条命名时间轴，再通过各自的关键帧和动画区间形成协同效果。对于 "},{"type":"formatted","text":"transform","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"opacity","code":true},{"type":"formatted","text":" 等适合合成的属性，浏览器通常还能更高效地更新动画，从而降低主线程繁忙时出现卡顿的概率。"}],"disableDrag":false},{"type":"header","level":2,"children":[{"type":"formatted","text":"animation-timeline"}]},{"type":"paragraph","children":[{"type":"formatted","text":"默认情况下，CSS 动画由文档时间轴驱动，动画进度会随着时间推移而变化。借助 "},{"type":"formatted","text":"animation-timeline","code":true},{"type":"formatted","text":"，可以将动画关联到滚动进度时间轴或视图进度时间轴。该属性的常见取值如下："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"animation-timeline: scroll();\nanimation-timeline: view();\nanimation-timeline: --custom-timeline;\nanimation-timeline: auto;\nanimation-timeline: none;","uuid":"cc9516c1-bd67-4c0b-850e-3e1db3a376ae","children":[{"type":"formatted","text":""}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"none","code":true},{"type":"formatted","text":"：动画不关联任何时间轴，因此不会运行。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"auto","code":true},{"type":"formatted","text":"：使用默认的文档时间轴（DocumentTimeline），其当前时间会随着时间推移而递增。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"scroll()","code":true},{"type":"formatted","text":"：定义一个与滚动容器在指定轴上的滚动进度相关联的时间轴。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"view()","code":true},{"type":"formatted","text":"：定义一个与特定元素相对于其滚动视口的位置和可见进度相关联的时间轴。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003cdashed-ident\u003e","code":true},{"type":"formatted","text":"：引用通过 "},{"type":"formatted","text":"scroll-timeline","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"view-timeline","code":true},{"type":"formatted","text":" 或其长属性定义的命名时间轴。名称需要以 "},{"type":"formatted","text":"--","code":true},{"type":"formatted","text":" 开头，适合让多个元素共享同一条时间轴。"}],"disableDrag":false}]}]},{"type":"callout","title":"警告","calloutType":"warning","children":[{"type":"paragraph","children":[{"type":"formatted","text":"animation","code":true},{"type":"formatted","text":" 简写会将 "},{"type":"formatted","text":"animation-timeline","code":true},{"type":"formatted","text":" 重置为 "},{"type":"formatted","text":"auto","code":true},{"type":"formatted","text":"，因此应在 "},{"type":"formatted","text":"animation","code":true},{"type":"formatted","text":" 简写之后声明 "},{"type":"formatted","text":"animation-timeline","code":true},{"type":"formatted","text":"，否则先前设置的时间轴不会生效。"}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".box {\n  animation: fade-in linear both;\n  animation-timeline: view();\n}","uuid":"328f34be-784c-441c-ba58-eeb142d4add7","children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"从这些取值可以看出，滚动驱动时间轴主要分为两类。一类是由 "},{"type":"formatted","text":"scroll()","code":true},{"type":"formatted","text":" 定义的滚动进度时间轴，另一类是由 "},{"type":"formatted","text":"view()","code":true},{"type":"formatted","text":" 定义的视图进度时间轴，后者反映元素相对于其滚动视口的可见进度。"}],"disableDrag":false},{"type":"header","level":2,"children":[{"type":"formatted","text":"scroll()"}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"基础语法"}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"scroll()","code":true},{"type":"formatted","text":" 可以定义匿名的滚动进度时间轴，其语法如下："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"\u003cscroll()\u003e = \n  scroll( [ \u003cscroller\u003e || \u003caxis\u003e ]? )  \n\n\u003cscroller\u003e = \n  root     |\n  nearest  |\n  self     \n\n\u003caxis\u003e = \n  block   |\n  inline  |\n  x       |\n  y","uuid":"2a937ec0-65e7-408c-9fb9-bbe78b0966c7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"scroll()","code":true},{"type":"formatted","text":" 接收两个可选参数，分别用于指定滚动容器和滚动轴："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003cscroller\u003e","code":true},{"type":"formatted","text":"：用于指定关联的滚动容器。"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"root","code":true},{"type":"formatted","text":"：根滚动容器，也就是整个页面。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"nearest","code":true},{"type":"formatted","text":"：最近的祖先滚动容器，也是默认值。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"self","code":true},{"type":"formatted","text":"：元素自身作为滚动容器。"}],"disableDrag":false}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003caxis\u003e","code":true},{"type":"formatted","text":"：用于指定时间轴所使用的滚动轴。"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"block","code":true},{"type":"formatted","text":"：块轴。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"inline","code":true},{"type":"formatted","text":"：行内轴。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"x","code":true},{"type":"formatted","text":"：水平方向的物理轴。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"y","code":true},{"type":"formatted","text":"：垂直方向的物理轴。"}],"disableDrag":false}]}]}]}]},{"type":"highlight-block","color":"yellow","children":[{"type":"paragraph","children":[{"type":"formatted","text":"block","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"inline","code":true},{"type":"formatted","text":" 表示逻辑轴，其实际方向由 "},{"type":"formatted","text":"writing-mode","code":true},{"type":"formatted","text":" 决定。在常见的横排书写模式中，块轴通常是垂直方向，行内轴通常是水平方向。"}],"disableDrag":false}]},{"type":"header","level":3,"children":[{"type":"formatted","text":"示例"}]},{"type":"header","level":4,"children":[{"type":"formatted","text":"阅读进度条的示例"}]},{"type":"paragraph","children":[{"type":"formatted","text":"随着页面滚动，顶部的进度条会从左到右填充，直观地展示当前的阅读进度。"}],"disableDrag":false},{"type":"custom-block","content":"const Component = () =\u003e {\n  return (\n    \u003cdiv className=\"relative h-72 overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-700\"\u003e\n      \u003cdiv className=\"css-reading-scroller absolute inset-0 overflow-y-auto\"\u003e\n        \u003cdiv className=\"sticky top-0 z-10 h-1 w-full bg-zinc-200/60 dark:bg-zinc-700/60\"\u003e\n          \u003cdiv className=\"css-reading-progress h-full origin-left bg-gradient-to-r from-blue-500 to-cyan-400\" /\u003e\n        \u003c/div\u003e\n        \u003cdiv className=\"space-y-4 p-6\"\u003e\n          {Array.from({ length: 20 }, (_, i) =\u003e (\n            \u003cp key={i} className=\"text-sm leading-relaxed text-zinc-600 dark:text-zinc-300\"\u003e\n              这是第 {i + 1} 段内容。向下滚动可以看到顶部进度条随之变化，进度条由 CSS 滚动进度时间轴直接驱动。\n            \u003c/p\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cstyle\u003e{`\n        .css-reading-scroller {\n          scroll-timeline: --reading-scroll block;\n          scrollbar-width: thin;\n        }\n\n        .css-reading-progress {\n          transform: scaleX(0);\n          animation: css-reading-progress-fill linear both;\n          animation-timeline: --reading-scroll;\n        }\n\n        @keyframes css-reading-progress-fill {\n          to { transform: scaleX(1); }\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对应的纯 CSS 实现非常简洁，只需要声明关键帧和时间轴即可："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".reading-progress {\n  position: fixed;\n  top: 0;\n  left: 0;\n  z-index: 9999;\n  height: 4px;\n  width: 100%;\n  transform-origin: left;\n  transform: scaleX(0);\n\n  animation: progress linear both;\n  animation-timeline: scroll(root block);\n}\n\n@keyframes progress {\n  to {\n    transform: scaleX(1);\n  }\n}","uuid":"da9120b9-8a87-48ea-bed1-6aecd8bbb1c7","children":[{"type":"formatted","text":""}]},{"type":"header","level":4,"children":[{"type":"formatted","text":"视差滚动（Parallax）"}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过让背景图片与内容以不同的速率移动来营造层次感。下面的示例中，随着容器滚动，背景图会以较慢的速度跟随移动，产生视差效果："}],"disableDrag":false},{"type":"custom-block","content":"const { useRef, useEffect } = React;\n\nconst Component = () =\u003e {\n  const scrollerRef = useRef(null);\n  const thumbRef = useRef(null);\n\n  useEffect(() =\u003e {\n    const el = scrollerRef.current;\n    const thumb = thumbRef.current;\n    if (!el || !thumb) return;\n    const onScroll = () =\u003e {\n      const p = el.scrollTop / (el.scrollHeight - el.clientHeight);\n      const trackH = el.clientHeight - 16;\n      const thumbH = thumb.offsetHeight;\n      thumb.style.transform = `translateY(${p * (trackH - thumbH)}px)`;\n    };\n    el.addEventListener('scroll', onScroll);\n    return () =\u003e el.removeEventListener('scroll', onScroll);\n  }, []);\n\n  return (\n    \u003cdiv className=\"parallax-container relative h-72 rounded-xl border border-zinc-200 dark:border-zinc-700 overflow-hidden\"\u003e\n      \u003cdiv ref={scrollerRef} className=\"parallax-scroller absolute inset-0 overflow-y-auto rounded-xl\"\u003e\n        \u003cdiv className=\"sticky top-0 left-0 h-72 w-full overflow-hidden pointer-events-none -mb-72 z-0\"\u003e\n          \u003cimg\n            src=\"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/wallhaven-nr1vg1_19bf2bc3-5441-405b-bc81-480c62499c69.webp\"\n            alt=\"parallax background\"\n            className=\"parallax-bg w-full object-cover absolute inset-0\"\n          /\u003e\n        \u003c/div\u003e\n        \u003cdiv className=\"relative z-10\" style={{ paddingTop: \"40%\", paddingBottom: \"40%\" }}\u003e\n          \u003cdiv className=\"flex flex-col items-center gap-16 px-6\"\u003e\n            \u003cdiv className=\"text-center\"\u003e\n              \u003ch2 className=\"text-3xl font-bold text-white drop-shadow-lg m-0\"\u003eParallax Scrolling\u003c/h2\u003e\n              \u003cp className=\"text-white/80 text-sm mt-2 drop-shadow m-0\"\u003e向下滚动，感受背景与文字的速度差\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cp className=\"text-white/90 text-center text-sm leading-relaxed max-w-md drop-shadow m-0\"\u003e\n              背景图片以较慢的速度移动，而前景文字以正常速度滚过，两者之间的速度差营造出空间的纵深感和层次感。\n            \u003c/p\u003e\n            \u003cp className=\"text-white/90 text-center text-sm leading-relaxed max-w-md drop-shadow m-0\"\u003e\n              这种效果在 Hero 区域、落地页和产品展示页中非常常见，能够有效吸引用户注意力并提升视觉体验。\n            \u003c/p\u003e\n            \u003cp className=\"text-white/70 text-center text-xs drop-shadow m-0\"\u003e\n              ↓ 继续滚动 ↓\n            \u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv className=\"absolute top-2 bottom-2 right-2 w-1.5 rounded-full z-20 pointer-events-none\"\u003e\n        \u003cdiv ref={thumbRef} className=\"bg-white/50 rounded-full w-full h-[40px]\" style={{ transform: \"translateY(0)\" }} /\u003e\n      \u003c/div\u003e\n      \u003cstyle\u003e{`\n        @keyframes parallax-move {\n          from { transform: translateY(0); }\n          to { transform: translateY(-33%); }\n        }\n        .parallax-scroller {\n          scroll-timeline: --parallax block;\n          scrollbar-width: none;\n        }\n        .parallax-scroller::-webkit-scrollbar {\n          display: none;\n        }\n        .parallax-bg {\n          height: 150%;\n          animation: parallax-move linear both;\n          animation-timeline: --parallax;\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对应的纯 C 下："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"┌──────────────────┐\n│                  │\n│                  │\n│                  │\n│                  │\n└──────────────────┘","uuid":"bc872bb4-2eff-4e54-a7be-a32428aa2ef9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"设置 "},{"type":"formatted","text":"view(20%)","code":true},{"type":"formatted","text":" 后，滚动方向上、下两侧的视口范围都会缩小 20%："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"┌──────────────────┐\n│------------------│ 20%\n│                  │\n│  有效可见范围      │\n│                  │\n│------------------│ 20%\n└──────────────────┘","uuid":"49145164-3d5b-49fa-85fc-4387ffbb99e8","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"设置一个值时，该值对两个方向生效。设置两个值时，第一个值表示 "},{"type":"formatted","text":"start-inset","code":true},{"type":"formatted","text":"，第二个值表示 "},{"type":"formatted","text":"end-inset","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"该值也可以是负数，负值表示向外扩展："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"view(block -20%)","uuid":"94b411b1-8afc-42d7-beb1-19e0afbffae6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"该参数还可以取值 "},{"type":"formatted","text":"auto","code":true},{"type":"formatted","text":"。取值为 "},{"type":"formatted","text":"auto","code":true},{"type":"formatted","text":" 时，它会采用滚动容器的 "},{"type":"content-link","refId":83,"contentId":6011,"contentType":"article","contentTitle":"CSS Scroll Snap","children":[{"type":"formatted","text":"scroll-padding"}]},{"type":"formatted","text":"。"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"view()","code":true},{"type":"formatted","text":" 不能指定滚动容器，它会自动选择元素最近的祖先滚动容器，也就是 "},{"type":"formatted","text":"nearest","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"header","level":3,"children":[{"type":"formatted","text":"animation-range"}]},{"type":"paragraph","children":[{"type":"formatted","text":"元素进入视口时，可能处于刚开始进入、完全进入或开始离开等不同阶段。为了明确动画从哪里开始、在哪里结束，需要进一步控制时间轴映射的范围。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"默认情况下，创建的时间轴在元素刚进入视口时为 0%，在元素完全离开视口时为 100%。我们可以通过 "},{"type":"formatted","text":"animation-range-start","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"animation-range-end","code":true},{"type":"formatted","text":" 截取时间区间，并将其映射到 "},{"type":"formatted","text":"@keyframes","code":true},{"type":"formatted","text":" 的起始和终止位置。二者可以简写为 "},{"type":"formatted","text":"animation-range","code":true},{"type":"formatted","text":"，语法如下："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"animation-range = \n  [ \u003c'animation-range-start'\u003e \u003c'animation-range-end'\u003e? ]#  \n\n\u003canimation-range-start\u003e = \n  [ normal | \u003clength-percentage\u003e | \u003ctimeline-range-name\u003e \u003clength-percentage\u003e? ]#  \n\n\u003canimation-range-end\u003e = \n  [ normal | \u003clength-percentage\u003e | \u003ctimeline-range-name\u003e \u003clength-percentage\u003e? ]#  \n\n\u003clength-percentage\u003e = \n  \u003clength\u003e      |\n  \u003cpercentage\u003e  ","uuid":"f10407a4-4b69-4a59-987e-242d16dec601","children":[{"type":"formatted","text":""}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"normal","code":true},{"type":"formatted","text":"：默认值，不裁剪时间范围。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\u003clength-percentage\u003e","code":true},{"type":"formatted","text":"：使用长度或百分比定义动画区间。"}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"animation-range: 20% 80%;","uuid":"71bf654d-7aec-4379-81f6-7 inear both;\n          animation-timeline: view(block);\n          animation-range: entry 0% cover 35%;\n        }\n\n        @keyframes css-reveal-up {\n          to {\n            opacity: 1;\n            transform: translateY(0);\n          }\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"header","level":4,"children":[{"type":"formatted","text":"图片滚入放大效果"}]},{"type":"paragraph","children":[{"type":"formatted","text":"随着图片进入视口，图片会从缩小、半透明状态平滑过渡到正常大小和完全可见。"}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".photo {\n  scale: 0.85;\n  opacity: 0.5;\n\n  animation: photo-zoom linear both;\n  animation-timeline: view();\n  animation-range: entry 10% cover 50%;\n}\n\n@keyframes photo-zoom {\n  to {\n    scale: 1;\n    opacity: 1;\n  }\n}","uuid":"08d03705-6366-4084-9fe2-c253e321fefa","children":[{"type":"formatted","text":""}]},{"type":"custom-block","content":"const Component = () =\u003e {\n  return (\n    \u003cdiv className=\"space-y-3\"\u003e\n      \u003cdiv className=\"flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400\"\u003e\n        \u003cspan\u003eanimation-range: entry 10% cover 50%\u003c/span\u003e\n        \u003cspan\u003e在下方区域滚动查看效果\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv className=\"css-photo-scroller h-[420px] overflow-y-auto rounded-xl border border-zinc-200 dark:border-zinc-700\"\u003e\n        \u003cdiv className=\"flex h-64 flex-col items-center justify-center px-5 text-center\"\u003e\n          \u003cdiv className=\"mb-3 inline-flex items-center gap-2 rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-600 dark:bg-blue-900/30 dark:text-blue-400\"\u003e\n            产品展示\n          \u003c/div\u003e\n          \u003ch2 className=\"m-0 text-xl font-bold text-zinc-900 dark:text-zinc-100\"\u003e探索无限可能\u003c/h2\u003e\n          \u003cp className=\"m-0 mt-2 text-sm text-zinc-500 dark:text-zinc-400\"\u003e向 om {\n          to {\n            scale: 1;\n            opacity: 1;\n          }\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"header","level":4,"children":[{"type":"formatted","text":"横向轮播"}]},{"type":"paragraph","children":[{"type":"formatted","text":"随着卡片进入视口，它们会自动放大并高亮，营造出一种聚焦效果。"}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".carousel-track {\n  display: flex;\n  gap: 1rem;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scrollbar-width: none;\n}\n\n.carousel-track::-webkit-scrollbar {\n  display: none;\n}\n\n.carousel-card {\n  flex-shrink: 0;\n  scroll-snap-align: center;\n  width: 10rem;\n  border-radius: 0.75rem;\n  padding: 1rem;\n\n  animation: card-focus linear both;\n  animation-timeline: view(inline);\n  animation-range: entry 0% exit 100%;\n}\n\n@keyframes card-focus {\n  0%, 100% {\n    scale: 0.8;\n    opacity: 0.4;\n    filter: brightness(0.75);\n  }\n  25%, 75% {\n    scale: 1;\n    opacity: 1;\n    filter: brightness(1);\n  }\n}","uuid":"a09be876-9ea5-4733-9f38-f52b66df19a1","children":[{"type":"formatted","text":""}]},{"type":"custom-block","content":"const cards = [\n  { id: 1, title: '极速性能', desc: '浏览器原生时间轴' },\n  { id: 2, title: '声明式语法', desc: '纯 CSS 驱动' },\n  { id: 3, title: '精确控制', desc: 'Range 定义区间' },\n  { id: 4, title: '视图驱动', desc: 'view() 时间轴' },\n  { id: 5, title: '滚动驱动', desc: 'scroll() 时间轴' },\n  { id: 6, title: '原生支持', desc: '无需第三方库' },\n];\n\nconst Component = () =\u003e {\n  return (\n    \u003cdiv className=\"space-y-4\"\u003e\n      \u003cdiv className=\"flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400\"\u003e\n        \u003cspan\u003eanimation-timeline: view(inline)\u003c/span\u003e\n        \u003cspan\u003e左右拖拽滚动卡片\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv className=\"css-carousel-track flex gap-4 overflow-x-auto px-[calc(50%-5.5rem)] py-6\"\u003e\n        {cards.map((card) =\u003e (\n          \u003cdiv key={card.id} className=\"css-carousel-card flex w-44 flex-shrink-0 snap-center select-none flex-col items-center justify-center gap-3 rounded-xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-700 dark:bg-zinc-800\"\u003e\n            \u003cdiv className=\"flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-cyan-500 text-lg font-bold text-white\"\u003e\n              {card.id}\n            \u003c/div\u003e\n            \u003cdiv className=\"text-base font-semibold text-zinc-900 dark:text-zinc-100\"\u003e{card.title}\u003c/div\u003e\n            \u003cdiv className=\"text-xs text-zinc-500 dark:text-zinc-400\"\u003e{card.desc}\u003c/div\u003e\n          \u003c/div\u003e\n        ))}\n      \u003c/div\u003e\n      \u003cstyle\u003e{`\n        .css-carousel-track {\n          scroll-snap-type: x mandatory;\n          scrollbar-width: none;\n        }\n\n        .css-carousel-track::-webkit-scrollbar {\n          display: none;\n        }\n\n        .css-carousel-card {\n          scale: 0.8;\n          opacity: 0.4;\n          filter: brightness(0.75);\n          animation: css-card-focus linear both;\n          animation-timeline: view(inline);\n          animation-range: entry 0% exit 100%;\n        }\n\n        @keyframes css-card-focus {\n          0%, 100% {\n            scale: 0.8;\n            opacity: 0.4;\n            filter: brightness(0.75);\n            box-shadow: none;\n          }\n          25%, 75% {\n            scale: 1;\n            opacity: 1;\n            filter: brightness(1);\n            box-shadow: 0 0 24px rgba(59, 130, 246, 0.2);\n          }\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"timeline-scope"}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"scroll()","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"view()","code":true},{"type":"formatted","text":" 创建的都是匿名时间轴，每个动画元素分别引用自己的时间轴。但在一些场景中，多个元素需要由同一滚动进度驱动，这时就需要定义并引用命名时间轴。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在关联的滚动容器中，可以使用 "},{"type":"formatted","text":"scroll-timeline-name","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"view-timeline-name","code":true},{"type":"formatted","text":" 定义命名时间轴："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".scroller {\n  scroll-timeline-name: --scroll-timeline-name;\n  view-timeline-name: --view-timeline-name;  \n}","uuid":"458883c8-d755-4967-a83a-0a87a94fe6df","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以通过 "},{"type":"formatted","text":"scroll-timeline-axis","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"view-timeline-axis","code":true},{"type":"formatted","text":" 指定关联的滚动方向："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"scroll-timeline-axis: block;\nview-timeline-axis: inline;","uuid":"b6cdb038-604f-4440-bbee-0d1500efdc07","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"也可以使用 "},{"type":"formatted","text":"scroll-timeline","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"view-timeline","code":true},{"type":"formatted","text":" 简写："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"scroll-timeline: --scroll-timeline-name block;\nview-timeline: --view-timeline-name inline;","uuid":"cf42317b-6ef1-49d0-ab95-0f9c7b8c8b11","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"动画元素随后通过 "},{"type":"formatted","text":"animation-timeline","code":true},{"type":"formatted","text":" 引用该命名时间轴："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"animation-timeline: --scroll-timeline-name;","uuid":"0c7bfef2-ab62-4b36-9ed5-60eb28bd9d58","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面通过一个更具创意的例子来感受命名时间轴在多元素协同上的优势。假设我们要做一个“滚动任务控制中心”：随着用户滚动，顶部进度条填充、两侧指标卡片从左右两侧滑入、中心徽章旋转弹出，功能标签也会依次浮现。这些元素分布在页面不同位置，但它们的动画节奏都由同一个命名时间轴驱动。"}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".mission-scroller {\n  overflow-y: auto;\n  scroll-timeline: --mission-scroll block;\n}\n\n.mission-progress {\n  position: sticky;\n  top: 0;\n  height: 4px;\n  transform-origin: left;\n  transform: scaleX(0);\n  background: linear-gradient(90deg, #3b82f6, #06b6d4);\n\n  animation: progress-fill linear both;\n  animation-timeline: --mission-scroll;\n}\n\n@keyframes progress-fill {\n  to {\n    transform: scaleX(1);\n  }\n}\n\n.stat-left {\n  animation: slide-in-left linear both;\n  animation-timeline: --mission-scroll;\n  animation-range: 0% 30%;\n}\n\n@keyframes slide-in-left {\n  from {\n    opacity: 0;\n    transform: translateX(-60px);\n  }\n  to {\n    opacity: 1;\n    transform: translateX(0);\n  }\n}\n\n.stat-right {\n  animation: slide-in-right linear both;\n  animation-timeline: --mission-scroll;\n  animation-range: 20% 50%;\n}\n\n@keyframes slide-in-right {\n  from {\n    opacity: 0;\n    transform: translateX(60px);\n  }\n  to {\n    opacity: 1;\n    transform: translateX(0);\n  }\n}\n\n.hero-badge {\n  animation: badge-pop linear both;\n  animation-timeline: --mission-scroll;\n  animation-range: 30% 60%;\n}\n\n@keyframes badge-pop {\n  from {\n    opacity: 0;\n    transform: scale(0.5) rotate(-10deg);\n  }\n  to {\n    opacity: 1;\n    transform: scale(1) rotate(0deg);\n  }\n}\n\n.feature-chip {\n  animation: chip-reveal linear both;\n  animation-timeline: --mission-scroll;\n  animation-range: 50% 80%;\n}\n\n@keyframes chip-reveal {\n  from {\n    opacity: 0;\n    transform: translateY(40px);\n  }\n  to {\n    opacity: 1;\n    transform: translateY(0);\n  }\n}\n","uuid":"491bc8bd-80e0-4cda-b25d-ac45f9403702","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"关键点在于，所有元素的 "},{"type":"formatted","text":"animation-timeline","code":true},{"type":"formatted","text":" 都指向 "},{"type":"formatted","text":"--mission-scroll","code":true},{"type":"formatted","text":"，而它们各自拥有不同的关键帧和 "},{"type":"formatted","text":"animation-range","code":true},{"type":"formatted","text":"，从而在同一个滚动进度下呈现出分阶段、有层次的协同效果。如果不用命名时间轴，每个元素都需要单独声明 "},{"type":"formatted","text":"scroll()","code":true},{"type":"formatted","text":"，并且很难保证它们始终基于同一个滚动源精确同步。"}],"disableDrag":false},{"type":"custom-block","content":"const Component = () =\u003e {\n  const chips = [\n    { label: '性能优化', className: 'mission-chip mission-chip-1 bg-blue-500' },\n    { label: '线程隔离', className: 'mission-chip mission-chip-2 bg-cyan-500' },\n    { label: '声明式动画', className: 'mission-chip mission-chip-3 bg-violet-500' },\n  ];\n\n  return (\n    \u003cdiv className=\"space-y-3\"\u003e\n      \u003cdiv className=\"flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400\"\u003e\n        \u003cspan\u003e多元素共享 --mission-scroll\u003c/span\u003e\n        \u003cspan\u003e在下方区域滚动查看协同效果\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv className=\"relative h-[480px] overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-700\"\u003e\n        \u003cdiv className=\"css-mission-scroller absolute inset-0 overflow-y-auto\"\u003e\n          \u003cdiv className=\"sticky top-0 z-30 h-1.5 w-full bg-zinc-200/50 dark:bg-zinc-700/50\"\u003e\n            \u003cdiv className=\"css-mission-progress h-full origin-left bg-gradient-to-r from-blue-500 to-cyan-400\" /\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"relative z-10 flex min-h-[680px] flex-col items-center gap-6 px-6 py-8\"\u003e\n            \u003cdiv className=\"text-center\"\u003e\n              \u003cdiv className=\"mb-3 inline-flex rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-600 dark:bg-blue-900/30 dark:text-blue-400\"\u003e命名时间轴协同\u003c/div\u003e\n              \u003ch2 className=\"m-0 text-xl font-bold text-zinc-900 dark:text-zinc-100\"\u003e滚动任务控制中心\u003c/h2\u003e\n              \u003cp className=\"m-0 mt-2 text-sm text-zinc-500 dark:text-zinc-400\"\u003e多个元素共享同一个时间轴，按不同区间依次入场\u003c/p\u003e\n              \u003cdiv className=\"mt-6 text-lg text-zinc-400\"\u003e↓\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"grid w-full max-w-md grid-cols-2 gap-4\"\u003e\n              \u003cdiv className=\"css-mission-left rounded-xl border border-zinc-200 bg-white/90 p-4 dark:border-zinc-700 dark:bg-zinc-800/90\"\u003e\n                \u003cdiv className=\"text-2xl font-bold text-blue-500\"\u003e99%\u003c/div\u003e\n                \u003cdiv className=\"text-xs text-zinc-500 dark:text-zinc-400\"\u003e系统加载\u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv className=\"css-mission-right rounded-xl border border-zinc-200 bg-white/90 p-4 dark:border-zinc-700 dark:bg-zinc-800/90\"\u003e\n                \u003cdiv className=\"text-2xl font-bold text-cyan-500\"\u003e12\u003c/div\u003e\n                \u003cdiv className=\"text-xs text-zinc-500 dark:text-zinc-400\"\u003e模块就绪\u003c/div\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"css-mission-badge flex h-28 w-28 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-500 text-4xl shadow-lg\"\u003e🚀\u003c/div\u003e\n            \u003cdiv className=\"flex max-w-md flex-wrap justify-center gap-3\"\u003e\n              {chips.map((chip) =\u003e (\n                \u003cspan key={chip.label} className={`${chip.className} rounded-full px-4 py-2 text-sm font-medium text-white`}\u003e\n                  {chip.label}\n                \u003c/span\u003e\n              ))}\n            \u003c/div\u003e\n            \u003cdiv className=\"mt-2 w-full max-w-md rounded-xl border border-zinc-200 bg-white/90 p-4 dark:border-zinc-700 dark:bg-zinc-800/90\"\u003e\n              \u003cdiv className=\"mb-2 text-xs text-zinc-500 dark:text-zinc-400\"\u003e任务总进度\u003c/div\u003e\n              \u003cdiv className=\"h-2 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-700\"\u003e\n                \u003cdiv className=\"css-mission-progress h-full origin-left bg-gradient-to-r from-blue-500 to-cyan-400\" /\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n        \u003cstyle\u003e{`\n          .css-mission-scroller {\n            scroll-timeline: --mission-scroll block;\n            scrollbar-width: none;\n          }\n\n          .css-mission-scroller::-webkit-scrollbar {\n            display: none;\n          }\n\n          .css-mission-progress {\n            transform: scaleX(0);\n            animation: css-mission-progress-fill linear both;\n            animation-timeline: --mission-scroll;\n          }\n\n          .css-mission-left {\n            animation: css-mission-left-in linear both;\n            animation-timeline: --mission-scroll;\n            animation-range: 0% 30%;\n          }\n\n          .css-mission-right {\n            animation: css-mission-right-in linear both;\n            animation-timeline: --mission-scroll;\n            animation-range: 20% 50%;\n          }\n\n          .css-mission-badge {\n            animation: css-mission-badge-pop linear both;\n            animation-timeline: --mission-scroll;\n            animation-range: 30% 60%;\n          }\n\n          .mission-chip {\n            animation: css-mission-chip-reveal linear both;\n            animation-timeline: --mission-scroll;\n          }\n\n          .mission-chip-1 { animation-range: 45% 70%; }\n          .mission-chip-2 { animation-range: 55% 80%; }\n          .mission-chip-3 { animation-range: 65% 90%; }\n\n          @keyframes css-mission-progress-fill {\n            to { transform: scaleX(1); }\n          }\n\n          @keyframes css-mission-left-in {\n            from { opacity: 0; transform: translateX(-60px); }\n            to { opacity: 1; transform: translateX(0); }\n          }\n\n          @keyframes css-mission-right-in {\n            from { opacity: 0; transform: translateX(60px); }\n            to { opacity: 1; transform: translateX(0); }\n          }\n\n          @keyframes css-mission-badge-pop {\n            from { opacity: 0; transform: scale(0.5) rotate(-10deg); }\n            to { opacity: 1; transform: scale(1) rotate(0deg); }\n          }\n\n          @keyframes css-mission-chip-reveal {\n            from { opacity: 0; transform: translateY(40px); }\n            to { opacity: 1; transform: translateY(0); }\n          }\n\n        `}\u003c/style\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这样，整个「任务控制中心」就像一支被统一指挥的乐队，滚动进度是指挥棒，所有元素按照各自的乐谱在正确的节拍上入场。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"前面的例子中，定义命名时间轴的元素同时也是动画元素的祖先，因此动画可以直接引用这条时间轴。但页面结构并不总能满足这种关系。比如，我们希望用 subject 在视口中的位置驱动旁边的 effect，二者只是同一个 component 下的兄弟元素："}],"disableDrag":false},{"type":"code-block","language":"HTML","code":"\u003cdiv class=\"component\"\u003e\n  \u003cdiv class=\"subject\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"effect\"\u003e\u003c/div\u003e\n\u003c/div\u003e","uuid":"c2e1c5b2-8761-4cdd-9d7e-88ce036544fa","children":[{"type":"formatted","text":""}]},{"type":"code-block","language":"CSS","code":".subject {\n  view-timeline: --card-view block;\n}\n\n.effect {\n  animation: reveal linear both;\n  animation-timeline: --card-view;\n}","uuid":"61cdad68-7bf9-4ce8-a98f-34b7c408c258","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从结构上看，我们自然会期待 effect 由同一个 component 中的 subject 驱动："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"effect → subject","uuid":"57f4637d-b188-4191-9923-bb6176bd86ff","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但实际滚动时，effect 并没有动画。这是因为在当前浏览器采用的作用域模型中，通过 "},{"type":"formatted","text":"scroll-timeline-name","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"view-timeline-name","code":true},{"type":"formatted","text":" 定义的命名时间轴，默认只能被定义元素的后代引用。这里的 subject 和 effect 是兄弟元素，effect 并不在 subject 的子树中，因此最终引用到 inactive timeline："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"effect → inactive timeline","uuid":"12fb2a26-a3ee-498f-8d75-598c764a2986","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这意味着动画没有有效的时间轴，滚动时也不会发生变化。"}],"disableDrag":false},{"type":"custom-block","content":"const { useTheme } = hooks;\n\nconst Component = () =\u003e {\n  const { isDark } = useTheme();\n  const panels = [\n    { id: 'demo', label: '', color: '#3b82f6' },\n  ];\n\n  return (\n    \u003cdiv className=\"space-y-3\"\u003e\n      \u003cdiv className=\"rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800 dark:border-amber-900/60 dark:bg-amber-950/30 dark:text-amber-200\"\u003e\n        未设置 timeline-scope：effect 无法引用兄弟 subject 创建的时间轴\n      \u003c/div\u003e\n      \u003cdiv className=\"mx-auto max-w-2xl\"\u003e\n        {panels.map((panel) =\u003e (\n          \u003cdiv\n            key={panel.id}\n            className={`unscoped-component-${panel.id} overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-700`}\n          \u003e\n            \u003cdiv className=\"border-b border-zinc-200 bg-zinc-50 px-4 py-3 dark:border-zinc-700 dark:bg-zinc-800/60\"\u003e\n              \u003cdiv className=\"flex items-center justify-between\"\u003e\n                \u003cspan className=\"text-sm font-semibold text-zinc-800 dark:text-zinc-100\"\u003eComponent {panel.label}\u003c/span\u003e\n                \u003ccode className=\"text-xs text-amber-600 dark:text-amber-400\"\u003einactive timeline\u003c/code\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"unscoped-scroller h-72 overflow-y-auto\" style={{ scrollbarWidth: 'thin' }}\u003e\n              \u003cdiv className=\"sticky top-0 z-10 border-b border-zinc-200 bg-white/95 px-4 py-3 backdrop-blur dark:border-zinc-700 dark:bg-zinc-900/95\"\u003e\n                \u003cdiv className=\"mb-2 flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400\"\u003e\n                  \u003cspan\u003eeffect {panel.label} 的动画进度\u003c/span\u003e\n                  \u003cspan\u003einactive，不产生进度\u003c/span\u003e\n                \u003c/div\u003e\n                \u003cdiv className=\"h-2 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-700\"\u003e\n                  \u003cdiv\n                    className=\"unscoped-fill h-full origin-left rounded-full\"\n                    style={{ background: panel.color }}\n                  /\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv className=\"flex h-72 items-center justify-center text-xs text-zinc-400 dark:text-zinc-500\"\u003e\n                向下滚动，寻找 subject {panel.label}\n              \u003c/div\u003e\n              \u003cdiv\n                className=\"unscoped-subject mx-4 flex h-32 items-center justify-center rounded-xl text-lg font-bold text-white shadow-lg\"\n                style={{ background: `linear-gradient(135deg, ${panel.color}, #06b6d4)` }}\n              \u003e\n                subject {panel.label}\n              \u003c/div\u003e\n              \u003cdiv className=\"flex h-72 items-center justify-center text-xs text-zinc-400 dark:text-zinc-500\"\u003e\n                即使 subject 经过视口，effect 仍然无法引用它\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        ))}\n      \u003c/div\u003e\n      \u003cstyle\u003e{`\n        .unscoped-subject {\n          view-timeline: --unscoped-example-view block;\n        }\n\n        .unscoped-fill {\n          transform: scaleX(0);\n          animation-name: unscoped-progress;\n          animation-duration: auto;\n          animation-timing-function: linear;\n          \n          animation-timeline: --unscoped-example-view;\n          animation-range: cover 0% cover 100%;\n        }\n\n        @keyframes unscoped-progress {\n          from { transform: scaleX(0); }\n          to { transform: scaleX(1); }\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了解决这个问题，浏览器提供了 "},{"type":"formatted","text":"timeline-scope","code":true},{"type":"formatted","text":" 属性。它可以扩大命名时间轴的可引用范围，让时间轴定义元素子树之外的元素也能引用这条时间轴。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"回到上面的例子，只需要在 subject 和 effect 的共同祖先 "},{"type":"formatted","text":".component","code":true},{"type":"formatted","text":" 上设置："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":".component {\n  timeline-scope: --card-view;\n}","uuid":"35574afc-c361-4c4a-8aad-287141365d94","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"timeline-scope","code":true},{"type":"formatted","text":" 将 subject 创建的时间轴扩展到整个 component。这样，位于 subject 子树之外的 effect 也进入了时间轴的可引用范围："}],"disableDrag":false},{"type":"code-block","language":"CSS","code":"effect → subject","uuid":"727c659f-88ed-450f-aefb-6c101cdc4602","children":[{"type":"formatted","text":""}]},{"type":"custom-block","content":"const { useTheme } = hooks;\n\nconst Component = () =\u003e {\n  const { isDark } = useTheme();\n  const panels = [\n    { id: 'demo', label: '', color: '#10b981' },\n  ];\n\n  return (\n    \u003cdiv className=\"space-y-3\"\u003e\n      \u003cdiv className=\"rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800 dark:border-emerald-900/60 dark:bg-emerald-950/30 dark:text-emerald-200\"\u003e\n        在共同祖先 component 上设置 timeline-scope：兄弟 effect 可以引用 subject 的时间轴\n      \u003c/div\u003e\n      \u003cdiv className=\"mx-auto max-w-2xl\"\u003e\n        {panels.map((panel) =\u003e (\n          \u003cdiv\n            key={panel.id}\n            className={`legacy-scoped-component legacy-scoped-component-${panel.id} overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-700`}\n          \u003e\n            \u003cdiv className=\"border-b border-zinc-200 bg-zinc-50 px-4 py-3 dark:border-zinc-700 dark:bg-zinc-800/60\"\u003e\n              \u003cdiv className=\"flex items-center justify-between\"\u003e\n                \u003cspan className=\"text-sm font-semibold text-zinc-800 dark:text-zinc-100\"\u003eComponent {panel.label}\u003c/span\u003e\n                \u003ccode className=\"text-xs text-emerald-600 dark:text-emerald-400\"\u003escope {panel.label}\u003c/code\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"legacy-scoped-scroller h-72 overflow-y-auto\" style={{ scrollbarWidth: 'thin' }}\u003e\n              \u003cdiv className=\"sticky top-0 z-10 border-b border-zinc-200 bg-white/95 px-4 py-3 backdrop-blur dark:border-zinc-700 dark:bg-zinc-900/95\"\u003e\n                \u003cdiv className=\"mb-2 flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400\"\u003e\n                  \u003cspan\u003eeffect {panel.label} 的动画进度\u003c/span\u003e\n                  \u003cspan\u003e引用 subject {panel.label}\u003c/span\u003e\n                \u003c/div\u003e\n                \u003cdiv className=\"h-2 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-700\"\u003e\n                  \u003cdiv\n                    className=\"legacy-scoped-fill h-full origin-left rounded-full\"\n                    style={{ background: panel.color }}\n                  /\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv className=\"flex h-72 items-center justify-center text-xs text-zinc-400 dark:text-zinc-500\"\u003e\n                向下滚动，寻找 subject {panel.label}\n              \u003c/div\u003e\n              \u003cdiv\n                className=\"legacy-scoped-subject mx-4 flex h-32 items-center justify-center rounded-xl text-lg font-bold text-white shadow-lg\"\n                style={{ background: `linear-gradient(135deg, ${panel.color}, #3b82f6)` }}\n              \u003e\n                subject {panel.label}\n              \u003c/div\u003e\n              \u003cdiv className=\"flex h-72 items-center justify-center text-xs text-zinc-400 dark:text-zinc-500\"\u003e\n                subject {panel.label} 正在离开视口\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        ))}\n      \u003c/div\u003e\n      \u003cdiv className=\"rounded-lg bg-emerald-50 px-3 py-2 text-center text-sm font-medium text-zinc-700 dark:bg-emerald-950/30 dark:text-zinc-200\"\u003e\n        effect → subject\n      \u003c/div\u003e\n      \u003cstyle\u003e{`\n        .legacy-scoped-component {\n          timeline-scope: --legacy-scoped-example-view;\n        }\n\n        .legacy-scoped-subject {\n          view-timeline: --legacy-scoped-example-view block;\n        }\n\n        .legacy-scoped-fill {\n          transform: scaleX(0);\n          animation-name: legacy-scoped-progress;\n          animation-duration: auto;\n          animation-timing-function: linear;\n          animation-fill-mode: both;\n          animation-timeline: --legacy-scoped-example-view;\n          animation-range: cover 0% cover 100%;\n        }\n\n        @keyframes legacy-scoped-progress {\n          from { transform: scaleX(0); }\n          to { transform: scaleX(1); }\n        }\n      `}\u003c/style\u003e\n    \u003c/div\u003e\n  );\n};","children":[{"type":"formatted","text":""}]},{"type":"callout","title":"规范演进","calloutType":"warning","children":[{"type":"paragraph","children":[{"type":"formatted","text":"命名时间轴的作用域模型仍在演进。当前浏览器实现主要采用这样的模型：命名时间轴默认只能控制定义元素的后代，"},{"type":"formatted","text":"timeline-scope","code":true},{"type":"formatted","text":" 用来把某个后代时间轴的作用域向外扩展到指定祖先及其子树。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"较新的 CSSWG Editor’s Draft 正在设计另一套全局名称查找模型。在那套模型中，名称默认参与更大范围的查找，"},{"type":"formatted","text":"timeline-scope","code":true},{"type":"formatted","text":" 更接近一个局部命名边界，用于隔离不同组件中的同名时间轴。它的查找过程可以用下面的伪代码直观表示："}],"disableDrag":false},{"type":"code-block","language":"JavaScript","code":"function resolve(element, name) {\n  if (element 自己定义了 name) {\n    return element 自己的 timeline;\n  }\n\n  if (\n    element 对 name 设置了 timeline-scope ||\n    element 是 documentElement\n  ) {\n    return element 子树内最后一个有效的同名 timeline\n      ?? inactiveTimeline;\n  }\n\n  return resolve(element 的 flat-tree 父元素, name);\n}","uuid":"b1fb7589-4c96-41bc-b4ea-f7e872085f6e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这段伪代码描述的是较新 Editor’s Draft 中的设计方向，不是当前的浏览器实现。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"本文示例仍以当前已经实现的作用域模型为准。"}],"disableDrag":false}]},{"type":"header","level":2,"children":[{"type":"formatted","text":"参考"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://developer.chrome.com/docs/css-ui/scroll-driven-animations?hl=zh-cn","children":[{"type":"formatted","text":"使用滚动驱动的动画，在滚动时为元素添加动画效果"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/animation-timeline","children":[{"type":"formatted","text":"animation
