    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":19,"title":"深度学习简介","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"随着一些 AIGC 产品的出现，如 Stable Diffusion、ChatGPT、GPT4 等，AI 再次进入大家的视野，体验过 ChatGPT 的都会说好，我目前已经把它当作学习工具了，Google 在做不出产品，真的可以说拜拜了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"AI 分为很多个学派："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"符号主义学派：主张人工智能应该通过逻辑和符号规则来实现智能，对应的方法是专家系统"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"行为主义学派：主张人工智能应该通过学习和反馈的方式来实现智能，对应的方法有决策树，强化学习"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"连接主义学派：主张人工智能应该通过模拟神经网络的方式来实现智能，对应的方法是深度学习"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"... ..."}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"自人工智能的概念被提出，历经数十年，各学派的方法各领风骚，到了如今，是连接主义学派独领风骚的时代，深度学习一词早已被众人所知，所以本文的重点就是讲解深度学习相关的一些概念。"}],"disableDrag":false},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"本文面向的是小白用户，主要介绍的深度学习的一些比较浅显的东西，以及对一些 AI 应用的介绍，想要更加深入的了解，直接看论文。"}],"disableDrag":false}]},{"type":"header","children":[{"type":"formatted","text":"多层感知机"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"连接主义学派主张模拟人脑的神经系统来实现智能，人脑的神经系统是由一个个神经元互相连接而形成，一个神经元可以有多个输入，也可以同时输出到多个神经元。我们对神经元进行一个简单的建模"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/深度学习.jqc34h9jy34.webp","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"inline-math","tex":"x_i","children":[{"type":"formatted","text":"x_i"}]},{"type":"formatted","text":" 是网络的输入，"},{"type":"inline-math","tex":"w_i","children":[{"type":"formatted","text":"w_i"}]},{"type":"formatted","text":" 是网络的参数。这里神经元只是对各个输入进行简单的加权和 "},{"type":"inline-math","tex":"y = x_1w_1 + x_2w_2","children":[{"type":"formatted","text":"y = x_1w_1 + x_2w_2"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我们将神经元按照层级连接起来，就形成了神经网络，这种网络称为多层感知机或者全连接层，这就是最简单的神经网络。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/多层感知机.6adzaqnibpg0.webp","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个网络有一个问题，它是一个线性的网络，表达能力有限，为了引入非线性的能力，我们在所有的输出后添加了一个激活函数，经过激活函数后在作为下一层的输入。"}],"disableDrag":false},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"为什么叫激活函数。这也是应用了人脑神经系统的概念，人脑的神经元并不是对所有的输入都会有反应的，只有当输入达到了一定的阈值，神经元才会被激活，从而产生输出。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"激活函数就是一个简单的一元函数，进入一个数，出去一个数，激活函数也是五花八门，但是他们有一个特征，就是非线性。常见的激活函数如下："}],"disableDrag":false},{"type":"html-block","html":"<iframe width=\"100%\" height=\"520px\" style=\"border: none;\" src=\"https://lastknightcoder.github.io/frontend-demo/deep-learning/01.html?a=2\"></iframe>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"训练网络"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"所谓训练网络是指：在给定大量数据集对 "},{"type":"inline-math","tex":"(\\vec{x}, \\vec{y})","children":[{"type":"formatted","text":"(\\vec{x}, \\vec{y})"}]},{"type":"formatted","text":" 的情况下，如何训练每一层的参数 "},{"type":"inline-math","tex":"\\vec{w}","children":[{"type":"formatted","text":"\\vec{w}"}]},{"type":"formatted","text":"。其中 "},{"type":"inline-math","tex":"\\vec{x}","children":[{"type":"formatted","text":"\\vec{x}"}]},{"type":"formatted","text":" 是真实的输入，"},{"type":"inline-math","tex":"\\vec{y}","children":[{"type":"formatted","text":"\\vec{y}"}]},{"type":"formatted","text":" 是真实的输出，这里都用了向量，是因为输入可以是多个，输出也可是多个。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"举个🌰：输入一幅图片，那么 "},{"type":"inline-math","tex":"\\vec{x} ","children":[{"type":"formatted","text":"\\vec{x} "}]},{"type":"formatted","text":"就表示每一个像素点，输出图片的类别，那么 "},{"type":"inline-math","tex":"\\vec{y}","children":[{"type":"formatted","text":"\\vec{y}"}]},{"type":"formatted","text":" 就表示图片是每个类别的概率。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"假设我们要训练一个加法器，那么给定的数据集可能是这样的"}],"disableDrag":false},{"type":"block-math","tex":"\\begin{aligned}\n&((1, 1), (2)) \\\\\n&((1, 2), (3)) \\\\\n&((2, 3), (5)) \\\\\n&\\cdots\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"inline-math","tex":"(1, 1)","children":[{"type":"formatted","text":"(1, 1)"}]},{"type":"formatted","text":" 表示输入，"},{"type":"inline-math","tex":"(2)","children":[{"type":"formatted","text":"(2)"}]},{"type":"formatted","text":" 表示对应的输出。现在我们的目标就是利用这些数据训练一个加法器，当训练完成时，我们向模型输入两个数时，模型能给出相加的结果。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"对于某一对训练数据，"},{"type":"inline-math","tex":"(\\vec{x}, \\vec{y})","children":[{"type":"formatted","text":"(\\vec{x}, \\vec{y})"}]},{"type":"formatted","text":"，我们将 "},{"type":"inline-math","tex":"\\vec{x}","children":[{"type":"formatted","text":"\\vec{x}"}]},{"type":"formatted","text":" 直接输入网络，此时可以得到一个输出 "},{"type":"inline-math","tex":"\\hat{\\vec{y}}","children":[{"type":"formatted","text":"\\hat{\\vec{y}}"}]},{"type":"formatted","text":"，我们将 "},{"type":"inline-math","tex":"\\hat{\\vec{y}}","children":[{"type":"formatted","text":"\\hat{\\vec{y}}"}]},{"type":"formatted","text":" 与真实的输出 "},{"type":"inline-math","tex":"\\vec{y}","children":[{"type":"formatted","text":"\\vec{y}"}]},{"type":"formatted","text":" 进行一个比较，得到一个数值表示模型输出与真实输出的差距（我们一般称为损失），然后根据此差距来调整网络参数，使得模型输出与真实输出的差距变小，以此往复，经过一定次数的训练后，网络的输出与真实的输出差距非常小了，我们就可以认为模型训练完成，可以用于推理了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"上面是训练的流程，就像把大象放进冰箱分几步一样，有两个关键的问题："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如何衡量模型输出与真实输出的差距"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如何调整参数使差距变小"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"前者我们通过一个叫"},{"type":"formatted","text":"损失函数","bold":true},{"type":"formatted","text":"的东西去衡量模型输出与真实输出的差距，不同的任务有不同的损失函数。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"一般回归任务使用均方误差损失函数："}],"disableDrag":false},{"type":"block-math","tex":"l = \\frac{1}{N}\\sum_{i}^{N} (y_i - \\hat{y}_i)^{2}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"分类任务使用交叉熵损失函数："}],"disableDrag":false},{"type":"block-math","tex":"l = -\\frac{1}{N} \\sum_i^N \\sum_{c}^{M} y_{ic}\\log(p_{ic})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"选定了损失函数后，我们需要调整参数，使得损失函数变小，调整参数的算法一般使用的梯度下降法"}],"disableDrag":false},{"type":"block-math","tex":"w_{i + 1} = w_{i} - \\eta \\frac{\\partial{y}}{\\partial{w}}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 "},{"type":"inline-math","tex":"\\eta","children":[{"type":"formatted","text":"\\eta"}]},{"type":"formatted","text":" 称为学习率，当学习率过大时，每次迭代不一定会使得损失函数的值变小，训练无法收敛；但是当学习率过小时，就会导致训练速度过慢，无法进行有效的学习，因此学习率的选取也是门技术。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"像学习率这种人为选择的参数我们称为超参数，深度学习一个重要的过程就是选择合适的超参数，简称调参。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"现在又带来了一个新的问题，怎么获得梯度，对于简单的函数梯度很容易算出来，但是对于复杂的神经网络，计算每个参数的梯度，几乎无法通过数学手动推导，这个问题可以通过反向传播算法解决，当我们构建模型时，除了会构建前向的计算流程，还会构建一个反向传播的计算图，用以传递梯度，这个过程由深度学习框架提供，我们无需关心。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"整个的训练流程如下所示："}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/网络训练流程.3lhliphwyfo0.webp","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"线性回归"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"制作训练数据："}],"disableDrag":false},{"type":"code-block","code":"import torch  \nfrom matplotlib import pyplot as plt  \n\n\ndef generate_data(a, b, nums=1000):  \n    X = torch.normal(0, 1, (nums, 1))  \n    y = torch.matmul(X, a) + b  \n    y += torch.normal(0, 0.1, y.shape)  \n    return X, y.reshape(-1, 1)\n  \n\ntrue_a = torch.tensor([3.4])  \ntrue_b = torch.tensor([-2])  \n  \nfeatures, labels = generate_data(true_a, true_b, 500)  \nplt.scatter(features.numpy(), labels.numpy(), marker='o')  \nplt.show()","language":"py","uuid":"07b8fa1d-7f89-4e45-a2b5-a9676baeb7c0","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/generate_data.3jhist77au40.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"数据读取函数"}],"disableDrag":false},{"type":"code-block","code":"import random  \n  \n  \ndef data_iter(batch_size, features, labels):  \n    num_examples = len(features)  \n    indices = list(range(num_examples))  \n    # 这些样本是随机读取的，没有特定的顺序  \n    random.shuffle(indices)  \n    for i in range(0, num_examples, batch_size):  \n        batch_indices = torch.tensor(  \n            indices[i: min(i + batch_size, num_examples)])  \n        yield features[batch_indices], labels[batch_indices]\n\n\nfor X, y in data_iter(10, features, labels):  \n    print(X.shape, y.shape)  \n    break","language":"py","uuid":"597dcd41-d028-41c5-9392-5fbbfaec695a","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"torch.Size([10, 1]) torch.Size([10])","language":"py","uuid":"83d8d46f-e89a-4831-8cac-62ee19c06518","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"创建神经网络："}],"disableDrag":false},{"type":"code-block","code":"from torch import nn  \n  \n  \nnet = nn.Sequential(nn.Linear(1, 10), nn.ReLU(), nn.Linear(10, 1))  \nnet[0].weight.data.normal_(0, 0.01)  \nnet[0].bias.data.fill_(0)","language":"py","uuid":"cc54c067-88a7-4132-9ad9-b85d7c8bedb5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"定义损失函数和参数更新算法"}],"disableDrag":false},{"type":"code-block","code":"loss = nn.MSELoss()  \ntrainer = torch.optim.SGD(net.parameters(), lr=0.01)","language":"py","uuid":"4b0e86ec-5476-4762-a77b-50f0abceaeb6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"开始训练："}],"disableDrag":false},{"type":"code-block","code":"num_epochs = 150\nlosses = []\nfor epoch in range(num_epochs):\n    for X, y in data_iter(10, features, labels):\n        l = loss(net(X), y)\n        trainer.zero_grad()\n        l.backward()\n        trainer.step()\n  \n    losses.append(loss(net(features), labels).item())\n  \nplt.plot(range(1, num_epochs + 1), losses)\nplt.xlabel('epoch')\nplt.ylabel('loss')\nplt.show()","language":"py","uuid":"5d98ea1f-3045-466b-b6d2-d076530f64dc","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/train_lin.3cl72158g7c0.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"test_data = torch.tensor([[-4.0], [0.0], [4.0]])  \nprint(net(test_data).reshape(3))  \nprint(torch.matmul(test_data, true_a) + true_b)","language":"py","uuid":"ceb5d7f7-907d-4ec6-8ea1-02f393b8c718","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"tensor([-15.5906,  -2.0239,  11.1079], grad_fn=<ReshapeAliasBackward0>)\ntensor([-15.6000,  -2.0000,  11.6000])","language":"py","uuid":"5503883a-bdf6-4bc5-9518-9d29da679e66","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"手写数字识别"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"加载数据集，使用官方的数据集，通过 torchvision 直接下载："}],"disableDrag":false},{"type":"code-block","code":"import torch  \nimport matplotlib.pyplot as plt  \nfrom torch import nn  \nfrom torch.utils.data import DataLoader  \nfrom torchvision import datasets  \nfrom torchvision.transforms import ToTensor  \n\ntraining_data = datasets.MNIST(  \n    root=\"data\",  \n    train=True,  \n    download=True,  \n    transform=ToTensor(),  \n)  \n\ntest_data = datasets.MNIST(  \n    root=\"data\",  \n    train=False,  \n    download=True,  \n    transform=ToTensor(),  \n)","language":"py","uuid":"c31d593e-9715-4f42-b212-67271e00fa11","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"显示前十张手写数字的图片："}],"disableDrag":false},{"type":"code-block","code":"batch_size = 64\n\n# 生产迭代器\ntrain_dataloader = DataLoader(training_data, batch_size=batch_size)  \ntest_dataloader = DataLoader(test_data, batch_size=batch_size)  \n  \nfor X, y in test_dataloader:  \n    for i in range(10):  \n        plt.subplot(2, 5, i + 1)  \n        plt.imshow(X[i].squeeze(), cmap='gray')  \n        plt.title(y[i].item())  \n    plt.show()  \n    break","language":"py","uuid":"5b4ff900-7b58-446d-bc5d-c784d29cf3a4","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/mm.7djhqq4vtfw0.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"定义网络模型，损失函数和更新算法"}],"disableDrag":false},{"type":"code-block","code":"class MLP(nn.Module):  \n    def __init__(self):  \n        super(MLP, self).__init__()  \n        self.flatten = nn.Flatten()  \n        self.linear_relu_stack = nn.Sequential(  \n            nn.Linear(28*28, 512),  \n            nn.ReLU(),  \n            nn.Linear(512, 512),  \n            nn.ReLU(),  \n            nn.Linear(512, 256),  \n            nn.ReLU(),  \n            nn.Linear(256, 10),  \n            nn.ReLU()  \n        )  \n  \n    def forward(self, x):  \n        x = self.flatten(x)  \n        logits = self.linear_relu_stack(x)  \n        return logits\n\n\nmodel = MLP()\nloss_fn = nn.CrossEntropyLoss()\noptimizer = torch.optim.SGD(model.parameters(), lr=1e-3)","language":"py","uuid":"350984f7-8cdb-42ad-b8f9-e28ad44edd28","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"定义训练函数以及测试函数："}],"disableDrag":false},{"type":"code-block","code":"def train(dataloader, model, loss_fn, optimizer):  \n    for X, y in dataloader: \n        pred = model(X)\n        loss = loss_fn(pred, y)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n\n\ndef test(dataloader, model, loss_fn, losses=[], accuracies=[]):  \n    size = len(dataloader.dataset)  \n    test_loss, correct = 0, 0  \n    with torch.no_grad():  \n        for X, y in dataloader:  \n            pred = model(X)  \n            test_loss += loss_fn(pred, y).item()  \n            # print(pred.shape, y.shape)  \n            correct += (pred.argmax(1) == y).type(torch.float).sum().item()  \n    test_loss /= size  \n    correct /= size  \n    losses.append(test_loss)  \n    accuracies.append(correct)  \n    print(f\"Test Error: \\n Accuracy: {(100*correct):>0.1f}%, Avg loss: {test_loss:>8f} \\n\")","language":"py","uuid":"6cac6989-12f7-4473-9e20-edcb06e4c082","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"开始训练："}],"disableDrag":false},{"type":"code-block","code":"epochs = 50   \ntest_losses = []  \ntest_accuracies = []  \nfor t in range(epochs):  \n    train(train_dataloader, model, loss_fn, optimizer)  \n    test(test_dataloader, model, loss_fn, test_losses, test_accuracies)","language":"py","uuid":"521c5a70-37cd-4b45-810b-924998ef9c19","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"查看训练时损失和精度变化："}],"disableDrag":false},{"type":"code-block","code":"plt.plot(test_losses, label='test loss')  \nplt.show()  \n\n\nplt.plot(test_accuracies, label='test accuracy')\nplt.show()","language":"py","uuid":"a84449ed-29c6-462e-b292-f3586d6780f6","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/ml.5dbndgoem840.png","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/mc.6r0jk4go0xc0.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"卷积神经网络"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"如果用多层感知机来处理图像，会丢失图像的空间信息，因为我们是把图像展开为一维的向量作为输入的，另一个更严重的问题是，多层感知机无法处理大图像，因为所需要的资源实在是太多了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"考虑使用多层感知机来处理一幅 "},{"type":"inline-math","tex":"1000\\times1000","children":[{"type":"formatted","text":"1000\\times1000"}]},{"type":"formatted","text":" 大小的图片，也就意味着输入层的节点数目为 $10^6$ 个，假设只有一个隐藏层，隐藏层的节点数目与输入节点的数目一样多，也为 "},{"type":"inline-math","tex":"10^6","children":[{"type":"formatted","text":"10^6"}]},{"type":"formatted","text":" 个，那么这个网络的参数个数为 "},{"type":"inline-math","tex":"10^{12}","children":[{"type":"formatted","text":"10^{12}"}]},{"type":"formatted","text":"，这是一个惊人的数字，即使是在如今的计算机上也很难将其全部搬入到内存中，因此也无法展开训练。训练参数过于巨大，带来的训练时间以及所需内存随着层级的增多急剧增加，使得只能训练简单几层的神经网络，无法处理图像等复杂的应用问题。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"根据图像具有的两个特征："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"平移不变性：一个物体出现在图片中的不同位置，网络应该有相同的输出，与位置无关"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"局部性：图像中的像素往往只与周围的像素相关，与其较远的像素不相关"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们对多层感知机变换为二维的形式"}],"disableDrag":false},{"type":"block-math","tex":"y_{i, j} = \\sum_{k,l}w_{i,j,k,l}x_{k,l} = \\sum_{a,b}v_{i,j,a,b}x_{i+a,j+b}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"应用平移不变性，即不管输入如何变化，权重 "},{"type":"inline-math","tex":"v","children":[{"type":"formatted","text":"v"}]},{"type":"formatted","text":" 不应该发生变化，即 "},{"type":"inline-math","tex":"v_{i,j,a,b} = v_{a,b}","children":[{"type":"formatted","text":"v_{i,j,a,b} = v_{a,b}"}]},{"type":"formatted","text":""}],"disableDrag":false},{"type":"block-math","tex":"y_{i,j} = \\sum_{a, b}v_{a,b}x_{i+a, j+b}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接着应用图片的局部性，我们一次只看一部分，即对于 "},{"type":"inline-math","tex":"|a| > \\Delta, |b| > \\Delta","children":[{"type":"formatted","text":"|a| > \\Delta, |b| > \\Delta"}]},{"type":"formatted","text":"，有 "},{"type":"inline-math","tex":"v_{a, b} = 0","children":[{"type":"formatted","text":"v_{a, b} = 0"}]},{"type":"formatted","text":"，所以有"}],"disableDrag":false},{"type":"block-math","tex":"y_{i, j} = \\sum_{a = -\\Delta}^{\\Delta}\\sum_{b = -\\Delta}^{\\Delta}v_{a, b}x_{i + a, j + b}","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"其实在数学上，这个运算是相关运算，不是卷积运算，我估计是在图像处理领域，以往的做法都是使用滤波器处理图像，而滤波器牵涉到卷积运算，大家叫惯了，所以叫卷积神经网络。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于卷积操作会导致卷积层的输出的特征变小，为了保持特征的大小，我们可以对于输入特征进行填充，在卷积的过程中，步幅的大小也会输出特征的特征产生影响，步幅越大，输出的特征越小。对于 "},{"type":"inline-math","tex":"k_w \\times k_h","children":[{"type":"formatted","text":"k_w \\times k_h"}]},{"type":"formatted","text":" 大小的卷积核，填充为 "},{"type":"inline-math","tex":"p_w \\times p_h","children":[{"type":"formatted","text":"p_w \\times p_h"}]},{"type":"formatted","text":"，步幅为 "},{"type":"inline-math","tex":"s_w \\times s_h","children":[{"type":"formatted","text":"s_w \\times s_h"}]},{"type":"formatted","text":"，输入的特征大小为 "},{"type":"inline-math","tex":"w \\times h","children":[{"type":"formatted","text":"w \\times h"}]},{"type":"formatted","text":"，那么输出的特征大小为："}],"disableDrag":false},{"type":"block-math","tex":"\\frac{w - k_w + p_w + s_w}{s_w} \\times \\frac{h - k_h + p_h + s_h}{s_{h}}","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/cnn_d.3fyzusr7wik0.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"池化（汇聚）操作是为了提高系统的鲁棒性，为了减小图像的微小变化而对网络的输出产生大的影响，我们一般在卷积操作之后进行池化操作，池化分为两种，最大池化和平均池化。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/池化层.37f73to0q4u0.webp","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"池化层在现在的网络中已经应用的比较少了，在之前的卷积神经网络中出现的比较多。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"举个🌰，手写数字识别："}],"disableDrag":false},{"type":"code-block","code":"class CNN(nn.Module):  \n    def __init__(self):  \n        super(CNN, self).__init__()  \n        self.model = nn.Sequential(  \n            nn.Conv2d(1, 6, 5),  \n            nn.MaxPool2d(2, 2),  \n            nn.ReLU(),  \n            nn.Conv2d(6, 16, 5),  \n            nn.MaxPool2d(2, 2),  \n            nn.ReLU(),  \n            nn.Flatten(),  \n            nn.Linear(16*4*4, 120),  \n            nn.ReLU(),  \n            nn.Linear(120, 84),  \n            nn.ReLU(),  \n            nn.Linear(84, 10),  \n            nn.ReLU()  \n        )  \n  \n    def forward(self, x):  \n        x = self.model(x)  \n        return x","language":"py","uuid":"c911c1f4-f001-47b4-8581-91ae9886b8a5","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/cl.3r8o1bgrg300.png","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/cc.2no6suyo5ly0.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"经典的卷积神经网络"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"LeNet 是最早发表的卷积神经网络，它是由 Yann LeCun 于 1989 年发表的，当时的目的是为了识别图像中的数字。网络整体结构由卷积层和全连接层组成，LeNet 有两个卷积层，卷积核的大小都为 "},{"type":"inline-math","tex":"5 \\times 5","children":[{"type":"formatted","text":"5 \\times 5"}]},{"type":"formatted","text":"，激活函数使用的都是 Sigmoid 函数，池化层采取的都是步幅为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 的平均池化，第一个卷积层对原图像进行了填充，以保持输出的特征大小不发生改变。在网络最后使用了三个全连接层，分别有 "},{"type":"inline-math","tex":"120","children":[{"type":"formatted","text":"120"}]},{"type":"formatted","text":"、"},{"type":"inline-math","tex":"84","children":[{"type":"formatted","text":"84"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"10","children":[{"type":"formatted","text":"10"}]},{"type":"formatted","text":" 个输出，最后的 "},{"type":"inline-math","tex":"10","children":[{"type":"formatted","text":"10"}]},{"type":"formatted","text":" 个输出分别表示 "},{"type":"inline-math","tex":"10","children":[{"type":"formatted","text":"10"}]},{"type":"formatted","text":" 个数字的置信度。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/毕业论文-LeNet.3jcaxdbo02k0.webp","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"net = nn.Sequential(\n    nn.Conv2d(1, 6, kernel_size=5, padding=2), nn.Sigmoid(),\n    nn.AvgPool2d(kernel_size=2, stride=2),\n    nn.Conv2d(6, 16, kernel_size=5), nn.Sigmoid(),\n    nn.AvgPool2d(kernel_size=2, stride=2),\n    nn.Flatten(),\n    nn.Linear(16 * 5 * 5, 120), nn.Sigmoid(),\n    nn.Linear(120, 84), nn.Sigmoid(),\n    nn.Linear(84, 10)\n)","language":"py","uuid":"45e542e2-4e03-4a86-9f0c-0abc5907d4c9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当时的计算机的计算能力还比较弱，这个系统是通过专用的硬件实现的，因此没有实现大规模的应用。随着计算能力的不断提升，卷积神经网络被研究者们重新发掘，在 2012 年的 ImageNet 图片分类的比赛中，卷积神经网络 AlexNet 大放异彩，一举拿下比赛的冠军，并且远超第二名的精度，从此卷积神经网络成为机器学习的主流。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"AlexNet 使用八层卷积神经网络，它包含 5 个卷积层以及 3 个全连接层，其网络架构如图所示。AlexNet 相对于 LeNet 深度有所提升，并且使用的激活函数为 ReLU 函数。第一个卷积层的卷积核的大小为 "},{"type":"inline-math","tex":"11 \\times 11","children":[{"type":"formatted","text":"11 \\times 11"}]},{"type":"formatted","text":"，后面卷积层的卷积核依次递减为 "},{"type":"inline-math","tex":"5 \\times 5","children":[{"type":"formatted","text":"5 \\times 5"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"3 \\times 3","children":[{"type":"formatted","text":"3 \\times 3"}]},{"type":"formatted","text":"，在在第一层、第二层和第五层后面加上了大小为 "},{"type":"inline-math","tex":"3 \\times 3","children":[{"type":"formatted","text":"3 \\times 3"}]},{"type":"formatted","text":"，步幅为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 的最大池化层。在网络的后部分使用了三个全连接层，前两个全连接层的输出为 "},{"type":"inline-math","tex":"4096","children":[{"type":"formatted","text":"4096"}]},{"type":"formatted","text":"，最后一个全连接层的输出为 "},{"type":"inline-math","tex":"1000","children":[{"type":"formatted","text":"1000"}]},{"type":"formatted","text":"，也是 ImageNet 比赛中的图片的总类别数。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/毕业论文-AlexNet.43wqiryxroo.webp","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"net = nn.Sequential(\n    # 这里，我们使用一个11*11的更大窗口来捕捉对象。\n    # 同时，步幅为4，以减少输出的高度和宽度。\n    # 另外，输出通道的数目远大于LeNet\n    nn.Conv2d(1, 96, kernel_size=11, stride=4, padding=1), nn.ReLU(),\n    nn.MaxPool2d(kernel_size=3, stride=2),\n    # 减小卷积窗口，使用填充为2来使得输入与输出的高和宽一致，且增大输出通道数\n    nn.Conv2d(96, 256, kernel_size=5, padding=2), nn.ReLU(),\n    nn.MaxPool2d(kernel_size=3, stride=2),\n    # 使用三个连续的卷积层和较小的卷积窗口。\n    # 除了最后的卷积层，输出通道的数量进一步增加。\n    # 在前两个卷积层之后，汇聚层不用于减少输入的高度和宽度\n    nn.Conv2d(256, 384, kernel_size=3, padding=1), nn.ReLU(),\n    nn.Conv2d(384, 384, kernel_size=3, padding=1), nn.ReLU(),\n    nn.Conv2d(384, 256, kernel_size=3, padding=1), nn.ReLU(),\n    nn.MaxPool2d(kernel_size=3, stride=2),\n    nn.Flatten(),\n    # 这里，全连接层的输出数量是LeNet中的好几倍。使用dropout层来减轻过拟合\n    nn.Linear(6400, 4096), nn.ReLU(),\n    nn.Dropout(p=0.5),\n    nn.Linear(4096, 4096), nn.ReLU(),\n    nn.Dropout(p=0.5),\n    # 最后是输出层。由于这里使用Fashion-MNIST，所以用类别数为10，而非论文中的1000\n    nn.Linear(4096, 10)\n)","language":"py","uuid":"d5c142b9-32f9-4127-9b0f-752ebe4b8a2a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"VGG 首次提出了块的概念，通过连接块来组成一个网络。VGG 的块由若干个卷积层和一个最大池化层组成。VGG 块使用若干个填充为 "},{"type":"inline-math","tex":"1","children":[{"type":"formatted","text":"1"}]},{"type":"formatted","text":" 的 "},{"type":"inline-math","tex":"3 \\times 3","children":[{"type":"formatted","text":"3 \\times 3"}]},{"type":"formatted","text":" 的卷积层，填充为 "},{"type":"inline-math","tex":"1","children":[{"type":"formatted","text":"1"}]},{"type":"formatted","text":" 可以保持输入输出的特征的高宽不会发生改变。通过组合若干个 VGG 块，然后再末尾连接若干全连接层，便形成了 VGG 网络。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/毕业论文-VGG.1ro5rbog8lr4.webp","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"def vgg_block(num_convs, in_channels, out_channels):\n    layers = []\n    for _ in range(num_convs):\n        layers.append(nn.Conv2d(in_channels, out_channels,\n                                kernel_size=3, padding=1))\n        layers.append(nn.ReLU())\n        in_channels = out_channels\n    layers.append(nn.MaxPool2d(kernel_size=2, stride=2))\n    return nn.Sequential(*layers)","language":"py","uuid":"770d705d-daed-4a27-9450-b16418233351","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"GoogleNet 首次提出并行网络结构，在以往的研究中，卷积层应该使用多大的卷积核，大家没有一个统一的标准，小到 "},{"type":"inline-math","tex":"1 \\times 1","children":[{"type":"formatted","text":"1 \\times 1"}]},{"type":"formatted","text":"，大到 "},{"type":"inline-math","tex":"11 \\times 11","children":[{"type":"formatted","text":"11 \\times 11"}]},{"type":"formatted","text":"。GoogleNet 提出了一个新的想法，通过组合不同大小的卷积核可能是最有效的。在 GoogleNet 中最核心的是被称为 Inception 的块，它由四个并行模块组成。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/毕业论文-GoogleNet.k7yl763xddo.webp","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"前三条路径使用 "},{"type":"inline-math","tex":"1 \\times 1","children":[{"type":"formatted","text":"1 \\times 1"}]},{"type":"formatted","text":"、"},{"type":"inline-math","tex":"3 \\times 3","children":[{"type":"formatted","text":"3 \\times 3"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"5 \\times 5","children":[{"type":"formatted","text":"5 \\times 5"}]},{"type":"formatted","text":" 的卷积来提取图像中的特征，第二条路径和第三条路径首先使用了 "},{"type":"inline-math","tex":"1 \\times 1","children":[{"type":"formatted","text":"1 \\times 1"}]},{"type":"formatted","text":" 的卷积层，来减少通道数，减少模型的复杂度；第四条路径使用了 "},{"type":"inline-math","tex":"3 \\times 3","children":[{"type":"formatted","text":"3 \\times 3"}]},{"type":"formatted","text":" 最大池化层，然后使用了一个 "},{"type":"inline-math","tex":"1 \\times 1","children":[{"type":"formatted","text":"1 \\times 1"}]},{"type":"formatted","text":" 的卷积层来改变通道数。最后四个通道通过通道合并层进行连接，构成整个 Inception 块的输出。"}],"disableDrag":false},{"type":"code-block","code":"class Inception(nn.Module):\n    # c1--c4是每条路径的输出通道数\n    def __init__(self, in_channels, c1, c2, c3, c4, **kwargs):\n        super(Inception, self).__init__(**kwargs)\n        # 线路1，单1x1卷积层\n        self.p1_1 = nn.Conv2d(in_channels, c1, kernel_size=1)\n        # 线路2，1x1卷积层后接3x3卷积层\n        self.p2_1 = nn.Conv2d(in_channels, c2[0], kernel_size=1)\n        self.p2_2 = nn.Conv2d(c2[0], c2[1], kernel_size=3, padding=1)\n        # 线路3，1x1卷积层后接5x5卷积层\n        self.p3_1 = nn.Conv2d(in_channels, c3[0], kernel_size=1)\n        self.p3_2 = nn.Conv2d(c3[0], c3[1], kernel_size=5, padding=2)\n        # 线路4，3x3最大汇聚层后接1x1卷积层\n        self.p4_1 = nn.MaxPool2d(kernel_size=3, stride=1, padding=1)\n        self.p4_2 = nn.Conv2d(in_channels, c4, kernel_size=1)\n\n    def forward(self, x):\n        p1 = F.relu(self.p1_1(x))\n        p2 = F.relu(self.p2_2(F.relu(self.p2_1(x))))\n        p3 = F.relu(self.p3_2(F.relu(self.p3_1(x))))\n        p4 = F.relu(self.p4_2(self.p4_1(x)))\n        # 在通道维度上连结输出\n        return torch.cat((p1, p2, p3, p4), dim=1)","language":"py","uuid":"9ba1e8a9-9def-4a26-b348-64aa2f127d2b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"随着网络层数的增多，性能应当越来越好，至少不应当比浅层的网络差，因为最糟的情况就是后面的层学习学习到的是恒等映射，性能与浅层网络相当，而不会更差，但是实际越与此相反，随着网络层数的增加，性能反而下降。根据此想法，何凯明等人提出了 ResNet 很好的解决了网络的深度的问题，ResNet 的核心是残差块。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"残差块由两个 "},{"type":"inline-math","tex":"3 \\times 3","children":[{"type":"formatted","text":"3 \\times 3"}]},{"type":"formatted","text":" 的卷积层组成，每个卷积层之后都应用了 ReLU 激活函数，除此之外，我们在输入与输出之间引入了一条“高速公路”，可以加快模型的收敛速率，考虑到卷积层可能改变输入特征的通道大小，为了能使得输出特征与输入特征进行相加，需要对输入特征投影，"},{"type":"inline-math","tex":"1 \\times 1","children":[{"type":"formatted","text":"1 \\times 1"}]},{"type":"formatted","text":" 的卷积层只改变特征的通道数，而不改变特征的大小，所以 "},{"type":"inline-math","tex":"1 \\times 1","children":[{"type":"formatted","text":"1 \\times 1"}]},{"type":"formatted","text":" 的卷积层可以使得输入特征的通道与输出特征的通道数相同，从而实现相加。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/毕业论文-ResNet.36rv0eqmiiq0.webp","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"class Residual(nn.Module):\n    def __init__(self, input_channels, num_channels, use_1x1conv=False, strides=1):\n        super(Residual, slef).__init__()\n        self.conv1 = nn.Conv2d(input_channels, num_channels,\n                               kernel_size=3, padding=1, stride=strides)\n        self.conv2 = nn.Conv2d(num_channels, num_channels,\n                               kernel_size=3, padding=1)\n        if use_1x1conv:\n            self.conv3 = nn.Conv2d(input_channels, num_channels,\n                                   kernel_size=1, stride=strides)\n        else:\n            self.conv3 = None\n        self.bn1 = nn.BatchNorm2d(num_channels)\n        self.bn2 = nn.BatchNorm2d(num_channels)\n\n    def forward(self, X):\n        Y = F.relu(self.bn1(self.conv1(X)))\n        Y = self.bn2(self.conv2(Y))\n        if self.conv3:\n            X = self.conv3(X)\n        Y += X\n        return F.relu(Y)","language":"py","uuid":"1cc43ee2-b4e3-46e6-8c9d-b66706e828bc","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"生成对抗网络"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"生成对抗网络由 Goodfellow 等人于 2014 年提出，不同于一般的卷积神经网络，生成对抗网络的目的是学习出目标对象的数据分布，它包含两个模块，生成器和判别器，其总体模型架构如下所示。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/开题报告-生成对抗网络.4elncrqf0qo0.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"生成器的作用是根据输入的确定的数据分布，通过数据的学习，将确定的数据分布映射到真实的数据分布，一般输入的随机噪声符合高斯分布或者均匀分布，加入随机噪声作为输入是为了控制输出的多样性，生成器的输出是符合真实数据分布的图像。判别器的作用是判别输入的图像的真假，生成器生成的图像是假图像，实际用于训练的目标图像为真图像。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"判别器的输出是输入图像为真实图像的概率，生成器的目的是使其生成的图像通过判别器时，输出的概率值尽可能的大，而判别器的职责是要尽可能地分辨率出输入图像的真假，二者之间的目标是矛盾的，可以将生成器和判别器比喻为假币机和验钞机，假币机希望它造出的假币能骗过验钞机，而验钞机则要尽最大可能的分辨真假，正是这种对抗的关系，这种网络被称为生成对抗网络。二者在对抗中不断的进化，当判别器无法区分真假时，说明生成器生成的图像可以以假乱真，也就是说生成器学习到了目标图像的数据分布，训练的目的就达成了。"}],"disableDrag":false},{"type":"html-block","html":"<div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;\">\n  <img style=\"width: 150px;\" src=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/1.1fxuiuckbhls.webp\" style=\"zoom: 50%;\" />\n  <img style=\"width: 150px;\" src=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/2.brb9w1w5e74.webp\" />\n  <img style=\"width: 150px;\" src=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/3.1mtad4z301r4.webp\" />\n</div>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以前往"},{"type":"link","url":"https://thispersondoesnotexist.com","openEdit":false,"children":[{"type":"formatted","text":"这个网站"}]},{"type":"formatted","text":"查看。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"上图描述的是原始的生成对抗网络，使用随机噪声作为输入，使用随机噪声会导致生成的图片由噪声控制，这个是不可控的，图像生成过于自由，必须添加条件加以限制，使得输出可以控制，这需要为生成器的输入添加额外的条件，这便是条件生成对抗网络。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/开题报告-条件生成对抗网络.5suxake2n3k0.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://phillipi.github.io/pix2pix/","openEdit":false,"children":[{"type":"formatted","text":"pix2pix"}]},{"type":"formatted","text":" 使用条件生成对抗网络(cGAN)来实现图片到图片的转换"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/image-20221120152059469.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://junyanz.github.io/CycleGAN/","openEdit":false,"children":[{"type":"formatted","text":"CycleGAN"}]},{"type":"formatted","text":" 使用 cGAN 实现图像之间的互相转换"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/image-20221120152342987.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"补充说明"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"一些说明："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"讲的都是比较老的技术，2015 年，现在大家都用 Transformer 了"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"讲的都是图像处理的工作，还有很多自然语言处理的工作，比如机器翻译，情感分析等等"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"讲的都是监督学习的工作，现在大家也在努力探索无监督学习，弱监督学习，小数据学习"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"还有很多有趣的工作，比如最近多模态的工作也比较火，同时使用文本、声音、图像训练，比如，CLIP、Stable Diffusion"}],"disableDrag":false}]}]}],"tags":["深度学习","多层感知机","卷积神经网络","生成对抗网络","手写数字识别"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-q6jvjl_572c0968-cf16-4e2a-81e7-481e54e08394.jpg","createTime":1695222148471,"updateTime":1743303640466},"meta":{"type":"article","publishTime":1764820859517}};
