    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":9,"title":"方程与框图的转换","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"在信号与系统中我们很容易碰到这种题目，给出框图，列出微分(差分方程)或者给出方程，画出框图，有进一步的还要求列出状态方程。这个问题一开始刚接触时确实令我听挺烦恼的，因为一开始没有抓住诀窍，后来想通了，便觉得十分的简单，现在这里记录一二，以便以后用起时方便查询。"}]},{"type":"header","children":[{"type":"formatted","text":"原理概述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先我们要明白下面这么一个事实，若(以连续时间系统为例，离散同理)"}]},{"type":"block-math","tex":"x(t) \\rightarrow y(t) \\Rightarrow x^{'}(t) \\rightarrow y^{'}(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"以及若"}]},{"type":"block-math","tex":"\\begin{aligned}\nx_1(t) &\\rightarrow y_1(t) \\\\\nx_2(t) &\\rightarrow y_2(t)\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"则"}]},{"type":"block-math","tex":"x_1(t) + x_2(t) \\rightarrow y_1(t) + y_2(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在明白上面的事实的基础上，那么对于一般的微分方程(以二阶为例)"}]},{"type":"block-math","tex":"y^{''}(t) + a_1y^{'}(t) + a_0y(t) = b_2x^{''}(t) + b_1x^{'}(t) + b_0x(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的式子可以化为"}]},{"type":"block-math","tex":"\\begin{aligned}\n\\lambda^{''}(t) + a_1\\lambda^{'}(t) + a_0\\lambda(t) = x(t) \\\\\ny(t) = b_2\\lambda^{''}(t) + b_1\\lambda^{'}(t) + b_0\\lambda(t)\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的式子很容易理解，由"}]},{"type":"block-math","tex":"\\lambda^{''}(t) + a_1\\lambda^{'}(t) + a_0\\lambda(t) = x(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"知"}]},{"type":"block-math","tex":"x(t) \\rightarrow \\lambda(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"则根据上面的铺垫，得"}]},{"type":"block-math","tex":"b_2x^{''}(t) + b_1x^{'}(t) + b_0x(t) \\rightarrow b_2\\lambda^{''}(t) + b_1\\lambda^{'}(t) + b_0\\lambda(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以"}]},{"type":"block-math","tex":"y(t) = b_2\\lambda^{''}(t) + b_1\\lambda^{'}(t) + b_0\\lambda(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"至此原理已经讲完，下面讲如何根据上面两个式子得到框图。"}]},{"type":"header","children":[{"type":"formatted","text":"得到框图"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"先明确一点，我们在实际中用的都是积分器，为什么不用微分器，因为微分器会把噪声放大。因为这是一个二阶方程，所以需要两个积分器，如下"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/%E6%96%B9%E7%A8%8B%E4%B8%8E%E6%A1%86%E5%9B%BE1.3o2g6f2cipi0.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"根据第一个方程"}]},{"type":"block-math","tex":"\\lambda^{''}(t) + a_1\\lambda^{'}(t) + a_0\\lambda(t) = x(t) \\Rightarrow \\lambda^{''}(t) = -a_1\\lambda^{'}(t) - a_0\\lambda(t) + x(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"很容易得到这么一个框图"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/%E6%96%B9%E7%A8%8B%E4%B8%8E%E6%A1%86%E5%9B%BE-%E7%AC%AC-2-%E9%A1%B5.5vo58xafbsg0.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"根据"}]},{"type":"block-math","tex":"y(t) = b_2\\lambda^{''}(t) + b_1\\lambda^{'}(t) + b_0\\lambda(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以得到"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/%E6%96%B9%E7%A8%8B%E4%B8%8E%E6%A1%86%E5%9B%BE-%E7%AC%AC-3-%E9%A1%B5.n82ocv6d49c.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"总结"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"所以综上，方程"}]},{"type":"block-math","tex":"y^{''}(t) + a_1y^{'}(t) + a_0y(t) = b_2x^{''}(t) + b_1x^{'}(t) + b_0x(t)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对应的框图为"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2022/raw/master/%E6%96%B9%E7%A8%8B%E4%B8%8E%E6%A1%86%E5%9B%BE-%E7%AC%AC-3-%E9%A1%B5.n82ocv6d49c.png","children":[{"type":"formatted","text":""}]}],"tags":["数字信号处理","Z变换","差分方程","方框图"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-o37o8l_f8704f80-fa26-4679-8b91-0eecce909c3a.jpg","createTime":1571040840000,"updateTime":1743303640462},"meta":{"type":"article","publishTime":1764774821982}};
