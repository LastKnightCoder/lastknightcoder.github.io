    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":21,"title":"移动端文字垂直居中方案","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"有过移动端开发经验的人，想必都对文字垂直居中头痛不已，因为使用常规手段实现文字垂直居中在部分 Android 手机上会出现文字偏上的情况，往往需要配合 line-height 或者 padding 进行微调，苦不堪言。"}]},{"type":"header","children":[{"type":"formatted","text":"方案调研"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"下面是我尝试的几种文字垂直居中方案。"}]},{"type":"header","children":[{"type":"formatted","text":"line-height"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"line-height 实现垂直居中:"}]},{"type":"code-block","code":"<div id=\"line-height\">查看更多</div>","language":"html","uuid":"8ad192be-8e63-4262-ac56-332ea983bf3c","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"#line-height {\n  width: 200px;\n  text-align: center;\n  \n  height: 56px;\n  line-height: 56px;\n  \n  font-size: 26px;\n  color: black;  \n  \n  border: 1px solid;\n  border-radius: 28px;\n}","language":"css","uuid":"e30e43ed-ab41-4d55-98d8-7897b407a3d2","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"display: flex"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"display: flex 实现垂直居中："}]},{"type":"code-block","code":"<div id=\"flex\">查看更多</div>","language":"html","uuid":"034345f4-ef7e-4e08-9a55-20f3b10f6264","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"#flex {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: 200px;\n  height: 56px;\n  font-size: 26px;\n  color: black;\n  border: 1px solid;\n  border-radius: 28px;\n}","language":"css","uuid":"34bbf195-afda-4d56-9728-19fbaca81950","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"padding"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"padding 实现垂直居中："}]},{"type":"code-block","code":"<div id=\"padding\">查看更多</div>","language":"html","uuid":"7ed9c4bf-58aa-407f-ba83-2b7876ca0028","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"#padding {\n  width: 200px;\n  text-align: center;\n  box-sizing: border-box;\n  height: 56px;\n  font-size: 26px;\n  line-height: 1;\n  padding: 15px 0;\n  color: black;\n  border: 1px solid;\n  border-radius: 28px;\n}","language":"css","uuid":"018325c8-29b4-49ce-af9e-d5e8d6f0855f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Canvas"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"Canvas 实现垂直居中："}]},{"type":"code-block","code":"<div id=\"canvas-container\">\n  <canvas id=\"canvas\" width=\"200\" height=\"56\"></canvas>\n</div>","language":"html","uuid":"efd5d1c1-2fd8-47af-8e98-ece4749f5287","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"#canvas-container {\n  width: 200px;\n  height: 56px;\n  color: black;\n  border: 1px solid;\n  border-radius: 28px;\n}\n#canvas {\n  width: 200px;\n  height: 56px;\n}","language":"css","uuid":"b8809566-2042-4dbe-9db7-2da703e9ab91","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"const canvas = document.querySelector('#canvas');\nconst ctx = canvas.getContext('2d');\n\n// 解决高清屏模糊的问题\nconst computedStyle = window.getComputedStyle(canvas);\nconst dpr = window.devicePixelRatio;\ncanvas.width = parseFloat(computedStyle.width) * dpr;\ncanvas.height = parseFloat(computedStyle.height) * dpr;\nctx.scale(dpr, dpr);\n\nconst text = '查看更多';\nconst fontSize = 26;\nctx.font = `${fontSize}px normal`;\nconst textWidth = ctx.measureText(text).width;\n// 这里的 0.75 是因为基线在行框盒子之上，大约是 10%-15%，这里取 12.5%\nctx.fillText(text, (canvas.width / dpr - textWidth) / 2, (canvas.height / dpr + 0.75 * fontSize) / 2);","language":"js","uuid":"e2a3cbac-62f1-43b3-85e6-d534e5949447","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"SVG"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"SVG 实现垂直居中："}]},{"type":"code-block","code":"<div id=\"svg-container\">\n  <svg width=\"200\" height=\"56\" viewBox=\"0 0 200 56\">\n    <text\n      text-anchor=\"middle\"\n      fill=\"currentColor\"\n      x=\"100\"\n      y=\"37.75\"\n      font-size=\"26\"\n    >\n      查看更多\n    </text>\n  </svg>\n</div>","language":"html","uuid":"21f7b673-388b-4d33-85ab-42f71a6cc95a","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"#svg-container {\n  width: 200px;\n  height: 56px;\n  color: black;\n  border: 1px solid;\n  border-radius: 28px;\n}","language":"css","uuid":"8316fbcd-fabf-4ffc-8254-7be7c54b72ed","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么移动端的文字这么难以居中，这是因为行高 "},{"type":"formatted","text":"line-height","code":true},{"type":"formatted","text":" 导致的，一般而言，当 "},{"type":"formatted","text":"line-height","code":true},{"type":"formatted","text":" 大于字体大小时，字体的上下间距应当是平分的，但是在部分机型却不是这样，如 HONOR 20 Pro 中出现上面的距离小于下面的距离。但是当设置 "},{"type":"formatted","text":"line-height: normal","code":true},{"type":"formatted","text":" 时，即默认值，会惊讶的发现字体上下间距近乎相等，所以如果使得文字垂直居中，一定不要设置 "},{"type":"formatted","text":"line-height","code":true},{"type":"formatted","text":"。"}]},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在 《CSS世界》中有描述，上下间距不能为小数，如果无法平分，则上间距进行向下取整，下间距进行向上取整，因此下边距和大于上边距，从而导致文字偏上。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的前两种方案 "},{"type":"formatted","text":"line-height","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"padding","code":true},{"type":"formatted","text":" 都设置了 "},{"type":"formatted","text":"line-height","code":true},{"type":"formatted","text":"，因此在移动端会偏上。而 "},{"type":"formatted","text":"display: flex","code":true},{"type":"formatted","text":" 没有设置 "},{"type":"formatted","text":"line-height","code":true},{"type":"formatted","text":"，有近乎居中的效果，但是还是有误差，在不同的机型上还是有不同的表现。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过在不同机型上的对比，发现 Canvas 和 SVG 的方案在各个机型下面均保持一致的居中效果，因此决定将其抽离为一个 React 组件，下面就详细讲解该组件的开发思路。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"本文以 SVG 为例，Canvas 开发思路是一样的，在文章的最后给出 Canvas 的实现，供以参考。"}]},{"type":"header","children":[{"type":"formatted","text":"组件设计"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"组件设计为需要四个参数："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"height","code":true},{"type":"formatted","text":"：容器高度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"fontSize","code":true},{"type":"formatted","text":"：字体大小"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"text","code":true},{"type":"formatted","text":"：文字内容"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"color","code":true},{"type":"formatted","text":"：文字颜色"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这四个参数是必须传递的，使用方法如下："}]},{"type":"code-block","code":"<TextMiddle \n  fontSize={28} \n  height={60} \n  color={'deepskyblue'} \n  text={'查看更多'} \n/>","language":"jsx","uuid":"687a9964-10d7-4a10-a201-1fc3be8ce07b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"除了上面四个属性，还支持传递可选的 "},{"type":"formatted","text":"className","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"style","code":true},{"type":"formatted","text":"。"}]},{"type":"header","children":[{"type":"formatted","text":"SVG 垂直居中原理"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在 SVG 中通过 text 标签来显示文字，可以通过 x 和 y 属性来设置文字的位置，这里我们关注到 y，它设置的是文字基线在 SVG 画布中的位置"}]},{"type":"code-block","code":"<svg width=\"200\" height=\"60\" viewBox=\"0 0 200 60\">\n  <text font-size=\"26\" fill=\"currentColor\" y=\"37.75\">\n    查看更多\n  </text>\n</svg>","language":"html","uuid":"a351b877-288d-4d77-9b14-86effb3bf662","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里 y 的计算是 "},{"type":"formatted","text":"y=\"(height + 0.75 * fontSize) / 2\"","code":true},{"type":"formatted","text":"，因为这里 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 指的是文字基线的位置，而基线是比文字的底部要高的，参考下图"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/image.75qa29adc040.webp","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"字母 x 的底部就是基线的位置，它距离行框盒子底部有一段距离，这个距离与字体大小成比例，与字体大小有关，这个比例不妨设为 r，那么 y 的计算公式为"}]},{"type":"block-math","tex":"y = \\frac{\\text{height} + \\text{fontSize}}{2} - \\text{r} \\times \\text{fontSize} = \\frac{\\text{height} + (1 - 2\\text{r})\\text{fontSize}}{2}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"经调研，比例 r 与字体有关，分布在 10% - 15%，这里我们取 12.5%，所以 "}]},{"type":"block-math","tex":"y = \\frac{\\text{height} + 0.75 \\times \\text{fontSize}}{2}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于不同的字体，最大的误差为 2.5% 的字体大小，也就是说字体大小 "},{"type":"formatted","text":"40px","code":true},{"type":"formatted","text":" 才会有 "},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":" 的误差，移动端的字体大小少有超过 "},{"type":"formatted","text":"15px","code":true},{"type":"formatted","text":" 的，最大误差连半个像素都不到，可实现不同平台上的伪居中。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"根据上面的原理，可以写出第一版的 "},{"type":"formatted","text":"TextMiddle","code":true},{"type":"formatted","text":" 实现"}]},{"type":"code-block","code":"import React, { useEffect, useRef } from \"react\";\n\nconst TextMiddle = props => {\n  const { height, fontSize, color, text, className = '', style = {} } = props;\n  const container = useRef();\n\n  const actualStyle = {\n    ...style,\n    height,\n    fontSize,\n    color\n  };\n\n  useEffect(() => {\n    const computedStyle = window.getComputedStyle(container.current);\n    const actualHeight = parseFloat(computedStyle.height);\n    const actualFontSize = parseFloat(computedStyle.fontSize);\n    const actualWidth = parseFloat(computedStyle.width);\n\n    const svg = `\n      <svg width=\"${actualWidth}\" height=\"${actualHeight}\" viewBox=\"0 0 ${actualWidth} ${actualHeight}\">\n        <text\n          font-size=\"${actualFontSize}\"\n          fill=\"currentColor\"\n          y=\"${(actualHeight + 0.75 * actualFontSize) / 2}\"\n        >\n          ${text}\n        </text>\n      </svg>\n    `;\n    container.current.innerHTML = svg;\n  }, [text]);\n\n  return (\n    <div ref={container} className={className} style={actualStyle}>\n      {text}\n    </div>\n  )\n}\n\nexport default TextMiddle;","language":"jsx","uuid":"0dc148ea-6698-4d51-b01a-924cd20051ca","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"文字超出"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"事情到这还没有结束，我们使用 SVG 这种方案是有缺点的，那就是缺失了流动性，文字只能一行展示，不会换行，多余的文字会被隐藏不可见。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑在实际开发中，一般都是单行文本实现垂直居中，所以就不对换行进行处理，但是文字超出还是比较常见的，所以有必要对文字超出进行进行处理，这里对超出的文字使用 ... 代替。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么判断文字是否超出了呢？我们需要知道文字的长度，如果文字的长度大于容器的长度，就说明超出了，这个时候我们需要进行打点。可以通过 Canvas 的 "},{"type":"formatted","text":"measureText","code":true},{"type":"formatted","text":" 来获得文本的宽度"}]},{"type":"code-block","code":"const canvas = document.createElement('canvas');\nconst ctx = canvas.getContext('2d');\nconst getTextLength = (text, fontSize) => {\n  ctx.font= `${fontSize}px normal`;\n  const metrics = ctx.measureText(text);\n  return parseInt('' + metrics.width);\n}","language":"js","uuid":"dc58f99a-2bf5-48c1-be18-f486b9341e79","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里对文字的长度进行了取整，这是因为在小数部分存在误差，因此我们也需要对容器的长度进行取整，由于取整之后，可能存在 "},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":" 的误差，因此我们需要设置容器的宽度为取整后 "},{"type":"formatted","text":"+1","code":true}]},{"type":"code-block","code":"const actualWidth = parseInt(computedStyle.width) + 1;\nconst textLength = getTextLength(text, actualFontSize);\nif (textLength > actualWidth) {\n  // 文字超出处理\n}","language":"js","uuid":"793236fd-102e-4780-9331-afc9dea41821","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接下来我们只需要计算超出的文字分界点，然后进行截断"}]},{"type":"code-block","code":"const actualWidth = parseInt(computedStyle.width) + 1;\nconst textLength = getTextLength(text, actualFontSize);\nlet actualText = text;\n// 计算截断点以及实际文本\nif (textLength > actualWidth) {\n  actualText = text.slice(0, 1) + '...';\n  for (let i = 1; i < text.length; i++) {\n    const adjustText = text.slice(0, i) + '...';\n    const adjustWidth = getTextLength(adjustText, actualFontSize);\n    if (adjustWidth > actualWidth) {\n      break;\n    }\n    actualText = adjustText;\n  }\n}\nconst svg = `\n  <svg width=\"${actualWidth}\" height=\"${actualHeight}\" viewBox=\"0 0 ${actualWidth} ${actualHeight}\">\n    <text\n      font-size=\"${actualFontSize}\"\n      fill=\"currentColor\"\n      y=\"${(actualHeight + 0.75 * actualFontSize) / 2}\"\n    >\n      ${actualText}\n    </text>\n  </svg>\n`;\ncontainer.current.innerHTML = svg;","language":"JSX","uuid":"93f9ba34-7e0d-4cf3-af28-b1be65e871f1","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"性能优化"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"当页面上有太多的 SVG 要渲染时，会有较大的白屏时间，经测试，同时有 1000 个 SVG 渲染，将会有接近 1s 的白屏时间，这个是不可接受的，我们可以通过 "},{"type":"formatted","text":"IntersectionObserver","code":true},{"type":"formatted","text":" 来进行一个性能优化，只有当该组件即将出现在视口中时，我们才渲染为 SVG。"}]},{"type":"code-block","code":"const svg = `\n  <svg width=\"${actualWidth}\" height=\"${actualHeight}\" viewBox=\"0 0 ${actualWidth} ${actualHeight}\">\n    <text\n      font-size=\"${actualFontSize}\"\n      fill=\"currentColor\"\n      y=\"${(actualHeight + 0.75 * actualFontSize) / 2}\"\n    >\n      ${actualText}\n    </text>\n  </svg>\n`;\nconst observer = new IntersectionObserver(entries => {\n  entries.forEach(entry => {\n    // 进入视口时或已经在视口中\n    if (entry.isIntersecting) {\n      container.current.innerHTML = svg;\n      // 取消监听\n      observer.unobserve(container.current);\n    }\n  })\n}, {\n  // 视口范围向下扩大 500px，提前加载\n  rootMargin: '0px 0px 500px 0px'\n});\nobserver.observe(container.current);","language":"jsx","uuid":"e0336831-d6d0-4420-8e8a-3555be906d05","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一个就是对于苹果手机，我们没有必要使用 SVG 的方案，因为苹果手机的兼容性很好，对于苹果手机就使用设置行高等于高度的方案"}]},{"type":"code-block","code":"const isIos = /ipad|iphone|macintosh/gim.test(window.navigator.userAgent);\nconst actualStyle = {\n  overflow: 'hidden',\n  whiteSpace: 'nowrap',\n  textOverflow: 'ellipsis',\n  ...style,\n  height,\n  lineHeight: height + 'px',\n  fontSize,\n  color\n};\n\nuseEffect(() => {\n  if (isIos) {\n    return;\n  }\n  // ... 其它逻辑\n}, []);","language":"jsx","uuid":"6b7d19f0-f24d-49d7-8f74-3aeff007c425","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"最终代码"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"SVG"}],"level":3},{"type":"code-block","code":"import React, { useEffect, useRef } from \"react\";\n\nconst canvas = document.createElement('canvas');\nconst ctx = canvas.getContext('2d');\nconst getTextLength = (text, fontSize) => {\n  ctx.font= `${fontSize}px normal`;\n  const metrics = ctx.measureText(text);\n  return parseInt('' + metrics.width);\n}\n\nconst TextMiddle = props => {\n  const { height, fontSize, color, text, className = '', style = {} } = props;\n  const container = useRef();\n  const isIos = /ipad|iphone|macintosh/gim.test(window.navigator.userAgent);\n  const actualStyle = {\n    overflow: 'hidden',\n    whiteSpace: 'nowrap',\n    textOverflow: 'ellipsis',\n    ...style,\n    height,\n    lineHeight: height + 'px',\n    fontSize,\n    color\n  };\n\n  useEffect(() => {\n    if (isIos) {\n      return;\n    }\n    const computedStyle = window.getComputedStyle(container.current);\n    const actualHeight = parseFloat(computedStyle.height);\n    const actualFontSize = parseFloat(computedStyle.fontSize);\n    const actualWidth = parseInt(computedStyle.width) + 1;\n    const textLength = getTextLength(text, actualFontSize);\n    let actualText = text;\n    if (textLength > actualWidth) {\n      actualText = text.slice(0, 1) + '...';\n      for (let i = 1; i < text.length; i++) {\n        const adjustText = text.slice(0, i) + '...';\n        const adjustWidth = getTextLength(adjustText, actualFontSize);\n        if (adjustWidth > actualWidth) {\n          break;\n        }\n        actualText = adjustText;\n      }\n    }\n\n    const svg = `\n      <svg width=\"${actualWidth}\" height=\"${actualHeight}\" viewBox=\"0 0 ${actualWidth} ${actualHeight}\">\n        <text\n          font-size=\"${actualFontSize}\"\n          fill=\"currentColor\"\n          y=\"${(actualHeight + 0.75 * actualFontSize) / 2}\"\n        >\n          ${actualText}\n        </text>\n      </svg>\n    `;\n    const observer = new IntersectionObserver(entries => {\n      entries.forEach(entry => {\n        // 进入视口时或已经在视口中\n        if (entry.isIntersecting) {\n          container.current.innerHTML = svg;\n          observer.unobserve(container.current);\n        }\n      })\n    }, {\n      // 视口范围向下扩大 500px，提前加载\n      rootMargin: '0px 0px 500px 0px'\n    });\n    observer.observe(container.current);\n  }, [text]);\n\n  return (\n    <div ref={container} className={className} style={actualStyle}>\n      {text}\n    </div>\n  )\n}\n\nexport default TextMiddle;","language":"jsx","uuid":"6db12292-407a-48f7-8356-ab5719d00723","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Canvas"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"Canvas 的实现思路同 SVG，不多赘述。"}]},{"type":"code-block","code":"import React, { useEffect, useRef } from \"react\";\n\nconst isIos = /ipad|iphone|macintosh/gim.test(window.navigator.userAgent);\n\nconst canvas = document.createElement('canvas');\nconst ctx = canvas.getContext('2d');\nconst getTextLength = (text, fontSize) => {\n  ctx.font= `${fontSize}px normal`;\n  const metrics = ctx.measureText(text);\n  return parseInt('' + metrics.width);\n}\n\nconst TextMiddle = props => {\n  const { text, color, height, fontSize, className = '', style = {} } = props;\n  const container = useRef();\n\n  const actualStyle = {\n    overflow: 'hidden',\n    whiteSpace: 'nowrap',\n    textOverflow: 'ellipsis',\n    ...style,\n    height,\n    lineHeight: height + 'px',\n    fontSize,\n    color\n  };\n\n  useEffect(() => {\n    if (isIos) {\n      return;\n    }\n\n    const computedStyle = window.getComputedStyle(container.current);\n    const actualHeight = parseFloat(computedStyle.height);\n    const actualFontSize = parseFloat(computedStyle.fontSize);\n    const actualWidth = parseInt(computedStyle.width) + 1;\n    \n    // 高分屏模糊处理\n    const canvas = document.createElement('canvas');\n    const ctx = canvas.getContext('2d');\n    canvas.style.width = actualWidth + 'px';\n    canvas.style.height = actualHeight + 'px';\n    const dpr = window.devicePixelRatio;\n    canvas.width = actualWidth * dpr;\n    canvas.height = actualHeight * dpr;\n    ctx.scale(dpr, dpr);\n\n    // 文字超出处理\n    const textLength = getTextLength(text, actualFontSize);\n    let actualText = text;\n    if (textLength > actualWidth) {\n      actualText = text.slice(0, 1) + '...';\n      for (let i = 1; i < text.length; i++) {\n        const adjustText = text.slice(0, i) + '...';\n        const adjustWidth = getTextLength(adjustText, actualFontSize);\n        if (adjustWidth > actualWidth) {\n          break;\n        }\n        actualText = adjustText;\n      }\n    }\n\n    ctx.font = `${actualFontSize}px normal`;\n    ctx.fillStyle = color;\n    ctx.textBaseline = 'bottom';\n    ctx.fillText(actualText, 0, (canvas.height / dpr + 0.75 * actualFontSize) / 2);\n\n    const observer = new IntersectionObserver(entries => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          container.current.removeChild(container.current.firstChild);\n          container.current.append(canvas);\n          observer.unobserve(container.current);\n        }\n      });\n    }, {\n      rootMargin: '0px 0px 500px 0px'\n    });\n    observer.observe(container.current);\n  }, [text, color]);\n\n  return (\n    <div ref={container} className={className} style={actualStyle}>\n      {text}\n    </div>\n  )\n}\n\nexport default TextMiddle;","language":"jsx","uuid":"367296d7-dab7-45ca-af30-b0f2d6975c96","children":[{"type":"formatted","text":""}]}],"tags":["文字垂直居中","SVG","Canvas"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-q6dpyq_4ff3e9b8-46a5-4e81-8009-4a927d74ea29.jpg","createTime":1665973080000,"updateTime":1743303640466},"meta":{"type":"article","publishTime":1764821905621}};
