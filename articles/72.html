refId":616,"href":"/docs/document/14/616.html","title":"Tikz"},"document-item:655":{"contentType":"document-item","refId":655,"href":"/docs/document/14/655.html","title":"Mermaid"},"document-item:620":{"contentType":"document-item","refId":620,"href":"/docs/document/14/620.html","title":"卡片"},"document-item:628":{"contentType":"document-item","refId":628,"href":"/docs/document/14/628.html","title":"微信读书"},"document-item:617":{"contentType":"document-item","refId":617,"href":"/docs/document/14/617.html","title":"Column"},"document-item:641":{"contentType":"document-item","refId":641,"href":"/docs/document/14/641.html","title":"AI 搜索"},"document-item:638":{"contentType":"document-item","refId":638,"href":"/docs/document/14/638.html","title":"同步"},"document-item:648":{"contentType":"document-item","refId":648,"href":"/docs/document/14/648.html","title":"资源存储"},"document-item:635":{"contentType":"document-item","refId":635,"href":"/docs/document/14/635.html","title":"SKILL 管理"}},"content":{"id":72,"title":"2024年终总结","author":"","content":[{"type":"paragraph","children":[{"type":"formatted","text":"2024 这一年终于过去了，以往的开头都是【白驹过隙，时光荏苒】，感觉时间过的飞快，但是今年，却感觉经历了特别多，也经历过低谷，感觉非常的漫长，且听我慢慢道来。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"工作"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"今年的工作经历可太“丰富”了，整年心情的旋律完全随着工作的内容起伏变化，工作内容主要分为三部分："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"端外 M 站"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AI 平台"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"公共出行 & 运动"}],"disableDrag":false}]}]},{"type":"header","children":[{"type":"formatted","text":"M 站"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"端外 M 站其实是我做过最久的工作了，从不熟悉到熟悉，平常的业务需求没什么问题，令我最烦的是老有一些线上问题，这种情况往往意味着未知，让人十分焦虑。另外由于分享专项，M 站作为端外分享落地的一个重要场景，老板突然就关注到了，各种各样的唤端问题，因为老板的一个建议加班到凌晨四点，因为一个线上问题晚上 11. 被叫到公司解决，也是干到凌晨三四点，等等，经历了三四次凌晨加班，其实加班对我来说还好，令人难受的是加班的原因，让人压力山大，年初的那段时间感觉压力很大，总是没由得很焦虑，当时看到钉钉消息都十分的害怕，生怕又有什么问题。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"经过一阵高强度的问题解决后，来到了平静期，现在的日常需求完全能 cover 住，并且还有多余的自己的时间，但是我又产生了新的焦虑，M 站的技术栈太老了，开发起来让人很难受，而且 M 站现在无题可解，或者说解决的都是小问题，我开始为自己的发展考虑，继续做 M 站成长的太慢了，于是开始表达从 M 站业务撤出转到其他业务的诉求。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"表达诉求了决定把抽出来到 WIA，我也开始串 WIA 的需求，甚至开始评工时准备开发了，但是万万没想到产品那边不准备放人，还是分享专项的原因，这个专项对产品来说比较重要，他们以我对 M 站比较熟悉为由，不让我走，于是我被迫继续留在了这里，于是我带着稍摆的心态做着 M 站的业务。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"到了四月份开始聊绩效，回顾去年的工作，我做了很多的事情，并且很多都是有突破的大事，对团队做出了不小的贡献，但是绩效却只给了我一个 3.5，说实话我比较失望，给我涨了 1.5k 的薪资。趁着聊绩效的这个机会我又把轮岗的诉求提了，希望转到别的组，给我的回复等做完这个项目，就把我调到别的组，我当时自然是开心的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是变故发生的就是很突然，突然之间组织架构就进行了调整，把铮哥和以然进行了互换，铮哥带了一部分人走，我以为可以趁着此次机会把我进行调整，但是尘埃落定后我却没有任何的动静，单独找铮哥聊了之后明确我没有变动，那么之前他的承诺当然也不算数了，心情不觉 down 了下来。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是，又有但是，以然刚来时和所有人进行了一个 one one，我又表达了想从 M 站出来的诉求，变化来的很快，不到一周我就从 M 站脱身而出了，当时是真开心，但是没想到开始进入到我人生的一个至暗时刻，进入了第二个业务，AI 平台。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"AI 平台"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我对 AI 的态度从来是用很欢迎，非常积极拥抱，但是开发不行，因为以我对 AI 的了解，我大概知道 AI 的原理，完全是一个黑盒，而我的性格“控制欲”很强，喜欢做有把握的事情，而 AI 我把握不住，所以我对 AI 开发是十分抗拒的，而且由于前两年和 AI 接触带来的阴影，我现在是谈之色变。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是现在我不得不去接触 AI 了，自己给自己做心理工作，让自己不去排斥，但是我没想到压力会这么大，进度催的太快了，每天盯着我看，每周都要有进展，工作时长已经被迫延长了一个小时，这两个月我写了好多的日记，我一般在心情不好的时候才写日记，每天早上上班前是最难熬的，根本不想去上班，每天早上都在 B 站看各种离职视频，各种排解视频，否则实在难以鼓起勇气去上班，此时的我感觉像是变了一个人，一个每天都笑的人，现在脸都是紧绷着的，毫无表情。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"除了进度催的急外，我觉得目标也不明确，总感觉这里打一枪，那里换一炮，每天都在开些无意义的会议，让人疲于应对，在经过连续一两周加班到半夜 12. 后，身体开始不舒服了，眼睛青睫综合征不出意外的发作了，同时心脏感觉不舒服，感觉非常的闷，这天早上盯着窗外思索了好久，下定了决心决定裸辞，首先请了个假去医院做了检查，各种检查下来指标没问题，心脏可能是因为情绪压力大给出的预警。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"第二天我就去摊牌了，直接就说我要辞职，要回去休息，后来又找林哥聊了，一开始我是奔着非走不可的态度去谈的，但是林哥可能是不太相信身体不舒服休息辞职的理由，一直在问到底为什么，没有松口，一直在挽留我，最后说先回去休息一段时间，然后回来再聊，可以转到别的组，我觉得这给的条件不错，心里也有想去的地方了，所以就答应了。在家休息了两个礼拜，回来后我说留下来，因为之前打听到运动不加班，所以我说我想去运动，进入了第三个业务，公共出行和运动。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"公共出行 & 运动"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"来到运动后，好消息是果然不加班，但是融入的过程并不顺利，又有了新的焦虑，不知道是不是上次工作内容带给我的创伤还未痊愈，即使已经比 AI 平台的工作体验好了太多，但是还是有很多焦虑，其中最主要的焦虑来自于团队的一号位呆呆，他真的非常严格，刚来时我真的无法接受和适应，加上上个组带给我的心理状态还未回复，非常容易进入到焦虑的状态。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在这个过程我又屡次萌生了辞职的想法，但是不能像上次那样裸辞，辞职也得找好下家，于是开始准备简历，开始仔细梳理过去两年的工作经历，开始在 Boss 直聘上看机会，一开始我想的是回南昌，但是南昌的岗位实在太少了，薪资给的也太低了，无法接受钱少了这么多，退而求其次看杭州的机会，看了很多发现薪资给的都不及我的预期，能投就只有大厂，而当时我的状态已经有点抗拒去大厂了，不想做这样的螺丝钉，无法抉择，就把简历传上去之后就没怎么管了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"后来随着对团队成员的熟悉，对业务的熟悉，慢慢的融入，熬过了最开始的磨合期，大家对我明显更信任了，现在业务开发的比较舒服，也学到了很多项目上的东西，到十一月份的时候整个人已经完全从焦虑的情绪中摆脱出来了，每天的生活节奏也十分的规律，是我想要的理想状态，当然周一的时候还是非常排斥去上班，哈哈哈。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"期间字节的 HR 也约了我两次面试（字节 HR 是真的主动啊，难怪字节人才多呢），第一次明显准备的不是很好，问到 React 源码上的东西没有答上来，一面就挂了；但是字节的 HR 会一直捞你，安排你面其他的部门，因为当时我打算拿到年终奖在跳，不想这么快，所以就没继续面。后来另一个 HR 给我打电话，虽然我说年后再看，但是她说流程很长，面完年后也差不多了，我想想就面了，这次我准备的很充分，一面问的问题非常基础，和之前的一面问的完全不一样，二面问的非常的深入，最后还是没给 Offer。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"现在我还想跳槽吗，如果能一直保持这样的状态，我觉得没有必要了，但是如果有新的变化呢，前几天就听到产品侧有大的调整，显然会影响到研发侧，我们又会产生什么样的变化呢？所以，可以准备着，一旦准备要跳的时候不会茫然无措。"}],"disableDrag":false},{"type":"highlight-block","color":"purple","children":[{"type":"paragraph","children":[{"type":"formatted","text":"今年的工作经历让我明白了什么叫世事无常，什么叫福祸相依，未来发生的事情谁也说不准，要学会接受生活中的未知性，不追求把握一切，让生命自在流淌。"}],"disableDrag":false}]},{"type":"header","children":[{"type":"formatted","text":"学习"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"看书"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"整理一下今年看完的书"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/b213f77735ed09240f9eb4f780933b1_eec6fe85-b4b0-4720-a323-3132ffc48ae7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/b213f77735ed09240f9eb4f780933b1_eec6fe85-b4b0-4720-a323-3132ffc48ae7.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"看完了 68 本书，虽然看完的书挺多，但是总感觉自己成长不大。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"最近我才明悟到什么叫成长，成长不是看了多少书，写了多少代码，而是你能"},{"type":"formatted","text":"解决更大的问题","color":"#e33a32","darkColor":"#fa7873","bold":true},{"type":"formatted","text":"，如果你能解决更多的问题，解决更大的问题，那么就是成长了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"从这个角度看，虽然我看了这么多的书，但是却没有沉淀多少解决问题的能力，大部分的书都是不求甚解，输入很多，但是输出缺少了很多，今年才写了 12 篇文章，可能和今年的心态有关，无法沉下心来进行输出，大部分的空闲时间不是在内耗，就是在解决内耗😭，12 篇中大部分都是近两个输出的，这两个月压力较小，才有心思去写这些文章。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在看书的时候，很多时候的心态是追求速度，追求进度，而不是去书中的内容，最简单的衡量指标，看完书后有没有沉淀，经典的书看了几遍，虽然期间也会强迫自己去多看几遍，比如《CSAPP》，《现代操作系统》，但是这应该是常态，不应该靠意志力，需要建立一种机制去确保。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"希望今年能够深入去钻研某项技术，而不是简单的浮于表面，而且一定要有输出，希望在输出量上有一个翻倍，另外可以好好考虑一下写文章的 SOP，把这个标准流程建立起来，减少输入的成本。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是成长不及预期，但是还是收获的："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"CSAPP：不得不说是神书，把计算机基础安排的明明白白的，这两年读了不下五遍，每次都都有新的感悟，经典的书就是这样，常读常新，值得多读，遗憾的是只把补码、浮点数编码的内容写成了卡片，后面的很多内容犯懒没写，实在不应该"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"现代操作系统：对操作系统的作用有了自己的认识，比较可惜的是没有及时的写下来，对于操作系统的调度算法，文件系统，并发和死锁都有一些了解"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"React 设计原理：这本书读了五六遍，才终于有点感觉，对于 React 内部的执行流程有了比较详细的了解，但是还在存在很多的疑惑，还需要配合其他的材料进一步的理解"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"周志明的软件架构课：令我印象非常深刻的部分就是关于 CDN 的阐述，我才了解到 CDN 还可以这么玩，我觉得其中的每篇文章都是精品，通俗易懂，且内容深刻，这一定是我会二刷"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"JavaScript 忍者秘籍：这次应该是三刷了，之前两次都是在上学的时候读的，但是觉得惊为天人，特别是关于宏任务和微任务的阐述，十分的详细，我对于宏任务和微任务的所有认知均是来自于这里，这次读虽然没有之前那么惊艳，但是关于闭包和浏览器执行流程的部分依旧让人眼前一新"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"除技术的书之外，还有很多文学小说能引起共鸣和思考，感受别人经历的人生，能极大丰富我们的阅历，特别是横跨几代的故事，能感觉到自己在时间长河上的渺小，顿时就阔达了起来："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"围城：首先这本给我的第一感觉就是文笔真的好好，读起来非常的舒服，不好的就是段落太长了"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"边城：读完之后就是遗憾，明明谁也没有错，但最后却这么遗憾，让人不能释怀"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"动物农场：表现写的是动物们的故事，实际上在暗讽所谓的社会主义，所实话其中所说的很多东西我都有所共鸣，不能把老百姓当傻子，我觉得现在最大的问题就是不公开、不透明，以至于产生了很多的信任危机，政府丧失了公信力"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"一地鸡毛：讲的是一个小职员的生活，从里面看到了职场的勾心斗角、派系斗争，看到夫妻之间的柴米油盐，才知道我原先是多么的单纯，没想到生活这么复杂"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"一句顶一万句：说实话没有意会到书名表达的含义，不过其中罗摩西的经历和当时我工作的经历有点类似，也是沉不住气，做不成一件事，我从中悟到了一个字，那就是熬，所以现在在工作中遇到困难，我都会对自己说熬一熬，熬过去就好了"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"... ..."}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于一些技术、自我成长的书，读完之后我感觉不到很大的成长，但是对于这些文学小说，我觉得每一本都没有白读，每一本增强了我的阅历，在新的一年还是要读一些这方面的书。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"笔记软件"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"始于去年的一个小小的念头，发芽至今，已长成一颗小树。今年花费了大量的时间和精力在笔记软件上，新增了非常多的功能："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"UI 改版，尽可能复用宽度，在小屏电脑上也有良好的展示，颜色风格统一，支持黑夜模式"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_639a1b6d-e858-4e73-bfd0-2e4bf6e73914.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_639a1b6d-e858-4e73-bfd0-2e4bf6e73914.png","width":720}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"项目，基于《打造第二大脑》，添加项目功能，以项目为维度主动地去接受大量的输入"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b24b1511-0c8d-4f34-96cd-d2eaf9887fbc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b24b1511-0c8d-4f34-96cd-d2eaf9887fbc.png","width":720}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"PDF，支持显示和标注 PDF 内容"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d5815050-5076-488d-9d10-9cbe64f8f8b9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d5815050-5076-488d-9d10-9cbe64f8f8b9.png","width":720}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"白板，支持无限画布的白板，可自由绘制图形，图片，富文本"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fd180e41-db0b-4370-b848-1961f7fb2fdc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fd180e41-db0b-4370-b848-1961f7fb2fdc.png","width":720}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AI，支持 AI 基于语义化的搜索，AI 对话，AI 补全等等"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9e16c77a-bb5b-470f-8707-ec6e1b620e32.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9e16c77a-bb5b-470f-8707-ec6e1b620e32.png","width":720},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1648da27-557b-4e11-8e52-8f6eb4c115f8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1648da27-557b-4e11-8e52-8f6eb4c115f8.png","width":720},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d1ae7071-5fd0-47b0-b1ca-b9cc5897dd18.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d1ae7071-5fd0-47b0-b1ca-b9cc5897dd18.png","width":720}]}]},{"type":"header","children":[{"type":"formatted","text":"生活"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"旅游"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"今年有两次出去旅游。第一次和廖权一起回山大，顺便逛了青岛"}],"disableDrag":false},{"type":"image-gallery","mode":1,"images":[{"id":"d72a7e32-4d5f-4ff7-b9 "type":"paragraph","children":[{"type":"formatted","text":"吃了之前一直在学校吃的辣子鸡和黄焖鸡，辣子鸡依旧好吃，黄焖鸡已不是当初那个味道了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"第二次团建，去了山西大同"}],"disableDrag":false},{"type":"image-gallery","mode":2,"images":[{"id":"ddffa16f-0c65-4b3d-968d-d1fbf16572be","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645315_3cae8453-5554-4d60-b8f1-fb3cfd37fb28.jpg","width":4000,"height":3000},{"id":"0cc66f5b-9533-4190-acb9-70996c662adc","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645320_05f9d1f6-f89d-4ad9-9c2f-51f844b16951.jpg","width":3000,"height":4000},{"id":"2940db5a-b7f0-40e0-845d-ef143a88f216","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645290_b8d65abf-f118-495e-bea8-0c02a0d49f73.jpg","width":4000,"height":3000},{"id":"89b4df7a-b993-4d08-99d3-0399a3702dc5","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645299_7de11dd6-2194-41ff-8b2e-86610fa7cede.jpg","width":3000,"height":4000},{"id":"5862bb39-9807-4d87-865c-2e362292d6ba","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645280_a6046c2b-4aab-4f1c-b8eb-012adb881bc9.jpg","width":1440,"height":1080},{"id":"76528041-08cb-445d-8ad6-cc92fc2242e0","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645285_ebd46e25-2097-4a8c-97bb-68e94f1f8e28.jpg","width":1440,"height":1080},{"id":"91674c52-62b3-448d-8e39-1afe282f233f","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645327_7191d4c4-c1d3-4c5c-9685-9a19a75422eb.jpg","width":3000,"height":4000},{"id":"9ebe930d-b651-4b19-9f26-371ab6c2c893","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645335_6e8114b0-1e10-44fc-8257-14fdd89518ed.jpg","width":4000,"height":3000},{"id":"4f74dfc3-d18b-4b7c-a4b1-554a54e14f7a","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645339_324552a0-e60b-40ad-848d-578a1e986965.jpg","width":3264,"height":2448},{"id":"8afd1d0a-469b-4c58-b940-90bebfae030f","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645330_5590b46d-e845-4168-bc08-ec6ef19da266.jpg","width":1080,"height":1920},{"id":"d989707c-fea1-4e48-8097-068d1e747ef4","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1731408645323_c2e361bc-bd84-486e-a2d4-45dee30dc0af.jpg","width":1080,"height":1920}],"children":[{"type":"formatted","text":""}],"height":200},{"type":"paragraph","children":[{"type":"formatted","text":"去参观的地点全是佛像，鄙人没什么文化，品不出什么东西，不过山西的刀削面蛮好吃的，而且物价特别的经济实惠！"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"吉他"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"今年十一月份丁文慧和他男朋友来北京玩，我陪他们逛了圆明园，然后闲聊问丁文慧闲时在干什么，她说在练吉他，我心中一动，我不也一直幻想着学会一门乐器吗，何不一起呢，平时多交流也能坚持下去，于是和丁文慧要了吉他链接，入手了我的第一把吉他。"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/645919824a8f644119a0aa7b28d261d_31182bad-3989-4c15-98b3-4f57ded06972.jpg","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/645919824a8f644119a0aa7b28d261d_31182bad-3989-4c15-98b3-4f57ded06972.jpg","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"在每天晚上吃饭的时间，我都会回来练吉他，大概每天 30-40 分钟，除非特殊情况，否则不会中断，现在左手的手指头已经出茧子了，跟着视频学习吉他的基本支持，目前可以顺利的爬格子，一些和弦也能按到了，还在练习各种基础，就是不会弹曲子，争取 2025 年能弹几首曲子。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"运动"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"在今年的前半年我的运动还是比较多的，每天晚饭的时候打乒乓球，有的时候出去打羽毛球，打篮球，不过自从进了 AI 平台，我就再也没时间去打乒乓球了，也没心思去打乒乓球了，可见此时一份压力大的工作对生活各方面的影响。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在五月份和廖权去青岛玩时，拍照看到自己在照片里面那么胖，我就决定要减肥，当时和他打赌，下次见到我时，我一定瘦十斤，当时我的体重已经快逼近 140 了。旅游回来后我就开始减肥，每天早上我跟着刘耕宏的视频跳操，一遍是 30 分钟，一开始连一遍都很难跳下来，练了两个月，我可以把高潮部分跳两遍，大约跳 45 分钟，然后洗澡去上班，坚持了一个半月。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"那段时间我每天早上都要称一下看下体重的变化，看着每天体重能少半斤，一斤，到了六月底，体重快降到 120 斤，减掉了快 20 斤，但是这个时候正如上述的身体原因，提出辞职后回去暂时休假了，休假期间把这个习惯断了，然后也就一直没续上，现在又胖回来了，不知道又胖了多少，现在我也不敢上称，不敢面对。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"这个让人非常的遗憾，后面也尝试过重新开始，但完全坚持不了，那股心气，那股意志已经没了，可见变化对于习惯的破坏之大。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"规划"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在《高效能人士的七个习惯》中的第二个习惯是以终为始，在做任何事情之前，先明确最终的目标或结果，然后根据这个目标来规划和指导整个过程。咱小小的实践一把，立一立 2025 年的 flag："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"吉他能顺利的弹几首曲子"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"运动和减肥，把体重保持在 120 斤"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"精通 React 源码"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"精研各种可视化技术（Canvas、SVG、WebGL）、精研动画"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"输出 20 篇文章，输出 50 张卡片"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"读十本文学小说"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"笔记软件支持思维导图，支持高级表格"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"工作方面就不立 flag 了，因为工作变化太大了，只希望自己能以平静的心情接受功能中的随机性，不内耗，不焦虑，不迷茫。"}],"disableDrag":false}],"tags":[],"bannerBg":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/willian-justen-de-vasconcellos-GVk43M8P3tc-unsplash_1f86787d-c665-4524-b6f1-3b6c720c4ad0.jpg","createTime":1735694751269,"updateTime":1766304085685},"meta":{"type":"article","publishTime":1775911062279}};
