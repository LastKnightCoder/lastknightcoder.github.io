e.log(obj.name) // Alice\n\nobj.name = 'Bob'      // 不可写，更改无效\nconsole.log(obj.name) // Alice","language":"js","uuid":"f3ec2bde-739f-4621-a3c2-6c97f848bda3","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面我们为 "},{"type":"formatted","text":"obj","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 属性配置了 "},{"type":"formatted","text":"value","code":true},{"type":"formatted","text":" 属性为 Alice 作为 "},{"type":"formatted","text":"obj.name","code":true},{"type":"formatted","text":" 的初始值，又配置了 "},{"type":"formatted","text":"writable","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"，表明该属性是不可写的，对该属性进行赋值时无效的。"}]},{"type":"header","children":[{"type":"formatted","text":"例子2"}],"level":3},{"type":"code-block","code":"const obj = {}\n\nlet username\nObject.defineProperty(obj, 'name', {\n    set(value) {\n        if (value === 'Alice') {\n            username = value\n        }\n    },\n    get() {\n        return username\n    }\n})\n\nobj.name = 'Alice'     // 赋值有效\nconsole.log(obj.name)  // Alice\n\nobj.name = 'Bob'       // 赋值无效 \nconsole.log(obj.name)  // Alice","language":"js","uuid":"ac948ad0-12c0-441b-bff1-36625c90795f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们为 "},{"type":"formatted","text":"obj","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"name","code":true},{"type":"formatted","text":" 属性配置了 "},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"get","code":true},{"type":"formatted","text":" 方法，没当我们为 "},{"type":"formatted","text":"obj.name","code":true},{"type":"formatted","text":" 赋予新值时都会调用 "},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 方法，并将新值传入，在 "},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 方法中，我们对新值进行了判断，如果新值为 Alice 则我们赋值给 "},{"type":"formatted","text":"username","code":true},{"type":"formatted","text":"；每次当我们访问 "},{"type":"formatted","text":"obj.name","code":true},{"type":"formatted","text":" 时，则会触发 "},{"type":"formatted","text":"get","code":true},{"type":"formatted","text":" 方法，在 "},{"type":"formatted","text":"get","code":true},{"type":"formatted","text":" 方法中我们直接返回了 "},{"type":"formatted","text":"username","code":true},{"type":"formatted","text":" 这个变量的值，通过这种方式可以控制对象属性的访问操作。"}]},{"type":"header","children":[{"type":"formatted","text":"例子3"}],"level":3},{"type":"code-block","code":"const obj = {\n    a: 1,\n    b: 2\n}\nconsole.log(Object.keys(obj)) // [ 'a', 'b' ]\n\n\nObject.defineProperty(obj, 'a', {\n    enumerable: false         // 不可枚举\n})\nconsole.log(Object.keys(obj)) // [ 'b' ]","language":"js","uuid":"484d71f5-4077-44fa-bd9b-9b224d47498a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面我们定义了一个 "},{"type":"formatted","text":"obj","code":true},{"type":"formatted","text":" 对象，其中有 "},{"type":"formatted","text":"a","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"b","code":true},{"type":"formatted","text":" 两个属性，默认都是可枚举的。通过 "},{"type":"formatted","text":"Object.keys","code":true},{"type":"formatted","text":" 方法可以取得对象中所以可枚举的属性，这时它们都在返回的数组中；接着我们配置 "},{"type":"formatted","text":"a","code":true},{"type":"formatted","text":" 为不可枚举，此时再次调用 "},{"type":"formatted","text":"Object.keys","code":true},{"type":"formatted","text":"，此时 "},{"type":"formatted","text":"a","code":true},{"type":"formatted","text":" 就不在返回的数组中了。"}]},{"type":"header","children":[{"type":"formatted","text":"例子4"}],"level":3},{"type":"code-block","code":"const obj = {\n    a: 1,\n    b: 2\n}\n\nObject.defineProperty(obj, 'a', {\n    enumerable: false,\n    configurable: false\n})\n\nconsole.log(Object.keys(obj)) // [ 'b' ]\n\n// TypeError: Cannot redefine property: a\nObject.defineProperty(obj, 'a', {\n    enumerable: true\n})","language":"js","uuid":"41e0f721-fbd6-4883-9bb1-ef9800209403","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们配置了 "},{"type":"formatted","text":"a","code":true},{"type":"formatted","text":" 为不可枚举，并且配置 "},{"type":"formatted","text":"configurable","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"，然后接着我们又想配置属性 "},{"type":"formatted","text":"a","code":true},{"type":"formatted","text":" 为可枚举的，但是会报错 "},{"type":"formatted","text":"TypeError: Cannot redefine property: a","code":true},{"type":"formatted","text":"，这是因为我们配置 "},{"type":"formatted","text":"configurable","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"，表示不可再次配置，当我们再次对属性 "},{"type":"formatted","text":"a","code":true},{"type":"formatted","text":" 进行配置便会报错。"}]},{"type":"code-block","code":"const obj = {\n    a: 1,\n    b: 2\n}\n\nObject.defineProperty(obj, 'a', {\n    enumerable: false,\n    configurable: true        // 可继续配置\n})\nconsole.log(Object.keys(obj)) // [ 'b' ]\n\nObject.defineProperty(obj, 'a', {\n    enumerable: true\n})\nconsole.log(Object.keys(obj)) // [ 'a', 'b' ]","language":"js","uuid":"d5553963-4bb8-4e4a-808f-4e5b953d31b4","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Object.defineProperties"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Object.defineProperty","code":true},{"type":"formatted","text":" 每次只能配置对象的一个属性，而 "},{"type":"formatted","text":"Object.defineProperties","code":true},{"type":"formatted","text":" 可以一次性配置对象的多个属性，它的语法如下："}]},{"type":"code-block","code":"Object.defineProperties(obj, {\n    prop1: {\n        // 配置选项同 Object.defineProperty\n    },\n    prop2: {\n        // ...\n    }\n})","language":"js","uuid":"c6e35e6f-b64d-47e7-a2b9-c4d518bc23c7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"见下例："}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice',\n    age: 25\n}\n\nObject.defineProperties(obj, {\n    name: {\n        writable: false    // 不能写 name 属性\n    },\n    age: {\n        enumerable: false, // 不能遍历到 age 这个属性\n        get() {\n            return 18      // 别问，问就是 18\n        }\n    }\n})","language":"js","uuid":"daace985-adc4-4f42-80fb-191978562b6d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Object.preventExtensions"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Object.preventExtions(obj)","code":true},{"type":"formatted","text":" 可以使得对象 "},{"type":"formatted","text":"obj","code":true},{"type":"formatted","text":" 不可扩展，即不能为对象添加新的属性"}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice',\n    age: 20\n}\n\nObject.preventExtensions(obj)\n\nobj.gender = 'female'   // 无法添加新的属性\nconsole.log(obj.gender) // undefined","language":"js","uuid":"783330e5-ddbf-4b3d-b212-ffd41bb200d6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们将 "},{"type":"formatted","text":"obj","code":true},{"type":"formatted","text":" 设置为不可扩展后试图添加新的属性，但是并没有成功。设置为不可扩展后，我们可以正常访问现有对象上的属性，以及更改和删除"}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice',\n    age: 20\n}\n\nObject.preventExtensions(obj)\n\nobj.name = 'Bob'\nconsole.log(obj.name)  // Bob\n\ndelete obj.name\nconsole.log(Object.keys(obj)) // [ 'age' ]","language":"js","uuid":"03f0bfa0-4de2-4c3f-9c4e-e46f373fb6e8","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对象一旦变为不可扩展后，就一直是不可扩展的。","bold":true},{"type":"formatted","text":"通过 "},{"type":"formatted","text":"Object.isExtensible","code":true},{"type":"formatted","text":" 方法可以判断一个对象是否是可扩展的"}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice',\n    age: 20\n}\n\nconsole.log(Object.isExtensible(obj)) // true\nObject.preventExtensions(obj)\nconsole.log(Object.isExtensible(obj)) // false","language":"js","uuid":"4a12d069-a598-4cbf-9acd-2e09bf1a2172","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Object.seal"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"seal","code":true},{"type":"formatted","text":" 的意思是封印，"},{"type":"formatted","text":"Object.seal","code":true},{"type":"formatted","text":" 比 "},{"type":"formatted","text":"Object.preventExtensiable","code":true},{"type":"formatted","text":" 更近一步，被 "},{"type":"formatted","text":"seal","code":true},{"type":"formatted","text":" 了的对象，除了变为不可扩展，还不可配置 "},{"type":"formatted","text":"configurable: false","code":true},{"type":"formatted","text":"，属性不能被删除了以及属性不能被 "},{"type":"formatted","text":"Object.defineProperty","code":true},{"type":"formatted","text":" 进行配置了"}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice',\n    age: 20\n}\n\nObject.seal(obj)\n\nobj.gender = 'female'\nconsole.log(obj.female) // undefined, 不可扩展\n\ndelete obj.name\nconsole.log(obj.name)   // Alice, 不可删除","language":"js","uuid":"08d6c029-c72d-4690-a18d-e6065713ae3a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是我们还可以对象现有的属性进行更改的"}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice',\n    age: 20\n}\n\nObject.seal(obj)\n\nobj.name = 'Bob'\nconsole.log(obj.name) // Bob","language":"js","uuid":"a9f7b01f-bae0-4ed8-8001-62727b2659ad","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"Object.isSealed","code":true},{"type":"formatted","text":" 可以判断对象是否被 "},{"type":"formatted","text":"seal","code":true},{"type":"formatted","text":" 了"}]},{"type":"code-block","code":"const obj = {}\n\nconsole.log(Object.isSealed(obj)) // false\nObject.seal(obj)\nconsole.log(Object.isSealed(obj)) // true","language":"js","uuid":"e807f2e6-21d9-4c77-8938-887f8a317ae5","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Object.freeze"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"freeze","code":true},{"type":"formatted","text":" 是冻结的意思，它相对于 "},{"type":"formatted","text":"Object.seal","code":true},{"type":"formatted","text":" 更进一步，不仅不可扩展，不可配置，对象的数据属性 "},{"type":"formatted","text":"writable","code":true},{"type":"formatted","text":" 会被设置为 "},{"type":"formatted","text":"false","code":true}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice'\n}\n\nObject.freeze(obj)\n\nobj.age = 18     // 不可扩展，无效\nobj.name = 'Bob' // 不可修改，无效\ndelete obj.name  // 不可配置，无效\n\nconsole.log(obj) // { name: 'Alice' }","language":"js","uuid":"4a1b60f0-3280-40be-84ff-3729c84f55b3","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果有定义 "},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 方法的话，对象属性还是可以被修改的"}]},{"type":"code-block","code":"const obj = {\n    name: 'Alice'\n}\n\nlet username = obj.name\nObject.defineProperty(obj, 'name', {\n    set(value) {\n        username = value\n    },\n    get() {\n        return username\n    }\n})\n\nObject.freeze(obj)\n\nobj.name = 'Bob'\nconsole.log(obj.name) // Bob","language":"js","uuid":"42e0443e-ce0f-4512-aea8-da201779d8f0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"Object.isFrozen","code":true},{"type":"formatted","text":" 方法可以判断一个对象是否被 "},{"type":"formatted","text":"freeze","code":true},{"type":"formatted","text":" 了"}]},{"type":"code-block","code":"const obj = {}\n\nconsole.log(Object.isFrozen(obj)) // false\nObject.freeze(obj)\nconsole.log(Object.isFrozen(obj)) // true","language":"js","uuid":"1ab9a27c-5215-4a24-9551-fcbdef68d4f2","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Proxy"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Proxy","code":true},{"type":"formatted","text":" 是 ES6 中的新特性，它可以为对象做一层代理，当用户通过代理访问对象时，代理可以拦截一些操作，例如为属性赋值，访问属性的值，从而控制对象的访问。"},{"type":"formatted","text":"Proxy","code":true},{"type":"formatted","text":" 可以拦截 13 种操作，这里不会详细介绍，只会介绍 "},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"get","code":true},{"type":"formatted","text":" 拦截。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Proxy","code":true},{"type":"formatted","text":" 的语法如下"}]},{"type":"code-block","code":"const proxy = new Proxy(target, {\n    // 拦截的方法\n})","language":"js","uuid":"55631db4-ca13-46f1-950a-092fc095a2aa","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"例子1"}],"level":3},{"type":"code-block","code":"const target = {\n    name: 'Alice',\n    age: 18\n}\n\nlet proxy = new Proxy(target, {\n    set(trapTarget, key, value, receiver) {\n        // 只能为 age 属性赋值，并且值必须不大于 18 才能赋值成功\n        if (key === 'age' && value <= 18) {\n            trapTarget[key] = value\n        }\n    }\n})\n\n// 无法为 name 赋值\nproxy.name = 'Bob'\nconsole.log(proxy.name)  // Alice\nconsole.log(target.name) // Alice\n\n// 大于 18 赋值失败\nproxy.age = 19\nconsole.log(proxy.age)   // 18\nconsole.log(target.age)  // 18\n\n// 不大于 18，赋值成功\nproxy.age = 15\nconsole.log(proxy.age)   // 15\nconsole.log(target.age)  // 15","language":"js","uuid":"425f3a77-7c2a-44d0-8a1b-4ad47a6d59c7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们为 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 对象做了层代理，当我们通过代理赋值时，会被 "},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 方法拦截，"},{"type":"formatted","text":"set","code":true},{"type":"formatted","text":" 方法接收四个参数："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"trapTarget","code":true},{"type":"formatted","text":"：被代理的对象"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"key","code":true},{"type":"formatted","text":"：被赋值的属性"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"value","code":true},{"type":"formatted","text":"：被赋的值"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"receiver","code":true},{"type":"formatted","text":"：操作发生的对象，即代理对象"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们只允许对 "},{"type":"formatted","text":"age","code":true},{"type":"formatted","text":" 属性赋值，并且赋的值不能大于 18。"}]},{"type":"header","children":[{"type":"formatted","text":"例子2"}],"level":3},{"type":"code-block","code":"const target = {\n    name: 'Alice',\n    age: 20\n}\n\nlet proxy = new Proxy(target, {\n    get(trapTarget, key, receiver) {\n        if (key === 'age') {\n            return 18\n        }\n        return trapTarget[key]\n    }\n})\n\nconsole.log(proxy.age)  // 18\nconsole.log(target.age) // 20","language":"js","uuid":"3fd5c874-0525-46a4-9f72-3dc8f71110f6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们对 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"get","code":true},{"type":"formatted","text":" 方法进行了代理，当我们通过代理对象访问属性值时，如果访问的是 "},{"type":"formatted","text":"age","code":true},{"type":"formatted","text":" 属性，则返回 18，其他属性不做处理直接返回原值。"}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果直接通过 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 访问属性的话，操作是不会被拦截的，代理没有作用。"}]}]}],"tags":["defineProperty","defineProperties","preventExtensions","seal","freeze","Proxy"],"bannerBg":"https://github.com/LastKnightCoder/image-for-2023/raw/master/wallhaven-o3wzql_3ee34654-e752-441b-ae77-ef437fa3a246.jpg","createTime":1618323480000,"updateTime":1743303640463},"meta":{"type":"article","publishTime":1764772322781}};
