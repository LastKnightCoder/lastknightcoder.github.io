raph","children":[{"type":"formatted","text":"生成器是用来生成一个数据集合的，它是一个函数，当调用一个生成器时，不会立即执行生成器函数中的内容，而是会返回一个迭代器，每次调用迭代器的 "},{"type":"formatted","text":"next","code":true},{"type":"formatted","text":" 方法，就会执行生成器函数，直至遇到 "},{"type":"formatted","text":"yield","code":true},{"type":"formatted","text":" 表达式，会将 "},{"type":"formatted","text":"yield","code":true},{"type":"formatted","text":" 后表达式的值返回，并挂起生成器函数的执行，等到再次调用迭代器的 "},{"type":"formatted","text":"next","code":true},{"type":"formatted","text":" 方法，从上次挂起的地方开始执行，直至遇到 "},{"type":"formatted","text":"yield","code":true},{"type":"formatted","text":" 表达式，或者生成器函数执行完成，当执行完成后，再调用 "},{"type":"formatted","text":"next","code":true},{"type":"formatted","text":" 方法，返回的 "},{"type":"formatted","text":"done","code":true},{"type":"formatted","text":" 字段就是 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":" 了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"生成器函数的定义与一般函数不同，需要在 "},{"type":"formatted","text":"function","code":true},{"type":"formatted","text":" 后面加上 "},{"type":"formatted","text":"*","code":true}]},{"type":"code-block","code":"let generator = function* () {\n  yield 1;\n  yield 2;\n  yield 3;\n}\n\nconst iterator = generator();\nfor (let value of iterator) {\n  console.log(value); // 1\n  \t\t\t\t\t\t\t\t\t\t// 2\n  \t\t\t\t\t\t\t\t\t\t// 3\n}","language":"JavaScript","uuid":"896350d3-3e9b-45b6-8286-8ac5afcd08ef","children":[{"type":"formatted","text":""}]}],"tags":["JavaScript"],"category":"permanent","createTime":1690723657685,"updateTime":1743303640410,"linkedCards":[{"id":222,"href":"/cards/222.html","summary":"迭代器是一种遍历集合的一种机制，迭代器具有一个 next() 方法，调用时返回一个对象，包含两个字段： done ：为布尔值， false 表示集合中还有元素可遍历， true 表示集合中没有元素可遍历 value ：如果 done 为 f...","tags":["JavaScript"],"category":"permanent"},{"id":224,"href":"/cards/224.html","summary":"只有对于可迭代的对象才可以使用 for ... of 语法进行迭代，那什么对象是可迭代的呢，如果一个对象具有 Symbol.iterator 属性，并且是一个函数，该函数返回的是一个迭代器，那么它就是可迭代的，每次我们使用 for ... ...","tags":["JavaScript"],"category":"perman
