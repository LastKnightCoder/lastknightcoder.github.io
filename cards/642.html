href":"/cards/569.html","category":"permanent","createTime":1744726092671}],"children":[]},{"tag":"概念对比","count":1,"cards":[{"id":572,"summary":"script 标签中 defer 和 async 的比较： 参考： async vs defer attributes","href":"/cards/572.html","category":"permanent","createTime":1744778218368}],"children":[]},{"tag":"学习方法","count":1,"cards":[{"id":588,"summary":"为什么要记笔记？有人说经常用的不用记，不常用的记着没用，所以根本没有记笔记的必要。我认为大错特错： 经常用的不用记：人总是会高估了自己的记忆力，著名的遗忘曲线告诉我们，人类遗忘的速度是如此之快，而记录是对抗遗忘最好的手段 不常用的记着没用：...","href":"/cards/588.html","category":"permanent","createTime":1747556107871}],"children":[]},{"tag":"HTTP","count":1,"cards":[{"id":634,"summary":"在 HTTP/1.1 中，强制要求请求和响应必须是“先进先出”（FIFO）的顺序，因为 HTTP/1.1 协议本身没有在消息中加入任何用于配对请求和响应的标识符 ，为了将请求和响应一一对应，因此必须按序处理响应。 这就意味着如果前一个请求响...","href":"/cards/634.html","category":"permanent","createTime":1760058892238}],"children":[]},{"tag":"健康","count":1,"cards":[{"id":635,"summary":"为什么节食不行：我们的身体通过代谢率来控制输出，当节食时大脑会以为进入了饥荒状态，会降低代谢率，导致疲劳，烦躁，当恢复饮食时会迅速反弹。 影响因素： 果糖，不是指水果中和纤维混在一起的糖，而是指人工加工的果糖，果糖不像葡萄糖可以被细胞利用，...","href":"/cards/635.html","category":"permanent","createTime":1761609578632}],"children":[]},{"tag":"经济学","count":1,"cards":[],"children":[{"tag":"期货","count":1,"cards":[{"id":641,"summary":"什么是期货（Futures）？简单可以理解为一份未来的买卖合同。 假设存在这么两名角色，农民伯伯和面板店老板。农民伯伯种了很多的小麦，面板店老板需要小麦制作面包，二者存在交易关系，但是它们都有各自的担忧： 农民伯伯担心 3 个月后收成是小麦...","href":"/cards/641.html","category":"permanent","createTime":1762996156745}],"children":[]}]}],"activeTag":"","content":{"id":642,"content":[{"type":"header","children":[{"type":"formatted","text":"学习和大脑的关系"}],"disableDrag":false,"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我们都知道学习是在大脑中进行的，但并不知道学习对大脑究竟有什么影响，更不知道学习时大脑发生了哪些变化，以及这些变化是如何发生的。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"具体地说，要学习，人们必须改变自己的大脑，更具体地说，是必须改变大脑的神经连接。","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"人的大脑中大约有 850 亿个神经元，其数量在胎儿期就已经生成，在出生后总量基本不会发生变化，但是"},{"type":"formatted","text":"神经连接是可以改变的，并且是高度可变的","color":"#e33a32","darkColor":"#fa7873","bold":true},{"type":"formatted","text":"。","color":"#e33a32","darkColor":"#fa7873"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"通过学习和训练可以形成新的连接或加强已有的连接，这就像在一片茂密的森林中行走。原本没有路，但如果你不断重复走同一条路线，杂草会被踩平，小径会变宽，最终变成一条高速公路。"},{"type":"formatted","text":"走不存在的路就是在尝试","color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"形成的新的连接，而重复的走这条路线就是在加强神经连接","bold":true,"color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"。","color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"对于不常使用的技能，即使原来是一条小径，因为不常光顾，导致杂草丛生，原本的小径再次长满杂草，使得小径变得越来越窄，越来越难以通行，同样对于大脑连接也是，"},{"type":"formatted","text":"不常被激活的神经元连接会逐渐减弱甚至被大脑裁剪掉以节省能量，从而产生遗忘。","color":"#e33a32","darkColor":"#fa7873"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这个时候你可能会想问一个问题，这些相互连接的神经网络到底是怎么起作用的呢？为什么一段文字、几串音符能唤起我们丰富的情感与想象？"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"实际上，我们脑中的神经网络是以分层的形式去处理信息的，当我们接收到外部的信息时，最直接的就是物理刺激，比如光线和声音，光线和声音造成的刺激会激活一些最底层的神经元，这些神经元只能处理简单的信息，比如光线强弱、边缘、颜色、音量、音调等，处理这些信息的神经元被激活后，会传导到所连接的下一层神经元，这一层的神经元可以将零碎的信息整合为更有意义的模式，比如将边缘和颜色整个为形状，将音量和音调组合成旋律片段，随着神经元的继续传导，通过组合上一层神经元传递的整合信息，我们能理解越来越抽象的概念，此时接收到的外部信息不再仅仅代表物理刺激，而是开始承载意义、情感、逻辑和规律。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我们理解一个复杂概念，需要经过神经元的层层接力才行，如果神经网络稀疏或者强度不够，只能在浅层打转，只能看到事情的表面。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这也解释了为什么有的人一眼就能看到事情的本质，不是因为他们天赋异禀，存在天生的直觉，而是因为他们早已在自己的大脑中建立起了一条"},{"type":"formatted","text":"针对特定领域的、连接丰富且强度极高的“神经高速公路”","color":"#e33a32","darkColor":"#fa7873","bold":true},{"type":"formatted","text":"。当相关信息输入时，这条通路能被瞬间激活，信息可以毫不费力地直达高层处理区域，从而让他们迅速地、近乎直觉地把握住事物的核心规律和深层逻辑。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"所以建立新的、高强度的神经连接才是学习的本质，也是我们学习的目的。","bold":true,"color":"#e33a32","darkColor":"#fa7873"}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"赫布法则"}],"level":2,"collapsed":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"首先我们来回答一个最关键的问题：神经连接是通过什么机制建立的？又是如何得到加强的？"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"早在1949年，赫布就在其著作《行为的组织》中揭示了这一机制。"}]},{"type":"blockquote","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"当细胞 A 的轴突足以接近以激发细胞B，并"},{"type":"styled-text","color":"red","children":[{"type":"formatted","text":"反复或持续","bold":true}]},{"type":"formatted","text":"地参与对细胞 B 的激发时，这两个细胞或其中一个会发生某种生长过程或代谢变化，从而使 A 激发 B 的效率增加。"}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"简单来说，赫布法则的核心就是："},{"type":"formatted","text":"如果两个神经元总是同时被激活，它们之间的连接就会变强。","color":"#e33a32","darkColor":"#fa7873","bold":true},{"type":"formatted","text":"这意味着，"},{"type":"formatted","text":"要想产生强有力的神经连接，首要条件就是你必须去激活它。","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"接下来的问题是：如何才能高效地激活神经元？答案就是"},{"type":"formatted","text":"主动学习。","bold":true}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"主动学习要求大脑处于高度唤醒状态，迫使相关的神经元进行高强度的协同放电，根据赫布法则，同时激发的神经元产生连接的概率更大。相反，被动学习（如漫无目的地听课或机械阅读）时，信号只是匆匆掠过大脑皮层，神经元被激活的强度和频率都不够，留下的记忆痕迹微乎其微。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"数据有力的证明了这一点：在 225 项研究中，研究者对比了理工科学生在讲授式与主动参与式教学下的表现，主动参与式教学优势明显，能将挂科率降低了12%。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d6e80c58-06f5-4362-80f6-a369e8306d8b.webp","uuid":"a816c498-749c-4492-8a18-8bdf44660683","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d6e80c58-06f5-4362-80f6-a369e8306d8b.webp","width":515},{"type":"highlight-block","color":"orange","children":[{"type":"paragraph","children":[{"type":"formatted","text":"这并不意味着我们要彻底摒弃讲授式教学。问题的症结不在于讲授本身，"},{"type":"formatted","text":"而在于是否唤醒了学习者的大脑","bold":true,"color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"。即便是听讲，如果老师能讲的深入浅出，引人入胜，让学生的大脑能同步构建模型、推演逻辑，那么学生相关区域的神经元也会反复持续激活，同样可以达到很好的学习效果。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"让我们用两个生活上的实例来看到被动和主动学习的巨大差异："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"乘客与司机"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"看剧到破案"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"现在我们就来识别哪些是主动学习哪些是被动学习，尽可能的避免被动，多使用主动学习的方法，学习策略和建议"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"被动阅读和重复阅读获取信息"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"因为没能很好的记住观点或情节，又或心不在焉不得不回头反复阅读，这是一定被动的阅读方式，显然降低了激活与学习目标相关神经元的可能性，应该避免"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"中断阅读法，停顿，打断谈话，重新解释，确认细节，变得更加主动"}]}]}]},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"个人体验，写作，主动写作，Canvas 和 Node 学习"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"梁思成的话，鼓励年轻人著书立作。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"写作即思考。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"但仅仅激活还不够，你还需要"},{"type":"formatted","text":"激活对的神经元。","bold":true,"color":"#e33a32","darkColor":"#fa7873"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"试想，你在上课的时候脑子却在回味刚刚看到的热点新闻，此时你的大脑的确被激活了，甚至还有点兴奋，但那是处理娱乐信息的神经元被激活了，与当前学习的内容无关，与处理当前学习内容的神经元无法被激活，学习效果大打折扣。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"很多人自认为大脑性能强大，可以一心多用，同时处理多个任务。"},{"type":"formatted","text":"遗憾的是，从神经生物学的角度看，多任务处理是个伪命题。","color":"#e33a32","darkColor":"#fa7873","bold":true},{"type":"formatted","text":"人类的前额叶皮质（负责决策和注意力的区域）存在生理瓶颈，它在同一时间只能串行处理一个高认知负荷的任务。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"所谓的多任务，实则是注意力在不同任务间的高频切换。这种切换不仅消耗巨大的能量，更会导致注意残留，即当从任务 A 切换到任务 B 时，大脑的一部分资源还在 A 上，这与赫布所阐述的反复且持续的激发条件不符，会导致无法深入理解当前的知识。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"所以一定要避开一心多用，哪些告诉你可以一边看电影一边学习的，绝对吹牛"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"避开干扰源，社交媒体，以确保激活对的神经元"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"避免加强错误的策略或想法"}]}]}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"高效的激活策略"}],"level":2},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"提取"}],"level":3},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":""}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"费曼学习法"}],"level":3},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":""}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"构建正反馈飞轮"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"提取"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"效率最高的方法之一"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"有哪些提取策略"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"回想"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"测验"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"自问自答"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"中断"}]}]}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"自我解释"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在自我解释时也是在提取"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"适合具备一定的背景，不适合初级学习者"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"重复策略"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"集中重复和间隔重复"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"间隔重复效率更高"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"同时进行多个任务"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"最大化反馈"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"正向反馈，任务难度越高，反馈越强，分泌的多巴胺越多，有更强的学习动力，正向循环"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"16 岁的时候是巅峰"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"负向反馈，大脑的纠错机制，和什么脑区域有关来着"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"成年人对负反馈更敏感，青少年这一部分的脑部区域还没有发育完全"}]}]}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"成长性思维"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"多种实验显示，相信大脑是可以改变的，可以提高学习效果"}]}]}]}]}]}],"tags":[],"category":"temporary","createTime":1763387186520,"updateTime":1763653062480,"linkedCards":[],"relatedCards":[]},"meta":{"type":"card","publishTime":1764769461981}};
