 但是制定计划并非没有好处，它可以让你快速的行动起来，特别是面对一个新领域的时候，由于未知我们一般都会拖延，迟迟不肯...","href":"/cards/29.html","category":"permanent","createTime":1688953243937},{"id":30,"summary":"记忆分为两种机制：存储和提取。存储和提取是呈负相关的，存储过程越容易，则提取过程就会越困难。举两个例子： 课堂笔记。有的同学时边听讲边记笔记，记笔记这个过程就是存储过程，像这种未加思考的存储过程，是相当容易的，但是提取过程就会比较困难，过了...","href":"/cards/30.html","category":"permanent","createTime":1688953292717},{"id":31,"summary":"面对一个大任务时，一定要学会任务的拆解，将大任务拆分为多个小任务，大任务的困难程度会让我们恐惧，从而造成拖延，而分解为多个小任务后，我们会更容易的开始。 任务划分的原则：能取得一定成果，能获得一定反馈。不要将任务划分的过于详细，因为未来的一...","href":"/cards/31.html","category":"permanent","createTime":1688953317325},{"id":33,"summary":"《荀子》有句话说的好，“如切如磋，如琢如莫，谓学问也”，学问是需要不停的琢磨的，我们对知识反复的推敲打磨，才能形成自己的学问。但是如果仅仅是在脑中进行，却是有非常大的难度，因为大脑它容量和算力有限，且有时也不可靠，时不时会遗漏掉一些细节，甚...","href":"/cards/33.html","category":"permanent","createTime":1688953486413},{"id":399,"summary":"PQ4R 学习技巧： 预习（Preview） 了解每章的主要结构和主题，浏览重要标题和图表，能够清楚的知道该章节包含的主要内容 问题（Question） 阅读时进行提问，可以将标题转化为问题，比如章节标题是“心理学的目标”，可以转化为问题，...","href":"/cards/399.html","category":"permanent","createTime":1705156879169},{"id":404,"summary":"学习方法： PQ4R 任务拆解 制定计划 必要难度理论 写作与思考","href":"/cards/404.html","category":"theme","createTime":1705830625263},{"id":422,"summary":"构建数字笔记系统的步骤： 提取：只提取最有用的，最直击人心的信息，其它不重要的信息就随他而去吧，不要仔细分析这些信息是否值得记录，要相信你的感觉，如果读到这则信息的时候，你感觉直击人心，印象深刻，那就值得记录 组织：以当前正在进行的项目为向...","href":"/cards/422.html","category":"permanent","createTime":1712202349388},{"id":483,"summary":"框架先行 搞清楚领域的边界在哪里 方式 书籍目录 视频，60分钟了解 xxx 是否专业，找一个和自己领域相关的，判断一下 大约 3-4 个就能对知识体系有所了解了 知识分类 对学习到的知识进行归类 贯穿整个知识过程，学习本身 当了解某个领域...","href":"/cards/483.html","category":"permanent","createTime":1719918805061},{"id":534,"summary":"记笔记遇到的问题： 需要解决问题时想不起来记的笔记 找到了相关的笔记，却难以应用 第一个问题，为什么想不起来，有一个 必要难度理论 ，存储越容易，提取就越困难，反之存储越困难，提取就越容易。我们经常会把收集和记笔记弄错，收藏文章、划线、摘录...","href":"/cards/534.html","category":"permanent","createTime":1743386147045},{"id":542,"summary":"记笔记常遇到的两个误区： 形式大于内容 常常纠结于格式，排版，字数，是否存在遗漏（比如整本书的知识点是否有遗漏），真正关心的应当是有用的信息，能不能为未来的自己所用，未来的自己会怎么用，形式是为内容服务的 只记录，不思考 当我们觉得某段话打...","href":"/cards/542.html","category":"permanent","createTime":1743579244213},{"id":543,"summary":"记笔记的建议： 记录自己的想法 为什么要记录个人想法，现在的公共知识都可以通过搜索引擎或者 AI 问出来，反而是个人想法与思考值得记录。 记录感到触动的时刻： 灵感很棒，当时看似无用的灵感，能为未来困顿时刻提供帮助，值得记录 信息有用，如何...","href":"/cards/543.html","category":"permanent","createTime":1743589558843},{"id":550,"summary":"为什么复习（回顾）很重要： 对抗遗忘，人总是高估自己的记忆力，根据艾宾浩斯遗忘曲线，一天后 74% 被遗忘掉，一个月后，79% 被遗忘掉，但是如果及时复习的话，长期记忆就能保持 内化知识、整理知识结构的一个新机会 整理笔记结构，去除不需要、...","href":"/cards/550.html","category":"permanent","createTime":1743742694649},{"id":551,"summary":"回顾笔记的建议和实践： 投入时间 很多人都觉得回顾很有必要性，但是都说没时间做，这明显是借口，因为不存在没时间，只存在优先级，还是没把这件事情作为重要的事情来对待。 输入前，大致分好类之后，查阅相关类比的笔记，寻找联系，这是一个回顾的时机 ...","href":"/cards/551.html","category":"permanent","createTime":1743904829242},{"id":552,"summary":"关于信息源的建议： 做减法，削减信息源 我们现在缺的不是信息，而是高质量的信息，我们的注意力有限，不要被低质量的信息浪费了时间，因此要削减这部分的信息源 削减利用情绪的信息源 标题党，引发焦虑，带动情绪，扰乱正常规划和做事节奏 削减觉得舒适...","href":"/cards/552.html","category":"permanent","createTime":1743919240783},{"id":588,"summary":"为什么要记笔记？有人说经常用的不用记，不常用的记着没用，所以根本没有记笔记的必要。我认为大错特错： 经常用的不用记：人总是会高估了自己的记忆力，著名的遗忘曲线告诉我们，人类遗忘的速度是如此之快，而记录是对抗遗忘最好的手段 不常用的记着没用：...","href":"/cards/588.html","category":"permanent","createTime":1747556107871},{"id":615,"summary":"Frederic Bartlett 的 Schema 理论，Schema 可以理解为我们对世界、事件、人物或概念的概括性知识，它强调知识是一个主动积极的构建过程，而不是被动机械的复制过程。 当我们接收到新的信息时， 会根据已有的 Schem...","href":"/cards/615.html","category":"permanent","createTime":1754829333759},{"id":619,"summary":"愈发感觉到当前大模型的训练以及推理和人非常的相似。 刷到这么一个 说法 把人的学习和大模型训练进行了一个映射： 书中学 -\u003e 预训练 高人聊 -\u003e 后训练 事上练 -\u003e 强化训练 由此我想到大模型的推理，特别是思考模式，它会在输出正式回答之...","href":"/cards/619.html","category":"permanent","createTime":1756004061919},{"id":630,"summary":"学习到两个有用的概念： 认知过载，人在短时间内接受过量信息从而无法进行有效思考 老师快速讲述过多知识点 短时间内读完一本书 给我带来的启示是不要求在一周或者几周内快速读完一本书，这也与我的实际体验相符，快速读完无法消化书里面的内容，读书更重...","href":"/cards/630.html","category":"permanent","createTime":1758725326491},{"id":687,"summary":"看到波波老师之前公众号的一篇文章 《如果高效学习有什么秘诀的话，那就都在这里了：）》 ，之前肯定读过一次，不过这次读来也引发了一些新的思考，果然好文章就是这样，总是会去引发人的思考。 不要完美主义 我现在写卡片还是有点完美主义，卡片之间重要...","href":"/cards/687.html","c 等教育的人越多，高技术人才...","href":"/cards/699.html","category":"permanent","createTime":1778065142623},{"id":705,"summary":"想了解一家企业甚至一个国家的财务健康状况，最直接的方式就是看它的资产负债表。资产负债表是反映某一特定时刻拥有多少资源、欠下多少债务、以及所有者净资产有多少的财务报表。 资产负债表包含三个部分： 资产：拥有的、能带来经济利益的资源。企业的资产...","href":"/cards/705.html","category":"permanent","createTime":1778482427264},{"id":706,"summary":"一家公司要运转起来，首先得有本钱。资本金就是创始人和股东在设立公司时掏出来的钱，是公司最初的家底。 资本金的大小决定了一家公司能承受多大的亏损，它是承担风险的第一道防线。在有限责任公司中，股东的个人财产和公司是分开的，如果经营亏损超出了资本...","href":"/cards/706.html","category":"permanent","createTime":1778508145019},{"id":707,"summary":"在经济运行中，供给和需求往往难以天然匹配，市场上总会出现商品积压卖不出去，或者需求旺盛却供不应求的情况。出清（Market Clearing）描述的正是市场消化这种失衡、最终重新达到均衡的过程。当某一价格水平下，买方愿意购买的数量恰好等于卖...","href":"/cards/707.html","category":"permanent","createTime":1778805035100},{"id":708,"summary":"企业在发行新股（IPO 或增发）时，通常不具备独立完成销售的能力：不懂如何定价、没有面向投资者的销售渠道、也缺乏证券发行的专业经验。因此需要聘请投资银行或证券公司，由其将股票销售给广大投资者，这个过程就是股票承销。 承销根据风险承担方式的不...","href":"/cards/708.html","category":"permanent","createTime":1778807466968},{"id":709,"summary":"当一个企业或个人还不起钱的时候，债权人和债务人坐下来重新商量怎么还钱，这个过程就是债务重组。核心目的是避免直接走向破产清算，让双方都能少亏一点。 为什么双方都愿意坐下来谈？对债务人（欠钱的人）来说，不重组可能直接倒闭，重组后可以获得缓冲时间...","href":"/cards/709.html","category":"permanent","createTime":1778818666564},{"id":710,"summary":"经济下行的时候，我们总能看到政府大搞基建：修高铁、建机场、扩公路。为什么经济越差，政府反而越要花钱？这背后的理论支撑就是乘数效应，凯恩斯主义中的一个核心概念。 它的逻辑建立在一个朴素的事实上：一个人的支出就是另一个人的收入。假设政府投资了 ...","href":"/cards/710.html","category":"permanent","createTime":1778918899287},{"id":711,"summary":"「由俭入奢易，由奢入俭难」，生活中我们常常发现，一旦习惯了某种生活水平，就很难再退回去。这种现象在经济学中有一个精确的类比：棘轮效应。 棘轮是机械工程中的一种齿轮，它的特点是只能单向转动，无法反向倒转。因此，棘轮效应被用来比喻习惯或趋势一旦...","href":"/cards/711.html","category":"permanent","createTime":1778921639999},{"id":712,"summary":"很多人在做决策时只看到了显性的支出，比如房租、水电、材料费，却忽略了一个隐藏的代价。经济学中把这个隐藏的代价叫做机会成本，它指的是当你面对多个选择时，选了其中一个，所放弃的其他选择中最优的那个能带来的收益。 举个例子，假设你开了一家奶茶店，...","href":"/cards/712.html","category":"permanent","createTime":1778928424489},{"id":713,"summary":"在经济学中，「价格越高，需求越低」是一条基本规律。但现实中存在一种反常现象：某些商品价格越高，买的人反而越多。 美国经济学家托尔斯坦·凡勃伦在其著作《有闲阶级论》中描述了这一现象。随着工业革命的发展，出现了一批迅速暴富的有闲阶级，他们需要通...","href":"/cards/713.html","category":"permanent","createTime":1778929051211},{"id":714,"summary":"经济学有一条基本定律：价格升高，需求降低，二者反向变动。但有一类特殊的商品恰恰相反，价格越涨，人们买得越多。这类商品被称为吉芬商品，以 19 世纪英国经济学家罗伯特·吉芬的名字命名。 最经典的案例发生在 19 世纪的爱尔兰。当地农民非常贫困...","href":"/cards/714.html","category":"permanent","createTime":1778930143727},{"id":715,"summary":"生活中我们常常会陷入一种困境：明明知道继续下去不划算，却因为「已经付出了这么多」而不愿放手。这背后的心理陷阱，就是沉没成本。沉没成本是已经发生，且当下无论做什么都无法挽回的投入，这种投入不仅仅包含金钱，还包括时间、精力和感情等。 举个例子，...","href":"/cards/715.html","category":"permanent","createTime":1778973712093},{"id":716,"summary":"你有没有过这样的经历：一件闲置物品，放在家里觉得挺值钱的，但如果让你去买同样的东西，你可能根本不愿意花那个价钱。这种「拥有即高估」的心理倾向，就是禀赋效应。人们一旦拥有一件物品，对该物品的评价会远高于未拥有时的评价。通俗地说，就是敝帚自珍。...","href":"/cards/716.html","category":"permanent","createTime":1778979939946},{"id":717,"summary":"你有没有过这样的经历：在电商平台看到一件商品，旁边划掉的原价让你觉得当前售价特别划算，甚至有种「赚到了」的感觉？这背后其实是一种被广泛研究的认知偏差在起作用，叫做锚定效应。 锚定效应是行为经济学中的一个核心概念，由心理学家丹尼尔·卡尼曼（D...","href":"/cards/717.html","category":"permanent","createTime":1778982522704},{"id":719,"summary":"当我们面对资源分配的问题时，第一反应往往是争抢，但经济学告诉我们，在动手抢之前，先看看有没有把蛋糕做大的空间。这就是 「帕累托改进」 的核心思想：在不损害任何人利益的前提下，让至少一个人的状况变得更好。它提醒我们遇到问题时别急着你死我活，而...","href":"/cards/719.html","category":"permanent","createTime":1778987517218},{"id":720,"summary":"人类经过了几千年的发展，为什么始终维持在刚好吃饱的水平？技术带来的生产效率提升和粮食增加，似乎总是被人口增长给消耗掉。英国经济学家、人口学家托马斯·马尔萨斯在 1798 年的《人口论》中提出了这个政治经济学概念，他将 人类生活水平长期停滞 ...","href":"/cards/720.html","category":"permanent","createTime":1778988782824},{"id":722,"summary":"当一个新兴大国崛起，必然会对现有霸权国家的地位构成挑战，双方之间是否注定走向冲突甚至战争？2012年，哈佛大学政治学者格雷厄姆·艾利森（Graham Allison）将这一结构性困境命名为「修昔底德陷阱」。 该术语源自古希腊历史学家修昔底德...","href":"/cards/722.html","category":"permanent","createTime":1778995696189},{"id":723,"summary":"我们常说经济有周期，其中有一个和日常商业活动最贴近的短周期，叫库存周期，也被称为基钦周期。它的核心逻辑很简单：供给与需求之间存在时间差，这个时间差导致库存不断波动，形成周期。 举个例子，假设你在卖一个商品，有一天突然爆火了，而你没有足够多的...","href":"/cards/723.html","category":"permanent","createTime":1779011949485},{"id":724,"summary":"如果说 库存周期 是企业的短期呼吸，那产能周期就是企业的长期心跳。在宏观经济学中，产能周期通常被称为朱格拉周期，是一个持续约 7~11 年的中长周期。 它的核心逻辑和库存周期一脉相承：供给对需求的响应存在时间差，只不过波动的对象从库存变成了...","href":"/cards/724.html","category":"permanent","createTime":1779014472606},{"id":725,"summary":"投资时我们常面临一个问题：收益高的产品风险也大，那怎么判断一项投资的「性价比」？夏普比率就是用来回答这个问题的，它衡量的是每多承担一份风险，能换来多少额外收益。 它的计算方式如下： 其中： 表示无风险利率，比如国债的收益率 表示预期的投资收...","href":"/cards/725.html","category":"permanent","createTime":1779065249037},{"id":726,"summary":"政府想要刺激经济时，通常会采取扩张性财政政策，比如扩大政府支出或减税。但一个有趣的现象是，这些政策在刺激经济的同时，可能反过来抑制了企业投资和个人消费，使得预期的刺激效果被部分甚至完全抵消。这就是挤出效应，形象地说，就是政府把企业和消费者的...","href":"/cards/726.html","category":"permanent","createTime":1779067263711},{"id":729,"summary":"在投资中，一个核心问题是：当前经济处于什么阶段，应该配置什么资产？美林证券（现属于美国银行）在 2004 年提出了一个经典的资产配置框架来回答这个问题，即美林时钟（Merrill Lynch Investment Clock）。它根据两个宏...","href":"/cards/729.html","category":"permanent","createTime":1779148853061},{"id":731,"summary":"央行要调控宏观经济，核心手段之一就是控制基础货币的投放量。再贷款和再贴现是央行较早使用的两个货币政策工具，它们的共同点是央行直接向商业银行提供资金，区别在于方式不同。 再贷款，顾名思义是\"再一次贷款\"。普通贷款是商业银行把钱贷给企业或个人，...","href":"/cards/731.html","category":"permanent","createTime":1779231213029}],"children":[{"tag":"芯片","count":1,"cards":[{"id":413,"summary":"一个芯片上有两个或两个以上的 CPU 称为 多核 芯片，如果 CPU 的数量继续增加时，会使用另一个名称， 众核 。 多核与众核之间没有明确的区分界限， 如果你觉得损失一两个 CPU 也无所谓 ，那么就可以称之为众核了。 GPU 是典型的众...","href":"/cards/413.html","category":"permanent","createTime":1711070511602}],"children":[]}]},{"tag":"计算机","count":1,"cards":[],"children":[{"tag":"缓存","count":1,"cards":[{"id":414,"summary":"网卡上为什么需要有单独的缓存？ 对于发送，互联网络的发送是同步的，这就要求必须以恒定的速率将数据发送出去，如果网卡没有单独的缓存来存储发送的数据，数据直接从主存到网卡并不能保证速率稳定，因为总线上还存在其它的流量。 对于接收，由于接收的速率...","href":"/cards/414.html","category":"permanent","createTime":1711174611787}],"children":[]}]},{"tag":"加密","count":1,"cards":[],"children":[{"tag":"隐写术","count":1,"cards":[{"id":415,"summary":"隐写术是指将一个文件隐藏在另一个文件中，一个最常见的例子就是藏头诗，把信息藏在诗的开头，或者诗的其它位置。 在计算机中，可以使用图片来传递隐藏的文件信息。对于一副图片，每个像素有 rgb 三个通道，每个通道使用一个字节表示，如果使用图片 r...","href":"/cards/415.html","category":"permanent","createTime":1711275105778}],"children":[]}]},{"tag":"读书","count":12,"cards":[{"id":516,"summary":"纳瓦尔的七个阅读习惯： 不关注阅读数量 不追求读多少书，也不追求读完一本书 果然舍弃 阅读过程中， 出，这套体系内含一个不可调和的矛盾：当一国主权货币同时充当国际储备货币时，该国的国内...","href":"/cards/704.html","category":"permanent","createTime":1778462537964}],"children":[]},{"tag":"特里芬难题","count":1,"cards":[{"id":704,"summary":"在布雷顿森林体系下，美元与黄金挂钩（35美元兑1盎司黄金），各国货币再与美元挂钩，美元由此成为国际储备货币。然而美国经济学家罗伯特·特里芬早在1960年就指出，这套体系内含一个不可调和的矛盾：当一国主权货币同时充当国际储备货币时，该国的国内...","href":"/cards/704.html","category":"permanent","createTime":1778462537964}],"children":[]},{"tag":"资产负债表","count":1,"cards":[{"id":705,"summary":"想了解一家企业甚至一个国家的财务健康状况，最直接的方式就是看它的资产负债表。资产负债表是反映某一特定时刻拥有多少资源、欠下多少债务、以及所有者净资产有多少的财务报表。 资产负债表包含三个部分： 资产：拥有的、能带来经济利益的资源。企业的资产...","href":"/cards/705.html","category":"permanent","createTime":1778482427264}],"children":[]},{"tag":"资本金","count":1,"cards":[{"id":706,"summary":"一家公司要运转起来，首先得有本钱。资本金就是创始人和股东在设立公司时掏出来的钱，是公司最初的家底。 资本金的大小决定了一家公司能承受多大的亏损，它是承担风险的第一道防线。在有限责任公司中，股东的个人财产和公司是分开的，如果经营亏损超出了资本...","href":"/cards/706.html","category":"permanent","createTime":1778508145019}],"children":[]},{"tag":"出清","count":1,"cards":[{"id":707,"summary":"在经济运行中，供给和需求往往难以天然匹配，市场上总会出现商品积压卖不出去，或者需求旺盛却供不应求的情况。出清（Market Clearing）描述的正是市场消化这种失衡、最终重新达到均衡的过程。当某一价格水平下，买方愿意购买的数量恰好等于卖...","href":"/cards/707.html","category":"permanent","createTime":1778805035100}],"children":[]},{"tag":"债务重组","count":1,"cards":[{"id":709,"summary":"当一个企业或个人还不起钱的时候，债权人和债务人坐下来重新商量怎么还钱，这个过程就是债务重组。核心目的是避免直接走向破产清算，让双方都能少亏一点。 为什么双方都愿意坐下来谈？对债务人（欠钱的人）来说，不重组可能直接倒闭，重组后可以获得缓冲时间...","href":"/cards/709.html","category":"permanent","createTime":1778818666564}],"children":[]},{"tag":"乘数效应","count":1,"cards":[{"id":710,"summary":"经济下行的时候，我们总能看到政府大搞基建：修高铁、建机场、扩公路。为什么经济越差，政府反而越要花钱？这背后的理论支撑就是乘数效应，凯恩斯主义中的一个核心概念。 它的逻辑建立在一个朴素的事实上：一个人的支出就是另一个人的收入。假设政府投资了 ...","href":"/cards/710.html","category":"permanent","createTime":1778918899287}],"children":[]},{"tag":"棘轮效应","count":1,"cards":[{"id":711,"summary":"「由俭入奢易，由奢入俭难」，生活中我们常常发现，一旦习惯了某种生活水平，就很难再退回去。这种现象在经济学中有一个精确的类比：棘轮效应。 棘轮是机械工程中的一种齿轮，它的特点是只能单向转动，无法反向倒转。因此，棘轮效应被用来比喻习惯或趋势一旦...","href":"/cards/711.html","category":"permanent","createTime":1778921639999}],"children":[]},{"tag":"机会成本","count":1,"cards":[{"id":712,"summary":"很多人在做决策时只看到了显性的支出，比如房租、水电、材料费，却忽略了一个隐藏的代价。经济学中把这个隐藏的代价叫做机会成本，它指的是当你面对多个选择时，选了其中一个，所放弃的其他选择中最优的那个能带来的收益。 举个例子，假设你开了一家奶茶店，...","href":"/cards/712.html","category":"permanent","createTime":1778928424489}],"children":[]},{"tag":"凡勃伦效应","count":1,"cards":[{"id":713,"summary":"在经济学中，「价格越高，需求越低」是一条基本规律。但现实中存在一种反常现象：某些商品价格越高，买的人反而越多。 美国经济学家托尔斯坦·凡勃伦在其著作《有闲阶级论》中描述了这一现象。随着工业革命的发展，出现了一批迅速暴富的有闲阶级，他们需要通...","href":"/cards/713.html","category":"permanent","createTime":1778929051211}],"children":[]},{"tag":"吉芬商品","count":1,"cards":[{"id":714,"summary":"经济学有一条基本定律：价格升高，需求降低，二者反向变动。但有一类特殊的商品恰恰相反，价格越涨，人们买得越多。这类商品被称为吉芬商品，以 19 世纪英国经济学家罗伯特·吉芬的名字命名。 最经典的案例发生在 19 世纪的爱尔兰。当地农民非常贫困...","href":"/cards/714.html","category":"permanent","createTime":1778930143727}],"children":[]},{"tag":"沉没成本","count":1,"cards":[{"id":715,"summary":"生活中我们常常会陷入一种困境：明明知道继续下去不划算，却因为「已经付出了这么多」而不愿放手。这背后的心理陷阱，就是沉没成本。沉没成本是已经发生，且当下无论做什么都无法挽回的投入，这种投入不仅仅包含金钱，还包括时间、精力和感情等。 举个例子，...","href":"/cards/715.html","category":"permanent","createTime":1778973712093}],"children":[]},{"tag":"禀赋效应","count":1,"cards":[{"id":716,"summary":"你有没有过这样的经历：一件闲置物品，放在家里觉得挺值钱的，但如果让你去买同样的东西，你可能根本不愿意花那个价钱。这种「拥有即高估」的心理倾向，就是禀赋效应。人们一旦拥有一件物品，对该物品的评价会远高于未拥有时的评价。通俗地说，就是敝帚自珍。...","href":"/cards/716.html","category":"permanent","createTime":1778979939946}],"children":[]},{"tag":"锚定效应","count":1,"cards":[{"id":717,"summary":"你有没有过这样的经历：在电商平台看到一件商品，旁边划掉的原价让你觉得当前售价特别划算，甚至有种「赚到了」的感觉？这背后其实是一种被广泛研究的认知偏差在起作用，叫做锚定效应。 锚定效应是行为经济学中的一个核心概念，由心理学家丹尼尔·卡尼曼（D...","href":"/cards/717.html","category":"permanent","createTime":1778982522704}],"children":[]},{"tag":"帕累托改进","count":1,"cards":[{"id":719,"summary":"当我们面对资源分配的问题时，第一反应往往是争抢，但经济学告诉我们，在动手抢之前，先看看有没有把蛋糕做大的空间。这就是 「帕累托改进」 的核心思想：在不损害任何人利益的前提下，让至少一个人的状况变得更好。它提醒我们遇到问题时别急着你死我活，而...","href":"/cards/719.html","category":"permanent","createTime":1778987517218}],"children":[]},{"tag":"帕累托最优","count":1,"cards":[{"id":719,"summary":"当我们面对资源分配的问题时，第一反应往往是争抢，但经济学告诉我们，在动手抢之前，先看看有没有把蛋糕做大的空间。这就是 「帕累托改进」 的核心思想：在不损害任何人利益的前提下，让至少一个人的状况变得更好。它提醒我们遇到问题时别急着你死我活，而...","href":"/cards/719.html","category":"permanent","createTime":1778987517218}],"children":[]},{"tag":"马尔萨斯陷阱","count":1,"cards":[{"id":720,"summary":"人类经过了几千年的发展，为什么始终维持在刚好吃饱的水平？技术带来的生产效率提升和粮食增加，似乎总是被人口增长给消耗掉。英国经济学家、人口学家托马斯·马尔萨斯在 1798 年的《人口论》中提出了这个政治经济学概念，他将 人类生活水平长期停滞 ...","href":"/cards/720.html","category":"permanent","createTime":1778988782824}],"children":[]},{"tag":"印花税","count":1,"cards":[{"id":721,"summary":"在日常经济活动中，当我们签署具有法律效力的特定合同（买卖合同、借款合同、股权转让合同等）时，需要缴纳一种税，叫做印花税。 这个名字来源于历史上的缴纳方式。过去纳税人交税后，会收到一张类似邮票的「印花税票」，纳税人把税票贴在合同或凭证上，画线...","href":"/cards/721.html","category":"permanent","createTime":1778990383707}],"children":[]},{"tag":"库存周期","count":1,"cards":[{"id":723,"summary":"我们常说经济有周期，其中有一个和日常商业活动最贴近的短周期，叫库存周期，也被称为基钦周期。它的核心逻辑很简单：供给与需求之间存在时间差，这个时间差导致库存不断波动，形成周期。 举个例子，假设你在卖一个商品，有一天突然爆火了，而你没有足够多的...","href":"/cards/723.html","category":"permanent","createTime":1779011949485}],"children":[]},{"tag":"产能周期","count":2,"cards":[{"id":724,"summary":"如果说 库存周期 是企业的短期呼吸，那产能周期就是企业的长期心跳。在宏观经济学中，产能周期通常被称为朱格拉周期，是一个持续约 7~11 年的中长周期。 它的核心逻辑和库存周期一脉相承：供给对需求的响应存在时间差，只不过波动的对象从库存变成了...","href":"/cards/724.html","category":"permanent","createTime":1779014472606},{"id":735,"summary":"如今大家对 token 的需求让我想到一个经济学中的概念， 产能周期 。 根据产能周期划分的四个阶段，我认为产能周期目前处在复苏阶段，用户的需求大于产能的供给，所以下一步企业应该会大力的扩大产能，建更多的数据中心以提供更多的算力。 之所以产...","href":"/cards/735.html","category":"permanent","createTime":1779359357641}],"children":[]},{"tag":"挤出效应","count":1,"cards":[{"id":726,"summary":"政府想要刺激经济时，通常会采取扩张性财政政策，比如扩大政府支出或减税。但一个有趣的现象是，这些政策在刺激经济的同时，可能反过来抑制了企业投资和个人消费，使得预期的刺激效果被部分甚至完全抵消。这就是挤出效应，形象地说，就是政府把企业和消费者的...","href":"/cards/726.html","category":"permanent","createTime":1779067263711}],"children":[]},{"tag":"美林时钟","count":1,"cards":[{"id":729,"summary":"在投资中，一个核心问题是：当前经济处于什么阶段，应该配置什么资产？美林证券（现属于美国银行）在 2004 年提出了一个经典的资产配置框架来回答这个问题，即美林时钟（Merrill Lynch Investment Clock）。它根据两个宏...","href":"/cards/729.html","category":"permanent","createTime":1779148853061}],"children":[]},{"tag":"再贷款","count":1,"cards":[{"id":731,"summary":"央行要调控宏观经济，核心手段之一就是控制基础货币的投放量。再贷款和再贴现是央行较早使用的两个货币政策工具，它们的共同点是央行直接向商业银行提供资金，区别在于方式不同。 再贷款，顾名思义是\"再一次贷款\"。普通贷款是商业银行把钱贷给企业或个人，...","href":"/cards/731.html","category":"permanent","createTime":1779231213029}],"children":[]},{"tag":"再贴现","count":1,"cards":[{"id":731,"summary":"央行要调控宏观经济，核心手段之一就是控制基础货币的投放量。再贷款和再贴现是央行较早使用的两个货币政策工具，它们的共同点是央行直接向商业银行提供资金，区别在于方式不同。 再贷款，顾名思义是\"再一次贷款\"。普通贷款是商业银行把钱贷给企业或个人，...","href":"/cards/731.html","category":"permanent","createTime":1779231213029}],"children":[]},{"tag":"广场协议","count":1,"cards":[{"id":734,"summary":"日本经济「失去的二十年」乃至三十年，是许多人耳熟能详的故事。但追溯这场长期停滞的源头，往往会指向 1985 年的一纸协议。当年 9 月 22 日，美国、日本、联邦德国、法国和英国（G5）财政部长及央行行长在纽约广场饭店签署了一项国际货币协议...","href":"/cards/734.html","category":"permanent","createTime":1779326378800}],"children":[]}]},{"tag":"博弈论","count":2,"cards":[],"children":[{"tag":"饿狮博弈","count":1,"cards":[{"id":701,"summary":"博弈论中有一个经典问题：草原上有 N 只狮子和一头羊，每只狮子都极度理性，它们的偏好排序是\"吃饱 \u003e 饿着 \u003e 被吃\"。关键设定是，狮子吃完羊后需要消化，这段时间会进入虚弱状态，可以被其它狮子吃掉。那么，会不会有狮子敢去吃羊？ 要分析这个问...","href":"/cards/701.html","category":"permanent","createTime":1778139035033}],"children":[]},{"tag":"智猪博弈","count":1,"cards":[{"id":702,"summary":"在一个猪圈里，有一头大猪和一头小猪。猪圈的一端装了一个按钮，按下后，另一端的食槽会掉下固定量的食物。但按按钮需要消耗体力，而且按完还得跑过去抢食。大猪体力好、跑得快、吃得快，小猪则相反。 那么问题来了：谁会去按这个按钮？ 答案是大猪。原因在...","href":"/cards/702.html","category":"permanent","createTime":1778160795854}],"children":[]}]},{"tag":"心理","count":2,"cards":[],"children":[{"tag":"损失厌恶","count":1,"cards":[{"id":716,"summary":"你有没有过这样的经历：一件闲置物品，放在家里觉得挺值钱的，但如果让你去买同样的东西，你可能根本不愿意花那个价钱。这种「拥有即高估」的心理倾向，就是禀赋效应。人们一旦拥有一件物品，对该物品的评价会远高于未拥有时的评价。通俗地说，就是敝帚自珍。...","href":"/cards/716.html","category":"permanent","createTime":1778979939946}],"children":[]},{"tag":"锚定效应","count":1,"cards":[{"id":717,"summary":"你有没有过这样的经历：在电商平台看到一件商品，旁边划掉的原价让你觉得当前售价特别划算，甚至有种「赚到了」的感觉？这背后其实是一种被广泛研究的认知偏差在起作用，叫做锚定效应。 锚定效应是行为经济学中的一个核心概念，由心理学家丹尼尔·卡尼曼（D...","href":"/cards/717.html","category":"permanent","createTime":1778982522704}],"children":[]}]},{"tag":"国际政治","count":1,"cards":[],"children":[{"tag":"修昔底德陷阱","count":1,"cards":[{"id":722,"summary":"当一个新兴大国崛起，必然会对现有霸权国家的地位构成挑战，双方之间是否注定走向冲突甚至战争？2012年，哈佛大学政治学者格雷厄姆·艾利森（Graham Allison）将这一结构性困境命名为「修昔底德陷阱」。 该术语源自古希腊历史学家修昔底德...","href":"/cards/722.html","category":"permanent","createTime":1778995696189}],"children":[]}]}],"activeTag":"Electron/踩坑","content":{"id":522,"content":[{"type":"paragraph","children":[{"type":"formatted","text":"在 Electron 中，"},{"type":"formatted","text":"img","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"audio","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"video","code":true},{"type":"formatted","text":" 如何访问本地文件。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果直接通过本地文件路径去访问文件，是不行的"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af7cd0dd-1b35-4d5c-a628-98b96f4505cc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af7cd0dd-1b35-4d5c-a628-98b96f4505cc.png"},{"type":"paragraph","children":[{"type":"formatted","text":"Electron 可以注册 Scheme 协议，通过这个协议访问，获取到 Scheme 链接后通过内置的 "},{"type":"formatted","text":"net","code":true},{"type":"formatted","text":" 函数访问内容然后返回，对于图片没问题，但是对于音视频有问题"}],"disableDrag":false},{"type":"code-block","code":"protocol.handle('ltoh', (req) =\u003e {\n  const url = new URL(req.url);\n  return net.fetch('file://' + url.pathname);\n});","language":"JavaScript","uuid":"2f425ea1-a684-476a-a585-a0f62921f63f","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_379147fa-7c3d-499b-b724-afb684df7f00.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_379147fa-7c3d-499b-b724-afb684df7f00.png"},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"经过研究发现，音视频是通过 "},{"type":"formatted","text":"Range","code":true},{"type":"formatted","text":" 请求数据的，于是处理请求头，读取本地文件内容，根据 "},{"type":"formatted","text":"Range","code":true},{"type":"formatted","text":" 返回对应的数据"}]},{"type":"code-block","code":"protocol.handle(\"ltoh\", async (request) =\u003e {\n  try {\n    // 转换URL为文件路径\n    const parsedUrl = new URL(request.url);\n    const filePath = parsedUrl.pathname.slice(\n      process.platform === \"win32\" ? 1 : 0,\n    );\n\n    // 验证文件存在\n    if (!existsSync(filePath) || !statSync(filePath).isFile()) {\n      return new Response(\"Not Found\", { status: 404 });\n    }\n\n    // 获取文件信息\n    const stats = statSync(filePath);\n    const fileSize = stats.size;\n    const rangeHeader = request.headers.get(\"range\") || \"\";\n    const mimeType = getMimeType(extname(filePath));\n\n    // 处理范围请求\n    if (\n      (rangeHeader && mimeType.startsWith(\"video/\")) ||\n      mimeType.startsWith(\"audio/\")\n    ) {\n      const ranges = rangeHeader.replace(/bytes=/, \"\").split(\"-\");\n      const start = parseInt(ranges[0], 10);\n      const end = ranges[1] ? parseInt(ranges[1], 10) : fileSize - 1;\n\n      return streamResponse(\n        filePath,\n        {\n          status: 206,\n          headers: {\n            \"Content-Type\": mimeType,\n            \"Content-Length\": (end - start + 1).toString(),\n            \"Content-Range\": `bytes ${start}-${end}/${fileSize}`,\n            \"Accept-Ranges\": \"bytes\",\n            \"Cache-Control\": \"public, max-age=31536000\",\n          },\n        },\n        { start, end },\n      );\n    }\n\n    // 完整文件请求\n    return streamResponse(filePath, {\n      status: 200,\n      headers: {\n        \"Content-Type\": mimeType,\n        \"Content-Length\": fileSize.toString(),\n        \"Accept-Ranges\": \"bytes\",\n        \"Cache-Control\": \"max-age=604800\", // 7天缓存\n      },\n    });\n  } catch (error) {\n    return new Response(\"Internal Error\", { status: 500 });\n  }\n});","language":"TypeScript","uuid":"a5d28dd0-4b23-4f71-ad73-119e8b0d2b5f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在图片和音频都正常，视频不正常，原因暂时未知"}],"disableDrag":false},{"type":"code-block","code":"const handleOnError = useMemoizedFn(\n  (e: React.SyntheticEvent\u003cHTMLVideoElement, Event\u003e) =\u003e {\n    setPreviewUrl(src);\n    // @ts-ignore\n    const errorCode = e.target.error?.code as string;\n    const errorMessage: string =\n      {\n        \"1\": \"MEDIA_ERR_ABORTED - 用户取消加载\",\n        \"2\": \"MEDIA_ERR_NETWORK - 网络错误\",\n        \"3\": \"MEDIA_ERR_DECODE - 解码错误\",\n        \"4\": \"MEDIA_ERR_SRC_NOT_SUPPORTED - 格式不支持\",\n      }[errorCode] || \"未知错误\";\n\n    console.error(\"视频错误:\", errorMessage);\n  },\n);","language":"TypeScript","uuid":"53614648-acfa-4cd0-95f9-7eac957743be","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a30c5ce8-14be-4d76-880d-c42542633f82.png","uuid":"cfa5c254-8685-4ce0-845f-caf53e6395fc","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a30c5ce8-14be-4d76-880d-c42542633f82.png"},{"type":"paragraph","children":[{"type":"formatted","text":"视频的解决办法，直接读取本地文件的二进制数据，创建 Blob 对象，通过 Blob Url 访问，缺点就是不能流式访问，对于小文件还好，对于大文件可能内存吃不消，以及性能上可能存在问题，（300M 的视频要 20 多秒）"}],"disableDrag":false},{"type":"code-block","code":"const data = await readBinaryFile(absolutePath);\nconst ext = await getFileExtension(absolutePath);\nconst blob = new Blob([data], { type: getMimeType(ext) });\nconst videoUrl = URL.createObjectURL(blob);","language":"TSX","uuid":"5b2f5d75-c0af-44a4-8a13-c7933a833712","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"暂时没想到其他好办法，Tauri 上启动一个 HTTP 服务器支持的蛮好的。"}],"disableDrag":false},{"type":"divide-line","disableDrag":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在新公司发现公司启动了一个 "},{"type":"formatted","text":"express","code":true},{"type":"formatted","text":" 服务器来解决这个问题，使用 "},{"type":"formatted","text":"express","code":true},{"type":"formatted","text":" 在某个端口启动一个静态服务器，对于位于某个路径下的文件使用 "},{"type":"formatted","text":"express","code":true},{"type":"formatted","text":" 启动的静态服务器，然后通过 HTTP 地址直接访问，因为我的文件都放在 "},{"type":"formatted","text":"appDir","code":true},{"type":"formatted","text":" 这个目录下，直接将这个目录作为静态服务，完美解决"}]},{"type":"code-block","code":"Express.static(appDir, {\n  setHeaders: (res) =\u003e {\n    res.setHeader(\"Access-Control-Allow-Origin\", \"*\");\n    res.setHeader(\n      \"Access-Control-Allow-Methods\",\n      \"GET, POST, PUT, DELETE, OPTIONS\",\n    );\n    res.setHeader(\n      \"Access-Control-Allow-Headers\",\n      \"Content-Type, Authorization\",\n    );\n  },\n}),","language":"TypeScript","uuid":"9a9fc0e9-21c7-4235-a6b8-e0147c428351","children":[{"type":"formatted","text":""}]}],"tags":["Electron/踩坑","Electron/技巧","踩坑/Electron","技巧/Electron"],"category":"permanent","createTime":1740286228403,"updateTime":1754034404593,"linkedCards":[]},"meta":{"type":"card","publishTime":1780312094890},"settings":{"appearance":{"image":{"borderRadius":"md","shadow":"sm"}}}};
