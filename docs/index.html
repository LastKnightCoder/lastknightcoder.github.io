含时间相关的事项（截止任务、计划任务和周期任务）会自动同步到日历中。","href":"/docs/document/14/626.html","tags":[],"createTime":1766915540130},{"id":625,"title":"任务待办","summary":"除了普通的待办外，还支持三种和时间相关的待办： 截止任务，设定一个截止日期，需要在截止日期之前完成 计划任务，打算在某一时间段完成一件任务 周期任务，以某个周期产生一个任务 在创建任务时，点击输入框前面的图标可以切换任务类型","href":"/docs/document/14/625.html","tags":[],"createTime":1766915518140},{"id":629,"title":"番茄专注","summary":"支持创建番茄钟来帮助保持专注 番茄钟有两种模式，一种是倒计时，比如 25 分钟，时间到了番茄钟计时结束，进入休息。另一种是正计时，只负责记录时间，需要手动结束。 我觉得倒计时很容易打断心流，因为做的事情不可能正好就结束了，所以我更喜欢正计时...","href":"/docs/document/14/629.html","tags":[],"createTime":1766915808695},{"id":646,"title":"聊天管理","summary":"配置 在侧边栏有一个与 AI 模型进行聊天的快捷入口，聊天服务需要在大语言模型中进行配置 每次对话完成后，软件会尝试使用配置的标题总结模型来自动生成标题，如果需要此项服务，也需要在大语言模型中进行配置 对话输入框和我们的富文本编辑器输入框一...","href":"/docs/document/14/646.html","tags":[],"createTime":1767260440159},{"id":634,"title":"内置工具与 MCP","summary":"如果模型只能和我们聊天，不能操作我们的数据，那么就没办法进行提效，因此软件提供了大量的内置工具，点击侧边栏聊天下方的 MCP 管理中心就可以看到提供的内置工具 这些内置工具基本包括了对卡片、文章、知识库、项目文档的内容的查询，以及这些文档的...","href":"/docs/document/14/634.html","tags":[],"createTime":1766915900299},{"id":649,"title":"数据库","summary":"这里的数据库是类似于 Notion 的数据库，就是一份数据源，然后有不同的渲染形式。 这个数据库解决不是知识管理的问题，没有自动化关联数据联动更新这样的功能，纯粹是有一些结构化的数据需要统计管理，比如看过的书，读后感关联，而简单的表格无法承...","href":"/docs/document/14/649.html","tags":[],"createTime":1767263367145},{"id":624,"title":"问题管理","summary":"很多时候我读了一些书，看了一些视频，但是却没有输出任何东西，会让人特别焦虑，但是在读书的时候，如果按照书里面的思路做笔记，却发现我自己被限制住了，我的写作风格是要把一件事情写明白（这也是为什么我的卡片有时候会写的和文章一样长），而如果记录读...","href":"/docs/document/14/624.html","tags":[],"createTime":1766915346025},{"id":644,"title":"Markdown 文件编辑器","summary":"基于当前编辑器所见即所得的富文本编辑能力，以及和 Markdown 文件之间的无损转换，支持直接打开已有的 Markdown 文件进行编辑和阅读，编辑体验上对齐 Typora。 因为编辑的是一个文件，相比于软件内的富文本编辑有一些不同之处：...","href":"/docs/document/14/644.html","tags":[],"createTime":1767260352255},{"id":623,"title":"知识库","summary":"我把知识库定位为系统化的知识输出工具。当你系统学习了某个领域，积累了一些散落的笔记，就可以创建一个知识库，按照「如果要写一本书，我会怎么组织内容」的思路去整理知识。一旦能形成一个体系完整的知识库，基本可以说在这个领域已经比较拔尖了。 这个定...","href":"/docs/document/14/623.html","tags":[],"createTime":1766915339230},{"id":622,"title":"项目","summary":"项目这一概念来自《打造第二大脑》，核心思路是把当前正在进行的事情作为项目，主动广泛地搜集资料。我引入这个概念，是因为在实践卡片笔记写作法的过程中，我发现这种方法过于被动，需要等待卡片自然而然地连接、形成主题，这个过程太慢了，而且是不连贯的。...","href":"/docs/document/14/622.html","tags":[],"createTime":1766915334145},{"id":621,"title":"文章","summary":"写作是检验你是否真正弄懂了一件事情的验金石，如果你没有搞懂，你是绝对写不出来的，但这不代表说我不懂就不写了，我觉得写作不仅仅是检验的手段，它还是一种十分高效的学习手段，在写作的过程中，你需要去组织语言，需要回忆知识点，这个过程中你的大脑在高...","href":"/docs/document/14/621.html","tags":[],"createTime":1766915329174},{"id":612,"title":"白板","summary":"支持一个无限大可拖拽可缩放的白板。","href":"/docs/document/14/612.html","tags":[],"createTime":1766914658806},{"id":635,"title":"SKILL 管理","summary":"所谓 SKILL 就是技能包，比如你对做一件事情有自己的工作流或者有特殊要求，但是 AI 不知道，那么就可以形成自己的技能包，把这个技能教给 AI，可以自动化的完成这件事情。 首先在 SKILL 管理页面点击侧边栏右上角的 + 添加技能包 ...","href":"/docs/document/14/635.html","tags":[],"createTime":1766915910852},{"id":637,"title":"播客生成","summary":"支持根据内容自动生成多人播客，需要提前配置两个设置： 生成播客脚本的 AI 模型 配置 TTS，将文字转化为语音 目前仅接入了 Minimax 语音生成，需要在集成中配置 Minimax 的 API key 然后在「文字转语音」Tab 选择...","href":"/docs/document/14/637.html","tags":[],"createTime":1766915926542},{"id":852,"title":"闪卡","summary":"学习分为学和习，古人讲学而时习之，除了学之外我们还要经常复习，这样才能反复且持续的激活神经元，只有激活了正确的神经元，那才是有效的学习。 而闪卡就是一个非常有效的复习手段，它的正面印着问题，反面印着答案，我们需要在不看答案的前提下去主动回忆...","href":"/docs/document/14/852.html","tags":[],"createTime":1777716804838},{"id":849,"title":"视频笔记","summary":"界面说明 在 项目 中，我们支持添加一条视频笔记，支持的视频来源有 本地视频 网络视频 bilibili 视频 youtube 视频 notion 视频 添加视频后，我们会进入到视频笔记特定的 UI 大致分为三个区域： 左上角是视频，无论来...","href":"/docs/document/14/849.html","tags":[],"createTime":1777708980430},{"id":628,"title":"微信读书","summary":"软件支持同步微信读书中的书架书籍详情，以及读书划线和笔记，这个功能主要的目的是可以搜集在微信读书上零散的读书想法和笔记，然后统一在软件中整体为卡片，也可以做一些统计，追踪自己的读书进度。 点击书名列右侧的按钮，就可以看到这本书所有的划线和笔...","href":"/docs/document/14/628.html","tags":[],"createTime":1766915784552},{"id":850,"title":"Vibe Learning","summary":"这个功能的灵感来自于 NotebookLM，这个应用支持用户上传资料，然后通过和 AI 聊天来学习资料，并且还可以生成 PPT，视频，测验来帮助用户来进一步的理解内容，学习效率很高，于是我也尝试在本地复现了这个功能，因为这种学习方式和 Vi...","href":"/docs/document/14/850.html","tags":[],"createTime":177770899 ard）有 5 块砖瓦，用数字 1~5 来表示, 以及一块空缺用 0 来表示。一次移动定义为选择 0 与一个相邻的数字（上下左右）进行交换。最终当板 board 的结果是 [[1,2,3],[4,5...","href":"/docs/document/1/37.html","tags":[],"createTime":1702051648661},{"id":34,"title":"二进制矩阵中的最短路径","summary":"题目描述 在一个 N \\times N 的方形网格中，每个单元格有两种状态：空（0）或者阻塞（1）。现在我们的目标是从 (0, 0) 到达 (N-1, N-1) ，即从左上角到达右下角，而我们的目标是寻找一条最短路径，并且返回这条路径的长度...","href":"/docs/document/1/34.html","tags":[],"createTime":1702051018861},{"id":256,"title":"38 免疫系统太激进：过敏","summary":"埃博拉病毒，感染了也要 6 天才会死，而过敏发作，15 分钟就会没命。 过度意味着免疫系统对不怎么危险的东西产生了大规模过度反应。就像是在房子里发现一只虫子，然后动用了核武器把整个城市夷为平地，虫子消灭了，城市也没了。 引发过敏的抗原是无害...","href":"/docs/project/21/256.html","tags":[],"createTime":1741908599152},{"id":257,"title":"39 免疫系统可能想念寄生虫","summary":"世界上有近 300 种寄生虫可以感染人类，其中有十几种广泛传播。寄生虫感染在欠发达的地区猖獗。 IgE 的奇怪机制就是为了应对寄生虫感染而生。首先认出寄生虫，在寄生虫在身体于外界的交界处，驻扎在皮肤，肠道，呼吸道的特殊 B 细胞会开始生成大...","href":"/docs/project/21/257.html","tags":[],"createTime":1741910102499},{"id":258,"title":"40 自身免疫性疾病","summary":"免疫系统对自身免疫非常小心，只有能区分自身和异物的细胞才能离开胸腺。 自身免疫正常的情况下，T 细胞和 B 细胞可以识别自体细胞的蛋白（自身抗原）。一旦受到误导，T 细胞和 B 细胞和自身抗原结合，免疫系统不能区分自身和异物，麻烦就大了。 ...","href":"/docs/project/21/258.html","tags":[],"createTime":1741912905099},{"id":259,"title":"41 卫生假说和老朋友","summary":"20 世纪后半叶，发达国家出现的两种有悖常理的趋势： 天花、流行性腮腺炎、麻疹、结核等危险传染病得到了有效遏制 其他一些病发病率不断上升，并且暴涨 国家的发达、富裕程度，和过敏或自身免疫性疾病的患病率之间似乎存在某种直接的联系。 卫生假说：...","href":"/docs/project/21/259.html","tags":[],"createTime":1741914243991},{"id":260,"title":"42 如何强化免疫系统","summary":"强化免疫系统不是好主意，都是骗你买没用东西想出来的： 强化巨噬细胞和中性粒细胞 -\u003e 导致更多、更严重的发炎、发热、不适和乏力 强化自然杀伤性细胞 -\u003e 导致 NK 细胞太过激进，损失健康细胞 强化树突细胞 -\u003e 频繁激活适应性免疫系统，大...","href":"/docs/project/21/260.html","tags":[],"createTime":1741915364689},{"id":261,"title":"43 免疫系统与应激","summary":"在几百万年前，人类组建为了应对环境，例如野兽袭击，需要对感知到的危险做出强烈反应，不管危险是否存在，能快速做出反应的生物更容易存活。在这种自然选择下，人类组建变得很擅长快速识别应激源并迅速做出反应，这是自动过程。 免疫系统也会被应激状态做出...","href":"/docs/project/21/261.html","tags":[],"createTime":1741915996365},{"id":262,"title":"44 免疫系统与癌症","summary":"癌症是指某些部位的细胞不受控制地生长和增殖，可以分为两种： 发生于肺、肌肉、大脑、骨骼或性器官等实质性器官，形成肿瘤 良性肿瘤不会像癌细胞侵犯其他组织和器官 docs/project/21/237.html","tags":[],"createTime":1741743447227},{"id":238,"title":"32 天生杀手","summary":"自然杀伤细胞（NK 细胞）。 和 T 细胞有亲缘，但发育成熟后会脱离 T 细胞家族，加入先天免疫性系统。 它寻找两种敌人：被病毒感染的细胞核癌变的细胞。 它不通过 MHC-I 类分子去看发生了什么，而是看有没有 MHC-I 类分子，如果受感...","href":"/docs/project/21/238.html","tags":[],"createTime":1741744123303},{"id":242,"title":"33 如何清除病毒感染","summary":"对抗病毒的整个环节： 先天性免疫系统力图遏制感染迅速扩展 大量化学信号散发，请求调高体温 产生更多黏液，让人剧烈咳嗽，把病毒排出体外 自然杀伤细胞两三天后抵达战场，杀死不在现实 MHC-I 类分子的感染细胞 树突细胞对战场进行采样，放入自己...","href":"/docs/project/21/242.html","tags":[],"createTime":1741821784926},{"id":243,"title":"34 关闭免疫应答","summary":"关闭免疫应答很重要，因为活跃的免疫系统会造成附带损伤，消耗大量能力，不过如果太早关闭，病原体还有机会死灰复燃。需要在合适的时机关闭。 随着战斗的进行，敌人数量减少，战场的释放的细胞因子减少，被激活的免疫细胞变少，没有新的免疫细胞释放细胞因子...","href":"/docs/project/21/243.html","tags":[],"createTime":1741822893540},{"id":222,"title":"条目 #222","summary":"肠道黏膜是那个生活了 1000 多种细菌，数量达三四十万亿，还有几千种病毒，组成了肠道微生物群。 肠道免疫系统是一个半封闭系统，和其他部位的免疫系统保持一定界限。 肠道黏膜的最大挑战，它的防线一直在被攻破，要持续响应分辨敌友。 90% 以上...","href":"/docs/project/21/222.html","tags":[],"createTime":1741652988665},{"id":223,"title":"26 病毒是什么","summary":"病毒是最简单的能自我复制的生物，病毒只是个壳子，里面装着少许几条遗传编码和一些蛋白分子而已，完全依赖其他真正的生物而活。 据估计，地球上有 10^{31} 个病毒。 病毒为了繁荣昌盛，它需要进入细胞内不，它们会攻击受体。病毒外壳上有特殊的蛋...","href":"/docs/project/21/223.html","tags":[],"createTime":1741655833273},{"id":224,"title":"27 肺部免疫系统","summary":"人每次吸气量约 500ml，除了氧气外还有很多无用气体和各种微粒。 细菌、病毒、真菌孢子可以吸附在空气的颗粒物、水蒸气或漂浮在空中。肺面临着大量有毒物质、颗粒和微生物的侵袭，如果免疫系统发生大规模反应，会造成组织损伤，这可不行。 鼻腔是呼吸...","href":"/docs/project/21/224.html","tags":[],"createTime":1741656795013},{"id":201,"title":"第二十一课：动画与模拟I","summary":"现在有一个问题，运动的物体如何表示？ 动画，让东西动起来 交流工具 美学 动画可以理解为建模，几何的扩展，动画就是在不同的帧有不同的几何形状，把 3D 的模型衍生到了时间的维度上 视觉暂留的效应，不需要在整个时间范围内非常集中的采样 对于电...","href":"/docs/project/18/201.html","tags":[],"createTime":1741493482045},{"id":205,"title":"21 军工厂和狙击枪","summary":"B 细胞比 T 细胞稍大，二者都源于骨髓，且都必须进行残酷的训练： T 细胞在胸腺 B 细胞在骨髓 B 细胞表面至少有几亿到几十亿受体，每个 B 细胞都有 能识别某一特定抗原的特定受体。 抗体是 B 细胞的受体，类似狙击枪，转为结合特定抗原...","href":"/docs/project/21/205.html","tags":[],"createTime":1741565497207},{"id":210,"title":"24 沼
