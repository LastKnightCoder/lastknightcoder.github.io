点之间的路径是什么，即一个节点到达另一个节点会经历哪些节点。 对于下...","href":"/docs/document/1/28.html","tags":[],"createTime":1701959129652},{"id":29,"title":"无向图的环检测","summary":"我们怎么判断一幅图有没有环呢? 很简单，我们使用深度优先遍历，当访问到某节点时，如果该节点的某邻接节点已经被访问过，并且该邻接节点不是它的上一个节点，那么就说明该图中包含一个环 明白这一点以后我们就可以编写代码了 import java.u...","href":"/docs/document/1/29.html","tags":[],"createTime":1701959506770},{"id":30,"title":"二分图检测","summary":"什么叫二分图 二分图需要满足一下两个特点： 图中的节点被划分为两部分 图中的边连接的是两个部分的节点 在上图中，节点 0, 3, 4, 5 是一部分，节点 1, 2, 6 是一部分，两部分的节点我使用不同的颜色进行填充；且图中所有的边都连接...","href":"/docs/document/1/30.html","tags":[],"createTime":1701959719442},{"id":33,"title":"岛屿的最大面积","summary":"题目介绍 给定一个包含了一些 0 和 1 的非空二维数组 grid。一个岛屿是由一些相邻的 1 (代表土地) 构成的组合，这里的「相邻」要求两个 1 必须在水平或者竖直方向上相邻。你可以假设 grid 的四个边缘都被 0 (代表水) 包围着...","href":"/docs/document/1/33.html","tags":[],"createTime":1702050746921},{"id":32,"title":"广度优先遍历","summary":"树的层序遍历 树的层序遍历是指一层一层的遍历树的节点，它的实现是借助于队列进行实现的： 每一次从队列的头部取出元素进行遍历，然后将该元素的左右孩子添加进队列，以此往复，直至队列为空，遍历结束。 import java.util.Linked...","href":"/docs/document/1/32.html","tags":[],"createTime":1702012345402},{"id":38,"title":"桥和割点","summary":"桥 定义 我们首先看一下桥的概念 上面这幅图中，我们称节点 3-5 之间的这条边为桥，它具有什么特点呢? 一旦将这条边去掉，图的联通分量就会发生变化，所以有如下定义： 如果去掉某条边，使得图的联通分量发生变化，那么称这条边为桥。 桥可以看做...","href":"/docs/document/1/38.html","tags":[],"createTime":1702052079120},{"id":41,"title":"欧拉回路","summary":"18世纪初普鲁士的哥尼斯堡，有一条河穿过，河上有两个小岛，有七座桥把两个岛与河岸联系起来，如下图(黄色线条代表桥，绿色区域代表小岛和河岸) 有个人提出一个问题：一个步行者怎样才能不重复、不遗漏地一次走完七座桥，最后回到出发点。 数学家欧拉将...","href":"/docs/document/1/41.html","tags":[],"createTime":1702087613168},{"id":42,"title":"最小生成树","summary":"概念 首先介绍生成树的概念，假设图中有 V 个顶点，如果能找到图中 V - 1 条边这 V 个节点连接起来，那么就说这 V 个节点与 V - 1 条边形成的图叫做这个图的生成树。 例如图的 DFS 遍历以及 BFS 遍历就会形成一个生成树 ...","href":"/docs/document/1/42.html","tags":[],"createTime":1702088303482},{"id":46,"title":"Floyed 算法","summary":"Dijkstra 和 Bellman-Ford 算法解决的都是单源最短路径问题，而 Floyed 算法解决的所有点对之间的最短问题。我们其实可以通过使用 V 次 Dijkstra 算法就可以求解所有点对之间的最短路径，不过 Dijkstra...","href":"/docs/document/1/46.html","tags":[],"createTime":1702090073149},{"id":45,"title":"
