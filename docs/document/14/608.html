    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"软件使用文档","children":[{"title":"为什么会写一个笔记软件","href":"/docs/document/14/609.html"},{"title":"软件理念","href":"/docs/document/14/608.html"},{"title":"编辑器","href":"/docs/document/14/610.html","children":[{"title":"行内样式","href":"/docs/document/14/642.html"},{"title":"Slash 面板","href":"/docs/document/14/653.html"},{"title":"标题","href":"/docs/document/14/652.html"},{"title":"列表","href":"/docs/document/14/651.html"},{"title":"React 自定义组件"},{"title":"Typst"},{"title":"Tikz"},{"title":"PlantUML"}]},{"title":"功能模块","children":[{"title":"知识管理","children":[{"title":"卡片","href":"/docs/document/14/620.html"},{"title":"文章"},{"title":"项目"},{"title":"知识库"},{"title":"问题管理"},{"title":"PDF"},{"title":"微信读书","href":"/docs/document/14/628.html"},{"title":"白板","children":[{"title":"Frame"},{"title":"Column","href":"/docs/document/14/617.html"},{"title":"演示模式"},{"title":"思维导图"}]}]},{"title":"效率管理","children":[{"title":"数据库"},{"title":"任务待办"},{"title":"日历"},{"title":"日记"},{"title":"番茄专注"}]},{"title":"高级功能","children":[{"title":"AI 搜索","href":"/docs/document/14/641.html"},{"title":"同步"},{"title":"资源存储"},{"title":"发布"},{"title":"导出"},{"title":"文档演示"}]}]},{"title":"AI","children":[{"title":"聊天管理"},{"title":"向量数据库"},{"title":"MCP 和内置工具"},{"title":"SKILL 管理"},{"title":"音视频转录"},{"title":"播客生成"}]},{"title":"Markdown 文件编辑器"}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document","active":true},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":608,"title":"软件理念","content":[{"type":"paragraph","children":[{"type":"formatted","text":"软件最初的理念来自于《笔记卡片写作法》这本书，这本书讲的是如何构建卡片盒来帮助你写作，其中关于如何使用卡片盒这种工具去构建你的知识体系让人备受启发，相比于我们常见的自上而下的组织内容，卡片盒是一种自下而上的组织形式，通过卡片之间的关联，自下而上的构建出不同的知识网络，知识体系是自然而然的长出来的，而不是提前规划好的。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"一般我们去学习一个领域的时候，比较强调系统学习，从一本书，从一系列课程从头到尾的学习，我们会根据内容大纲创建相应的文件夹，然后在文件夹中记录相应的知识点。这种学习方式的问题是什么呢？那就是过于被动，我们只是在跟随别人的思路在记笔记，在整个的学习过程中无法有效的激活我们的大脑，最明显的现象就是记了就忘，学了白学。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"而卡片写作法呢，"},{"type":"formatted","text":"它强调的不是记，而是写作","bold":true},{"type":"formatted","text":"，不是直接摘抄书中的内容，或者记录视频的内容，而是使用自己的话对内容进行转述，从自己的话写一遍，从记变为写，就是从被动变为主动，主动将会极大地激活神经元，而同时激活的神经元会形成连接，正是这种神经元之间的连接让我们在需要使用相关知识时能快速的提取出来，而不是记了就忘。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"另外更重要的是"},{"type":"formatted","text":"它强调卡片之间的联系","bold":true},{"type":"formatted","text":"，当我们向卡片盒中添加卡片时，一定要先思考这张卡片和卡片盒中的其它卡片之间的关系是什么，并进行连接，随着我们添加的卡片越来越多，卡片之间的联系将会形成网状结构，形成的卡片网络就是卡片自下而上形成的主题，甚至卡片可以跨领域形成连接，帮助我们形成跨领域的洞见。正是这种建立联系的步骤，让我们的卡片盒不会随着卡片数量的增多趋于无序紊乱，反而会因为卡片数量越多，卡片盒更强。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"卡片笔记能解决很多问题："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"降低输入压力。相比于写一篇文章，卡片要求聚焦一个问题，不需要考虑整体的结构，自然而然的把复杂问题进行了拆解，相比于完成一篇结构清晰的文章，输出一张解决某个问题的卡片明显具有更小的压力，"},{"type":"formatted","text":"可以帮助我们快速开始","bold":true}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"原子化。原子化不是短，而是"},{"type":"formatted","text":"一张卡片只承担一个不可再拆的认知判断。","bold":true},{"text":"每一张卡片都可以单独为引用、论证，与其它卡片产生联系。","type":"formatted"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"降低思考模糊。一旦要求你把内容压缩为一个判断，那么关于内容的模糊理解就会立马暴露出来，好像懂了但是却写不出来，它会强迫你将模糊的判断变得清晰，你必须阐述一个明确的观点。"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"组合空间指数增长。由于每张卡片都可以和其它卡片产生联系，假设你拥有 50 张卡片，那么你拥有的不是 50 个想法，而是大量的潜在结构，卡片之间的联系可以让你有不同的文章角度，不同的论证路径，不同的主题聚集，随着卡片越来越多，组合的空间是指数级增长，卡片之间的联系会形成你意想不到的论证角度，甚至形成跨领域的联系。"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"去情境化。普通笔记和输入来源高度相关，一旦离开上下文，就变得没有意义。而卡片则要求使用自己的话讲述，表达的是一个观点，而不是出处，可以在任意语境中被调用，让笔记成为你的资产而不是书的附属品。"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"新的检索方式。不是搜索，而是笔记之间的连接路径。"}]}]}]},{"type":"blockquote","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"卡片的价值不在于“记录”，而在于：它把思考拆解成可以被操作、被组合、被生长的最小单元。"}]}]}],"breadcrumb":[{"label":"软件使用文档","href":"/docs/document/14/609.html"},{"label":"软件理念","href":"/docs/document/14/608.html"}],"prevPage":{"title":"为什么会写一个笔记软件","href":"/docs/document/14/609.html"},"nextPage":{"title":"编辑器","href":"/docs/document/14/610.html"},"createTime":1765725196977,"updateTime":1765848998045,"currentPath":"/docs/document/14/608.html"},"meta":{"type":"doc","publishTime":1767266228457}};
