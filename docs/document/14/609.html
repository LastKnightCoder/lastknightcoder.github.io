    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"软件使用文档","children":[{"title":"为什么会写一个笔记软件","href":"/docs/document/14/609.html"},{"title":"软件理念","href":"/docs/document/14/608.html"},{"title":"编辑器","href":"/docs/document/14/610.html","children":[{"title":"行内样式","href":"/docs/document/14/642.html"},{"title":"Slash 面板","href":"/docs/document/14/653.html"},{"title":"标题","href":"/docs/document/14/652.html"},{"title":"列表","href":"/docs/document/14/651.html"},{"title":"React 自定义组件"},{"title":"Typst"},{"title":"Tikz"},{"title":"PlantUML"}]},{"title":"功能模块","children":[{"title":"知识管理","children":[{"title":"卡片","href":"/docs/document/14/620.html"},{"title":"文章"},{"title":"项目"},{"title":"知识库"},{"title":"问题管理"},{"title":"PDF"},{"title":"微信读书","href":"/docs/document/14/628.html"},{"title":"白板","children":[{"title":"Frame"},{"title":"Column","href":"/docs/document/14/617.html"},{"title":"演示模式"},{"title":"思维导图"}]}]},{"title":"效率管理","children":[{"title":"数据库"},{"title":"任务待办"},{"title":"日历"},{"title":"日记"},{"title":"番茄专注"}]},{"title":"高级功能","children":[{"title":"AI 搜索","href":"/docs/document/14/641.html"},{"title":"同步"},{"title":"资源存储"},{"title":"发布"},{"title":"导出"},{"title":"文档演示"}]}]},{"title":"AI","children":[{"title":"聊天管理"},{"title":"向量数据库"},{"title":"MCP 和内置工具"},{"title":"SKILL 管理"},{"title":"音视频转录"},{"title":"播客生成"}]},{"title":"Markdown 文件编辑器"}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document","active":true},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":609,"title":"为什么会写一个笔记软件","content":[{"type":"paragraph","children":[{"type":"formatted","text":"我是一个非常喜欢记笔记的人，最开始记笔记可能是为了缓解焦虑，给我带来安全感，特别是在上完一节课之后什么都没记住，如果连笔记都没有就更让人焦虑，感觉这节课就白上了，白白浪费了时间。在这个时期，我记笔记的方式在纸质笔记本上手写，要么是课堂笔记，要么是抄 PPT。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这种行为明显是低效的，因为抄笔记这个行为根本无法激活大脑思考，过了一两天，就会风消云散，而且抄笔记这个行为非常的耗时间，性价比简直低到了极点。但是因为找不到其他办法，如果不做，就会有一种焦虑感，因此这种做法我持续了很久。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"直到我开始学习编程，博客这个东西在编程圈特别火，似乎每个人都会去折腾自己的个人网站，然后在上面写点文章，分享技术心得，甚至分享生活。我也是在这里第一次接触到了写博客这件事情，并且了解到了 Markdown 这个在程序员圈标配的文档格式，这仿佛打开了新世界的大门，数学公式，绘图，富文本仅仅通过文字即可表达。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这给我带来两个改变，一个是从手写笔记转变到电子笔记，摆脱了每次都要携带本子的问题，也拜托了每次笔记记得手抽筋的问题；第二个是从记笔记到“写笔记”，我不在是边上课边记笔记，而是以发表博客的目的，在课后进行广泛搜索，验证，输出一篇播客，从被动学习变为了主动学习，我记得当时我学《数字信号处理》时，写了二十多篇文章，期末考试的时候，基本上没有不会的题目，只花了一半的时间就交卷了，现在文章还在 "},{"type":"link","url":"https://blog.csdn.net/the_last_knight/category_9280989.html","openEdit":false,"children":[{"type":"formatted","text":"CSDN"}]},{"type":"formatted","text":" 上。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"最开始我是在 CSDN 上进行写作，但是 CSDN 越来越难以满足我的需求，我把目光投向了个人播客，毕竟幸幸苦苦写出来的文章，不发出去让别人看到，乐趣都少了一半（虽然没什么人看），所以就开始了我的博客折腾之旅，包括："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"Docsify"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"Hexo"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"Vuepress"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"... ..."}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"基本上主流的、能叫的上名字的我都试过，并且折腾过，各种插件，各种样式，就为了把博客网站打造的好一点，这个阶段我面临两个问题："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"我的很多时间花在折腾博客上，换不同的博客框架，折腾插件等等，但真正重要的花在写作上的时间反而很少"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"博客适合发表文章，它是一个输出的平台，但是不适合知识管理，我如何处理我的输入，我如何在我需要的时候能快速查找到相关笔记"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"因此我需要一个软件来管理我的知识文档，在当时 Notion 可谓是如日中天，我第一次接触到时也是惊为天人，之前我在播客中折腾的插件这边大部分都支持，开箱即用，而且 Notion 的设计也很美观，不用自己去折腾样式，所以很快，我就开始把 Notion 作为我的知识管理软件。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"但是，我很快发现 Notion 无法满足我的很多需求，比如在博客中我可以自定义渲染内容，比如 Tab"}]},{"type":"tabs","activeKey":"8f2d3c2f-155c-4c4e-9297-919812a7d0a1","tabsContent":[{"key":"8f2d3c2f-155c-4c4e-9297-919812a7d0a1","title":"HTML","content":[{"type":"code-block","code":"\u003cdiv id=\"content\"\u003eHello\u003c/div\u003e","language":"HTML","uuid":"6db3b94b-57d4-41b9-b1f2-23e3fe1c3612","children":[{"type":"formatted","text":""}]}]},{"key":"ec7c66d5-7702-4ae5-9ff6-a6d6cb5b3b82","content":[{"type":"code-block","code":"#content {\n  color: red;\n}","language":"CSS","uuid":"e1ccd52e-dcdb-4378-90ea-0c9235b6f04f","children":[{"type":"formatted","text":""}]}],"title":"CSS"}],"children":[{"type":"code-block","code":"\u003cdiv id=\"content\"\u003eHello\u003c/div\u003e","language":"HTML","uuid":"6db3b94b-57d4-41b9-b1f2-23e3fe1c3612","children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这在 Notion 中根本没有可能做到，或者代价很高，且不灵活，对于一名前端工程师来说，就仿佛失去了一项非常重要的技能，另外就是 Notion 的网络问题，必须开着🪜才能访问到，否则就是龟速。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"此时 Obsidian 进入我的视线，一款本地离线的笔记应用，通过各种插件来增强应用能力，插件市场上真的什么都有，最吸引我的就是，我自己也可以写插件来自定义我想要的功能，自定义对我有一种无法抵抗的吸引力，所以很快我就把 Obsidian 作为了我的知识管理软件，我也写了一些插件来满足我的需求。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"但是使用 Obsidian 我也遇到了一些让人非常苦恼的问题："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"软件功能非常简陋，基本上无法离开第三方插件市场，因此需要花很多时间折腾插件上，并且软件的内容也需要和插件绑定，失去了插件，就无法渲染出想要的样式，甚至失去功能"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"编辑体验非常差，体验过 Typora 和 Notion 的所见即所得的编辑能力后，对于 Obsidian 的编辑体验根本无法忍受"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"特别是第二点，我是有一点强迫症，每天面对这种糟糕的编辑体验，有一天我萌生出一个念头，我能不能写一个类似于 Typora 和 Notion 一样编辑体验的软件，这个想法一直萦绕在我的脑海中，直到 2023-05-01，劳动节，我决定开始试试，因此这款软件就这么诞生了。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"起初，我只是想写一个富文本编辑器，把这个富文本编辑器作为 Obsidian 的插件，去改善编辑体验，但是我开始接触到一些知识管理的一些东西，比如《卡片笔记写作法》、《打造第二大脑》、《笔记的方法》以及接触到一些其它的笔记软件，以及这些年我面临的一些问题，我的一些思考，我决定把它打造为一个知识管理软件，经过两年半的打磨，我可以很自豪的说，它完全超出了我的预期。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b0220063-a7d0-4cae-a820-4af473bf7e7f.webp","uuid":"acd0eebf-a4c2-45a2-ab41-1c69b3471b01","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b0220063-a7d0-4cae-a820-4af473bf7e7f.webp","width":720}],"breadcrumb":[{"label":"软件使用文档","href":"/docs/document/14/609.html"},{"label":"为什么会写一个笔记软件","href":"/docs/document/14/609.html"}],"nextPage":{"title":"软件理念","href":"/docs/document/14/608.html"},"createTime":1765726548524,"updateTime":1766914175935,"currentPath":"/docs/document/14/609.html"},"meta":{"type":"doc","publishTime":1767266228456}};
