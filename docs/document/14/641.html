      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"软件使用文档","children":[{"title":"为什么会写一个笔记软件","href":"/docs/document/14/609.html"},{"title":"软件理念","href":"/docs/document/14/608.html"},{"title":"编辑器","href":"/docs/document/14/610.html","children":[{"title":"行内样式","href":"/docs/document/14/642.html"},{"title":"Slash 面板","href":"/docs/document/14/653.html"},{"title":"标题","href":"/docs/document/14/652.html"},{"title":"列表","href":"/docs/document/14/651.html"},{"title":"React 自定义组件"},{"title":"Typst"},{"title":"Tikz"},{"title":"PlantUML"}]},{"title":"功能模块","children":[{"title":"知识管理","children":[{"title":"卡片","href":"/docs/document/14/620.html"},{"title":"文章"},{"title":"项目"},{"title":"知识库"},{"title":"问题管理"},{"title":"PDF"},{"title":"微信读书","href":"/docs/document/14/628.html"},{"title":"白板","children":[{"title":"Frame"},{"title":"Column","href":"/docs/document/14/617.html"},{"title":"演示模式"},{"title":"思维导图"}]}]},{"title":"效率管理","children":[{"title":"数据库"},{"title":"任务待办"},{"title":"日历"},{"title":"日记"},{"title":"番茄专注"}]},{"title":"高级功能","children":[{"title":"AI 搜索","href":"/docs/document/14/641.html"},{"title":"同步"},{"title":"资源存储"},{"title":"发布"},{"title":"导出"},{"title":"文档演示"}]}]},{"title":"AI","children":[{"title":"聊天管理"},{"title":"向量数据库"},{"title":"MCP 和内置工具"},{"title":"SKILL 管理"},{"title":"音视频转录"},{"title":"播客生成"}]},{"title":"Markdown 文件编辑器"}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document","active":true},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":641,"title":"AI 搜索","content":[{"type":"paragraph","children":[{"type":"formatted","text":"支持两种搜索模式：全文搜索和 AI 搜索。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"可点击右上角的搜索按钮或者通过 Ctrl + K 打开搜索面板，目前的搜索范围包括「卡片、文章、项目文档以及知识库文档」，在进行搜索会同时使用两种搜索。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0235ea42-b5a2-4ded-9df4-07381eadf9db.webp","uuid":"b5030f68-a1a1-4f24-befa-f4d4a74c93ea","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0235ea42-b5a2-4ded-9df4-07381eadf9db.webp","width":621.6650794514466},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"全文搜索默认启用，并且对数据库中的内容会在打开软件时默认进行索引，而 AI 搜索需要先将文档向量化，通过向量数据库进行相似度检索，而向量化目前需要调用模型，需要在设置中进行配置，支持 OpenAI 兼容的 API（目前的主流模型基本都支持）"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9d94706f-11f4-45af-b89e-eadd59d9cf9d.webp","uuid":"7d10d898-3f14-4a28-96ba-3c28ce4c8d69","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9d94706f-11f4-45af-b89e-eadd59d9cf9d.webp","width":720},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a8850c0a-76c5-4f8d-9535-40ddc4c51cdb.webp","uuid":"7d2466a1-795b-42f8-9e72-ce97e81cf539","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a8850c0a-76c5-4f8d-9535-40ddc4c51cdb.webp","width":434.52654598955735},{"type":"paragraph","children":[{"type":"formatted","text":"在设置模型时需要设置向量长度和距离阈值："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"向量长度：由于不同的模型其生成的向量长度不同，而且同一模型也支持生成不同的向量长度，无法事先确定，因此需要根据文档设置"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"因为生成的向量与模型高度相关，"},{"type":"formatted","text":"如果要改变嵌入模型，之前的已向量化的数据就完全没有作用，软件会将之前的数据删除，并创建一个新的数据库表","bold":true,"color":"#e33a32","darkColor":"#fa7873"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"距离阈值：我们会根据搜索词和已有向量化的文档进行相似度计算，范围在 [0, 1] 之间，距离越小表示越相关，只有小于阈值的文档我们才会认为是相关的，因此如果阈值设置的越小，检索到的文档越少，检索到的文档相关性越强，但是过小的阈值可能产生遗漏，而阈值设置的越大，就可能会搜索到一些不那么相关的文档，阈值的设置不同的模型不同，需要根据实际体验以及个人偏好进行调整（我使用 OpenAI 的 text-embedding-3-large，0.6 是我实现下来觉得是一个比较均衡的值）"}]}]}]},{"type":"callout","disableDrag":false,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"表单中「支持的特性」这一部分可忽略，这部分功能暂未实现，未来不仅能搜索文档，还能进一步搜索图片、音视频等资源，这部分取决于模型能力。"}],"disableDrag":false}],"calloutType":"warning","title":"警告"},{"type":"paragraph","children":[{"type":"formatted","text":"由于向量化会调用模型，会产生费用，因此这部分不会自动进行向量化，需要在索引数据库中手动进行向量化，只有向量化后才能被 AI 搜索检索到"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_017a8945-9dc7-46e2-9091-1313b2ffd147.webp","uuid":"f88b48be-df73-44a3-a7d4-3a79dc02f76f","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_017a8945-9dc7-46e2-9091-1313b2ffd147.webp","width":720},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AI 搜索支持语义搜索，而不仅仅是关键词搜索，这意味你可以使用自然语言直接进行搜索，就像是让一个人去搜索一样，不用给出精准的关键字，并且准确度非常高，强烈建议配置！"}],"disableDrag":false}]}],"breadcrumb":[{"label":"软件使用文档","href":"/docs/document/14/609.html"},{"label":"功能模块"},{"label":"高级功能"},{"label":"AI 搜索","href":"/docs/document/14/641.html"}],"prevPage":{"title":"Column","href":"/docs/document/14/617.html"},"createTime":1767241042228,"updateTime":1767263131272,"currentPath":"/docs/document/14/641.html"},"meta":{"type":"doc","publishTime":1767266228457}};
