      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"Webpack","children":[{"title":"基本使用","children":[{"title":"介绍","href":"/docs/document/8/70.html"}]},{"title":"原理","children":[{"title":"Tapable","href":"/docs/document/8/71.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document","active":true}]}],"content":{"id":71,"title":"Tapable","content":[{"type":"paragraph","children":[{"type":"formatted","text":"Tapable","code":true},{"type":"formatted","text":" 是 Webpack 实现插件机制的模块，在 Webpack 的内部通过 "},{"type":"formatted","text":"Tapable","code":true},{"type":"formatted","text":" 预定义各个阶段的 Hook，插件可以通过为这些 Hook 注册处理事件来获取该阶段的编译信息甚至修改编译信息。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Tapable","code":true},{"type":"formatted","text":" 有点类似于 "},{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":"，不同的是，"},{"type":"formatted","text":"EventEmitter","code":true},{"type":"formatted","text":" 注册的事件的执行只有一种同步执行的流程，而 "},{"type":"formatted","text":"Tapable","code":true},{"type":"formatted","text":" 针对 "},{"type":"formatted","text":"Webpack","code":true},{"type":"formatted","text":" 的应用场景，抽象出来了九种不同的 "},{"type":"formatted","text":"Hook","code":true},{"type":"formatted","text":"，分别是："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"SyncHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"SyncBailHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"SyncWaterfallHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"SyncLoopHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AsyncParallelHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AsyncParallelBailHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AsyncSeriesHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AsyncSeriesBailHook","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"AsyncSeriesWaterfallHook","code":true}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"整体上分为两类，以 "},{"type":"formatted","text":"SyncHook","code":true},{"type":"formatted","text":" 为代表的同步 Hook 和以 "},{"type":"formatted","text":"AsyncSerierHook","code":true},{"type":"formatted","text":" 为代表的异步 Hook。在创建 Hook 对象时，我们需要传入一个字符串数组，用来表示该 Hook 触发时传递的参数。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于同步 Hook，通过 "},{"type":"formatted","text":"tap","code":true},{"type":"formatted","text":" 来注册一个事件，它接受两个参数，第一个参数可以是一个字符串或者一个对象，这个字符串表示这个事件的名称，如果是一个对象，可以配置如下三个属性："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"name","code":true},{"type":"formatted","text":"：事件名称，同设置的字符串相同"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"before","code":true},{"type":"formatted","text":"：设置这个事件在某个事件之前，可以是一个数组"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"stage","code":true},{"type":"formatted","text":"：一个数字，数字越小执行时机越靠前，默认是 "},{"type":"formatted","text":"0","code":true}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二个参数是处理函数，其接受的参数应同创建 Hook 时声明的参数相同。"}]},{"type":"code-block","code":"import { SyncHook } from \"tapable\";\n\nconst syncHook = new SyncHook([\"name\", \"age\"]);\n\n// 通过 tap 注册事件\nsyncHook.tap({\n  name: \"name1\"\n}, (name, age) => {\n  \n});\n\nsyncHook.tap('name2', (name, age) => {\n  \n});\n\n// 通过 call 方法触发所有的事件\nsyncHook.call(name, age, () => {\n  // onDone\n});","language":"js","uuid":"b9ac74a1-eb15-42ba-b337-bfcbda8f581c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于异步 Hook，一般通过 "},{"type":"formatted","text":"tapAsync","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"tapPromise","code":true},{"type":"formatted","text":" 来注册一个事件，对于 "},{"type":"formatted","text":"tapAsync","code":true},{"type":"formatted","text":"，第一个参数同 "},{"type":"formatted","text":"tap","code":true},{"type":"formatted","text":" 相同，第二个参数接受的回调函数的最后一个参数会传入一个 "},{"type":"formatted","text":"callback","code":true},{"type":"formatted","text":" 函数，该函数的调用表示该异步函数处理完成，通常用以调度后续异步任务的执行。"}]}],"breadcrumb":[{"label":"Webpack","href":"/docs/document/8/70.html"},{"label":"原理"},{"label":"Tapable","href":"/docs/document/8/71.html"}],"prevPage":{"title":"介绍","href":"/docs/document/8/70.html"},"createTime":1703404535961,"updateTime":1743303640427,"currentPath":"/docs/document/8/71.html"},"meta":{"type":"doc","publishTime":1764810804418}};
