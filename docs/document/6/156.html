    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"Rust","children":[{"title":"基础知识","children":[{"title":"变量声明","href":"/docs/document/6/74.html"},{"title":"基本数据类型","href":"/docs/document/6/112.html"}]},{"title":"进阶","children":[{"title":"Rust生命周期","href":"/docs/document/6/156.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document","active":true},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":156,"title":"Rust生命周期","content":[{"type":"paragraph","children":[{"type":"formatted","text":"当我们借用一个变量时，如果变量被销毁，那么我们就不能通过该借用的引用访问数据，因为变量以及被销毁了，此时访问的数据是不可知的。"}],"disableDrag":false},{"type":"code-block","code":"fn main() {\n  let x;\n  {\n    let y = 5;\n    x = &y;\n  }\n  println!(\"{}\", x);\n}","language":"rust","uuid":"4a4d8815-d18a-4337-80df-fb3057a1ee0c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们尝试编译该代码，编译器将会给出错误"}],"disableDrag":false},{"type":"code-block","code":"error[E0597]: `y` does not live long enough\n --> hello5.rs:5:9\n  |\n5 |     x = &y;\n  |         ^^ borrowed value does not live long enough\n6 |   }\n  |   - `y` dropped here while still borrowed\n7 |   println!(\"{}\", x);\n  |                  - borrow later used here\n\nerror: aborting due to previous error\n\nFor more information about this error, try `rustc --explain E0597`.","language":"rust","uuid":"1bd5b1d4-986e-427d-9447-d1c3600933f4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们使用 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 变量借用 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 的引用，但是在 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 变量销毁以后，"},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 变量就不能访问 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 的数据了，它是一个悬空指针。好在我们不需要担心这个问题，编译器可以找到问题并为我们解决。编译器要解决这个问题，就得知道变量的生命周期，例如上面 "},{"type":"formatted","text":"x, y","code":true},{"type":"formatted","text":" 的生命周期。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果函数返回一个引用的话，在编译时时不知道函数返回的变量的生命周期的"}],"disableDrag":false},{"type":"code-block","code":"fn get_one(x: &i32, y: &i32) -> &i32 {\n  &x\n}","language":"rust","uuid":"be9627ee-7b32-4e1b-ae6d-0dfe392e80cd","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们尝试定义上面的函数，编译器会给出一个错误"}],"disableDrag":false},{"type":"code-block","code":"error[E0106]: missing lifetime specifier\n  --> hello6.rs:13:33\n   |\n13 | fn get_one(x: &i32, y: &i32) -> &i32 {\n   |               ----     ----     ^ expected named lifetime parameter\n   |\n   = help: this function's return type contains a borrowed value, but the signature does not say whether it is borrowed from `x` or `y`\nhelp: consider introducing a named lifetime parameter\n   |\n13 | fn get_one<'a>(x: &'a i32, y: &'a i32) -> &'a i32 {\n   |           ++++     ++          ++          ++\n\nerror: aborting due to previous error\n\nFor more information about this error, try `rustc --explain E0106`.","language":"rust","uuid":"3e568cf2-c2c4-42d0-b8b5-f1e12af715ce","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这是因为编译器不知道返回的引用的生命周期，如果不知道生命周期的话，它就不能检测悬空指针的问题，所以编译就不会通过，我们需要手动指定返回的引用的生命周期。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如何指定呢？在我们定义函数时，需要为变量添加生命周期标记，生命周期标记使用 "},{"type":"formatted","text":"'","code":true},{"type":"formatted","text":" 开头，后面跟若干字符用于标记，一般我们使用单个字符，如 "},{"type":"formatted","text":"'a, 'b","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"code-block","code":"fn get_one<'a, 'b>(x: &'a i32, y: &'b i32) -> &'a i32 {\n  &x\n}","language":"rust","uuid":"192459f8-dca6-451d-83d4-1a48742ab621","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们添加的 "},{"type":"formatted","text":"'a, 'b","code":true},{"type":"formatted","text":" 就是生命周期标记，对于方法中使用的标记，都要在方法名后的 "},{"type":"formatted","text":"<>","code":true},{"type":"formatted","text":" 中声明，例如 "},{"type":"formatted","text":"add<'a, 'b>","code":true},{"type":"formatted","text":"，方法的输入分别被标记了不同的生命周期符号，"},{"type":"formatted","text":"x: &'a i32, y: &'b i32","code":true},{"type":"formatted","text":" 表示它们具有不同的生命周期，返回的引用的生命周期时 "},{"type":"formatted","text":"'a","code":true},{"type":"formatted","text":"，说明它与 "},{"type":"formatted","text":"x: &'a i32","code":true},{"type":"formatted","text":" 的生命周期相同。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"具有这些信息，编译器就可以检测悬空指针的问题了。看下面的一个例子："}],"disableDrag":false},{"type":"code-block","code":"fn main() {\n  let x = 1;\n  let z;\n  {\n    let y = 2;\n    z = get_one(&x, &y);\n  }\n\n  println!(\"{}\", z);\n}\n\nfn get_one<'a, 'b>(x: &'a i32, y: &'b i32) -> &'b i32 {\n  &y\n}","language":"rust","uuid":"b8b969d3-f31f-415f-b910-f519c0101c37","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"get_one","code":true},{"type":"formatted","text":" 函数接收两个 "},{"type":"formatted","text":"i32","code":true},{"type":"formatted","text":" 的引用，分别声明了不同的生命周期，然后返回一个 "},{"type":"formatted","text":"i32","code":true},{"type":"formatted","text":" 的引用，其生命周期为 "},{"type":"formatted","text":"'b","code":true},{"type":"formatted","text":"，与第二个参数的生命周期相同。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"然后我们在 "},{"type":"formatted","text":"main","code":true},{"type":"formatted","text":" 函数中调用 "},{"type":"formatted","text":"get_one","code":true},{"type":"formatted","text":"，分别传入 "},{"type":"formatted","text":"&x, &y","code":true},{"type":"formatted","text":"，返回的引用赋值给 "},{"type":"formatted","text":"z","code":true},{"type":"formatted","text":"，返回的引用的生命周期与第二个参数相同，也就是与 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 相同，那么我们就不能在 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 的生命周期之外访问 "},{"type":"formatted","text":"z","code":true},{"type":"formatted","text":"，否则就会导致悬空指针的问题，但是上面的程序中我们在 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 所在的块之外访问了 "},{"type":"formatted","text":"z","code":true},{"type":"formatted","text":"，所以会编译出错"}],"disableDrag":false},{"type":"code-block","code":"warning: unused variable: `x`\n  --> hello6.rs:13:20\n   |\n13 | fn get_one<'a, 'b>(x: &'a i32, y: &'b i32) -> &'b i32 {\n   |                    ^ help: if this is intentional, prefix it with an underscore: `_x`\n   |\n   = note: `#[warn(unused_variables)]` on by default\n\nerror[E0597]: `y` does not live long enough\n --> hello6.rs:6:21\n  |\n6 |     z = get_one(&x, &y);\n  |                     ^^ borrowed value does not live long enough\n7 |   }\n  |   - `y` dropped here while still borrowed\n8 |\n9 |   println!(\"{}\", z);\n  |                  - borrow later used here\n\nerror: aborting due to previous error; 1 warning emitted\n\nFor more information about this error, try `rustc --explain E0597`.","language":"rust","uuid":"79a3bab0-bb2a-4f10-8b22-ed0e886d0fc5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"给出的错误是说，"},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 已经被销毁了，但是在后面被引用的 "},{"type":"formatted","text":"z","code":true},{"type":"formatted","text":" 使用了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们修改上面的函数为"}],"disableDrag":false},{"type":"code-block","code":"fn get_one<'a, 'b>(x: &'a i32, y: &'b i32) -> &'a i32 {\n  &x\n}","language":"rust","uuid":"f7ec2176-f9ed-4c60-843f-4f37621bb9ff","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候我们返回的引用的生命周期是 "},{"type":"formatted","text":"'a","code":true},{"type":"formatted","text":"，与第一个参数的生命周期相同，这个时候我们调用函数，因为返回的引用的生命周期与 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 的生命周相同，在 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 被销毁以前都可以使用，所以程序可以正确编译。"}],"disableDrag":false},{"type":"code-block","code":"warning: unused variable: `y`\n  --> hello6.rs:13:32\n   |\n13 | fn get_one<'a, 'b>(x: &'a i32, y: &'b i32) -> &'a i32 {\n   |                                ^ help: if this is intentional, prefix it with an underscore: `_y`\n   |\n   = note: `#[warn(unused_variables)]` on by default\n\nwarning: 1 warning emitted\n\n1","language":"rust","uuid":"f71bd1b1-bd8b-4301-a3fa-4cf0027c4d92","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"程序正确打印出了 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 的值 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"（当然还给出了一些警告，因为我们在 "},{"type":"formatted","text":"get_one","code":true},{"type":"formatted","text":" 函数里面只用了 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":"，没有用 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":"）。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"上面为 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 标注了不同的生命周期，如果为二者使用"},{"type":"content-link","children":[{"type":"formatted","text":"相同的生命周期"}],"refId":410,"contentType":"card","contentTitle":"","contentId":346},{"type":"formatted","text":"标注 "},{"type":"formatted","text":"'a","code":true},{"type":"formatted","text":" 呢，那么 "},{"type":"formatted","text":"'a","code":true},{"type":"formatted","text":" 表示的生命周期是多大，应当是二者的交集，也就是生命周期最短的那个"}],"disableDrag":false},{"type":"code-block","code":"fn get_one<'a>(x: &'a i32, y: &'a i32) -> &'a i32 {\n  &x + &y\n}","language":"Rust","uuid":"bb236152-3a94-44fd-a6a2-441c2f9c9852","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"Rust","href":"/docs/document/6/74.html"},{"label":"进阶"},{"label":"Rust生命周期","href":"/docs/document/6/156.html"}],"prevPage":{"title":"基本数据类型","href":"/docs/document/6/112.html"},"createTime":1729003352238,"updateTime":1744419661008,"currentPath":"/docs/document/6/156.html"},"meta":{"type":"doc","publishTime":1764774821798}};
