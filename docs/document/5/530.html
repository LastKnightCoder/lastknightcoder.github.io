       \n\n<polar-color-space> = \n  hsl    |\n  hwb    |\n  lch    |\n  oklch  \n\n<hue-interpolation-method> = \n  [ shorter | longer | increasing | decreasing ] hue  \n\n<angular-color-stop> = \n  <color> <color-stop-angle>?  \n\n<angular-color-hint> = \n  <angle-percentage>  |\n  <zero>              \n\n<xyz-space> = \n  xyz      |\n  xyz-d50  |\n  xyz-d65  \n\n<color-stop-angle> = \n  [ <angle-percentage> | <zero> ]{1,2}  \n\n<angle-percentage> = \n  <angle>       |\n  <percentage>  ","language":"CSS","uuid":"79a1272d-5918-40fb-b681-157a41164b2e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"语法分为四部分："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"[ from [ <angle> | <zero> ] ]","code":true},{"type":"formatted","text":"：定义顺时针的渐变旋转角度，可以是一个角度值（"},{"type":"formatted","text":"deg","code":true},{"text":"，","type":"formatted"},{"type":"formatted","code":true,"text":"rad， turn"},{"type":"formatted","text":"），也可以表示使用一个不带单位的零值"}]},{"type":"custom-block","content":"const n = 15\nconst colorStops = Array.from({ length: n }, (_, i) => `hsl(${i * 360 / n}, 80%, 50%)`).join(' ,')\nconst Item = ({ angle }) => {\n  return (\n  \t<div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>\n      <div style={{ width: 200, height: 200, borderRadius: '50%', backgroundImage: `conic-gradient(from ${angle}, ${colorStops})` }}></div>\n      <div style={{ fontSize: 14, color: 'gray' }}>{angle}</div>\n    </div>\n  )\n}\n\nconst Component = () => {\n  return (\n  \t<div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: 20 }}>\n    \t<Item angle={0} />\n      <Item angle={'45deg'} />\n      <Item angle={'90deg'} />\n      <Item angle={'0.25turn'} />\n      <Item angle={'0.5turn'} />\n      <Item angle={'1turn'} />\n      <Item angle={`${Math.PI.toFixed(5)}
