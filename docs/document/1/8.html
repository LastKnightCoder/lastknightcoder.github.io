1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":8,"title":"二分搜索树","content":[{"type":"paragraph","children":[{"type":"formatted","text":"什么是树结构"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231211482022-04-23-12-11-48.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当你把上面的图倒过来看，就像是一棵树，所以我们把这种结构称为是树结构。那为什么要使用树结构，因为树结构在生活中很常见，如文件夹的组织方式，又或者如公司职能的组织方式，这些都是树结构的例子。为什么会使用树结构呢？原因就是因为高效。"}]},{"type":"header","children":[{"type":"formatted","text":"概念"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"同链表一样，它也是一种动态的数据结构，链表中的节点是指向一个节点，而二叉树是指向两个节点，我们把这两个节点称为左子树和右子树，又或者称为左孩子和右孩子。如下图表示的就是二叉树"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231211482022-04-23-12-11-48.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"class Node {\n    E e;\n    Node left;\n    Node right;\n}","language":"java","uuid":"360b9949-a84e-4baf-a5bc-4538e5522dab","children":[{"type":"formatted","text":""}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"根节点"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"最顶部的那个节点，如上图中 28 就是根节点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"二叉树具有唯一的一个根节点"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"叶子节点"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"没有孩子的节点，如上图的最后一行都是叶子节点"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"二叉树的每个节点最多有两个孩子，最多有一个父亲"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"那是什么是二分搜索树，首先二分搜索树是二叉树，它满足这样的特点，对于每个节点"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"大于左子树所有节点的值"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"小于右子树所有节点的值"}]}]}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231211482022-04-23-12-11-48.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以验算，上面的这棵树满足二分搜索树的性质，所以这棵树是二分搜索树。下面我们来实现二分搜索树中节点有关代码"}]},{"type":"code-block","code":"public class BST<E extends Comparable<E>> {\n    private class Node {\n        public E e;\n        public Node left;\n        public Node right;\n\n        public Node(E e) {\n            this.e = e;\n            left = null;\n            right = null;\n        }\n\n        @Override\n        public String toString() {\n            return e.toString();\n        }\n    }\n\n    //根节点\n    private Node root;\n    //树中元素的个数\n    private int size;\n\n    public BST() {\n        root = null;\n        size = 0;\n    }\n    \n    public int size() {\n        return size;\n    }\n    public boolean isEmpty() {\n        return size == 0;\n    }\n}","language":"java","uuid":"f5ee8769-77e5-433b-8992-17e0c53fb2b7","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"添加元素"}],"level":3},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231215252022-04-23-12-15-26.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上图想必已经将添加元素的规则说的很详细了，所以这里直接上代码"}]},{"type":"code-block","code":"public void add(E e) {\n    if (root == null) {\n        root = new Node(e);\n        size++;\n    } else {\n        add(root, e);\n    }\n}\nprivate void add(Node node, E e) {\n    //递归终止条件\n    if (e.equals(node.e)) {\n        return;\n    } else if (e.compareTo(node.e) < 0 && node.left == null) {\n        node.left = new Node(e);\n        size++;\n        return;\n    } else if (e.compareTo(node.e) > 0 && node.right == null) {\n        node.right = new Node(e);\n        size++;\n        return;\n    }\n    if (e.compareTo(node.e) < 0) {\n        add(node.left, e);\n    }\n    if (e.compareTo(node.e) > 0) {\n        add(node.right, e);\n    }\n}","language":"java","uuid":"75377ae8-5566-4136-98f5-47c0533e4f58","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其实上面的代码还可以改进，因为我们在 "},{"type":"formatted","text":"add(E e)","code":true},{"type":"formatted","text":" 中对 "},{"type":"formatted","text":"root","code":true},{"type":"formatted","text":" 为根节点进行了单独的考虑，其实可以不再这里考虑，因为通过上面的规则知道，当一个节点为 "},{"type":"formatted","text":"null","code":true},{"type":"formatted","text":" 时，不管它是根节点还是左右孩子，新加入的节点都将取代这个 "},{"type":"formatted","text":"null","code":true},{"type":"formatted","text":" 节点"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231216402022-04-23-12-16-40.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们优化上面的代码如下"}]},{"type":"code-block","code":"public void add(E e) {\n    root = add(root, e);\n}\nprivate Node add(Node node, E e) {\n    //这里返回的Node所指的语义是node所代表的根节点\n    if (node == null) {\n        size++;\n        return new Node(e);\n    }\n    if (e.compareTo(node.e) < 0) {\n        //如果比根节点小，对左子树进行更新\n        node.left = add(node.left, e);\n    } else if (e.compareTo(node.e) > 0) {\n        //如果比根节点大，对右子树进行更新\n        node.right = add(node.right,e);\n    }\n    //等于的话什么都不做\n    return node;\n}","language":"java","uuid":"bbede3d5-d5c2-40ed-83a4-b627a49b5a99","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"查询操作"}],"level":3},{"type":"code-block","code":"public boolean contains(E e) {\n    return contains(root, e);\n}\nprivate boolean contains(Node node, E e) {\n    if (node == null) {\n        return false;\n    }\n    \n    if (e.equals(node.e)) {\n        return true;\n    } else if (e.compareTo(node.e) < 0) {\n        return contains(node.left, e);\n    } else {\n        return contains(node.right,e);\n    }\n}","language":"java","uuid":"7bfe10e3-67ae-42ca-8b57-b07a39f658f8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"二叉树的遍历"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"对于某个数据结构的遍历就是将该数据结构中所有的元素都访问一遍，分为三类"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"前序遍历"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"父节点在访问左子树之前访问"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"中序遍历"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"父节点在访问左子树之后，在访问右子树之前访问"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"后序遍历"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"父节点在访问右子树之后访问"}]}]}]}]}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231218022022-04-23-12-18-02.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"前序遍历"}],"level":4},{"type":"code-block","code":"public void preOrder() {\n    preOrder(root);\n}\nprivate void preOrder(Node node) {\n    if (node == null) {\n        return;\n    }\n    //先访问父节点\n    System.out.println(node);\n    preOrder(node.left);\n    preOrder(node.right);\n}","language":"java","uuid":"d43fd62d-cb08-430a-8186-b281329139c8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"中序遍历"}],"level":4},{"type":"code-block","code":"public void inOrder() {\n    inOrder(root);\n}\nprivate void inOrder(Node node) {\n    if (node == null) {\n        return;\n    }\n    \n    inOrder(node.left);\n    System.out.println(node);\n    inOrder(node.right);\n}","language":"java","uuid":"e4fdae84-5695-4488-b5cb-1131611928f9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"中序遍历的结果是元素从小到大排序。"}]},{"type":"header","children":[{"type":"formatted","text":"后序遍历"}],"level":4},{"type":"code-block","code":"public void postOrder() {\n    postOrder(root);\n}\nprivate void postOrder(Node node) {\n    if (node == null) {\n        return;\n    }\n    \n    postOrder(node.left);\n    postOrder(node.right);\n    System.out.println(node);\n}","language":"java","uuid":"41472b49-2993-4004-a818-173522115d6a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"后序遍历的一个应用是内存释放，我们必须先把左右孩子的内存释放完才能释放该节点的内存。"}]},{"type":"header","children":[{"type":"formatted","text":"前序遍历的非递归实现"}],"level":4},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231218412022-04-23-12-18-41.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码实现"}]},{"type":"code-block","code":"public void preOrderNR() {\n    //非递归写法\n    if (root == null) {\n        return;\n    }\n    //这里的Stack是上面自己写的Stack\n    Stack<Node> stack = new ArrayStack<>();\n    stack.push(root);\n    \n    while (!stack.isEmpty()) {\n        Node top = stack.pop();\n        System.out.println(top);\n        if (top.right != null) {\n            stack.push(top.right);\n        }\n        if (top.left != null) {\n            stack.push(top.left);\n        }\n    }\n}","language":"java","uuid":"6c5061b3-d653-47ae-8c92-a4f54568adfe","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"层序遍历"}],"level":4},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231221082022-04-23-12-21-08.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码实现"}]},{"type":"code-block","code":"public void levelOrder() {\n    if (root == null) {\n        return;\n    }\n    Queue<Node> queue = new LoopQueue<>();\n    queue.enqueue(root);\n    while (!queue.isEmpty()) {\n        Node front = queue.dequeue();\n        System.out.println(front);\n        if (front.left != null) {\n            queue.enqueue(front.left);\n        }\n        if (front.right != null) {\n            queue.enqueue(front.right);\n        }\n    }\n}","language":"java","uuid":"4b35bb2e-580d-4e89-91ff-2a70ce658854","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"删除元素"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"在二分搜索树中删除一个节点是比较复杂的，我们首先从最简单的情况开始，删除二分搜索树中的最小值和最大值，首先是如何找到最大值和最小值"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231221472022-04-23-12-21-47.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public E minimum() {\n    if (size == 0) {\n        throw new IllegalArgumentException(\"树为空\");\n    }\n    return minimum(root).e;\n}\nprivate Node minimum(Node node) {\n    if (node.left == null) {\n        return node;\n    }\n    return minimum(node.left);\n}\npublic E maximum() {\n    if (size == 0) {\n        throw new IllegalArgumentException(\"树为空\");\n    }\n    return maximum(root).e;\n}\nprivate Node maximum(Node node) {\n    if (node.right == null) {\n        return node;\n    }\n    return maximum(node.right);\n}","language":"java","uuid":"f030e4bf-1afc-4c5e-ba01-0b7f8882f805","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"找到了之后如何删除呢"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231222152022-04-23-12-22-16.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public E removeMin() {\n    E ret = minimum();\n    root = removeMin(root);\n    return ret;\n}\nprivate Node removeMin(Node node) {\n    if (node.left == null) {\n        Node rightNode = node.right;\n        node.right = null;\n        size--;\n        return rightNode;\n    }\n    node.left = removeMin(node.left);\n    return node;\n}","language":"java","uuid":"043e096e-be0e-45f7-9871-84f116d2543c","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public E removeMax() {\n    E ret = maximum();\n    root = removeMax(root);\n    return ret;\n}\nprivate Node removeMax(Node node) {\n    if (node.right == null) {\n        Node leftNode = node.left;\n        node.left = null;\n        size--;\n        return leftNode;\n    }\n    \n    node.right = removeMax(node.right);\n    return node;\n}","language":"java","uuid":"1909f9d1-ac00-4ca3-a919-3b369149644d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在讲解如何删除二分搜搜数中的任意一个节点"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231222452022-04-23-12-22-45.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public void remove(E e) {\n    root = remove(root, e);\n}\nprivate Node remove(Node node, E e) {\n    if (node == null) {\n        return null;\n    }\n    if (e.equals(node.e)) {\n        if (node.right == null) {\n            Node leftNode = node.left;\n            node.left = null;\n            size--;\n            return leftNode;\n        } else if (node.left == null) {\n            Node rightNode = node.right;\n            node.right = null;\n            size--;\n            return rightNode;\n        } else {\n            Node successor = minimum(node.right);\n            successor.right = removeMin(node.right);//为什么这条语句必须在前面???\n            successor.left = node.left;\n            node.left = node.right = null;\n            //size--; 在removeMin中已经维护size了\n            return successor;\n        }\n    } else if (e.compareTo(node.e) < 0) {\n        node.left = remove(node.left, e);\n    } else {\n        node.right = remove(node.right, e);\n    }\n    return node;\n}","language":"java","uuid":"7d93ef63-cae2-4404-989b-fe4cd0e553a1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面说的是取右子树中的最小值，你也可以考虑取左子树中的最大值，道理都是一样的。"}]},{"type":"header","children":[{"type":"formatted","text":"完整代码"}],"level":3},{"type":"code-block","code":"public class BST<E extends Comparable<E>> {\n    private class Node {\n        public E e;\n        public Node left;\n        public Node right;\n\n        public Node(E e) {\n            this.e = e;\n            left = null;\n            right = null;\n        }\n\n        @Override\n        public String toString() {\n            return e.toString();\n        }\n    }\n\n    //根节点\n    private Node root;\n    //树中元素的个数\n    private int size;\n\n    public BST() {\n        root = null;\n        size = 0;\n    }\n\n    public int size() {\n        return size;\n    }\n    public boolean isEmpty() {\n        return size == 0;\n    }\n\n    public void add(E e) {\n        root = add(root, e);\n    }\n\n\n    private Node add(Node node, E e) {\n        //这里返回语义指的的是node所代表的根节点\n        if (node == null) {\n            size++;\n            return new Node(e);\n        }\n\n        if (e.compareTo(node.e) < 0) {\n            //如果比根节点小，对左子树进行更新\n            node.left = add(node.left, e);\n        } else if (e.compareTo(node.e) > 0) {\n            //如果比根节点大，对右子树进行更新\n            node.right = add(node.right,e);\n        }\n        //等于的话什么都不做\n        return node;\n    }\n\n    public boolean contains(E e) {\n        return contains(root, e);\n    }\n\n    private boolean contains(Node node, E e) {\n        if (node == null) {\n            return false;\n        }\n\n        if (e.equals(node.e)) {\n            return true;\n        } else if (e.compareTo(node.e) < 0) {\n            return contains(node.left, e);\n        } else {\n            return contains(node.right,e);\n        }\n    }\n\n    //前序遍历\n    public void preOrder() {\n        preOrder(root);\n    }\n    private void preOrder(Node node) {\n        if (node == null) {\n            return;\n        }\n\n        System.out.println(node);\n        preOrder(node.left);\n        preOrder(node.right);\n    }\n\n    public void preOrderNR() {\n        //非递归写法\n        if (root == null) {\n            return;\n        }\n        Stack<Node> stack = new ArrayStack<>();\n        stack.push(root);\n\n        while (!stack.isEmpty()) {\n            Node top = stack.pop();\n            System.out.println(top);\n            if (top.right != null) {\n                stack.push(top.right);\n            }\n            if (top.left != null) {\n                stack.push(top.left);\n            }\n        }\n    }\n\n    //中序遍历\n    public void inOrder() {\n        inOrder(root);\n    }\n    private void inOrder(Node node) {\n        if (node == null) {\n            return;\n        }\n\n        inOrder(node.left);\n        System.out.println(node);\n        inOrder(node.right);\n    }\n\n    //后序遍历\n    public void postOrder() {\n        postOrder(root);\n    }\n    private void postOrder(Node node) {\n        if (node == null) {\n            return;\n        }\n\n        postOrder(node.left);\n        postOrder(node.right);\n        System.out.println(node);\n    }\n\n    public void levelOrder() {\n        if (root == null) {\n            return;\n        }\n        Queue<Node> queue = new LoopQueue<>();\n        queue.enqueue(root);\n\n        while (!queue.isEmpty()) {\n            Node front = queue.dequeue();\n            System.out.println(front);\n            if (front.left != null) {\n                queue.enqueue(front.left);\n            }\n            if (front.right != null) {\n                queue.enqueue(front.right);\n            }\n        }\n    }\n\n    public E minimum() {\n        if (size == 0) {\n            throw new IllegalArgumentException(\"树为空\");\n        }\n        return minimum(root).e;\n    }\n\n    private Node minimum(Node node) {\n        if (node.left == null) {\n            return node;\n        }\n        return minimum(node.left);\n    }\n\n    public E maximum() {\n        if (size == 0) {\n            throw new IllegalArgumentException(\"树为空\");\n        }\n        return maximum(root).e;\n    }\n\n    private Node maximum(Node node) {\n        if (node.right == null) {\n            return node;\n        }\n        return maximum(node.right);\n    }\n\n    public E removeMin() {\n        E ret = minimum();\n        root = removeMin(root);\n        return ret;\n    }\n\n    private Node removeMin(Node node) {\n        if (node.left == null) {\n            Node rightNode = node.right;\n            node.right = null;\n            size--;\n            return rightNode;\n        }\n\n        node.left = removeMin(node.left);\n        return node;\n    }\n\n    public E removeMax() {\n        E ret = maximum();\n        root = removeMax(root);\n        return ret;\n    }\n    private Node removeMax(Node node) {\n        if (node.right == null) {\n            Node leftNode = node.left;\n            node.left = null;\n            size--;\n            return leftNode;\n        }\n\n        node.right = removeMax(node.right);\n        return node;\n    }\n\n    public void remove(E e) {\n        root = remove(root, e);\n    }\n    private Node remove(Node node, E e) {\n        if (node == null) {\n            return null;\n        }\n        if (e.equals(node.e)) {\n            if (node.right == null) {\n                Node leftNode = node.left;\n                node.left = null;\n                size--;\n                return leftNode;\n            } else if (node.left == null) {\n                Node rightNode = node.right;\n                node.right = null;\n                size--;\n                return rightNode;\n            } else {\n                Node successor = minimum(node.right);\n                successor.right = removeMin(node.right);//为什么这条语句必须在前面???\n                successor.left = node.left;\n                node.left = node.right = null;\n                //size--; 在removeMin中已经维护size了\n                return successor;\n            }\n        } else if (e.compareTo(node.e) < 0) {\n            node.left = remove(node.left, e);\n        } else {\n            node.right = remove(node.right, e);\n        }\n        return node;\n    }\n}","language":"java","uuid":"dd16682c-1866-4dda-88f8-9c7f1f5e889f","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"二分搜索树","href":"/docs/document/1/8.html"}],"nextPage":{"title":"优先队列和堆","href":"/docs/document/1/17.html"},"createTime":1701519637887,"updateTime":1743303640546,"currentPath":"/docs/document/1/8.html"},"meta":{"type":"doc","publishTime":1764772322627}};
