document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":36,"title":"倒水智力题","content":[{"type":"paragraph","children":[{"type":"formatted","text":"有两个桶，一个能装 5 升水，一个能装 3 升水，如何得到 4 升水?"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这道题还是将状态看做是一个图的节点，如果状态之间能够互相转变，就说状态之前有一条边。我们定义状态 "},{"type":"formatted","text":"<x,y>","code":true},{"type":"formatted","text":" 表示第一个桶有 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 升水，第二个桶有 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 升水。那么 "},{"type":"formatted","text":"<x, y>","code":true},{"type":"formatted","text":" 与哪些状态是相连的呢，分为六种情况："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"倒空第一桶水："},{"type":"formatted","text":"<x, y> => <0, y>","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"倒空第二桶水："},{"type":"formatted","text":"<x, y> => <x, 0>","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"加满第一桶水："},{"type":"formatted","text":"<x, y> => <5, y>","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"加满第二桶水："},{"type":"formatted","text":"<x, y> => <x, 3>","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"第二桶水倒入第一桶水："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"x + y \\geq 5","children":[{"type":"formatted","text":"x + y \\geq 5"}]},{"type":"formatted","text":"："},{"type":"formatted","text":"<x, y> => <5, x + y - 5>","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"x + y < 5","children":[{"type":"formatted","text":"x + y < 5"}]},{"type":"formatted","text":"："},{"type":"formatted","text":"<x, y> => <x + y, 0>","code":true}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"第一桶水倒入第二桶水："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"x + y \\geq 3","children":[{"type":"formatted","text":"x + y \\geq 3"}]},{"type":"formatted","text":"："},{"type":"formatted","text":"<x, y> => <x + y - 3, 3>","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"x + y < 3","children":[{"type":"formatted","text":"x + y < 3"}]},{"type":"formatted","text":"："},{"type":"formatted","text":"<x, y> => <0, x + y>","code":true}]}]}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们使用一个两位数表示一个状态，十位数表示第一个桶中有多少升水，个位数表示第二个桶中有多少升水，例如 "},{"type":"formatted","text":"23","code":true},{"type":"formatted","text":" 表示第一个桶中有 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 升水，第二个桶中有 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":" 升水。"}]},{"type":"code-block","code":"import java.util.*;\n\npublic class WaterPuzzle {\n    public Iterable<Integer> waterPuzzle() {\n        HashSet<Integer> visited = new HashSet<>();\n        HashMap<Integer, Integer>  pre = new HashMap<>();\n        Queue<Integer> queue = new LinkedList<>();\n\n        queue.add(0);\n        visited.add(0);\n        pre.put(0, 0);\n        \n        // 保存最后找到的结果\n        int endState = 0;\n        // 用以跳出 while 循环\n        boolean flag = false;\n        \n        while (!queue.isEmpty()) {\n            int state = queue.remove();\n            for (int nextState: adj(state)) {\n                if (!visited.contains(nextState)) {\n                    visited.add(nextState);\n                    queue.add(nextState);\n                    pre.put(nextState, state);\n                    if (nextState / 10 == 4 || nextState % 10 == 4) {\n                        endState = nextState;\n                        flag = true;\n                        break;\n                    }\n                }\n            }\n            if (flag) {\n                break;\n            }\n        }\n\n\n        ArrayList<Integer> result = new ArrayList();\n\n        int cur = endState;\n        result.add(cur);\n        while (pre.get(cur) != 0) {\n            cur = pre.get(cur);\n            result.add(cur);\n        }\n\n        Collections.reverse(result);\n        return result;\n    }\n\n    private Iterable<Integer> adj(int state) {\n        int first = state / 10;\n        int second = state % 10;\n\n        Set<Integer> set = new HashSet<>();\n        set.add(second);\n        set.add(first*10);\n        set.add(5*10 + second);\n        set.add(first * 10 + 3);\n\n        if (first + second >= 5) {\n            set.add(5 * 10 + (first + second) - 5);\n        } else {\n            set.add((first + second) * 10);\n        }\n\n        if (first + second >= 3) {\n            set.add((first + second - 3) * 10 + 3);\n        } else {\n            set.add(first + second);\n        }\n\n        return new ArrayList<>(set);\n    }\n\n    public static void main(String[] args) {\n        WaterPuzzle waterPuzzle = new WaterPuzzle();\n        for (int r: waterPuzzle.waterPuzzle()) {\n            // 在个位数前加上0\n            System.out.print((r >= 10 ? r : \"0\" + r) + \" \");\n        }\n    }\n}","language":"java","uuid":"9fc31c1f-19ab-478a-880f-af7e5c5bec61","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"广度优先遍历","href":"/docs/document/1/32.html"},{"label":"倒水智力题","href":"/docs/document/1/36.html"}],"prevPage":{"title":"打开转盘锁","href":"/docs/document/1/35.html"},"nextPage":{"title":"滑动谜题","href":"/docs/document/1/37.html"},"createTime":1702051428077,"updateTime":1743303640550,"currentPath":"/docs/document/1/36.html"},"meta":{"type":"doc","publishTime":1764822964068}};
