document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":53,"title":"Ford-Fulkerson 思想","content":[{"type":"paragraph","children":[{"type":"formatted","text":"现在我们开始看一看如何找到图中的最大流，还是以下图为例"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_277784f5-de72-4055-8ed9-5bdc2dfb3f58.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们先从源点随便选择一条路径到达汇点"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_36b0a95f-eb4b-416b-8609-479dc2eac09c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如上图我们就选择 "},{"type":"inline-math","tex":"0 → 1 → 3","children":[{"type":"formatted","text":"0 → 1 → 3"}]},{"type":"formatted","text":" 这条路径，这条路径能够允许的最大容量为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":"，所以这条路径的流量为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":"，为了表示已经通过了多少流量，我们以下面形式表示图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9a9bf781-8b4d-4500-ac9c-0e64115c558d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"左边的数字表示已经通过了多少流量，右边的数字表示允许通过最大容量。接下来我们在选择一条路径"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_59380f7a-d7d6-42eb-8834-5cfcf0d74d6c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们选择了 "},{"type":"inline-math","tex":"0 → 1 → 2 → 3","children":[{"type":"formatted","text":"0 → 1 → 2 → 3"}]},{"type":"formatted","text":" 这条路径，因为 "},{"type":"inline-math","tex":"0 → 1","children":[{"type":"formatted","text":"0 → 1"}]},{"type":"formatted","text":" 只允许 "},{"type":"inline-math","tex":"1","children":[{"type":"formatted","text":"1"}]},{"type":"formatted","text":" 个流量通过了，所以这条路径的流量为 "},{"type":"inline-math","tex":"1","children":[{"type":"formatted","text":"1"}]},{"type":"formatted","text":"，我们更新一下图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_72b9a66c-8639-447d-ae87-a7d059320b8a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后在选择一条路径"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a8135c51-4276-424d-a7cf-612daa2a6841.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这次我们选择了 "},{"type":"inline-math","tex":"0 → 2 → 3","children":[{"type":"formatted","text":"0 → 2 → 3"}]},{"type":"formatted","text":"，这条路径的流量为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":"，更新图如下"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_24a947f7-f74d-4b47-a2ef-29561e9b64bd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"接下来我们我们找不到一条路径从源点到汇点了，所以此时我们可以说该网络流的最大流为 "},{"type":"inline-math","tex":"2 + 1 + 2 = 5","children":[{"type":"formatted","text":"2 + 1 + 2 = 5"}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以上面的算法就是重复下面两步："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"随便找一条路径从源点到汇点，找到路径的最小值，就是这条路径的流量"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"更新每条边允许通过的流量"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是真的随便找一条路径就可以吗? 显然不行，例如我们一开始就找到了这么一个路径"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c3fb83b8-c97d-4ab5-ba40-a96cc0f27f51.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这条路径的流量为 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":"，我们更新图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6fae486b-724c-4a58-99ed-806ac4ff7522.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是接下来我们发现找不到路径从源点到汇点了，所以我们得出这个网络流的最大路径为 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":"，明显这个答案是不对的，所以我们不能随便选择路径走，因为可能得不到正确的答案。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是，如果我们允许反向流动呢? 例如还是以上图为例"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0286b6a1-d1ad-4da8-b846-1ae97bc47f59.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这次我们选择路径如下"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c89697fc-794f-42a8-a3db-d5f75307c942.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"更新后的图为"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c98f575c-49ed-48b7-9edd-a49a42e47728.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"本来从 "},{"type":"inline-math","tex":"2 → 1","children":[{"type":"formatted","text":"2 → 1"}]},{"type":"formatted","text":" 是不可达的，但是我们赋予它一个语义，表示将原来通过 "},{"type":"inline-math","tex":"1 → 2","children":[{"type":"formatted","text":"1 → 2"}]},{"type":"formatted","text":" 的流量引导到别的路径去了，例如本来 "},{"type":"inline-math","tex":"1 → 2","children":[{"type":"formatted","text":"1 → 2"}]},{"type":"formatted","text":" 有流量为 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":"，现在我们反向流动 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 个流量，表示将原来这 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":" 个流量中的 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 个流量引导到别的路径中去了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"赋予这么一个语义的话，那么上面图的所有箭头都可以变为双向的，反向的箭头表示允许被引导到别的路径上，我们给它一个权值，表示能够被允许引导到别的路径上去的流量的最大值，这个值应该是已经通过该路径的流量，例如如果 "},{"type":"inline-math","tex":"1 → 2","children":[{"type":"formatted","text":"1 → 2"}]},{"type":"formatted","text":" 是用 "},{"type":"inline-math","tex":"3/5","children":[{"type":"formatted","text":"3/5"}]},{"type":"formatted","text":" 表示的话，表示已经有 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":" 个流量通过 "},{"type":"inline-math","tex":"1 → 2","children":[{"type":"formatted","text":"1 → 2"}]},{"type":"formatted","text":"，那么 "},{"type":"inline-math","tex":"2 → 1","children":[{"type":"formatted","text":"2 → 1"}]},{"type":"formatted","text":" 最多允许 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":" 个流量被引导。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了表示方便，不用 "},{"type":"inline-math","tex":"3/5","children":[{"type":"formatted","text":"3/5"}]},{"type":"formatted","text":" 这样的形式来标记边了，而是以剩余允许通过的流量表示边，例如 "},{"type":"inline-math","tex":"3/5","children":[{"type":"formatted","text":"3/5"}]},{"type":"formatted","text":" 表示最大容量为 "},{"type":"inline-math","tex":"5","children":[{"type":"formatted","text":"5"}]},{"type":"formatted","text":"，已经通过流量为 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":"，所以剩余能够通过的流量为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":"，我们以 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 来标记这条边，同理我们也以这样的方式标记反向的边，得到下面的这么一个图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9b5f330e-9bf9-42ba-b863-198c72124507.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"黑色表示正向边，红色表示反向边，上面的数值表示能够允许通过的最大流量，可见在最开始反向边是不能允许通过流量的，它们的权值都是 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":"，这个图我们称之为残差图。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"接下下我们就可以使用上面提到的两步了："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"随便找一条路径从源点到汇点，找到路径的最小值，就是这条路径的流量"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"更新每条边允许通过的流量"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个方法就是 Ford-Fulkerson 思想。"}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"网络流与最大流","href":"/docs/document/1/52.html"},{"label":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"}],"prevPage":{"title":"网络流与最大流","href":"/docs/document/1/52.html"},"nextPage":{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},"createTime":1702133166954,"updateTime":1743303640562,"currentPath":"/docs/document/1/53.html"},"meta":{"type":"doc","publishTime":1764820858549}};
