document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":54,"title":"Edmonds-Karp 算法","content":[{"type":"paragraph","children":[{"type":"formatted","text":"上面的 Ford-Fulkerson 只是提供了一种思想，得到一个网络流的残差图，然后随便找一条路径从源点到汇点，但是没有说怎么找这条路径，所以它只是一种思想。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"接下来我们就介绍 Edmonds-Karp 算法，它就是为 Ford-Fulkerson 提供了一种具体的实现，怎么找一条路径，很简单，那就是从源点进行 BFS 来找到一条路径，当我们通过 BFS 无法达到汇点时，说明网络不能够承受更大的流量了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以上面的方法是不是非常的简单，下面就给出具体的实现"}]},{"type":"code-block","code":"import java.util.*;\n\npublic class MaxFlow {\n    private DirectedWeightedGraph graph;\n    private int s;\n    private int t;\n    private DirectedWeightedGraph rcGraph;\n    private int maxFlow = 0;\n\n    public MaxFlow(DirectedWeightedGraph graph, int s, int t) {\n        this.graph = graph;\n\n        // 一些校验工作\n        if (graph.V() < 2) {\n            throw new IllegalArgumentException(\"网络流中节点个数必须大于1\");\n        }\n        graph.validateVertex(s);\n        graph.validateVertex(t);\n        this.s = s;\n        this.t = t;\n\n        // 根据传入的网络流，构造残差图\n        DirectedWeightedGraph rcGraph = new DirectedWeightedGraph(graph.V());\n        for (int v = 0; v < graph.V(); v++) {\n            for (int w: graph.adj(v)) {\n                rcGraph.addEdge(v, w, graph.getWeight(v, w));\n                // 一开始反向边能够允许通过的最大流量为 0\n                rcGraph.addEdge(w, v, 0);\n            }\n        }\n        this.rcGraph = rcGraph;\n\n        while (true) {\n            // 开始从源点做 BFS\n            ArrayList<Integer> path =  getAugmentPath();\n            // 如果从 BFS 得到的路径为空，说明不能到达汇点了，此时退出循环\n            if (path.size() == 0) {\n                break;\n            }\n\n            // 获得路径的最小值，即这条路径允许通过的最大流量\n            int min = Integer.MAX_VALUE;\n            for (int i = 1; i < path.size(); i++) {\n                int v = path.get(i - 1);\n                int w = path.get(i);\n\n                min = Math.min(min, rcGraph.getWeight(v, w));\n            }\n\n            maxFlow += min;\n\n            // 更新残差图\n            for (int i = 1; i < path.size(); i++) {\n                int v = path.get(i - 1);\n                int w = path.get(i);\n\n                rcGraph.setWeight(v, w, rcGraph.getWeight(v, w) - min);\n                rcGraph.setWeight(w, v, rcGraph.getWeight(w, v) + min);\n            }\n        }\n    }\n\n    // 做 BFS\n    private ArrayList<Integer> getAugmentPath() {\n        Queue<Integer> queue = new LinkedList<>();\n        int[] pre = new int[graph.V()];\n        queue.add(s);\n        Arrays.fill(pre, -1);\n        pre[s] = s;\n\n        while (!queue.isEmpty()) {\n            int v = queue.remove();\n            for (int w: rcGraph.adj(v)) {\n                if (pre[w] == -1 && rcGraph.getWeight(v, w) > 0) {\n                    pre[w] = v;\n                    queue.add(w);\n                }\n            }\n        }\n\n        ArrayList<Integer> result = new ArrayList<>();\n        if (pre[t] == -1) {\n            return result;\n        }\n\n        int cur = t;\n        while (cur != s) {\n            result.add(cur);\n            cur = pre[cur];\n        }\n        result.add(s);\n        Collections.reverse(result);\n        return result;\n    }\n\n    // 返回网络的最大流\n    public int result() {\n        return maxFlow;\n    }\n\n    // 返回最终 v-w 允许通过的流量\n    public int flow(int v, int w) {\n        if (!graph.hasEdge(v, w)) {\n            throw new IllegalArgumentException(\"存在这条边\");\n        }\n        graph.validateVertex(v);\n        graph.validateVertex(w);\n\n        return rcGraph.getWeight(w, v);\n    }\n}","language":"java","uuid":"80d4d3cb-e1d1-4dc7-a3d4-10b6fb3892e4","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"网络流与最大流","href":"/docs/document/1/52.html"},{"label":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"}],"prevPage":{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},"nextPage":{"title":"棒球比赛","href":"/docs/document/1/55.html"},"createTime":1702133711151,"updateTime":1743303640562,"currentPath":"/docs/document/1/54.html"},"meta":{"type":"doc","publishTime":1764810804415}};
