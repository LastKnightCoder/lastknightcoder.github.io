      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":46,"title":"Floyed 算法","content":[{"type":"paragraph","children":[{"type":"formatted","text":"Dijkstra 和 Bellman-Ford 算法解决的都是单源最短路径问题，而 Floyed 算法解决的所有点对之间的最短问题。我们其实可以通过使用 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 次 Dijkstra 算法就可以求解所有点对之间的最短路径，不过 Dijkstra 算法不能处理负权边的问题，而 Floyed 算法可以处理负权边的问题。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是同 Bellman-Ford 算法一样，如果图中存在负权环的话，就根本不存在最短路径，而我们知道如果无向图中有负权边的话，就相当于存在负权环，所以 Floyed 算法其实也是一个有向图算法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Floyed 算法的思想也很简单，对于 "},{"type":"formatted","text":"v-w","code":true},{"type":"formatted","text":"，假设它们之间的最短路径表示为 "},{"type":"formatted","text":"dis[v][w]","code":true},{"type":"formatted","text":"，每一次都要尝试一下绕道点 "},{"type":"formatted","text":"t","code":true},{"type":"formatted","text":" 会不会得到更短的路径("},{"type":"formatted","text":"t","code":true},{"type":"formatted","text":" 从节点 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":" 取值到节点 "},{"type":"inline-math","tex":"V-1","children":[{"type":"formatted","text":"V-1"}]},{"type":"formatted","text":")，相当于"}]},{"type":"code-block","code":"for(int t = 0; t < V; t++) {\n    dis[v][w] = Math.min(dis[v][t] + dis[t][w], dis[v][w])\n}","language":"java","uuid":"2309085e-9cf2-416e-a23f-4c2a6ec9c2f7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当经历过 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 次的绕道尝试后，最终 "},{"type":"formatted","text":"dis[v][w]","code":true},{"type":"formatted","text":" 就表示节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 与节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 之间的最短路径。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外我们也可以通过 Floyed 算法对负权环进行检测，我们知道如果没有负权环的话 "},{"type":"formatted","text":"dis[v][v]","code":true},{"type":"formatted","text":" 的值始终是 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":"，如果存在负权环的话，那么 "},{"type":"formatted","text":"dis[v][v]","code":true},{"type":"formatted","text":" 的值就会更新为小于 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":" 的值，在经过 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 次绕道之后检查所有的 "},{"type":"formatted","text":"dis[v][v]","code":true},{"type":"formatted","text":" 是否等于 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":" 即可知道图中是否有负权环。"}]},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class Floyed {\n    private WeightedGraph graph;\n    private int[][] dis;\n    private boolean hasNegativeCycle = false;\n\n    public Floyed(WeightedGraph graph) {\n        this.graph = graph;\n        this.dis = new int[graph.V()][graph.V()];\n\n        for (int i = 0; i < dis.length; i++) {\n            Arrays.fill(dis[i], Integer.MAX_VALUE);\n        }\n\n        // 初始化 dis[][]\n        for (int v = 0; v < graph.V(); v++) {\n            dis[v][v] = 0;\n            for (int w: graph.adj(v)) {\n                dis[v][w] = graph.getWeight(v, w);\n            }\n        }\n\n        // 绕道尝试\n        for (int t = 0; t < graph.V(); t++) {\n            for(int v = 0; v < graph.V(); v++) {\n                for (int w = 0; w < graph.V(); w++) {\n                    if (!(dis[v][t] == Integer.MAX_VALUE || dis[t][w] == Integer.MAX_VALUE)) {\n                        dis[v][w] = Math.min(dis[v][w], dis[v][t] + dis[t][w]);\n                    }\n\n                }\n            }\n        }\n        \n        // 检测负权环\n        for (int v = 0; v < graph.V(); v++) {\n            if (dis[v][v] < 0) {\n                hasNegativeCycle = true;\n            }\n        }\n    }\n    \n    public int dis(int v, int w) {\n        return dis[v][w];\n    }\n    \n    public boolean isHasNegativeCycle() {\n        return hasNegativeCycle;\n    }\n}","language":"java","uuid":"ad3109ce-ace3-4840-871b-a3022b4a1a69","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Floyed 算法也有时称为 3-for 算法，因为它的算法核心就是三个嵌套的 "},{"type":"formatted","text":"for","code":true},{"type":"formatted","text":" 循环，Floyed 算法的实现是这三个算法中最简单的。"}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"最短路径算法","href":"/docs/document/1/43.html"},{"label":"Floyed 算法","href":"/docs/document/1/46.html"}],"prevPage":{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},"nextPage":{"title":"有向图算法","href":"/docs/document/1/47.html"},"createTime":1702090073149,"updateTime":1743303640562,"currentPath":"/docs/document/1/46.html"},"meta":{"type":"doc","publishTime":1764772322630}};
