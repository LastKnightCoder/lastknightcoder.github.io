document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":32,"title":"广度优先遍历","content":[{"type":"header","children":[{"type":"formatted","text":"树的层序遍历"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"树的层序遍历是指一层一层的遍历树的节点，它的实现是借助于队列进行实现的："}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting/raw/master/20201217105635.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"每一次从队列的头部取出元素进行遍历，然后将该元素的左右孩子添加进队列，以此往复，直至队列为空，遍历结束。"}]},{"type":"code-block","code":"import java.util.LinkedList;\nimport java.util.Queue;\n\npublic class BinaryTree {\n    private class Node {\n        private Node left;\n        private Node right;\n        private int value;\n        \n        public Node(int value) {\n            this.value = value;\n        }\n    }\n    \n    private Node root;\n    \n    public BinaryTree(int value) {\n        root = new Node(value);\n    }\n    \n    public void levelOrder() {\n        if (root == null) {\n            return;\n        }\n        Queue<Node> queue = new LinkedList<>();\n        queue.add(root);\n        while (!queue.isEmpty()) {\n            Node node = queue.remove();\n            if (node.left != null) {\n                queue.add(node.left);\n            }\n            if (node.right != null) {\n                queue.add(node.right);\n            }\n            System.out.println(node.value);\n        }\n    }\n}","language":"java","uuid":"0891d2aa-35e0-4d0e-ac6c-df2148409191","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"图的广度优先遍历"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"图的广度优先遍历与树的层序遍历相似，所谓的广度是指尽可能的遍历所有的相邻元素"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting/raw/master/20201217122524.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"广度优先遍历的实现同树的层序遍历类似，也是借助于队列这种数据结构，每次从队列的头部取出节点进行遍历，然后将该节点的所有相邻节点添加进队列，但是需要注意的是，因为图有可能发生重复遍历，所以需要使用 visited 标记已遍历的节点；另外还需要考虑到有多个联通分量的情况，与深度优先遍历的写法类似"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.Queue;\n\npublic class BFSGraph {\n\n    private Graph graph;\n    private boolean[] visited;\n    private ArrayList<Integer> order;\n\n    public BFSGraph(Graph graph) {\n        this.graph = graph;\n        visited = new boolean[graph.V()];\n        order = new ArrayList<>(graph.V());\n\n        for (int i = 0; i < graph.V(); i++) {\n            if (!visited[i]) {\n                bfs(i);\n            }\n        }\n    }\n\n    private void bfs(int s) {\n        Queue<Integer> queue = new LinkedList<>();\n        queue.add(s);\n        visited[s] = true;\n        while (!queue.isEmpty()) {\n            int v = queue.remove();\n            order.add(v);\n            for (int w: graph.adj(v)) {\n                if (!visited[w]) {\n                    queue.add(w);\n                    visited[w] = true;\n                }\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g4.txt\");\n        BFSGraph bfsGraph = new BFSGraph(graph);\n        System.out.println(bfsGraph.order);\n    }\n}","language":"java","uuid":"22914f4c-8653-4b5a-b2b4-66e46966546e","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"单源路径问题"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"对于路径问题的思路同图的深度优先遍历，使用一个 "},{"type":"formatted","text":"pre","code":true},{"type":"formatted","text":" 数组，保存当前节点的上一个节点，当查询源节点到某个目的节点的路径时，只要从目的节点根据 "},{"type":"formatted","text":"pre","code":true},{"type":"formatted","text":" 数组一直查找它的前一个节点，直到前一个节点为源节点就找到了路径"}]},{"type":"code-block","code":"import java.util.*;\n\npublic class SingleSourcePath {\n    private Graph graph;\n    private int s;\n\n    private boolean[] visited;\n    private int[] pre;\n\n    public SingleSourcePath(Graph graph, int s) {\n        this.graph = graph;\n        this.s = s;\n\n        visited = new boolean[graph.V()];\n        pre = new int[graph.V()];\n\n        Arrays.fill(visited, false);\n        Arrays.fill(pre, -1);\n\n        bfs(s);\n    }\n\n    private void bfs(int s) {\n        Queue<Integer> queue = new LinkedList<>();\n        queue.add(s);\n        visited[s] = true;\n        pre[s] = s;\n\n        while (!queue.isEmpty()) {\n            int v = queue.remove();\n            for (int w: graph.adj(v)) {\n                if (!visited[w]) {\n                    queue.add(w);\n                    visited[w] = true;\n                    pre[w] = v;\n                }\n            }\n        }\n    }\n\n    private void validate(int v) {\n        if (v < 0 || v >= graph.V()) {\n            throw new IllegalArgumentException(\"v is out of index\");\n        }\n    }\n\n    public boolean isConnected(int t) {\n        validate(t);\n        return visited[t];\n    }\n\n    public ArrayList<Integer> path(int t) {\n        ArrayList<Integer> res = new ArrayList<>();\n        if (!isConnected(t)) {\n            return res;\n        }\n\n        int cur = t;\n        while (cur != s) {\n            res.add(cur);\n            cur = pre[cur];\n        }\n        res.add(s);\n\n        Collections.reverse(res);\n        return res;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g4.txt\");\n        SingleSourcePath singleSourcePath = new SingleSourcePath(graph, 0);\n        // 0 -> 6: [0, 2, 6]\n        System.out.println(\"0 -> 6: \" + singleSourcePath.path(6));\n    }\n}","language":"java","uuid":"af0b3254-b873-440e-90c5-d11fb28df44c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于同样的图，使用深度优先遍历，结果是"}]},{"type":"code-block","code":"0 -> 6: [0, 1, 3, 2, 6]","language":"java","uuid":"6ce9eeca-78d7-43c4-a396-60017b925114","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"BFS 找到的路径比 DFS 找到的路径要短，这不是巧合，因为在无向无环图中，"},{"type":"formatted","text":"BFS 有一个重要的性质就是它寻找到的路径是最短路径","color":"hsl(300, 100%, 50%)"},{"type":"formatted","text":"，或者说经历的节点最少。为什么? 换种角度看，广度优先遍历是按照距离源的最小距离遍历的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面一个问题是寻找源到各点之间的距离，这个最简单的实现就是获得源到各点之间的路径，然后获得路径的长度即可推算出距离。下面提供一种更快的方法，无须先获得路径。首先我们需要声明一个 dis 数组来保存源到各点的距离，假设 w 是 v 的相邻节点，且 v 先被遍历，那么 s -> w 的距离为 s -> v + 1，即 dis[w] = dis[v] + 1"}]},{"type":"code-block","code":"import java.util.*;\n\npublic class SingleSourcePath {\n    private Graph graph;\n    private int s;\n\n    private boolean[] visited;\n    private int[] pre;\n    // dis 数组保存源到各节点的距离\n    private int[] dis;\n\n    public SingleSourcePath(Graph graph, int s) {\n        this.graph = graph;\n        this.s = s;\n\n        visited = new boolean[graph.V()];\n        pre = new int[graph.V()];\n        // 初始化\n        dis = new int[graph.V()];\n\n        Arrays.fill(visited, false);\n        Arrays.fill(pre, -1);\n        // 初始化\n        Arrays.fill(dis, -1);\n\n        bfs(s);\n    }\n\n    private void bfs(int s) {\n        Queue<Integer> queue = new LinkedList<>();\n        queue.add(s);\n        visited[s] = true;\n        pre[s] = s;\n        // 源到源的距离为 0\n        dis[s] = 0;\n\n        while (!queue.isEmpty()) {\n            int v = queue.remove();\n            for (int w: graph.adj(v)) {\n                if (!visited[w]) {\n                    queue.add(w);\n                    visited[w] = true;\n                    pre[w] = v;\n                    // 更新 dis\n                    dis[w] = dis[v] + 1;\n                }\n            }\n        }\n    }\n    \n    // 与 path 相关代码省略\n    public int dis(int t) {\n        validate(t);\n        return dis[t];\n    }\n}","language":"java","uuid":"c9cee6ab-68cb-444a-bf0c-b29afe10a3f1","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"相关用例"}],"level":2},{"type":"document-card-list","documentItemId":32,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"广度优先遍历","href":"/docs/document/1/32.html"}],"prevPage":{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"},"nextPage":{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},"createTime":1702012345402,"updateTime":1743303640549,"currentPath":"/docs/document/1/32.html"},"meta":{"type":"doc","publishTime":1764821904235}};
