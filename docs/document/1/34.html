document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":34,"title":"二进制矩阵中的最短路径","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"在一个 "},{"type":"inline-math","tex":"N \\times N","children":[{"type":"formatted","text":"N \\times N"}]},{"type":"formatted","text":" 的方形网格中，每个单元格有两种状态：空（0）或者阻塞（1）。现在我们的目标是从 "},{"type":"inline-math","tex":"(0, 0)","children":[{"type":"formatted","text":"(0, 0)"}]},{"type":"formatted","text":" 到达 "},{"type":"inline-math","tex":"(N-1, N-1)","children":[{"type":"formatted","text":"(N-1, N-1)"}]},{"type":"formatted","text":"，即从左上角到达右下角，而我们的目标是寻找一条最短路径，并且返回这条路径的长度。如果无法从左上角达到右下角，则返回 -1。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每个单元格有 8 种可能的方向"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_49ee35ff-4cb7-44eb-9511-a96856d2850d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面给出一个示例"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2a9f806e-9ca8-4794-ba9f-baff112538b2.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们将方格看做是一个图，方格中所有的 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 看做是图一个节点，如果两个 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 在各自的 8 个方向之中，就说明这两个节点之间有一条边。为了求得最短路径，我们需要从左上角这个节点进行 BFS，使用 "},{"type":"formatted","text":"dis[i][j]","code":true},{"type":"formatted","text":" 记录  "},{"type":"formatted","text":"(i, j)","code":true},{"type":"formatted","text":" 距离 "},{"type":"formatted","text":"(0, 0)","code":true},{"type":"formatted","text":" 的距离，所以 "},{"type":"formatted","text":"dis[N-1][N-1]","code":true},{"type":"formatted","text":" 也就表示从左上角到达右下角的最短路径"}]},{"type":"code-block","code":"import java.util.Arrays;\nimport java.util.LinkedList;\nimport java.util.Queue;\nimport java.util.stream.Collectors;\n\nclass Solution {\n    private boolean[][] visited;\n    private int[][] dis;\n    private int rows;\n    private int columns;\n\n    public int shortestPathBinaryMatrix(int[][] grid) {\n        this.rows = grid.length;\n        this.columns = grid[0].length;\n\n        if (grid[0][0] == 1 || grid[rows - 1][columns - 1] == 1) {\n            return -1;\n        }\n\n        if (rows == 1 && grid[rows][columns] == 0) {\n            return 1;\n        }\n\n        dis = new int[rows][columns];\n        visited = new boolean[rows][columns];\n\n        Queue<int[]> queue = new LinkedList<>();\n        queue.add(new int[]{0, 0});\n        visited[0][0] = true;\n        dis[0][0] = 1;\n\n        while (!queue.isEmpty()) {\n            int[] location = queue.remove();\n            int row = location[0];\n            int column = location[1];\n\n            for (int[] nextLocation: adj(row, column)) {\n                int nextRow = nextLocation[0];\n                int nextColumn = nextLocation[1];\n                if (!visited[nextRow][nextColumn] && grid[nextRow][nextColumn] == 0) {\n                    queue.add(new int[]{nextRow, nextColumn});\n                    visited[nextRow][nextColumn] = true;\n                    dis[nextRow][nextColumn] = dis[row][column] + 1;\n\n                    if (nextRow == rows - 1 && nextColumn == columns - 1) {\n                        return dis[nextRow][nextColumn];\n                    }\n                }\n            }\n        }\n\n        return -1;\n    }\n\n    private Iterable<int[]> adj(int row, int column) {\n        int[][] dirs = {{-1, 0}, {0, -1}, {0, 1}, {1, 0},\n                {1, 1}, {-1, 1}, {1, -1}, {-1, -1}};\n        return Arrays.stream(dirs)\n                .map(dir -> new int[]{dir[0] + row, dir[1] + column})\n                .filter(item -> item[0] < rows && item[0] >= 0 && item[1] < columns && item[1] >= 0)\n                .collect(Collectors.toList());\n    }\n}","language":"java","uuid":"e8449795-cc2c-47f6-82be-800e6f9de640","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"广度优先遍历","href":"/docs/document/1/32.html"},{"label":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"}],"prevPage":{"title":"广度优先遍历","href":"/docs/document/1/32.html"},"nextPage":{"title":"打开转盘锁","href":"/docs/document/1/35.html"},"createTime":1702051018861,"updateTime":1743303640549,"currentPath":"/docs/document/1/34.html"},"meta":{"type":"doc","publishTime":1764820858545}};
