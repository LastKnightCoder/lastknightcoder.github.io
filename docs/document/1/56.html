      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":56,"title":"匹配问题","content":[{"type":"header","children":[{"type":"formatted","text":"最大匹配与完全匹配"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"下面我们讲解的算法都是有关于二分图的算法"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b9cc5518-49cd-4185-af54-78e834ec4390.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"例如对于上图就是一个二分图，每条边都连接了两个不同部分的节点，生活中很多问题都可以建模为二分图的问题，例如相亲。左边表示男生群体，右边表示女生群体，如果两个节点之间有一条边，说明这一对男女可以匹配为一对；另外又比如求职，左边的节点表示求职者，右边的节点表示公司，如果节点之间有一条边，表明求职者与公司互相都比较满意，可以匹配。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们关心的问题是，向这样的二分图最多有多少个匹配，这样的问题称为最大匹配问题，如果最大匹配的个数与左右两边的节点数目都相同，那么就称为是完全匹配，对于相亲来说，意味着每一个人都可以找到另一半，对于求职来说，每个求职者都可以找到一家公司。"}]},{"type":"header","children":[{"type":"formatted","text":"最大流解决匹配问题"}],"level":2},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6e8a0872-47bb-46b7-abcf-4b37cdf285e7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"图中的每一条边的权值都为 1，即每条边的允许通过的最大流量为 1，表示每一个节点都只能被匹配一次，此时这个网络流的最大流就等于最大匹配数，我们将求二分图的最大匹配问题转化为了求网络流的最大流问题，而求最大流的问题我们在以前已经接触过。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们唯一需要的工作量就是根据上面的二分图得到一个网络流的模型，具体见代码"}]},{"type":"code-block","code":"public class BipartiteMatching {\n    private Graph graph;\n    private int maxMatching;\n\n    public BipartiteMatching(Graph graph) {\n        this.graph = graph;\n        // 首先对是否是二分图进行检测\n        BinaryPartitionDetection bpd = new BinaryPartitionDetection(graph);\n        if (!bpd.isBipartite()) {\n            throw new IllegalArgumentException(\"该图不为一个二分图\");\n        }\n        int[] colors = bpd.colors();\n\n        // 根据二分图建模为网络流，多添加的两个节点为源点和汇点，源点编号为 V，汇点为 V + 1\n        DirectedWeightedGraph directedWeightedGraph = new DirectedWeightedGraph(graph.V() + 2);\n        for (int v = 0; v \u003c graph.V(); v++) {\n            // colors[v] == 0 表明是左边的节点，被源点指向\n            if (colors[v] == 0) {\n                directedWeightedGraph.addEdge(graph.V(), v, 1);\n            } else {\n                // colors[v] == 1 表示是右边的节点，执行汇点\n                directedWeightedGraph.addEdge(v, graph.V() + 1, 1);\n            }\n\n            for (int w: graph.adj(v)) {\n                if (v \u003c w) {\n                    // 左边的节点指向右边的节点\n                    if (colors[v] == 0) {\n                        directedWeightedGraph.addEdge(v, w, 1);\n                    } else {\n                        directedWeightedGraph.addEdge(w, v, 1);\n                    }\n                }\n            }\n        }\n\n        // 建立网络流，获得最大流\n        MaxFlow maxFlow = new MaxFlow(directedWeightedGraph, graph.V(), graph.V() +1);\n        maxMatching = maxFlow.result();\n    }\n\n    public int result() {\n        return maxMatching;\n    }\n\n    // 如果最大匹配的两倍等于图中的节点数，说明是完全匹配\n    public boolean isPerfectMatching() {\n        return maxMatching * 2 == graph.V();\n    }\n}","language":"java","uuid":"85fae5ec-c5cd-4842-8bd9-7817209784b3","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"匈牙利算法"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"解决匹配问题的另一个算法就是匈牙利算法，还是以下图为例"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b9cc5518-49cd-4185-af54-78e834ec4390.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"匈牙利算法的思想就是每次从左边未匹配的点出发进行遍历，如果右边的点没有匹配，则将它们匹配为一对"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_62765321-16d6-4a38-a84b-55e91e726175.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们从节点 0 出发，来到节点 4，发现节点 4 没有被匹配，因此将它们设置为匹配，我们使用一个数组来进行记录"}]},{"type":"code-block","code":"matching[0] = 4;\nmatching[4] = 0;","language":"java","uuid":"d21fa6b6-0fe7-4ab4-a76f-892117b2b631","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果右边的节点已经被遍历了，则从右边节点匹配的节点继续遍历，例如对于下图，我们从 1 出发，来到节点 4，发现节点 4 已经被遍历了，于是来与节点 4 匹配的节点 0，然后从 0 开始向右遍历，直到向右找到一个未匹配的节点"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_54e881a3-df6b-439f-8983-cf01828db5f5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们遍历的路径是 1 → 4 → 0 → 6，本来 0-4 是匹配的，现在我们让它断开，让 1-4、0-6 匹配。"}]},{"type":"paragraph","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"重复上面的过程，每次如果在右边找到一个未匹配的节点，匹配数加一，当我们遍历完左边所有的未匹配的节点时，最终的匹配数就是最大匹配数，这就是匈牙利算法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里总结一下匈牙利算法的流程："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"从左边未匹配的节点遍历，如果右边的节点未匹配，那么让二者匹配，匹配数加一"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"否则右边的节点已匹配，那么从右边节点匹配的节点继续遍历"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"重复上面的过程，直到找到一个右边未匹配的节点，那么匹配数加一，并且更新匹配关系"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"根据遍历的顺序不同，匈牙利算法有两种实现，一种是使用 BFS 进行遍历，该种方法速度较快，但是代码复杂"}]},{"type":"code-block","code":"import java.util.*;\n\npublic class HungarianBFS {\n    private Graph graph;\n    private int[] matching;\n    private int maxMatching;\n\n    public HungarianBFS(Graph graph) {\n        this.graph = graph;\n        // 先检测是否是二分图\n        BinaryPartitionDetection bpm = new BinaryPartitionDetection(graph);\n        if (!bpm.isBipartite()) {\n            throw new IllegalArgumentException(\"该图不是二分图\");\n        }\n        this.matching = new int[graph.V()];\n        Arrays.fill(matching, -1);\n\n        int[] colors = bpm.colors();\n\n        for (int v = 0; v \u003c graph.V(); v++) {\n            // colors[v] == 0 说明是左边节点\n            // matching[v] == -1 说明未匹配，从这种节点开始遍历\n            if (colors[v] == 0 && matching[v] == -1) {\n                // bfs 的返回值表示是否找到一个右边未匹配的节点\n                if (bfs(v)) {\n                    // 找到匹配数就加一\n                    maxMatching++;\n                }\n            }\n        }\n    }\n\n    // 进行 bfs 遍历\n    private boolean bfs(int v) {\n        Queue\u003cInteger\u003e queue = new LinkedList\u003c\u003e();\n        queue.add(v);\n        int[] pre = new int[graph.V()];\n        Arrays.fill(pre, -1);\n        pre[v] = v;\n        while (!queue.isEmpty()) {\n            int cur = queue.remove();\n            for (int next: graph.adj(cur)) {\n                if (pre[next] == -1) {\n                    // 如果右边的节点已经匹配了\n                    if (matching[next] != -1) {\n                        // 从右边节点的匹配节点开始继续遍历\n                        queue.add(matching[next]);\n                        pre[next] = cur;\n                        pre[matching[next]] = next;\n                    } else {\n                        // 右边的节点未匹配，找到了，更新匹配关系\n                        pre[next] = cur;\n                        ArrayList\u003cInteger\u003e path = getPath(pre, v, next);\n                        for (int i = 0; i \u003c path.size(); i += 2) {\n                            matching[path.get(i)] = path.get(i + 1);\n                            matching[path.get(i + 1)] = path.get(i);\n                        }\n\n                        return true;\n                    }\n                }\n            }\n        }\n\n        return false;\n    }\n\n    private ArrayList\u003cInteger\u003e getPath(int[] pre, int start, int end) {\n        int cur = end;\n\n        ArrayList\u003cInteger\u003e result = new ArrayList\u003c\u003e();\n\n        while (cur != start) {\n            result.add(cur);\n            cur = pre[cur];\n        }\n        result.add(start);\n        Collections.reverse(result);\n        return result;\n    }\n\n    public int result() {\n        return maxMatching;\n    }\n}","language":"java","uuid":"38c37b3f-25a1-4034-b420-ca1a79e10824","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"还有一种实现是使用 DFS 进行遍历，虽然比 BFS 慢一丢丢，但还是实现简单"}]},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class HungarianDFS {\n    private Graph graph;\n    private int maxMatching;\n    private boolean[] visited;\n    private int[] matching;\n\n    public HungarianDFS(Graph graph) {\n        // 下面的初始化逻辑同 BFS\n        this.graph = graph;\n        BinaryPartitionDetection bmp = new BinaryPartitionDetection(graph);\n        if (!bmp.isBipartite()) {\n            throw new IllegalArgumentException(\"该图不是二分图\");\n        }\n        int[] colors = bmp.colors();\n        this.maxMatching = 0;\n        this.visited = new boolean[graph.V()];\n        this.matching = new int[graph.V()];\n        Arrays.fill(matching, -1);\n\n        for (int v = 0; v \u003c graph.V(); v++) {\n            // 左边未匹配节点开始遍历\n            if (colors[v] == 0 && matching[v] == -1) {\n                Arrays.fill(visited, false);\n                // dfs 返回值的含义同 bfs\n                if (dfs(v)) {\n                    maxMatching++;\n                }\n            }\n        }\n    }\n\n    private boolean dfs(int v) {\n        visited[v] = true;\n\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                visited[w] = true;\n                // 如果右边未匹配，更新匹配关系\n                // 或者右边已匹配，并且从右边已匹配的节点遍历能找到一个右边未匹配的节点，也更新匹配关系\n                if (matching[w] == -1 || dfs(matching[w])) {\n                    matching[v] = w;\n                    matching[w] = v;\n                    return true;\n                }\n            }\n        }\n\n        return false;\n    }\n\n    public int result() {\n        return maxMatching;\n    }\n}","language":"java","uuid":"f3be8d78-79ee-4b78-a4f7-d2f13e1b882a","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"匹配问题","href":"/docs/document/1/56.html"}],"prevPage":{"title":"棒球比赛","href":"/docs/document/1/55.html"},"nextPage":{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"},"createTime":1702134251293,"updateTime":1743303640563,"currentPath":"/docs/document/1/56.html"},"meta":{"type":"doc","publishTime":1764823684218}};
