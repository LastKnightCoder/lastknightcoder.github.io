      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":45,"title":"Bellman-Ford 算法","content":[{"type":"paragraph","children":[{"type":"formatted","text":"Bellman-Ford 算法也是求解单源最短路径的算法，与 Dijkstra 算法不同的是，它能够处理负权边，即使允许图中存在权值为负数的边。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在讲解 Bellman-Ford 算法之前，我们来看一组操作"}]},{"type":"code-block","code":"dis[w] = Math.min(dis[w], dis[v] + graph.getWeight(v, w));","language":"java","uuid":"41bade78-c009-4671-ad82-5301c67e8a68","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个操作叫做松弛操作。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么叫松弛，因为本来可以直接到达点 w，现在经过上面的操作之后，偏要经过点 v 然后到达 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" (不一定会经过，只有当 "},{"type":"formatted","text":"dis[v] + graph.getWeight(v, w) \u003c dis[w]","code":true},{"type":"formatted","text":" 才会经过点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":")，如果把边看做橡皮筋的话，不就相当于松弛了吗?"}]},{"type":"paragraph","children":[{"type":"formatted","text":"而 Bellman-Ford 算法就是，对所有的边进行 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 轮松弛操作，这个 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 指的是图中的节点数目，经过 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 轮松弛操作后，此时 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中保存的就是源点到各个节点的最短路径。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了理解 Bellman-Ford 算法为什么这么神奇，每个节点经过 "},{"type":"inline-math","tex":"V-1","children":[{"type":"formatted","text":"V-1"}]},{"type":"formatted","text":" 轮松弛操作之后就可以得到最短路径，我们还是要研究一下松弛操作"}]},{"type":"code-block","code":"dis[w] = Math.min(dis[w], dis[v] + graph.getWeight(v, w));","language":"java","uuid":"362712a3-2ec0-4017-9f85-3984779aadd0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果进行了松弛操作，意味源多经过了一条边到 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":"，所以如果我们设定 "},{"type":"formatted","text":"dis[w]","code":true},{"type":"formatted","text":" 为源点最多经过 "},{"type":"inline-math","tex":"k","children":[{"type":"formatted","text":"k"}]},{"type":"formatted","text":" 条边到达点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 的最短路径，那么经过一次松弛操作之后 "},{"type":"formatted","text":"dis[w]","code":true},{"type":"formatted","text":" 语义变为源点最多经过 "},{"type":"inline-math","tex":"k + 1","children":[{"type":"formatted","text":"k + 1"}]},{"type":"formatted","text":" 条边到达点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 的最短路径，因为一个节点到达另一个节点最多经过 "},{"type":"inline-math","tex":"V-1","children":[{"type":"formatted","text":"V-1"}]},{"type":"formatted","text":" 条边，因此经过 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 轮的松弛操作之后，"},{"type":"formatted","text":"dis[w]","code":true},{"type":"formatted","text":" 语义变为了源点最多经过 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 条边到达点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 的最短路径，考虑到了源点到达节点 w 能经过的边数的所有情况，所以最终的 "},{"type":"formatted","text":"dis[w]","code":true},{"type":"formatted","text":" 就是源点到点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 的最短路径。 "}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们来看一个例子，假设源点为 0"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106004518-44577f80-60ee-11eb-88c0-c98ae0feca84.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"图中有 4 个节点，因此要进行 3 轮松弛操作。第一次对所有边进行松弛操作"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106006283-052a2e00-60f0-11eb-9ae3-7a9ca4c241d2.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二次对所有边进行松弛操作"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106007070-dd879580-60f0-11eb-96cf-1c3ba40e7271.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第三次对所有边进行松弛操作"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106007575-6e5e7100-60f1-11eb-9883-dfc275196a2e.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"最后得到的结果为"}]},{"type":"table","children":[{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":"0"}]},{"type":"table-cell","children":[{"type":"formatted","text":"1"}]},{"type":"table-cell","children":[{"type":"formatted","text":"2"}]},{"type":"table-cell","children":[{"type":"formatted","text":"3"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"dis"}]},{"type":"table-cell","children":[{"type":"formatted","text":"0"}]},{"type":"table-cell","children":[{"type":"formatted","text":"4"}]},{"type":"table-cell","children":[{"type":"formatted","text":"1"}]},{"type":"table-cell","children":[{"type":"formatted","text":"2"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"Bellman-Ford 虽然能够处理负权边，但是如果图中有负权环的话，那么就无法求解了，所谓的负权环是指环中所以边的路径和为负值，这样的只要我每次经过一次环，每个节点的 dis 值都在减少，如果图中存在负权环的话，那么根本就不存在最小路径。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"大家在考虑一个问题，对于无向图来说，如果图中出现了负权边意味着什么? 假设 0-1 是一个负权边，因为是无向图，可以从 0 到 1，也可以从 1-0，那么我们可以从 0 来到 1，然后从 1 来到 0，这就形成一个负权环。所以 Bellman-Ford 算法其实是一个有向图算法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外我们可以通 Bellman-Ford 算法检测图中是否存在负权环，我们知道如果如果不存在负权环的话，经过 "},{"type":"inline-math","tex":"V-1","children":[{"type":"formatted","text":"V-1"}]},{"type":"formatted","text":" 次松弛操作后，"},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中的元素的值是不会再改变的，所以我们可以经过 "},{"type":"inline-math","tex":"V-1","children":[{"type":"formatted","text":"V-1"}]},{"type":"formatted","text":" 次松弛操作后再次进行一次松弛操作，如果在这次的松弛操作中，"},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 中有元素的值发生改变，那么就说明存在负权环。"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.Collections;\n\npublic class BellmanFord {\n    private int[] dis;\n    private WeightedGraph graph;\n    private int s;\n    private boolean hasNegativeCycle = false;\n    private int[] pre;\n\n    public BellmanFord(WeightedGraph graph, int s) {\n        this.graph = graph;\n        graph.validateVertex(s);\n        this.s = s;\n        this.dis = new int[graph.V()];\n        this.pre = new int[graph.V()];\n\n        Arrays.fill(dis, Integer.MAX_VALUE);\n        Arrays.fill(pre, -1);\n        dis[s] = 0;\n        pre[s] = s;\n\n        // k 代表轮数\n        for (int k = 1; k \u003c graph.V(); k++) {\n            // 对所有边进行松弛操作，v-w 与 w-v 是两条边\n            for (int v = 0; v \u003c graph.V(); v++) {\n                for (int w: graph.adj(v)) {\n                    if (dis[v] != Integer.MAX_VALUE\n                            && dis[v] + graph.getWeight(v, w) \u003c dis[w]) {\n                        dis[w] = dis[v] + graph.getWeight(v, w);\n                        pre[w] = v;\n                    }\n                }\n            }\n        }\n\n        // 再次进行一次松弛操作，检测负权环\n        for (int v = 0; v \u003c graph.V(); v++) {\n            for (int w: graph.adj(v)) {\n                if (dis[v] != Integer.MAX_VALUE\n                        && (dis[v] + graph.getWeight(v, w) \u003c dis[w])) {\n                    hasNegativeCycle = true;\n                }\n            }\n        }\n    }\n\n    public int[] result() {\n        return dis;\n    }\n\n    public Iterable\u003cInteger\u003e path(int t) {\n        ArrayList\u003cInteger\u003e path = new ArrayList\u003c\u003e();\n        int cur = t;\n        while (cur != s) {\n            path.add(cur);\n            cur = pre[cur];\n        }\n        path.add(s);\n\n        Collections.reverse(path);\n        return path;\n    }\n    \n    public boolean isHasNegativeCycle() {\n        return hasNegativeCycle;\n    }\n}","language":"java","uuid":"6e99a8ef-1c45-421d-8e63-ba415f1aef4b","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"最短路径算法","href":"/docs/document/1/43.html"},{"label":"Bellman-Ford 算法","href":"/docs/document/1/45.html"}],"prevPage":{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},"nextPage":{"title":"Floyed 算法","href":"/docs/document/1/46.html"},"createTime":1702089678581,"updateTime":1743303640561,"currentPath":"/docs/document/1/45.html"},"meta":{"type":"doc","publishTime":1764823684217}};
    </script>
