      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":39,"title":"哈密尔顿回路","content":[{"type":"header","children":[{"type":"formatted","text":"哈密尔顿回路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"1859年，爱尔兰数学家哈密尔顿（Hamilton）提出下列周游世界的游戏：在正十二面体的二十个顶点上依次标记伦敦、巴黎、莫斯科等世界著名大城市，正十二面体的棱表示连接这些城市的路线。试问能否在图中做一次旅行，从顶点到顶点，沿着边行走，经过每个城市恰好一次之后再回到出发点。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"将上面的问题抽象为一个图论问题：如果我们能从图的某点出发，经过所有的节点有且仅有一次，并且回到原点，那么我们就说图中存在哈密尔顿回路。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"哈密尔顿回路在数学上并没有找到充分必要条件，所谓充分必要条件指的是，如果图满足什么性质它就有哈密尔顿回路以及一旦图有哈密尔顿回路这个图就满足什么性质。所以我们判断判断某个图是否是哈密尔顿图，办法就是暴力搜索，使用回溯法去搜索图。"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Collections;\n\npublic class HamiltonCycle {\n    private Graph graph;\n    private boolean[] visited;\n    // 还有多少个节点未访问，当 left == 0 时表示所有节点都被访问过\n    private int left;\n    // 当前节点的前一个节点，已获得路径\n    private int[] pre;\n    // 最后一个被访问的节点\n    private int end;\n\n    public HamiltonCycle(Graph graph) {\n        this.graph = graph;\n        this.visited = new boolean[graph.V()];\n        this.left = graph.V();\n        this.pre = new int[graph.V()];\n        this.end = -1;\n\n        pre[0] = 0;\n        dfs(0);\n    }\n\n    // dfs 设有返回值，当找到哈密尔顿回路时，提前终止\n    private boolean dfs(int v) {\n        visited[v] = true;\n\n        left--;\n\n        if (left == 0 && graph.hasEdge(v, 0)) {\n            end = v;\n            return true;\n        }\n\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                pre[w] = v;\n                if (dfs(w)) return true;\n            }\n        }\n        visited[v] = false;\n        left++;\n        return false;\n    }\n\n    public Iterable\u003cInteger\u003e result() {\n        ArrayList result = new ArrayList();\n\n        if (end == -1) {\n            return result;\n        }\n\n        int cur = end;\n        while (cur != 0) {\n            result.add(cur);\n            cur = pre[cur];\n        }\n        result.add(0);\n\n        Collections.reverse(result);\n        return result;\n    }\n}","language":"java","uuid":"772ef7b1-f448-4438-bb54-e9cf58ede164","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"状态压缩"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"对图进行暴力搜索的时间复杂度是 "},{"type":"inline-math","tex":"O(n!)","children":[{"type":"formatted","text":"O(n!)"}]},{"type":"formatted","text":"，所以暴力搜索图只适合图的规模不大的情况，当图的规模不大时，我们可以对 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 数组进行压缩，使用一个整数来表示图中个节点的访问状态，具体就是根据这个数字的二进制位为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 还是为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 来表示是否被访问过。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"举个例子，我们使用 "},{"type":"formatted","text":"int","code":true},{"type":"formatted","text":" 类型来保存 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 变量，"},{"type":"formatted","text":"int","code":true},{"type":"formatted","text":" 类型占据 4 个字节，即 "},{"type":"formatted","text":"32","code":true},{"type":"formatted","text":" 位，第一位是符号位，故可以认为可以表示 "},{"type":"formatted","text":"31","code":true},{"type":"formatted","text":" 个节点访问状态，如果 "},{"type":"formatted","text":"visited = 1","code":true},{"type":"formatted","text":"，二进制就是 "},{"type":"formatted","text":"00000000 00000000 00000000 00000001","code":true},{"type":"formatted","text":"，从右往左数第 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 个数是 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"，就表示节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 被访问过了，其他数字都是 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，表示其他节点没有被访问过。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"观察上面的程序，我们对 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 有三种操作："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"判断某个节点有没有被访问过，例如判断节点 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 有没有被访问过，只要  和 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 相与即可知道，如果结果为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"，说明第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 位为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"，即节点 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 被访问过，否则就是未被访问过"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"将节点 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 设置为被访问过("},{"type":"formatted","text":"visited[i] = true","code":true},{"type":"formatted","text":")，也就是将第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 个位置由 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 变为 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":"，就是将 "},{"type":"inline-math","tex":"2^i","children":[{"type":"formatted","text":"2^i"}]},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 异或即可"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"将节点 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 设置为未被访问过("},{"type":"formatted","text":"visited[i] = false","code":true},{"type":"formatted","text":")，也就是将第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 个位置由 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 变为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，还是将 "},{"type":"inline-math","tex":"2^i","children":[{"type":"formatted","text":"2^i"}]},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 异或即可"}]}]}]},{"type":"highlight-block","color":"green","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"2^i","children":[{"type":"formatted","text":"2^i"}]},{"type":"formatted","text":" 可以表示为 1 \u003c\u003c i"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们修改上面的程序，将 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 数组变为一个数字"}]},{"type":"code-block","code":"public class HamiltonCircleCompress {\n    private Graph graph;\n    private int visited;\n    private int left;\n    private int[] pre;\n    private int end;\n\n    // 不变\n    public HamiltonCircleCompress(Graph graph) {\n        this.graph = graph;\n        this.visited = 0;\n        this.left = graph.V();\n        this.pre = new int[graph.V()];\n        this.end = -1;\n\n        pre[0] = 0;\n        dfs(0);\n    }\n\n    private boolean dfs(int v) {\n        // 设置 visited[v] 为 true\n        visited = visited ^ (1 \u003c\u003c v);\n        left--;\n\n        if (left == 0 && graph.hasEdge(v, 0)) {\n            end = v;\n            return true;\n        }\n\n        for (int w: graph.adj(v)) {\n            // 判断 visited[w] 是否访问过\n            if ((visited & (1 \u003c\u003c w)) == 0) {\n                pre[w] = v;\n                if (dfs(w)) return true;\n            }\n        }\n        \n        // 设置 visited[v] 为 false\n        visited = visited ^ (1 \u003c\u003c v);\n        left++;\n        return false;\n    }\n\n    // 不变\n    public Iterable\u003cInteger\u003e result() {\n        ArrayList result = new ArrayList();\n\n        if (end == -1) {\n            return result;\n        }\n\n        int cur = end;\n        while (cur != 0) {\n            result.add(cur);\n            cur = pre[cur];\n        }\n        result.add(0);\n\n        Collections.reverse(result);\n        return result;\n    }\n}","language":"java","uuid":"f8c66ba3-2de0-4df7-91e5-041db6963ef3","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"哈密尔顿路径"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"哈密尔顿路径的定义同哈密尔顿回路相似，如果从图中的某一点出发，能够经过图中所有的节点有且仅有一次，那么这条路径就是哈密尔顿路径。需要注意的是，图中是否存在哈密尔顿回路与起始点无关，但是哈密尔顿路径与起始点有关，可能从某点出发，并不能走过每一节点，但是从另一个节点出发，却能够走过所有节点，且只经过一次。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"哈密尔顿路径的代码同哈密尔顿回路的代码相似，只有两处不同："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"需要传入起始点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"formatted","text":"left","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 时，不用判断最后节点是否与起始点相邻，因为哈密尔顿路径不要求回到起始点"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Collections;\n\npublic class HamiltonPath {\n    private Graph graph;\n    private boolean[] visited;\n    private int left;\n    private int[] pre;\n    private int end;\n    // 起始点\n    private int s;\n\n    public HamiltonPath(Graph graph, int s) {\n        this.graph = graph;\n        this.s = s;\n        this.visited = new boolean[graph.V()];\n        this.left = graph.V();\n        this.pre = new int[graph.V()];\n        this.end = -1;\n\n        pre[0] = 0;\n        dfs(s);\n    }\n\n    private boolean dfs(int v) {\n        visited[v] = true;\n        left--;\n\n        // 不用判断 v 是否与起始点相邻\n        if (left == 0) {\n            end = v;\n            return true;\n        }\n\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                pre[w] = v;\n                if (dfs(w)) return true;\n            }\n        }\n        visited[v] = false;\n        left++;\n        return false;\n    }\n\n    public Iterable\u003cInteger\u003e result() {\n        ArrayList result = new ArrayList();\n\n        if (end == -1) {\n            return result;\n        }\n\n        int cur = end;\n        while (cur != 0) {\n            result.add(cur);\n            cur = pre[cur];\n        }\n        result.add(0);\n\n        Collections.reverse(result);\n        return result;\n    }\n}","language":"java","uuid":"6d44b312-de49-4ea5-aeea-ae277033777f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"记忆化搜索"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"考虑这么一幅图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ecd78ffa-983f-49d6-9546-53ce44b5b7c5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们将它分为两部分"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c6dfd14c-cac6-4615-9b7f-af170b9cfd7b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们称左边为第一部分，右边为第二部分。现在从节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 开始遍历，寻找有多少条哈密尔顿回路，我们发现不论是以何种方式遍历完第一部分来到第二部分，有多少条哈密尔顿路径只与第二部分有关，即这几种路径搜索多少条哈密尔顿路径的结果是一样的，无需重复遍历。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"例如，我们以 "},{"type":"inline-math","tex":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3","children":[{"type":"formatted","text":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3"}]},{"type":"formatted","text":" 的方式遍历完第一部分来到第二部分"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/105637161-00bf0480-5ea7-11eb-874d-f7557a1afb5f_5370cfc2-5ea2-48b5-8c5b-f6fae26ab16a.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"它有多少条哈密尔顿路径只与第二部分有关，如果我们以 "},{"type":"inline-math","tex":"0 \\rightarrow 2 \\rightarrow 1 \\rightarrow 3","children":[{"type":"formatted","text":"0 \\rightarrow 2 \\rightarrow 1 \\rightarrow 3"}]},{"type":"formatted","text":" 的方式遍历完第一部分来到第二部分"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/105637300-c144e800-5ea7-11eb-855b-be688b33eef0_e86eba81-c752-44c7-b37e-bdb208d45d78.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"它有多少条哈密尔顿路径的结果应该与以 "},{"type":"inline-math","tex":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3","children":[{"type":"formatted","text":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3"}]},{"type":"formatted","text":" 顺序遍历的结果相同，如果我们可以缓存这个结果，就可以避免不必要的遍历，从而提高性能。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当遍历到节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 时，如果此时它们的 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 是一样的，我们就可以认为它们会有一样的结果，例如对于上图，当遍历到节点 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":" 时，两条路径的遍历 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 状态是一样的，我们可以认为它们的结果是一样的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这种搜索策略叫做记忆化搜索，基于记忆化搜索的想法，我们改造上面的程序"}]},{"type":"code-block","code":"import java.util.Arrays;\nimport java.util.HashMap;\nimport java.util.stream.Collectors;\n\npublic class Solution {\n    private int visited;\n    private int[] start;\n    private int[] end;\n    private int rows;\n    private int columns;\n    private int left;\n    private int[][] grid;\n    private HashMap\u003cString, Integer\u003e memo= new HashMap\u003c\u003e();\n\n    public int uniquePathsIII(int[][] grid) {\n        this.grid = grid;\n        this.rows = grid.length;\n        this.columns = grid[0].length;\n        this.visited = 0;\n        this.start = new int[2];\n        this.end = new int[2];\n        this.left = rows * columns;\n\n        for (int row = 0; row \u003c rows; row++) {\n            for (int column = 0; column \u003c columns; column++) {\n                if (grid[row][column] == 1) {\n                    start[0] = row;\n                    start[1] = column;\n                    grid[row][column] = 0;\n                } else if (grid[row][column] == 2) {\n                    end[0] = row;\n                    end[1] = column;\n                    grid[row][column] = 0;\n                } else if (grid[row][column] == -1) {\n                    left--;\n                }\n            }\n        }\n\n        return dfs(start);\n    }\n\n    private int dfs(int[] v) {\n        String strV = format(v);\n\n        if (memo.containsKey(visited + strV)) {\n            return memo.get(visited + strV);\n        }\n\n        visited = visited ^ (1 \u003c\u003c (v[0] * columns + v[1]));\n        left--;\n        if (left == 0 && (v[0] == end[0] && v[1] == end[1])) {\n            visited = visited ^ (1 \u003c\u003c (v[0] * columns + v[1]));\n            left++;\n            memo.put(visited + strV, 1);\n            return 1;\n        }\n\n        int res = 0;\n        for (int[] w: adj(v[0], v[1])) {\n            if ((visited & (1 \u003c\u003c (w[0] * columns + w[1]))) == 0 && grid[w[0]][w[1]] != -1) {\n                res += dfs(w);\n            }\n        }\n\n        left++;\n        visited = visited ^ (1 \u003c\u003c (v[0] * columns + v[1]));\n        memo.put(visited+strV, res);\n        return res;\n    }\n\n    private Iterable\u003cint[]\u003e adj(int row, int column) {\n        int[][] dirs = {{-1, 0}, {0, -1}, {0, 1}, {1, 0}};\n        return Arrays.stream(dirs)\n                .map(dir -\u003e new int[]{dir[0] + row, dir[1] + column})\n                .filter(item -\u003e item[0] \u003c rows && item[0] \u003e= 0 && item[1] \u003c columns && item[1] \u003e= 0)\n                .collect(Collectors.toList());\n    }\n\n    private String format(int[] v) {\n        int location = v[0] * columns + v[1];\n        int first = location / 10;\n        int second = location % 10;\n        return \"\" + first + second;\n    }\n}","language":"java","uuid":"0aae743b-4cda-4839-9fbb-564f22a7f2fa","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"哈密尔顿回路","href":"/docs/document/1/39.html"}],"prevPage":{"title":"桥和割点","href":"/docs/document/1/38.html"},"nextPage":{"title":"不同路径","href":"/docs/document/1/40.html"},"createTime":1702059672183,"updateTime":1743303640550,"currentPath":"/docs/document/1/39.html"},"meta":{"type":"doc","publishTime":1767266228183}};
