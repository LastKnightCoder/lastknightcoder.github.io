      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":42,"title":"最小生成树","content":[{"type":"header","children":[{"type":"formatted","text":"概念"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先介绍生成树的概念，假设图中有 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 个顶点，如果能找到图中 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 条边这 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 个节点连接起来，那么就说这 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 个节点与 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 条边形成的图叫做这个图的生成树。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"例如图的 DFS 遍历以及 BFS 遍历就会形成一个生成树"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105726260-d6338100-5f64-11eb-917f-6b71dca9244a.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"只要图中的 "},{"type":"inline-math","tex":"V - 1","children":[{"type":"formatted","text":"V - 1"}]},{"type":"formatted","text":" 条边将图中的 "},{"type":"inline-math","tex":"V","children":[{"type":"formatted","text":"V"}]},{"type":"formatted","text":" 个顶点联通起来，那么就是图的一个生成树，所以一个图有很多的生成树，所谓的最小生成树，就是生成树边上的权值加起来最小"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105727359-f7e13800-5f65-11eb-9334-95a5cb8a5f31.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"那么最小生成树有什么应用呢? 如果将这个图看做是交通系统，找出最小生成树就是找到一种耗费最低的方式将所有站点连通起来的布局方案。"}]},{"type":"header","children":[{"type":"formatted","text":"切分定理"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"下面介绍切分定理，这个定理被用来寻找最小生成树。首先什么叫切分，所谓切分就是把节点分为两部分"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105727941-8eadf480-5f66-11eb-8235-0cc383470f68.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上图中节点 "},{"type":"inline-math","tex":"0, 5, 4","children":[{"type":"formatted","text":"0, 5, 4"}]},{"type":"formatted","text":" 被划分一部分，其余节点为另一部分。切分的方式有很多种，随意你进行切分，只要将图中的节点划分为两部分即可。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"引入了切分的概念，下面继续引入横切边的概念。所谓的横切边指的是将两个不同部分节点连接起来的边，例如对于上面的划分，有如下横切边"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105731240-2d882000-5f6a-11eb-8fde-2290f17c46a6.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面被标记为绿色的边就是横切边，可以看到横切边的两端是两个不同部分的节点。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"介绍完必须的概念之后，引入切分定理："}]},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"切分定理：对于任意一个切分，这种切分形成的横切边中，权值最小的横切边一定在最小生成树中。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个定理很好证明，我们根据切分将图分为两部分"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105806246-90b39a00-5fde-11eb-9f94-d0e677de8c81.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这两部分之间的边就是横切边，可以观察到横切边将这两个部分连接在了一起，为了使得生成树连通，一定要在横切边中选择一条边，而为了得到最小生成树，那当然选择的是权值最小的横切边，所以说权值最小的横切边一定在最小生成树中。"}]},{"type":"header","children":[{"type":"formatted","text":"Kruskal 算法"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Kruskal 算法是求的最小生成树的一种算法，他的思想很简单，就是每次取图中最小的边，只要这条边没有已经选取的边形成环。例如对于下图"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105723070-52c46080-5f61-11eb-9a04-f95bd0084a8b.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先选择图中最短的两条边，即权值为 1 的两条边 1-2 与 3-4"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105808350-85fb0400-5fe2-11eb-9c50-9e203c105b55.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面继续选择权值最小的边，选择 0-5、0-1，这两条边的权值为 2"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105808350-85fb0400-5fe2-11eb-9c50-9e203c105b55.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"继续选择权值最小的边，此时选择 1-4，权值为 3"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105808493-c5295500-5fe2-11eb-8718-a50c5bdcb89a.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"继续选择，此时应该选择 5-2 与 1-3 两条边，它们的权值为 4，但是我们发现选择 5-2 就会形成一个环，选择 1-3 也会形成环，所以这两条边不能选，生成树中可不能有环的。除开这两条边继续选择，发现 5-1、3-6 这两条边的权值为 5，权值最小，但是选择 5-1 就会形成环，所以不选 5-1，只选择 3-6"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105808789-60bac580-5fe3-11eb-8e65-2198d00eb0ab.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候我们已经找到了 6 条边将这 7 个顶点连接起来，即找到了一个最小生成树"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105808880-91026400-5fe3-11eb-95ac-a390ebeec53f.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Kruskal 的算法思想很简单，就是贪心，每次选择权重最小的边，但是怎么证明这种贪心策略是对的。这就需要用到切分定理。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每次我们选择最小的边，我们只需要让这条边是一个切分的横切边就行，这种切分很好做，让这条边两个节点属于不同的部分即可，根据切分定理这条横切边一定是最小生成树中的一条边。如果这条边与选择的边形成了一个环，这说明找不到一个切分，使得这条边的所有横切边中最短的边，所以不能选择它。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在代码的实现方向，每次我们找到一个最短的边时，需要判断是否构成一个环，例如我们找到边 5-1，需要判断添加这条边是否构成一个环，其实就是在检测在添加这条边之前节点 5 和节点 1 是否连通，如果是连通，添加这条边后就会形成环。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每次都需要判断两个节点需要连通，可以使用 DFS 来做，但是这样做复杂度太高，借助并查集这种数据结构可以很方便的判断两个节点是否连通，只需要判断它们是否在一个集合中即可。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"并查集的实现如下："}]},{"type":"code-block","code":"public class UnionFind {\n    private int[] parent;\n    private int[] rank;\n\n    public UnionFind(int size) {\n        parent = new int[size];\n        rank = new int[size];\n\n        for (int i = 0; i \u003c parent.length; i++) {\n            parent[i] = i;\n            rank[i] = 1;\n        }\n    }\n\n    public int getSize() {\n        return parent.length;\n    }\n\n    private int find(int index) {\n        if (index \u003c 0 || index \u003e= parent.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        while (index != parent[index]) {\n            index = parent[index];\n        }\n        return index;\n    }\n\n    public boolean isConnected(int p, int q) {\n        return find(p) == find(q);\n    }\n\n    public void unionElements(int p, int q) {\n        int pRoot = find(p);\n        int qRoot = find(q);\n        if (pRoot == qRoot) {\n            return;\n        }\n\n        if (rank[pRoot] \u003c= rank[qRoot]){\n            parent[pRoot] = parent[qRoot];\n            if (rank[pRoot] == rank[qRoot]) {\n                rank[qRoot]++;\n            }\n        } else {\n            parent[qRoot] = parent[pRoot];\n        }\n    }\n}","language":"java","uuid":"5d46c7ac-a8c7-48dd-a2d7-12109e4105d5","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们需要一个类来保存边的信息，这里我们新建一个 "},{"type":"formatted","text":"WeightedEdge","code":true},{"type":"formatted","text":" 类："}]},{"type":"code-block","code":"public class WeightedEdge {\n    private int v;\n    private int w;\n    private int weight;\n\n    public WeightedEdge(int v, int w, int weight) {\n        this.v = v;\n        this.w = w;\n        this.weight = weight;\n    }\n\n    public int getV() {\n        return v;\n    }\n\n    public int getW() {\n        return w;\n    }\n\n    public int getWeight() {\n        return weight;\n    }\n\n    @Override\n    public String toString() {\n        return String.format(\"(%d-%d: %d)\", v, w, weight);\n    }\n}","language":"java","uuid":"3ef283ad-2bc5-4c27-8e4b-a157d7f3ae7c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Kruskal 算法实现如下："}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Collections;\n\npublic class Kruskal {\n    private WeightedGraph graph;\n    public ArrayList\u003cWeightedEdge\u003e result = new ArrayList\u003c\u003e();\n\n    public Kruskal(WeightedGraph graph) {\n        this.graph = graph;\n        int V = graph.V();\n\n        // 将所有的边添加进集合中\n        ArrayList\u003cWeightedEdge\u003e edges = new ArrayList\u003c\u003e();\n        for (int v = 0; v \u003c V; v++) {\n            for (int w: graph.adj(v)) {\n                if (v \u003c w) {\n                    edges.add(new WeightedEdge(v, w, graph.getWeight(v, w)));\n                }\n            }\n        }\n        \n        \n\t    // 根据边的权值大小，从小到大排序\n        Collections.sort(edges, (w1, w2) -\u003e w1.getWeight() - w2.getWeight());\n        UnionFind unionFind = new UnionFind(V);\n        for (WeightedEdge edge: edges) {\n            int v = edge.getV();\n            int w = edge.getW();\n            // 如果之前不连通\n            if (!unionFind.isConnected(v, w)) {\n                result.add(edge);\n                unionFind.unionElements(v, w);\n            }\n        }\n    }\n\n    public Iterable\u003cWeightedEdge\u003e result() {\n        return result;\n    }\n}","language":"java","uuid":"28d26c4c-8f47-4482-8e54-2591ba33283d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Prim 算法"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"Prim 算法也是有关最小生成树的算法，它的思想同切分定理密切相关。因为对于每一个切分，权值最小的横切边一定在最小生成树中。Prim 算法就在遍历节点的过程中，将遍历到的节点与未遍历的节点作为两部分形成一个切分，然后遍历此时所有的横切边，在此边作为最小生成树的一条边。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每次遍历到一个节点即可找到一条横切边，当遍历到最后一个节点时，就能找到 "},{"type":"inline-math","tex":"V-1","children":[{"type":"formatted","text":"V-1"}]},{"type":"formatted","text":" 条边，即可形成一个生成树，并且根据切分定理，这个生成树一定是最小生成树。"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105813331-a6c75780-5fea-11eb-8f43-ef4aab628b27.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Prim 算法最后的结果是同 Kruskal 算法相同的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在代码的实现方面，因为每次产生一次新的切分，都要找到所有的横切边进行遍历然后找到最小的横切边，这个过程我们可以使用优先队列进行实现。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当遍历到一个节点时，新的横切边的产生都与这个遍历到的节点相连，我们只要将新的横切边添加到队列中即可，不用遍历节点寻找所以的横切边，另外这是一个优先队列，即队首元素它的权重是最小的，我们也不用查找最小边的炒作，直接取出队首元素即可。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外，可能你会注意到，当遍历到一个新的节点，产生一个新的切分时，之前的横切边可能不是横切边了，即优先队列中的边不是所有的边都是横切边。仔细想想，这个并没有影响，因为虽然不是所有的边都是横切边，但是所有的横切边都在队列里，我们从队列中取出边时进行判断，不是横切边直接忽略即可，完全不影响我寻找最小的横切边。"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.PriorityQueue;\n\npublic class Prim {\n    private WeightedGraph graph;\n    private boolean[] visited;\n    private ArrayList\u003cWeightedEdge\u003e result = new ArrayList\u003c\u003e();\n\n    public Prim(WeightedGraph graph) {\n        this.graph = graph;\n        PriorityQueue\u003cWeightedEdge\u003e priorityQueue = \n            new PriorityQueue\u003c\u003e((w1, w2) -\u003e w1.getWeight() - w2.getWeight());\n        this.visited = new boolean[graph.V()];\n        \n        visited[0] = true;\n        for (int w: graph.adj(0)) {\n            priorityQueue.add(new WeightedEdge(0, w, graph.getWeight(0, w)));\n        }\n\n        while (!priorityQueue.isEmpty()) {\n            WeightedEdge edge = priorityQueue.remove();\n            int v = edge.getV();\n            int w = edge.getW();\n            // 不是横切边直接忽略\n            if (visited[v] && visited[w]) {\n                continue;\n            }\n            result.add(edge);\n            visited[w] = true;\n            // 添加新的横切边\n            for (int next: graph.adj(w)) {\n                priorityQueue.add(new WeightedEdge(w, next, graph.getWeight(w, next)));\n            }\n        }\n\n    }\n\n    public Iterable\u003cWeightedEdge\u003e result() {\n        return result;\n    }\n}","language":"java","uuid":"2c90c962-e713-4b0a-8b44-5b1107fa0fde","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"tip","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果在实际中需要手写最小生成树算法，推荐使用 Prim 算法，因为在大多数的语言标准库中都有优先队列的实现，但是都没有并查集的实现，所以如果使用 Kruskal 算法需要手写并查集。"}]}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"最小生成树","href":"/docs/document/1/42.html"}],"prevPage":{"title":"欧拉回路","href":"/docs/document/1/41.html"},"nextPage":{"title":"最短路径算法","href":"/docs/document/1/43.html"},"createTime":1702088303482,"updateTime":1743303640550,"currentPath":"/docs/document/1/42.html"},"meta":{"type":"doc","publishTime":1764823684216}};
