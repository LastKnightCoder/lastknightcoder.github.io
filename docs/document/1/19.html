document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":19,"title":"线段树","content":[{"type":"paragraph","children":[{"type":"formatted","text":"对于有一类的问题，我们主要关心的是线段(区间)，比如说查询一个区间 "},{"type":"formatted","text":"[i, j]","code":true},{"type":"formatted","text":" 内的最大值，最小值等等。假设你有一个网站，你想查询某年(或某年以后)的用户访问量，消费最多的用户等等，这些都是在某个区间内进行查询，一般线段树的区间是固定的，不包含删除和添加的操作，只有查询和更新的操作"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231238432022-04-23-12-38-44.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"线段树的表示"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231239022022-04-23-12-39-03.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在如果假设有"},{"type":"formatted","text":"n","code":true},{"type":"formatted","text":"个元素，用数组存储的话，需要多少空间呢"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231239532022-04-23-12-39-53.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public class SegmentTree<E> {\n    private E[] tree;\n    private E[] data;\n\n    public SegmentTree(E[] arr) {\n        data = (E[]) new Object[arr.length];\n        for (int i = 0; i < arr.length; i++) {\n            data[i] = arr[i];\n        }\n\n        tree = (E[]) new Object[4 * data.length];\n    }\n\n    public int getSize() {\n        return data.length;\n    }\n    public E get(int index) {\n        if (index < 0 || index >= data.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n        return data[index];\n    }\n    \n    private int leftChild(int index) {\n        return 2 * index + 1;\n    }\n    private int rightChild(int index) {\n        return 2 * index + 2;\n    }\n}","language":"java","uuid":"2091f917-8b82-401f-bfa4-f91b47517a1c","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"创建线段树"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"下面就要根据数组来创建一棵线段树，我们的方法先创建下面的子线段树，然后由这些子线段树合并成大的线段树，以此类推"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231240192022-04-23-12-40-20.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在合并左右子树的过程中，我们不能写死合并的过程，具体怎么合并应该由业务决定，由用户去决定如何合并，所以合并的过程我们写一个接口，具体的实现由用户去实现"}]},{"type":"code-block","code":"public interface Merger<E> {\n    public E merge(E a, E b);\n}","language":"java","uuid":"69bff8ba-91b1-47cf-bae5-5acca936a95a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后我们在构造方法中添加创建线段树的过程(为了创建线段树，增加了一个辅助方法)"}]},{"type":"code-block","code":"private Merger<E> merger;\n//merger由用户传入 用户决定如何合并\npublic SegmentTree(E[] arr, Merger<E> merger) {\n    this.merger = merger;\n    \n    data = (E[]) new Object[arr.length];\n    for (int i = 0; i < arr.length; i++) {\n        data[i] = arr[i];\n    }\n    \n    tree = (E[]) new Object[4 * data.length];\n    //构造线段树 创建根节点为0，范围为[0,data.length - 1]的线段树\n    buildSegmentTree(0, 0, data.length - 1);\n}\n\n//在treeIndex创建一棵[l,r]的线段树\nprivate void buildSegmentTree(int treeIndex, int l, int r) {\n    if (l == r) {\n        tree[treeIndex] = data[l];\n        return;\n    }\n    \n    //l != r 那么就要创建子树的线段树\n    int leftTreeIndex = leftChild(treeIndex);\n    int rightTreeIndex = rightChild(treeIndex);\n    int mid = l + (r - l) / 2; //(l +r) / 2中l + r可能会大于int表示的范围从而溢出\n    buildSegmentTree(leftTreeIndex, l, mid);\n    buildSegmentTree(rightTreeIndex, mid + 1, r);\n    \n    //融合的方法由用户传入\n    tree[treeIndex] = merger.merge(tree[leftTreeIndex],tree[rightTreeIndex]);\n}","language":"java","uuid":"ad1a03bd-b097-452a-8591-d9cbdd8de7d7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了方便我们打印出线段树，我们实现一个 "},{"type":"formatted","text":"toString()","code":true},{"type":"formatted","text":" 方法"}]},{"type":"code-block","code":"@Override\npublic String toString() {\n    StringBuilder res = new StringBuilder();\n    res.append(\"[\");\n    for (int i = 0; i < tree.length; i++) {\n        if (tree[i] != null) {\n            res.append(tree[i]);\n        } else {\n            res.append(\"null\");\n        }\n        if (i != tree.length - 1) {\n            res.append(\", \");\n        }\n    }\n    res.append(\"]\");\n    return res.toString();\n}","language":"java","uuid":"98fea4f7-b8e1-4695-8487-30bfde6d9591","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"查询"}],"level":3},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231240502022-04-23-12-40-51.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实现代码"}]},{"type":"code-block","code":"public E query(int queryL, int queryR) {\n    if (queryL < 0 || queryL >= data.length\n            || queryR < 0 || queryR >= data.length\n            || queryL > queryR) {\n        throw new IllegalArgumentException(\"参数错误\");\n    }\n    return query(0, 0, data.length - 1, queryL, queryR);\n}\nprivate E query(int treeIndex, int l, int r, int queryL, int queryR) {\n    if (l == queryL && r == queryR) {\n        return tree[treeIndex];\n    }\n    int leftChildIndex = leftChild(treeIndex);\n    int rightChildIndex = rightChild(treeIndex);\n    int mid = l + (r - l) / 2;\n    if (queryL >= mid + 1) {\n        return query(rightChildIndex, mid+1, r, queryL, queryR);\n    } else if (queryR <= mid) {\n        return query(leftChildIndex, l, mid, queryL, queryR);\n    }\n    E leftResult = query(leftChildIndex, l, mid, queryL, mid);\n    E rightResult = query(rightChildIndex, mid + 1, r, mid + 1, queryR);\n    return merger.merge(leftResult, rightResult);\n}","language":"java","uuid":"2dd69f31-51e4-4041-ba85-86a117951663","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"更新"}],"level":3},{"type":"code-block","code":"public void set(int index, E e) {\n    if (index < 0 || index >= data.length) {\n        throw new IllegalArgumentException(\"参数错误\");\n    }\n    \n    set(0, 0, data.length - 1, index, e);\n}\nprivate void set(int treeIndex, int l, int r, int index, E e) {\n    if (l == r) {\n        tree[treeIndex] = e;\n        return;\n    }\n    int leftChildIndex = leftChild(treeIndex);\n    int rightChildIndex = rightChild(treeIndex);\n    int mid = l + (r - l) / 2;\n    if (index >= mid + 1) {\n        set(rightChildIndex, mid+1, r, index, e);\n    } else {\n        set(leftChildIndex, l, mid, index, e);\n    }\n    \n    tree[treeIndex] = merger.merge(tree[leftChildIndex], tree[rightChildIndex]);\n}","language":"java","uuid":"2775936d-f358-4ecf-8ac9-bc7ce06ba7b7","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"完整代码"}],"level":2},{"type":"code-block","code":"public class SegmentTree<E>{\n    private E[] tree;\n    private E[] data;\n    private Merger<E> merger;\n\n    public SegmentTree(E[] arr, Merger<E> merger) {\n        this.merger = merger;\n\n        data = (E[]) new Object[arr.length];\n        for (int i = 0; i < arr.length; i++) {\n            data[i] = arr[i];\n        }\n\n        tree = (E[]) new Object[4 * data.length];\n        buildSegmentTree(0, 0, data.length - 1);\n    }\n\n    //在treeIndex创建一棵[l,r]的线段树\n    private void buildSegmentTree(int treeIndex, int l, int r) {\n        if (l == r) {\n            tree[treeIndex] = data[l];\n            return;\n        }\n\n        int leftTreeIndex = leftChild(treeIndex);\n        int rightTreeIndex = rightChild(treeIndex);\n\n        int mid = l + (r - l) / 2; //(l +r) / 2中l + r可能会大于int表示的范围从而溢出\n        buildSegmentTree(leftTreeIndex, l, mid);\n        buildSegmentTree(rightTreeIndex, mid + 1, r);\n\n        tree[treeIndex] = merger.merge(tree[leftTreeIndex],tree[rightTreeIndex]);\n    }\n\n    public E query(int queryL, int queryR) {\n        if (queryL < 0 || queryL >= data.length\n                || queryR < 0 || queryR >= data.length\n                || queryL > queryR) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        return query(0, 0, data.length - 1, queryL, queryR);\n    }\n\n    private E query(int treeIndex, int l, int r, int queryL, int queryR) {\n        if (l == queryL && r == queryR) {\n            return tree[treeIndex];\n        }\n\n        int leftChildIndex = leftChild(treeIndex);\n        int rightChildIndex = rightChild(treeIndex);\n        int mid = l + (r - l) / 2;\n\n        if (queryL >= mid + 1) {\n            return query(rightChildIndex, mid+1, r, queryL, queryR);\n        } else if (queryR <= mid) {\n            return query(leftChildIndex, l, mid, queryL, queryR);\n        }\n\n        E leftResult = query(leftChildIndex, l, mid, queryL, mid);\n        E rightResult = query(rightChildIndex, mid + 1, r, mid + 1, queryR);\n\n        return merger.merge(leftResult, rightResult);\n    }\n\n\n    public void set(int index, E e) {\n        if (index < 0 || index >= data.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        set(0, 0, data.length - 1, index, e);\n    }\n\n    private void set(int treeIndex, int l, int r, int index, E e) {\n        if (l == r) {\n            tree[treeIndex] = e;\n            return;\n        }\n        int leftChildIndex = leftChild(treeIndex);\n        int rightChildIndex = rightChild(treeIndex);\n        int mid = l + (r - l) / 2;\n        if (index >= mid + 1) {\n            set(rightChildIndex, mid+1, r, index, e);\n        } else {\n            set(leftChildIndex, l, mid, index, e);\n        }\n\n        tree[treeIndex] = merger.merge(tree[leftChildIndex], tree[rightChildIndex]);\n    }\n\n    public int getSize() {\n        return data.length;\n    }\n    public E get(int index) {\n        if (index < 0 || index >= data.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n        return data[index];\n    }\n\n    private int leftChild(int index) {\n        return 2 * index + 1;\n    }\n    private int rightChild(int index) {\n        return 2 * index + 2;\n    }\n\n    @Override\n    public String toString() {\n        StringBuilder res = new StringBuilder();\n        res.append(\"[\");\n        for (int i = 0; i < tree.length; i++) {\n            if (tree[i] != null) {\n                res.append(tree[i]);\n            } else {\n                res.append(\"null\");\n            }\n\n            if (i != tree.length - 1) {\n                res.append(\", \");\n            }\n        }\n        res.append(\"]\");\n        return res.toString();\n    }\n}","language":"java","uuid":"c13c8177-2439-4f1f-af46-3b6fa53c618c","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"线段树","href":"/docs/document/1/19.html"}],"prevPage":{"title":"优先队列和堆","href":"/docs/document/1/17.html"},"nextPage":{"title":"Trie","href":"/docs/document/1/20.html"},"createTime":1701824080894,"updateTime":1743303640547,"currentPath":"/docs/document/1/19.html"},"meta":{"type":"doc","publishTime":1764822964064}};
