document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":33,"title":"岛屿的最大面积","content":[{"type":"header","children":[{"type":"formatted","text":"题目介绍"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个包含了一些 0 和 1 的非空二维数组 grid。一个岛屿是由一些相邻的 1 (代表土地) 构成的组合，这里的「相邻」要求两个 1 必须在水平或者竖直方向上相邻。你可以假设 grid 的四个边缘都被 0 (代表水) 包围着。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"找到给定的二维数组中最大的岛屿面积(如果没有岛屿，则返回面积为 0)。"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105491696-ae88b280-5cf1-11eb-8684-0cb5b9716d32.png","children":[{"type":"formatted","text":""}]},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"注意: 给定的矩阵 grid 的长度和宽度都不超过 50。"}]}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们将这个矩阵看做是一个图，矩阵中所有的 1 就是一个个的节点，如果两个 1 是垂直或者水平相邻的，那么就可以认为它们被一条边连着，即在一个联通分量中，而我们的任务就是找出包含节点最多的联通分量，并返回节点数目。"}]},{"type":"code-block","code":"import java.util.Arrays;\nimport java.util.stream.Collectors;\n\npublic class Solution {\n    private int rows;\n    private int columns;\n    private boolean[][] visited;\n    private int[][] grid;\n\n    public int maxAreaOfIsland(int[][] grid) {\n        // 因为题目没说 grid 不为空，所以下面是对 grid 的一些校验\n        if (grid == null) {\n            return 0;\n        }\n        this.rows = grid.length;\n        if (rows == 0) {\n            return 0;\n        }\n\n        this.columns = grid[0].length;\n        if (columns == 0) {\n            return 0;\n        }\n\n        this.grid = grid;\n        this.visited = new boolean[rows][columns];\n        \n        // 最大岛屿数目\n        int max = 0;\n        \n        for (int row = 0; row < rows; row++) {\n            for (int column = 0; column < columns; column++) {\n                if (!visited[row][column] && grid[row][column] == 1) {\n                    // dfs 返回的所在联通分量的节点数目\n                    max = Math.max(max, dfs(row, column));\n                }\n            }\n        }\n        return max;\n    }\n\n    // 表示以 [row, column] 为起点进行 DFS 遍历所在联通分量包含的节点数目\n    private int dfs(int row,int column) {\n        int count = 1;\n        visited[row][column] = true;\n\n        for (int[] w: adj(row, column)) {\n            int nextRow = w[0];\n            int nextColumn = w[1];\n            if (grid[nextRow][nextColumn] == 0) {\n                continue;\n            }\n            if (!visited[nextRow][nextColumn]) {\n                count += dfs(nextRow, nextColumn);\n            }\n        }\n        return count;\n    }\n\n    // 获得当前节点四个方向上的相邻节点\n    private Iterable<int[]> adj(int row, int column) {\n        int[][] dirs = {{-1, 0}, {0, -1}, {0, 1}, {1, 0}};\n        return Arrays.stream(dirs)\n                .map(dir -> new int[]{dir[0] + row, dir[1] + column})\n                .filter(item -> item[0] < rows && item[0] >= 0 && item[1] < columns && item[1] >= 0)\n                .collect(Collectors.toList());\n    }\n}","language":"java","uuid":"c342ba09-7522-4887-82d3-789fcb0e62e3","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"深度优先遍历","href":"/docs/document/1/10.html"},{"label":"岛屿的最大面积","href":"/docs/document/1/33.html"}],"prevPage":{"title":"二分图检测","href":"/docs/document/1/30.html"},"nextPage":{"title":"广度优先遍历","href":"/docs/document/1/32.html"},"createTime":1702050746921,"updateTime":1743303640549,"currentPath":"/docs/document/1/33.html"},"meta":{"type":"doc","publishTime":1764820858545}};
