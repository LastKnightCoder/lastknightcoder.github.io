      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":57,"title":"LCP04 覆盖","content":[{"type":"paragraph","children":[{"type":"formatted","text":"LCP04 覆盖是一道 LeetCode 上的题目，我们可以将这道题建模为二分图的最大匹配问题。"}]},{"type":"header","children":[{"type":"formatted","text":"题目介绍"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"你有一块棋盘，棋盘上有一些格子已经坏掉了。你还有无穷块大小为 1 ∗ 2 的多米诺骨牌，你想把这些骨牌不重叠地覆盖在完好的格子上，请找出你最多能在棋盘上放多少块骨牌? 这些骨牌可以横着或者竖着放。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"输入：n, m 代表棋盘的大小；broken 是一个 b∗2 的二维数组，其中每个元素代表棋盘上每一个坏掉的格子的位置。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出：一个整数，代表最多能在棋盘上放的骨牌数。"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5ca63628-d861-4e20-853c-f92096d95e5c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"建模"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"对于棋盘问题，如果玩过国际象棋的话，就知道棋盘是被染为黑白两色的，如"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0ab6c45a-45d7-4c88-9672-adf2affccc9d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"同理我们也可以将上面的棋盘根据上面的染色分为两个区域，如果将网格上的一个个网格看做是图中的节点的话，这不就是一个二分图吗? 而对一个 "},{"type":"inline-math","tex":"1 \\times 2","children":[{"type":"formatted","text":"1 \\times 2"}]},{"type":"formatted","text":" 的多米诺骨牌，它总是一边在黑色区域，一边在白色区域，题目问能够放置多少块多米诺骨牌不就是在问该二分图的最大匹配图吗?"}]},{"type":"header","children":[{"type":"formatted","text":"网络流"}],"level":2},{"type":"code-block","code":"import java.util.*;\n\npublic class Solution {\n    public int domino(int n, int m, int[][] broken) {\n        int[][] board = new int[n][m];\n\n        // 1 表示格子坏掉了，0 表示格子是好的\n        for (int[] p: broken) {\n            board[p[0]][p[1]] = 1;\n        }\n\n        // 将网格建模为一个图\n        AdjSet graph = new AdjSet(n * m);\n        for (int i = 0; i \u003c n; i++) {\n            for (int j = 0; j \u003c m; j++) {\n                // 我们只添加右边和下面的节点，因为左边的节点的右边就是自己，不用重复添加，同理对于上面也是\n                if (j + 1 \u003c m && board[i][j] == 0 && board[i][j + 1] == 0) {\n                    graph.addEdge(i * m + j, i * m + j + 1);\n                }\n\n                if (i + 1 \u003c n && board[i][j] == 0 && board[i + 1][j] == 0) {\n                    graph.addEdge(i * m + j, (i + 1) * m + j);\n                }\n            }\n        }\n\n        BipartiteMatching bm = new BipartiteMatching(graph);\n        return bm.result();\n    }\n}","language":"java","uuid":"8bbc2a8c-16a9-421a-8838-c70e3c1188c8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"匈牙利算法"}],"level":2},{"type":"code-block","code":"import java.util.*;\n\npublic class Solution {\n    public int domino(int n, int m, int[][] broken) {\n        int[][] board = new int[n][m];\n\n        for (int[] p: broken) {\n            board[p[0]][p[1]] = 1;\n        }\n\n        AdjSet graph = new AdjSet(n * m);\n        for (int i = 0; i \u003c n; i++) {\n            for (int j = 0; j \u003c m; j++) {\n                if (j + 1 \u003c m && board[i][j] == 0 && board[i][j + 1] == 0) {\n                    graph.addEdge(i * m + j, i * m + j + 1);\n                }\n\n                if (i + 1 \u003c n && board[i][j] == 0 && board[i + 1][j] == 0) {\n                    graph.addEdge(i * m + j, (i + 1) * m + j);\n                }\n            }\n        }\n\n        HungarianBFS hungarianBFS = new HungarianBFS(graph);\n        return hungarianBFS.result();\n    }\n}","language":"java","uuid":"6ed63ef0-473d-438e-b904-ee14ab1a6301","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"匹配问题","href":"/docs/document/1/56.html"},{"label":"LCP04 覆盖","href":"/docs/document/1/57.html"}],"prevPage":{"title":"匹配问题","href":"/docs/document/1/56.html"},"createTime":1702134498536,"updateTime":1743303640563,"currentPath":"/docs/document/1/57.html"},"meta":{"type":"doc","publishTime":1767266228185}};
