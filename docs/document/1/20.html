document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":20,"title":"Trie","content":[{"type":"paragraph","children":[{"type":"formatted","text":"Trie 树又称为字典树、前缀树。如果我们使用一般树结构去查询一个数据集里的单词，它的复杂度是 "},{"type":"inline-math","tex":"O(\\log n)","children":[{"type":"formatted","text":"O(log n)"}]},{"type":"formatted","text":"，但是如果我们使用 Trie 去查询单词的话，查询的复杂度只与单词的长度有关，与数据的规模无关。比如对于一个  规模的数据集，我们去查一个单词 "},{"type":"formatted","text":"\"word\"","code":true},{"type":"formatted","text":"，一般树的复杂度为 "},{"type":"inline-math","tex":"O(20)","children":[{"type":"formatted","text":"O(20)"}]},{"type":"formatted","text":"，而 Trie 树的复杂度为 "},{"type":"inline-math","tex":"O(4)","children":[{"type":"formatted","text":"O(4)"}]},{"type":"formatted","text":"，其中 4 是单词的长度，所以 Trie 树是一种很高效的查询字符串的树结构。"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231243012022-04-23-12-43-01.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"class Node {\n    char c;\n    Node next[26];\n}","language":"java","uuid":"83b0ab9e-b911-4c68-bf37-57ccda8f058f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是这样考虑忽略了大小写，并且没有考虑一些特殊的字符，如 "},{"type":"formatted","text":"@","code":true},{"type":"formatted","text":" 等符号或标点符号。所以我们每个节点不再是静态的指向 26 个节点，而是动态的指向若干个节点"}]},{"type":"code-block","code":"class Node {\n    char c;\n    Map<Character,Node> next;\n}","language":"java","uuid":"5b11c0e5-7eef-4cbd-a793-fe2e4aad8eaf","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外我们通过某个字符来到一个节点，可以通过 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":"已经知道了，所以我们不必存储这个字符"}]},{"type":"code-block","code":"class Node {\n    Map<Character,Node> next;\n}","language":"java","uuid":"8487f284-2c68-4489-b5ea-582cc3b6fb2e","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231243202022-04-23-12-43-21.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外通过叶子节点是无法区别单词的结尾的，因为有的单词可能为某个单词的前缀，如 "},{"type":"formatted","text":"\"pan\"","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"\"panda\"","code":true},{"type":"formatted","text":" 的前缀，所以我们要增加一个变量 "},{"type":"formatted","text":"isWord","code":true},{"type":"formatted","text":" 来表示是否是单词的结尾"}]},{"type":"code-block","code":"import java.util.TreeMap;\n\npublic class Trie {\n    private class Node {\n        public boolean isWord;\n        public TreeMap<Character,Node> next;\n\n        public Node(boolean isWord) {\n            this.isWord = isWord;\n            next = new TreeMap<>();\n        }\n\n        public Node() {\n            this(false);\n        }\n    }\n\n    private Node root;\n    private int size;\n\n    public Trie() {\n        root = new Node();\n        size = 0;\n    }\n\n    public int getSize() {\n        return size;\n    }\n}","language":"java","uuid":"3e9f621e-7755-4ec5-8317-4a554eb04ed4","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"添加单词"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231243432022-04-23-12-43-44.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public void add(String word) {\n    Node cur = root;\n    for (int i = 0; i < word.length(); i++) {\n        char c = word.charAt(i);\n        //判断是否有指向这个字符的节点\n        if (cur.next.get(c) == null) {\n            //没有则新建一个节点\n            cur.next.put(c, new Node());\n        }\n        //移动到这个节点\n        cur = cur.next.get(c);\n    }\n    //遍历完毕，判断这个节点是否被标记为单词的结尾 如果没有则标记并且维护size++\n    if (!cur.isWord) {\n        cur.isWord = true;\n        size++;\n    }\n}","language":"java","uuid":"d1bf05e7-0466-4cb1-9a03-7652ca2e5c72","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"查询单词"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"查询单词的逻辑与添加单词的逻辑高度重复，如果在查询过程中遇到没有指向该字符的节点，则直接返回 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"，如果遍历完毕都没有发生上面的情况，则判断该节点是否被标记为单词的结尾，如果没有则返回 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"，否则返回 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":"。"}]},{"type":"code-block","code":"public boolean contains(String word) {\n    Node cur = root;\n    for (int i = 0; i < word.length(); i++) {\n        char c = word.charAt(i);\n        if (cur.next.get(c) == null) {\n            return false;\n        }\n        cur = cur.next.get(c);\n    }\n\n    return cur.isWord;\n}","language":"java","uuid":"60425312-715d-4f77-bbfe-628bcc0390e3","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"前缀搜索"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"查询是否包含某个前缀，与 "},{"type":"formatted","text":"contains()","code":true},{"type":"formatted","text":" 方法几乎一样，不过最后不用判断是否是单词结尾，直接返回 "},{"type":"formatted","text":"true","code":true}]},{"type":"code-block","code":"public boolean isPrefix(String prefix) {\n    Node cur = root;\n    for (int i = 0; i < prefix.length(); i++) {\n        char c = prefix.charAt(i);\n        if (cur.next.get(c) == null) {\n            return false;\n        }\n        cur = cur.next.get(c);\n    }\n    return true;\n}","language":"java","uuid":"c5698c60-60eb-49d7-9cea-89715afec201","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"简单字符匹配"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"对于字符串中的字符 . 规定它可以匹配任意的字符，那么这样的一个匹配算法如何写，如果我们遇到的字符不是 "},{"type":"formatted","text":".","code":true},{"type":"formatted","text":" 的话，逻辑和上面一样，如果遇到的是 "},{"type":"formatted","text":".","code":true},{"type":"formatted","text":" 的话，我们就要去搜索该节点中所有的分叉(子树)"}]},{"type":"code-block","code":"public boolean match(String word) {\n    return match(root, word, 0);\n}\nprivate boolean match(Node node, String word, int index) {\n    //递归终止条件\n    if (index == word.length()) {\n        return node.isWord;\n    }\n\n    char c = word.charAt(index);\n    //如果不是.\n    if (c != '.') {\n        //没有指向该字符的节点 返回false\n        if (node.next.get(c) == null) {\n            return false;\n        } else {\n            //否则继续匹配\n            return match(node.next.get(c), word, index + 1);\n        }\n    } else {\n        //如果是. 去该节点的所有分叉中搜索\n        for (char nextChar : node.next.keySet()) {\n            //如果有任一个分叉匹配到了，则返回true\n            if (match(node.next.get(nextChar), word, index + 1)) {\n                return true;\n            }\n        }\n        //说明上面的没有一个匹配成功了，返回fasle\n        return false;\n    }\n}","language":"java","uuid":"a366038e-9b91-47c6-b63b-9a70c3e3022c","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"完整代码"}],"level":2},{"type":"code-block","code":"import java.util.TreeMap;\n\npublic class Trie {\n    private class Node {\n        public boolean isWord;\n        public TreeMap<Character,Node> next;\n\n        public Node(boolean isWord) {\n            this.isWord = isWord;\n            next = new TreeMap<>();\n        }\n\n        public Node() {\n            this(false);\n        }\n    }\n\n    private Node root;\n    private int size;\n\n    public Trie() {\n        root = new Node();\n        size = 0;\n    }\n\n    public int getSize() {\n        return size;\n    }\n\n    public void add(String word) {\n        Node cur = root;\n        for (int i = 0; i < word.length(); i++) {\n            char c = word.charAt(i);\n            if (cur.next.get(c) == null) {\n                cur.next.put(c, new Node());\n            }\n            cur = cur.next.get(c);\n        }\n        if (!cur.isWord) {\n            cur.isWord = true;\n            size++;\n        }\n    }\n\n    public boolean contains(String word) {\n        Node cur = root;\n        for (int i = 0; i < word.length(); i++) {\n            char c = word.charAt(i);\n            if (cur.next.get(c) == null) {\n                return false;\n            }\n            cur = cur.next.get(c);\n        }\n\n        return cur.isWord;\n    }\n\n    public boolean isPrefix(String prefix) {\n        Node cur = root;\n        for (int i = 0; i < prefix.length(); i++) {\n            char c = prefix.charAt(i);\n            if (cur.next.get(c) == null) {\n                return false;\n            }\n            cur = cur.next.get(c);\n        }\n        return true;\n    }\n\n    public boolean match(String word) {\n        return match(root, word, 0);\n    }\n    private boolean match(Node node, String word, int index) {\n        //递归终止条件\n        if (index == word.length()) {\n            return node.isWord;\n        }\n\n        char c = word.charAt(index);\n        if (c != '.') {\n            if (node.next.get(c) == null) {\n                return false;\n            } else {\n                return match(node.next.get(c), word, index + 1);\n            }\n        } else {\n            for (char nextChar : node.next.keySet()) {\n                if (match(node.next.get(nextChar), word, index + 1)) {\n                    return true;\n                }\n            }\n            //说明上面的没有一个匹配成功了\n            return false;\n        }\n    }\n}","language":"java","uuid":"eced819e-d9a0-418d-8c23-ba7abeb00378","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"Trie","href":"/docs/document/1/20.html"}],"prevPage":{"title":"线段树","href":"/docs/document/1/19.html"},"nextPage":{"title":"并查集","href":"/docs/document/1/21.html"},"createTime":1701824470571,"updateTime":1743303640547,"currentPath":"/docs/document/1/20.html"},"meta":{"type":"doc","publishTime":1764820858542}};
