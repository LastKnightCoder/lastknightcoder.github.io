      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":23,"title":"红黑树","content":[{"type":"header","children":[{"type":"formatted","text":"2-3树"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"2-3 树的节点它可以有一个元素，也可以有两个元素，它也满足二分搜索树的性质"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231254562022-04-23-12-54-56.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们把含有两个孩子的节点称为 2 节点，含有 3 个孩子的节点称为 3 节点"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231255122022-04-23-12-55-12.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"2-3 树是一种绝对平衡的树，所谓绝对平衡的树指的是从根节点到任意一个叶子节点，所经过的节点是都是相同的。那么 2-3 树是怎么做到的呢?"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231255312022-04-23-12-55-32.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"红黑树与2-3树的等价性"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"由于我们一般每个节点都是表示一个数据的，2-3 树有点难以实现，所以有人发明一种树叫做红黑树，它可以说是 2-3 树的等价，那么它树如何等价的呢?"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231255502022-04-23-12-55-50.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上图想必很清楚的描述了等价的过程"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231256082022-04-23-12-56-08.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们来实现一下上面描述的红黑树，大部分的代码都是和二分搜索树是重合的，只是在添加时有调整，另外这里我们不牵涉到从红黑树中删除元素，因为太复杂了(其实是我不会)"}]},{"type":"code-block","code":"public class RedBlackTree\u003cE extends Comparable\u003cE\u003e\u003e {\n    //规定红色为true 黑色为false\n    private static final boolean RED = true;\n    private static final boolean BLACK = false;\n\n    private class Node {\n        public E e;\n        public Node left;\n        public Node right;\n        public boolean color;\n\n        public Node(E e) {\n            this.e = e;\n            left = null;\n            right = null;\n            //我们在2-3树中添加节点时 永远是和别的节点融合 所以默认为红色\n            color = RED;\n        }\n\n        @Override\n        public String toString() {\n            return e.toString();\n        }\n    }\n\n    private Node root;\n    private int size;\n\n    public RedBlackTree() {\n        root = null;\n        size = 0;\n    }\n\n    public int size() {\n        return size;\n    }\n    public boolean isEmpty() {\n        return size == 0;\n    }\n\n    public void add(E e) {\n        root = add(root, e);\n    }\n\t\n    // 判断节点node的颜色\n    private boolean isRed(Node node){\n        if(node == null)\n            return BLACK;\n        return node.color;\n    }\n\n    private Node add(Node node, E e) {\n        if (node == null) {\n            size++;\n            return new Node(e);\n        }\n\n        if (e.compareTo(node.e) \u003c 0) {\n            node.left = add(node.left, e);\n        } else if (e.compareTo(node.e) \u003e 0) {\n            node.right = add(node.right,e);\n        }\n\n        return node;\n    }\n\n    public boolean contains(E e) {\n        return contains(root, e);\n    }\n\n    private boolean contains(Node node, E e) {\n        if (node == null) {\n            return false;\n        }\n\n        if (e.equals(node.e)) {\n            return true;\n        } else if (e.compareTo(node.e) \u003c 0) {\n            return contains(node.left, e);\n        } else {\n            return contains(node.right,e);\n        }\n    }\n}","language":"java","uuid":"fa12af11-0cc6-4813-8a20-68753506ef66","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"红黑树的性质"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在了解了红黑树与 2-3 等价以后，我们来看红黑树满足哪些性质"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"每个节点或者是红色的，或者的是黑色的"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"根节点是黑色的"}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_5b9f28ef-6c71-4c6d-87bd-cf2bd0f43904.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"每一个叶子节点(最后的空节点是黑色的)"}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为红色节点只存在于 3 节点中，而所有的叶子节点都是 2 节点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果一个节点是红色的，那么它的所有孩子节点都是黑色的"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231256272022-04-23-12-56-28.png","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"从任意一个节点到黑色节点，经过的黑色节点是一样的"}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为 2-3 树到所有叶子节点的距离都是一样的，而经过的节点，不管是 2 节点还是 3 节点，都包括一个黑色节点，所以经过的黑色节点是一样的"}]}]}]},{"type":"header","children":[{"type":"formatted","text":"向红黑树中添加元素"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"因为根节点是黑色的，所以我们在添加完元素后需要将根节点变为黑色"}]},{"type":"code-block","code":"public void add(E e) {\n    root = add(root, e);\n    \n    root.color = BLACK;\n}","language":"java","uuid":"44031d30-47de-49fb-baef-6450e37a20b4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在添加元素到红黑树中时，可能会破坏红黑树的规则，这时就需要红黑树进行自我调整，我们就来看一下添加过程会碰到的所有情形，以及处理方法"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231257502022-04-23-12-57-50.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//   node                     x\n//  /   \\     左旋转         /  \\\n// T1   x   ---------\u003e   node   T3\n//     / \\              /   \\\n//    T2 T3            T1   T2\nprivate Node leftRotate(Node node){\n    Node x = node.right;\n    // 左旋转\n    node.right = x.left;\n    x.left = node;\n    x.color = node.color;\n    node.color = RED;\n    return x;\n}","language":"java","uuid":"64bcc13f-39a2-4e37-bc4c-20d0e5b4b578","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231258072022-04-23-12-58-07.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"// 颜色翻转\nprivate void flipColors(Node node){\n    node.color = RED;\n    node.left.color = BLACK;\n    node.right.color = BLACK;\n}","language":"java","uuid":"08b2557e-6785-482c-8620-eadd096f038f","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231258242022-04-23-12-58-25.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//     node                   x\n//    /   \\     右旋转       /  \\\n//   x    T2   -------\u003e   y   node\n//  / \\                       /  \\\n// y  T1                     T1  T2\nprivate Node rightRotate(Node node){\n    Node x = node.left;\n    // 右旋转\n    node.left = x.right;\n    x.right = node;\n    x.color = node.color;\n    node.color = RED;\n    return x;\n}","language":"java","uuid":"47096292-05af-428b-bec0-b7d95cd95dbd","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231259102022-04-23-12-59-10.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对上面的情况进行总结"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231259312022-04-23-12-59-31.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"private Node add(Node node, E e) {\n\n    if (node == null) {\n        size++;\n        return new Node(e);\n    }\n    \n    if (e.compareTo(node.e) \u003c 0) {\n        node.left = add(node.left, e);\n    } else if (e.compareTo(node.e) \u003e 0) {\n        node.right = add(node.right,e);\n    }\n    \n    if (isRed(node.right) && !isRed(node.left))\n        node = leftRotate(node);\n    if (isRed(node.left) && isRed(node.left.left))\n        node = rightRotate(node);\n    if (isRed(node.left) && isRed(node.right))\n        flipColors(node);\n\n    return node;\n}","language":"java","uuid":"ff88dc83-551a-480f-9941-97a208af360e","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"完整代码"}],"level":2},{"type":"code-block","code":"public class RedBlackTree\u003cE extends Comparable\u003cE\u003e\u003e {\n    //规定红色为true 黑色为false\n    private static final boolean RED = true;\n    private static final boolean BLACK = false;\n\n    private class Node {\n        public E e;\n        public Node left;\n        public Node right;\n        public boolean color;\n\n        public Node(E e) {\n            this.e = e;\n            left = null;\n            right = null;\n            //我们在2-3树中添加节点时 永远是和别的节点融合 所以默认为红色\n            color = RED;\n        }\n\n        @Override\n        public String toString() {\n            return e.toString();\n        }\n    }\n    \n    private Node root;\n    private int size;\n\n    public RedBlackTree() {\n        root = null;\n        size = 0;\n    }\n\n    public int size() {\n        return size;\n    }\n    public boolean isEmpty() {\n        return size == 0;\n    }\n\n    private boolean isRed(Node node) {\n        if (node == null) {\n            return BLACK;\n        }\n        return node.color;\n    }\n\n    //   node                     x\n    //  /   \\     左旋转         /  \\\n    // T1   x   ---------\u003e   node   T3\n    //     / \\              /   \\\n    //    T2 T3            T1   T2\n    private Node leftRotate(Node node) {\n        Node x = node.right;\n        node.right = x.left;\n        x.left = node;\n\n        x.color = node.color;\n        node.color = RED;\n\n        return x;\n    }\n\n    //     node                   x\n    //    /   \\     右旋转       /  \\\n    //   x    T2   -------\u003e   y   node\n    //  / \\                       /  \\\n    // y  T1                     T1  T2\n    private Node rightRotate(Node node) {\n        Node x = node.left;\n        node.left = x.right;\n        x.right = node;\n\n        x.color = node.color;\n        node.color = RED;\n\n        return x;\n    }\n\n    private void flipColors(Node node) {\n        node.color = RED;\n        node.left.color = BLACK;\n        node.right.color = BLACK;\n    }\n\n    public void add(E e) {\n        root = add(root, e);\n\n        root.color = BLACK;\n    }\n\n\n    private Node add(Node node, E e) {\n        if (node == null) {\n            size++;\n            return new Node(e);\n        }\n\n        if (e.compareTo(node.e) \u003c 0) {\n            node.left = add(node.left, e);\n        } else if (e.compareTo(node.e) \u003e 0) {\n            node.right = add(node.right,e);\n        }\n\n        if (isRed(node.right) && !isRed(node.left))\n            node = leftRotate(node);\n        if (isRed(node.left) && isRed(node.left.left))\n            node = rightRotate(node);\n        if (isRed(node.left) && isRed(node.right))\n            flipColors(node);\n        \n        return node;\n    }\n\n    public boolean contains(E e) {\n        return contains(root, e);\n    }\n\n    private boolean contains(Node node, E e) {\n        if (node == null) {\n            return false;\n        }\n\n        if (e.equals(node.e)) {\n            return true;\n        } else if (e.compareTo(node.e) \u003c 0) {\n            return contains(node.left, e);\n        } else {\n            return contains(node.right,e);\n        }\n    }\n}","language":"java","uuid":"dcc9bb54-22d1-41d9-a99a-7c9f3186f968","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"红黑树","href":"/docs/document/1/23.html"}],"prevPage":{"title":"AVL 树","href":"/docs/document/1/22.html"},"nextPage":{"title":"哈希表","href":"/docs/document/1/31.html"},"createTime":1701906772959,"updateTime":1743303640548,"currentPath":"/docs/document/1/23.html"},"meta":{"type":"doc","publishTime":1767266228180}};
