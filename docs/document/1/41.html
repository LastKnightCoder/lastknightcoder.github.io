      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":41,"title":"欧拉回路","content":[{"type":"paragraph","children":[{"type":"formatted","text":"18世纪初普鲁士的哥尼斯堡，有一条河穿过，河上有两个小岛，有七座桥把两个岛与河岸联系起来，如下图(黄色线条代表桥，绿色区域代表小岛和河岸)"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2e0664dd-027d-4f55-b272-86a060633426.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有个人提出一个问题：一个步行者怎样才能不重复、不遗漏地一次走完七座桥，最后回到出发点。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"数学家欧拉将河岸与小岛建模为节点，而七座桥建模为边，所以七桥问题建模为上图最右边的图论问题，找到图中经过所有边一次且回到原点的回路，这种回路我们后来称为欧拉回路。"}]},{"type":"header","children":[{"type":"formatted","text":"欧拉回路的数学性质"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"上述的七桥问题很长时间都没有解决，即人们没有找到一条回路，能够只经过每座桥一次，然后回到原点。所以欧拉就猜想是不是根本不存在这种回路，经过他的证明，上述七桥问题的确不存在欧拉回路。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"欧拉证明十分的简单，因为要从起点出发回到原点，那么对于每个节点都要一进一出，而每次进出需要消耗两条边，所以每个节点必须具有偶数条边，它才能保证有进有出，才有可能回到原点。所以就得到了欧拉回路一个充分必要条件："}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"每个节点的度都是偶数 "},{"type":"inline-math","tex":"\\Leftrightarrow","children":[{"type":"formatted","text":"\\Leftrightarrow"}]},{"type":"formatted","text":" 图中存在欧拉回路"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"每个节点的度都是偶数是图中存在欧拉回路是充分必要条件，二者可以互推，所以我们只要判断图中每个节点的度是不是偶数即可得到图中是否有欧拉回路这个结论。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"回到七桥问题，观察图中的每一个节点，发现它们的度都不是偶数，所以绝对不可能从某点出发，经过所以的边一次然后回到原点，至此欧拉完美的解决了七桥问题，图论领域也是从此开始发展。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面是判断欧拉回路是否存在的代码："}]},{"type":"code-block","code":"public class EulerCycle {\n    private Graph graph;\n\n    public EulerCycle(Graph graph) {\n        this.graph = graph;\n    }\n\n    public boolean hasEulerCycle() {\n\n        // 如果图中不只一个联通分量的话，说明肯定没有欧拉回路\n        CCGraph ccGraph = new CCGraph(graph);\n        if (ccGraph.getCCcount() != 1) {\n            return false;\n        }\n\n        for (int i = 0; i < graph.V(); i++) {\n            if (graph.degree(i) % 2 != 0) {\n                return false;\n            }\n        }\n        return true;\n    }\n}","language":"java","uuid":"eeaccf42-8d34-4b82-96e0-43195316dfd6","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"求解欧拉回路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们只是判断图中欧拉回路是否存在，但是我们没有得到一个具体的欧拉回路，所以在本节中介绍三种方法得到欧拉回路。"}]},{"type":"header","children":[{"type":"formatted","text":"回溯法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"回溯法就是暴力搜索法，搜索从起点出发的所有路径，直到找到一条欧拉回路"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/105667919-3ef40c80-5f17-11eb-925c-8d26434d285c_6a6ab5e1-f6bc-40a4-afc8-0a748d1703ef.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Fleury 算法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"考虑下图，当我们从节点 0 来到节点 2 时"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_678f22d9-c805-41e7-93f9-e06ea7f14e4c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于回溯法，可以选择遍历节点 1，也可以选择遍历节点 3，而 Fleury 算法却会选择接下来遍历节点 3 而不是节点 1，因为边 2-1 它是一个桥，如果选择遍历节点 1，就不可能再次回到节点 2，即节点 2 右边的边 2-3 2-4 不可能被访问到，所以 Fleury 算法的策略就是在遍历边前判断这条边是不是桥，如果是桥的话，就不遍历这条边，选择其他的边。"}]},{"type":"header","children":[{"type":"formatted","text":"Hierholzer 算法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"考虑下图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b278dca6-a537-43ab-874f-8b17c966350c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上图每个节点的度都是偶数，所以该图一定有欧拉回路。Hierholzer 算法首先在图中随便找到一个环"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d47cf738-5879-487c-ab40-ed7e4c0d3244.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个环如果是欧拉回路，那就找到了；如果不是欧拉回路，例如上面找到环 "},{"type":"inline-math","tex":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3 \\rightarrow 0","children":[{"type":"formatted","text":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3 \\rightarrow 0"}]},{"type":"formatted","text":"，它不是欧拉回路，中间缺失了一环，因为节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 还与别的节点相连，上述链中的 $2$ 应该变为 "},{"type":"inline-math","tex":"2 \\rightarrow \\cdots \\rightarrow 2","children":[{"type":"formatted","text":"2 \\rightarrow \\cdots \\rightarrow 2"}]},{"type":"formatted","text":"，所以我们需要回退到节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 开始寻找这个环。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"比如我们继续找到了 "},{"type":"inline-math","tex":"2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 2","children":[{"type":"formatted","text":"2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 2"}]},{"type":"formatted","text":" 这个环"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6a124f90-511c-4bdc-abed-4a72fa67d097.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是因为 "},{"type":"inline-math","tex":"5","children":[{"type":"formatted","text":"5"}]},{"type":"formatted","text":" 还与别的节点相连，所以 "},{"type":"inline-math","tex":"5","children":[{"type":"formatted","text":"5"}]},{"type":"formatted","text":" 应该被扩展为 "},{"type":"inline-math","tex":"5 \\rightarrow ... \\rightarrow 5","children":[{"type":"formatted","text":"5 \\rightarrow ... \\rightarrow 5"}]},{"type":"formatted","text":"，所以又需要回退到节点 "},{"type":"inline-math","tex":"5","children":[{"type":"formatted","text":"5"}]},{"type":"formatted","text":" 开始寻找新的环"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0c2d48a4-ff60-4164-b0b7-0b2ecfb0377b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"最终我们找到了环 "},{"type":"inline-math","tex":"5 \\rightarrow 6 \\rightarrow 7 \\rightarrow 8 \\rightarrow 5","children":[{"type":"formatted","text":"5 \\rightarrow 6 \\rightarrow 7 \\rightarrow 8 \\rightarrow 5"}]},{"type":"formatted","text":"，将这个结果替换 "},{"type":"inline-math","tex":"2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 2","children":[{"type":"formatted","text":"2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 2"}]},{"type":"formatted","text":" 其中的 "},{"type":"inline-math","tex":"5","children":[{"type":"formatted","text":"5"}]},{"type":"formatted","text":"，得到 "},{"type":"inline-math","tex":"2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 6 \\rightarrow 7 \\rightarrow 8 \\rightarrow 5 \\rightarrow 2","children":[{"type":"formatted","text":"2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 6 \\rightarrow 7 \\rightarrow 8 \\rightarrow 5 \\rightarrow 2"}]},{"type":"formatted","text":"，最后将这个结果环替换  "},{"type":"inline-math","tex":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3 \\rightarrow 0","children":[{"type":"formatted","text":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 3 \\rightarrow 0"}]},{"type":"formatted","text":" 其中的 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":"，结果变为 "},{"type":"inline-math","tex":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 6 \\rightarrow 7 \\rightarrow 8 \\rightarrow 5 \\rightarrow 2 \\rightarrow 3 \\rightarrow 0","children":[{"type":"formatted","text":"0 \\rightarrow 1 \\rightarrow 2 \\rightarrow 4 \\rightarrow 5 \\rightarrow 6 \\rightarrow 7 \\rightarrow 8 \\rightarrow 5 \\rightarrow 2 \\rightarrow 3 \\rightarrow 0"}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以使用栈来模拟上面的回退动作，当我们遍历环时，将节点添加进栈 "},{"type":"formatted","text":"result","code":true},{"type":"formatted","text":" 中，当我们发现来到某个节点不能继续遍历并且还有边未被遍历时，我们便进行回退，从栈中弹出元素，直到栈顶节点还与其他节点相连，从该节点开始寻找新的环。我们会将从栈中弹出的节点添加到另一个栈 "},{"type":"formatted","text":"back","code":true},{"type":"formatted","text":" 中，当我们遍历完所有的边时在将 "},{"type":"formatted","text":"back","code":true},{"type":"formatted","text":" 这个栈中的节点依次弹入到 "},{"type":"formatted","text":"result","code":true},{"type":"formatted","text":" 这个栈中"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/105673883-a6af5500-5f21-11eb-8ebb-6308b66a5715_c9634d49-f073-404c-9006-c63ac5d73b07.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为上面有删边的动作，所以我们在 Graph 接口添加了一个 removeEdge(int v, int w)，作用就是将 v-w 这条边删除，具体实现如下"}]},{"type":"code-block","code":"@Override\npublic void removeEdge(int v, int w) {\n    validateVertex(v);\n    validateVertex(w);\n    sets[v].remove(w);\n    sets[w].remove(v);\n}","language":"java","uuid":"9e7f543e-a514-4f6c-abc7-f2dfbeb1e3ad","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Hierholzer 算法的实现如下"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Stack;\n\npublic class EulerCycle {\n    private Graph graph;\n\n    public EulerCycle(Graph graph) {\n        this.graph = graph;\n    }\n\n    public boolean hasEulerCycle() {\n\n        CCGraph ccGraph = new CCGraph(graph);\n        if (ccGraph.getCCcount() != 1) {\n            return false;\n        }\n\n        for (int i = 0; i < graph.V(); i++) {\n            if (graph.degree(i) % 2 != 0) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    public Iterable<Integer> result() {\n        ArrayList res = new ArrayList();\n        if (!hasEulerCycle()) return res;\n\n        // 剩余未被遍历的边数\n        int left = graph.E();\n        Stack<Integer> result = new Stack<>();\n        Stack<Integer> back = new Stack<>();\n\n        int curV = 0;\n        result.push(curV);\n        // 还有边未被遍历就继续遍历\n        while (left != 0) {\n            // 每次更新 curV 为栈顶节点\n            curV = result.peek();\n            // 如果栈顶元素有相邻节点，从此寻找新的环\n            if (graph.degree(curV) != 0) {\n                // 获得一个相邻节点\n                int w = graph.adj(curV).iterator().next();\n                result.push(w);\n                graph.removeEdge(curV, w);\n                left--;\n            } else {\n                // 没有相邻节点，进行回溯\n                back.push(result.pop());\n            }\n        }\n\n        // 将 back 栈中的数据依次弹出到 result\n        while (!back.isEmpty()) {\n            result.push(back.pop());\n        }\n\n        // 将栈中元素弹出到 list 中\n        while (!result.isEmpty()) {\n            res.add(result.pop());\n        }\n\n        Collections.reverse(res);\n        return res;\n    }\n}","language":"java","uuid":"6e52aba9-2d3d-47ca-820e-c9bb7e80fa6d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"验证算法是否正确，新建 g11.txt，内容如下"}]},{"type":"code-block","code":"9 11\n0 1\n0 3\n1 2\n2 3\n2 4\n2 5\n4 5\n5 6\n5 8\n6 7\n7 8","language":"java","uuid":"0ef33667-42f9-4799-a311-b56a859d561e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所表示的图就是示例中的图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b278dca6-a537-43ab-874f-8b17c966350c.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"测试如下"}]},{"type":"code-block","code":"public static void main(String[] args) {\n    Graph graph = new AdjSet(\"g11.txt\");\n    EulerCycle eulerCycle = new EulerCycle(graph);\n    for (int w: eulerCycle.result()) {\n        System.out.print(w + \" \");\n    }\n}","language":"java","uuid":"b2889670-c610-4161-b9f2-4f70739049b3","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"0 1 2 4 5 6 7 8 5 2 3 0 ","language":"java","uuid":"85e2a7ab-034f-44a9-981c-fe90f823dff7","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"与我们讨论的结果一致。"}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"欧拉回路","href":"/docs/document/1/41.html"}],"prevPage":{"title":"不同路径","href":"/docs/document/1/40.html"},"nextPage":{"title":"最小生成树","href":"/docs/document/1/42.html"},"createTime":1702087613168,"updateTime":1743303640550,"currentPath":"/docs/document/1/41.html"},"meta":{"type":"doc","publishTime":1764821904236}};
