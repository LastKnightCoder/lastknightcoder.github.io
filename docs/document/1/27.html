      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":27,"title":"联通分量","content":[{"type":"paragraph","children":[{"type":"formatted","text":"如何求解图中有多少个联通分量。其实这个问题非常的简单，在上面的我们修改 DFS 的小 bug 时就提到，因为有多个联通分量，我们无法遍历完所有图中的节点，所以我们修改了代码"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231335592022-04-23-13-36-00.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"每次当我们在 "},{"type":"formatted","text":"for","code":true},{"type":"formatted","text":" 循环中调用一次 "},{"type":"formatted","text":"dfs","code":true},{"type":"formatted","text":" 的时候，就说明存在一个联通分量(Connected Component)，所以我们只要在调用 "},{"type":"formatted","text":"dfs","code":true},{"type":"formatted","text":" 时统计联通分量的个数就可以，我们使用一个成员变量 "},{"type":"formatted","text":"ccount","code":true},{"type":"formatted","text":" 来保存联通分量的个数"}]},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class CCGraph {\n    private int cccount;\n    private Graph graph;\n    private boolean[] visited;\n\n    public CCGraph(Graph graph) {\n        this.graph = graph;\n        this.cccount = 0;\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n    }\n\n    public void dfs() {\n        for (int i = 0; i < visited.length; i++) {\n            if (!visited[i]) {\n                // 联通分量个数增加\n                cccount++;\n                dfs(i);\n            }\n        }\n    }\n\n    private void dfs(int v) {\n        visited[v] = true;\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w);\n            }\n        }\n    }\n\n    public int getCccount() {\n        return cccount;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g.txt\");\n        CCGraph ccGraph = new CCGraph(graph);\n        ccGraph.dfs();\n        int cccount = ccGraph.getCccount();\n        System.out.println(cccount); // 2\n    }\n}","language":"java","uuid":"3a9f54cf-fd54-428a-94bf-fb83fc6fa32d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的代码与 "},{"type":"formatted","text":"DFSGraph","code":true},{"type":"formatted","text":" 类的代码几乎是一致的，只不过统计了联通分量的个数。g.txt 中的内容为："}]},{"type":"code-block","code":"7 6\n0 1\n0 2\n1 3\n2 5\n2 4\n4 5","language":"java","uuid":"615ac7f8-2863-44d4-a5ea-3f059424e203","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于的图的形状如下："}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/GraphBasis-第 6 页.drawio2022-04-23-13-41-32.svg","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可见上面的图有两个联通分量。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二个与联通分量有关的问题是，我们希望得到每个联通分量中有多少个节点，以及分别包含哪些节点，我们可以使用一个 "},{"type":"formatted","text":"ArrayList","code":true},{"type":"formatted","text":" 数组保存每个联通分量包含的节点，修改 "},{"type":"formatted","text":"dfs","code":true},{"type":"formatted","text":" 如下"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\n\n@SuppressWarnings(\"all\")\npublic class CCGraph {\n    private int cccount;\n    private Graph graph;\n    private boolean[] visited;\n    // 为什么不使用数组? 因为数组需要事先开辟空间，而我们事先不知道有多少个联通分量\n    private ArrayList<ArrayList<Integer>> lists;\n\n    // 构造函数对成员变量进行初始化\n    public CCGraph(Graph graph) {\n        this.graph = graph;\n        this.cccount = 0;\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n        lists = new ArrayList<>();\n    }\n\n    public void dfs() {\n        for (int i = 0; i < visited.length; i++) {\n            if (!visited[i]) {\n                cccount++;\n                // 每增加一个联通分量，新建一个 list 来保存该联通分量中包含的节点\n                ArrayList<Integer> list = new ArrayList<>();\n                lists.add(list);\n                dfs(i, list);\n            }\n        }\n    }\n\n    private void dfs(int v, ArrayList<Integer> list) {\n        visited[v] = true;\n        // 将节点保存在所在联通分量对应的 list 中\n        list.add(v);\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w, list);\n            }\n        }\n    }\n\n    public int getCCcount() {\n        return cccount;\n    }\n\n    public ArrayList<ArrayList<Integer>> getCCList() {\n        return lists;\n    }\n    \n    // 判断两个节点是否在同一个联通分量中(是否连接)\n    public boolean isConnected(int v, int w) {\n        for (int i = 0; i < cccount; i++) {\n            ArrayList list = lists.get(i);\n            // 某联通分量中是否同时包含这两个节点\n            if (list.contains(v) && list.contains(w)) {\n                return true;\n            }\n        }\n        // 所有的联通分量都不同时包含这两个节点，说明这两个节点不在同一个联通分量中\n        return false;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g.txt\");\n        CCGraph ccGraph = new CCGraph(graph);\n        ccGraph.dfs();\n        int cccount = ccGraph.getCCcount();\n        System.out.println(cccount); // 2\n\n        // 打印出联通分量\n        ArrayList<ArrayList<Integer>> lists = ccGraph.getCCList();\n        for (int i = 0; i < cccount; i++) {\n            // 获得每个联通分量对应的 list，里面保存了该联通分量包含的节点\n            ArrayList<Integer> list = lists.get(i);\n            // 打印出联通分量中包含的节点\n            System.out.print(i + \": \");\n            for (int v: list) {\n                System.out.print(v + \" \");\n            }\n            System.out.println();\n        }\n        \n        System.out.println(ccGraph.isConnected(0, 5)); // true\n        System.out.println(ccGraph.isConnected(0, 6)); // false\n    }\n}","language":"java","uuid":"0cb14b19-c08c-451f-b8d8-069c51d276c8","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上述的打印结果为"}]},{"type":"code-block","code":"2\n0: 0 1 3 2 4 5 \n1: 6 \ntrue\nfalse","language":"java","uuid":"6cdd2fc0-39ff-484a-94cc-b59686251014","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"深度优先遍历","href":"/docs/document/1/10.html"},{"label":"联通分量","href":"/docs/document/1/27.html"}],"prevPage":{"title":"深度优先遍历","href":"/docs/document/1/10.html"},"nextPage":{"title":"路径问题","href":"/docs/document/1/28.html"},"createTime":1701947681862,"updateTime":1743303640548,"currentPath":"/docs/document/1/27.html"},"meta":{"type":"doc","publishTime":1764821904234}};
