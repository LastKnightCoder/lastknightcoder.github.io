      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":28,"title":"路径问题","content":[{"type":"paragraph","children":[{"type":"formatted","text":"所谓的路径问题就是求两个节点之间是否有路径，这个问题很简单，直接使用我们上面的 "},{"type":"formatted","text":"isConnected","code":true},{"type":"formatted","text":" 方法就可以知道两个节点之间是否有路径了。不过我们更想知道的是，两个节点之间的路径是什么，即一个节点到达另一个节点会经历哪些节点。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于下面的一幅图，我们想知道从节点 0 到节点 5 之间的路径"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/GraphBasis-第 6 页.drawio2022-04-23-13-41-32.svg","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们需要记录遍历时当前节点的前一个节点，例如遍历节点 1 后会接着遍历节点 3，那么节点 3 的前一个节点就是 1，通过这些信息就可以知道两个节点之间具体的路径。首先使用 DFS 图，在遍历的过程中记录信息，如下"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010230021482022-04-23-13-43-03.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面我们从节点 0 开始遍历，在遍历的过程中我们记录了当前节点之前的节点，最后得到这么一个结果"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231343242022-04-23-13-43-24.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们想知道节点 0 是如何到达节点 5 的，直接逆推就可以知道路径为 "},{"type":"inline-math","tex":"5 \\leftarrow 4 \\leftarrow 2 \\leftarrow 0","children":[{"type":"formatted","text":"5 \\leftarrow 4 \\leftarrow 2 \\leftarrow 0"}]},{"type":"formatted","text":"，如下"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010230028062022-04-23-13-43-54.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个算法可以求得节点 0 与任何一个节点之间的路径，但是不能求得任意两点之间的路径，因为我们是从节点 0 开始遍历的，如果我们想求得节点 4 与节点 5 之间的路径，那么我们需要从节点 4 开始遍历，所以我们这种算法只能求解单源路径(Single Source Path) 问题。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在编程实现方面，我们使用一个 "},{"type":"formatted","text":"pre","code":true},{"type":"formatted","text":" 数组来保存当前节点的前一个节点，例如，"},{"type":"formatted","text":"pre[3] = 1","code":true},{"type":"formatted","text":" 就表示节点 3 的前一个节点是节点 1"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.Collections;\n\npublic class SingleSourcePath {\n    private Graph graph;\n    private boolean[] visited;\n    private int[] pre;\n    // 从节点 s 开始遍历\n    private int s;\n\n    public SingleSourcePath(Graph graph, int s) {\n        this.graph = graph;\n        this.s = s;\n\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n\n        pre = new int[graph.V()];\n        Arrays.fill(pre, -1);\n\n        // 默认认为源的前一个节点为自己，这个值访问不到，可以是任何值\n        dfs(s, s);\n    }\n\n    private void dfs(int v, int parent) {\n        visited[v] = true;\n        pre[v] = parent;\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w, v);\n            }\n        }\n    }\n\n    public boolean isConnected(int t) {\n        // 如果 pre[t] != -1，说明遍历到了该节点，则该节点与源节点是联通的\n        return pre[t] != -1;\n    }\n\n    public Iterable<Integer> path(int t) {\n        ArrayList<Integer> path = new ArrayList<>();\n        // 如果不是联通的，直接返回\n        if (!isConnected(t)) return path;\n\n        int cur = t;\n        while (cur != s) {\n            path.add(cur);\n            cur = pre[cur];\n        }\n        path.add(s);\n\n        Collections.reverse(path);\n        return path;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g.txt\");\n        SingleSourcePath singleSourcePath = new SingleSourcePath(graph, 0);\n        System.out.println(singleSourcePath.path(5));\n    }\n}","language":"java","uuid":"50308e77-c8cc-443f-a3bd-3bc960e4877f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 g.txt 为"}]},{"type":"code-block","code":"7 6\n0 1\n0 2\n1 3\n2 5\n2 4\n4 5","language":"java","uuid":"ff176deb-2635-4880-98f1-9626e39adb6b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对应的图就是上面的动图，输出为"}]},{"type":"code-block","code":"[0, 2, 4, 5]","language":"java","uuid":"3b348c73-9d7d-43b0-a4b4-14a68a0b9f69","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"假设现在我们只想求源点 "},{"type":"inline-math","tex":"s","children":[{"type":"formatted","text":"s"}]},{"type":"formatted","text":" 到点 "},{"type":"inline-math","tex":"t","children":[{"type":"formatted","text":"t"}]},{"type":"formatted","text":" 之间的路径，而不是 "},{"type":"inline-math","tex":"s","children":[{"type":"formatted","text":"s"}]},{"type":"formatted","text":" 到任意一个点的路径，很明显我们的要求降低了，这意味着我们记录的信息更少，那我们算法可不可以加快呢?"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当然可以，在上面我们求解源点 "},{"type":"inline-math","tex":"s","children":[{"type":"formatted","text":"s"}]},{"type":"formatted","text":" 到任意一点的路径，所以需要对源点 "},{"type":"inline-math","tex":"s","children":[{"type":"formatted","text":"s"}]},{"type":"formatted","text":" 所在的联通分量做 DFS，需要遍历联通分量中所有的节点，但是现在我们只需要求解到固定点 "},{"type":"inline-math","tex":"t","children":[{"type":"formatted","text":"t"}]},{"type":"formatted","text":" 的路径，我们不需要完整的做一遍 DFS，当我们遍历到节点 "},{"type":"inline-math","tex":"t","children":[{"type":"formatted","text":"t"}]},{"type":"formatted","text":" 时，就已经可以退出遍历了，提前终止遍历可以获得更快的性能。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"假设我们需要求解源点 0 到节点 1 的路径"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010231036452022-04-23-13-45-50.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在编码上，在我们在设计 "},{"type":"formatted","text":"dfs","code":true},{"type":"formatted","text":" 函数时，我们需要返回一个布尔值，代表是否已经找到节点 "},{"type":"inline-math","tex":"t","children":[{"type":"formatted","text":"t"}]},{"type":"formatted","text":"，如果已经找到，我们就不需要做后续的遍历了，直接终止遍历"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.Collections;\n\npublic class Path {\n    private Graph graph;\n    private boolean[] visited;\n    private int[] pre;\n\n    private int s;\n    private int t;\n\n    public Path(Graph graph, int s, int t) {\n        this.graph = graph;\n        this.s = s;\n        this.t = t;\n\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n\n        pre = new int[graph.V()];\n        Arrays.fill(pre, -1);\n\n        dfs(s, s);\n    }\n\n    private boolean dfs(int v, int parent) {\n        visited[v] = true;\n        pre[v] = parent;\n        // 如果已经找到，直接返回，不再继续遍历\n        if (v == t) {\n            return true;\n        }\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                // 如果在某相邻节点的深度优先遍历中找到节点 t，不再继续遍历其他相邻节点，提前返回\n                if (dfs(w, v)) {\n                    return true;\n                }\n            }\n        }\n\n        return false;\n    }\n\n    public boolean isConnected() {\n        return visited[t];\n    }\n\n    public Iterable<Integer> path() {\n        ArrayList<Integer> path = new ArrayList<>();\n        if (!isConnected()) {\n            return path;\n        }\n\n        int cur = t;\n        while (cur != s) {\n            path.add(cur);\n            cur = pre[cur];\n        }\n        path.add(s);\n\n        Collections.reverse(path);\n        return path;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g.txt\");\n        Path path = new Path(graph, 0, 3);\n        \n        System.out.println(Arrays.toString(path.visited));\n        System.out.println(path.path());\n    }\n}","language":"java","uuid":"5f183974-e01d-4f15-8e30-ed7f60f746af","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"输出为"}]},{"type":"code-block","code":"[true, true, false, true, false, false, false]\n[0, 1, 3]","language":"java","uuid":"6bc427bf-b93b-435a-b095-a222b543004f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从打印结果可以看出，我们并没有遍历所有的节点，这样提前终止遍历可以提高查找的速度。"}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"深度优先遍历","href":"/docs/document/1/10.html"},{"label":"路径问题","href":"/docs/document/1/28.html"}],"prevPage":{"title":"联通分量","href":"/docs/document/1/27.html"},"nextPage":{"title":"无向图的环检测","href":"/docs/document/1/29.html"},"createTime":1701959129652,"updateTime":1743303640548,"currentPath":"/docs/document/1/28.html"},"meta":{"type":"doc","publishTime":1764775995436}};
