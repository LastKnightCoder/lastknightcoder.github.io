document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":22,"title":"AVL 树","content":[{"type":"header","children":[{"type":"formatted","text":"概念"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们在研究二分搜索树时发现，如果我们将数据顺序添加进树中时，它有可能会退化成一个链表，即所有的元素都添加到一个孩子上，这样树结构的优势就体现不出来，为了不使左右孩子的高度相差太大，我们需要对树进行调整，使树达到平衡，成为一棵平衡二叉树，AVL 就是一种经典的平衡二叉树"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231251392022-04-23-12-51-40.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在 AVL 中，我们定义的平衡二叉树为：对于任意一个节点，左子树和右子树的高度相差不能超过 1。"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231252062022-04-23-12-52-06.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"实现"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们为每一个节点标注好高度值，计算方法为取左右子树高度较高的高度，然后 +1"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231252282022-04-23-12-52-28.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后我们还有记录节点左右子树的高度差，我们称之为平衡因子(规定用左子树的高度-右子树的高度)"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231252422022-04-23-12-52-43.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于我们只是在添加元素和删除元素时对树进行调整，其余的代码同二分搜索树是相同的，所以就不贴出所有的代码，只给出不同的代码，首先我们需要在 Node 类中添加一个 height 变量来记录高度"}]},{"type":"code-block","code":"private class Node {\n    public E e;\n    public Node left;\n    public Node right;\n    //高度\n    public int height;\n    public Node(E e) {\n        this.e = e;\n        left = null;\n        right = null;\n        //高度初始为1\n        height = 1;\n    }\n    @Override\n    public String toString() {\n        return e.toString();\n    }\n}","language":"java","uuid":"0855b743-828c-4242-a773-3eba746fcae4","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"新增加一个获得某节点高度的函数和平衡因子的函数"}]},{"type":"code-block","code":"private int getHeight(Node node) {\n    if (node == null) {\n        return 0;\n    }\n    return node.height;\n}\nprivate int getBalanceFactor(Node node) {\n    if (node == null) {\n        return 0;\n    }\n    \n    return getHeight(node.left) - getHeight(node.right);\n}","language":"java","uuid":"22b0580f-6dad-4460-ab12-88be45b1be86","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有了这些因素，我们一般需要在添加元素时进行维护，重新计算高度和平衡因子，从而进行调整"}]},{"type":"code-block","code":"private Node add(Node node, E e) {\n    if (node == null) {\n        size++;\n        return new Node(e);\n    }\n    if (e.compareTo(node.e) < 0) {\n        node.left = add(node.left, e);\n    } else if (e.compareTo(node.e) > 0) {\n        node.right = add(node.right,e);\n    }\n    \n    //更新高度\n    node.height = Math.max(getHeight(node.left),getHeight(node.right)) + 1;\n    //计算平衡因子\n    int balanceFactor = getBalanceFactor(node);\n    if (Math.abs(balanceFactor) > 1) {\n        //进行调整\n    }\n    return node;\n}","language":"java","uuid":"2da39de4-5e8e-435e-b1a3-323e56ddf8f9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们后面的内容主要是如何调整，后面所以只给出如何调整的代码，在学如何调整之前，我们来写两个辅助函数来判断这棵树是不是二分搜索树和 AVL 树，因为如果我们的代码有问题的话，有可能破坏二分搜索树的性质，这样有利于我们检查，那怎么检查一棵树是不是二分搜索树，我们根据二分搜索树的性质，它的中序遍历的结果是从小到大的特性，我们重写中序遍历为"}]},{"type":"code-block","code":"public boolean isBST() {\n    ArrayList<E> arrayList = new ArrayList<>();\n    inOrder(root, arrayList);\n    \n    for (int i = 1; i < arrayList.size(); i++) {\n        if (arrayList.get(i-1).compareTo(arrayList.get(i)) > 0) \n            return false;\n        }\n    }\n    return true;\n}\nprivate void inOrder(Node node, ArrayList<E> arrayList) {\n    if (node == null) {\n        return;\n    }\n    \n    inOrder(node.left, arrayList);\n    arrayList.add(node.e);\n    inOrder(node.right, arrayList);\n}","language":"java","uuid":"a6be2e81-387f-42d0-bb8e-87fb70a27d6b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们判断这棵树是不是平衡二叉树"}]},{"type":"code-block","code":"public boolean isBalanced() {\n    return isBalanced(root);\n}\n//判断某个节点是不是平衡\nprivate boolean isBalanced(Node node) {\n    if (node == null) {\n        return true;\n    }\n    int balanceFactor = getBalanceFactor(node);\n    if (Math.abs(balanceFactor) > 1) {\n        return false;\n    }\n    return isBalanced(node.left) && isBalanced(node.right);\n}","language":"java","uuid":"9fde5aa9-7244-4940-abc0-1e076e9a9d4d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面对不平衡的四种情形进行讨论，并给出调整方法"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231253082022-04-23-12-53-09.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"// 对节点y进行向右旋转操作，返回旋转后新的根节点x\n//        y                              x\n//       / \\                           /   \\\n//      x   T4     向右旋转 (y)        z     y\n//     / \\       - - - - - - - ->    / \\   / \\\n//    z   T3                       T1  T2 T3 T4\n//   / \\\n// T1   T2\nprivate Node rightRotate(Node y) {\n    Node x = y.left;\n    Node T3 = x.right;\n    x.right = y;\n    y.left = T3;\n    \n    //更新x和y的高度值 先更新y的，因为y是x的右孩子，x的更新取决于y\n    y.height = Math.max(getHeight(y.left), getHeight(y.right)) + 1;\n    x.height = Math.max(getHeight(x.left), getHeight(x.right)) + 1;\n    \n    return x;\n}\n// 对节点y进行向左旋转操作，返回旋转后新的根节点x\n//    y                             x\n//  /  \\                          /   \\\n// T4   x      向左旋转 (y)       y     z\n//     / \\   - - - - - - - ->   / \\   / \\\n//   T3  z                     T4 T3 T1 T2\n//      / \\\n//     T1 T2\nprivate Node leftRotate(Node y) {\n    Node x = y.right;\n    Node T3 = x.left;\n    x.left = y;\n    y.right = T3;\n    \n    y.height = Math.max(getHeight(y.left), getHeight(y.right)) + 1;\n    x.height = Math.max(getHeight(x.left), getHeight(x.right)) + 1;\n    \n    return x;\n}\n\npublic void add(E e) {\n    root = add(root, e);\n}\nprivate Node add(Node node, E e) {\n    if (node == null) {\n        size++;\n        return new Node(e);\n    }\n    if (e.compareTo(node.e) < 0) {\n        node.left = add(node.left, e);\n    } else if (e.compareTo(node.e) > 0) {\n        node.right = add(node.right,e);\n    }\n    //更新高度\n    node.height = Math.max(getHeight(node.left),getHeight(node.right)) + 1;\n    //计算平衡因子\n    int balanceFactor = getBalanceFactor(node);\n    //调整\n    if (balanceFactor > 1 && getBalanceFactor(node.left) >= 0) {\n        return rightRotate(node);\n    }\n    if (balanceFactor < -1 && getBalanceFactor(node.right) <= 0) {\n        return leftRotate(node);\n    }\n    if (balanceFactor > 1 && getBalanceFactor(node.left) < 0) {\n        node.left = leftRotate(node.left);\n        return rightRotate(node);\n    }\n    if (balanceFactor < -1 && getBalanceFactor(node.right) > 0) {\n        node.right = rightRotate(node.right);\n        return leftRotate(node);\n    }\n    return node;\n}\npublic void remove(E e) {\n    root = remove(root, e);\n}\nprivate Node remove(Node node, E e) {\n    if (node == null) {\n        return null;\n    }\n    Node retNode;\n    if (e.equals(node.e)) {\n        if (node.right == null) {\n            Node leftNode = node.left;\n            node.left = null;\n            size--;\n            retNode = leftNode;\n        } else if (node.left == null) {\n            Node rightNode = node.right;\n            node.right = null;\n            size--;\n            retNode = rightNode;\n        } else {\n            Node successor = minimum(node.right);\n            // 由于removeMin没有维持balance，所以我们复用remove\n            successor.right = remove(node.right,successor.e);\n            successor.left = node.left;\n            node.left = node.right = null;\n            \n            retNode = successor;\n        }\n    } else if (e.compareTo(node.e) < 0) {\n        node.left = remove(node.left, e);\n        retNode = node;\n    } else {\n        node.right = remove(node.right, e);\n        retNode = node;\n    }\n    \n    //否则retNode.height会有空指针异常\n    if (retNode == null) {\n        return null;\n    }\n    \n    //更新高度\n    retNode.height = Math.max(getHeight(retNode.left),getHeight(retNode.right)) + 1;\n    //计算平衡因子\n    int balanceFactor = getBalanceFactor(retNode);\n    if (balanceFactor > 1 && getBalanceFactor(retNode.left) >= 0) {\n        return rightRotate(retNode);\n    }\n    if (balanceFactor < -1 && getBalanceFactor(retNode.right) <= 0) {\n        return leftRotate(retNode);\n    }\n    if (balanceFactor > 1 && getBalanceFactor(retNode.left) < 0) {\n        retNode.left = leftRotate(retNode.left);\n        return rightRotate(retNode);\n    }\n    if (balanceFactor < -1 && getBalanceFactor(retNode.right) > 0) {\n        retNode.right = rightRotate(retNode.right);\n        return leftRotate(retNode);\n    }\n    return retNode;\n}","language":"java","uuid":"d9ab621e-743d-4969-b44d-047e5b5be591","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"完整代码"}],"level":2},{"type":"code-block","code":"import java.util.ArrayList;\n\npublic class AVLTree<E extends Comparable<E>> {\n    private class Node {\n        public E e;\n        public Node left;\n        public Node right;\n        public int height;\n\n        public Node(E e) {\n            this.e = e;\n            left = null;\n            right = null;\n            height = 1;\n        }\n\n        @Override\n        public String toString() {\n            return e.toString();\n        }\n    }\n\n    //根节点\n    private Node root;\n    //树中元素的个数\n    private int size;\n\n    public AVLTree() {\n        root = null;\n        size = 0;\n    }\n\n    public int size() {\n        return size;\n    }\n    public boolean isEmpty() {\n        return size == 0;\n    }\n    private int getHeight(Node node) {\n        if (node == null) {\n            return 0;\n        }\n\n        return node.height;\n    }\n\n    private int getBalanceFactor(Node node) {\n        if (node == null) {\n            return 0;\n        }\n\n        return getHeight(node.left) - getHeight(node.right);\n    }\n\n    public boolean isBST() {\n        ArrayList<E> arrayList = new ArrayList<>();\n        inOrder(root, arrayList);\n\n        for (int i = 1; i < arrayList.size(); i++) {\n            if (arrayList.get(i-1).compareTo(arrayList.get(i)) > 0) {\n                return false;\n            }\n        }\n        return true;\n    }\n    private void inOrder(Node node, ArrayList<E> arrayList) {\n        if (node == null) {\n            return;\n        }\n\n        inOrder(node.left, arrayList);\n        arrayList.add(node.e);\n        inOrder(node.right, arrayList);\n    }\n\n    public boolean isBalanced() {\n        return isBalanced(root);\n    }\n    //判断某个节点是不是平衡\n    private boolean isBalanced(Node node) {\n        if (node == null) {\n            return true;\n        }\n        int balanceFactor = getBalanceFactor(node);\n        if (Math.abs(balanceFactor) > 1) {\n            return false;\n        }\n        return isBalanced(node.left) && isBalanced(node.right);\n    }\n\n    private Node rightRotate(Node y) {\n        Node x = y.left;\n        Node T3 = x.right;\n        x.right = y;\n        y.left = T3;\n\n        //更新x和y的高度值 先更新y的，因为y是x的右孩子，x的更新取决于y\n        y.height = Math.max(getHeight(y.left), getHeight(y.right)) + 1;\n        x.height = Math.max(getHeight(x.left), getHeight(x.right)) + 1;\n\n        return x;\n    }\n\n    private Node leftRotate(Node y) {\n        Node x = y.right;\n        Node T3 = x.left;\n        x.left = y;\n        y.right = T3;\n\n        y.height = Math.max(getHeight(y.left), getHeight(y.right)) + 1;\n        x.height = Math.max(getHeight(x.left), getHeight(x.right)) + 1;\n\n        return x;\n    }\n\n    public void add(E e) {\n        root = add(root, e);\n    }\n\n\n    private Node add(Node node, E e) {\n        if (node == null) {\n            size++;\n            return new Node(e);\n        }\n\n        if (e.compareTo(node.e) < 0) {\n            node.left = add(node.left, e);\n        } else if (e.compareTo(node.e) > 0) {\n            node.right = add(node.right,e);\n        }\n\n        //更新高度\n        node.height = Math.max(getHeight(node.left),getHeight(node.right)) + 1;\n        //计算平衡因子\n        int balanceFactor = getBalanceFactor(node);\n\n        if (balanceFactor > 1 && getBalanceFactor(node.left) >= 0) {\n            return rightRotate(node);\n        }\n        if (balanceFactor < -1 && getBalanceFactor(node.right) <= 0) {\n            return leftRotate(node);\n        }\n        if (balanceFactor > 1 && getBalanceFactor(node.left) < 0) {\n            node.left = leftRotate(node.left);\n            return rightRotate(node);\n        }\n        if (balanceFactor < -1 && getBalanceFactor(node.right) > 0) {\n            node.right = rightRotate(node.right);\n            return leftRotate(node);\n        }\n\n        return node;\n    }\n\n    public boolean contains(E e) {\n        return contains(root, e);\n    }\n\n    private boolean contains(Node node, E e) {\n        if (node == null) {\n            return false;\n        }\n\n        if (e.equals(node.e)) {\n            return true;\n        } else if (e.compareTo(node.e) < 0) {\n            return contains(node.left, e);\n        } else {\n            return contains(node.right,e);\n        }\n    }\n\n    public E minimum() {\n        if (size == 0) {\n            throw new IllegalArgumentException(\"树为空\");\n        }\n        return minimum(root).e;\n    }\n\n    private Node minimum(Node node) {\n        if (node.left == null) {\n            return node;\n        }\n        return minimum(node.left);\n    }\n\n    public void remove(E e) {\n        root = remove(root, e);\n    }\n    private Node remove(Node node, E e) {\n        if (node == null) {\n            return null;\n        }\n        Node retNode;\n        if (e.equals(node.e)) {\n            if (node.right == null) {\n                Node leftNode = node.left;\n                node.left = null;\n                size--;\n                retNode = leftNode;\n            } else if (node.left == null) {\n                Node rightNode = node.right;\n                node.right = null;\n                size--;\n                retNode = rightNode;\n            } else {\n                Node successor = minimum(node.right);\n                successor.right = remove(node.right,successor.e);//由于removeMin没有维持balance，所以我们用remove\n                successor.left = node.left;\n                node.left = node.right = null;\n                //size--; 在removeMin中已经维护size了\n                retNode = successor;\n            }\n        } else if (e.compareTo(node.e) < 0) {\n            node.left = remove(node.left, e);\n            retNode = node;\n        } else {\n            node.right = remove(node.right, e);\n            retNode = node;\n        }\n\n        //否则retNode.height会有空指针异常\n        if (retNode == null) {\n            return null;\n        }\n\n        //更新高度\n        retNode.height = Math.max(getHeight(retNode.left),getHeight(retNode.right)) + 1;\n        //计算平衡因子\n        int balanceFactor = getBalanceFactor(retNode);\n        if (balanceFactor > 1 && getBalanceFactor(retNode.left) >= 0) {\n            return rightRotate(retNode);\n        }\n        if (balanceFactor < -1 && getBalanceFactor(retNode.right) <= 0) {\n            return leftRotate(retNode);\n        }\n        if (balanceFactor > 1 && getBalanceFactor(retNode.left) < 0) {\n            retNode.left = leftRotate(retNode.left);\n            return rightRotate(retNode);\n        }\n        if (balanceFactor < -1 && getBalanceFactor(retNode.right) > 0) {\n            retNode.right = rightRotate(retNode.right);\n            return leftRotate(retNode);\n        }\n        return retNode;\n    }\n}","language":"java","uuid":"6d6e27c0-5474-45f4-9db1-a4912e278aae","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"AVL 树","href":"/docs/document/1/22.html"}],"prevPage":{"title":"并查集","href":"/docs/document/1/21.html"},"nextPage":{"title":"红黑树","href":"/docs/document/1/23.html"},"createTime":1701906458018,"updateTime":1743303640547,"currentPath":"/docs/document/1/22.html"},"meta":{"type":"doc","publishTime":1764810804407}};
