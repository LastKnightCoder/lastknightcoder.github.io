document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":17,"title":"优先队列和堆","content":[{"type":"paragraph","children":[{"type":"formatted","text":"普通队列：先进先出，就像是我们在银行办业务或者是在超市买东西，但是考虑在医院，有病人有突发情况，这个时候容不得他去排队挂号了，这时他的优先级是比较高的，所以他需要得到优先的处理，像这种队列中的元素具有优先级的队列，我们把它称之为优先队列。在游戏中我们也会设置优先攻击血量最低的怪或者距离最近的怪，这时候血量和距离就成为了判断优先级的标准；在操作系统的任务调度，我们为程序分配 CPU，内存等等资源，并不是先到先得的，也是根据程序的优先级来进行分配的。"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231231282022-04-23-12-31-28.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"堆的结构"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"这里的堆指的是二叉堆，它满足以下的性质"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"二叉堆是一棵完全二叉树"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231231572022-04-23-12-31-57.png","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"堆中某个节点的值总是不大于其父亲节点的值(最大堆，相应也可以定义最小堆)"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231233092022-04-23-12-33-09.png","children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们使用数组去实现堆"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231233352022-04-23-12-33-36.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面的序号表示的是在数组中的下标，我们发现如果父节点的下标为 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":"，那么左孩子的下标就为 "},{"type":"formatted","text":"2i + 1","code":true},{"type":"formatted","text":"，右孩子的下标为 "},{"type":"formatted","text":"2i + 2","code":true},{"type":"formatted","text":"，所以可以很快的根据父节点的下标得到左右孩子的下标，如果知道左右孩子的下标 i，那么 "},{"type":"formatted","text":"(i - 1)/2","code":true},{"type":"formatted","text":" 就可以得到父节点的下标(整数除法，小数部分会被舍去)。这个结论可以使用数学归纳法进行证明，但不是这里的重点，所以不多做阐述。"}]},{"type":"code-block","code":"public class MaxHeap<E extends Comparable<E>> {\n    private Array<E> data;\n\n    public MaxHeap(int capacity) {\n        data = new Array<>(capacity);\n    }\n    public MaxHeap() {\n        data = new Array<>();\n    }\n\n    public int size() {\n        return data.getSize();\n    }\n    public boolean isEmpty() {\n        return data.isEmpty();\n    }\n    \n    //根据左右孩子的下标获得父亲节点的下标\n    private int parent(int index) {\n        return (index - 1) / 2;\n    }\n    //根据父节点的下标获得左孩子的下标\n    private int leftChild(int index) {\n        return 2 * index + 1;\n    }\n    //根据父节点的下标获得右孩子的下标\n    private int rightChild(int index) {\n        return 2 * index + 2;\n    }\n}","language":"java","uuid":"84c19181-686d-4245-a95f-b79e494458b8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"堆的实现"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"向堆中添加元素"}],"level":3},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231234302022-04-23-12-34-31.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public void swap(int i, int j) {\n    if (i < 0 || i >= size() || j < 0 || j >= size()) {\n        throw new IllegalArgumentException(\"参数错误\");\n    }\n    E temp = data.get(i);\n    data.set(i, data.get(j));\n    data.set(j, temp);\n}\npublic void add(E e) {\n    data.addLast(e);\n    siftUp(data.getSize() - 1);\n}\nprivate void siftUp(int index) {\n    //index不是根节点(根节点不要上浮了) 并且孩子比父亲大\n    while (index != 0 && data.get(index).compareTo(data.get(parent(index))) > 0) {\n        swap(index, parent(index));\n        index = parent(index);\n    }\n}","language":"java","uuid":"5d690660-42a4-4c9f-905e-68f63d3515a5","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"向堆中取出最大元素"}],"level":3},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231235252022-04-23-12-35-25.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public E findMax() {\n    if (isEmpty()) {\n        throw new IllegalArgumentException(\"堆为空\");\n    }\n    return data.get(0);\n}\npublic E extractMax() {\n    E ret = findMax();\n    swap(0,data.getSize() - 1);\n    data.removeLast();\n    siftDown(0);\n    return ret;\n}\nprivate void siftDown(int index) {\n    //没有孩子时，下沉结束\n    while (leftChild(index) < size()) {\n        int max = leftChild(index);\n        int rightIndex = rightChild(index);\n        if (rightIndex < size()) {\n            max = data.get(max).compareTo(data.get(rightIndex)) > 0 ? max : rightIndex;\n        }\n        //最大孩子比父节点小时，下沉结束\n        if (data.get(max).compareTo(data.get(index)) <= 0) {\n            break;\n        }\n        swap(max,index);\n        index = max;\n    }\n}","language":"java","uuid":"e6ae5d0f-9fad-4f77-9cba-ffe7e33a5330","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"replace"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"replace","code":true},{"type":"formatted","text":" 操作指的是从堆中取出元素，并向堆中添加一个元素，实现的方法为"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231235542022-04-23-12-35-54.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//取出堆中的最大元素，并添加一个新元素e\npublic E replace(E e) {\n    E ret = findMax();\n    data.set(0,e);\n    siftDown(0);\n    return ret;\n}","language":"java","uuid":"b5729177-28f3-4b58-bee4-0d7cdfa4c97a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"heapify"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"heapify","code":true},{"type":"formatted","text":" 是指将任意一个数组整理成堆的形状，"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231236202022-04-23-12-36-21.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们把这个方法做成一个构造函数"}]},{"type":"code-block","code":"public MaxHeap(E[] arr) {\n    data = new Array<>(arr.length);\n    for (int i = 0; i < arr.length; i++) {\n        data.addLast(arr[i]);\n    }\n    for (int i = parent(data.getSize() -1); i >=0; i--) {\n        siftDown(i);\n    }\n}","language":"java","uuid":"191a4865-ce63-4291-98dc-ee7990ff7db9","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"完整代码"}],"level":3},{"type":"code-block","code":"public class MaxHeap<E extends Comparable<E>> {\n    private Array<E> data;\n\n    public MaxHeap(int capacity) {\n        data = new Array<>(capacity);\n    }\n    public MaxHeap() {\n        data = new Array<>();\n    }\n    public MaxHeap(E[] arr) {\n        data = new Array<>(arr.length);\n        for (int i = 0; i < arr.length; i++) {\n            data.addLast(arr[i]);\n        }\n\n        for (int i = parent(data.getSize() -1); i >=0; i--) {\n            siftDown(i);\n        }\n    }\n\n    public int size() {\n        return data.getSize();\n    }\n    public boolean isEmpty() {\n        return data.isEmpty();\n    }\n\n    //根据左右孩子的下标获得父亲节点的下标\n    private int parent(int index) {\n        return (index - 1) / 2;\n    }\n    //根据父节点的下标获得左孩子的下标\n    private int leftChild(int index) {\n        return 2 * index + 1;\n    }\n    //根据父节点的下标获得右孩子的下标\n    private int rightChild(int index) {\n        return 2 * index + 2;\n    }\n\n    public void swap(int i, int j) {\n        if (i < 0 || i >= size() || j < 0 || j >= size()) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        E temp = data.get(i);\n        data.set(i, data.get(j));\n        data.set(j, temp);\n    }\n\n    public void add(E e) {\n        data.addLast(e);\n        siftUp(data.getSize() - 1);\n    }\n    private void siftUp(int index) {\n        //index不是根节点(根节点不要上浮了) 并且孩子比父亲大\n        while (index != 0 && data.get(index).compareTo(data.get(parent(index))) > 0) {\n            swap(index, parent(index));\n            index = parent(index);\n        }\n    }\n    public E findMax() {\n        if (isEmpty()) {\n            throw new IllegalArgumentException(\"堆为空\");\n        }\n\n        return data.get(0);\n    }\n\n    public E extractMax() {\n        E ret = findMax();\n        swap(0,data.getSize() - 1);\n        data.removeLast();\n        siftDown(0);\n        return ret;\n    }\n\n    private void siftDown(int index) {\n        //没有孩子时，下沉结束\n        while (leftChild(index) < size()) {\n            int max = leftChild(index);\n            int rightIndex = rightChild(index);\n            if (rightIndex < size()) {\n                max = data.get(max).compareTo(data.get(rightIndex)) > 0 ? max : rightIndex;\n            }\n            //最大孩子比父节点小时，下沉结束\n            if (data.get(max).compareTo(data.get(index)) <= 0) {\n                break;\n            }\n            swap(max,index);\n            index = max;\n        }\n    }\n\n    //取出堆中的最大元素，并添加一个新元素e\n    public E replace(E e) {\n        E ret = findMax();\n\n        data.set(0,e);\n        siftDown(0);\n\n        return ret;\n    }\n}","language":"java","uuid":"2f336434-a358-4c6d-a2fb-d9e4b19c3d79","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"优先队列和堆","href":"/docs/document/1/17.html"}],"prevPage":{"title":"二分搜索树","href":"/docs/document/1/8.html"},"nextPage":{"title":"线段树","href":"/docs/document/1/19.html"},"createTime":1701823496464,"updateTime":1743303640547,"currentPath":"/docs/document/1/17.html"},"meta":{"type":"doc","publishTime":1764810804406}};
