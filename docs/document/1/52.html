      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":52,"title":"网络流与最大流","content":[{"type":"header","children":[{"type":"formatted","text":"网络流与最大流"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"考虑一幅有向带权图"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5071d4ce-3291-4ce9-986f-13b965855bec.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果图中有一个源点，即入度为 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":" 的节点，上图的节点 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":"，有一个汇点，它的出度为 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":"，上图的节点 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":"，并且图中所有边的权值都是非负的，那么我们可以说这是一个网络流。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"同一般的带权图不同，网络流中边的权值不是指从一个节点到达一个节点的距离是多少，耗费是多少，它指的是从一个节点到达另一个节点能够容忍的最大流量，例如从节点 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":" 到节点 "},{"type":"inline-math","tex":"1","children":[{"type":"formatted","text":"1"}]},{"type":"formatted","text":" 它最多能够容忍 "},{"type":"inline-math","tex":"3","children":[{"type":"formatted","text":"3"}]},{"type":"formatted","text":" 的流量。除了流量限制以外，还需要满足平衡限制，即流入某个节点的流量必须等于流出该节点的流量，即节点不允许存储流量，也不能产生流量(除了源点和汇点)。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"真实世界中很多的问题可以建模为网络流的模型，例如供水系统，图中的边可以看做是水管，其中的权值表示的是水管能够通过的最大流量；又比如通信系统，每条边看做是一个信道，而权值可以看做是信道容量。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"源点不断的发出流量，汇点不断接收流量，因为剩余的节点既不生产流量，也不存储流量，所以从源点发出的流量会全部进入到汇点。现在我们比较关心的是，从源点最多能发出多少流量，最终到达汇点，这就是最大流问题。"}]},{"type":"header","children":[{"type":"formatted","text":"有向带权图"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在讲解如何获得网络的最大流之前，我们先看看怎么表示网络流模型。其实网络流就是一个有向的带权图，我们只需要根据之前的无向带权图进行改造就可以得到有向带权图，改造的过程可以参考之前的无向无权图到有向无权图的改造，其实就是将"}]},{"type":"code-block","code":"adj[v].put(w, weight);\nadj[w].put(v, weight);","language":"java","uuid":"6ec7ce35-ac52-4e8c-b811-2f466bba5046","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"修改为了"}]},{"type":"code-block","code":"adj[v].put(w, weight);","language":"java","uuid":"fa246513-6c98-4b14-9aa2-efab80d39d4b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"以此表明是一个有方向的图。另外为了实现后续的算法，我们为带权图增加了 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 个 API"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"setWeight(v, w, weight)","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"addEdge(v, w, weight)","code":true}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外我们还添加了一个新的构造方法，该方法只接收一个参数，即图中有多少个节点，得到一个没有边的图，在后续通过 "},{"type":"formatted","text":"addEdge","code":true},{"type":"formatted","text":" 方法来图添加边。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"DirectedWeightedGraph","code":true},{"type":"formatted","text":" 类如下"}]},{"type":"code-block","code":"import java.io.File;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Scanner;\n\npublic class DirectedWeightedGraph{\n    private int V;\n    private int E;\n    private HashMap<Integer, Integer>[] adj;\n\n    public DirectedWeightedGraph(String path) {\n        File file = new File(path);\n        Scanner scanner = null;\n\n        try {\n            scanner = new Scanner(file);\n            this.V = scanner.nextInt();\n            if (V < 0) {\n                throw new IllegalArgumentException(\"V can't be negative\");\n            }\n            adj = new HashMap[V];\n            for (int i = 0; i < V; i++) {\n                adj[i] = new HashMap<>();\n            }\n\n            this.E = scanner.nextInt();\n            if (E < 0) {\n                throw new IllegalArgumentException(\"E can't be negative\");\n            }\n\n            for (int i = 0; i < E; i++) {\n                int v = scanner.nextInt();\n                int w = scanner.nextInt();\n                int weight = scanner.nextInt();\n\n                if (v == w) {\n                    throw new IllegalArgumentException(\"存在自环边\");\n                }\n                if (adj[v].containsKey(w)) {\n                    throw new IllegalArgumentException(\"存在平行边\");\n                }\n\t\t\t\n                // 表示有向\n                adj[v].put(w, weight);\n            }\n        } catch (Exception e) {\n            e.printStackTrace();\n        }finally {\n            scanner.close();\n        }\n    }\n\n    // 另一构造方法\n    public DirectedWeightedGraph(int V) {\n        this.V = V;\n        this.E = 0;\n        this.adj = new HashMap[V];\n        for (int v = 0; v < V; v++) {\n            adj[v] = new HashMap<>();\n        }\n    }\n\n    public int V() {\n        return this.V;\n    }\n\n    public int E() {\n        return this.E;\n    }\n\n    public int getWeight(int v, int w) {\n        validateVertex(v);\n        validateVertex(w);\n        if (!hasEdge(v, w)) {\n            throw new IllegalArgumentException(String.format(\"%d-%d 不存在\", v, w));\n        }\n        return adj[v].get(w);\n    }\n\n    public void setWeight(int v, int w, int weight) {\n        validateVertex(v);\n        validateVertex(w);\n        if (!hasEdge(v, w)) {\n            throw new IllegalArgumentException(String.format(\"%d-%d 不存在\", v, w));\n        }\n        adj[v].put(w, weight);\n    }\n\n    public void addEdge(int v, int w, int weight) {\n        validateVertex(v);\n        validateVertex(w);\n        if (v == w) {\n            throw new IllegalArgumentException(\"存在自环边\");\n        }\n        if (adj[v].containsKey(w)) {\n            throw new IllegalArgumentException(\"存在平行边\");\n        }\n\n        adj[v].put(w, weight);\n        E++;\n    }\n\n    public boolean hasEdge(int v, int w) {\n        validateVertex(v);\n        validateVertex(w);\n        return adj[v].containsKey(w);\n    }\n\n    public Iterable<Integer> adj(int v) {\n        validateVertex(v);\n        return adj[v].keySet();\n    }\n\n    public void validateVertex(int v) {\n        if (v < 0 && v >= V) {\n            throw new IllegalArgumentException(\"节点超过 [0, V) 的范围\");\n        }\n    }\n\n    @Override\n    public String toString() {\n        StringBuilder stringBuilder = new StringBuilder();\n        stringBuilder.append(String.format(\"V: %d, E: %d\\n\", this.V, this.E));\n        for (int v = 0; v < this.V; v++) {\n            stringBuilder.append(String.format(\"%d : \", v));\n            for (Map.Entry w: adj[v].entrySet()) {\n                stringBuilder.append(String.format(\"(%d: %d) \", w.getKey(), w.getValue()));\n            }\n            stringBuilder.append(\"\\n\");\n        }\n        return stringBuilder.toString();\n    }\n}","language":"java","uuid":"1735627a-6e5b-4bc7-af2b-b814461177b9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"该类的大部分实现细节与无向的版本相似，如果不熟悉可以查看无向图的相关章节。"}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"网络流与最大流","href":"/docs/document/1/52.html"}],"prevPage":{"title":"有向图算法","href":"/docs/document/1/47.html"},"nextPage":{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},"createTime":1702132378821,"updateTime":1743303640562,"currentPath":"/docs/document/1/52.html"},"meta":{"type":"doc","publishTime":1764775995438}};
