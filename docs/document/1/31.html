      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":31,"title":"哈希表","content":[{"type":"paragraph","children":[{"type":"formatted","text":"我们通过将我们要查找的某种数据类型转化为一个索引 "},{"type":"formatted","text":"index","code":true},{"type":"formatted","text":"，然后通过索引去数组中查找，这时它的复杂度就是 "},{"type":"inline-math","tex":"O(1)","children":[{"type":"formatted","text":"O(1)"}]},{"type":"formatted","text":" 级别的。而将某个数据类型转化为索引的函数我们就称为是哈希函数，比如说将 26 个小写字母转化为索引，我们可以这么写"}]},{"type":"code-block","code":"index = ch - 'a';","language":"java","uuid":"40defd5b-2402-45c6-8472-5e2e5d05608f","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这样就建立起了一一对应的关系，但是并不是所有的对应关系都是一一对应的，因为数组的容量是有限的，而输入的范围可能是无穷的，所以很有可能不同的键对应着同一个索引，比如说键是字符串，因为字符串的组合方式是非常的多，可以看做是无穷的，我们不可能去开辟一个无穷的空间去与这些字符串一一对应，所以不同的字符串生成的索引很有可能会有冲突，我们称这种情况为哈希冲突。由于上面讲到的哈希冲突，所以我们要设计好哈希函数("},{"type":"formatted","text":"hashCode()","code":true},{"type":"formatted","text":")使得发生哈希冲突的可能性小，即使哈希函数产生的哈希值均匀的分布在数组中。"}]},{"type":"header","children":[{"type":"formatted","text":"哈希函数的设计"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"哈希函数应该满足上面提到的：哈希函数产生的哈希值均匀的分布在数组中。数据的类型五花八门，对于特殊的领域有特殊领域的哈希函数的设计方式，甚至还有专门的论文，说这么多就是想说哈希函数的设计十分的复杂，在这里我们只提最简单的一种，哈希函数的设计应该满足"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"一致性"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果 "},{"type":"formatted","text":"a == b","code":true},{"type":"formatted","text":"，那么 "},{"type":"formatted","text":"hashCode(a) == hashCode(b)","code":true}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"高效性"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"计算迅速"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"均匀性"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"输出尽可能均匀"}]}]}]}]}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231300472022-04-23-13-00-47.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于 Java 中基本数据类型和字符串类型有默认的 "},{"type":"formatted","text":"hashCode()","code":true},{"type":"formatted","text":" 计算，所以我们就用 Java 自带的 "},{"type":"formatted","text":"hashCode","code":true},{"type":"formatted","text":" 计算基本数据类型和字符串的哈希值，而对于引用类型 Java 是根据地址计算的哈希值，所以可能会出现问题，需要我们自己自定义规则，比如对于一个 "},{"type":"formatted","text":"Student","code":true},{"type":"formatted","text":" 类，我们规定学号以及姓名相同(不区分大小写)就是同一个学生，所以根据一致性原则，它们应该产生相同的哈希值，但是由于 Java 默认是根据地址产生哈希值，由于二者的地址是不同的，所以产生的哈希值有极大的概率是不同的，所以我们需要自己创建哈希函数。"}]},{"type":"header","children":[{"type":"formatted","text":"链地址法"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们来演示往哈希表中添加元素的步骤"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231301542022-04-23-13-01-55.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"import java.util.TreeMap;\n\npublic class HashTable\u003cK, V\u003e {\n    //数组中存储的是TreeMap这种查找表\n    private TreeMap\u003cK, V\u003e[] hashTable;\n    private int M;\n    private int size;\n\n    public HashTable(int M) {\n        this.M = M;\n        size = 0;\n        hashTable = new TreeMap[M];\n\n        for (int i = 0; i \u003c hashTable.length; i++) {\n            hashTable[i] = new TreeMap\u003c\u003e();\n        }\n    }\n\n    public HashTable() {\n        this(97);\n    }\n\n    public int getSize() {\n        return size;\n    }\n\n    //得到在数组中的索引\n    private int hash(K key) {\n        //与0x7fffffff是为了消除负数\n        return (key.hashCode() & 0x7fffffff) % M;\n    }\n\n    public void add(K key, V value) {\n        TreeMap\u003cK, V\u003e map = hashTable[hash(key)];\n        //先查看已经是否有这个键了\n        if (map.containsKey(key)) {\n            //有则更新\n            map.put(key, value);\n        } else {\n            //没有则进行添加，并维护size\n            map.put(key, value);\n            size++;\n        }\n    }\n\n    public V remove(K key, V value) {\n        V ret = null;\n        TreeMap\u003cK, V\u003e map = hashTable[hash(key)];\n        //如果包含键则删除，没有返回null\n        if (map.containsKey(key)) {\n            ret = map.remove(key);\n            size--;\n        }\n\n        return ret;\n    }\n    \n    public void set(K key, V value) {\n        TreeMap\u003cK, V\u003e map = hashTable[hash(key)];\n        //没有该键抛出异常\n        if (!map.containsKey(key)) {\n            throw new IllegalArgumentException(\"键不存在\");\n        }\n        \n        map.put(key,value);\n    }\n    \n    //直接得到相应的TreeMap，然后去查，TreeMap有检查步骤\n    public V get(K key) {\n        return hashTable[hash(key)].get(key);\n    }\n}","language":"java","uuid":"fc8dc464-a272-4f7e-ad33-ea4f88802c67","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231302132022-04-23-13-02-13.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"import java.util.TreeMap;\n\npublic class HashTable\u003cK, V\u003e {\n    private static final int upperTol = 10;\n    private static final int lowerTol = 2;\n    private static final int initCapacity = 7;\n\n    //数组中存储的是TreeMap这种查找表\n    private TreeMap\u003cK, V\u003e[] hashTable;\n    private int M;\n    private int size;\n\n    public HashTable(int M) {\n        //只显示改变的内容\n        //...\n        hashTable = new TreeMap[initCapacity];\n    }\n\n    public void add(K key, V value) {\n        //...\n\n        if (size \u003e= upperTol * M) {\n            resize(2 * M);\n        }\n    }\n\n    public V remove(K key, V value) {\n        //...\n\n        if (size \u003c M * lowerTol && M / 2 \u003e= initCapacity) {\n            resize(M / 2);\n        }\n\n        return ret;\n    }\n\n    private void resize(int newM) {\n        TreeMap\u003cK,V\u003e[] newHashTable = new TreeMap[newM];\n\n        //后面要更新M，但是还需要旧M遍历数组\n        int oldM = M;\n        //由于后面要重新计算下标，所以这里要更新M\n        M = newM;\n\n        for (int i = 0; i \u003c oldM; i++) {\n            TreeMap\u003cK, V\u003e map = hashTable[i];\n            for (K key: map.keySet()) {\n                //重新计算下标并赋值\n                newHashTable[hash(key)].put(key, map.get(key));\n            }\n        }\n\n        hashTable = newHashTable;\n    }\n}","language":"java","uuid":"9454e79a-0e5b-47d8-8a63-4d0e3c053a6a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是我们发现每次我们都扩容为 "},{"type":"formatted","text":"2 * M","code":true},{"type":"formatted","text":"，这时 "},{"type":"formatted","text":"M","code":true},{"type":"formatted","text":" 就不是一个素数了，为了解决这一个问题，我们准备一个素数表，让 "},{"type":"formatted","text":"M","code":true},{"type":"formatted","text":" 取素数表中的值，每次扩容 "},{"type":"formatted","text":"M","code":true},{"type":"formatted","text":" 在素数表中的索引 "},{"type":"formatted","text":"+1","code":true},{"type":"formatted","text":"，缩容 "},{"type":"formatted","text":"-1","code":true}]},{"type":"code-block","code":"import java.util.TreeMap;\n\npublic class HashTable\u003cK, V\u003e {\n    //素数表\n    private static final int[] capacity = {};\n    private static final int upperTol = 10;\n    private static final int lowerTol = 2;\n    private  int capacityIndex = 0;\n\n    //数组中存储的是TreeMap这种查找表\n    private TreeMap\u003cK, V\u003e[] hashTable;\n    private int M;\n    private int size;\n\n    public HashTable() {\n        this.M = capacity[capacityIndex];\n        size = 0;\n        hashTable = new TreeMap[M];\n\n        for (int i = 0; i \u003c hashTable.length; i++) {\n            hashTable[i] = new TreeMap\u003c\u003e();\n        }\n    }\n\n    public void add(K key, V value) {\n        //...\n        if (size \u003e= upperTol * M && capacityIndex + 1 \u003c size) {\n            capacityIndex++;\n            resize(capacity[capacityIndex]);\n        }\n    }\n\n    public V remove(K key, V value) {\n        //...\n\n        if (size \u003c M * lowerTol && capacityIndex - 1 \u003e= 0) {\n            capacityIndex--;\n            resize(capacity[capacityIndex]);\n        }\n\n        return ret;\n    }\n}","language":"java","uuid":"ce057614-0aeb-4b9b-81a9-d90ed2897295","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"哈希表","href":"/docs/document/1/31.html"}],"prevPage":{"title":"红黑树","href":"/docs/document/1/23.html"},"nextPage":{"title":"图的表示","href":"/docs/document/1/9.html"},"createTime":1701960278858,"updateTime":1743303640549,"currentPath":"/docs/document/1/31.html"},"meta":{"type":"doc","publishTime":1767266228180}};
