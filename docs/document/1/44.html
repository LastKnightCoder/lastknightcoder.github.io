      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":44,"title":"Dijkstra 算法","content":[{"type":"paragraph","children":[{"type":"formatted","text":"Dijkstra 算法它能够求解单源最短路径问题，并且使用该算法有一个前提，图中不能存在负权边，即图中的每条边的权值都必须是大于等于 0 的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Dijkstra 算法使用一个 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组来表示从源 s 到其他节点的最短距离，例如 "},{"type":"formatted","text":"dis[v]","code":true},{"type":"formatted","text":" 表示的就是源 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":" 到达节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 的最短距离，在初始时，除了 "},{"type":"formatted","text":"dis[s]","code":true},{"type":"formatted","text":" 为 0，其余的 "},{"type":"formatted","text":"dis[v]","code":true},{"type":"formatted","text":" 均为无穷大。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Dijkstra 算法的思想是，每次从未遍历的节点，寻找在 dis 数组中值最小的节点，然后根据这个节点更新其未被遍历过的相邻节点在 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中的值。例如遍历到节点 v，其相邻节点为 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":"，并且节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 未被遍历过，如果 "},{"type":"formatted","text":"dis[v] + weight(v,w) < dis[w]","code":true},{"type":"formatted","text":"​，那么就更新 "},{"type":"formatted","text":"dis[w]","code":true},{"type":"formatted","text":"，其中 "},{"type":"formatted","text":"weight(v, w)","code":true},{"type":"formatted","text":" 是边 "},{"type":"formatted","text":"v-w","code":true},{"type":"formatted","text":" 的权值。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"举个例子，假设源为节点 0，我们求解节点 0 到各个节点的最短路径"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105992542-3ac71b00-60e0-11eb-9d10-6e81f55fb87f.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"初始节点 0 到节点 0 的距离为 0，其余节点距离节点 0 的距离为 。根据 Dijkstra 算法，每次从未遍历的节点，寻找在 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中值最小的节点，所以此时我们找到了节点 0，"},{"type":"formatted","text":"dis[0]","code":true},{"type":"formatted","text":" 为 0，比其他元素小。我们来到节点 0，根据公式 "},{"type":"formatted","text":"dis[0] + weight(0, w) < dis[w]","code":true},{"type":"formatted","text":"更新与 0 相邻的节点 "},{"type":"formatted","text":"w","code":true}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105998635-d60fbe80-60e7-11eb-833d-96b338557e09.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"继续从未遍历的节点，寻找在 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中值最小的节点，是节点 2，它的值为 1，并且此时我们可以断定节点 0 离节点 2 的最短距离就是 1。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么呢? 假设存在一条更短的路径从 0 到 2，例如是 0-1-2，但是因为此时 0-2 是最小的，而图中又不存在负权边，所以 0-1-2 比 0-1 还大，也就是比 0-2 大，所以 0-2 就是从 0 到 2 的最短路径。来到节点 2 之后，根据条件 "},{"type":"formatted","text":"dis[2] + weight(2, w) < dis[w]","code":true},{"type":"formatted","text":" 是否成立更新其相邻节点。"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105998635-d60fbe80-60e7-11eb-833d-96b338557e09.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"继续从未遍历的节点，寻找在 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中值最小的节点，此时 "},{"type":"formatted","text":"dis[1]","code":true},{"type":"formatted","text":" 与"},{"type":"formatted","text":" dis[6]","code":true},{"type":"formatted","text":" 的值都是 2，随便选一个就可以，这里我选择节点 1，并且此时可以判定节点 0 到节点 1 的最短路径就是 "},{"type":"formatted","text":"dis[1]","code":true},{"type":"formatted","text":" 为 2。为什么?"}]},{"type":"paragraph","children":[{"type":"formatted","text":"假设存在一条路径经过未遍历的节点从 0 到达节点 1，比如是节点 4 好了，因为 "},{"type":"formatted","text":"dis[1]","code":true},{"type":"formatted","text":" 此时是未遍历的节点中最小的，所以 "},{"type":"formatted","text":"dis[1] < dis[4]","code":true},{"type":"formatted","text":"，更别说还要加上节点 4 到节点 1 的距离，矛盾，所以找不到一条经过未遍历节点来到节点 1。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"那么是否存在一条路径只经过已经遍历过的节点到达节点 1，并且路径比 "},{"type":"formatted","text":"dis[1]","code":true},{"type":"formatted","text":" 小，不妨假设存在这么一条路径 "},{"type":"formatted","text":"0 -> ... -> s -> 1","code":true},{"type":"formatted","text":"，它的值比 "},{"type":"formatted","text":"dis[1]","code":true},{"type":"formatted","text":" 小，即 "},{"type":"formatted","text":"dis[s] + weight(s, 1) < dis[1]","code":true},{"type":"formatted","text":"，那么当我们之前遍历到节点 s 对相邻节点更新的时候就会更新 dis[1] 为更小的值，也产生了矛盾，因此也不存在一条路径只经过已经遍历过的节点到达节点 1。所以我们可以说此时的 "},{"type":"formatted","text":"dis[1]","code":true},{"type":"formatted","text":" 就是从 0 到 1 的最短路径。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"来到节点 1 之后，更新其未被遍历过的相邻节点的值，当然图中节点 1 此时不存在未被遍历过的相邻节点，所以不进行任何的更新"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105998692-e758cb00-60e7-11eb-858a-b37c11c09208.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"继续从未遍历的节点，寻找在 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中值最小的节点，找到节点 6，此时 "},{"type":"formatted","text":"dis[6]","code":true},{"type":"formatted","text":" 的值为 2，并且此时我们可以判定从节点 0 到节点 6 的最短距离就是 2。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"分析方法同上，先假设存在一条从未被遍历过的节点到达节点 6 得到的更短路径，但是因为 dis[6] 已经是从 0 到未被遍历的节点最小的，图中又不存在负权边，所以矛盾，再做假设存在只经过已被遍历过的节点到达节点 6，那么在之前 "},{"type":"formatted","text":"dis[6]","code":true},{"type":"formatted","text":" 的值就会被更新为更小的值，也会产生矛盾，从而得到结论，不存在另外一条路径从 0 到 6 更短，此时 "},{"type":"formatted","text":"dis[6]","code":true},{"type":"formatted","text":" 就是从 0 到 6 的最短距离。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"来到节点 6 之后根据条件更新其未被遍历的相邻节点，图中节点 6 不存在未被遍历过的相邻节点，因此不作更新"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105998794-f770aa80-60e7-11eb-84ff-9d5e13ea6b18.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"继续从未遍历的节点，寻找在 "},{"type":"formatted","text":"dis","code":true},{"type":"formatted","text":" 数组中值最小的节点，发现 "},{"type":"formatted","text":"dis[3]","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"dis[4]","code":true},{"type":"formatted","text":" 都是 3，我们就随便选择一个，这里选择节点 3，并且此时可以判定 "},{"type":"formatted","text":"dis[3]","code":true},{"type":"formatted","text":" 是从节点 0 到节点 3 的最短距离，已经分析过多次，不再分析。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"来到节点 3 之后，根据条件更新其未被遍历过的相邻节点，与节点 3 相邻未被遍历过的节点就是节点 4，但是并不满足 "},{"type":"formatted","text":"dis[3] + 3 < dis[4]","code":true},{"type":"formatted","text":" 的条件，所以不更新 "},{"type":"formatted","text":"dis[4]","code":true}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105998881-08b9b700-60e8-11eb-96ba-d76a3b62a788.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"重复上面的过程，我们可以得到下面这张表"}]},{"type":"table","children":[{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"顶点"}]},{"type":"table-cell","children":[{"type":"formatted","text":"0"}]},{"type":"table-cell","children":[{"type":"formatted","text":"1"}]},{"type":"table-cell","children":[{"type":"formatted","text":"2"}]},{"type":"table-cell","children":[{"type":"formatted","text":"3"}]},{"type":"table-cell","children":[{"type":"formatted","text":"4"}]},{"type":"table-cell","children":[{"type":"formatted","text":"5"}]},{"type":"table-cell","children":[{"type":"formatted","text":"6"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"dis"}]},{"type":"table-cell","children":[{"type":"formatted","text":"0"}]},{"type":"table-cell","children":[{"type":"formatted","text":"2"}]},{"type":"table-cell","children":[{"type":"formatted","text":"1"}]},{"type":"table-cell","children":[{"type":"formatted","text":"3"}]},{"type":"table-cell","children":[{"type":"formatted","text":"3"}]},{"type":"table-cell","children":[{"type":"formatted","text":"4"}]},{"type":"table-cell","children":[{"type":"formatted","text":"2"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二行的值表示原点到各点的最短路径。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以 Dijkstra 算法就始终在重复两步："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"寻找未被遍历节点中在 dis 数组中最小的那个节点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"根据条件更新未被遍历过的相邻节点"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"寻找最小节点的操作我们使用一个优先队列来完成，直接从队首取出的值就是最小的，无需寻找"}]},{"type":"code-block","code":"import java.util.*;\n\npublic class Dijkstra {\n    private WeightedGraph graph;\n    private int s;\n    private int[] dis;\n    private boolean[] visited;\n    // 求具体的路径用\n    private int[] pre;\n\n    public Dijkstra(WeightedGraph graph, int s) {\n        this.graph = graph;\n        graph.validateVertex(s);\n        this.s = s;\n\n        this.dis = new int[graph.V()];\n        this.visited = new boolean[graph.V()];\n        this.pre = new int[graph.V()];\n\n        // 初始化操作\n        Arrays.fill(pre, -1);\n        Arrays.fill(dis, Integer.MAX_VALUE);\n\n        pre[s] = s;\n        dis[s] = 0;\n\n        // 建立一个优先队列，Node 保存的是节点 dis[v] 的值\n        PriorityQueue<Node> queue =\n                new PriorityQueue<>((node1, node2) -> node1.getDis() - node2.getDis());\n        queue.add(new Node(s, 0));\n        while (!queue.isEmpty()) {\n\n            // 选出最小节点\n            int v = queue.remove().getV();\n\n            // 可能存在重复添加的情况，忽略\n            if (visited[v]) {\n                continue;\n            }\n            visited[v] = true;\n\n            // 更新未被遍历的相邻节点\n            for (int w: graph.adj(v)) {\n                if (!visited[w]) {\n                    dis[w] = Math.min(dis[w], dis[v] + graph.getWeight(v, w));\n                    // 将 dis[w] 添加进队列，可能会重复添加\n                    // 不过我们只对最小的那个感兴趣，重复添加取出后会被忽略\n                    queue.add(new Node(w, dis[w]));\n                    pre[w] = v;\n                }\n            }\n        }\n    }\n\n    public int[] result() {\n        return dis;\n    }\n\n    // 获得源到节点 t 的具体路径\n    public Iterable<Integer> path(int t) {\n        ArrayList<Integer> path = new ArrayList<>();\n        if (!visited[t]) {\n            return path;\n        }\n        int cur = t;\n        while (cur != s) {\n            path.add(cur);\n            cur = pre[cur];\n        }\n        path.add(s);\n\n        Collections.reverse(path);\n        return path;\n    }\n}","language":"java","uuid":"34ba628d-21d1-4b53-8b0b-33b35df887e3","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"最短路径算法","href":"/docs/document/1/43.html"},{"label":"Dijkstra 算法","href":"/docs/document/1/44.html"}],"prevPage":{"title":"最短路径算法","href":"/docs/document/1/43.html"},"nextPage":{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},"createTime":1702089338048,"updateTime":1743303640561,"currentPath":"/docs/document/1/44.html"},"meta":{"type":"doc","publishTime":1764821904237}};
