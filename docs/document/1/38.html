      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":38,"title":"桥和割点","content":[{"type":"header","children":[{"type":"formatted","text":"桥"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"定义"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们首先看一下桥的概念"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105571174-f4dd2080-5d88-11eb-8de0-816fa0b3432f.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面这幅图中，我们称节点 3-5 之间的这条边为桥，它具有什么特点呢? 一旦将这条边去掉，图的联通分量就会发生变化，所以有如下定义："}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果去掉某条边，使得图的联通分量发生变化，那么称这条边为桥。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"桥可以看做是图中最脆弱的那条边，如果将交通系统建模为一个图的话，桥就是交通系统中最脆弱的部分，在军事中如果我们知道对方交通系统中的桥，那么我们就可以军事打击这个桥，使得对方的交通系统瘫痪。"}]},{"type":"header","children":[{"type":"formatted","text":"寻找桥"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"如何判断某条边是不是桥，对于下图来说， "},{"type":"formatted","text":"0-1","code":true},{"type":"formatted","text":" 这条边是桥吗?"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2a875ce4-a170-4bba-85cb-b29a3ea26c43.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"答案不是，因为去掉 "},{"type":"formatted","text":"0-1","code":true},{"type":"formatted","text":" 这条边联通分量的个数没有增加，原因是节点 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 可以通过另一条路径 "},{"type":"formatted","text":"1->3->2->0","code":true},{"type":"formatted","text":" 到达 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，所以我们判断某条边是不是桥，就是判断边的两个节点是否有另外一条路径。考虑边 "},{"type":"formatted","text":"v-w","code":true},{"type":"formatted","text":"，如果存在另外一条路径，使得节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 可以到达节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 或者是节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 之前的节点，我们就认为 "},{"type":"formatted","text":"v-w","code":true},{"type":"formatted","text":" 不是桥，否则没有另外的路径使得节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 到达节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":"，我们就认为 "},{"type":"formatted","text":"v-w","code":true},{"type":"formatted","text":" 是桥。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了完成这个判断，我们需要定义两个变量来帮助我们保存信息，一个是 "},{"type":"formatted","text":"order[]","code":true},{"type":"formatted","text":" 数组，它保存的是以 DFS 遍历图的顺序，例如 "},{"type":"formatted","text":"order[0] = 0","code":true},{"type":"formatted","text":"，表示节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 是第 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 个遍历的，"},{"type":"formatted","text":"order[3] = 2","code":true},{"type":"formatted","text":" 表示节点 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":" 是第 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 个遍历的"}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105571626-77b3aa80-5d8c-11eb-872d-d86fcebeff8b.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一个需要记录的信息是当前节点通过另外一条路径(即不是父节点那条路径)能够达到的顺序最前的节点，使用数组 "},{"type":"formatted","text":"low","code":true},{"type":"formatted","text":" 表示，假设节点 2 能够达到最前的节点 0，而 "},{"type":"formatted","text":"order[0] = 0","code":true},{"type":"formatted","text":"，所以 "},{"type":"formatted","text":"low[2] = order[0] = 0","code":true},{"type":"formatted","text":"，初始 "},{"type":"formatted","text":"low[i] = order[i]","code":true},{"type":"formatted","text":"，更新 "},{"type":"formatted","text":"low","code":true},{"type":"formatted","text":" 数组有两个时机"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 访问已被遍历过的邻接节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 时(该邻接节点不为父节点)，如果 "},{"type":"formatted","text":"low[w] < low[v]","code":true},{"type":"formatted","text":"，则更新 "},{"type":"formatted","text":"low[v] = low[w]","code":true}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105573832-47bfd380-5d9b-11eb-848f-8221a6ea216c.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们访问到节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 时，接着访问节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 的邻接节点，访问到节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 不是它的父亲节点(上一个节点)，而且节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 已经被访问过，并且 "},{"type":"formatted","text":"low[0] < low[2]","code":true},{"type":"formatted","text":"，所以这个时候更新 "},{"type":"formatted","text":"low[2] = low[0]","code":true},{"type":"formatted","text":"，表示节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 能通过另一条路径访问第 "},{"type":"formatted","text":"low[0]","code":true},{"type":"formatted","text":" 个遍历的节点，即节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 能够访问到第 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 个被遍历的节点，即节点 "},{"type":"formatted","text":"0","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"访问完邻接节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":"，回到当前节点 v 时，如果邻接节点的 "},{"type":"formatted","text":"low[w] < low[v]","code":true},{"type":"formatted","text":"，则更新 "},{"type":"formatted","text":"low[v] = low[w]","code":true}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/105573832-47bfd380-5d9b-11eb-848f-8221a6ea216c.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当节点访问完节点 "},{"type":"formatted","text":"2","code":true},{"type":"formatted","text":" 回到节点 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":" 时，此时 "},{"type":"formatted","text":"low[2] < low[3]","code":true},{"type":"formatted","text":"，更新 "},{"type":"formatted","text":"low[3] = low[2] = 0","code":true},{"type":"formatted","text":"，表示 "},{"type":"formatted","text":"low[3]","code":true},{"type":"formatted","text":" 可以从另外一条路径到达第 "},{"type":"formatted","text":"low[2] = 0","code":true},{"type":"formatted","text":" 个被遍历的节点，即节点 "},{"type":"formatted","text":"0","code":true}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"引入了 "},{"type":"formatted","text":"order","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"low","code":true},{"type":"formatted","text":" 数组，接着我们可以根据这两个数组判断某条边是不是桥了，当我们遍历完相邻节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":"，来到当前节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 时，除了要更新 "},{"type":"formatted","text":"low[v]","code":true},{"type":"formatted","text":"，我们还需要对这条边是不是桥进行判断。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们需要判断 "},{"type":"formatted","text":"low[w]","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"order[v]","code":true},{"type":"formatted","text":" 的大小，以此判断是否是桥。首先明确一下二者表示的意义："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"low[w]","code":true},{"type":"formatted","text":" 表示节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 能够通过另一条路径能够到达的最前顺序，例如 "},{"type":"formatted","text":"low[w] = 3","code":true},{"type":"formatted","text":" 就表示 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 节点能通过另一条路径到达第 3 个被遍历的节点，"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"order [v]","code":true},{"type":"formatted","text":" 表示节点 v 是第几个被遍历的"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果 "},{"type":"formatted","text":"low[w] <= order[v]","code":true},{"type":"formatted","text":"，说明 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 能通过另一条路径到达节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 之前被遍历的节点，说明就不是桥，否则就是桥。"}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.HashSet;\n\npublic class FindEdge {\n    private int[] order;\n    private int[] low;\n    private Graph graph;\n    private boolean[] visited;\n    private int count = 0;\n\n    // 存储桥\n    private ArrayList<int[]> result;\n\n    public FindEdge(Graph graph) {\n        this.graph = graph;\n        order = new int[graph.V()];\n        low = new int[graph.V()];\n        result = new ArrayList<>();\n        visited = new boolean[graph.V()];\n\n        for (int i = 0; i < graph.V(); i++) {\n            if (!visited[i]) {\n                dfs(i, i);\n            }\n        }\n    }\n\n    private void dfs(int v, int parent) {\n        visited[v] = true;\n        low[v] = count;\n        order[v] = count;\n        count++;\n\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w, v);\n                // 更新 low[v] 时机 1\n                low[v] = Math.min(low[v], low[w]);\n                // 判断是否是桥\n                if (low[w] > order[v]) {\n                    result.add(new int[]{v, w});\n                }\n            } else if (w != parent){\n                // 更细 low[v] 时机 2\n                low[v] = Math.min(low[w], low[v]);\n            }\n        }\n    }\n\n    public ArrayList<int[]> getResult() {\n        return result;\n    }\n}","language":"java","uuid":"1877ad2b-56af-44bb-883d-e27f94e5c1d0","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"割点"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"定义"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"割点的定义与桥的定义类似，割点指的是一个节点，如果一旦移除这个节点，会导致图中的联通分量发生变化，那么就称这个节点为割点。"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c8a8bf23-0d5a-42c9-95cd-ab0d3bbf1e11.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上图中节点 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":" 与节点 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 为割点，一旦去掉这两个节点之一，图的联通分量的个数就会发生变化。"}]},{"type":"header","children":[{"type":"formatted","text":"寻找割点"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"寻找割点的过程同寻找桥是一样的，也需要维护 "},{"type":"formatted","text":"order","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"low","code":true},{"type":"formatted","text":" 两个数组，这两数组的含义也是同上一致的。"},{"type":"formatted","text":"low","code":true},{"type":"formatted","text":" 数组的更新时机以及更新过程也是同上一致的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在的问题是我们在什么时候判断某节点是不是割点，以及条件是什么。我们在遍历完相邻节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":"，返回到当前节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 时，如果 "},{"type":"formatted","text":"low[w] >= order[v]","code":true},{"type":"formatted","text":" 时，就说明它是一个割点。这里的判断条件与桥的判断不同，桥的判断条件是如果 "},{"type":"formatted","text":"low[w] > order[v]","code":true},{"type":"formatted","text":" 时，就说明 "},{"type":"formatted","text":"v-w","code":true},{"type":"formatted","text":" 这条边是桥，注意多了一个等于号。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"low[w] >=order[v]","code":true},{"type":"formatted","text":" 表示节点 "},{"type":"formatted","text":"w","code":true},{"type":"formatted","text":" 与 节点 "},{"type":"formatted","text":"v","code":true},{"type":"formatted","text":" 之前被遍历的节点产生连接只能通过节点 "},{"type":"formatted","text":"v","code":true}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_472abf5b-1899-488c-bcc1-a057ec504ee7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"例如节点 "},{"type":"formatted","text":"4","code":true},{"type":"formatted","text":" 通过另外一条路径它最多到达节点 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":"，无法与节点 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 之前被遍历的节点产生连接。一旦节点 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 被删除，4 就无法访问到节点 "},{"type":"formatted","text":"0, 1, 2, 3","code":true},{"type":"formatted","text":"，所以 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 就是割点。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是添加了等于号之后，这个时候因为任何节点 "},{"type":"formatted","text":"low[v] >= order[0]","code":true},{"type":"formatted","text":"，所以根节点 0 会被认为是割点，但根节点不一定是割点，这个时候我们就需要对根节点分别讨论，判断根节点是不是割点很简单，如果通过 DFS 遍历，根节点有两个相邻节点就说明它是割点"}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e435b300-8eb6-4de0-88f2-c1222b98a96b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.HashSet;\n\npublic class FindCutPoints {\n    private Graph graph;\n    private boolean[] visited;\n    private int[] order;\n    private int[] low;\n    private int count = 0;\n\n    private HashSet<Integer> result = new HashSet<>();\n\n    public FindCutPoints(Graph graph) {\n        this.graph = graph;\n\n        visited = new boolean[graph.V()];\n        order = new int[graph.V()];\n        low = new int[graph.V()];\n\n        for (int i = 0; i < graph.V(); i++) {\n            if (!visited[i]) {\n                dfs(i, i);\n            }\n        }\n    }\n\n    private void dfs(int v, int parent) {\n        visited[v] = true;\n        order[v] = count;\n        low[v] = count;\n        count++;\n\n        int child = 0;\n        for (int w: graph.adj(v)) {\n            child++;\n            if (!visited[w]) {\n                dfs(w, v);\n                low[v] = Math.min(low[v], low[w]);\n                if (v != parent && low[w] >= order[v]) {\n                    result.add(v);\n                }\n                if (v == parent && child > 1) {\n                    result.add(v);\n                }\n            } else if (w != parent) {\n                low[v] = Math.min(low[v], low[w]);\n            }\n        }\n    }\n\n    public HashSet<Integer> getResult() {\n        return result;\n    }\n}","language":"java","uuid":"a7e185c0-6c87-4e37-bcc6-14c8a6c422b5","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"桥和割点","href":"/docs/document/1/38.html"}],"prevPage":{"title":"滑动谜题","href":"/docs/document/1/37.html"},"nextPage":{"title":"哈密尔顿回路","href":"/docs/document/1/39.html"},"createTime":1702052079120,"updateTime":1743303640550,"currentPath":"/docs/document/1/38.html"},"meta":{"type":"doc","publishTime":1764772322629}};
