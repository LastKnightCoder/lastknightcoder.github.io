m","children":[{"type":"paragraph","children":[{"type":"formatted","text":"isConnected(p, q)","code":true}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"判断元素 "},{"type":"formatted","text":"p","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"q","code":true},{"type":"formatted","text":" 是否是连接的，即是否所属一个集合"}]}]}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里先给出并查集的接口，后面我们将实现多个版本的并查集"}]},{"type":"code-block","code":"public interface UF {\n    public int getSize();\n    public boolean isConnected(int p, int q);\n    public void unionElements(int p, int q);\n}","language":"java","uuid":"2a6d9b6e-09dd-4ffc-ada6-42946fa77f14","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Quick Find"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231245232022-04-23-12-45-24.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//第一版的并查集\npublic class UnionFind1 implements UF{\n    private int[] id;\n\n    public UnionFind1(int size) {\n        id = new int[size];\n\n        //这时id全部为0，相当于在一个集合中 一开始应该全部不在一个集合中\n        for (int i = 0; i < id.length; i++) {\n            id[i] = i;\n        }\n    }\n\n    @Override\n    public int getSize() {\n        return id.length;\n    }\n\n    //找到元素p所属的集合\n    private int find(int p) {\n        if (p < 0 || p >= id.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        return id[p];\n    }\n\n    @Override\n    public boolean isConnected(int p, int q) {\n        return find(p) == find(q);\n    }\n\n    @Override\n    public void unionElements(int p, int q) {\n        if (find(p) == find(q)) {\n            return;\n        }\n\n        for (int i = 0; i < id.length; i++) {\n            if (id[i] == find(p)) {\n                id[i] = find(q);\n            }\n        }\n    }\n}","language":"java","uuid":"0ddbca12-ddd7-498e-bd98-0c3fb65c4dca","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Quick Union"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231245452022-04-23-12-45-46.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//第二版的并查集\npublic class UnionFind2 implements UF{\n    private int[] parent;\n\n    public UnionFind2(int size) {\n        parent = new int[size];\n\n        for (int i = 0; i < parent.length; i++) {\n            parent[i] = i;\n        }\n    }\n\n    @Override\n    public int getSize() {\n        return parent.length;\n    }\n\n    private int find(int index) {\n        if (index < 0 || index >= parent.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        while (index != parent[index]) {\n            index = parent[index];\n        }\n        return index;\n    }\n\n    @Override\n    public boolean isConnected(int p, int q) {\n        return find(p) == find(q);\n    }\n\n    @Override\n    public void unionElements(int p, int q) {\n        int pRoot = find(p);\n        int qRoot = find(q);\n        if (pRoot == qRoot) {\n            return;\n        } else {\n            parent[pRoot] = parent[qRoot];\n        }\n    }\n}","language":"java","uuid":"861ee7fd-cb05-4006-ac80-1dab5b842f47","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"基于rank的优化"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231247442022-04-23-12-47-44.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//第三版的并查集\npublic class UnionFind3 implements UF{\n    private int[] parent;\n    //记录根节点的高度\n    private int[] rank;\n\n    public UnionFind3(int size) {\n        parent = new int[size];\n        rank = new int[size];\n\n        for (int i = 0; i < parent.length; i++) {\n            parent[i] = i;\n            rank[i] = 1;\n        }\n    }\n\n    @Override\n    public int getSize() {\n        return parent.length;\n    }\n\n    private int find(int index) {\n        if (index < 0 || index >= parent.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        while (index != parent[index]) {\n            index = parent[index];\n        }\n        return index;\n    }\n\n    @Override\n    public boolean isConnected(int p, int q) {\n        return find(p) == find(q);\n    }\n\n    @Override\n    public void unionElements(int p, int q) {\n        int pRoot = find(p);\n        int qRoot = find(q);\n        if (pRoot == qRoot) {\n            return;\n        }\n\n        if (rank[pRoot] <= rank[qRoot]){\n            parent[pRoot] = parent[qRoot];\n            //只要在两个数的高度相等的时候 树的高度才会增加\n            if (rank[pRoot] == rank[qRoot]) {\n                rank[qRoot]++;\n            }\n        } else {\n            parent[qRoot] = parent[pRoot];\n        }\n    }\n}","language":"java","uuid":"622ef6f3-02a3-4d36-99ac-762ae1d4b20b","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"路径压缩"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231248082022-04-23-12-48-08.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//第四版的并查集\npublic class UnionFind4 implements UF{\n    private int[] parent;\n    private int[] rank;\n\n    public UnionFind4(int size) {\n        parent = new int[size];\n        rank = new int[size];\n\n        for (int i = 0; i < parent.length; i++) {\n            parent[i] = i;\n            rank[i] = 1;\n        }\n    }\n\n    @Override\n    public int getSize() {\n        return parent.length;\n    }\n\n    private int find(int index) {\n        if (index < 0 || index >= parent.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\n        while (index != parent[index]) {\n            //只添加了这一行代码\n            parent[index] = parent[parent[index]];\n            index = parent[index];\n        }\n        return index;\n    }\n\n    @Override\n    public boolean isConnected(int p, int q) {\n        return find(p) == find(q);\n    }\n\n    @Override\n    public void unionElements(int p, int q) {\n        int pRoot = find(p);\n        int qRoot = find(q);\n        if (pRoot == qRoot) {\n            return;\n        }\n\t\t\n        //这时rank不代表高度 因为在路径压缩时没有维护rank\n        //但是整体上rank还是能够表示大小关系的\n        if (rank[pRoot] <= rank[qRoot]){\n            parent[pRoot] = parent[qRoot];\n            \n            if (rank[pRoot] == rank[qRoot]) {\n                rank[qRoot]++;\n            }\n        } else {\n            parent[qRoot] = parent[pRoot];\n        }\n    }\n}","language":"java","uuid":"76a5dd29-4c50-4c09-a53d-f3853deb3d51","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231248372022-04-23-12-48-37.png","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"//第五版的并查集\npublic class UnionFind5 implements UF{\n    private int[] parent;\n    private int[] rank;\n\n    public UnionFind5(int size) {\n        parent = new int[size];\n        rank = new int[size];\n\n        for (int i = 0; i < parent.length; i++) {\n            parent[i] = i;\n            rank[i] = 1;\n        }\n    }\n\n    @Override\n    public int getSize() {\n        return parent.length;\n    }\n\n    private int find(int index) {\n        if (index < 0 || index >= parent.length) {\n            throw new IllegalArgumentException(\"参数错误\");\n        }\n\t\t\n        //修改了这里\n        if (index != parent[index]) {\n            parent[index] = find(parent[index]);\n        }\n        return parent[index];\n    }\n\n    @Override\n    public boolean isConnected(int p, int q) {\n        return find(p) == find(q);\n    }\n\n    @Override\n    public void unionElements(int p, int q) {\n        int pRoot = find(p);\n        int qRoot = find(q);\n        if (pRoot == qRoot) {\n            return;\n        }\n\n        if (rank[pRoot] <= rank[qRoot]){\n            parent[pRoot] = parent[qRoot];\n            \n            if (rank[pRoot] == rank[qRoot]) {\n                rank[qRoot]++;\n            }\n        } else {\n            parent[qRoot] = parent[pRoot];\n        }\n    }\n}","language":"java","uuid":"12aae2f3-9653-449c-9519-3e4255d8c21c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第五版的效率不一定比第四版的好，因为第四版最后也可能做到\"扁平化\"，并且第五版的递归操作比较耗时。"}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"树结构"},{"label":"并查集","href":"/docs/document/1/21.html"}],"prevPage":{"title":"Trie","href":"/docs/document/1/20.html"},"nextPage":{"title":"AVL 树","href":"/docs/document/1/22.html"},"createTime":1701865608053,"updateTime":1743303640547,"currentPath":"/docs/document/1/21.html"},"meta":{"type":"doc","publishTime":1764772322627}};
