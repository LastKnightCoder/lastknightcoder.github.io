document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":47,"title":"有向图算法","content":[{"type":"paragraph","children":[{"type":"formatted","text":"实际生活中的很多问题都可以建模为一个有向图的模型："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"社交网络：图中的节点看做是一个个的人，如果一个节点指向一个节点，表示这个人关注了这个人，这种关注关系是有方向的"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"学习课程：将图中的节点看做是一门门的课程，一门课程被其他课程所指向，表示学习这门课程之前需要学习其他的课程，这种学习顺序也是有指向关系的"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"模块引用：将图中的节点看做是一个个的程序模块，一个模块被其他模块指向，表示该模块依赖于其他模块，这种模块之间的依赖也是有方向的"}],"disableDrag":false}]}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png"},{"type":"header","children":[{"type":"formatted","text":"有向图的表示"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们之前介绍的无向图可以看做是一种特殊的有向图，所谓的特殊在于每个节点都互相指向。我们之前在 g.txt 值规定规定了节点之间的连接关系，所以我们当我们读取到下面的形式的时候"}],"disableDrag":false},{"type":"code-block","code":"0 1","language":"java","uuid":"29d0a5a2-d97a-46cb-b2ca-4b0bf2b99336","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"表示的是节点 0 指向节点 1 以及节点 1 指向节点 0，所以我们在无向图中实现如下"}],"disableDrag":false},{"type":"code-block","code":"adj[0].add(1);\nadj[1].add(0);","language":"java","uuid":"f5fb1e7f-ccff-443a-b9fa-f6bda9f4f5ac","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们只是想表示节点 0 指向节点 1，我们就不需要添加下面那一行语句就好了。所以有向图对比于无向图的实现只需要更改这一个部分"}],"disableDrag":false},{"type":"code-block","code":"import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\nimport java.util.TreeSet;\n\npublic class DirectedGraph {\n    private int E;\n    private int V;\n    private TreeSet<Integer>[] adj;\n\n    public DirectedGraph(String filename) {\n        File file = new File(filename);\n        Scanner scanner = null;\n        try {\n            scanner = new Scanner(file);\n            this.V = scanner.nextInt();\n            if (this.V < 0) {\n                throw new IllegalArgumentException(\"V Must Be Positive\");\n            }\n\n            this.adj = new TreeSet[this.V];\n            for (int i = 0; i < this.V; i++) {\n                this.adj[i] = new TreeSet<>();\n            }\n\n            this.E = scanner.nextInt();\n            if (this.E < 0) {\n                throw new IllegalArgumentException(\"E Must Be Positive\");\n            }\n\n            this.inDegree = new int[V];\n            this.outDegree = new int[V];\n\n            for (int i = 0; i < this.E; i++) {\n                int a = scanner.nextInt();\n                validateVertex(a);\n                int b = scanner.nextInt();\n                validateVertex(b);\n\n                if (a == b) {\n                    throw new IllegalArgumentException(\"Self loop exists\");\n                }\n                if (adj[a].contains(b)) {\n                    throw new IllegalArgumentException(\"Parallel edge exists\");\n                }\n\n                // 只是删掉了 adj[b].add(a)\n                adj[a].add(b);\n            }\n        } catch (FileNotFoundException e) {\n            e.printStackTrace();\n        } finally {\n            assert scanner != null;\n            scanner.close();\n        }\n    }\n\n    private void validateVertex(int v) {\n        if (v < 0 || v >= this.V) {\n            throw new IllegalArgumentException(\"Vertex \" + v + \" is invalid\");\n        }\n    }\n\n    public int V() {\n        return this.V;\n    }\n\n    public int E() {\n        return this.E;\n    }\n\n    public Iterable<Integer> adj(int v) {\n        validateVertex(v);\n        return adj[v];\n    }\n\n    @Override\n    public String toString() {\n        StringBuilder stringBuilder = new StringBuilder();\n        stringBuilder.append(String.format(\"V: %d, E: %d\\n\", this.V, this.E));\n        for (int v = 0; v < this.V; v++) {\n            stringBuilder.append(String.format(\"%d : \", v));\n            for (int w: adj(v)) {\n                stringBuilder.append(String.format(\"%d \", w));\n            }\n            stringBuilder.append(\"\\n\");\n        }\n        return stringBuilder.toString();\n    }\n}","language":"java","uuid":"0e405088-e4f7-46ab-b071-154d09057a87","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png"},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们再次修改一下类 DirectedGraph 如下"}],"disableDrag":false},{"type":"code-block","code":"import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\nimport java.util.TreeSet;\n\npublic class DirectedGraph {\n    private int E;\n    private int V;\n    private TreeSet<Integer>[] adj;\n\n    // 增加入度和出度的成员变量\n    private int[] inDegree;\n    private int[] outDegree;\n\n    public DirectedGraph(String filename) {\n        File file = new File(filename);\n        Scanner scanner = null;\n        try {\n            // 其他代码相同\n\n            this.inDegree = new int[V];\n            this.outDegree = new int[V];\n\n            for (int i = 0; i < this.E; i++) {\n                // 其他代码相同\n\n                adj[a].add(b);\n                // 在这里初始化入度和出度，a → b，a的出度增加，b的入度增加\n                inDegree[b]++;\n                outDegree[a]++;\n            }\n        } catch (FileNotFoundException e) {\n            e.printStackTrace();\n        } finally {\n            assert scanner != null;\n            scanner.close();\n        }\n    }\n\n    public int inDegree(int v) {\n        validateVertex(v);\n        return inDegree[v];\n    }\n\n    public int outDegree(int v) {\n        validateVertex(v);\n        return outDegree[v];\n    }\n\n    // 其他方法\n}","language":"java","uuid":"43583ea5-b8bc-4db4-82cb-8b3ad854dbbd","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"DFS"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"对于有向图来说，它的 DFS 代码和 BFS 代码同无向图的写法完全是一样的，因为在后文中需要用到 DFS 遍历，所以这里贴出有向图的 DFS 遍历代码"}],"disableDrag":false},{"type":"code-block","code":"import java.util.ArrayList;\n\npublic class DFSDirectedGraph {\n    private DirectedGraph graph;\n    // 深度优先前序遍历结果\n    private ArrayList<Integer> pre;\n    // 深度优先后序遍历结果\n    private ArrayList<Integer> post;\n    private boolean[] visited;\n\n    public DFSDirectedGraph(DirectedGraph graph) {\n        this.graph = graph;\n        this.pre = new ArrayList<>();\n        this.post = new ArrayList<>();\n        this.visited = new boolean[graph.V()];\n\n        for (int v = 0; v < graph.V(); v++) {\n            if (!visited[v]) {\n                dfs(v);\n            }\n        }\n    }\n\n    private void dfs(int v) {\n        visited[v] = true;\n        pre.add(v);\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w);\n            }\n        }\n        post.add(v);\n    }\n\n    public ArrayList<Integer> pre() {\n        return pre;\n    }\n\n    public ArrayList<Integer> post() {\n        return post;\n    }\n}","language":"java","uuid":"05e113e7-7904-4372-992d-12aab8a66c1a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可见上面的代码与无向图的 DFS 并无不同。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"有向图的环检测"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"检测有向图中是否存在环是一件很有必要的事情"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如果将上面的图看做是一个课程之间的依赖关系，如果图中存在环，说明课程之间相互依赖，学习课程 A 之前需要先学习课程 B，而学习课程 B 之前又需要先学习课程 A，这样的学习顺序肯定是有问题的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我们想一想我们在无向图中是怎么做环检测的，我们使用 DFS 遍历，当遍历到一个节点时，如果某个邻接节点已经被访问了，并且不是它的父亲节点，我们就可以认为图中存在一个环。但是对于有向图就不一样了"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106120074-e16af480-6190-11eb-8820-185600aa2852.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106120074-e16af480-6190-11eb-8820-185600aa2852.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"上面的动图是优先遍历的顺序，最后我们来到了节点 3"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106120378-4888a900-6191-11eb-915a-1bcbd3df3339.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106120378-4888a900-6191-11eb-915a-1bcbd3df3339.png"},{"type":"paragraph","children":[{"type":"formatted","text":"此时我们发现节点 3 的相邻节点 2 已经被访问过了，并且节点 2 不是 3 的上一个节点，但是我们能说图中存在一个环吗? 不能，因为节点 2 无法到达节点 3，所以形成不了一个环。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"此时我们需要另外一个变量来表示节点是否在路径上，如果一个节点访问邻接节点时发现该节点已经被访问过且在路径上，我们就可以说构成了一个环。"}],"disableDrag":false},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"什么叫在路径上，如果这个节点还没有回溯到上一个节点，我们就说这个节点在路径上。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们在访问到节点 w 时，节点 v 还在路径上，说明节点 v 可以到达节点 w，如果此时节点 w 可以到达节点 v 不就说明存在一个环吗。"}],"disableDrag":false},{"type":"code-block","code":"public class DirectedCycleDetect {\n    private DirectedGraph graph;\n    private boolean[] visited;\n    // onPath[w] 表示节点 w 是否在路径上\n    private boolean[] onPath;\n    private boolean hasCycle;\n\n    public DirectedCycleDetect(DirectedGraph graph) {\n        this.graph = graph;\n        this.visited = new boolean[graph.V()];\n        this.onPath = new boolean[graph.V()];\n        this.hasCycle = false;\n\n        for (int v = 0; v < graph.V(); v++) {\n            if (!visited[v]) {\n                if (dfs(v)) {\n                    hasCycle = true;\n                    break;\n                }\n            }\n        }\n    }\n\n    private boolean dfs(int v) {\n        visited[v] = true;\n        onPath[v] = true;\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                if (dfs(w)) {\n                    return true;\n                }\n            // 通无向图不同，2 -> 1 -> 2 也是一个环\n            } else if (onPath[w]) {\n                return true;\n            }\n        }\n        // 回溯到上一个节点时就不在路径上了\n        onPath[v] = false;\n        return false;\n    }\n\n    public boolean isHasCycle() {\n        return hasCycle;\n    }\n}","language":"java","uuid":"54840ffc-3a46-477c-b696-fa185659044d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"拓扑排序"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"还是对于下面的这么一副图"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106105023-4406c500-617e-11eb-98d5-1f37daf426c0.png"},{"type":"paragraph","children":[{"type":"formatted","text":"假设上面的节点代表一门课程的话，我们想知道应该以什么样的顺序学习所有的课程，这其实就是在寻找图的拓扑排序。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"那么我们寻找图的拓扑排序呢? 还是以学习课程举例，要学习一门课，那么这门就不能依赖于任何一门其他的课，或者这门课已经被学过了，就比如上面我们应该先学习课程 0，因为没有任何课程指向它，它不依赖于任何课程，以图论的语言来说，因为节点 0 的入度为 0，所以先学习课程 0。"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106123639-22fd9e80-6195-11eb-84e9-e970c294a8b4.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106123639-22fd9e80-6195-11eb-84e9-e970c294a8b4.png"},{"type":"paragraph","children":[{"type":"formatted","text":"学习完课程 0 之后，为了表示这门课程已经学过，我们将依赖于节点 0 的节点的入度减一"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106124358-fac26f80-6195-11eb-91b2-38f37d808597.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106124358-fac26f80-6195-11eb-91b2-38f37d808597.png"},{"type":"paragraph","children":[{"type":"formatted","text":"接下来我们应该学习哪门课呢? 当然是入度为 0 的课，表示不需要前置课程或者前置课程已经学过了，所以我们接下来学习课程 1，并且将依赖课程 1 的其他课程的入度减一"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106124153-bc2cb500-6195-11eb-82fb-113b86e5c623.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106124153-bc2cb500-6195-11eb-82fb-113b86e5c623.png"},{"type":"paragraph","children":[{"type":"formatted","text":"接下来还是学习入度为 0 的课程，即课程 3，并且更新依赖课程 3 的其他课程的入度"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106124528-25acc380-6196-11eb-9cdb-20dcc46f675a.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106124528-25acc380-6196-11eb-9cdb-20dcc46f675a.png"},{"type":"paragraph","children":[{"type":"formatted","text":"接着学习课程 `2`，因为它的入度为 `0`，然后更新依赖课程 `2` 的其他课程的入度"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106124528-25acc380-6196-11eb-9cdb-20dcc46f675a.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106124528-25acc380-6196-11eb-9cdb-20dcc46f675a.png"},{"type":"paragraph","children":[{"type":"formatted","text":"最后学习课程 4"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106125147-c0a59d80-6196-11eb-8942-7aa3c9077e93.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106125147-c0a59d80-6196-11eb-8942-7aa3c9077e93.png"},{"type":"paragraph","children":[{"type":"formatted","text":"所以最终课程的学习顺序为 0 → 1 → 3 → 2 → 4，也就是拓扑排序的结果。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们对图做拓扑排序，就重复做两步："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"选择入度为 0 的节点"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"更新相邻节点的入度"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外一个需要注意的问题就是，拓扑排序只对有向无环图(DAG) 有效，如果图中有环，二者相互依赖，就不知道先学习哪一门课程了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在代码的实现方面，我们使用队列来存储入度为 0 的节点，在更新相邻节点入度的时候，如果入度为 0 则添加进队列中，每次从队列取出一个值时，我们添加到一个 List 中，表示拓扑排序的顺序。另外如果图中存在环的话，那么这个 List 中保存的节点数目肯定小于整个图的节点数目，此时可以使用拓扑排序来做环检测。"}],"disableDrag":false},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.Queue;\n\npublic class TopoSort {\n    private DirectedGraph graph;\n    private int[] inDegree;\n    private ArrayList<Integer> result = new ArrayList<>();\n    private boolean hasCycle = false;\n\n    public TopoSort(DirectedGraph graph) {\n        this.graph = graph;\n        this.inDegree = new int[graph.V()];\n\n        Queue<Integer> queue = new LinkedList<>();\n        for (int v = 0; v < graph.V(); v++) {\n            inDegree[v] = graph.inDegree(v);\n            if (inDegree[v] == 0) {\n                queue.add(v);\n            }\n        }\n\n        while (!queue.isEmpty()) {\n            int v = queue.remove();\n            result.add(v);\n            for (int w: graph.adj(v)) {\n                inDegree[w]--;\n                if (inDegree[w] == 0) {\n                    queue.add(w);\n                }\n            }\n        }\n\n        if (result.size() != graph.V()) {\n            hasCycle = true;\n            result.clear();\n        }\n    }\n\n    public boolean isHasCycle() {\n        return hasCycle;\n    }\n\n    public ArrayList<Integer> result() {\n        return result;\n    }\n}","language":"java","uuid":"266bdb19-755d-4198-8aa0-5dcbd71b6cd6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"此时我们在介绍一种拓扑排序的算法，它需要借助于深度优先后序遍历。回顾一个后序遍历的概念，后序遍历指的是先访问完相邻节点，然后访问自己。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"对于有向图意味着什么，意味着先访问依赖自己的节点，然后访问自己，说明自己是在依赖于自己的节点之后访问的，如果我们对深度优先后序遍历做一个逆序，这个顺序就表示自己在依赖于自己的节点之前被访问的，这不就是拓扑排序的结果吗。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"使用深度优先后序遍历有一个缺点就是它不能做环检测，虽然图中有环，但是还是能够深度优先后序遍历，只不过此时结果便没有意义了。所以在使用这个方法做拓扑排序之前，我们需要使用我们之前讲解的有向图的环检测算法进行环检测"}],"disableDrag":false},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Collections;\n\npublic class TopoSort2 {\n    private DirectedGraph graph;\n    private boolean hasCycle;\n    private ArrayList<Integer> result = new ArrayList<>();\n\n    public TopoSort2(DirectedGraph graph) {\n        this.graph = graph;\n        // 使用之前的讲解的环检测类进行环检测\n        DirectedCycleDetect directedCycleDetect = new DirectedCycleDetect(graph);\n        this.hasCycle = directedCycleDetect.isHasCycle();\n\n        if (hasCycle) {\n            return;\n        }\n\n        // 对图做深度优先后序遍历\n        DFSDirectedGraph dfsDirectedGraph = new DFSDirectedGraph(graph);\n        for (int v: dfsDirectedGraph.post()) {\n            result.add(v);\n        }\n        // 对后序遍历取逆序\n        Collections.reverse(result);\n    }\n\n    public boolean isHasCycle() {\n        return hasCycle;\n    }\n\n    public ArrayList<Integer> result() {\n        return result;\n    }\n}","language":"java","uuid":"30f114e3-bb6f-4115-886b-5980bf8634a7","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"强连通分量"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"现在还有一个问题就是我们怎么检测图中有多少个强联通分量，以及每一个强联通分量中包含哪些节点。所谓的强联通分量指如果某些节点互相可达，那么这些节点就组成了一个强联通分量。"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106129562-517e7800-619b-11eb-85ea-b99c9d75cd30.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106129562-517e7800-619b-11eb-85ea-b99c9d75cd30.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如上图就三个强联通分量，每个联通分量内部的节点都是互相可达的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在求解有向图的联通分量之前，我们回顾一下无向图的联通分量是如何求解的，我们从任意一个节点开始做 DFS，每次做一次 DFS 就表示有一个联通分量"}],"disableDrag":false},{"type":"code-block","code":"for (int i = 0; i < visited.length; i++) {\n    if (!visited[i]) {\n        cccount++; // 联通分量个数增加\n        dfs(i);\n    }\n}","language":"java","uuid":"d1b9dc5f-69f4-4615-8370-04831e79969a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是对于有向图我们能从任意一个节点开始吗? 答案是不行，而是要以特定的顺序遍历。如果我们将一个个的联通分量看做是一个图中的节点"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106132822-64934700-619f-11eb-900d-620b0c73ba07.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106132822-64934700-619f-11eb-900d-620b0c73ba07.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们分别遍历联通分量 "},{"type":"inline-math","tex":"E \\rightarrow C \\rightarrow A \\rightarrow D \\rightarrow B","children":[{"type":"formatted","text":"E \\rightarrow C \\rightarrow A \\rightarrow D \\rightarrow B"}]},{"type":"formatted","text":" 中的节点，那么每做一次 DFS 就就可以统计联通分量数目，那么为什么会是上面的顺序呢?"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"为什么从 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 开始遍历，因为 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 只依赖其他联通分量的节点，没有其他联通分量依赖于它，所以从 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 中的某个节点做 DFS，只能遍历到联通分量 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 中的节点。同理遍历完了 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":"，此时 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 也只依赖于其他联通分量，虽然 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 依赖于 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":"，但是 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 已经遍历完毕了，所以此时从 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中的节点开始做 DFS 只能遍历到 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中所有的节点，剩余的也是同理。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"也就是说依赖于自己的联通分量要被先遍历到，也就是相邻节点要在自己之前被访问到，其实就是深度优先后序遍历的顺序，所以 "},{"type":"inline-math","tex":"E \\rightarrow C \\rightarrow A \\rightarrow D \\rightarrow B","children":[{"type":"formatted","text":"E \\rightarrow C \\rightarrow A \\rightarrow D \\rightarrow B"}]},{"type":"formatted","text":" 这个顺序其实是深度优先后序遍历的顺序。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是这个深度优先后序遍历指的是以联通分量作为节点进行的遍历，如果我们从任意一个节点做深度优先后序遍历是得不到这个顺序的。例如我们从联通分量中的节点 "},{"type":"inline-math","tex":"D","children":[{"type":"formatted","text":"D"}]},{"type":"formatted","text":" 开始遍历，接着来到了联通分量 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":"，虽然遍历完联通分量 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中所有节点之前肯定需要遍历完联通分量 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":"，但是不能保证所有 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 中的节点都在 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 之前被遍历，即可能有这样的顺序 "},{"type":"inline-math","tex":"C_1 \\rightarrow E \\rightarrow C_2 \\rightarrow \\cdots","children":[{"type":"formatted","text":"C_1 \\rightarrow E \\rightarrow C_2 \\rightarrow \\cdots"}]},{"type":"formatted","text":"，这样的顺序是我们不想要的，因为我们必须从联通分量 $E$ 中的节点开始遍历。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"虽然上面的深度优先遍历不能严格按照 "},{"type":"inline-math","tex":"E \\rightarrow C \\rightarrow A \\rightarrow D \\rightarrow B","children":[{"type":"formatted","text":"E \\rightarrow C \\rightarrow A \\rightarrow D \\rightarrow B"}]},{"type":"formatted","text":" 的顺序遍历，但是我们发现一定有分量 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中的节点在分量 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 遍历完之后遍历的 "},{"type":"inline-math","tex":"C_1 \\rightarrow E \\rightarrow C_2 \\rightarrow \\cdots","children":[{"type":"formatted","text":"C_1 \\rightarrow E \\rightarrow C_2 \\rightarrow \\cdots"}]},{"type":"formatted","text":"，例如 "},{"type":"inline-math","tex":"C_2","children":[{"type":"formatted","text":"C_2"}]},{"type":"formatted","text":" 在遍历完 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 之后被遍历了，这给了我们灵感，如果我们取个逆，就可以得到一定有 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中的节点在 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 分量节点被遍历之前遍历。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"而我们想要的是一定要 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 中的节点在 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中的节点被遍历之前遍历，怎么办，我们将整个图的方向改变一下，原来是 "},{"type":"inline-math","tex":"a \\rightarrow b","children":[{"type":"formatted","text":"a \\rightarrow b"}]},{"type":"formatted","text":"，现在变为 "},{"type":"inline-math","tex":"b \\rightarrow a","children":[{"type":"formatted","text":"b \\rightarrow a"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false},{"type":"image","url":"https://user-images.githubusercontent.com/29890094/106138841-9ad4c480-61a7-11eb-9c67-aaef3e022e94.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://user-images.githubusercontent.com/29890094/106138841-9ad4c480-61a7-11eb-9c67-aaef3e022e94.png"},{"type":"paragraph","children":[{"type":"formatted","text":"然后进行深度优先后序遍历，然后取个逆就可以保证一定有在 "},{"type":"inline-math","tex":"E","children":[{"type":"formatted","text":"E"}]},{"type":"formatted","text":" 中的节点在 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中的节点遍历之前被遍历到，同理可以得到一定有 "},{"type":"inline-math","tex":"C","children":[{"type":"formatted","text":"C"}]},{"type":"formatted","text":" 中的节点在 "},{"type":"inline-math","tex":"D","children":[{"type":"formatted","text":"D"}]},{"type":"formatted","text":" 中的节点被遍历之前被遍历到，这就达到我们的目的，我们再根据这个顺序做 DFS 就可以统计出联通分量的个数了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"上面这个算法就是 Kosaraju 算法，总结上面的步骤如下："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"图翻转得到反图"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"对反图做深度优先后序遍历，然后对遍历结果取逆"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"根据取逆后的结果依次做 DFS，统计联通分量个数"}],"disableDrag":false}]}]},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.Collections;\nimport java.util.TreeSet;\n\npublic class StrongCC {\n    private DirectedGraph graph;\n    private int[] visited;\n    private int scccount;\n\n    public StrongCC(DirectedGraph graph) {\n        this.graph = graph;\n        this.visited = new int[graph.V()];\n        Arrays.fill(visited, -1);\n        this.scccount = 0;\n\n        // 翻转图\n        TreeSet<Integer>[] reverse = new TreeSet[graph.V()];\n        for (int i = 0; i < graph.V(); i++) {\n            reverse[i] = new TreeSet<>();\n        }\n        for (int v = 0; v < graph.V(); v++) {\n            for (int w: graph.adj(v)) {\n                reverse[w].add(v);\n            }\n        }\n        // 对翻转图做 DFS\n        DFSDirectedGraph dfsDirectedGraph = new DFSDirectedGraph(new DirectedGraph(reverse));\n\n        // 对深度优先后序遍历取逆\n        ArrayList<Integer> res = dfsDirectedGraph.post();\n        Collections.reverse(res);\n\n        // 依次做 DFS，每做一次 DFS，联通分量个数增加\n        for(int v: res) {\n            if (visited[v] == -1) {\n                dfs(v, scccount);\n                scccount++;\n            }\n        }\n    }\n\n    private void dfs(int v, int id) {\n        visited[v] = id;\n        for (int w: graph.adj(v)) {\n            if (visited[w] == -1) {\n                dfs(w, id);\n            }\n        }\n    }\n\n    public ArrayList<Integer>[] components() {\n        ArrayList<Integer>[] results = new ArrayList[scccount];\n\n        for (int i = 0; i< scccount; i++) {\n            results[i] = new ArrayList<>();\n        }\n\n        for (int v = 0; v < graph.V(); v++) {\n            results[visited[v]].add(v);\n        }\n        return results;\n    }\n}","language":"java","uuid":"9a9abf75-4839-4456-ba4d-4c198a3c29cc","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":""}],"disableDrag":false}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"有向图算法","href":"/docs/document/1/47.html"}],"prevPage":{"title":"Floyed 算法","href":"/docs/document/1/46.html"},"nextPage":{"title":"网络流与最大流","href":"/docs/document/1/52.html"},"createTime":1702090428157,"updateTime":1753371070281,"currentPath":"/docs/document/1/47.html"},"meta":{"type":"doc","publishTime":1764822964070}};
