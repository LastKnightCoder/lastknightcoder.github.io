      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":10,"title":"深度优先遍历","content":[{"type":"paragraph","children":[{"type":"formatted","text":"所谓图的遍历就是按照某种顺序访问图中所有的节点，根据访问的顺序不同，可以分为两类："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"深度优先遍历"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"广度优先遍历"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"在本节中讲解深度优先遍历。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"概念"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"所谓深度优先遍历(Depth First Search，简称 DFS)，是指在遍历时，尽可能深的访问图的节点。为了更好的理解图的深度优先遍历，我们先看看树的深度优先遍历，与图的深度优先遍历一样，树的深度优先遍历也是指尽可能深的访问树的节点，也就是说如果一个节点有孩子节点，那么我们下一步就应该遍历它的孩子节点(深度)，如下"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010161552392022-04-23-13-31-06.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010161552392022-04-23-13-31-06.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"从上面的动图可以看出，当我们遍历完当前节点以后，如果该节点有孩子节点，那么接下来我们去遍历孩子节点，我们的遍历策略就是尽可能深的遍历。类比于图，对于图来说，如果一个图的节点有邻接节点，那么在遍历完该节点后，我们下一步就去遍历它的邻接节点"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010161613102022-04-23-13-31-56.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010161613102022-04-23-13-31-56.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"这就是图的深度优先遍历，上图深度优先遍历访问的顺序是 "},{"type":"inline-math","tex":"[0, 1, 3, 2, 4, 5]","children":[{"type":"formatted","text":"[0, 1, 3, 2, 4, 5]"}]},{"type":"formatted","text":"，我们将在下面的编程中验证是否正确。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"实现"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"图的遍历与树的遍历有一处不同，那就是重复访问问题。树不会发生重复访问的问题，这是因为树的节点只能通过父节点访问到，只有一种路径到达该节点，所以我们不必担心；但是对于图来说，一个图中的节点可以与多个节点进行连接，这就意味着有多种路径到达该节点，这就会导致某节点已经通过一个相邻的节点被访问，但是它还是有可能通过别的相邻节点再次被访问。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"所以我们需要通过一个标志来表示某个图的节点是否已经被访问过了，如果已经被访问过了，那么我们就不能再次访问，我们通过一个 "},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 数组来表示图中的某个节点是否已经被访问过了，"},{"type":"formatted","text":"visited","code":true},{"type":"formatted","text":" 数组是一个 "},{"type":"formatted","text":"boolean","code":true},{"type":"formatted","text":" 类型的数组，值为 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":" 时就表示该节点已经被访问过了，例如 "},{"type":"formatted","text":"visited[0] = true","code":true},{"type":"formatted","text":" 就表示节点 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 已经被访问过了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"下面我就将编程具体实现："}],"disableDrag":false},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\n\npublic class DFSGraph {\n    // 图的表示中定义的 Graph 接口\n    private Graph graph;\n    // 保存深度优先遍历的顺序\n    private ArrayList<Integer> order;\n    // 保存节点是否已经被访问过\n    private boolean[] visited;\n\n    public DFSGraph(Graph graph) {\n        this.graph = graph;\n        order = new ArrayList<>(graph.V());\n        // 初始化 visited 中的元素值为 false\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n    }\n\n    // DFS 的实现，首先从节点 0 开始遍历\n    public void dfs() {\n        dfs(0);\n    }\n\n    private void dfs(int v) {\n        // 标记当前节点为访问过的状态\n        visited[v] = true;\n        // 向 order 中添加当前节点\n        order.add(v);\n        \n        for (int w: graph.adj(v)) {\n            // 如果邻接节点没有被访问过，那么遍历该邻接节点\n            if (!visited[w]) {\n                dfs(w);\n            }\n        }\n    }\n    \n    public Iterable<Integer> order() {\n        return order;\n    }\n\n    public static void main(String[] args) {\n        // 使用邻接表表示图\n        Graph graph = new AdjSet(\"g.txt\");\n        // 实例化一个 DFSGraph\n        DFSGraph dfsGraph = new DFSGraph(graph);\n        // 调用 dfs 方法进行深度优先遍历\n        dfsGraph.dfs();\n        // 打印出深度优先遍历的顺序\n        System.out.println(dfsGraph.order());\n    }\n}","language":"java","uuid":"e51cdf4c-6909-4c20-9ea3-e9377cda1e4a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 g.txt 的内容如下"}],"disableDrag":false},{"type":"code-block","code":"6 5\n0 1\n0 2\n1 3\n2 4\n2 5","language":"java","uuid":"f53816eb-7777-4769-a550-00b53e4d6cf0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个文件表示的图与我们在上面的动图中看到的图是一样的，我们来看下打印的结果"}],"disableDrag":false},{"type":"code-block","code":"[0, 1, 3, 2, 4, 5]","language":"java","uuid":"0379cfee-de0c-409a-9ec6-6331ff0ad5d1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这与我们在动图中看到的遍历顺序是一致的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是上面我们实现的深度优先遍历有一个小 bug，那就是上面的深度优先遍历只适合只有一个联通分量的图，如果有多个联通分量，那么其他联通分量中的节点就永远不可能被访问到，如"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231334152022-04-23-13-34-15.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231334152022-04-23-13-34-15.png"},{"type":"paragraph","children":[{"type":"formatted","text":"既然图中有节点永远不会被访问到，那么还能叫图的遍历吗，图的遍历可是要求能够访问图中所有的节点的，所以我们对代码进行改进"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231334322022-04-23-13-34-32.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231334322022-04-23-13-34-32.png"},{"type":"paragraph","children":[{"type":"formatted","text":"这次我们不只是从节点 0 开始遍历，在遍历完节点 0 所在的联通分量以后，我们检查是否还有节点没有遍历，即是否存在别的联通分量，如果有，那么我们还有遍历该节点所在的联通分量。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在最后我们进行一个扩展，我们知道树的深度优先遍历分为三种"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"前序遍历"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"中序遍历"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"后序遍历"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"图没有中序遍历，它分为两种"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"深度优先前序遍历"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"深度优先后序遍历"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"刚刚我们所编程的只是图的深度优先前序遍历，现在我们不妨写一下后序遍历的代码。在写代码之前，我们先明确后序遍历的这个后指的是什么，这个后在树的遍历中指的是先访问当前节点的孩子节点，然后访问当前节点，也就是访问当前节点在访问当前节点的孩子节点之后。类比于图，这个后指的就是先访问当前节点的邻接节点，然后再访问当前节"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010281027282022-04-23-13-35-11.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010281027282022-04-23-13-35-11.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"上面后序遍历的顺序为 "},{"type":"inline-math","tex":"[3, 1, 4, 5, 2, 0]","children":[{"type":"formatted","text":"[3, 1, 4, 5, 2, 0]"}]},{"type":"formatted","text":"，我们重构一下上面的代码，我们使用 "},{"type":"formatted","text":"preorder","code":true},{"type":"formatted","text":" 来保存前序遍历的结果，使用 "},{"type":"formatted","text":"postorder","code":true},{"type":"formatted","text":" 来保存后序遍历的结果："}],"disableDrag":false},{"type":"code-block","code":"import java.util.ArrayList;\nimport java.util.Arrays;\n\npublic class DFSGraph {\n    private Graph graph;\n    private ArrayList<Integer> preorder;\n    private ArrayList<Integer> postorder;\n    private boolean[] visited;\n\n    public DFSGraph(Graph graph) {\n        this.graph = graph;\n        preorder = new ArrayList<>(graph.V());\n        postorder = new ArrayList<>(graph.V());\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n    }\n\n    public void dfs() {\n        for (int i = 0; i < visited.length; i++) {\n            if (!visited[i]) {\n                dfs(i);\n            }\n        }\n    }\n\n    private void dfs(int v) {\n        visited[v] = true;\n        // 前序遍历：在遍历相邻节点前，遍历当前节点\n        preorder.add(v);\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w);\n            }\n        }\n        // 后序遍历：遍历相邻节点后，再遍历当前节点\n        postorder.add(v);\n    }\n\n    public Iterable<Integer> preorder() {\n        return preorder;\n    }\n\n    public Iterable<Integer> postorder() {\n        return postorder;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g.txt\");\n        DFSGraph dfsGraph = new DFSGraph(graph);\n        dfsGraph.dfs();\n        System.out.println(dfsGraph.postorder());\n    }\n}","language":"java","uuid":"3aa390f4-6cde-4385-8c8e-d673ad527e3e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"打印的结果为"}],"disableDrag":false},{"type":"code-block","code":"[3, 1, 4, 5, 2, 0]","language":"java","uuid":"c0fd919f-979a-4c2b-b301-c2163e935123","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"相关应用"}],"level":2},{"type":"document-card-list","documentItemId":10,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"深度优先遍历","href":"/docs/document/1/10.html"}],"prevPage":{"title":"图的表示","href":"/docs/document/1/9.html"},"nextPage":{"title":"联通分量","href":"/docs/document/1/27.html"},"createTime":1701519752629,"updateTime":1753371082612,"currentPath":"/docs/document/1/10.html"},"meta":{"type":"doc","publishTime":1764820858544}};
    </script>
