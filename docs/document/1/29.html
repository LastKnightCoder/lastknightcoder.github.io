      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"数据结构","children":[{"title":"树结构","children":[{"title":"二分搜索树","href":"/docs/document/1/8.html"},{"title":"优先队列和堆","href":"/docs/document/1/17.html","children":[{"title":"基于堆的优先队列"}]},{"title":"线段树","href":"/docs/document/1/19.html"},{"title":"Trie","href":"/docs/document/1/20.html"},{"title":"并查集","href":"/docs/document/1/21.html"},{"title":"AVL 树","href":"/docs/document/1/22.html"},{"title":"红黑树","href":"/docs/document/1/23.html"},{"title":"哈希表","href":"/docs/document/1/31.html"}]},{"title":"图结构","children":[{"title":"图的表示","href":"/docs/document/1/9.html"},{"title":"深度优先遍历","href":"/docs/document/1/10.html","children":[{"title":"联通分量","href":"/docs/document/1/27.html"},{"title":"路径问题","href":"/docs/document/1/28.html"},{"title":"无向图的环检测","href":"/docs/document/1/29.html"},{"title":"二分图检测","href":"/docs/document/1/30.html"},{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"}]},{"title":"广度优先遍历","href":"/docs/document/1/32.html","children":[{"title":"二进制矩阵中的最短路径","href":"/docs/document/1/34.html"},{"title":"打开转盘锁","href":"/docs/document/1/35.html"},{"title":"倒水智力题","href":"/docs/document/1/36.html"},{"title":"滑动谜题","href":"/docs/document/1/37.html"}]},{"title":"桥和割点","href":"/docs/document/1/38.html"},{"title":"哈密尔顿回路","href":"/docs/document/1/39.html","children":[{"title":"不同路径","href":"/docs/document/1/40.html"}]},{"title":"欧拉回路","href":"/docs/document/1/41.html"},{"title":"最小生成树","href":"/docs/document/1/42.html"},{"title":"最短路径算法","href":"/docs/document/1/43.html","children":[{"title":"Dijkstra 算法","href":"/docs/document/1/44.html"},{"title":"Bellman-Ford 算法","href":"/docs/document/1/45.html"},{"title":"Floyed 算法","href":"/docs/document/1/46.html"}]},{"title":"有向图算法","href":"/docs/document/1/47.html"},{"title":"网络流与最大流","href":"/docs/document/1/52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":29,"title":"无向图的环检测","content":[{"type":"paragraph","children":[{"type":"formatted","text":"我们怎么判断一幅图有没有环呢? 很简单，我们使用深度优先遍历，当访问到某节点时，如果该节点的某邻接节点已经被访问过，并且该邻接节点不是它的上一个节点，那么就说明该图中包含一个环"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202010272127012022-04-23-13-47-46.gif","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"明白这一点以后我们就可以编写代码了"}]},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class CircleDetection {\n    private Graph graph;\n    private boolean[] visited;\n    private boolean hasCircle;\n\n    public CircleDetection(Graph graph) {\n        this.graph = graph;\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n        hasCircle = false;\n    }\n\n    public void dfs() {\n        // 任一联通分量中有环，那么图中就有环\n        for (int i = 0; i < visited.length; i++) {\n            if (!visited[i]) {\n                dfs(i, i);\n            }\n        }\n    }\n\n    private void dfs(int v, int parent) {\n        visited[v] = true;\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                dfs(w, v);\n                // 进入下面的 if 判断就说明 w 已经访问过了\n                // 如果 w 不是它的上一个节点，说明有环\n            } else if (w != parent){\n                hasCircle = true;\n            }\n        }\n    }\n\n    public boolean hasCircle() {\n        return this.hasCircle;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g.txt\");\n        CircleDetection circleDetection = new CircleDetection(graph);\n        circleDetection.dfs();\n        System.out.println(circleDetection.hasCircle()); // true\n    }\n}","language":"java","uuid":"bc04a73a-f4ff-46ed-9bee-14dc96218421","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 g.txt 的内容如下"}]},{"type":"code-block","code":"7 6\n0 1\n0 2\n1 3\n2 5\n2 4\n4 5","language":"java","uuid":"dcd9af25-c7d5-43df-9816-9f5a5e86e9f1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所对应的图如下"}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/GraphBasis-第 6 页.drawio2022-04-23-13-41-32.svg","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们将节点 2 和 5 之间的边断开，那么图中是没有环的，新建 g2.txt 如下"}]},{"type":"code-block","code":"7 5\n0 1\n0 2\n1 3\n2 4\n4 5","language":"java","uuid":"b5931297-4abc-4dc4-96a0-3291b4b82613","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"Graph graph2 = new AdjSet(\"g2.txt\");\nCircleDetection circleDetection2 = new CircleDetection(graph2);\ncircleDetection2.dfs();\nSystem.out.println(circleDetection2.hasCircle()); // false","language":"java","uuid":"8d6cc348-d3d2-4f9c-83e6-69de3ba213cb","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外，我们可以提前返回进行优化，如果我们已经找到了环，那么我们可以提前终止，后面就不需要继续查找了，我们修改 dfs 的返回值为 boolean 类型，这时 dfs 函数的含义就是从顶点  开始，判断图中是否有环"}]},{"type":"code-block","code":"public void dfs() {\n    for (int i = 0; i < visited.length; i++) {\n        if (!visited[i]) {\n            if (dfs(i, i)) {\n                hasCircle = true;\n                // 不用查找其他联通分量了\n                break;\n            }\n        }\n    }\n}\n\nprivate boolean dfs(int v, int parent) {\n    visited[v] = true;\n    for (int w: graph.adj(v)) {\n        if (!visited[w]) {\n            if (dfs(w, v)) {\n                // 如果已经在某相邻节点中找到环，不用再遍历其他的相邻节点\n                return true;\n            }\n        } else if (w != parent){\n            // 如果已经找到环，不用继续向后遍历\n            return true;\n        }\n    }\n    return false;\n}","language":"java","uuid":"b8fb5dbb-4bfc-406e-9242-f4a4b74905ba","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"深度优先遍历","href":"/docs/document/1/10.html"},{"label":"无向图的环检测","href":"/docs/document/1/29.html"}],"prevPage":{"title":"路径问题","href":"/docs/document/1/28.html"},"nextPage":{"title":"二分图检测","href":"/docs/document/1/30.html"},"createTime":1701959506770,"updateTime":1743303640548,"currentPath":"/docs/document/1/29.html"},"meta":{"type":"doc","publishTime":1764822964067}};
