52.html","children":[{"title":"Ford-Fulkerson 思想","href":"/docs/document/1/53.html"},{"title":"Edmonds-Karp 算法","href":"/docs/document/1/54.html"},{"title":"棒球比赛","href":"/docs/document/1/55.html"}]},{"title":"匹配问题","href":"/docs/document/1/56.html","children":[{"title":"LCP04 覆盖","href":"/docs/document/1/57.html"}]}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document","active":true},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":30,"title":"二分图检测","content":[{"type":"paragraph","children":[{"type":"formatted","text":"什么叫二分图"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231354452022-04-23-13-54-45.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231354452022-04-23-13-54-45.png"},{"type":"paragraph","children":[{"type":"formatted","text":"二分图需要满足一下两个特点："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"图中的节点被划分为两部分"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"图中的边连接的是两个部分的节点"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上图中，节点 "},{"type":"inline-math","tex":"0, 3, 4, 5","children":[{"type":"formatted","text":"0, 3, 4, 5"}]},{"type":"formatted","text":" 是一部分，节点 "},{"type":"inline-math","tex":"1, 2, 6","children":[{"type":"formatted","text":"1, 2, 6"}]},{"type":"formatted","text":" 是一部分，两部分的节点我使用不同的颜色进行填充；且图中所有的边都连接的是两个部分的节点。很明显上面的图满足二分图的两个特点，所以上面的图是一个二分图，那接下来的问题是如何检测一个图是否是一个二分图呢?"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"首先明白下面两个图是等价的"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231355242022-04-23-13-55-25.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231355242022-04-23-13-55-25.png"},{"type":"paragraph","children":[{"type":"formatted","text":"但是我们很难从右边的图中分辨出两部分的节点。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解决这个问题的关键是图中的所有边连接的是两个不同部分的节点，如果我们将对图进行深度优先遍历的过程中对节点染色，相同部分的节点染为一个颜色，因为所有的边都连接的是不同部分的节点，这意味着任意节点的邻接节点的颜色和自己都是不同的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我们在遍历时将所有邻接节点的颜色染为和自己不一样，但是如果邻接节点已经染色，并且染的颜色和自己相同，与二分图的定义冲突，那么说明不是一个二分图，反之邻接节点染的颜色和自己不同，则继续遍历，如果遍历完整个图时都没有冲突，那么说明这个图就是一个二分图"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201028090157_c24914ad-773a-433f-b6e4-81c6217cba77.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201028090157_c24914ad-773a-433f-b6e4-81c6217cba77.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下："}],"disableDrag":false},{"type":"code-block","code":"import java.util.Arrays;\n\npublic class BinaryPartitionDetection {\n    private Graph graph;\n    private boolean[] visited;\n    // 以 0 1 表示不同颜色\n    private int[] colors;\n\n    // 表示该图是否为二分图\n    private boolean isBipartite;\n\n    public BinaryPartitionDetection(Graph graph) {\n        this.graph = graph;\n        visited = new boolean[graph.V()];\n        Arrays.fill(visited, false);\n        // 初始化 colors 为 -1，表示未染色\n        colors = new int[graph.V()];\n        Arrays.fill(colors, -1);\n\n        isBipartite = true;\n    }\n\n    public void dfs() {\n        for (int i = 0; i \u003c visited.length; i++) {\n            if (!visited[i]) {\n                // 如果在某联通分量中检测到不是二分图，不需要检测其他联通分量\n                if (!dfs(i, 0)) {\n                    isBipartite = false;\n                    break;\n                }\n            }\n        }\n    }\n\n    private boolean dfs(int v, int color) {\n        visited[v] = true;\n        // 染色\n        colors[v] = color;\n        for (int w: graph.adj(v)) {\n            if (!visited[w]) {\n                // 0 =\u003e 1 - color = 1\n                // 1 =\u003e 1 - color = 0\n                // 如果已经在遍历某邻接节点的过程中检测到不是二分图，不需要遍历其他邻接节点\n                if (!dfs(w, 1 - color)) {\n                    return false;\n                }\n                // 进入 else if 表示该节点已经被访问过\n                // 如果该节点的颜色与它的邻接节点相同，说明不是二分图，后面节点无需遍历\n            } else if (colors[v] == colors[w]) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    public boolean isBipartite() {\n        return isBipartite;\n    }\n\n    public static void main(String[] args) {\n        Graph graph = new AdjSet(\"g3.txt\");\n        BinaryPartitionDetection binaryPartitionDetection = new BinaryPartitionDetection(graph);\n        binaryPartitionDetection.dfs();\n        System.out.println(binaryPartitionDetection.isBipartite()); // true\n    }\n}","language":"java","uuid":"0d9b671d-871b-4c13-975d-4d7115859b9c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其中 g3.txt 的内容如下"}],"disableDrag":false},{"type":"code-block","code":"7 6\n0 1\n0 2\n1 3\n2 4\n2 5\n4 6","language":"java","uuid":"44d8b888-9e44-49a1-86e6-5e306ad7f3be","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所表示的图如下，与动图中的图相同"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231356242022-04-23-13-56-24.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231356242022-04-23-13-56-24.png"},{"type":"paragraph","children":[{"type":"formatted","text":"在上面的实现中也使用了提前终止的技术，使用该技术可以很方便的提前终止遍历，提高程序的性能。"}],"disableDrag":false}],"breadcrumb":[{"label":"数据结构","href":"/docs/document/1/8.html"},{"label":"图结构"},{"label":"深度优先遍历","href":"/docs/document/1/10.html"},{"label":"二分图检测","href":"/docs/document/1/30.html"}],"prevPage":{"title":"无向图的环检测","href":"/docs/document/1/29.html"},"nextPage":{"title":"岛屿的最大面积","href":"/docs/document/1/33.html"},"createTime":1701959719442,"updateTime":1753371076437,"currentPath":"/docs/document/1/30.html"},"meta":{"type":"doc","publishTime":1767266228182}};
