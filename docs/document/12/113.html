,{"title":"解码方法","href":"/docs/document/12/135.html"},{"title":"跳跃游戏II","href":"/docs/document/12/144.html"},{"title":"最大子序和","href":"/docs/document/12/151.html"},{"title":"最小路径和","href":"/docs/document/12/152.html"},{"title":"最长回文字符串","href":"/docs/document/12/153.html"},{"title":"不同的二叉搜索树","href":"/docs/document/12/116.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"}]},{"title":"深度优先遍历","children":[{"title":"单词搜索","href":"/docs/document/12/128.html"},{"title":"复原 IP 地址","href":"/docs/document/12/130.html"},{"title":"全排列","href":"/docs/document/12/138.html"},{"title":"子集","href":"/docs/document/12/148.html"},{"title":"组合","href":"/docs/document/12/149.html"},{"title":"组合总数","href":"/docs/document/12/150.html"},{"title":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"}]},{"title":"贪心","children":[{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},{"title":"加油站","href":"/docs/document/12/162.html"},{"title":"用最少数量的箭引爆气球","href":"/docs/document/12/164.html"}]},{"title":"数学","children":[{"title":"x 的平方根","href":"/docs/document/12/155.html"},{"title":"字符串相乘","href":"/docs/document/12/245.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":113,"title":"包含 min 函数的栈","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"定义栈的数据结构，请在该类型中实现一个能够得到栈的最小元素的 "},{"type":"formatted","text":"min","code":true},{"type":"formatted","text":" 函数。在该栈中，调用 "},{"type":"formatted","text":"min","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"push","code":true},{"type":"formatted","text":"、及 "},{"type":"formatted","text":"pop","code":true},{"type":"formatted","text":" 的时间复杂度都是 "},{"type":"inline-math","tex":"O(1)","children":[{"type":"formatted","text":"O(1)"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们第一个想到的办法就是使用一个变量来保存栈中的最小值，但是如果这个最小值被弹出了，那么我们怎么拿到此时栈中的最小值呢? 所以这个方法不可取，这里我们的方法是使用一个辅助栈来存储栈中的最小值，当我们向栈中添加一个元素时，我们也要向辅助栈中添加一个元素，但是向辅助栈中添加的元素不是随便添加的，这个栈的栈顶存储的是此时栈中的最小值，所以当栈添加一个元素时，如果这个元素比当前的最小元素还小，那么将这个元素添加到辅助栈中，如果这个元素没有此时的最小元素小，那么向辅助栈中再次添加此时的最小值"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/包含min函数的栈.drawio2022-04-23-15-29-12.svg","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/包含min函数的栈.drawio2022-04-23-15-29-12.svg","width":309.5833210315974},{"type":"paragraph","children":[{"type":"formatted","text":"我们使用辅助栈时，即使我们将最小元素弹出了，但是辅助栈中还是保存着下一最小元素，所以我们可以得到此时栈的最小值，即是辅助栈的栈顶元素，如下"}],"disableDrag":false},{"type":"code-block","code":"import java.util.Stack;\n\npublic class StackWithMin {\n    private Stack\u003cInteger\u003e stack;\n    // 辅助栈\n    private Stack\u003cInteger\u003e minStack;\n\n    public StackWithMin() {\n        stack = new Stack\u003c\u003e();\n        minStack = new Stack\u003c\u003e();\n    }\n\n    public void push(Integer value) {\n        stack.push(value);\n        if (minStack.isEmpty() || minStack.peek() \u003e value) {\n            // 比当前最小元素小，那么将这个元素添加到辅助栈中\n            minStack.push(value);\n        } else {\n            // 没有当前最小元素小，那么再次添加当前的最小元素到栈中\n            minStack.push(minStack.peek());\n        }\n    }\n\n    public Integer pop() {\n        if (stack.empty()) {\n            throw new RuntimeException(\"stack is empty\");\n        } \n\n        // 弹出时，辅助栈也要相应的弹出\n        minStack.pop();\n        return stack.pop();\n    }\n\n    public Integer min() {\n        if(minStack.isEmpty()) {\n            throw new RuntimeException(\"stack is empty\");\n        }\n        // 栈的最小值即是辅助栈的栈顶元素\n        return minStack.peek();\n    }\n}","language":"Java","uuid":"48567a96-d49e-48d3-8627-653a6c7c776d","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"栈"},{"label":"包含 min 函数的栈","href":"/docs/document/12/113.html"}],"prevPage":{"title":"除自身以外数组的乘积","href":"/docs/document/12/161.html"},"nextPage":{"title":"反转链表","href":"/docs/document/12/129.html"},"createTime":1728989660187,"updateTime":1762947377074,"currentPath":"/docs/document/12/113.html"},"meta":{"type":"doc","publishTime":1767266228451}};
