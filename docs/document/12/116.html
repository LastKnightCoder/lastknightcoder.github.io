tent":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个整数 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":"，求恰由 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 个节点组成且节点值从 "},{"type":"inline-math","tex":"1","children":[{"type":"formatted","text":"1"}]},{"type":"formatted","text":" 到 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 互不相同的二叉搜索树有多少种? 返回满足题意的二叉搜索树的种数。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例："}],"disableDrag":false},{"type":"code-block","code":"输入：n = 3\n输出：5","language":"","uuid":"b18c3f4e-2dcf-43c2-83e9-8692f297d971","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_80338495-a81d-4f0a-bba3-414b71acc392.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_80338495-a81d-4f0a-bba3-414b71acc392.png"},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"对于 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 个数，我们分别以每个数作为根节点，因为根节点是不一样的，所以产生的树是不会重复的。我们记 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 能够形成 "},{"type":"inline-math","tex":"G(n)","children":[{"type":"formatted","text":"G(n)"}]},{"type":"formatted","text":" 个二叉搜索树，以数字 "},{"type":"inline-math","tex":"i","children":[{"type":"formatted","text":"i"}]},{"type":"formatted","text":" 为根节点能产生 "},{"type":"inline-math","tex":"F(i)","children":[{"type":"formatted","text":"F(i)"}]},{"type":"formatted","text":"  个二叉搜索树，则可以得到"}],"disableDrag":false},{"type":"block-math","tex":"G(n) = \\sum_{i = 1}^{n} F(i)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于以 "},{"type":"inline-math","tex":"i","children":[{"type":"formatted","text":"i"}]},{"type":"formatted","text":" 为节点，那么 "},{"type":"inline-math","tex":"[1, i -1]","children":[{"type":"formatted","text":"[1, i -1]"}]},{"type":"formatted","text":" 总共 "},{"type":"inline-math","tex":"i - 1","children":[{"type":"formatted","text":"i - 1"}]},{"type":"formatted","text":" 个数形成它的左子树，而 "},{"type":"inline-math","tex":"[i + 1, n]","children":[{"type":"formatted","text":"[i + 1, n]"}]},{"type":"formatted","text":" 总共 "},{"type":"inline-math","tex":"n - i","children":[{"type":"formatted","text":"n - i"}]},{"type":"formatted","text":" 个数形成它的右子树，所以我们可以得到。由 "},{"type":"inline-math","tex":"G(n)","children":[{"type":"formatted","text":"G(n)"}]},{"type":"formatted","text":" 的定义可知，左子树总共有 "},{"type":"inline-math","tex":"G(i - 1)","children":[{"type":"formatted","text":"G(i - 1)"}]},{"type":"formatted","text":" 种可能，而右子树有 "},{"type":"inline-math","tex":"G(n-i)","children":[{"type":"formatted","text":"G(n-i)"}]},{"type":"formatted","text":" 种可能，所以得到以 "},{"type":"inline-math","tex":"i","children":[{"type":"formatted","text":"i"}]},{"type":"formatted","text":" 为根节点，总共有"}],"disableDrag":false},{"type":"block-math","tex":"F(i) = G(i - 1) \\times G(n - i)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从而得到 "},{"type":"inline-math","tex":"G(n)","children":[{"type":"formatted","text":"G(n)"}]},{"type":"formatted","text":" 的递归表达式"}],"disableDrag":false},{"type":"block-math","tex":"G(n) = \\sum_{i = 1}^{n} G(i - 1) \\times G(n - i)","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public int numTrees(int n) {\n    int[] dp = new int[n + 1];\n    dp[0] = 1;\n    dp[1] = 1;\n    if (n == 0 || n == 1) {\n        return dp[n];\n    }\n    for (int i = 2; i \u003c= n; i++) {\n        for (int j = 1; j \u003c= i; j++) {\n            dp[i] += (dp[j - 1] * dp[i - j]);\n        }\n    }\n    return dp[n];\n}","language":"java","uuid":"a976b346-20f0-4c2c-b0e1-42761329734a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/unique-binary-search-trees/","openEdit":false,"children":[{"type":"formatted","text":"不同的二叉搜索树"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"动态规划"},{"label":"不同的二叉搜索树","href":"/docs/document/12/116.html"}],"prevPage":{"title":"最长回文字符串","href":"/docs/document/12/153.html"},"nextPage":{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},"createTime":1728989957675,"updateTime":1752586974095,"currentPath":"/docs/document/12/116.html"},"meta":{"type":"doc","publishTime":1764823684261}};
