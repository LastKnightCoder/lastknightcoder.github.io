tent":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个只包含数字的字符串 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":"，用以表示一个 IP 地址，返回所有可能从 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":" 获得的 有效 IP 地址 。你可以按任何顺序返回答案。有效 IP 地址正好由四个整数(每个整数位于 0 到 255 之间组成，且不能含有前导 0)，整数之间用 "},{"type":"formatted","text":".","code":true},{"type":"formatted","text":" 分隔。例如："},{"type":"formatted","text":"\"0.1.2.201\"","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"\"192.168.1.1\"","code":true},{"type":"formatted","text":" 是有效 IP 地址，但是 "},{"type":"formatted","text":"\"0.011.255.245\"","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"\"192.168.1.312\"","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"\"192.168@1.1\"","code":true},{"type":"formatted","text":" 是无效 IP 地址。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：s = \"25525511135\"\n输出：[\"255.255.11.135\",\"255.255.111.35\"]","language":"java","uuid":"04af1bc4-ca8f-4450-bd7d-b2e54c929e44","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：s = \"0000\"\n输出：[\"0.0.0.0\"]","language":"java","uuid":"5256778f-1d25-4339-b5fd-845d0e2c3b4d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"定义辅助函数，递归调用辅助函数解决问题。辅助函数接收未处理的字符串以及部分 ip 分组，例如对于一个字符串 "},{"type":"formatted","text":"\"25525511135\"","code":true},{"type":"formatted","text":"，那么传入该辅助函数的参数可能为 "},{"type":"formatted","text":"(\"11135\", [255, 255])","code":true},{"type":"formatted","text":"，当字符串处理完毕时结束递归调用，或者 ip 分组中元素个数大于 4 也可停止递归调用。"}],"disableDrag":false},{"type":"code-block","code":"List<String> results = new ArrayList<>();\npublic List<String> restoreIpAddresses(String s) {\n    // 长度不够，直接返回\n    if (s.length() < 4) {\n        return results;\n    }\n    restoreIpAddresses(s, new ArrayList<>());\n    return results;\n}\n/**\n *\n * @param leftString 剩余未处理的字符串\n * @param ip 保存ip地址的各个部分，如 [1, 1, 1] [255, 255, 1, 3]\n */\nprivate void restoreIpAddresses(String leftString, List<String> ip) {\n    // ip 超过四个部分，无效\n    if (ip.size() > 4) {\n        return;\n    }\n    // 长度不够或者超出，无效\n    int leftL = leftString.length();\n    if (leftL < (4 - ip.size()) || leftL > (4 - ip.size()) * 3) {\n        return;\n    }\n    // 字符串处理完毕，并且ip中正好有四个部分，取出ip中的元素拼接\n    if (ip.size() == 4 && leftL == 0) {\n        StringBuilder stringBuilder = new StringBuilder();\n        for (int i = 0; i < ip.size(); i++) {\n            stringBuilder.append(ip.get(i));\n            if (i != ip.size() - 1) {\n                stringBuilder.append((\".\"));\n            }\n        }\n        results.add(stringBuilder.toString());\n        return;\n    }\n    // 有未处理的字符串，递归调用\n    // 为了防止 subString 调用异常，需要判断剩余未处理字符串与 3 的大小\n    // 这个 3 表示 ip 中每个部分最大的长度\n    for (int i = 1; i <= Math.min(3, leftL); i++) {\n        String str = leftString.substring(0, i);\n        // 如果取出的字符串是无效的，则后面的也是无效的，直接退出循环\n        if (!isValidIp(str)) {\n            break;\n        }\n        ip.add(str);\n        restoreIpAddresses(leftString.substring(i), ip);\n        ip.remove(ip.size() - 1);\n    }\n}\n/**\n * 判断输入的字符串是否为有效的ip组成部分\n * @param s 字符串，如 255 18 7777\n * @return 布尔值，是否是有效ip组成\n */\nprivate boolean isValidIp(String s) {\n    // 长度不对，肯定不是\n    int l = s.length();\n    if (l < 1 || l > 3) {\n        return false;\n    }\n    // 大小范围不对，肯定不是，如 278\n    int n = Integer.parseInt(s);\n    if (n < 0 || n > 255) {\n        return false;\n    }\n    // 有前置的0，也不是，如 09, 024, 007\n    if (l == 2 && n <= 9) {\n        return false;\n    } else if (l == 3 && n <= 99) {\n        return false;\n    }\n    return true;\n}","language":"java","uuid":"b6a1a428-d136-4b3a-886b-f51476c780e9","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/restore-ip-addresses/","openEdit":false,"children":[{"type":"formatted","text":"复原IP地址"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"深度优先遍历"},{"label":"复原 IP 地址","href":"/docs/document/12/130.html"}],"prevPage":{"title":"单词搜索","href":"/docs/document/12/128.html"},"nextPage":{"title":"全排列","href":"/docs/document/12/138.html"},"createTime":1728999589087,"updateTime":1744296772172,"currentPath":"/docs/document/12/130.html"},"meta":{"type":"doc","publishTime":1764821904260}};
