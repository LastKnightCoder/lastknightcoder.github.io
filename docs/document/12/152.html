nt/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":152,"title":"最小路径和","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个包含非负整数的 "},{"type":"inline-math","tex":"m \\times n","children":[{"type":"formatted","text":"m \\times n"}]},{"type":"formatted","text":" 网格 "},{"type":"formatted","text":"grid","code":true},{"type":"formatted","text":" ，请找出一条从左上角到右下角的路径，使得路径上的数字总和为最小。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"说明：每次只能向下或者向右移动一步。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：grid = [[1,3,1],[1,5,1],[4,2,1]]\n输出：7","language":"java","uuid":"07340e75-adb4-4e2d-abef-ea506ac40195","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：grid = [[1,2,3],[4,5,6]]\n输出：12","language":"java","uuid":"e7ba3982-7000-4709-8e58-50c2ff965a6e","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们创建一个二维数组 "},{"type":"formatted","text":"dp","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"dp[i][j]","code":true},{"type":"formatted","text":" 表示从起点到达坐标 "},{"type":"formatted","text":"(i, j)","code":true},{"type":"formatted","text":" 的最短路径，那么我们可以得到更新公式"}],"disableDrag":false},{"type":"block-math","tex":"\\text{dp}[i][j] = \\min\\{ \\text{dp}[i-1][j] + \\text{dp}[i][j - 1] \\} + \\text{grid}[i][j]","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public int minPathSum(int[][] grid) {\n    int m = grid.length;\n    int n = grid[0].length;\n\n    int[][] dp = new int[m][n];\n    dp[0][0] = grid[0][0];\n    for (int i = 1; i < n; i++) {\n        dp[0][i] = grid[0][i] + dp[0][ i - 1];\n    }\n    for (int i = 1; i < m; i++) {\n        dp[i][0] = grid[i][0] + dp[i - 1][0];\n    }\n\n    for (int i = 1; i < m; i++) {\n        for (int j = 1; j < n; j++) {\n            dp[i][j] = grid[i][j] + Math.min(dp[i][j - 1], dp[i - 1][j]);\n        }\n    }\n\n    return dp[m - 1][n - 1];\n}","language":"java","uuid":"ea3fb1ed-d97a-46ab-bc72-b2b8432f0fbd","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/minimum-path-sum/","openEdit":false,"children":[{"type":"formatted","text":"最小路径和"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"动态规划"},{"label":"最小路径和","href":"/docs/document/12/152.html"}],"prevPage":{"title":"最大子序和","href":"/docs/document/12/151.html"},"nextPage":{"title":"最长回文字符串","href":"/docs/document/12/153.html"},"createTime":1729002519061,"updateTime":1744296694958,"currentPath":"/docs/document/12/152.html"},"meta":{"type":"doc","publishTime":1764774821815}};
