html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":131,"title":"合并区间","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"以数组 "},{"type":"formatted","text":"intervals","code":true},{"type":"formatted","text":" 表示若干个区间的集合，其中单个区间为 "},{"type":"formatted","text":"intervals[i] = [starti, endi]","code":true},{"type":"formatted","text":"。请你合并所有重叠的区间，并返回一个不重叠的区间数组，该数组需恰好覆盖输入中的所有区间。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：intervals = [[1,3],[2,6],[8,10],[15,18]]\n输出：[[1,6],[8,10],[15,18]]\n解释：区间 [1,3] 和 [2,6] 重叠, 将它们合并为 [1,6].","language":"java","uuid":"cb229218-01ed-42d6-87ce-893bce9d55a0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：intervals = [[1,4],[4,5]]\n输出：[[1,5]]\n解释：区间 [1,4] 和 [4,5] 可被视为重叠区间。","language":"java","uuid":"98740d3e-aec4-40a7-bd31-17268120c161","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"intervals.length >= 1","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"intervals[0].length == 2","code":true}],"disableDrag":false}]}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先第一步我们将 "},{"type":"formatted","text":"intervals","code":true},{"type":"formatted","text":" 数组按照区间的起点进行从小到大排序，排序后相邻的两个区间 "},{"type":"inline-math","tex":"[s_1, e_1], [s_2, e_2]","children":[{"type":"formatted","text":"[s_1, e_1], [s_2, e_2]"}]},{"type":"formatted","text":"，当 "},{"type":"inline-math","tex":"s_2 \\leq e_1","children":[{"type":"formatted","text":"s_2 \\leq e_1"}]},{"type":"formatted","text":" 的时候，我们就可以认为两个区间是重叠的，区间就可以合并为"}],"disableDrag":false},{"type":"block-math","tex":"[s_1, \\max\\{ e_1, e_2 \\}]","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210502112330.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210502112330.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"在这里我们使用双指针，使用 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":" 表示合并区间的开头，使用 "},{"type":"formatted","text":"t","code":true},{"type":"formatted","text":" 表示合并区间的结尾，当区间可以合并时，则更新 "},{"type":"formatted","text":"t = max{e1, e2}","code":true},{"type":"formatted","text":"，当区间不能合并时，将新的区间 "},{"type":"formatted","text":"[start, t]","code":true},{"type":"formatted","text":" 添加到返回的数组中，并且更新 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"t","code":true}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210502122418.gif","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210502122418.gif"},{"type":"code-block","code":"public int[][] merge(int[][] intervals) {\n    List<int[]> lists = new ArrayList<>();\n    // 对 intervals 排序，如果区间起点相同，则按照区间终点排\n    Arrays.sort(intervals, (a, b) -> a[0] - b[0] == 0 ? a[1] - b[1] : a[0] - b[0]);\n\n    int start = intervals[0][0];\n    int t = intervals[0][1];\n\n    for (int i = 1; i < intervals.length; i++) {\n        if (intervals[i][0] <= t) {\n            t = Math.max(t, intervals[i][1]);\n        } else {\n            lists.add(new int[]{start, t});\n            start = intervals[i][0];\n            t = intervals[i][1];\n        }\n    }\n    lists.add(new int[]{start, t});\n\n    int[][] merges = new int[lists.size()][2];\n    int i = 0;\n    for (int[] item: lists) {\n        merges[i++] = item;\n    }\n\n    return merges;\n}","language":"java","uuid":"09a39608-93cc-4d29-891b-2e66a2f79d57","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/merge-intervals/","openEdit":false,"children":[{"type":"formatted","text":"合并区间"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"双指针"},{"label":"合并区间","href":"/docs/document/12/131.html"}],"prevPage":{"title":"三数之和","href":"/docs/document/12/123.html"},"nextPage":{"title":"删除有序数组中的重复项","href":"/docs/document/12/141.html"},"createTime":1728999697840,"updateTime":1752586976551,"currentPath":"/docs/document/12/131.html"},"meta":{"type":"doc","publishTime":1764775995446}};
