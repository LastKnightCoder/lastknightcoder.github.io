html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":142,"title":"盛水最多的容器","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 个非负整数 "},{"type":"inline-math","tex":"a_1, a_2, \\cdots, a_n","children":[{"type":"formatted","text":"a_1, a_2, \\cdots, a_n"}]},{"type":"formatted","text":"，每个数代表坐标中的一个点 "},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":"。在坐标内画出 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 条垂直线，垂直线 "},{"type":"inline-math","tex":"i","children":[{"type":"formatted","text":"i"}]},{"type":"formatted","text":" 的两个端点 "},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"(i, 0)","children":[{"type":"formatted","text":"(i, 0)"}]},{"type":"formatted","text":"。找出其中的两条线，使得它们与 "},{"type":"inline-math","tex":"x","children":[{"type":"formatted","text":"x"}]},{"type":"formatted","text":" 轴共同构成容器可以容纳最多的水。"}],"disableDrag":false},{"type":"callout","calloutType":"info","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"说明：不能倾斜容器。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"例如，给定如下非负整数 "},{"type":"inline-math","tex":"[1, 8, 6, 2, 5, 4, 8, 3, 7]","children":[{"type":"formatted","text":"[1, 8, 6, 2, 5, 4, 8, 3, 7]"}]},{"type":"formatted","text":""}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4c3941ee-9c6c-4106-8706-fe9189aff07d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如图两条红色线形成的蓝色区域能够盛放最多的水，其值为 "},{"type":"inline-math","tex":"7 \\times 7=49","children":[{"type":"formatted","text":"7*7=49"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"最简单的思路就是遍历所有柱之间能够容纳多少流量，然后取最大值"}],"disableDrag":false},{"type":"code-block","code":"public int maxArea(int[] height) {\n    int max = 0;\n    for (int i = 0; i < height.length - 1; i++) {\n        for (int j = i + 1; j < height.length; j++) {\n            max = Math.max(max, (j - i) * Math.min(height[i], height[j]));\n        }\n    }\n    \n    return max;\n}","language":"java","uuid":"25401e00-0c8f-4f05-ac4d-b7d9b4f4329d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们考虑一个更快的算法。我们考虑范围 "},{"type":"inline-math","tex":"[i, j]","children":[{"type":"formatted","text":"[i, j]"}]},{"type":"formatted","text":" 之间的柱子能够容纳多少水量。首先考虑边界的两个柱子 "},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":" 与 "},{"type":"inline-math","tex":"(j, a_j)","children":[{"type":"formatted","text":"(j, a_j)"}]},{"type":"formatted","text":" 之间能够容纳多少水量，我们不妨假设 "},{"type":"inline-math","tex":"a_i \\leq a_j","children":[{"type":"formatted","text":"a_i \\leq a_j"}]},{"type":"formatted","text":"，那么它们之间能够容纳的水为"}],"disableDrag":false},{"type":"block-math","tex":"a_i * (j - i)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"那么对于任何 "},{"type":"inline-math","tex":"i < k < j","children":[{"type":"formatted","text":"i < k < j"}]},{"type":"formatted","text":"，我们可以确定柱 "},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":" 与柱 "},{"type":"inline-math","tex":"(k, a_k)","children":[{"type":"formatted","text":"(k, a_k)"}]},{"type":"formatted","text":" 能够容纳的水量一定小于 "},{"type":"inline-math","tex":"a_i * (j - i)","children":[{"type":"formatted","text":"a_i * (j - i)"}]},{"type":"formatted","text":"。因为"}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"x","children":[{"type":"formatted","text":"x"}]},{"type":"formatted","text":" 与 "},{"type":"inline-math","tex":"a_k","children":[{"type":"formatted","text":"a_k"}]},{"type":"formatted","text":" 之间最短的边为 "},{"type":"inline-math","tex":"\\min ( a_i, a_k ) \\leq a_i","children":[{"type":"formatted","text":"\\min ( a_i, a_k ) \\leq a_i"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"因为"},{"type":"inline-math","tex":"i < k < j","children":[{"type":"formatted","text":"i < k < j"}]},{"type":"formatted","text":"，所以 "},{"type":"inline-math","tex":"k - i < j - i","children":[{"type":"formatted","text":"k - i < j - i"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以 "},{"type":"inline-math","tex":"(i, x)","children":[{"type":"formatted","text":"(i, x)"}]},{"type":"formatted","text":" 与"},{"type":"inline-math","tex":"(k ,a_k)","children":[{"type":"formatted","text":"(k ,a_k)"}]},{"type":"formatted","text":" 能够包含的水量"}],"disableDrag":false},{"type":"block-math","tex":"\\min ( a_i, a_k ) * (k - i) < a_i * (j - i)","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为找的是能够容纳"},{"type":"formatted","text":"最大的水量","color":"hsl(270, 100%, 50%)"},{"type":"formatted","text":"，我们不必考虑 "},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":" 与其他柱的配对了，这样可以减少很多的计算量。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"将上面的想法转化为算法步骤，我们的目的是计算范围 "},{"type":"inline-math","tex":"[0, \\text{length}-1]","children":[{"type":"formatted","text":"[0, length-1]"}]},{"type":"formatted","text":" 之间的柱子能够容纳多少水量，初始令 "},{"type":"formatted","text":"i = 0, j = length -1","code":true},{"type":"formatted","text":"。算法过程为，当我们来到"},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":" 与 "},{"type":"inline-math","tex":"(j, a_j)","children":[{"type":"formatted","text":"(j, a_j)"}]},{"type":"formatted","text":" 两个柱时："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"首先计算它们能够容纳多少水量，如果大于目前的最大值，则更新最大值，否则不更新最大值"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果 "},{"type":"inline-math","tex":"a_i \\leq a_j","children":[{"type":"formatted","text":"a_i \\leq a_j"}]},{"type":"formatted","text":"，那么不必计算柱 "},{"type":"inline-math","tex":"(i, a_i)","children":[{"type":"formatted","text":"(i, a_i)"}]},{"type":"formatted","text":" 与其他柱的配对，执行 "},{"type":"formatted","text":"i++","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果 "},{"type":"inline-math","tex":"a_i > a_j","children":[{"type":"formatted","text":"a_i > a_j"}]},{"type":"formatted","text":"，那么不必计算 "},{"type":"inline-math","tex":"(j, a_j)","children":[{"type":"formatted","text":"(j, a_j)"}]},{"type":"formatted","text":" 与其他柱的配对，执行 "},{"type":"formatted","text":"j--","code":true}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"i \\geq j","children":[{"type":"formatted","text":"i \\geq j"}]},{"type":"formatted","text":" 时，算法执行结束，此时的最大值即为能够容纳的最大水量。"}],"disableDrag":false},{"type":"code-block","code":"public int maxArea(int[] height) {\n\n    int start = 0;\n    int end = height.length - 1;\n\n    int max= 0;\n    \n    while (start < end) {\n        // 计算两个柱之间能够容纳的水量，如果大于最大值，则更新最大值\n        int s = (end - start) * Math.min(height[start], height[end]);\n        if (max < s) {\n            max = s;\n        }\n        // 如果 a_i <= a_j，则 i++，否则 j--\n        if (height[start] <= height[end]) {\n            start++;\n        } else {\n            end--;\n        }\n    }\n    return max;\n}","language":"java","uuid":"94eb80ac-ae21-4259-875e-2399bfaf02a3","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/container-with-most-water/submissions/","openEdit":false,"children":[{"type":"formatted","text":"盛水最多的容器"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"双指针"},{"label":"盛水最多的容器","href":"/docs/document/12/142.html"}],"prevPage":{"title":"删除有序数组中的重复项","href":"/docs/document/12/141.html"},"nextPage":{"title":"搜索旋转排序数组II","href":"/docs/document/12/143.html"},"createTime":1729001437382,"updateTime":1744296519625,"currentPath":"/docs/document/12/142.html"},"meta":{"type":"doc","publishTime":1764775995446}};
