/126.html"},{"title":"解码方法","href":"/docs/document/12/135.html"},{"title":"跳跃游戏II","href":"/docs/document/12/144.html"},{"title":"最大子序和","href":"/docs/document/12/151.html"},{"title":"最小路径和","href":"/docs/document/12/152.html"},{"title":"最长回文字符串","href":"/docs/document/12/153.html"},{"title":"不同的二叉搜索树","href":"/docs/document/12/116.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"}]},{"title":"深度优先遍历","children":[{"title":"单词搜索","href":"/docs/document/12/128.html"},{"title":"复原 IP 地址","href":"/docs/document/12/130.html"},{"title":"全排列","href":"/docs/document/12/138.html"},{"title":"子集","href":"/docs/document/12/148.html"},{"title":"组合","href":"/docs/document/12/149.html"},{"title":"组合总数","href":"/docs/document/12/150.html"},{"title":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"}]},{"title":"贪心","children":[{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},{"title":"加油站","href":"/docs/document/12/162.html"},{"title":"用最少数量的箭引爆气球","href":"/docs/document/12/164.html"}]},{"title":"数学","children":[{"title":"x 的平方根","href":"/docs/document/12/155.html"},{"title":"字符串相乘","href":"/docs/document/12/245.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":144,"title":"跳跃游戏II","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个非负整数数组，你最初位于数组的第一个位置，数组中的每个元素代表你在该位置可以跳跃的最大长度，你的目标是使用最少的跳跃次数到达数组的最后一个位置。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例："}],"disableDrag":false},{"type":"code-block","code":"输入: [2,3,1,1,4]\n输出: 2\n解释: 跳到最后一个位置的最小跳跃数是 2。\n\t   从下标为 0 跳到下标为 1 的位置，跳 1 步，\n     然后跳 3 步到达数组的最后一个位置。","language":"java","uuid":"77af1c0a-9092-4869-a8df-d7e34938b7a8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先的想法就是使用递归，定义一个递归函数，它的输入有 "},{"type":"formatted","text":"index","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"counts","code":true},{"type":"formatted","text":"，表示经过从起点跳了 "},{"type":"formatted","text":"counts","code":true},{"type":"formatted","text":" 次到 "},{"type":"formatted","text":"index","code":true},{"type":"formatted","text":" 处，该函数的输出为从 "},{"type":"formatted","text":"index","code":true},{"type":"formatted","text":" 处跳转到最后一个位置需要跳转的次数，很容易写出这样的代码"}],"disableDrag":false},{"type":"code-block","code":"private int length;\npublic int jump(int[] nums) {\n    this.length = nums.length;\n    return jump(nums, 0, 0);\n}\n\nprivate int jump(int[] nums, int curIndex, int counts) {\n    // 跳过头了\n    if (curIndex > this.length - 1) {\n        return Integer.MAX_VALUE;\n    }\n\n    // 正好跳到最后一格\n    if (curIndex == this.length - 1) {\n        return counts;\n    }\n\n    int min = Integer.MAX_VALUE;\n    for (int i = 1; i <= nums[curIndex]; i++) {\n        // 从 [curIndex + i] 处开始跳，取最小值\n        int t = jump(nums, curIndex + i, counts + 1);\n        min = Math.min(t, min);\n    }\n\n    return min;\n}","language":"java","uuid":"a87a3df5-528c-4e2a-b5c1-f11a16af3b28","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是代码一提交，发现超时了。仔细分析，发现有重复的计算，对于这种情况我们可以使用动态规划。我们定义一个数组 "},{"type":"formatted","text":"dp","code":true},{"type":"formatted","text":"，其中 "},{"type":"formatted","text":"dp[i]","code":true},{"type":"formatted","text":" 表示从下标 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 跳转到最后一个位置需要的最少的跳跃次数。因此我们可以得到如下的更新方程"}],"disableDrag":false},{"type":"block-math","tex":"\\text{dp}[i] = \n\\begin{cases}\n1 & i+\\text{num}[i] \\geq \\text{length} - 1\\\\\n\\min\\{ \\text{dp}[i + j] \\} + 1 (j\\in[1, \\text{num}[i]]) &i+\\text{num}[i] < \\text{length} - 1\n\\end{cases}","children":[{"type":"formatted","text":""}]},{"type":"code-block","code":"public int jump(int[] nums) {\n    int[] dp = new int[nums.length];\n    dp[nums.length - 1] = 0;\n    for (int i = nums.length - 2; i >= 0; i--) {\n        // nums[i] = 0，永远都跳不到最后一个\n        if (nums[i] == 0) {\n            dp[i] = Integer.MAX_VALUE;\n            continue;\n        }\n\n        if (nums[i] + i >= nums.length - 1) {\n            dp[i] = 1;\n        } else {\n            dp[i] = Integer.MAX_VALUE;\n            for (int j = 1; j <= nums[i]; j++) {\n                // 这里判断是防止溢出\n                if (dp[i + j] != Integer.MAX_VALUE) {\n                    dp[i] = Math.min(dp[i], dp[i + j] + 1);\n                }\n            }\n        }\n    }\n    return dp[0];\n}","language":"java","uuid":"7582358d-affc-4036-b230-d07674433d3e","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/jump-game-ii/","openEdit":false,"children":[{"type":"formatted","text":"跳跃游戏II"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/jump-game-ii/solution/xiang-jie-dp-tan-xin-shuang-zhi-zhen-jie-roh4/","openEdit":false,"children":[{"type":"formatted","text":"详解「DP + 贪心 + 双指针」解法，以及该如何猜 DP 的状态定义 ~"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"动态规划"},{"label":"跳跃游戏II","href":"/docs/document/12/144.html"}],"prevPage":{"title":"解码方法","href":"/docs/document/12/135.html"},"nextPage":{"title":"最大子序和","href":"/docs/document/12/151.html"},"createTime":1729001676823,"updateTime":1744296683433,"currentPath":"/docs/document/12/144.html"},"meta":{"type":"doc","publishTime":1764810804429}};
