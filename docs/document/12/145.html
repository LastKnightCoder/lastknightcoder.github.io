html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":145,"title":"外观数列","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个正整数 "},{"type":"formatted","text":"n","code":true},{"type":"formatted","text":"，输出外观数列的第 "},{"type":"formatted","text":"n","code":true},{"type":"formatted","text":" 项。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"「外观数列」是一个整数序列，从数字 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 开始，序列中的每一项都是对前一项的描述。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"你可以将其视作是由递归公式定义的数字字符串序列："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"countAndSay(1) = \"1\"","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"countAndSay(n)","code":true},{"type":"formatted","text":" 是对 "},{"type":"formatted","text":"countAndSay(n-1)","code":true},{"type":"formatted","text":" 的描述，然后转换成另一个数字字符串。"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"前五项如下："}],"disableDrag":false},{"type":"code-block","code":"1.     1\n2.     11\n3.     21\n4.     1211\n5.     111221\n第一项是数字 1 \n描述前一项，这个数是 1 即 \"一 个 1\"，记作 \"11\"\n描述前一项，这个数是 11 即 \"二 个 1\" ，记作 \"21\"\n描述前一项，这个数是 21 即 \"一 个 2 + 一 个 1\" ，记作 \"1211\"\n描述前一项，这个数是 1211 即 \"一 个 1 + 一 个 2 + 二 个 1\" ，记作 \"111221\"","language":"java","uuid":"e4e47a71-d032-4e4d-9071-f323a57dcdb9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"要描述一个数字字符串，首先要将字符串分割为最小数量的组，每个组都由连续的最多相同字符组成。然后对于每个组，先描述字符的数量，然后描述字符，形成一个描述组。要将描述转换为数字字符串，先将每组中的字符数量用数字替换，再将所有描述组连接起来。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例："}],"disableDrag":false},{"type":"code-block","code":"输入：n = 4\n输出：\"1211\"","language":"java","uuid":"e7085cf1-7806-4ca4-a8b1-94b117b76421","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们定义一个方法 "},{"type":"formatted","text":"describe","code":true},{"type":"formatted","text":"，该方法接收一个字符串，返回对该字符串的描述，那么我们的总体思路如下"}],"disableDrag":false},{"type":"code-block","code":"public String countAndSay(int n) {\n    String str = \"1\";\n    for (int i = 1; i < n; i++) {\n        str = describe(str);\n    }\n\n    return str;\n}","language":"java","uuid":"8181d93f-ef7c-4e95-9aa0-296ac705ac61","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们要实现 "},{"type":"formatted","text":"describe","code":true},{"type":"formatted","text":" 方法，我们定义两个指针 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":"、"},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"[start, end)","code":true},{"type":"formatted","text":" 内的字符都是相同的，每次我们判断 "},{"type":"formatted","text":"str[end]","code":true},{"type":"formatted","text":" 是否与 "},{"type":"formatted","text":"[start, end)","code":true},{"type":"formatted","text":" 内的字符是否相同，如果相同，则将该字符添加进去，即 "},{"type":"formatted","text":"end++","code":true},{"type":"formatted","text":"，如果不相同，统计有多少个相同字符 "},{"type":"formatted","text":"(end - start)","code":true},{"type":"formatted","text":"，以 "},{"type":"formatted","text":"[字符个数][字符]","color":"#6425d0","darkColor":"#a472fc"},{"type":"formatted","text":" 的形式添加到返回的字符串中，并更新 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":"："}],"disableDrag":false},{"type":"code-block","code":"private String describe(String str) {\n    int start = 0;\n    int end = 1;\n    char[] chars = str.toCharArray();\n    StringBuilder stringBuilder = new StringBuilder();\n    while (end < str.length()) {\n        if (chars[start] != chars[end]) {\n            stringBuilder.append(end - start);\n            stringBuilder.append(chars[start]);\n            start = end;\n        }\n        end++;\n    }\n\n    stringBuilder.append(end - start);\n    stringBuilder.append(chars[start]);\n\n    return stringBuilder.toString();\n}","language":"java","uuid":"94308681-e025-4106-8814-8ba321e8d0cd","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/count-and-say/","openEdit":false,"children":[{"type":"formatted","text":"外观数列"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"双指针"},{"label":"外观数列","href":"/docs/document/12/145.html"}],"prevPage":{"title":"搜索旋转排序数组II","href":"/docs/document/12/143.html"},"nextPage":{"title":"插入区间","href":"/docs/document/12/330.html"},"createTime":1729001844540,"updateTime":1744296571874,"currentPath":"/docs/document/12/145.html"},"meta":{"type":"doc","publishTime":1764775995447}};
