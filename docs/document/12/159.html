"content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个整数数组 "},{"type":"formatted","text":"prices","code":true},{"type":"formatted","text":" ，其中 "},{"type":"formatted","text":"prices[i]","code":true},{"type":"formatted","text":" 表示某支股票第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 天的价格。在每一天，你可以决定是否购买和/或出售股票。你在任何时候"},{"type":"formatted","text":"最多","bold":true},{"type":"formatted","text":"只能持有"},{"type":"formatted","text":"一股","bold":true},{"type":"formatted","text":"股票。你也可以先购买，然后在"},{"type":"formatted","text":"同一天","bold":true},{"type":"formatted","text":"出售。返回你能获得的最大利润。"}],"disableDrag":false},{"type":"detail","title":"示例 1","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"prices = [7,1,5,3,6,4]","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出："},{"type":"formatted","text":"7","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解释：在第 2 天（股票价格 = 1）的时候买入，在第 3 天（股票价格 = 5）的时候卖出, 这笔交易所能获得利润 = 5 - 1 = 4。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"随后，在第 4 天（股票价格 = 3）的时候买入，在第 5 天（股票价格 = 6）的时候卖出, 这笔交易所能获得利润 = 6 - 3 = 3。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"最大总利润为 4 + 3 = 7 。"}],"disableDrag":false}]},{"type":"detail","title":"示例 2","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"prices = [1,2,3,4,5]","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出：4"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解释：在第 1 天（股票价格 = 1）的时候买入，在第 5 天 （股票价格 = 5）的时候卖出, 这笔交易所能获得利润 = 5 - 1 = 4。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"最大总利润为 4 。"}],"disableDrag":false}]},{"type":"detail","title":"示例 3","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"prices = [7,6,4,3,1]","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出：0"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解释：在这种情况下, 交易无法获得正利润，所以不参与交易可以获得最大利润，最大利润为 0。"}],"disableDrag":false}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"动态规划"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"以 "},{"type":"formatted","text":"dp[i][0]","code":true},{"type":"formatted","text":" 表示第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 天手里有 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 支股票时能够获得的最大收益，"},{"type":"formatted","text":"dp[i][1]","code":true},{"type":"formatted","text":" 表示第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 天手里有 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 支股票时能获得的最大收益，可以得到 "},{"type":"formatted","text":"dp[i][0]","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"dp[i][1]","code":true},{"type":"formatted","text":" 的递推公式"}],"disableDrag":false},{"type":"block-math","tex":"\\begin{aligned}\n\\text{dp}[i][0] &= \\max\\{ \\text{dp}[i - 1][0], \\text{dp}[i - 1] + \\text{prices}[i] \\} \\\\\n\\text{dp}[i][1] &= \\max\\{ \\text{dp}[i - 1][0] - \\text{prices}[i], \\text{dp}[i - 1][1] \\}\n\\end{aligned}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可知 "},{"type":"formatted","text":"dp[0][0] = 0","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"dp[0][1] = -prices[0]","code":true},{"type":"formatted","text":"，求 "},{"type":"formatted","text":"dp[n - 1][0]","code":true},{"text":"。","type":"formatted"}],"disableDrag":false},{"type":"code-block","code":"function maxProfit(prices: number[]): number {\n    const n = prices.length;\n    if (n \u003c= 1) return 0;\n    const dp = Array.from({ length: n }).fill([0, 0]);\n    dp[0][0] = 0;\n    dp[0][1] = -prices[0];\n\n    for (let i = 1; i \u003c n; i++) {\n        dp[i][0] = Math.max(dp[i - 1][0], dp[i - 1][1] + prices[i]);\n        dp[i][1] = Math.max(dp[i - 1][0] - prices[i], dp[i - 1][1]);\n    }\n\n    return dp[n - 1][0];\n};","language":"ts","uuid":"1a00432b-207e-4d0d-a287-c0c8e6753b70","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于每次 "},{"type":"formatted","text":"dp[i]","code":true},{"type":"formatted","text":" 的迭代只用了 "},{"type":"formatted","text":"dp[i - 1]","code":true},{"type":"formatted","text":"，因此不需要一个数组，只需要两个变量即可"}],"disableDrag":false},{"type":"code-block","code":"function maxProfit(prices: number[]): number {\n    const n = prices.length;\n    if (n \u003c= 1) return 0;\n    let noStock = 0;\n    let oneStock = -prices[0];\n\n    for (const price of prices) {\n        const newNoStock = Math.max(noStock, oneStock + price);\n        const newOneStock = Math.max(noStock - price, oneStock);\n        noStock = newNoStock;\n        oneStock = newOneStock;\n    }\n\n    return noStock;\n};","language":"ts","uuid":"56930b63-0f46-4100-92ab-3dbadb34892c","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"贪心"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"因为不限制交易次数，因此只要能收割到所有收益获得的利益就是最大化的，只要有的赚就卖出去（卖出去还可以今天在买回来）"}],"disableDrag":false},{"type":"code-block","code":"function maxProfit(prices: number[]): number {\n    const n = prices.length;\n    if (n \u003c= 1) return 0;\n    \n    let maxProfit = 0;\n    for (let i = 1; i \u003c n; i++) {\n        const profit = prices[i] - prices[i - 1];\n        if (profit \u003e 0) {\n            maxProfit += profit;\n        }\n    }\n\n    return maxProfit;\n};","language":"ts","uuid":"f1f64764-5ed0-4be0-a353-514c5c13f5bf","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"贪心"},{"label":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"}],"prevPage":{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},"nextPage":{"title":"加油站","href":"/docs/document/12/162.html"},"createTime":1729127264203,"updateTime":1744296758938,"currentPath":"/docs/document/12/159.html"},"meta":{"type":"doc","publishTime":1764823684263}};
