":[{"type":"paragraph","children":[{"type":"formatted","text":"LeetCode：简化路径。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个字符串 path ，表示指向某一文件或目录的 Unix 风格 绝对路径 (以 '/' 开头)，请你将其转化为更加简洁的规范路径。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在 Unix 风格的文件系统中，一个点 . 表示当前目录本身；此外，两个点 .. 表示将目录切换到上一级(指向父目录)；两者都可以是复杂相对路径的组成部分。任意多个连续的斜杠(即，'//')都被视为单个斜杠 '/' 。 对于此问题，任何其他格式的点（例如，'...'）均被视为文件/目录名称。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"请注意，返回的 规范路径 必须遵循下述格式："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"始终以斜杠 '/' 开头。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"两个目录名之间必须只有一个斜杠 '/' 。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"最后一个目录名(如果存在)不能 以 '/' 结尾。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"此外，路径仅包含从根目录到目标文件或目录的路径上的目录(即，不含 '.' 或 '..')。"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"返回简化后得到的规范路径 。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：path = \"/home/\"\n输出：\"/home\"","language":"java","uuid":"34f8904c-2a0d-4d58-82fa-945b6a51eb69","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：path = \"/../\"\n输出：\"/\"","language":"java","uuid":"02ac0c22-fc83-4785-8c09-b6723f8d04be","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例3："}],"disableDrag":false},{"type":"code-block","code":"输入：path = \"/a/./b/../../c/\"\n输出：\"/c\"","language":"java","uuid":"468231d5-f90e-4603-ae7b-880d1bf118af","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"为了统一处理方便，首先会在路径的后方加入 /，准备一个 List 来保存路径，对路径进行如下判断："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果路径是以 ../ 开头的，则从 List 的最后删除一个元素(如果 List 不为空)"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果路径以 ./ 开头，则什么也不做"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果路径以 / 开头，则删除后面连续出现的 /"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果路径以空格开头，则删除后面连续出现的空格"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"最后不是上述情况，则将 / 之前的字符添加进 List 中"}],"disableDrag":false}]}]},{"type":"code-block","code":"public String simplifyPath(String path) {\n    // 这一步经典，处理起来方便，佩服我自己\n    path = path + \"/\";\n    List<String> paths = new ArrayList<>();\n    while (!path.equals(\"\")) {\n        if (path.startsWith(\"../\")) {\n            // 这是从 Vue 源码学到的，解析完的部分就干掉\n            path = path.substring(3);\n            if (!paths.isEmpty()) {\n                paths.remove(paths.size() - 1);\n            }\n        } else if (path.startsWith(\"./\")) {\n            path = path.substring(2);\n        } else if (path.startsWith(\"/\")) {\n            int count = 1;\n            for (int i = 1; i < path.length(); i++) {\n                if (path.charAt(i) == '/') {\n                    count++;\n                } else {\n                    break;\n                }\n            }\n            path = path.substring(count);\n        } else if (path.startsWith(\" \")) {\n            int count = 1;\n            for (int i = 1; i < path.length(); i++) {\n                if (path.charAt(i) == ' ') {\n                    count++;\n                }else {\n                    break;\n                }\n            }\n            path = path.substring(count);\n        } else {\n            int index = path.indexOf(\"/\");\n            paths.add(path.substring(0, index));\n            path = path.substring(index + 1);\n        }\n    }\n\n    StringBuilder stringBuilder = new StringBuilder();\n\n    if (paths.size() == 0) {\n        stringBuilder.append(\"/\");\n        return stringBuilder.toString();\n    }\n\n    for (String s : paths) {\n        stringBuilder.append(\"/\").append(s);\n    }\n    return stringBuilder.toString();\n}","language":"java","uuid":"c61a4bc8-eb83-436f-9189-24899d69c5a0","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/simplify-path/","openEdit":false,"children":[{"type":"formatted","text":"简化路径"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"字符串"},{"label":"简化路径","href":"/docs/document/12/134.html"}],"prevPage":{"title":"二叉树的最近公共祖先","href":"/docs/document/12/328.html"},"nextPage":{"title":"最长回文字符串","href":"/docs/document/12/153.html"},"createTime":1729000003033,"updateTime":1744296299031,"currentPath":"/docs/document/12/134.html"},"meta":{"type":"doc","publishTime":1764821904254}};
