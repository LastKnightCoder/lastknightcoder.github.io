":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":339,"title":"矩阵中的最长递增路径","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"disableDrag":false,"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"给定一个 "},{"type":"formatted","text":"m x n","code":true},{"type":"formatted","text":" 整数矩阵 "},{"type":"formatted","text":"matrix","code":true},{"type":"formatted","text":"，找出其中"},{"type":"formatted","text":"最长递增路径","bold":true},{"type":"formatted","text":"的长度。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"对于每个单元格，你可以往上，下，左，右四个方向移动。不能在对角线方向上移动或移动到边界外（即不允许环绕）。"}]},{"type":"detail","title":"示例 1","open":true,"children":[{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0906132a-44c3-42cb-a06b-4ea13f713b25.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0906132a-44c3-42cb-a06b-4ea13f713b25.png"},{"type":"paragraph","children":[{"type":"formatted","text":"输入：matrix = [[9,9,4],[6,6,8],[2,1,1]]"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输出：4 "}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"解释：最长递增路径为 [1, 2, 6, 9]。"}]}]},{"type":"detail","title":"示例 2","open":true,"children":[{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dff152fd-14f8-49d3-ad0c-439a38384216.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dff152fd-14f8-49d3-ad0c-439a38384216.png"},{"type":"paragraph","children":[{"type":"formatted","text":"输入：matrix = [[3,4,5],[3,2,6],[2,2,1]]"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输出：4 "}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"解释：最长递增路径是 [3, 4, 5, 6]。注意不允许在对角线方向上移动。"}]}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这是一个图的深度优先遍历遍历问题，遍历整个矩阵，从矩阵的每一个元素出发，看看可以连接到哪些数字"}]},{"type":"code-block","code":"function longestIncreasingPath(matrix: number[][]): number {\n  if (matrix.length === 0) return 0;\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  const visited = Array.from({ length: m }).map(() => Array.from({ length: n }).fill(false)) as boolean[][];\n  let count = 0;\n  for (let i = 0; i < m; i++) {\n    for (let j = 0; j < n; j++) {\n      count = Math.max(search(matrix, i, j, visited), count);\n    }\n  }\n\n  return count;\n};\n\nconst directions = [\n  [-1, 0],\n  [0, -1],\n  [1, 0],\n  [0, 1]\n]\n\nfunction search(matrix: number[][], i: number, j: number, visited: boolean[][], acc = 0): number {\n  if (visited[i][j]) return acc;\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  visited[i][j] = true;\n  let max = acc + 1;\n  for (let dir of directions) {\n    const nextRow = i + dir[0];\n    const nextCol = j + dir[1];\n    if (nextRow >= 0 && nextRow < m && nextCol >= 0 && nextCol < n && matrix[nextRow][nextCol] > matrix[i][j]) {\n      max = Math.max(search(matrix, nextRow, nextCol, visited, acc + 1), max);\n    }\n  }\n\n  visited[i][j] = false;\n\n  return max;\n}","language":"TypeScript","uuid":"68d075b6-8641-4096-998d-5f0c4eb2aa38","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"缺点是时间复杂度呈指数级增长，实际上我们观察有很多重复的计算，从一个点出发的最大增长长度是固定的，和从哪里到这个点无关，因为上一个点肯定比当前点小，这样才能遍历到当前节点，遍历的方向一定不会有回头的情况的，因此可以缓存从某个点开始的最大增长序列，后续不用重复计算，使用 "},{"type":"formatted","text":"memo[i][j]","code":true},{"type":"formatted","text":" 表示从 "},{"type":"formatted","text":"(i, j)","code":true},{"type":"formatted","text":" 出发的最大增长长度，由于如果遍历过节点后，"},{"type":"formatted","text":"memo[i][j]","code":true},{"type":"formatted","text":" 的最小值是 1，因此可以使用 "},{"type":"formatted","text":"memo","code":true},{"type":"formatted","text":" 替代 "},{"type":"formatted","text":"visited","code":true}],"disableDrag":false},{"type":"code-block","code":"function longestIncreasingPath(matrix: number[][]): number {\n  if (matrix.length === 0) return 0;\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  const memo = Array.from({ length: m }).map(() => Array.from({ length: n }).fill(0)) as number[][];\n  let count = 0;\n  for (let i = 0; i < m; i++) {\n    for (let j = 0; j < n; j++) {\n      count = Math.max(search(matrix, i, j, memo), count);\n    }\n  }\n\n  return count;\n};\n\nconst directions = [\n  [-1, 0],\n  [0, -1],\n  [1, 0],\n  [0, 1]\n]\n\nfunction search(matrix: number[][], i: number, j: number, memo: number[][]): number {\n  if (memo[i][j]) return memo[i][j];\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  let max = 1;\n  for (let dir of directions) {\n    const nextRow = i + dir[0];\n    const nextCol = j + dir[1];\n    if (nextRow >= 0 && nextRow < m && nextCol >= 0 && nextCol < n && matrix[nextRow][nextCol] > matrix[i][j]) {\n      max = Math.max(search(matrix, nextRow, nextCol, memo) + 1, max);\n    }\n  }\n\n  memo[i][j] = max;\n\n  return max;\n}","language":"TypeScript","uuid":"26b38826-37e3-405f-8797-b754b2918389","children":[{"type":"formatted","text":""}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode.cn/problems/fpTFWP/description/","openEdit":false,"children":[{"type":"formatted","text":"LCR 112. 矩阵中的最长递增路径"}]},{"text":"","type":"formatted"}]}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"深度优先遍历"},{"label":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"}],"prevPage":{"title":"组合总数","href":"/docs/document/12/150.html"},"nextPage":{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},"createTime":1745559657111,"updateTime":1746631814704,"currentPath":"/docs/document/12/339.html"},"meta":{"type":"doc","publishTime":1764820858566}};
