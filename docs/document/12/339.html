html","title":"0.45.2"},"document-item:858":{"contentType":"document-item","refId":858,"href":"/docs/document/14/858.html","title":"0.46.0"},"document-item:859":{"contentType":"document-item","refId":859,"href":"/docs/document/14/859.html","title":"0.46.1"},"document-item:860":{"contentType":"document-item","refId":860,"href":"/docs/document/14/860.html","title":"0.46.2"},"document-item:862":{"contentType":"document-item","refId":862,"href":"/docs/document/14/862.html","title":"0.47.0"},"document-item:863":{"contentType":"document-item","refId":863,"href":"/docs/document/14/863.html","title":"0.47.1"},"document-item:864":{"contentType":"document-item","refId":864,"href":"/docs/document/14/864.html","title":"0.47.2"}},"content":{"id":339,"title":"矩阵中的最长递增路径","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"disableDrag":false,"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"给定一个 "},{"type":"formatted","text":"m x n","code":true},{"type":"formatted","text":" 整数矩阵 "},{"type":"formatted","text":"matrix","code":true},{"type":"formatted","text":"，找出其中"},{"type":"formatted","text":"最长递增路径","bold":true},{"type":"formatted","text":"的长度。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"对于每个单元格，你可以往上，下，左，右四个方向移动。不能在对角线方向上移动或移动到边界外（即不允许环绕）。"}]},{"type":"detail","title":"示例 1","open":true,"children":[{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_96af2713-0018-4a2a-800e-bb125b5160a5.webp","uuid":"14b0be31-7642-4c86-823c-1682f8e2aaef","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_96af2713-0018-4a2a-800e-bb125b5160a5.webp","width":100.83332932657682},{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"matrix = [[9,9,4],[6,6,8],[2,1,1]]","code":true}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输出："},{"type":"formatted","text":"4","code":true},{"type":"formatted","text":" "}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"解释：最长递增路径为 "},{"type":"formatted","text":"[1, 2, 6, 9]","code":true},{"type":"formatted","text":"。"}]}]},{"type":"detail","title":"示例 2","open":true,"children":[{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1422db66-a21e-499d-87da-48f2d641700e.webp","uuid":"e2c03814-d69b-48ef-b46c-ec2b03112881","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1422db66-a21e-499d-87da-48f2d641700e.webp","width":105.41666247778485},{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"matrix = [[3,4,5],[3,2,6],[2,2,1]]","code":true}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"输出："},{"type":"formatted","text":"4","code":true},{"type":"formatted","text":" "}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"解释：最长递增路径是 "},{"type":"formatted","text":"[3, 4, 5, 6]","code":true},{"type":"formatted","text":"。注意不允许在对角线方向上移动。"}]}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"这是一个图的深度优先遍历遍历问题，遍历整个矩阵，从矩阵的每一个元素出发，看看可以连接到哪些数字"}]},{"type":"code-block","code":"function longestIncreasingPath(matrix: number[][]): number {\n  if (matrix.length === 0) return 0;\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  const visited = Array.from({ length: m }).map(() =\u003e Array.from({ length: n }).fill(false)) as boolean[][];\n  let count = 0;\n  for (let i = 0; i \u003c m; i++) {\n    for (let j = 0; j \u003c n; j++) {\n      count = Math.max(search(matrix, i, j, visited), count);\n    }\n  }\n\n  return count;\n};\n\nconst directions = [\n  [-1, 0],\n  [0, -1],\n  [1, 0],\n  [0, 1]\n]\n\nfunction search(matrix: number[][], i: number, j: number, visited: boolean[][], acc = 0): number {\n  if (visited[i][j]) return acc;\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  visited[i][j] = true;\n  let max = acc + 1;\n  for (let dir of directions) {\n    const nextRow = i + dir[0];\n    const nextCol = j + dir[1];\n    if (nextRow \u003e= 0 && nextRow \u003c m && nextCol \u003e= 0 && nextCol \u003c n && matrix[nextRow][nextCol] \u003e matrix[i][j]) {\n      max = Math.max(search(matrix, nextRow, nextCol, visited, acc + 1), max);\n    }\n  }\n\n  visited[i][j] = false;\n\n  return max;\n}","language":"TypeScript","uuid":"68d075b6-8641-4096-998d-5f0c4eb2aa38","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"缺点是时间复杂度呈指数级增长，实际上我们观察有很多重复的计算，从一个点出发的最大增长长度是固定的，和从哪里到这个点无关，因为上一个点肯定比当前点小，这样才能遍历到当前节点，遍历的方向一定不会有回头的情况的，因此可以缓存从某个点开始的最大增长序列，后续不用重复计算，使用 "},{"type":"formatted","text":"memo[i][j]","code":true},{"type":"formatted","text":" 表示从 "},{"type":"formatted","text":"(i, j)","code":true},{"type":"formatted","text":" 出发的最大增长长度，由于如果遍历过节点后，"},{"type":"formatted","text":"memo[i][j]","code":true},{"type":"formatted","text":" 的最小值是 1，因此可以使用 "},{"type":"formatted","text":"memo","code":true},{"type":"formatted","text":" 替代 "},{"type":"formatted","text":"visited","code":true}],"disableDrag":false},{"type":"code-block","code":"function longestIncreasingPath(matrix: number[][]): number {\n  if (matrix.length === 0) return 0;\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  const memo = Array.from({ length: m }).map(() =\u003e Array.from({ length: n }).fill(0)) as number[][];\n  let count = 0;\n  for (let i = 0; i \u003c m; i++) {\n    for (let j = 0; j \u003c n; j++) {\n      count = Math.max(search(matrix, i, j, memo), count);\n    }\n  }\n\n  return count;\n};\n\nconst directions = [\n  [-1, 0],\n  [0, -1],\n  [1, 0],\n  [0, 1]\n]\n\nfunction search(matrix: number[][], i: number, j: number, memo: number[][]): number {\n  if (memo[i][j]) return memo[i][j];\n  const m = matrix.length;\n  const n = matrix[0].length;\n\n  let max = 1;\n  for (let dir of directions) {\n    const nextRow = i + dir[0];\n    const nextCol = j + dir[1];\n    if (nextRow \u003e= 0 && nextRow \u003c m && nextCol \u003e= 0 && nextCol \u003c n && matrix[nextRow][nextCol] \u003e matrix[i][j]) {\n      max = Math.max(search(matrix, nextRow, nextCol, memo) + 1, max);\n    }\n  }\n\n  memo[i][j] = max;\n\n  return max;\n}","language":"TypeScript","uuid":"26b38826-37e3-405f-8797-b754b2918389","children":[{"type":"formatted","text":""}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode.cn/problems/fpTFWP/description/","openEdit":false,"children":[{"type":"formatted","text":"LCR 112. 矩阵中的最长递增路径"}]},{"text":"","type":"formatted"}]}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"深度优先遍历"},{"label":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"}],"prevPage":{"title":"组合总数","href":"/docs/document/12/150.html"},"nextPage":{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},"createTime":1745559657111,"updateTime":1775929217401,"currentPath":"/docs/document/12/339.html"},"meta":{"type":"doc","publishTime":1781255904290},"settings":{"appearance":{"image":{"borderRadius":"md","shadow":"sm"}}}};
