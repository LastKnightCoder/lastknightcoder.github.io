":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":162,"title":"加油站","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在一条环路上有 "},{"type":"formatted","text":"n","code":true},{"type":"formatted","text":" 个加油站，其中第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 个加油站有汽油 "},{"type":"formatted","text":"gas[i]","code":true},{"type":"formatted","text":" 升。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"你有一辆油箱容量无限的的汽车，从第 "},{"type":"formatted","text":"i","code":true},{"type":"formatted","text":" 个加油站开往第 "},{"type":"formatted","text":"i + 1","code":true},{"type":"formatted","text":" 个加油站需要消耗汽油 "},{"type":"formatted","text":"cost[i]","code":true},{"type":"formatted","text":" 升。你从其中的一个加油站出发，开始时油箱为空。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"给定两个整数数组 "},{"type":"formatted","text":"gas","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"cost","code":true},{"type":"formatted","text":" ，如果你可以按顺序绕环路行驶一周，则返回出发时加油站的编号，否则返回 "},{"type":"formatted","text":"-1","code":true},{"type":"formatted","text":" 。如果存在解，则保证它是唯一的。"}],"disableDrag":false},{"type":"detail","title":"示例 1","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入: gas = [1,2,3,4,5], cost = [3,4,5,1,2]"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出: 3"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解释:"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"从 3 号加油站(索引为 3 处)出发，可获得 4 升汽油。此时油箱有 = 0 + 4 = 4 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 4 号加油站，此时油箱有 4 - 1 + 5 = 8 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 0 号加油站，此时油箱有 8 - 2 + 1 = 7 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 1 号加油站，此时油箱有 7 - 3 + 2 = 6 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 2 号加油站，此时油箱有 6 - 4 + 3 = 5 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 3 号加油站，你需要消耗 5 升汽油，正好足够你返回到 3 号加油站。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"因此，3 可为起始索引。"}],"disableDrag":false}]}]}]},{"type":"detail","title":"示例 2","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入: gas = [2,3,4], cost = [3,4,3]"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出: -1"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解释:"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"你不能从 0 号或 1 号加油站出发，因为没有足够的汽油可以让你行驶到下一个加油站。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我们从 2 号加油站出发，可以获得 4 升汽油。 此时油箱有 = 0 + 4 = 4 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 0 号加油站，此时油箱有 4 - 3 + 2 = 3 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开往 1 号加油站，此时油箱有 3 - 3 + 3 = 3 升汽油"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"你无法返回 2 号加油站，因为返程需要消耗 4 升汽油，但是你的油箱只有 3 升汽油。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"因此，无论怎样，你都不可能绕环路行驶一周。"}],"disableDrag":false}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":" 提示:"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"gas.length == n","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"cost.length == n","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"1 <= n <= 10^5","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"0 <= gas[i], cost[i] <= 10^4","code":true}],"disableDrag":false}]}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"假设从 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":" 出发，它最多到达 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":"，我们可以知道，对于从 "},{"type":"formatted","text":"[start, end)","code":true},{"type":"formatted","text":" 中间的任一站出发都无法到达 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":"，假设从中间的站 "},{"type":"formatted","text":"k","code":true},{"type":"formatted","text":" 出发，从 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":" 到 "},{"type":"formatted","text":"k","code":true},{"type":"formatted","text":" 时一定是有油，身上有油都到不了 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":"，更别说身上没油从 "},{"type":"formatted","text":"k","code":true},{"type":"formatted","text":" 出发，更到不了站 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":"，通过这种方式可以排除很多的站。"}],"disableDrag":false},{"type":"code-block","code":"function canCompleteCircuit(gas: number[], cost: number[]): number {\n    let start = 0;\n    let step = 0;\n    let leftGas = 0;\n    const n = gas.length;\n    \n    while(start < n) {\n        leftGas += gas[(start + step) % n];\n        leftGas -= cost[(start + step) % n];\n        if (leftGas >= 0) {\n            step++;\n        } else {\n            start += step + 1;\n            step = 0;\n            leftGas = 0;\n            continue;\n        }\n        \n        if (step === n) return start;\n    }\n\n    return -1;\n};","language":"ts","uuid":"acd09a26-d046-4ba5-9cc7-9bd704563f52","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"贪心"},{"label":"加油站","href":"/docs/document/12/162.html"}],"prevPage":{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},"nextPage":{"title":"用最少数量的箭引爆气球","href":"/docs/document/12/164.html"},"createTime":1729471371638,"updateTime":1744296851994,"currentPath":"/docs/document/12/162.html"},"meta":{"type":"doc","publishTime":1764810804432}};
