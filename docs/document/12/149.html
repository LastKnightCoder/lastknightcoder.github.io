nt/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":149,"title":"组合","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定两个整数 n 和 k，返回 1 ... n 中所有可能的 k 个数的组合。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例："}],"disableDrag":false},{"type":"code-block","code":"输入: n = 4, k = 2\n输出:\n[\n  [2,4],\n  [3,4],\n  [2,3],\n  [1,2],\n  [1,3],\n  [1,4],\n]","language":"java","uuid":"e1f7e763-64d3-4634-a069-5b9359e9ee64","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"将 1 ~ n 想成是一棵树的根节点的 n 个子节点，每个节点下面还有 n 个子节点，总共有 k 层，我们遍历这颗树寻找一个组合，因为在遍历节点 i 时，我们已经考虑了包含节点 i 的所有组合，在后续遍历的过程中就不必考虑节点 i"}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    private List<List<Integer>> res = new ArrayList<>();\n    private int n;\n    private int k;\n    public List<List<Integer>> combine(int n, int k) {\n        if (n < k) {\n            return res;\n        }\n\n        this.n = n;\n        this.k = k;\n\n        combine(0, new ArrayList<>());\n        return res;\n    }\n\n    public void combine(int start, ArrayList<Integer> path) {\n        // path.size() == k 表示已经收集了 k 个元素\n        if (path.size() == k) {\n            res.add(new ArrayList<>(path));\n            return;\n        }\n        // 从 start + 1 处开始遍历，因为 start 之前的元素已经考虑过了\n        for (int i = start + 1; i <= n - (k - path.size()) + 1; i++) {\n            path.add(i);\n            combine(i, path);\n            // 回到上一级节点时，从路径中删除该元素\n            path.remove(path.size() - 1);\n        }\n    }\n}","language":
