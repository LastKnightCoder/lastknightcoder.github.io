":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":148,"title":"子集","content":[{"type":"header","children":[{"type":"formatted","text":"子集"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个整数数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":"，数组中的元素互不相同 。返回该数组所有可能的子集(幂集)。解集不能包含重复的子集。你可以按 任意顺序 返回解集。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例 1："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [1,2,3]\n输出：[[],[1],[2],[1,2],[3],[1,3],[2,3],[1,2,3]]","language":"java","uuid":"9b6d8a16-a844-4610-bc55-7de6b2e0d77d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例 2："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [0]\n输出：[[],[0]]","language":"java","uuid":"216ca916-c013-404c-84f7-1fa877bf6107","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"将输入的数组看做是一棵树，每一个节点的孩子都包含所有的元素，树的层级就是元素的个数，以数组 "},{"type":"formatted","text":"[1, 2, 3]","code":true},{"type":"formatted","text":" 为例，其树的形状为"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210627143153.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210627143153.png"},{"type":"paragraph","children":[{"type":"formatted","text":"从根节点开始进行深度优先遍历，我们使用 "},{"type":"formatted","text":"path","code":true},{"type":"formatted","text":" 来保存从根节点到当前节点的路径，当来到一个节点时，我们将该节点添加到路径 "},{"type":"formatted","text":"path","code":true},{"type":"formatted","text":" 中，并且将此时的路径可作为一个子集，而回到父节点时，将该节点从 "},{"type":"formatted","text":"path","code":true},{"type":"formatted","text":" 中移除。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在遍历的过程中需要注意不能重复访问"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210627144012.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210627144012.png"},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们从根节点来到了节点 1，从节点继续深度优先遍历，此时因为节点 1 以及访问过了，所以下面以节点 1 起始的子树不能重复访问。除此之外，当我们从遍历完以节点 1 开始的的这个子树时，所有包含节点 1 的子集全部都被考虑了"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1624782491878.png","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1624782491878.png"},{"type":"paragraph","children":[{"type":"formatted","text":"所以当我们来到节点 2 时，不能访问它所包含的 1 节点"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1624786692900.png","children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1624786692900.png"},{"type":"code-block","code":"private List<List<Integer>> res = new ArrayList<>();\nprivate int[] nums;\npublic List<List<Integer>> subsets(int[] nums) {\n    this.nums = nums;\n    res.add(new ArrayList<>());\n\n    for (int i = 0; i < nums.length; i++) {\n        // 从节点 nums[i] 开始遍历\n        combine(i, new ArrayList<>());\n    }\n\n    return res;\n}\n\nprivate void combine(int i, ArrayList<Integer> path) {\n    path.add(nums[i]);\n    res.add(path);\n\n    for (int k = i + 1; k < nums.length; k++) {\n        combine(k, new ArrayList<>(path));\n    }\n}","language":"java","uuid":"a2cdf196-a3ba-4107-9f03-6f69f8f2d21d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"子集II"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个整数数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":"，其中可能包含重复元素，请你返回该数组所有可能的子集(幂集)。解集不能包含重复的子集。返回的解集中，子集可以按任意顺序排列。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [1,2,2]\n输出：[[],[1],[1,2],[1,2,2],[2],[2,2]]","language":"java","uuid":"03f9b066-1e8e-46fc-9a73-98dcb091caae","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [0]\n输出：[[],[0]]","language":"java","uuid":"b078322d-e104-431c-affb-ae90b4cc536c","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"总体的解决思路同上，但是有个变化就是数组中可能有重复的元素，这个时候我们一般需要对数组进行排序，当我们进入下一层节点时不能重复添加，所以我们会判断当前元素是否与前一个元素相同，如果相同，则不添加该元素"}],"disableDrag":false},{"type":"code-block","code":"private List<List<Integer>> res = new ArrayList<>();\nprivate int[] nums;\npublic List<List<Integer>> subsetsWithDup(int[] nums) {\n    // 排序\n    Arrays.sort(nums);\n    this.nums = nums;\n    res.add(new ArrayList<>());\n\n    for (int i = 0; i < nums.length; i++) {\n        if (i == 0 || nums[i - 1] != nums[i]) {\n            combine(i, new ArrayList<>());\n        }\n    }\n\n    return res;\n}\n\nprivate void combine(int i, List<Integer> path) {\n    path.add(nums[i]);\n    res.add(path);\n\n    for (int k = i + 1; k < nums.length; k++) {\n        // 判断，如果当前元素与前一个元素相同，则忽略\n        if (k == i + 1 || nums[k] != nums[k - 1]) {\n            combine(k, new ArrayList<>(path));\n        }\n    }\n}","language":"java","uuid":"127e1f45-65b6-42c0-8d88-c62a2ddab58d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/subsets/","openEdit":false,"children":[{"type":"formatted","text":"子集"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/subsets-ii/","openEdit":false,"children":[{"type":"formatted","text":"子集II"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"深度优先遍历"},{"label":"子集","href":"/docs/document/12/148.html"}],"prevPage":{"title":"全排列","href":"/docs/document/12/138.html"},"nextPage":{"title":"组合","href":"/docs/document/12/149.html"},"createTime":1729002166738,"updateTime":1753371078820,"currentPath":"/docs/document/12/148.html"},"meta":{"type":"doc","publishTime":1764810804431}};
