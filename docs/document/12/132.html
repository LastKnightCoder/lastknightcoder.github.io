tml","kind":"document"}]}],"content":{"id":132,"title":"合并 K 个升序链表","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个链表数组，每个链表都已经按升序排列。请你将所有链表合并到一个升序链表中，返回合并后的链表。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：lists = [[1,4,5],[1,3,4],[2,6]]\n输出：[1,1,2,3,4,4,5,6]\n解释：链表数组如下：\n[\n  1-\u003e4-\u003e5,\n  1-\u003e3-\u003e4,\n  2-\u003e6\n]\n将它们合并到一个有序链表中得到。\n1-\u003e1-\u003e2-\u003e3-\u003e4-\u003e4-\u003e5-\u003e6","language":"java","uuid":"55774256-cdad-4f05-99b3-d13b1a938090","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：lists = []\n输出：[]","language":"java","uuid":"0b8533fd-0c4e-43eb-a150-251d4595e3bb","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我一开始的解题思路就是将两个链表一一合并，思路如下："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"list1 + list2 -\u003e list","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"list3 + list -\u003e list","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"list4 + list -\u003e list","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"...","code":true}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以第一版的代码如下"}],"disableDrag":false},{"type":"code-block","code":"public ListNode mergeKLists(ListNode[] lists) {\n    ListNode root = null;\n    if (lists.length == 0) {\n        return root;\n    }\n    root = Arrays.stream(lists).reduce(null, this::mergeTwoList);\n    return root;\n}\n\n// 合并两个链表\nprivate ListNode mergeTwoList(ListNode l1, ListNode l2) {\n    if (l1 == null) {\n        return l2;\n    }\n    if (l2 == null) {\n        return l1;\n    }\n    ListNode p1 = l1;\n    ListNode p2 = l2;\n    ListNode dummyNode = new ListNode(0);\n    ListNode cuerNode = dummyNode;\n    while (p1 != null && p2 != null) {\n        if (p1.val \u003c= p2.val) {\n            cuerNode.next = p1;\n            cuerNode = cuerNode.next;\n            p1 = p1.next;\n        } else {\n            cuerNode.next = p2;\n            cuerNode = cuerNode.next;\n            p2 = p2.next;\n        }\n    }\n    if (p1 == null) {\n        cuerNode.next = p2;\n    } else {\n        cuerNode.next = p1;\n    }\n    return dummyNode.next;\n}","language":"java","uuid":"c58fbe87-bece-4f12-b64e-81e824a22b40","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"然后一提交，发现只超过了 24% 的人"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210326112949.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210326112949.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"说明肯定有更快的算法，我便去找题解，在题解中发现发现使用分治的思路可以更快的得到排序好的数组。由于老弟我归并排序已经写得炉火纯青了，很快得到了第二版的代码"}],"disableDrag":false},{"type":"code-block","code":"public ListNode mergeKLists(ListNode[] lists) {\n    if (lists.length == 0) {\n        return null;\n    }\n    return mergeKLists(lists, 0 , lists.length - 1);\n}\nprivate ListNode mergeKLists(ListNode[] lists, int left, int right) {\n    if (left == right) {\n        return lists[left];\n    }\n    ListNode leftList = null;\n    ListNode rightList = null;\n    int mid = left + (right - left) / 2;\n    leftList = mergeKLists(lists, left, mid);\n    rightList = mergeKLists(lists, mid + 1, right);\n    return mergeTwoList(leftList, rightList);\n}\n\n// 合并两个链表的代码同上，这里便不列出","language":"java","uuid":"0c2ca5c1-4cfd-4974-9fcb-ba0765238803","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"再次提交"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210326113204.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210326113204.png","width":478},{"type":"paragraph","children":[{"type":"formatted","text":"已经打败 87% 的人了，时间从 120ms 降到了 2ms，再次感受到了算法的魅力。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在最后我稍微分析归并的方法为什么比一个个合并较快，从合并的次数看，一个个合并需要合并 "},{"type":"inline-math","tex":"n - 1","children":[{"type":"formatted","text":"n - 1"}]},{"type":"formatted","text":" 次，而归并排序需要合并"}],"disableDrag":false},{"type":"block-math","tex":"\\dfrac{n}{2} + \\dfrac{n}{4} + \\dfrac{n}{8} + \\cdots + 1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了方便计算，不妨假设 "},{"type":"inline-math","tex":"n = 2^i","children":[{"type":"formatted","text":"n = 2^i"}]},{"type":"formatted","text":"，即 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 为 "},{"type":"inline-math","tex":"2","children":[{"type":"formatted","text":"2"}]},{"type":"formatted","text":" 的整数次幂，则上式可以改为"}],"disableDrag":false},{"type":"block-math","tex":"\\sum_{i = 1}^{\\log_2 n} \\frac{n}{2^i} \\approx n - 1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以从合并的次数上看，几乎是相当的。但是注意到一一合并得到的链表越来越长"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"list + listi -\u003e list","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"list + list(i + 1) -\u003e list","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"...","code":true}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"链表 "},{"type":"formatted","text":"list","code":true},{"type":"formatted","text":" 越来越长，合并需要的时间就越多。但是对于归并合并，它先将链表数组划分为两个一组然后合并，这两个一组的链表都是较短的，所需合并的速度较快。所以虽然他们合并的次数相差不大，但是归并合并的链表较一一合并短很多，所以便会较快。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/merge-k-sorted-lists/","openEdit":false,"children":[{"type":"formatted","text":"合并K个升序链表"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"分治"},{"label":"合并 K 个升序链表","href":"/docs/document/12/132.html"}],"prevPage":{"title":"Pow(x, n)","href":"/docs/document/12/119.html"},"nextPage":{"title":"两数之和","href":"/docs/document/12/122.html"},"createTime":1728999779645,"updateTime":1766295936121,"currentPath":"/docs/document/12/132.html"},"meta":{"type":"doc","publishTime":1767266228452}};
