":[{"type":"header","children":[{"type":"formatted","text":"不同路径"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"一个机器人位于一个 "},{"type":"inline-math","tex":"m \\times n","children":[{"type":"formatted","text":"m \\times n"}]},{"type":"formatted","text":" 网格的左上角 (起始点在下图中标记为 \"Start\")。机器人每次只能向下或者向右移动一步。机器人试图达到网格的右下角 (在下图中标记为 \"Finish\")。问总共有多少条不同的路径?"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting2/raw/master/20210503111505.png","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：m = 3, n = 7\n输出：28","language":"java","uuid":"8891474b-9f6b-4572-bc6f-003e4cff32be","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：m = 3, n = 2\n输出：3","language":"java","uuid":"68c115b7-aa87-42c0-a57b-bc86274696db","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":""},{"type":"inline-math","tex":"1 \\leq m,n \\leq 100","children":[{"type":"formatted","text":"1 \\leq m,n \\leq 100"}]},{"type":"formatted","text":""}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"题目数据保证答案小于 "},{"type":"inline-math","tex":"2 \\times 10^9","children":[{"type":"formatted","text":"2 \\times 10^9"}]},{"type":"formatted","text":""}],"disableDrag":false}]}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"这是一道典型的动态规划题目，我们定义 "},{"type":"formatted","text":"dp","code":true},{"type":"formatted","text":" 二维数组，"},{"type":"formatted","text":"dp[i][j]","code":true},{"type":"formatted","text":" 表示从 "},{"type":"formatted","text":"start","code":true},{"type":"formatted","text":" 到坐标 "},{"type":"formatted","text":"(i, j)","code":true},{"type":"formatted","text":" 有多少种不同路径，我们可以得到 "},{"type":"formatted","text":"dp[i][j]","code":true},{"type":"formatted","text":" 的更新公式"}],"disableDrag":false},{"type":"block-math","tex":"dp[i][j] = dp[i][j - 1] + dp[i - 1][j]","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"即到达 "},{"type":"formatted","text":"(i, j)","code":true},{"type":"formatted","text":" 处的路径数等于到达 "},{"type":"formatted","text":"(i, j - 1)","code":true},{"type":"formatted","text":" (上方) 的路径数加上到达 "},{"type":"formatted","text":"(i - 1, j)","code":true},{"type":"formatted","text":" (左方) 的路径数"}],"disableDrag":false},{"type":"code-block","code":"public int uniquePaths(int m, int n) {\n    int[][] dp = new int[m][n];\n    dp[0][0] = 1;\n\n    for (int i = 0; i < m; i++) {\n        for (int j = 0; j < n; j++) {\n            if (i - 1 >= 0) {\n                dp[i][j] += dp[i - 1][j];\n            }\n            if (j - 1 >= 0) {\n                dp[i][j] += dp[i][j - 1];\n            }\n        }\n    }\n\n    return dp[m - 1][n -1];\n}","language":"java","uuid":"0388703a-d431-45c8-ac08-f7bee58f5703","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"不同路径II"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"一个机器人位于一个 "},{"type":"inline-math","tex":"m \\times n","children":[{"type":"formatted","text":"m \\times n"}]},{"type":"formatted","text":" 网格的左上角 (起始点在下图中标记为 \"Start\")。机器人每次只能向下或者向右移动一步。机器人试图达到网格的右下角 (在下图中标记为 \"Finish\")。现考虑网格中有障碍物，那么从左上角到右下角将会有多少条不同的路径?"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"网格中的障碍物和空位置分别用 1 和 0 来表示。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：obstacleGrid = [[0,0,0],[0,1,0],[0,0,0]]\n输出：2","language":"java","uuid":"9e8c3578-6037-4d17-ad21-303bba355705","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：obstacleGrid = [[0,1],[0,0]]\n输出：1","language":"java","uuid":"39132075-7c4a-4c05-9613-2ee00247eed8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"解题思路同上，对于有障碍物的坐标，我们只需要将其 dp[i][j] = 0 设置为 0 即可"}],"disableDrag":false},{"type":"code-block","code":"public int uniquePathsWithObstacles(int[][] obstacleGrid) {\n    int m = obstacleGrid.length;\n    int n = obstacleGrid[0].length;\n    int[][] dp = new int[m][n];\n    if (obstacleGrid[0][0] == 1) {\n        return 0;\n    }\n\n    dp[0][0] = 1;\n    for (int i = 0; i < m; i++) {\n        for (int j = 0; j < n; j++) {\n            if (obstacleGrid[i][j] == 1) {\n                dp[i][j] = 0;\n                continue;\n            }\n            if (i - 1 >= 0) {\n                dp[i][j] += dp[i - 1][j];\n            }\n            if (j - 1 >= 0) {\n                dp[i][j] += dp[i][j - 1];\n            }\n        }\n    }\n\n    return dp[m - 1][n -1];\n}","language":"java","uuid":"be3ae9c6-617a-4821-a201-c40bcede6aff","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考链接"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/unique-paths/","openEdit":false,"children":[{"type":"formatted","text":"不同路径"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-ite
