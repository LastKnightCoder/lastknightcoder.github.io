ontent":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"已知存在一个按非降序排列的整数数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" ，数组中的值不必互不相同。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在传递给函数之前，"},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" 在预先未知的某个下标 "},{"type":"formatted","text":"k(0 <= k < nums.length)","code":true},{"type":"formatted","text":"上进行了 旋转 ，使数组变为 "},{"type":"formatted","text":"[nums[k], nums[k+1], ..., nums[n-1], nums[0], nums[1], ..., nums[k-1]]","code":true},{"type":"formatted","text":"（下标 从 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 开始 计数）。例如，"},{"type":"formatted","text":"[0,1,2,4,4,4,5,6,6,7]","code":true},{"type":"formatted","text":" 在下标 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 处经旋转后可能变为 "},{"type":"formatted","text":"[4,5,6,6,7,0,1,2,4,4]","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"给你旋转后的数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" 和一个整数 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":"，请你编写一个函数来判断给定的目标值是否存在于数组中。如果 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" 中存在这个目标值 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":"，则返回 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":"，否则返回 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [2,5,6,0,0,1,2], target = 0\n输出：true","language":"java","uuid":"2bfcdd7b-f3b9-4ccf-81b7-5c825cfe929b","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [2,5,6,0,0,1,2], target = 3\n输出：false","language":"java","uuid":"17045b07-225f-444f-959a-455120ba1bef","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"旋转数组的概念上面介绍的很清晰了，因为数组原来是有序的，所以我们本能的会想到使用二分搜索法去进行搜索，使用二分搜索法可以直接消灭掉一半的搜索范围，但是这个数组经过旋转后，它变得不是有序的了，这为我们使用二分搜索法带来了不便。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"为了使用二分搜索法，我们来看旋转数组的一个性质，随意的将旋转数组分为两部分，其中一部分必然是有序的"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E6%90%9C%E7%B4%A2%E6%97%8B%E8%BD%AC%E6%8E%92%E5%BA%8F%E6%95%B0%E7%BB%84II_e9051db2-77b7-4237-8cd5-48649cb3a271.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E6%90%9C%E7%B4%A2%E6%97%8B%E8%BD%AC%E6%8E%92%E5%BA%8F%E6%95%B0%E7%BB%84II_e9051db2-77b7-4237-8cd5-48649cb3a271.png"},{"type":"paragraph","children":[{"type":"formatted","text":"我们只需要判断 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 是否在有序的那一部分中即可，如果 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 在有序的那一部分中，那么我们就可以扔掉无序的那一部分，如果不在有序的那一部分，则我们就扔掉有序的部分，在无序的部分中寻找，无论怎样我们都可以消灭一半的搜索范围"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E6%90%9C%E7%B4%A2%E6%97%8B%E8%BD%AC%E6%8E%92%E5%BA%8F%E6%95%B0%E7%BB%84II-%E7%AC%AC%202%20%E9%A1%B5_086859fd-96b1-4e0e-a66b-20affc6bdbc1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E6%90%9C%E7%B4%A2%E6%97%8B%E8%BD%AC%E6%8E%92%E5%BA%8F%E6%95%B0%E7%BB%84II-%E7%AC%AC%202%20%E9%A1%B5_086859fd-96b1-4e0e-a66b-20affc6bdbc1.png"},{"type":"paragraph","children":[{"type":"formatted","text":"这里你可能会说，"},{"type":"formatted","text":"nums[mid] == nums[start]","code":true},{"type":"formatted","text":" 的情况呢? 这个时候其实我们不能判断那边是有序的"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E6%90%9C%E7%B4%A2%E6%97%8B%E8%BD%AC%E6%8E%92%E5%BA%8F%E6%95%B0%E7%BB%84II-%E7%AC%AC%203%20%E9%A1%B5_e812efc8-97d0-47ed-9b09-09242e4eab6c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E6%90%9C%E7%B4%A2%E6%97%8B%E8%BD%AC%E6%8E%92%E5%BA%8F%E6%95%B0%E7%BB%84II-%E7%AC%AC%203%20%E9%A1%B5_e812efc8-97d0-47ed-9b09-09242e4eab6c.png"},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候我们就不能使用二分搜索了，只能暴力搜索了。"}],"disableDrag":false},{"type":"code-block","code":"public boolean search(int[] nums, int target) {\n    int start = 0;\n    int end = nums.length - 1;\n\n    while (start <= end) {\n        int mid = start + (end - start) / 2;\n        if (nums[mid] == target) {\n            return true;\n        }\n\n        if (nums[start] == nums[mid]) {\n            start++;\n        }\n\n        if (nums[mid] > nums[start]) {\n            if (target >= nums[start] && target < nums[mid]) {\n                end = mid - 1;\n            } else {\n                start = mid + 1;\n            }\n        } else {\n            if (target > nums[mid] && target <= nums[end]) {\n                start = mid + 1;\n            } else {\n                end = mid - 1;\n            }\n        }\n    }\n\n    return false;\n}","language":"java","uuid":"7680c561-41b3-4d1c-9c19-c4f897b282f8","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/search-in-rotated-sorted-array-ii/","openEdit":false,"children":[{"type":"formatted","text":"搜索旋转排序数组 II"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/search-in-rotated-sorted-array-ii/solution/zai-javazhong-ji-bai-liao-100de-yong-hu-by-reedfan/","openEdit":false,"children":[{"type":"formatted","text":"搜索旋转排序数组 II 题解"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"双指针"},{"label":"搜索旋转排序数组II","href":"/docs/document/12/143.html"}],"prevPage":{"title":"盛水最多的容器","href":"/docs/document/12/142.html"},"nextPage":{"title":"外观数列","href":"/docs/document/12/145.html"},"createTime":1729001642611,"updateTime":1762957756705,"currentPath":"/docs/document/12/143.html"},"meta":{"type":"doc","publishTime":1764822964095}};
