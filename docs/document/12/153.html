nt/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":153,"title":"最长回文字符串","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个字符串 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":"，找到 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":" 中最长的回文子串。你可以假设 "},{"type":"formatted","text":"s","code":true},{"type":"formatted","text":" 的最大长度为 "},{"type":"formatted","text":"1000","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例 1："}],"disableDrag":false},{"type":"code-block","code":"输入: \"babad\"\n输出: \"bab\"\n注意: \"aba\" 也是一个有效答案。","language":"java","uuid":"426ec335-5c5e-4096-9137-f75497ac11f9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入: \"cbbd\"\n输出: \"bb\"","language":"java","uuid":"99562a11-96a8-4098-99c2-35fedf0d38de","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"暴力法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"扫描一遍字符串，判断 "},{"type":"inline-math","tex":"[i, j]","children":[{"type":"formatted","text":"[i, j]"}]},{"type":"formatted","text":" 范围内的字符串是不是回文字符串，并且在这个过程中记录最长的字符串"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201115144230_6fcd3608-2dde-4019-b9d1-bedec6e43bfe.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201115144230_6fcd3608-2dde-4019-b9d1-bedec6e43bfe.gif"},{"type":"code-block","code":"class Solution {\n    public String longestPalindrome(String s) {\n\n        if (s == null || s.length() < 2) {\n            return s;\n        }\n\n        char[] str = s.toCharArray();\n        int start = 0;\n        int maxLength = 1;\n\n        for (int i = 0; i < str.length - 1; i++) {\n            for (int j = i + 1; j < str.length; j++) {\n                // 如果 [i,j] 范围的字符串长度小于目前已知的最长回文字符串的长度，则无需判断\n                if ((j - i + 1) > maxLength) {\n                    // 如果是回文字符串，更新最长回文字符串的长度，以及该回文字符串的起始位置\n                    if (isPalindrome(str, i, j)) {\n                        maxLength = j - i + 1;\n                        start = i;\n                    }\n                }\n            }\n        }\n\n        return s.substring(start, start + maxLength);\n    }\n\n    // 判断 [start, end] 范围内的字符串是否为回文字符串\n    private boolean isPalindrome(char[] str, int start, int end) {\n        while (start <= end) {\n            // 判断两端的字符串是否相同,不相同则不可能是回文字符串\n            if (str[start] != str[end]) {\n                return false;\n            }\n            start++;\n            end--;\n        }\n\n        return true;\n    }\n}","language":"java","uuid":"4447fdf1-3525-419b-aaf5-a21fcb0e9e1a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"动态规划"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们开辟一个数组 "},{"type":"inline-math","tex":"\\text{dp}","children":[{"type":"formatted","text":"dp"}]},{"type":"formatted","text":"，"},{"type":"inline-math","tex":"\\text{dp}[i][j]","children":[{"type":"formatted","text":"dp[i][j]"}]},{"type":"formatted","text":" 表示 "},{"type":"inline-math","tex":"[i, j]","children":[{"type":"formatted","text":"[i, j]"}]},{"type":"formatted","text":" 范围内的字符串是否为回文字符串，那我们可以知道"}],"disableDrag":false},{"type":"block-math","tex":"\\text{dp}[i][j] = \n\\begin{cases}\n\\text{false}, &\\text{when} \\,\\,\\text{str}[i] \\neq \\text{str}[j] \\\\\n\\text{dp}[i+1][j-1], &\\text{when} \\,\\, \\text{str}[i] = \\text{str}[j]\n\\end{cases}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"\\text{str}[i] \\neq \\text{str}[j]","children":[{"type":"formatted","text":"str[i] \\neq str[j]"}]},{"type":"formatted","text":" 的时候，那么不可能是回文字符串，如果 "},{"type":"inline-math","tex":"\\text{str}[i] = \\text{str}[j]","children":[{"type":"formatted","text":"str[i] = str[j]"}]},{"type":"formatted","text":" 的时候，如果 "},{"type":"inline-math","tex":"dp[i+1][j-1] ","children":[{"type":"formatted","text":"dp[i+1][j-1] "}]},{"type":"formatted","text":" 是回文字符串，那么 "},{"type":"inline-math","tex":"dp[i][j]","children":[{"type":"formatted","text":"dp[i][j]"}]},{"type":"formatted","text":" 就是回文字符串。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果 "},{"type":"inline-math","tex":"i + 1 > j - 1","children":[{"type":"formatted","text":"i + 1 > j - 1"}]},{"type":"formatted","text":" 的话，这时 "},{"type":"inline-math","tex":"dp[i + 1][j - 1]","children":[{"type":"formatted","text":"dp[i + 1][j - 1]"}]},{"type":"formatted","text":" 没有意义，其实这种情况就是 "},{"type":"inline-math","tex":"[i,j]","children":[{"type":"formatted","text":"[i,j]"}]},{"type":"formatted","text":" 内只有两个字符，如果 "},{"type":"inline-math","tex":"\\text{str}[i] = \\text{str}[j]","children":[{"type":"formatted","text":"str[i] = str[j]"}]},{"type":"formatted","text":" 的话，那么它就是一个回文字符串，所以这时可以直接得到 "},{"type":"inline-math","tex":"dp[i][j] = \\text{true}","children":[{"type":"formatted","text":"dp[i][j] = true"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201115145707_f579e1cc-3bf3-4fb9-a816-97f02d5d8b3c.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201115145707_f579e1cc-3bf3-4fb9-a816-97f02d5d8b3c.gif"},{"type":"code-block","code":"class Solution {\n    public String longestPalindrome(String s) {\n        if (s == null || s.length() < 2) {\n            return s;\n        }\n\n        int length = s.length();\n        boolean dp[][] = new boolean[length][length];\n        for (int i = 0; i < length; i++) {\n            for (int j = 0; j < length; j++) {\n                dp[i][j] = false;\n            }\n        }\n\n        // [i,i] 表示单个字符，肯定是回文字符串\n        for (int i = 0; i < length; i++) {\n            dp[i][i] = true;\n        }\n\n        int maxLength = 1;\n        int begin  = 0;\n        // 因为 [i, j] 要用到 [i + 1, j - 1]，所以让 i 动\n        // 如果让 j 动，那么 [i + 1, j -1] 的范围没都判断过，会导致错误的结果\n        for (int j = 1; j < length; j++) {\n            for (int i = 0; i < j; i++) {\n                // 如果字符两端不相等，不是回文字符串\n                if (s.charAt(i) != s.charAt(j)) {\n                    dp[i][j] = false;\n                } else {\n                    // 如果只有两个元素，可以直接判断为回文字符串\n                    if (i + 1 > j - 1) {\n                        dp[i][j] = true;\n                    } else {\n                        // 与 dp[i + 1][j - 1] 相同\n                        dp[i][j] = dp[i + 1][j - 1];\n                    }\n                }\n\n                // 更新最长长度以及起始位置\n                if (dp[i][j] && (j - i + 1) > maxLength) {\n                    maxLength = j - i + 1;\n                    begin = i;\n                }\n            }\n            \n        }\n\n        return s.substring(begin, begin + maxLength);\n    }\n}","language":"java","uuid":"eba1e0ee-44ae-4a72-b1e6-53f16c43f51e","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"中间扩散法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"上面的情况都是检查某个范围内的字符串是否是回文字符串，而中心扩散法，则是以某点为中心进行向外扩散，在扩散的同时检查是否是回文字符串，过程如下"}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"检查该点左右两边的字符串是否相等，如果相等则继续扩散，如果不相等则停止扩散"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"停止扩散后记录该回文字符串的长度，如果大于当前记录的最大回文字符串的长度，则进行更新，为了获得该回文字符串，还需要记录该回文字符串的起始位置"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"需要注意的是，既可以从某个字符开始扩散，也可以从字符间的空隙进行扩散"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201119205727_3be5c016-125a-4524-9421-f434a9f5a901.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201119205727_3be5c016-125a-4524-9421-f434a9f5a901.png"},{"type":"paragraph","children":[{"type":"formatted","text":"从某个点进行扩散的代码如下："}],"disableDrag":false},{"type":"code-block","code":"private int centerSpread(String s, int left, int right) {\n    int length = 0;\n    while(left >=0 && right < s.length()) {\n        if (!(s.charAt(left) == s.charAt(right))) {\n            break;\n        }\n        length++;\n        left--;\n        right++;\n    }\n\n    return length;\n}","language":"java","uuid":"37592dc5-084d-4e48-b820-89756eebd712","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果从某个字符进行扩散，那么 "},{"type":"formatted","text":"left","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"right","code":true},{"type":"formatted","text":" 都是该字符的下标，如果从某个字符空隙进行扩散，则 "},{"type":"formatted","text":"left","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"right","code":true},{"type":"formatted","text":" 分别为该空隙左右两边字符的下标。扩散的示意图如下"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201119212528_5dac5c02-20ae-420f-bc61-ca743e3a30a3.gif","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/20201119212528_5dac5c02-20ae-420f-bc61-ca743e3a30a3.gif"},{"type":"paragraph","children":[{"type":"formatted","text":"完整代码如下"}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    public String longestPalindrome(String s) {\n        int begin = 0;\n        int maxLength = 1;\n\n        for (int i = 1; i < s.length(); i++) {\n            // 从字符空隙进行扩散\n            int length1 = centerSpread(s, i - 1, i);\n            // 从字符进行扩散\n            int length2 = centerSpread(s, i, i);\n\n            // 获得二者进行扩散的回文字符串的最大长度\n            int length = (2 * length1) >= (2 * length2 - 1) ? 2 * length1 : (2 * length2 - 1);\n            // 如果比 maxLength 大，则进行更新\n            if (length > maxLength) {\n                maxLength = length;\n                begin = i - length/2;\n            }\n        }\n\n        return s.substring(begin, begin + maxLength);\n    }\n\n    private int centerSpread(String s, int left, int right) {\n        int length = 0;\n        while(left >=0 && right < s.length()) {\n            if (!(s.charAt(left) == s.charAt(right))) {\n                break;\n            }\n            length++;\n            left--;\n            right++;\n        }\n\n        return length;\n    }\n}","language":"java","uuid":"f2f1d3b8-e71a-4f41-bc25-1dddb739fb50","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"Manacher算法"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"Manacher 算法是对中间扩散法的改进，首先我们在字符间填充 "},{"type":"formatted","text":"#","code":true},{"type":"formatted","text":" 以此充当字符空隙，得到一个新的字符串，然后用一个数组记录新字符串每个字符能够扩散多远"}],"disableDrag":false},{"type":"table","children":[{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"b"}]},{"type":"table-cell","children":[{"type":"formatted","text":"#"}]},{"type":"table-cell","children":[{"type":"formatted","text":"a"}]},{"type":"table-cell","children":[{"type":"formatted","text":"#"}]},{"type":"table-cell","children":[{"type":"formatted","text":"b"}]},{"type":"table-cell","children":[{"type":"formatted","text":"#"}]},{"type":"table-cell","children":[{"type":"formatted","text":"a"}]},{"type":"table-cell","children":[{"type":"formatted","text":"#"}]},{"type":"table-cell","children":[{"type":"formatted","text":"d"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们复用中心扩散法的代码"}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    public String longestPalindrome(String s) {\n        int begin = 0;\n        int maxLength = 1;\n        // babad => b#a#b#a#d\n        String str = String.join( \"#\", s.split(\"\"));\n\n        for (int i = 1; i < str.length(); i++) {\n            int length = centerSpread(str, i, i);\n            length = 2 * length - 1;\n            if (length >= maxLength) {\n                // #a# b#b 二者长度相同，但是应选择后面的\n                if (length > maxLength || str.charAt(i + length/2) != '#') {\n                    maxLength = length;\n                    begin = i - length/2;\n                }\n            }\n        }\n\n        // b#a#b => bab\n        return String.join( \"\", str.substring(begin, begin + maxLength).split(\"#\"));\n    }\n\n    private int centerSpread(String s, int left, int right) {\n        int length = 0;\n        while (left >= 0 && right < s.length()) {\n            if (!(s.charAt(left) == s.charAt(right))) {\n                break;\n            }\n            length++;\n            left--;\n            right++;\n        }\n\n        return length;\n    }\n}","language":"java","uuid":"897dcf02-beb1-452a-a09e-f66075956a18","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候我们还没有使用上面提到的数组，接下来我们需要利用数组记录一些信息，从而加快中间扩散法的速度。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"首先我们要知道如何加快中间扩散法的速度，这就需要利用回文字符串的特点，那就是"},{"type":"formatted","text":"回文字符串是左右对称","color":"hsl(270, 100%, 50%)"},{"type":"formatted","text":"的，当我们对回文字符串内的某个字符进行中间扩散时，我们可以先找到对称位置的字符，看看它能够扩散的多远"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_588b1e61-72a9-4776-8738-7b6eeb97769f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_588b1e61-72a9-4776-8738-7b6eeb97769f.png"},{"type":"paragraph","children":[{"type":"formatted","text":"如果它扩散的距离小于所处回文字符串的范围，那么根据对称的特点，我们不需要对该字符进行中间扩散，它能够扩散的距离就是对称位置所能扩散的距离"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_98ecb60f-2274-4370-97fe-0f1a3c03b078.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_98ecb60f-2274-4370-97fe-0f1a3c03b078.png"},{"type":"paragraph","children":[{"type":"formatted","text":"但是对称位置能够扩散的距离刚好在所处回文字符串的边界，或者大于所处的回文字符串，那么此时扩散的距离就不等于对称位置能够扩散的距离，而是需要进行扩散才能确定"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_cb578244-a822-428a-841b-0ea26e90c1b5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_cb578244-a822-428a-841b-0ea26e90c1b5.png"},{"type":"paragraph","children":[{"type":"formatted","text":"但是我们不需要从该字符串开始进行扩散，因为我们可以确定在回文字符串的范围内，它是对称的，所以我们只需要从回文字符串的外部进行扩散即可"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_fbd69151-8f69-4b80-bd90-6248080b70dd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_fbd69151-8f69-4b80-bd90-6248080b70dd.png"},{"type":"paragraph","children":[{"type":"formatted","text":"扩散完毕后记录能够扩散后的距离，并决定是否更新 "},{"type":"formatted","text":"begin","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"maxLength","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"现在还有一个问题，如何知道某个字符处于一个回文字符串中，我们通过记录两个变量 "},{"type":"formatted","text":"center","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"maxRight","code":true},{"type":"formatted","text":" 来表示一个回文字符串，"},{"type":"formatted","text":"center","code":true},{"type":"formatted","text":" 表示回文字符串的中心，"},{"type":"formatted","text":"maxRight","code":true},{"type":"formatted","text":" 表示中心离回文字符串右边界的距离"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_507aa451-326a-436c-b73e-353b0bfb76a8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_507aa451-326a-436c-b73e-353b0bfb76a8.png"},{"type":"paragraph","children":[{"type":"formatted","text":"我们认为如果字符的下标小于 "},{"type":"formatted","text":"center + maxRight","code":true},{"type":"formatted","text":"，那么它就在一个回文字符串中。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"那什么时候更新这两个变量呢? 那就是在某个字符扩散之后，他向右边能够扩散的范围大于当前的 "},{"type":"formatted","text":"center + maxRight","code":true},{"type":"formatted","text":"，那么就更新 "},{"type":"formatted","text":"center","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"maxRight","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_720b6ce7-bd21-4737-a4bf-d19576b5f493.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/image_720b6ce7-bd21-4737-a4bf-d19576b5f493.png"},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下："}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    public String longestPalindrome(String s) {\n\t    // 将字符串转化为 a#b#c#b 的形式\n        // String newStr = String.join( \"#\", s.split(\"\"));\n        StringBuilder stringBuilder = new StringBuilder();\n        for (int i = 0; i < s.length(); i++) {\n            if (i != s.length() - 1) {\n                stringBuilder.append(s.charAt(i) + \"#\");\n            } else {\n                stringBuilder.append(s.charAt(i));\n            }\n        }\n        String newStr = stringBuilder.toString();\n\n         // records[i] 表示扩散距离\n        int[] records = new int[newStr.length()];\n\n        records[0] = 0;\n\t\t// 回文字符串的起始位置和长度\n        int begin = 0;\n        int maxLength = 1;\n\t\t// 表示回文字符串\n        int center = 0;\n        int maxRight = 0;\n\n        for (int i = 1; i < newStr.length(); i++) {\n\t\t    // 如果 str[i] 在某个回文字符串中\n            if (i <= center + maxRight) {\n\t\t\t   // 对称位置的扩散距离\n                int mirrorLength = records[2 * center - i];\n\t\t\t   // 超过或等于 center + maxRight 表示的边界，进行中间扩散，并进行必要的更新\n                if (i + mirrorLength >= center + maxRight) {\n                    // 扩散\n                    int length = center + maxRight - i;\n                    while (i + length + 1 < newStr.length() && (i -length - 1) >= 0) {\n                        if (newStr.charAt(i + length + 1) != newStr.charAt(i - length - 1)) {\n                            break;\n                        }\n                        length++;\n                    }\n                    records[i] = length;\n                    \n                    // 更新\n                    if (2 * length + 1 >= maxLength) {\n                        if (2 * length + 1 > maxLength || newStr.charAt(center) != '#') {\n                            begin = i - length;\n                            maxLength = 2 * length + 1;\n                        }\n                    }\n\n                    if (i + length > center + maxRight) {\n                        center = i;\n                        maxRight = length;\n                    }\n\n                } else {\n\t\t\t\t   // 小于 center + maxRight 形成的边界，直接使用对称位置的值\n                    records[i] = mirrorLength;\n                }\n            } else {\n\t\t\t   // 不在回文字符串中，进行中心扩散，并进行必要的更新\n                int length = 0;\n                while (i + length + 1 < newStr.length() && (i - length - 1) >= 0) {\n                    if (newStr.charAt(i + length + 1) != newStr.charAt(i - length - 1)) {\n                        break;\n                    }\n                    length++;\n                }\n\n                if (2 * length + 1 > maxLength) {\n                    begin = i - length;\n                    maxLength = 2 * length + 1;\n                }\n\n                center = i;\n                maxRight = length;\n                records[i] = length;\n            }\n        }\n\n\t    // 将 a#b#b#a 形式的字符串转化为 abba\n        // return String.join( \"\", newStr.substring(begin, begin + maxLength).split(\"#\"));\n        String ss = newStr.substring(begin, begin + maxLength);\n        StringBuilder stringBuilder1 = new StringBuilder();\n        for (int i = 0; i < ss.length(); i++) {\n            if (ss.charAt(i) != '#') {\n                stringBuilder1.append(ss.charAt(i));\n            }\n        }\n\n        return stringBuilder1.toString();\n    }\n}","language":"java","uuid":"b9b5fb6c-e310-4bd2-bbe8-11320bb541a2","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"动态规划"},{"label":"最长回文字符串","href":"/docs/document/12/153.html"}],"prevPage":{"title":"最小路径和","href":"/docs/document/12/152.html"},"nextPage":{"title":"不同的二叉搜索树","href":"/docs/document/12/116.html"},"createTime":1729002565245,"updateTime":1752587036851,"currentPath":"/docs/document/12/153.html"},"meta":{"type":"doc","publishTime":1764772322640}};
