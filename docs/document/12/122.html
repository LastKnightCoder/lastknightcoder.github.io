/126.html"},{"title":"解码方法","href":"/docs/document/12/135.html"},{"title":"跳跃游戏II","href":"/docs/document/12/144.html"},{"title":"最大子序和","href":"/docs/document/12/151.html"},{"title":"最小路径和","href":"/docs/document/12/152.html"},{"title":"最长回文字符串","href":"/docs/document/12/153.html"},{"title":"不同的二叉搜索树","href":"/docs/document/12/116.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"}]},{"title":"深度优先遍历","children":[{"title":"单词搜索","href":"/docs/document/12/128.html"},{"title":"复原 IP 地址","href":"/docs/document/12/130.html"},{"title":"全排列","href":"/docs/document/12/138.html"},{"title":"子集","href":"/docs/document/12/148.html"},{"title":"组合","href":"/docs/document/12/149.html"},{"title":"组合总数","href":"/docs/document/12/150.html"},{"title":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"}]},{"title":"贪心","children":[{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},{"title":"加油站","href":"/docs/document/12/162.html"},{"title":"用最少数量的箭引爆气球","href":"/docs/document/12/164.html"}]},{"title":"数学","children":[{"title":"x 的平方根","href":"/docs/document/12/155.html"},{"title":"字符串相乘","href":"/docs/document/12/245.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":122,"title":"两数之和","content":[{"type":"paragraph","children":[{"type":"formatted","text":"LeetCode：两数之和。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个整数数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" 和一个目标值 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":"，请你在该数组中找出和为目标值的那两个整数，并返回他们的数组下标。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"你可以假设每种输入只会对应一个答案，但是，数组中同一个元素不能使用两遍。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"你可以按任意顺序返回答案。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [2,7,11,15], target = 9\n输出：[0,1]\n解释：因为 nums[0] + nums[1] == 9 ，返回 [0, 1]","language":"Java","uuid":"612ce24b-5941-4f3f-bf20-95708baa37f2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2:"}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [3,2,4], target = 6\n输出：[1,2]","language":"java","uuid":"d05f985b-fb9e-4567-829b-2bdf6c2091d1","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"解决该方法最容易的版本是，首先固定一个数 "},{"type":"formatted","text":"nums[i]","code":true},{"type":"formatted","text":"，然后遍历数组查看是否包含 "},{"type":"formatted","text":"target-nums[i]","code":true},{"type":"formatted","text":" 的数字，代码如下："}],"disableDrag":false},{"type":"code-block","code":"public int[] twoSum(int[] nums, int target) {\n    int[] res = new int[2];\n    // 首先固定 nums[i]\n    for (int i = 0; i \u003c nums.length - 1; i++) {\n        // 接着在剩下的数字查找是否有数字等于 target - nums[j] \n        // 或者说 nums[i] + nums[j] = target\n        for (int j = i + 1; j \u003c nums.length; j++) {\n            if (nums[i] + nums[j] == target) {\n                res[0] = i;\n                res[1] = j;\n                return res;\n            }\n        }\n    }\n    return res;\n}","language":"java","uuid":"5b4b29c3-dc3b-4aa0-b277-475a8f52b8e0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用这种双重循环的方法，它的时间复杂度是 "},{"type":"inline-math","tex":"O(n^2)","children":[{"type":"formatted","text":"O(n^2)"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"那有没有只需要扫描一遍数组即可以确定答案的办法，答案是有，我们可以利用哈希表做这件事情。我们在遍历数组时，我们将数组中的数字以及对应的下标以键值对的形式添加到一个哈希表中，每次我们在遍历一个数字 "},{"type":"formatted","text":"nums[i]","code":true},{"type":"formatted","text":" 时，在添加该数字到哈希表之前(之所以是之前，以防一个数字被用两次，可以自己举个例子想想)，都在哈希表中查看是否有数字为 "},{"type":"formatted","text":"target - nums[i]","code":true},{"type":"formatted","text":"，因为向哈希表查询的时间复杂度为 "},{"type":"inline-math","tex":"O(1)","children":[{"type":"formatted","text":"O(1)"}]},{"type":"formatted","text":"，所以这种只用遍历一遍数组即可知道解的方法，它的时间复杂度为 "},{"type":"inline-math","tex":"O(n)","children":[{"type":"formatted","text":"O(n)"}]},{"type":"formatted","text":"，代码如下："}],"disableDrag":false},{"type":"code-block","code":"public int[] twoSum(int[] nums, int target) {\n    int[] res = new int[2];\n    HashMap\u003cInteger, Integer\u003e map = new HashMap\u003c\u003e();\n    for (int i = 0; i \u003c nums.length; i++) {\n        // 首先进行查询，查询完了在将 nums[i] 添加到哈希表中\n        if (map.containsKey(target - nums[i])) {\n            res[0] = map.get(target - nums[i]);\n            res[1] = i;\n            break;\n        }\n        map.put(nums[i], i);\n    }\n    return res;\n}","language":"java","uuid":"2833aa82-bf34-487b-9930-fccef622c8a2","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"扩展：有序数组"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"现在我们对上面的题目加个条件，给定的数组是有序的，且是从小到大排序的，那么有没有更快的方法来找到答案。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果数组是有序的话，那么我们可以使用双指针的解法，首先一个指针指向数组的开头，即最小的那个数字，另一个指针指向数组的末尾，即最大的那个数字。接着我们通过移动这两个指针来找到答案"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果这两个指针指向的数字之和大于 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":"，那么我们要将指向末尾的指针向前移，因为第一个指针指向的数是最小的数，所以这时任何数加上后一个指针指向的数都会比 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":" 大，所以该数不可能是解，排除"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果小于，那么指向开头的指针向前移，道理同上，因为这时任何一个数和第一个指针指向的数相加都小于 "},{"type":"formatted","text":"target","code":true},{"type":"formatted","text":"，所以该指针指向的数不可能是解，排除"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果等于，那就是找到了"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"以下图为例："}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E4%B8%A4%E6%95%B0%E4%B9%8B%E5%92%8C_a6cc6a97-1eea-4531-94c4-36ea0d23201f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E4%B8%A4%E6%95%B0%E4%B9%8B%E5%92%8C_a6cc6a97-1eea-4531-94c4-36ea0d23201f.png"},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下："}],"disableDrag":false},{"type":"code-block","code":"public int[] twoSum(int[] nums, int target) {\n    int p1 = 0;\n    int p2 = nums.length - 1;\n    int[] res = new int[2];\n    while (p1 \u003c p2) {\n        if (nums[p1] + nums[p2] == targets) {\n            res[0] = p1;\n            res[1] = p2;\n            break;\n        }\n        if (nums[p1] + nums[p2] \u003c target) {\n            p1++;\n        } else {\n            p2--;\n        }\n    }\n    return res;\n}","language":"java","uuid":"ff2a6600-cb76-4c48-aa0c-dc2945cdb6ea","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/two-sum/","openEdit":false,"children":[{"type":"formatted","text":"两数之和"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"哈希表"},{"label":"两数之和","href":"/docs/document/12/122.html"}],"prevPage":{"title":"插入区间","href":"/docs/document/12/330.html"},"nextPage":{"title":"字母异位词分组","href":"/docs/document/12/147.html"},"createTime":1728990519155,"updateTime":1752586995540,"currentPath":"/docs/document/12/122.html"},"meta":{"type":"doc","publishTime":1764823684255}};
