turn q;\n    }\n    q = map.get(q);\n  }\n\n  return null;\n};\n\nconst dfs = (root:TreeNode | null, map: Map<TreeNode, TreeNode>) => {\n  if (!root) return;\n  if (root.left) {\n    map.set(root.left, root);\n    dfs(root.left, map);\n  }\n  if (root.right) {\n    map.set(root.right, root);\n    dfs(root.right, map);\n  }\n}","language":"TypeScript","uuid":"58673284-2725-4293-9983-d367a2df263b","children":[{"type":"formatted","text":""}]},{"type":"header","disableDrag":false,"children":[{"type":"formatted","text":"递归"}],"level":3},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"需要重新定义下 "},{"type":"formatted","text":"lowestCommonAncestor","code":true},{"type":"formatted","text":" 的语义，"},{"type":"formatted","text":"如果该树中存在 ","bold":true,"color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","bold":true,"color":"#e33a32","darkColor":"#fa7873","text":"p","code":true},{"type":"formatted","bold":true,"color":"#e33a32","darkColor":"#fa7873","text":", "},{"type":"formatted","bold":true,"color":"#e33a32","darkColor":"#fa7873","text":"q","code":true},{"type":"formatted","bold":true,"color":"#e33a32","darkColor":"#fa7873","text":" 则返回最近公共祖先，如果只有一个存在则返回对应的节点，都不存在返回 "},{"type":"formatted","bold":true,"color":"#e33a32","darkColor":"#fa7873","text":"null","code":true},{"type":"formatted","text":"，因为题目保证了一定存在公共祖先，因此该返回的就是最近公共祖先，对子树递归结果的处理分为三种情况："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"如果左右子树都返回值，说明值分别在两颗子树中，则返回 "},{"type":"formatted","text":"root","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"如果只有左子树有值，全在左子树中，返回左子树"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"如果只有右子树有值，全在右子树中，返回右子树"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"什么时候终止递归呢？当
