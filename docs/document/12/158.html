nt/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":158,"title":"多数元素","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个大小为 "},{"type":"formatted","text":"n","code":true},{"type":"formatted","text":" 的数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" ，返回其中的多数元素。多数元素是指在数组中出现次数大于 "},{"type":"formatted","text":"⌊n/2⌋","code":true},{"type":"formatted","text":" 的元素。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"你可以假设数组是非空的，并且给定的数组总是存在多数元素。"}],"disableDrag":false},{"type":"code-block","code":"示例 1：\n输入：nums = [3,2,3]\n输出：3\n\n示例 2：\n输入：nums = [2,2,1,1,1,2,2]\n输出：2","language":"","uuid":"8afe50b9-167e-4794-a571-3803c0a73a06","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"n == nums.length","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"1 <= n <= 5 * 10^4","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"-10^9 <= nums[i] <= 10^9","code":true}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"进阶：尝试设计时间复杂度为 "},{"type":"inline-math","tex":"O(n)","children":[{"type":"formatted","text":"O(n)"}]},{"type":"formatted","text":"、空间复杂度为 "},{"type":"inline-math","tex":"O(1)","children":[{"type":"formatted","text":"O(1)"}]},{"type":"formatted","text":" 的算法解决此问题。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"遍历数组时使用 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":" 记录每个元素出现的次数，当有元素超过 "},{"type":"formatted","text":"⌊n/2⌋ ","code":true},{"text":"时，返回该元素。","type":"formatted"}],"disableDrag":false},{"type":"code-block","code":"function majorityElement(nums: number[]): number {\n    const l = nums.length;\n    if (l <= 1) return nums[0];\n\n    const n  = Math.floor(l / 2);\n    const map = new Map();\n\n    for (const num of nums) {\n        const count = map.get(num);\n        if (!count) {\n            map.set(num, 1);\n        } else {\n            map.set(num, count + 1);\n            if (count + 1 > n) return num;\n        }\n    }\n};","language":"ts","uuid":"4b7d4073-aaed-4ff2-9390-eebe6e46b87d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"Map","code":true},{"type":"formatted","text":" 的空间复杂度为 "},{"type":"inline-math","tex":"O(n)","children":[{"type":"formatted","text":"O(n)"}]},{"type":"formatted","text":"，是否可以使用一个变量就可以实现记录，可以将整个过程看作是守擂，每次遍历元素就相当于挑战擂主，如果和擂主相同，则一起站在擂台上，由于一定有一个多数元素，因此最后站在擂台上的一定是多数元素"}],"disableDrag":false},{"type":"code-block","code":"function majorityElement(nums: number[]): number {\n    // 擂台上的人数\n    let votes = 0;\n    // 擂主\n    let ret;\n    for (const num of nums) {\n        // 擂台上没人\n        if (votes === 0) ret = num;\n        votes += (num === ret ? 1 : -1);\n    }\n\n    return ret;\n};","language":"ts","uuid":"728b80e0-c7b7-46f6-bce4-2d6dca408b82","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":""}],"disableDrag":false}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"数组"},{"label":"多数元素","href":"/docs/document/12/158.html"}],"nextPage":{"title":"除自身以外数组的乘积","href":"/docs/document/12
