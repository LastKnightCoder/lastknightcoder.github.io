":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":137,"title":"罗马数字与数字的转换","content":[{"type":"header","children":[{"type":"formatted","text":"罗马数字转数字"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"罗马数包含以下七种字符"}],"disableDrag":false},{"type":"table","children":[{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"字符"}]},{"type":"table-cell","children":[{"type":"formatted","text":"数值"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"I"}]},{"type":"table-cell","children":[{"type":"formatted","text":"1"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"V"}]},{"type":"table-cell","children":[{"type":"formatted","text":"5"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"X"}]},{"type":"table-cell","children":[{"type":"formatted","text":"10"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"L"}]},{"type":"table-cell","children":[{"type":"formatted","text":"50"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"C"}]},{"type":"table-cell","children":[{"type":"formatted","text":"100"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"D"}]},{"type":"table-cell","children":[{"type":"formatted","text":"500"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"M"}]},{"type":"table-cell","children":[{"type":"formatted","text":"1000"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"例如， 罗马数字 2 写做 II ，即为两个并列的 1。12 写做 XII ，即为 X + II 。 27 写做 XXVII, 即为 XX + V + II 。通常情况下，罗马数字中小的数字在大的数字的右边。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但也存在特例，例如 4 不写做 IIII，而是 IV。数字 1 在数字 5 的左边，所表示的数等于大数 5 减小数 1 得到的数值 4 。同样地，数字 9 表示为 IX。这个特殊的规则只适用于以下六种情况："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"I 可以放在 V (5) 和 X (10) 的左边，来表示 4 和 9。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"X 可以放在 L (50) 和 C (100) 的左边，来表示 40 和 90。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"C 可以放在 D (500) 和 M (1000) 的左边，来表示 400 和 900。"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个整数，将其转为罗马数字，输入确保在 1 到 3999 的范围内。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"将罗马数字在每个位置的所有可能的取值列出，例如对于个位有如下情况"}],"disableDrag":false},{"type":"code-block","code":"\"\", \"I\", \"II\", \"III\", \"IV\", \"V\", \"VI\", \"VII\", \"VIII\", \"IX\"","language":"java","uuid":"a0dbf785-de57-4068-bc21-aa180c9ee741","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"以上字符分别对应 0-9，然后取出个位的数字，根据数字的大小选择对应的字符，接着取出十位上的数字，找到对应的字符，以此类推"}],"disableDrag":false},{"type":"code-block","code":"import java.util.Stack;\n\npublic class Solution {\n    public String intToRoman(int num) {\n        // 列出每个位置的所有情况\n        String[][] maps = new String[4][];\n        maps[0] = new String[]{\"\", \"I\", \"II\", \"III\", \"IV\", \"V\", \"VI\", \"VII\", \"VIII\", \"IX\"};\n        maps[1] = new String[]{\"\", \"X\", \"XX\", \"XXX\", \"XL\", \"L\", \"LX\", \"LXX\", \"LXXX\", \"XC\"};\n        maps[2] = new String[]{\"\", \"C\", \"CC\", \"CCC\", \"CD\", \"D\", \"DC\", \"DCC\", \"DCCC\", \"CM\"};\n        // 题目规定数字范围在 1-3999，所以这里列到 3000 即可\n        maps[3] = new String[]{\"\", \"M\", \"MM\", \"MMM\"};\n\n        StringBuilder stringBuilder = new StringBuilder();\n        Stack<String> stack = new Stack();\n        // 依次取出个位，十位 ...\n        int index = 0;\n        while (num != 0) {\n            int n = num % 10;\n            num /= 10;\n            stack.push(maps[index][n]);\n            index++;\n        }\n\n        while (!stack.isEmpty()) {\n            stringBuilder.append(stack.pop());\n        }\n\n        return stringBuilder.toString();\n    }\n}","language":"java","uuid":"2fef4990-1ad3-4724-954c-e0105ed7c141","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一种思路是贪心法，想想我们是怎么找零钱的，每次都找面值最大的，我们找 154 元，我们首先找面值最大的 100 块，然后剩 54，接着找面值最大的 50，剩 4 元，找 4 个硬币。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们把要转化的数字看做是要找的零钱，罗马数字就是对应的钞票，我们把罗马数字对应的钞票有多种情况列出来，然后按照找零钱的规则找钱即可"}],"disableDrag":false},{"type":"code-block","code":"import java.util.Stack;\n\npublic class Solution {\n    public String intToRoman(int num) {\n        // 罗马\"钞票\"的面值大小依次排列\n        int[] nums = {1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1};\n        String[] roma = {\"M\", \"CM\", \"D\", \"CD\", \"C\", \"XC\", \"L\", \"XL\", \"X\", \"IX\", \"V\", \"IV\", \"I\"};\n        int index = 0;\n        StringBuilder stringBuilder = new StringBuilder();\n        while (num != 0) {\n            // 使用目前最大的面值\n            if (num >= nums[index]) {\n                stringBuilder.append(roma[index]);\n                num -= nums[index];\n                continue;\n            }\n            index++;\n        }\n\n        return stringBuilder.toString();\n    }\n}","language":"java","uuid":"400eb376-c908-4b13-a0cd-1737935a4389","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"数字转罗马数字"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"罗马数字与数字的转换规则如上题介绍，这道题的要求是将罗马数字转化为数字。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"如果还是将罗马数字看做钞票，将其转化为数字的过程，不就是相当于数钱吗！将钞票转化为对应的数值，然后加起来即可"}],"disableDrag":false},{"type":"code-block","code":"public class Solution {\n    public int romanToInt(String s) {\n        // 为了处理方便，将两位的罗马数字转为一位的字符\n        s = s.replace(\"IV\", \"a\");\n        s = s.replace(\"IX\", \"b\");\n        s = s.replace(\"XL\", \"c\");\n        s = s.replace(\"XC\", \"d\");\n        s = s.replace(\"CD\", \"e\");\n        s = s.replace(\"CM\", \"f\");\n        \n        int sum = 0;\n        // 将罗马数字对应的数值加起来即可\n        for (char c: s.toCharArray()) {\n            sum += romaToNum(c);\n        }\n        \n        return sum;\n    }\n    \n    // 罗马数字对应的数值\n    private int romaToNum(char c) {\n        switch (c) {\n            case 'I' : return 1;\n            case 'V': return 5;\n            case 'X': return 10;\n            case 'L': return 50;\n            case 'C': return 100;\n            case 'D': return 500;\n            case 'M': return 1000;\n            case 'a': return 4;\n            case 'b': return 9;\n            case 'c': return 40;\n            case 'd': return 90;\n            case 'e': return 400;\n            case 'f': return 900;\n            default: return 0;\n        }\n    }\n}","language":"java","uuid":"67a6c924-5d87-41c6-b938-2ad35e47be59","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"还有一种编程的思路，与上面的贪心法一样，直接检查最大的钞票，然后一直加起来"}],"disableDrag":false},{"type":"code-block","code":"public class Solution {\n    public int romanToInt(String s) {\n        int[] nums = {1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1};\n        String[] roma = {\"M\", \"CM\", \"D\", \"CD\", \"C\", \"XC\", \"L\", \"XL\", \"X\", \"IX\", \"V\", \"IV\", \"I\"};\n        int index = 0;\n        int sum = 0;\n        while (!\"\".equals(s)) {\n            // 依次查找开头的最大钞票，然后加起来\n            if (s.startsWith(roma[index])) {\n                sum += nums[index];\n                s = s.substring(roma[index].length());\n                continue;\n            }\n            index++;\n        }\n        return sum;\n    }\n}","language":"java","uuid":"7b21cab5-c8e0-4a9c-b8be-fb76ce56f368","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/integer-to-roman/","openEdit":false,"children":[{"type":"formatted","text":"整数转罗马数字"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/roman-to-integer/","openEdit":false,"children":[{"type":"formatted","text":"罗马数字转整数"}]},{"type":"formatted","text":""}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"贪心"},{"label":"罗马数字与数字的转换","href":"/docs/document/12/137.html"}],"prevPage":{"title":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"},"nextPage":{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},"createTime":1729000848726,"updateTime":1744296829332,"currentPath":"/docs/document/12/137.html"},"meta":{"type":"doc","publishTime":1764820858566}};
