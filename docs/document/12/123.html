"交错的字符串","href":"/docs/document/12/125.html"},{"title":"不同路径","href":"/docs/document/12/126.html"},{"title":"解码方法","href":"/docs/document/12/135.html"},{"title":"跳跃游戏II","href":"/docs/document/12/144.html"},{"title":"最大子序和","href":"/docs/document/12/151.html"},{"title":"最小路径和","href":"/docs/document/12/152.html"},{"title":"最长回文字符串","href":"/docs/document/12/153.html"},{"title":"不同的二叉搜索树","href":"/docs/document/12/116.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"}]},{"title":"深度优先遍历","children":[{"title":"单词搜索","href":"/docs/document/12/128.html"},{"title":"复原 IP 地址","href":"/docs/document/12/130.html"},{"title":"全排列","href":"/docs/document/12/138.html"},{"title":"子集","href":"/docs/document/12/148.html"},{"title":"组合","href":"/docs/document/12/149.html"},{"title":"组合总数","href":"/docs/document/12/150.html"},{"title":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"}]},{"title":"贪心","children":[{"title":"罗马数字与数字的转换","href":"/docs/document/12/137.html"},{"title":"买卖股票的最佳时机 II","href":"/docs/document/12/159.html"},{"title":"加油站","href":"/docs/document/12/162.html"},{"title":"用最少数量的箭引爆气球","href":"/docs/document/12/164.html"}]},{"title":"数学","children":[{"title":"x 的平方根","href":"/docs/document/12/155.html"},{"title":"字符串相乘","href":"/docs/document/12/245.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":123,"title":"三数之和","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个包含 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 个整数的数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":"，判断 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" 中是否存在三个元素 "},{"type":"inline-math","tex":"a","children":[{"type":"formatted","text":"a"}]},{"type":"formatted","text":"，"},{"type":"inline-math","tex":"b","children":[{"type":"formatted","text":"b"}]},{"type":"formatted","text":"，"},{"type":"inline-math","tex":"c","children":[{"type":"formatted","text":"c"}]},{"type":"formatted","text":" ，使得 "},{"type":"inline-math","tex":"a + b + c = 0","children":[{"type":"formatted","text":"a + b + c = 0"}]},{"type":"formatted","text":"。请你找出所有和为 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":" 且不重复的三元组。"}],"disableDrag":false},{"type":"callout","calloutType":"note","title":"","children":[{"type":"paragraph","children":[{"type":"formatted","text":"注意：答案中不可以包含重复的三元组。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例1:"}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [-1,0,1,2,-1,-4]\n输出：[[-1,-1,2],[-1,0,1]]","language":"java","uuid":"24afe7b4-6a27-49f1-8ba4-34b5f5be7d39","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2:"}],"disableDrag":false},{"type":"code-block","code":"输入：nums = []\n输出：[]","language":"java","uuid":"3a98cd9e-0423-4f11-a8d9-d1f4d663acd1","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"如果只是单纯的三数之和，那么就是一道很简单的题，首先对数组进行排序，接着固定一个数，然后在剩下的数中查找有无两个数字与这个固定的数字加起来为 0，有则找到一对，使用双指针即可，具体可以参考两数之和。但是题目要求找到所有的不重复的三元组，这就使得题目有点不一样了。正是因为在这里耗费了大量的时间，我才决定将此题记录下来。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"一开始我的想法就是先找到所有的三元组，然后去重。找到所有的三元组容易，但是去重难，一开始我想使用 "},{"type":"formatted","text":"Set","code":true},{"type":"formatted","text":" 集合进行去重。但是因为每一个三元组都是一个 List 集合，去重比较的是地址值，所以直接添加 "},{"type":"formatted","text":"List","code":true},{"type":"formatted","text":" 集合到 "},{"type":"formatted","text":"Set","code":true},{"type":"formatted","text":" 集合中是无法去重。因此我产生了一个大胆的想法，因为它比较的是地址值，所以我想写一个类继承 List 类，然后重写它的 "},{"type":"formatted","text":"hashCode","code":true},{"type":"formatted","text":" 与 "},{"type":"formatted","text":"equals","code":true},{"type":"formatted","text":" 方法(我不知道 Set 是不是靠这两个判重的)，但是最后还是失败了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"后来我就去看题解，但是因为陷入了牛角尖，无法理解，觉得人家讲的不对，后来我就试图复现人家的代码，因为代码是根据别人的思路，但是按照自己的理解写的，所以写的不对，通过对比人家的代码，发现有一个地方写错了，这个地方正是我陷入误区的地方，所以通过纠正我就明白别人的算法，也就明白了如何去重。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"算法去重的核心就是如果当前固定的数与上一个数相同，那么就跳过这个数。","highlight":true},{"type":"formatted","text":"我一开始不理解的原因有两个："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"没有意识到题目要求所有的三元组，而我之前的算法还是两数之和的逻辑，找到一个符合条件的三元组则结束，这就导致我没有意识到每一次都会找到所有与固定数有关的所有三元组，这就意味着下面那个数如果与它之前的数相同的话，它就没有查找的必要，否则就会重复。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"另一个原因就是我看成了如果下一个数与当前数相同，则跳过当前数，直接来到下一个数，这个算法肯定是错的，怪自己没有看清"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一个有可能重复的情况，先举个例子，给定数组 "},{"type":"formatted","text":"[-1, 0, 0, 1, 1 ]","code":true},{"type":"formatted","text":"，首先固定数 "},{"type":"formatted","text":"-1","code":true}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E4%B8%89%E6%95%B0%E4%B9%8B%E5%92%8C_32f9a500-f9f7-45af-b9ef-4edd36b25743.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E4%B8%89%E6%95%B0%E4%B9%8B%E5%92%8C_32f9a500-f9f7-45af-b9ef-4edd36b25743.png"},{"type":"paragraph","children":[{"type":"formatted","text":"此时我们找到了一个三元组 "},{"type":"formatted","text":"[-1, 0, 1]","code":true},{"type":"formatted","text":" 使得三数之和为 "},{"type":"inline-math","tex":"0","children":[{"type":"formatted","text":"0"}]},{"type":"formatted","text":"，但是因为要找到所有的三元组，所以要继续寻找"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E4%B8%89%E6%95%B0%E4%B9%8B%E5%92%8C2_83a8a4fb-7b52-4bfb-8e0d-c377c3aad3ef.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E4%B8%89%E6%95%B0%E4%B9%8B%E5%92%8C2_83a8a4fb-7b52-4bfb-8e0d-c377c3aad3ef.png"},{"type":"paragraph","children":[{"type":"formatted","text":"这时我们发现又找到一个三元组 "},{"type":"formatted","text":"[-1, 0, 1]","code":true},{"type":"formatted","text":"，但是我们发现这个三元组与之前那个三元组重复了，其重复的原因就是 "},{"type":"formatted","text":"nums[start] == nums[start + 1] || nums[end] == nums[end - 1]","code":true},{"type":"formatted","text":"，所以我们只要遇到上述情况直接跳过当前数，例如当 "},{"type":"formatted","text":"nums[start] == nums[start + 1]","code":true},{"type":"formatted","text":" 的时候，直接 "},{"type":"formatted","text":"start++","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    public List<List<Integer>> threeSum(int[] nums) {\n        List<List<Integer>> results = new ArrayList<>();\n        if (nums.length < 3) {\n            return results;\n        }\n\n        // 首先进行排序\n        Arrays.sort(nums);\n\n        \n        for (int i = 0; i < nums.length; i++) {\n            int target = nums[i];\n            \n            // 因为是升序，如果当前的数 > 0，说明后面的数全大于 0，不可能加起来为 0\n            if (target > 0) {\n                break;\n            }\n            // 不足三个数，break\n            if (i + 2 >= nums.length) {\n                break;\n            }\n\n            // 如果当前数与前一个数相同，防止重复，跳过\n            if (i > 0 && nums[i - 1] == nums[i]) continue;\n\n            int start = i + 1;\n            int end = nums.length - 1;\n            while (start < end) {\n                if (nums[start] + nums[end] + target == 0) {\n                    List<Integer> res = new ArrayList<>();\n                    res.add(target);\n                    res.add(nums[start]);\n                    res.add(nums[end]);\n                    results.add(res);\n\n                    // 防止重复\n                    while (start < end && nums[start] == nums[start + 1]) start++;\n                    while (start < end && nums[end] == nums[end - 1]) end--;\n\n                    start++;\n                    end--;\n\n                } else if (nums[start] + nums[end] + target < 0) {\n                    start++;\n                } else {\n                    end--;\n                }\n            }\n        }\n        return results;\n    }\n}","language":"java","uuid":"7952f227-1a60-493b-9bfe-4b1931c8c917","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/3sum/","openEdit":false,"children":[{"type":"formatted","text":"三数之和"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"双指针"},{"label":"三数之和","href":"/docs/document/12/123.html"}],"prevPage":{"title":"两数之和","href":"/docs/document/12/122.html"},"nextPage":{"title":"合并区间","href":"/docs/document/12/131.html"},"createTime":1728990774582,"updateTime":1752586977617,"currentPath":"/docs/document/12/123.html"},"meta":{"type":"doc","publishTime":1764775995446}};
