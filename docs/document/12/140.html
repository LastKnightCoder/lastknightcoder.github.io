":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":140,"title":"删除排序链表中的重复元素II","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"存在一个"},{"type":"formatted","text":"按升序排列","bold":true,"highlight":true},{"type":"formatted","text":"的链表，给你这个链表的头节点 "},{"type":"formatted","text":"head","code":true},{"type":"formatted","text":" ，请你删除链表中所有存在数字重复情况的节点，只保留原始链表中没有重复出现的数字。返回同样按升序排列的结果链表。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：1 -> 1 -> 2 -> 3 -> 3 -> 4 -> null\n输出：2 -> 4 -> null","language":"java","uuid":"e592be58-5749-47ae-ae37-82c06ccae5e2","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：1 -> 2 -> 2 -> null\n输出：1 -> null","language":"java","uuid":"b89a1b7d-e82e-4584-8e4a-71e14143795f","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"首先判断根节点是否与后面的节点重复(因为根节点前面没有节点，所以只需判断是否与后面的节点重复)，如果根节点不重复，则保留根节点，并且递归调用 "},{"type":"formatted","text":"deleteDuplicates(head.next)","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果根节点是重复的(即与后面的节点的值相同)，则我们删除所有与根节点相同的节点，找到第一个与根节点不同的节点 "},{"type":"formatted","text":"node","code":true},{"type":"formatted","text":"，然后递归调用 "},{"type":"formatted","text":"deleteDuplicates(node)","code":true},{"type":"formatted","text":" 即可"}],"disableDrag":false},{"type":"code-block","code":"public ListNode deleteDuplicates(ListNode head) {\n    if (head == null || head.next == null) {\n        return head;\n    }\n\n    // 如果不重复，则保留头结点\n    if (head.val != head.next.val) {\n        head.next = deleteDuplicates(head.next);\n        return head;\n    }\n\n    // 来到这里就说明重复了，删除与 head 重复的所有节点\n    while (head.next != null && head.val == head.next.val) {\n        head = head.next;\n    }\n\n    return deleteDuplicates(head.next);\n}","language":"java","uuid":"59b60450-5449-42e7-9f7a-801016e2c3e5","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/remove-duplicates-from-sorted-list-ii/","openEdit":false,"children":[{"type":"formatted","text":"删除排序链表中的重复节点 II"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"链表"},{"label":"删除排序链表中的重复元素II","href":"/docs/document/12/140.html"}],"prevPage":{"title":"反转链表","href":"/docs/document/12/129.html"},"nextPage":{"title":"旋转链表","href":"/docs/document/12/146.html"},"createTime":1729001277089,"updateTime":1744296320446,"currentPath":"/docs/document/12/140.html"},"meta":{"type":"doc","publishTime":1764810804422}};
