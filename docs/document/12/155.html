html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":155,"title":"x 的平方根","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"实现 "},{"type":"formatted","text":"int sqrt(int x)","code":true},{"type":"formatted","text":" 函数。计算并返回 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 的平方根，其中 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 是非负整数。由于返回类型是整数，结果只保留整数的部分，小数部分将被舍去。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例 1："}],"disableDrag":false},{"type":"code-block","code":"输入: 4\n输出: 2","language":"java","uuid":"173cce30-3d54-4eb4-b118-17c9da0af715","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例 2："}],"disableDrag":false},{"type":"code-block","code":"输入: 8\n输出: 2","language":"java","uuid":"715338c9-e04e-4b38-8a9a-20decd15879d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"碰到这种问题，第一个想法是从 "},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 开始试，直到某个整数的平方小于等于 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":"，并且其下一个数的平方大于 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":"，这个时候我们可以说找到了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我们发现我们是在有序的空间进行查找 "},{"type":"formatted","text":"1~ x/2","code":true},{"type":"formatted","text":"，对于有序查找问题我们使用二分查找法，时间复杂度可以降低到 "},{"type":"inline-math","tex":"O(\\log n)","children":[{"type":"formatted","text":"O(\\log n)"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"code-block","code":"public int mySqrt(int x) {\n    int start = 0;\n    int end = x;\n    while (start < end) {\n        long mid = start + (end - start) / 2;\n        if (mid * mid <= x  && x / (mid + 1) < (mid + 1)) {\n            break;\n        } else if (mid * mid < x) {\n            start = (int)++mid;\n        } else {\n            end = (int)--mid;\n        }\n    }\n    return start + (end - start) / 2;\n}","language":"java","uuid":"09701ac5-dfbf-4dc1-b134-9b54995af33d","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面有个地方需要注意，我们使用了 "},{"type":"formatted","text":"x / (mid + 1) < mid + 1","code":true},{"type":"formatted","text":" 而不是 "},{"type":"formatted","text":"(mid + 1) * (mid + 1) > x","code":true},{"type":"formatted","text":"，这是因为 "},{"type":"formatted","text":"(mid + 1) * (mid + 1)","code":true},{"type":"formatted","text":" 的结果可能会溢出，导致不正确的判断，所以这里我们使用了 "},{"type":"formatted","text":"x / (mid + 1) < (mid + 1)","code":true},{"type":"formatted","text":" 的形式。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"除了可以使用二分搜索法，还可以使用牛顿迭代法，构建下面的方程"}],"disableDrag":false},{"type":"block-math","tex":"f(x) = x^2 - a","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面方程的解就是 "},{"type":"inline-math","tex":"\\sqrt{a}","children":[{"type":"formatted","text":"\\sqrt{a}"}]},{"type":"formatted","text":"，现在我们使用牛顿迭代法求解上面的方程。牛顿迭代法的公式是"}],"disableDrag":false},{"type":"block-math","tex":"x_{n + 1} = x_{n} - \\frac{f(x_n)}{f^{'}(x_n)}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以迭代公式为"}],"disableDrag":false},{"type":"block-math","tex":"x_{n + 1} = \\frac{1}{2} (x_n + \\frac{a}{x_n})","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当迭代误差小于 "},{"type":"inline-math","tex":"10^{-5}","children":[{"type":"formatted","text":"10^{-5}"}]},{"type":"formatted","text":"，我们就可以将迭代停止了"}],"disableDrag":false},{"type":"code-block","code":"public int mySqrt(int a) {\n    // 起始迭代点\n    double x = 0.1;\n    // 上一个迭代结果\n    double pre = 0;\n    // 当误差大于 1e-5 时，继续迭代\n    while (Math.abs(x - pre) > 1e-5) {\n        pre = x;\n        x = 0.5 * (x + a/x);\n    }\n\n    // 返回整数部分\n    return (int)x;\n}","language":"java","uuid":"4874126a-c88c-45c1-9603-c0160e68df31","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"牛顿迭代法的收敛速度是平方收敛的，其收敛速度比二分搜索法快。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/sqrtx/","openEdit":false,"children":[{"type":"formatted","text":"x的平方根"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"数学"},{"label":"x 的平方根","href":"/docs/document/12/155.html"}],"prevPage":{"title":"用最少数量的箭引爆气球","href":"/docs/document/12/164.html"},"nextPage":{"title":"字符串相乘","href":"/docs/document/12/245.html"},"createTime":1729002687468,"updateTime":1744296873952,"currentPath":"/docs/document/12/155.html"},"meta":{"type":"doc","publishTime":1764775995450}};
