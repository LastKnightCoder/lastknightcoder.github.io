ntent":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"示例1:"}],"disableDrag":false},{"type":"code-block","code":"输入：x = 2.00000, n = 10\n输出：1024.00000","language":"","uuid":"44c7f9c7-bbf5-433b-9370-b8cb530c54df","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：x = 2.10000, n = 3\n输出：9.26100","language":"","uuid":"7944087e-a8cd-4b28-8212-d12e47a72135","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"-100.0 \u003c x \u003c 100.0","children":[{"type":"formatted","text":"-100.0 \u003c x \u003c 100.0"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"-2^{31} \\leq n \\leq 2^{31} - 1","children":[{"type":"formatted","text":"-2^{31} \\leq n \\leq 2^{31} - 1"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"﻿"},{"type":"inline-math","tex":"-10^4 \\leq x^n \\leq 10^4","children":[{"type":"formatted","text":"-10^4 \\leq x^n \\leq 10^4"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false}]}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":""},{"type":"inline-math","tex":"x^n","children":[{"type":"formatted","text":"x^n"}]},{"type":"formatted","text":" 的计算分为以下两种情况"}],"disableDrag":false},{"type":"block-math","tex":"x^n = \n\\begin{cases}\nx^{|n|}, & n \u003e 0 \\\\\n\\dfrac{1}{x^{|n|}}, & n \u003c 0\n\\end{cases}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对 "},{"type":"inline-math","tex":"x = 0","children":[{"type":"formatted","text":"x = 0"}]},{"type":"formatted","text":" 时需要单独考虑，否则当 "},{"type":"inline-math","tex":"n \u003c 0","children":[{"type":"formatted","text":"n \u003c 0"}]},{"type":"formatted","text":"，得到的结果为无穷大，我们认为 "},{"type":"inline-math","tex":"0^n = 0","children":[{"type":"formatted","text":"0^n = 0"}]},{"type":"formatted","text":"，所以可以写出这样的代码"}],"disableDrag":false},{"type":"code-block","code":"public double myPow(double x, int n) {\n    if (x == 0) {\n        return 0;\n    }\n    double res = myPowWithPositiveExp(x, Math.abs(n));\n    return n \u003e 0 ? res : 1 / res;\n}","language":"java","uuid":"2ba30b32-d2cc-4011-b753-d4ff9305f3d9","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面 "},{"type":"formatted","text":"myPowWithPositiveExp","code":true},{"type":"formatted","text":" 方法是计算 "},{"type":"inline-math","tex":"x^{|n|}","children":[{"type":"formatted","text":"x^{|n|}"}]},{"type":"formatted","text":" 的方法，它只处理指数为正的情况。很快我们可以写出这样的代码"}],"disableDrag":false},{"type":"code-block","code":"private double MyPowWithPositiveExp(double x, int n) {\n    if (n == 0) {\n        return 1;\n    }\n\n    double res = 1;\n    for (int i = 0; i \u003c n; i++) {\n        res *= x;\n    }\n\n    return res;\n}","language":"java","uuid":"91aad660-48bf-401a-8131-6ca669bc64a0","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这样做行不行，当然可以。不过我们有更快的方法，重新考虑 "},{"type":"inline-math","tex":"x^n(n\u003e0)","children":[{"type":"formatted","text":"x^n(n\u003e0)"}]},{"type":"formatted","text":"，我们可以划分为"}],"disableDrag":false},{"type":"block-math","tex":"x^{n} = \n\\begin{cases}\nx^{n/2} * x^{n/2}, & n \\% 2 == 0 \\\\\nx * x^{(n-1)/2} * x^{(n-1)/2}, & n \\% 2 == 1\n\\end{cases}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们把求解 "},{"type":"inline-math","tex":"x^n","children":[{"type":"formatted","text":"x^n"}]},{"type":"formatted","text":" 转化为了求解 "},{"type":"inline-math","tex":"x^{n/2}","children":[{"type":"formatted","text":"x^{n/2}"}]},{"type":"formatted","text":"，而 "},{"type":"inline-math","tex":"x^{n/2}","children":[{"type":"formatted","text":"x^{n/2}"}]},{"type":"formatted","text":" 又可以转化为求解 "},{"type":"inline-math","tex":"x^{n/4}","children":[{"type":"formatted","text":"x^{n/4}"}]},{"type":"formatted","text":"，大大的减少了计算，所以我们很快可以写出这样的代码"}],"disableDrag":false},{"type":"code-block","code":"private double myPowWithPositiveExp(double x, int n) {\n    if (n == 0) {\n        return 1;\n    }\n    // 当 n 为奇数时 n/2 = (n - 1)/2\n    double res = myPowWithPositiveExp(x, n/2);\n    if (n % 2 == 0) {\n        return res * res;\n    } else {\n        return x * res * res;\n    }\n}","language":"java","uuid":"7b244d59-8d8b-4679-9573-e14fdf4c82ae","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/powx-n/","openEdit":false,"children":[{"type":"formatted","text":"Pow(x, n)"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"分治"},{"label":"Pow(x, n)","href":"/docs/document/12/119.html"}],"prevPage":{"title":"最长回文字符串","href":"/docs/document/12/153.html"},"nextPage":{"title":"合并 K 个升序链表","href":"/docs/document/12/132.html"},"createTime":1728990323658,"updateTime":1744296420556,"currentPath":"/docs/document/12/119.html"},"meta":{"type":"doc","publishTime":1764823684253}};
