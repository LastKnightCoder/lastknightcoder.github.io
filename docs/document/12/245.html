leted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"1 <= num1.length","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"num2.length <= 200","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"num1","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"num2","code":true},{"type":"formatted","text":" 只能由数字组成。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"num1","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"num2","code":true},{"type":"formatted","text":" 都不包含任何前导零，除了数字 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 本身。"}],"disableDrag":false}]}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"如果直接解析为数字然后使用乘法，会存在溢出的问题，值会成为正无穷"}],"disableDrag":false},{"type":"code-block","code":"Number.MAX_VALUE * Number.MAX_VALUE // Infinity","language":"JavaScript","uuid":"3b856d3e-70c3-4429-912b-fdb92e4633a1","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以考虑人类是怎么做乘法的，竖式乘法，使用一个数组 "},{"type":"formatted","text":"res","code":true},{"type":"formatted","text":" 存储最终的结果，可知 "},{"type":"formatted","text":"num1[i] * nums[j]","code":true},{"type":"formatted","text":" 的结果在 "},{"type":"formatted","text":"res[i + j]","code":true},{"type":"formatted","text":" 处，这里先不处理进位，最后统一处理进位，思路如下"}],"disableDrag":false},{"type":"code-block","code":"        1 2 3\n      × 4 5 6\n--------------\n            18\n         12\n      6\n         15\n      10\n    5\n      12\n    8\n  4\n--------------\n  4 13 28 27 18\n  5  6  0  8  8   <---- 处理进位","language":"","uuid":"16bab2cb-0614-456f-8778-580dd7f31abc","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"代码如下"}],"disableDrag":false},{"type":"code-block","code":"const multiply = (num1, num2) => {\n  const len1 = num1.length;\n  const len2 = num2.length;\n  const len = len1 + len2 - 1;\n  const res = Array.from({ length: len }, () => 0);\n  for (let i = 0; i < len1; i++) {\n    for (let j = 0; j < len2; j++) {\n      if (!res[len - i - j - 1]) res[len - i - j - 1] = 0;\n      const mulRes = parseInt(num1[len1 - i - 1]) * parseInt(num2[len2 - j - 1]);\n      res[len - i - j - 1] += mulRes;\n    }\n  }\n\n  // 处理进位\n  let addition = 0;\n  for (let i = len - 1; i >= 0; i--) {\n    const n = res[i];\n    res[i] = (n + addition) % 10;\n    addition = Math.floor((n + addition) / 10);\n  }\n  if (addition) {\n    res.unshift(addition);\n  }\n\n  // 前导 0 处理\n  while (res[0] === 0 && res.length > 1) {\n    res.shift();\n  }\n\n  return res.join('');\n}","language":"JavaScript","uuid":"b83f1079-adfd-4179-8876-9d0cf0b33709","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"数学"},{"label":"字符串相乘","href":"/docs/document/12/245.html"}],"prevPage":{"title":"x 的平方根","href":"/docs/document/12/155.html"},"createTime":1739495604557,"updateTime":1744296882777,"currentPath":"/docs/document/12/245.html"},"meta":{"type":"doc","publishTime":1764775995450}};
