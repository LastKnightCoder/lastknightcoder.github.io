":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给你一个链表的头节点 "},{"type":"formatted","text":"head","code":true},{"type":"formatted","text":" ，旋转链表，将链表每个节点向右移动 "},{"type":"formatted","text":"k","code":true},{"type":"formatted","text":" 个位置。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：head = [1,2,3,4,5], k = 2\n输出：[4,5,1,2,3]","language":"java","uuid":"809d202f-541e-46ec-9f6c-2a71c6d77c75","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：head = [0,1,2], k = 4\n输出：[2,0,1]","language":"java","uuid":"3eec04ca-c5bb-4829-ac23-4ac360e1ec12","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："},{"type":"inline-math","tex":"0 \\leq k \\leq 2 \\times 10^9","children":[{"type":"formatted","text":"0 \\leq k \\leq 2 \\times 10^9"}]},{"type":"formatted","text":"﻿"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231544392022-04-23-15-44-39.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231544392022-04-23-15-44-39.png","width":377.0833183493885},{"type":"paragraph","children":[{"type":"formatted","text":"因为 "},{"type":"formatted","text":"k","code":true},{"type":"formatted","text":" 的大小可能大于链表的长度，所以我们首先需求求得链表的长度 "},{"type":"formatted","text":"l","code":true},{"type":"formatted","text":"，接着将 "},{"type":"formatted","text":"k","code":true},{"type":"formatted","text":" 映射到 "},{"type":"inline-math","tex":"[0, l)","children":[{"type":"formatted","text":"[0, l)"}]},{"type":"formatted","text":" 之间，顺便获得链表的最后一个节点 "},{"type":"formatted","text":"end","code":true}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231545242022-04-23-15-45-24.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231545242022-04-23-15-45-24.png","width":449.99998211860725},{"type":"paragraph","children":[{"type":"formatted","text":"这时我们可以知道旋转后的根节点在 "},{"type":"formatted","text":"l - k","code":true},{"type":"formatted","text":" 处， 遍历链表获得根节点的前一个节点 "},{"type":"formatted","text":"pre","code":true},{"type":"formatted","text":" 以及返回的根节点 "},{"type":"formatted","text":"root","code":true}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231548382022-04-23-15-48-38.png","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/202204231548382022-04-23-15-48-38.png","width":385.41665135158496},{"type":"code-block","code":"public ListNode rotateRight(ListNode head, int k) {\n    if (head == null || k == 0) {\n        return head;\n    }\n\n    // 统计链表长度，以及找到最后一个节点\n    ListNode cur = head;\n    int l = 1;\n    while (cur.next != null) {\n        l++;\n        cur = cur.next;\n    }\n    ListNode end = cur;\n\n    k = k % l + 1;\n    if (k == 0) {\n        return head;\n    }\n\n    // 找到返回的根节点的前一个节点\n    cur = head;\n    for (int i = 1; i \u003c l - k; i++) {\n        cur = cur.next;\n    }\n    ListNode root = cur.next;\n\n    cur.next = null;\n    end.next = head;\n\n    return root;\n}","language":"java","uuid":"71baa451-4d54-4c99-8e3f-21af9f6f156a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"旋转链表","openEdit":false,"children":[{"type":"formatted","text":"旋转链表"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"链表"},{"label":"旋转链表","href":"/docs/document/12/146.html"}],"prevPage":{"title":"删除排序链表中的重复元素II","href":"/docs/document/12/140.html"},"nextPage":{"title":"反转链表","href":"/docs/document/12/129.html"},"createTime":1729001899879,"updateTime":1762947388563,"currentPath":"/docs/document/12/146.html"},"meta":{"type":"doc","publishTime":1764823684252}};
