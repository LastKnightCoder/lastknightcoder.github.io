","text":" 添加至 "},{"type":"formatted","text":"size","code":true},{"type":"formatted","text":" 处，并进行 "},{"type":"formatted","text":"size++","code":true}],"disableDrag":false},{"type":"code-block","code":"public static int removeDuplicates(int[] nums) {\n    int len = nums.length;\n    if(len<=2){\n        return len;\n    }\n\n    int size = 2;\n    int cur = 2;\n    while(cur < len){\n        if(nums[size - 2] != nums[cur]){\n            nums[size++] = nums[cur];\n        }\n        cur++;\n    }\n    return size;\n}","language":"java","uuid":"61389fe0-2493-4faf-9ef1-24f93e5fec79","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/remove-duplicates-from-sorted-array/","openEdit":false,"children":[{"type":"formatted","text":"删除有序数组中的重复项"}]},{"text":"","type":"formatted"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/remove-duplicates-from-sorted-array-ii/","openEdit":false,"children":[{"type":"formatted","text":"删除有序数组中的重复项 II"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"双指针"},{"label":"删除有序数组中的重复项","href":"/docs/document/12/141.html"}],"prevPage":{"title":"合并区间","href":"/docs/document/12/131.html"},"nextPage":{"title":"盛水最多的容器","href":"/docs/document/12/142.html"},"createTime":1729001395139,"updateTime":1744296486800,"currentPath":"/docs/document/12/141.html"},"meta":{"type":"doc","publishTime":1764775995446}};
