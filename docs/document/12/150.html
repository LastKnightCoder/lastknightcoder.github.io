":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":150,"title":"组合总数","content":[{"type":"header","children":[{"type":"formatted","text":"组合总数"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个无重复元素的数组 candidates 和一个目标数 target ，找出 candidates 中所有可以使数字和为 target 的组合。"},{"type":"formatted","text":"candidates 中的数字可以无限制重复被选取","color":"#6425d0","darkColor":"#a472fc","bold":true},{"type":"formatted","color":"#6425d0","darkColor":"#a472fc","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"说明："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"所有数字 (包括 target) 都是正整数。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"解集不能包含重复的组合。"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：candidates = [2,3,6,7], target = 7,\n所求解集为：\n[\n  [7],\n  [2,2,3]\n]","language":"java","uuid":"de670dab-8b48-4823-8d52-25dc2fbb1f74","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：candidates = [2,3,5], target = 8,\n所求解集为：\n[\n  [2,2,2,2],\n  [2,3,3],\n  [3,5]\n]","language":"java","uuid":"466068d0-298f-431f-9a38-510339dbef73","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"code-block","code":"class Solution {\n    private List<List<Integer>> results = new ArrayList<>();\n    public List<List<Integer>> combinationSum(int[] candidates, int target) {\n        ArrayList<Integer> path = new ArrayList<>();\n        search(candidates, 0, target, path);\n\n        return results;\n    }\n\n    private void search(int[] candidates, int startLevel, int target, ArrayList<Integer> path) {\n        if (target < 0) {\n            return;\n        }\n\n        if (target == 0) {\n            List<Integer> list = new ArrayList<>(path);\n            results.add(list);\n            return;\n        }\n\n        for (int i = startLevel; i < candidates.length; i++) {\n            path.add(candidates[i]);\n            search(candidates, i, target - candidates[i], path);\n            path.remove(path.size() - 1);\n        }\n    }\n}","language":"java","uuid":"b3e6d633-673d-4878-9f0f-f33912f19a2d","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"组合总数II"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"题目描述同上，不过有一点不同，"},{"type":"formatted","text":"candidates 中的每个数字在每个组合中只能使用一次","color":"#6425d0","darkColor":"#a472fc","bold":true},{"type":"formatted","color":"#6425d0","darkColor":"#a472fc","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"text":"示例1：","type":"formatted"}],"disableDrag":false},{"type":"code-block","code":"输入: candidates = [10,1,2,7,6,1,5], target = 8,\n所求解集为:\n[\n  [1, 7],\n  [1, 2, 5],\n  [2, 6],\n  [1, 1, 6]\n]","language":"java","uuid":"43b8bf27-91c0-4244-978a-795728b779dd","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入: candidates = [2,5,2,1,2], target = 5,\n所求解集为:\n[\n  [1,2,2],\n  [5]\n]","language":"java","uuid":"9260051a-61d4-49b5-91a4-1cf91e7f700a","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"对于这种无重复的问题，首先对数组进行排序，然后在递归的过程中判断当前的数是否与前一个数相同，如果相同，则不用遍历该数，因为包含该数的所有情况已经考虑过了，直接跳过该数即可"}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    private List<List<Integer>> results = new ArrayList<>();\n    public List<List<Integer>> combinationSum2(int[] candidates, int target) {\n        if (candidates == null || candidates.length == 0) {\n            return results;\n        }\n\n        // 对数组进行排序\n        Arrays.sort(candidates);\n        search(candidates, target, 0, new ArrayList<Integer>());\n\n        return results;\n    }\n\n    private void search(int[] candidates, int target, int startIndex, ArrayList<Integer> path) {\n        if (target < 0) {\n            return;\n        }\n\n        if (target == 0) {\n            results.add(new ArrayList<>(path));\n            return;\n        }\n\n        for (int i = startIndex; i < candidates.length; i++) {\n            // 如果当前数与前一个数相同，则跳过该数\n            if (i > startIndex && candidates[i] == candidates[i - 1]) continue;\n\n            path.add(candidates[i]);\n            search(candidates, target - candidates[i], i + 1, path);\n            path.remove(path.size() - 1);\n        }\n    }\n}","language":"java","uuid":"3eb5d4a4-8f87-47f4-babb-2700307ec1a4","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"深度优先遍历"},{"label":"组合总数","href":"/docs/document/12/150.html"}],"prevPage":{"title":"组合","href":"/docs/document/12/149.html"},"nextPage":{"title":"矩阵中的最长递增路径","href":"/docs/document/12/339.html"},"createTime":1729002333392,"updateTime":1744296823094,"currentPath":"/docs/document/12/150.html"},"meta":{"type":"doc","publishTime":1764810804432}};
