":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"一条包含字母 A-Z 的消息通过以下映射进行了编码 ："}],"disableDrag":false},{"type":"code-block","code":"'A' -> 1\n'B' -> 2\n...\n'Z' -> 26","language":"java","uuid":"8003fdbf-9062-4a50-8a01-ea0cbf6ae35c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"要 解码 已编码的消息，所有数字必须基于上述映射的方法，反向映射回字母（可能有多种方法）。例如，\"11106\" 可以映射为："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\"AAJF\"，将消息分组为 (1 1 10 6)"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"\"KJF\"，将消息分组为 (11 10 6)"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"注意，消息不能分组为 (1 11 06 ，因为 \"06\" 不能映射为 \"F\" ，这是由于 \"6\" 和 \"06\" 在映射中并不等价。给你一个只含数字的非空字符串 s，请计算并返回解码方法的总数。题目数据保证答案肯定是一个 32 位的整数。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：s = \"12\"\n输出：2\n解释：它可以解码为 \"AB\"（1 2）或者 \"L\"（12）","language":"java","uuid":"70a7aac2-bf24-457c-af66-9b2aa9896b25","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：s = \"226\"\n输出：3\n解释：它可以解码为 \"BZ\" (2 26), \"VF\" (22 6), 或者 \"BBF\" (2 2 6) ","language":"java","uuid":"227ecd73-f97b-4c93-810b-06c465156a68","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例3："}],"disableDrag":false},{"type":"code-block","code":"输入：s = \"0\"\n输出：0\n解释：没有字符映射到以 0 开头的数字","language":"java","uuid":"aa3c91b0-14d2-421f-973a-2d004ad4763b","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"动态规划"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"我们定义一个数组 dp，其中 dp[i] 表示以第 i 个字符结尾有多少种解码方法，所以可以得到 dp[i] 的更新公式，分为两种情况："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当前字符 str[i] == '0'"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当前字符与前一个字符组成的数小于等于 26 并且前一个字符不为 0，则"}],"disableDrag":false},{"type":"block-math","tex":"dp[i] = dp[i - 2]","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"否则"}],"disableDrag":false},{"type":"block-math","tex":"dp[i] = 0","children":[{"type":"formatted","text":""}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当前字符 str[i] != '0'"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当前字符与前一个字符组成的数小于等于 26 并且前一个字符不为 0，则"}],"disableDrag":false},{"type":"block-math","tex":"dp[i] = dp[i - 1] + dp[i - 2]","children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"否则"}],"disableDrag":false},{"type":"block-math","tex":"dp[i] = dp[i - 1]","children":[{"type":"formatted","text":""}]}]}]},{"type":"code-block","code":"public int numDecodings(String s) {\n    int length = s.length();\n    int[] dp = new int[length];\n    if (s.charAt(0) == '0') {\n        dp[0] = 0;\n    } else {\n        dp[0] = 1;\n    }\n    for (int i = 1; i < length; i++) {\n        if (s.charAt(i) != '0') {\n            dp[i] = dp[i - 1];\n        }\n        int n = (s.charAt(i - 1) - '0') * 10 + s.charAt(i) - '0';\n        if (n <= 26) {\n            dp[i] = i > 1 ? dp[i] + dp[i - 2]: dp[i] + 1;\n        }\n    }\n    return dp[length - 1];\n}","language":"java","uuid":"d9a0eee4-7293-43d6-aaed-feb2949ce0c4","children":[{"type":"formatted","text":""}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1624934672541.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"空间压缩"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"分析上面的程序，我们只用到了 dp[i - 1] 与 dp[i - 2] 两个元素，所以我们根本不需要使用一个数组来存储，只需存储这两个元素即可，我们使用 cur 表示 dp[i - 1]，pre 表示 dp[i - 2]"}],"disableDrag":false},{"type":"code-block","code":"public int numDecodings(String s) {\n    int length = s.length();\n    int cur;\n    int pre = 0;\n    if (s.charAt(0) == '0') {\n        cur = 0;\n    } else {\n        cur = 1;\n    }\n\n    for (int i = 1; i < length; i++) {\n        int temp = cur;\n        if (s.charAt(i) == '0') {\n            cur = 0;\n        }\n        int n = (s.charAt(i - 1) - '0') * 10 + s.charAt(i) - '0';\n        if (n <= 26 && (s.charAt(i - 1) - '0') != 0) {\n            cur = i > 1 ? cur + pre: cur + 1;\n        }\n        pre = temp;\n    }\n\n    return cur;\n}","language":"java","uuid":"ae268ab5-2b34-47f3-aa83-cf6f54efc591","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"空间复杂度大大降低"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/1624934659317.png","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/decode-ways","openEdit":false,"children":[{"type":"formatted","text":"解码方法"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"动态规划"},{"labe
