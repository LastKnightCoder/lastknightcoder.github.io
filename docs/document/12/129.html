tml","kind":"document"}]}],"content":{"id":129,"title":"反转链表","content":[{"type":"header","children":[{"type":"formatted","text":"反转链表"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"给你单链表的头节点 "},{"type":"formatted","text":"head","code":true},{"type":"formatted","text":"，请你反转链表，并返回反转后的链表。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例："}],"disableDrag":false},{"type":"code-block","code":"输入：head = [1,2,3,4,5]\n输出：[5,4,3,2,1]","language":"java","uuid":"66ea63c4-ec39-4e29-8044-4b20dc2a2305","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E5%8F%8D%E8%BD%AC%E9%93%BE%E8%A1%A8-Page-1_638a8a9f-03e4-461d-baf9-8ba1188830fb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E5%8F%8D%E8%BD%AC%E9%93%BE%E8%A1%A8-Page-1_638a8a9f-03e4-461d-baf9-8ba1188830fb.png","width":501.66664673222516},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"第一种解法，使用递归，分为两步，第一步对后续的链表进行反转，第二步将当前节点添加到已反转列表的最后，如下"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E5%8F%8D%E8%BD%AC%E9%93%BE%E8%A1%A8-Page-3_adfdcc95-a998-4ff6-a908-0ab4bf0e3e9a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E5%8F%8D%E8%BD%AC%E9%93%BE%E8%A1%A8-Page-3_adfdcc95-a998-4ff6-a908-0ab4bf0e3e9a.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"反转后续节点的的操作同上，直至剩下最后一个节点，就不必反转了。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"因为我们需要将当前节点挂在已反转的节点的最后，所以我们需要知道最后一个节点是什么，通过图可以观察到，已反转链表的最后一个节点是当前节点在未反转链表中的下一个节点。例如当前节点 1，已反转链表的最后一个节点 2 是其在未反转链表中的下一个节点，所以我们在反转后续节点前可以先将此节点保存下来"}],"disableDrag":false},{"type":"code-block","code":"public ListNode reverseList(ListNode head) {\n    if (head == null || head.next == null) {\n        return head;\n    }\n    ListNode next = head.next;\n    ListNode root = reverseList(head.next);\n    next.next = head;\n    head.next = null;\n    return root;\n}","language":"java","uuid":"04a8578b-f7b2-4ac2-93d3-62f98d16defb","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二种方法，借助于栈，根据栈的特点，后进先出，我们依次将链表中的元素添加进栈中，最后依次从栈中弹出元素，将其添加进一个新的链表中，然后返回该链表即可得到一个反序的链表"}],"disableDrag":false},{"type":"code-block","code":"public ListNode reverseList(ListNode head) {\n    if (head == null || head.next == null) {\n        return head;\n    }\n    ListNode dummyHead = new ListNode();\n    ListNode cur = head;\n    LinkedList\u003cListNode\u003e list = new LinkedList\u003c\u003e();\n    while (cur != null) {\n        list.push(cur);\n        cur = cur.next;\n    }\n    cur = dummyHead;\n    while (!list.isEmpty()) {\n        cur.next = list.pop();\n        cur = cur.next;\n    }\n    cur.next = null;\n    return dummyHead.next;\n}","language":"java","uuid":"b2dd7fed-da40-40db-9290-f35b776c05a5","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"反转链表II"}],"level":2},{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"给你单链表的头指针 "},{"type":"formatted","text":"head","code":true},{"type":"formatted","text":" 和两个整数 "},{"type":"formatted","text":"left","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"right","code":true},{"type":"formatted","text":" ，其中 "},{"type":"formatted","text":"left \u003c= right","code":true},{"type":"formatted","text":"。请你反转从位置 "},{"type":"formatted","text":"left","code":true},{"type":"formatted","text":" 到位置 "},{"type":"formatted","text":"right","code":true},{"type":"formatted","text":" 的链表节点，返回反转后的链表 。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例："}],"disableDrag":false},{"type":"code-block","code":"输入：head = [1,2,3,4,5], left = 2, right = 4\n输出：[1,4,3,2,5]","language":"java","uuid":"c5dae6e2-879b-46fa-8fd8-8fde2ac6da40","children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E5%8F%8D%E8%BD%AC%E9%93%BE%E8%A1%A8-Page-2_afc67ffd-29b6-4fd5-9ea4-4ca721b040eb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/image-for-2023/raw/master/%E5%8F%8D%E8%BD%AC%E9%93%BE%E8%A1%A8-Page-2_afc67ffd-29b6-4fd5-9ea4-4ca721b040eb.png","width":501.66664673222516},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":3},{"type":"paragraph","children":[{"type":"formatted","text":"还是一样，我们还是借助栈来反转链表，我们只需要将 "},{"type":"formatted","text":"[left, right]","code":true},{"type":"formatted","text":" 范围的添加进栈中即可，同样的我们还是构建一个新的链表，对于 "},{"type":"formatted","text":"left","code":true},{"type":"formatted","text":" 以前的节点，直接添加到新链表中，对于 "},{"type":"formatted","text":"[left, right]","code":true},{"type":"formatted","text":" 中的节点，添加进栈中，然后依次取出添加进新链表中，对于 "},{"type":"formatted","text":"right","code":true},{"type":"formatted","text":" 后面的节点，也是直接添加进新链表中，然后将新链表的根节点直接返回即可"}],"disableDrag":false},{"type":"code-block","code":"public ListNode reverseBetween(ListNode head, int left, int right) {\n    ListNode dummyHead = new ListNode();\n    // 新链表的末尾\n    ListNode end = dummyHead;\n    // 当前遍历节点\n    ListNode cur = head;\n    // left 以前的节点，直接添加进新链表\n    for (int i = 1; i \u003c left; i++) {\n        end.next = cur;\n        cur = cur.next;\n        end = end.next;\n    }\n    // [left, right] 中的节点，先添加进栈中，然后依次取出添加进新链表\n    LinkedList\u003cListNode\u003e list = new LinkedList\u003c\u003e();\n    // 添加进栈中\n    for (int i = left; i \u003c= right; i++) {\n        list.push(cur);\n        cur = cur.next;\n    }\n    // 从栈中取出，添加进新链表\n    while (!list.isEmpty()) {\n        end.next = list.pop();\n        end = end.next;\n    }\n    // right 后面的节点全部直接添加进新链表\n    end.next = cur;\n    return dummyHead.next;\n}","language":"java","uuid":"b037125e-aaa3-4aa1-b246-ba9e35557b4e","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"链表"},{"label":"反转链表","href":"/docs/document/12/129.html"}],"prevPage":{"title":"旋转链表","href":"/docs/document/12/146.html"},"nextPage":{"title":"合并 K 个升序链表","href":"/docs/document/12/132.html"},"createTime":1728991487076,"updateTime":1762947380186,"currentPath":"/docs/document/12/129.html"},"meta":{"type":"doc","publishTime":1767266228451}};
