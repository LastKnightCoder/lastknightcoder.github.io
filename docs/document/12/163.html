nt":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个未排序的整数数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" ，找出数字连续的最长序列（不要求序列元素在原数组中连续）的长度。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"请你设计并实现时间复杂度为 "},{"type":"inline-math","tex":"O(n)","children":[{"type":"formatted","text":"O(n)"}]},{"type":"formatted","text":" 的算法解决此问题。"}],"disableDrag":false},{"type":"detail","title":"示例1","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"nums = [100,4,200,1,3,2]","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出："},{"type":"formatted","text":"4","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解释：最长数字连续序列是 "},{"type":"formatted","text":"[1, 2, 3, 4]","code":true},{"type":"formatted","text":"。它的长度为 "},{"type":"formatted","text":"4","code":true},{"type":"formatted","text":"。"}],"disableDrag":false}]},{"type":"detail","title":"示例2","open":true,"children":[{"type":"paragraph","children":[{"type":"formatted","text":"输入："},{"type":"formatted","text":"nums = [0,3,7,2,5,8,4,6,0,1]","code":true}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"输出："},{"type":"formatted","text":"9","code":true}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"0 <= nums.length <= 10^5","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"-10^9 <= nums[i] <= 10^9","code":true}],"disableDrag":false}]}]},{"type":"header","children":[{"text":"解题思路","type":"formatted"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"该问题最最简单的做法就是遍历数组每一项时，再次遍历数组统计包含该项的最长序列是什么，但是问题是时间复杂度为 "},{"type":"inline-math","tex":"O(n^2)","children":[{"type":"formatted","text":"O(n^2)"}]},{"type":"formatted","text":"﻿，不符合题目要求。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"解决方案是使用一个哈希表先记录所有的数字，然后在遍历数组时查看 "},{"type":"formatted","text":"value - 1","code":true},{"type":"formatted","text":" 是否存在，如果存在，则跳过，由 "},{"type":"formatted","text":"value - 1","code":true},{"type":"formatted","text":" 去统计最长序列，如果不存在，则统计连续的序列。"}],"disableDrag":false},{"type":"code-block","code":"function longestConsecutive(nums: number[]): number {\n    const set = new Set([...nums]);\n    let max = 0;\n    for (let value of set.values()) {\n        if (set.has(value - 1)) {\n            continue;\n        }\n        let seq = 0;\n        while (set.has(value++)) {\n            seq++;\n        }\n        max = Math.max(max, seq);\n    }\n\n    return max;\n};","language":"ts","uuid":"d5079a95-45a8-467c-9f98-2dcc73b2a270","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode.cn/problems/longest-consecutive-sequence/description/?envType=study-plan-v2&envId=top-interview-150","openEdit":false,"children":[{"type":"formatted","text":"最长连续序列"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"哈希表"},{"label":"最长连续序列","href":"/docs/document/12/163.html"}],"prevPage":{"title":"字母异位词分组","href":"/docs/document/12/147.html"},"nextPage":{"title":"交错的字符串","href":"/docs/document/12/125.html"},"createTime":1730036375139,"updateTime":1744296612350,"currentPath":"/docs/document/12/163.html"},"meta":{"type":"doc","publishTime":1764821904257}};
