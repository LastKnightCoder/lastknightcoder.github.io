ength;\n    const answers = Array.from({ length: n }).fill(1) as number[];\n  \n  \tlet L = 1;\n    let R = 1;\n    for (let i = 0, j = nums.length - 1; i < nums.length && j >=0; i++, j--) {\n        answers[i] = answers[i] * L;\n        answers[j] = answers[j] * R;\n        L = L * nums[i];\n        R = R * nums[j];\n    }\n\n    return answers;\n};","language":"ts","uuid":"8d4b5397-ecb1-4d86-8f1c-1d13a6b444e7","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode.cn/problems/product-of-array-except-self/description/?envType=study-plan-v2&envId=top-interview-150","openEdit":false,"children":[{"type":"formatted","text":"除自身以外数组的乘积"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"数组"},{"label":"除自身以外数组的乘积","href":"/docs/document/12/161.html"}],"prevPage":{"title":"多数元素","href":"/docs/document/12/158.html"},"nextPage":{"title":"包含 min 函数的栈","href":"/docs/document/12/113.html"},"createTime":1729164158046,"updateTime":1743303640582,"currentPath":"/docs/document/12/161.html"},"meta":{"type":"doc","publishTime":1764775995444}};
