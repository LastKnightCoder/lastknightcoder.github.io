nt/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":151,"title":"最大子序和","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个整数数组 "},{"type":"formatted","text":"nums","code":true},{"type":"formatted","text":" ，找到一个具有最大和的连续子数组（子数组最少包含一个元素），返回其最大和。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"示例1："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [-2,1,-3,4,-1,2,1,-5,4]\n输出：6\n解释：连续子数组 [4,-1,2,1] 的和最大，为 6 。","language":"java","uuid":"2ee3c9b9-fcc6-4c54-a4bf-884906b49586","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例2："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [1]\n输出：1","language":"java","uuid":"7f1ecce9-4170-4bcf-a6f4-4049bd5667ae","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例3："}],"disableDrag":false},{"type":"code-block","code":"输入：nums = [-100000]\n输出：-100000","language":"java","uuid":"2ed60149-efb9-4c52-8d8a-e0142b3ff74c","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"提示："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"1 <= nums.length <= 3 * 10^4","code":true}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"-10^5 <= nums[i] <= 10^5","code":true}],"disableDrag":false}]}]},{"type":"header","children":[{"text":"题目解析","type":"formatted"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"这是一个很典型的动态规划的问题，我们定义一个数组 "},{"type":"formatted","text":"dp","code":true},{"type":"formatted","text":"，长度为输入数组的长度，其中 "},{"type":"formatted","text":"dp[i]","code":true},{"type":"formatted","text":" 表示以 "},{"type":"formatted","text":"num[i]","code":true},{"type":"formatted","text":" 结尾的最大子序列，我们可以得到如下更新公式"}],"disableDrag":false},{"type":"block-math","tex":"\\text{dp}[i]=\n\\begin{cases}\n\\text{dp}[i-1] + \\text{nums}[i], & \\text{dp}[i - 1] > 0 \\\\\n\\text{nums}[i], & \\text{dp}[i-1] \\leq 0\n\\end{cases}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以写出如下代码"}],"disableDrag":false},{"type":"code-block","code":"public int maxSubArray(int[] nums) {\n    int[] dp = new int[nums.length];\n    dp[0] = nums[0];\n    int max = dp[0];\n    for (int i = 1; i < nums.length; i++) {\n        if (dp[i - 1] < 0) {\n            dp[i] = nums[i];\n        } else {\n            dp[i] = dp[i - 1] + nums[i];\n        }\n\n        if (dp[i] > max) {\n            max = dp[i];\n        }\n    }\n\n    return max;\n}","language":"java","uuid":"e08fed91-5451-4849-9590-9313475094ff","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这里还可以做一个小的优化，因为 "},{"type":"formatted","text":"dp[i]","code":true},{"type":"formatted","text":" 只用到了 "},{"type":"formatted","text":"dp[i -1]","code":true},{"type":"formatted","text":"，更早之前数据没有用到，所以我们不需要使用一个数组来保存数组，使用一个变量保存 "},{"type":"formatted","text":"dp[i - 1]","code":true},{"type":"formatted","text":" 即可"}],"disableDrag":false},{"type":"code-block","code":"public int maxSubArray(int[] nums) {\n    int dp = nums[0];\n    int max = dp;\n    for (int i = 1; i < nums.length; i++) {\n        if (dp < 0) {\n            dp = nums[i];\n        } else {\n            dp = dp + nums[i];\n        }\n\n        if (dp > max) {\n            max = dp;\n        }\n    }\n\n    return max;\n}","language":"java","uuid":"3b8c6483-033f-4e82-b045-e9941c8a6bb0","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/maximum-subarray/","openEdit":false,"children":[{"type":"formatted","text":"最大子序和"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"动态规划"},{"label":"最大子序和","href":"/docs/document/12/151.html"}],"prevPage":{"title":"跳跃游戏II","href":"/docs/document/12/144.html"},"nextPage":{"title":"最小路径和","href":"/docs/document/12/152.html"},"createTime":1729002477456,"updateTime":1744296689131,"currentPath":"/docs/document/12/151.html"},"meta":{"type":"doc","publishTime":1764774821815}};
