":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document","active":true},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":128,"title":"单词搜索","content":[{"type":"header","children":[{"type":"formatted","text":"题目描述"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"给定一个 "},{"type":"inline-math","tex":"m \\times n","children":[{"type":"formatted","text":"m \\times n"}]},{"type":"formatted","text":" 二维字符网格 "},{"type":"formatted","text":"board","code":true},{"type":"formatted","text":" 和一个字符串单词 "},{"type":"formatted","text":"word","code":true},{"type":"formatted","text":"。如果 "},{"type":"formatted","text":"word","code":true},{"type":"formatted","text":" 存在于网格中，返回 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":"；否则，返回 "},{"type":"formatted","text":"false","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"单词必须按照字母顺序，通过相邻的单元格内的字母构成，其中\"相邻\"单元格是那些水平相邻或垂直相邻的单元格。同一个单元格内的字母不允许被重复使用。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"解题思路"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"从网格的某一点进行搜索，向四个方向探索，如果有一个方向能够找到单词，那么就返回 "},{"type":"formatted","text":"true","code":true},{"type":"formatted","text":"，如果都找不到，来到下一个点进行搜索，如果遍历完整个网格都搜索不到，则返回 "},{"type":"formatted","text":"false","code":true}],"disableDrag":false},{"type":"code-block","code":"class Solution {\n    private boolean[][] visited;\n    private char[][] board;\n    private String word;\n    public boolean exist(char[][] board, String word) {\n        this.board = board;\n        this.word = word;\n        this.visited = new boolean[board.length][board[0].length];\n        for (int i = 0; i < board.length; i++) {\n            for (int j = 0; j <board[0].length; j++) {\n                if (word.charAt(0) == board[i][j]) {\n                    if (search(i, j, 0)) {\n                        return true;\n                    }\n                }\n            }\n        }\n\n        return false;\n    }\n\n    // 从 (i, j) 开始查找以 word[index] 开始的单词\n    private boolean search(int i, int j, int index) {\n        if (word.charAt(index) != board[i][j]) {\n            return false;\n        }\n\n        if (index == word.length() - 1) {\n            return true;\n        }\n\n        visited[i][j] = true;\n        for (int[] next: adj(i, j)) {\n            if (search(next[0], next[1], index + 1)) {\n                return true;\n            }\n        }\n        visited[i][j] = false;\n        return false;\n    }\n\n    // 筛选可以向四周探索的网格节点\n    private List<int[]> adj(int i, int j) {\n        int[][] dirs = new int[][]{{1, 0}, {0, 1}, {0, -1}, {-1, 0}};\n        return Arrays.stream(dirs)\n                .map(item -> new int[]{i + item[0], j + item[1]})\n                .filter(item -> item[0] >= 0\n                        && item[0] < board.length\n                        && item[1] >= 0\n                        && item[1] < board[0].length\n                        && !visited[item[0]][item[1]])\n                .collect(Collectors.toList());\n    }\n}","language":"java","uuid":"8647a55d-0d7a-43e1-a95c-3d4a62232970","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"参考"}],"level":2},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"text":"","type":"formatted"},{"type":"link","url":"https://leetcode-cn.com/problems/word-search/","openEdit":false,"children":[{"type":"formatted","text":"单词搜索"}]},{"text":"","type":"formatted"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"LeetCode","href":"/docs/document/12/158.html"},{"label":"深度优先遍历"},{"label":"单词搜索","href":"/docs/document/
