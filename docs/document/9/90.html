ion=\"underline\"\u003eYou are a pig.\u003c/text\u003e\n  \u003ctext x=\"220\" y=\"70\" text-decoration=\"line-through\"\u003eYou are a pig.\u003c/text\u003e\n  \u003ctext x=\"420\" y=\"70\" text-decoration=\"overline\"\u003eYou are a pig.\u003c/text\u003e\n\n  \u003ctext x=\"20\" y=\"110\" word-spacing=\"5\"\u003eYou are a cat.\u003c/text\u003e\n  \u003ctext x=\"220\" y=\"110\" letter-spacing=\"4\"\u003eYou are a cat.\u003c/text\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"tspan"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"有时候我们需要对一段文字某些文字添加独立的文本修饰，比如下划线，删除线等，所以我们会考虑使用多个 "},{"type":"formatted","text":"text","code":true},{"type":"formatted","text":" 标签分隔开"}]},{"type":"code-block","code":"\u003ctext\u003eYou are a\u003c/text\u003e\u003ctext text-decoration=\"underline\"\u003edog.\u003c/text\u003e","language":"html","uuid":"250c2f19-f9dc-4a70-93c1-b3ee09ef5723","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是有一个问题就是我们不知道文本的长度，如果使用多个 "},{"type":"formatted","text":"text","code":true},{"type":"formatted","text":" 标签，那么文本摆放的位置就成了一个问题，这个时候我们可以在 "},{"type":"formatted","text":"text","code":true},{"type":"formatted","text":" 标签中使用 "},{"type":"formatted","text":"tspan","code":true},{"type":"formatted","text":" 标签"}]},{"type":"code-block","code":"\u003csvg width=\"150\" height=\"40\" viewBox=\"0 0 150 40\"\u003e\n  \u003ctext x=\"0\" y=\"20\"\u003e\n    Hello\n    \u003ctspan font-family=\"Times\" font-weight=\"bold\" text-decoration=\"underline\"\u003e\n      World!\n    \u003c/tspan\u003e\n  \u003c/text\u003e\n\u003c/svg\u003e","language":"html","uuid":"58d1f29a-9609-463b-9705-abf74d69525f","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"150\" height=\"40\" viewBox=\"0 0 150 40\" fill=\"gray\"\u003e\n  \u003ctext x=\"0\" y=\"20\"\u003e\n    Hello\n    \u003ctspan font-family=\"Times\" font-weight=\"bold\" text-decoration=\"underline\"\u003e\n      World!\n    \u003c/tspan\u003e\n  \u003c/text\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"tspan","code":true},{"type":"formatted","text":" 除了可以修改文本属性之外，还可以通过 "},{"type":"formatted","text":"dy","code":true},{"type":"formatted","text":" 修改被包含的字母的垂直位置偏移，并持续生效，"},{"type":"formatted","text":"dy","code":true},{"type":"formatted","text":" 是一个数组，其中的数与每个字母一一对应，如果数组中数目少于字母数，默认为 "},{"type":"formatted","text":"0","code":true}]},{"type":"code-block","code":"\u003csvg width=\"150\" height=\"40\" viewBox=\"0 0 150 40\"\u003e\n  \u003ctext x=\"0\" y=\"20\"\u003e\u003ctspan dy=\"0 6 6\"\u003eC6H12O6\u003c/tspan\u003e\u003c/text\u003e\n\u003c/svg\u003e","language":"html","uuid":"45f81bed-b801-4642-b7b6-f837e4aab72c","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"150\" height=\"40\" viewBox=\"0 0 150 40\" fill=\"gray\"\u003e\n  \u003ctext x=\"0\" y=\"20\"\u003e\u003ctspan dy=\"0 6 6\"\u003eC6H12O6\u003c/tspan\u003e\u003c/text\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们为 "},{"type":"formatted","text":"dy","code":true},{"type":"formatted","text":" 设置了三个值，有 "},{"type":"formatted","text":"7","code":true},{"type":"formatted","text":" 个字母，不足会自动补零，相当于 "},{"type":"formatted","text":"dy=\"0 6 6 0 0 0 0\"","code":true},{"type":"formatted","text":" 。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以观察到 "},{"type":"formatted","text":"dy","code":true},{"type":"formatted","text":" 是会叠加的，会持续影响后面的字母，要使得后面的字母正常显示，需要在后面指定一个相反值使得 "},{"type":"formatted","text":"dy","code":true},{"type":"formatted","text":" 变为 "},{"type":"formatted","text":"0","code":true}]},{"type":"code-block","code":"\u003csvg width=\"150\" height=\"40\" viewBox=\"0 0 150 40\"\u003e\n  \u003ctext x=\"0\" y=\"20\"\u003e
