ment/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":80,"title":"视口、viewBox 与 preserveAspectRatio","content":[{"type":"header","children":[{"type":"formatted","text":"视口"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"SVG 包含一个"},{"type":"formatted","text":"无限大","bold":true},{"type":"formatted","text":"的画布，但是视口(viewport)限制了我们只能看到一部分，就像是你在屋子里面通过窗子看外面的风景，外面的世界很大，但是窗子的大小是有限的，所以你只能看到一部分，这里的窗子就是视口的作用，它限制了你能看到的画布的大小。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"我们通过 "},{"type":"formatted","text":"width","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"height ","code":true},{"type":"formatted","text":"属性规定视口的大小，如果没有指定这两个属性，默认视口大小为 "},{"type":"inline-math","tex":"300\\text{px} \\times 150\\text{px}","children":[{"type":"formatted","text":"300\\text{px} \\times 150\\text{px}"}]},{"type":"formatted","text":""}],"disableDrag":false},{"type":"code-block","code":"<svg width=\"100\" height=\"100\">\n  <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","language":"html","uuid":"ed019bc3-c37a-43b4-b50f-9a1dcc38bbd7","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"100\" height=\"100\">\n  <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们规定了视口的大小为 "},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":"，然后我们在画布上画了一个圆，该圆的圆心为 "},{"type":"formatted","text":"(100, 100)","code":true},{"type":"formatted","text":"，半径为 "},{"type":"formatted","text":"50","code":true},{"type":"formatted","text":"，经过简单计算就知道该圆只有左上角在视口中，其他部分在视口之外，我们只能看到左上角的圆。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"viewBox"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"需要注意的是，我们规定视口大小、圆心坐标和半径时并没有指定单位，对于视口来说，默认单位是 "},{"type":"formatted","text":"px","code":true},{"type":"formatted","text":"，对于 "},{"type":"formatted","text":"svg","code":true},{"type":"formatted","text":" 内的形状来说，如果没有指定 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":"，默认也是 "},{"type":"formatted","text":"px","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"所以现在有一个问题，"},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 是什么？可以认为它规定了"},{"type":"formatted","text":"视口的逻辑大小","highlight":"yellow"},{"type":"formatted","text":"，它需要指定四个值 "},{"type":"formatted","text":"viewBox=\"min-x min-y width height\"","code":true}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"(min-x, min-y)","code":true},{"type":"formatted","text":"：视口左上角在画布中的坐标"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"width, height","code":true},{"type":"formatted","text":"：视口在画布中的大小"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这四个值通过空格或者逗号分隔开，"},{"type":"formatted","text":"(min-x, min-y)","code":true},{"type":"formatted","text":" 我们先不理它，稍后我们看它怎么回事，暂且将它设置为 "},{"type":"formatted","text":"(0, 0)","code":true}],"disableDrag":false},{"type":"code-block","code":"<svg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\">\n  <circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#1a66ff\" />\n</svg>\n<svg width=\"100\" height=\"100\" viewBox=\"0 0 200 200\">\n  <circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","language":"html","uuid":"7fca0fe3-84c2-453d-b75d-ed14c31e2395","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们定义了两个 SVG，视口大小都为 "},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":"，但是 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 大小不同，第一个 SVG 定义的视口逻辑大小也为 "},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":"，也就是一个逻辑大小单位等价于 "},{"type":"formatted","text":"1px","code":true},{"type":"formatted","text":"，而第二个视口逻辑大小为 "},{"type":"inline-math","tex":"200 \\times 200","children":[{"type":"formatted","text":"200 \\times 200"}]},{"type":"formatted","text":"，也就是说一个逻辑大小单位等价于 "},{"type":"formatted","text":"0.5px","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"首先我们明确一点，当我们指定了 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 之后，"},{"type":"formatted","text":"svg","code":true},{"type":"formatted","text":" 中的内容用的单位就是逻辑单位而不是像素了。因为在两个 SVG 中，它们逻辑大小单位不同，所以即使定义相同参数的圆，但是在画布上显示的单位是不一样的，如下："}],"disableDrag":false},{"type":"html-block","html":"<svg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\">\n  <circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#1a66ff\" />\n</svg>\n<svg width=\"100\" height=\"100\" viewBox=\"0 0 200 200\">\n  <circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有了 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":"，我们绘制内容时就无需关注视口的 CSS 大小了，因为视口的逻辑大小由 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 确定，当 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 不变时，改变视口的 CSS 大小，就可以产生对内容进行缩放，并且 SVG 中各内容的相对位置不会发生改变。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"最后讲一下 "},{"type":"formatted","text":"min-x","code":true},{"type":"formatted","text":", "},{"type":"formatted","text":"min-y","code":true},{"type":"formatted","text":"，它定义了视口能显示的最小坐标（当然坐标的单位是逻辑单位），也就是视口左上角的坐标是多少，之前我们定义的最小坐标是 "},{"type":"formatted","text":"(0, 0)","code":true},{"type":"formatted","text":"，也就是说视口的左上角的坐标是 "},{"type":"formatted","text":"(0, 0)","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"考虑开头的例子"}],"disableDrag":false},{"type":"code-block","code":"<svg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\">\n  <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","language":"html","uuid":"70a58030-2cf7-4cba-83d6-fcf4b36b3e88","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\">\n  <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为这个圆只有左上角在视口中，所以只会显示左上四分之一圆，现在我们决定将左上角的坐标设置为 "},{"type":"formatted","text":"(50, 50)","code":true},{"type":"formatted","text":"，就可以使得整个圆都在视口中了"}],"disableDrag":false},{"type":"code-block","code":"<svg width=\"100\" height=\"100\" viewBox=\"50 50 100 100\">\n  <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","language":"html","uuid":"5559631e-1643-4de2-acea-d456b055ca0a","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"100\" height=\"100\" viewBox=\"50 50 100 100\">\n  <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"#1a66ff\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们设置 "},{"type":"formatted","text":"min-x, min-y","code":true},{"type":"formatted","text":" 为非零值时，就相当于对画布进行了平移，一般情况下我们都是设置为 "},{"type":"formatted","text":"0 0","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"preserveAspectRatio"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们通过 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 指定的逻辑大小与真正的视口大小它们的宽高比是一样的，"},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":" 的视口大小与对应于 "},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":" 或 "},{"type":"inline-math","tex":"200 \\times 200","children":[{"type":"formatted","text":"200 \\times 200"}]},{"type":"formatted","text":" 的逻辑大小，它们的宽高比是相同的."}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"但是如果它们的宽高比不同呢？例如视口大小是 "},{"type":"inline-math","tex":"200 \\times 300","children":[{"type":"formatted","text":"200 \\times 300"}]},{"type":"formatted","text":"，但是逻辑大小是 "},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":"，那像素与逻辑单位的换算是如何计算的？是按最小的算（高，"},{"type":"formatted","text":"100 -> 200","code":true},{"type":"formatted","text":"）还是按最大的算（宽，"},{"type":"formatted","text":"100 -> 300","code":true},{"type":"formatted","text":"）？这个就由 "},{"type":"formatted","text":"preserveAspectRatio","code":true},{"type":"formatted","text":" 属性规定。"}],"disableDrag":false},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 100 100\" style=\"border: 1px solid black;\">\n  <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"xxx.png\" />\n</svg>","language":"html","uuid":"d51a378f-1814-4570-a3e4-768aef519283","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 100 100\" style=\"border: 1px solid black;\">\n    <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们定义了视口大小为 "},{"type":"inline-math","tex":"300 \\times 200","children":[{"type":"formatted","text":"300 \\times 200"}]},{"type":"formatted","text":"，视口逻辑大小定义为 "},{"type":"inline-math","tex":"100 \\times 100","children":[{"type":"formatted","text":"100 \\times 100"}]},{"type":"formatted","text":"，很明显宽高比是不一样的，默认的换算关系为按最小比例算。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"有三种换算方法："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"meet","code":true},{"type":"formatted","text":"：按最小比例算，默认值"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"slice","code":true},{"type":"formatted","text":"：按最大比例算"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"none","code":true},{"type":"formatted","text":"：不等比缩放，进行拉伸填充视口"}],"disableDrag":false}]}]},{"type":"html-block","html":"<div style=\"display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: 240px; gap: 20px;\">\n  <div style=\"display: flex; justify-content: center;\">\n    <div>\n      <svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" style=\"border: 1px solid gray;\">\n      \t<image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n    \t</svg>\n    \t<center><code>meet</code></center>\n    </div>\n  </div>\n  <div style=\"display: flex; justify-content: center;\">\n    <div>\n      <svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"xMidYMid slice\" style=\"border: 1px solid gray;\">\n        <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n      </svg>\n      <center><code>slice</code></center>\n    </div>  \n  </div>\n  <div style=\"display: flex; justify-content: center;\">\n    <div>\n      <svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" style=\"border: 1px solid gray;\">\n        <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n      </svg>\n      <center><code>none</code></center>  \n    </div>  \n  </div>\n</div>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"除此之外还需要指定对齐关系，在每个方向上都有三种对齐方式："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"min","code":true},{"type":"formatted","text":"：左对齐或上对齐"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"mid","code":true},{"type":"formatted","text":"：居中对齐"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"max","code":true},{"type":"formatted","text":"：右对齐或下对齐"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以组合起来就有 "},{"type":"inline-math","tex":"3 \\times 3 = 9","children":[{"type":"formatted","text":"3 \\times 3 = 9"}]},{"type":"formatted","text":" 种对齐方式（当指定为 "},{"type":"formatted","text":"none","code":true},{"type":"formatted","text":" 时不用指定对齐方式，因为已经填充完了视口，不需要对齐），默认的对齐方式为 "},{"type":"formatted","text":"xMidYMid","code":true},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"preserveAspectRatio","code":true},{"type":"formatted","text":" 的写法为 "},{"type":"formatted","text":"preserveAspectRatio=\"对齐方式 缩放方式\"","code":true},{"type":"formatted","text":"，它的默认值就是 "},{"type":"formatted","text":"preserveAspectRatio=\"xMidYMid meet\"","code":true}],"disableDrag":false},{"type":"code-block","code":"<svg \n  width=\"300\" \n  height=\"200\" \n  viewBox=\"0 0 100 100\" \n  preserveAspectRatio=\"xMidYMid meet\"\n>\n  \n</svg>","language":"html","uuid":"8b1b0b7f-bf3e-4f38-b5a1-1b519219cff3","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们看几组例子理解一下"}],"disableDrag":false},{"type":"html-block","html":"<div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;\">\n<div style=\"display: flex; justify-content: center;\">\n<div>\n  <svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" style=\"border: 1px solid rgba(128, 128, 128, .5);\" preserveAspectRatio=\"xMinYMid meet\">\n  <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n</svg>\n<center><code>xMinYMid meet</code></center>\n</div>\n</div>\n  <div style=\"display: flex; justify-content: center;\">\n<div>\n  <svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" style=\"border: 1px solid rgba(128, 128, 128, .5);\" preserveAspectRatio=\"xMaxYMid meet\">\n  <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n</svg>\n<center><code>xMaxYMid meet</code></center>\n</div>\n</div>\n<div style=\"display: flex; justify-content: center;\">\n<div>\n<svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"xMidYMin slice\" style=\"border: 1px solid rgba(128, 128, 128, .5);\">\n  <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n</svg>\n<center><code>xMidYMmin slice</code></center>\n</div>  \n</div>\n<div style=\"display: flex; justify-content: center;\">\n<div>\n<svg width=\"240\" height=\"180\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"xMidYMax slice\" style=\"border: 1px solid rgba(128, 128, 128, .5);\">\n  <image x=\"0\" y=\"0\" width=\"100\" height=\"100\" xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/image.1shw90eniffk.png\" />\n</svg>\n<center><code>xMidYMax slice</code></center>\n</div>  \n</div>\n</div>","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"基本概念"},{"label":"视口、viewBox 与 preserveAspectRatio","href":"/docs/document/9/80.html"}],"prevPage":{"title":"SVG 介绍","href":"/docs/document/9/76.html"},"nextPage":{"title":"线","href":"/docs/document/9/82.html"},"createTime":1703603612297,"updateTime":1758340734904,"currentPath":"/docs/document/9/80.html"},"meta":{"type":"doc","publishTime":1764774821798}};
