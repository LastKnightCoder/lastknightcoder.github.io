ocument/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":89,"title":"图案","content":[{"type":"paragraph","children":[{"type":"formatted","text":"形状中除了可以填充颜色，还可以填充图案。我们的窗帘，床单出现的重复性的形状、花纹、动漫等，它们就是图案，使用图案填充形状时，图案会重复出现铺满整个形状。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们在 "},{"type":"formatted","text":"\u003cpattern\u003e","code":true},{"type":"formatted","text":" 标签中定义图案，首先我们需要定义图案的大小，因为图案是填充在形状中的，所以它的单位有两种情况，通过 "},{"type":"formatted","text":"patternUnits","code":true},{"type":"formatted","text":" 规定，一种是相对于填充对象的大小，取值为 "},{"type":"formatted","text":"objectBoundingBox","code":true},{"type":"formatted","text":"，也是默认值，另一种是使用当前坐标系统的单位，取值为 "},{"type":"formatted","text":"userSpaceOnUse","code":true},{"type":"formatted","text":"。"}]},{"type":"code-block","code":"\u003csvg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern id=\"happy-sheep\" x=\"0\" y=\"0\" width=\".2\" height=\".2\"\u003e\n      \u003cimage\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep)\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"0b3cfdf9-24b3-42e6-9eda-3a87e1e87efd","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern id=\"happy-sheep\" x=\"0\" y=\"0\" width=\".2\" height=\".2\"\u003e\n      \u003cimage\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep)\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先我们定义了图案的大小为 "},{"type":"formatted","text":"20% × 20%","code":true},{"type":"formatted","text":"，这是相对于填充形状大小的，也就是说在水平方向上有 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 个图案，在垂直方向上有 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 个图案，总共有 "},{"type":"formatted","text":"25","code":true},{"type":"formatted","text":" 个图案，与被填充形状的大小无关。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们发现图案大小使用的单位与里面内容使用的单位不同，一个是相对于被填充的形状大小，一种是相对于当前的坐标系统。所以很有可能出现不匹配的情况，比如被填充的形状太小，导致无法完整显示图案，或者太大，图案之间存在较大空隙"}]},{"type":"tabs","activeKey":"311eb861-e556-43f3-9974-f69aee713faa","tabsContent":[{"key":"e132c061-1718-4cb6-b28c-da16467ae1d8","title":"过小","content":[{"type":"code-block","code":"\u003csvg style=\"background-color: #fff;\" width=\"200\" height=\"100\" viewBox=\"0 0 200 100\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern id=\"happy-sheep2\" x=\"0\" y=\"0\" width=\".2\" height=\".2\"\u003e\n      \u003cimage\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"100\" fill=\"url(#happy-sheep2)\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"056e6dfa-4a80-48f8-bed4-45e6320bc314","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg style=\"background-color: #fff;\" width=\"200\" height=\"100\" viewBox=\"0 0 200 100\"\u003e\n  \u003cdefs\u003e\n      x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep)\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"ec6e6c80-c706-4572-92d8-f8cb97f43961","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"200\" height=\"500\" viewBox=\"0 0 200 500\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern\n      id=\"happy-sheep4\"\n      x=\"0\"\n      y=\"0\"\n      width=\"40\"\n      height=\"40\"\n      patternUnits=\"userSpaceOnUse\"\n    \u003e\n      \u003cimage\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep4)\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"\u003cpattern\u003e","code":true},{"type":"formatted","text":" 内部使用的单位也可以通过 "},{"type":"formatted","text":"patternContentUnits","code":true},{"type":"formatted","text":" 修改，其默认值为 "},{"type":"formatted","text":"userSpaceOnUse","code":true},{"type":"formatted","text":"，也就是相对于当前的坐标系统，如果我们修改其为 "},{"type":"formatted","text":"objectBoundingBox","code":true},{"type":"formatted","text":"，那就是相对于被填充的对象"}]},{"type":"code-block","code":"\u003csvg width=\"200\" height=\"200\" viewBox=\"0 0 200 200\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern\n      id=\"happy-sheep\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.3%\"\n      height=\"33.3%\"\n      patternContentUnits=\"objectBoundingBox\"\n    \u003e\n      \u003cimage\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\".333\"\n        height=\".333\"\n        preserveAspectRatio=\"none\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"200\" fill=\"url(#happy-sheep)\" /\u003e\n\u003c/svg\u003e","language":"HTML","uuid":"e3a963bf-7e40-4c53-b525-9cf70fd1dae9","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg style=\"background-color: #fff;\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern\n      id=\"happy-sheep5\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.3%\"\n      height=\"33.3%\"\n      patternContentUnits=\"objectBoundingBox\"\n    \u003e\n      \u003cimage\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\".333\"\n        height=\".333\"\n        preserveAspectRatio=\"none\"\n      /\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003crect x=\"0\" y=\"0\" width=\"200\" height=\"200\" fill=\"url(#happy-sheep5)\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"图案的大小会随着形状的大小进行变化。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当图案内容使用的单位是 "},{"type":"formatted","text":"objectBoundingBox","code":true},{"type":"formatted","text":" 时，需要注意图案的比例要与形状的比例相对应，否则会使得图案进行拉伸"}]},{"type":"code-block","code":"\u003csvg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\"\u003e\n  \u003cdefs\u003e\n    \u003cpattern\n      id=\"happy-sheep\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.33%\"\n      height=\"33.33%\"\n      patternContentUnits=\"objectBoundingBox\"\n      preserveAspectRatio=\"none\"\n    \u003e\n      \u003cimage\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\
