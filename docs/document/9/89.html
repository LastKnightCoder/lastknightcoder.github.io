      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"SVG","children":[{"title":"基本概念","children":[{"title":"SVG 介绍","href":"/docs/document/9/76.html"},{"title":"视口、viewBox 与 preserveAspectRatio","href":"/docs/document/9/80.html"},{"title":"基本形状","children":[{"title":"线","href":"/docs/document/9/82.html"},{"title":"折线","href":"/docs/document/9/83.html"},{"title":"矩形","href":"/docs/document/9/84.html"},{"title":"圆和椭圆","href":"/docs/document/9/85.html"},{"title":"多边形","href":"/docs/document/9/86.html"},{"title":"路径","href":"/docs/document/9/98.html"}]},{"title":"marker","href":"/docs/document/9/99.html"},{"title":"文档组织","href":"/docs/document/9/87.html"},{"title":"渐变色","href":"/docs/document/9/88.html"},{"title":"图案","href":"/docs/document/9/89.html"},{"title":"文本","href":"/docs/document/9/90.html"},{"title":"变换","href":"/docs/document/9/91.html"},{"title":"裁剪","href":"/docs/document/9/92.html"},{"title":"蒙版","href":"/docs/document/9/93.html"}]},{"title":"动画","children":[{"title":"animate","href":"/docs/document/9/79.html"},{"title":"同步动画","href":"/docs/document/9/94.html"},{"title":"animateTransform","href":"/docs/document/9/95.html"},{"title":"animateMotion","href":"/docs/document/9/96.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":89,"title":"图案","content":[{"type":"paragraph","children":[{"type":"formatted","text":"形状中除了可以填充颜色，还可以填充图案。我们的窗帘，床单出现的重复性的形状、花纹、动漫等，它们就是图案，使用图案填充形状时，图案会重复出现铺满整个形状。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们在 "},{"type":"formatted","text":"<pattern>","code":true},{"type":"formatted","text":" 标签中定义图案，首先我们需要定义图案的大小，因为图案是填充在形状中的，所以它的单位有两种情况，通过 "},{"type":"formatted","text":"patternUnits","code":true},{"type":"formatted","text":" 规定，一种是相对于填充对象的大小，取值为 "},{"type":"formatted","text":"objectBoundingBox","code":true},{"type":"formatted","text":"，也是默认值，另一种是使用当前坐标系统的单位，取值为 "},{"type":"formatted","text":"userSpaceOnUse","code":true},{"type":"formatted","text":"。"}]},{"type":"code-block","code":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\">\n  <defs>\n    <pattern id=\"happy-sheep\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep)\" />\n</svg>","language":"html","uuid":"0b3cfdf9-24b3-42e6-9eda-3a87e1e87efd","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\">\n  <defs>\n    <pattern id=\"happy-sheep\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先我们定义了图案的大小为 "},{"type":"formatted","text":"20% × 20%","code":true},{"type":"formatted","text":"，这是相对于填充形状大小的，也就是说在水平方向上有 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 个图案，在垂直方向上有 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 个图案，总共有 "},{"type":"formatted","text":"25","code":true},{"type":"formatted","text":" 个图案，与被填充形状的大小无关。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们发现图案大小使用的单位与里面内容使用的单位不同，一个是相对于被填充的形状大小，一种是相对于当前的坐标系统。所以很有可能出现不匹配的情况，比如被填充的形状太小，导致无法完整显示图案，或者太大，图案之间存在较大空隙"}]},{"type":"tabs","activeKey":"311eb861-e556-43f3-9974-f69aee713faa","tabsContent":[{"key":"e132c061-1718-4cb6-b28c-da16467ae1d8","title":"过小","content":[{"type":"code-block","code":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"100\" viewBox=\"0 0 200 100\">\n  <defs>\n    <pattern id=\"happy-sheep2\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"100\" fill=\"url(#happy-sheep2)\" />\n</svg>","language":"html","uuid":"056e6dfa-4a80-48f8-bed4-45e6320bc314","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"100\" viewBox=\"0 0 200 100\">\n  <defs>\n    <pattern id=\"happy-sheep2\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"100\" fill=\"url(#happy-sheep2)\" />\n</svg>","children":[{"type":"formatted","text":""}]}]},{"key":"311eb861-e556-43f3-9974-f69aee713faa","content":[{"type":"code-block","code":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"500\" viewBox=\"0 0 200 500\">\n  <defs>\n    <pattern id=\"happy-sheep3\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep3)\" />\n</svg>","language":"html","uuid":"f0b999fc-6561-4352-8515-1b45ba970edb","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"500\" viewBox=\"0 0 200 500\">\n  <defs>\n    <pattern id=\"happy-sheep3\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep3)\" />\n</svg>","children":[{"type":"formatted","text":""}]}],"title":"过大"}],"children":[{"type":"code-block","code":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"500\" viewBox=\"0 0 200 500\">\n  <defs>\n    <pattern id=\"happy-sheep3\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep3)\" />\n</svg>","language":"html","uuid":"f0b999fc-6561-4352-8515-1b45ba970edb","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"500\" viewBox=\"0 0 200 500\">\n  <defs>\n    <pattern id=\"happy-sheep3\" x=\"0\" y=\"0\" width=\".2\" height=\".2\">\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep3)\" />\n</svg>","children":[{"type":"formatted","text":""}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个时候可以考虑固定图案的大小，将单位设置为 "},{"type":"formatted","text":"userSpaceOnUse","code":true}]},{"type":"code-block","code":"<svg width=\"200\" height=\"500\" viewBox=\"0 0 200 500\">\n  <defs>\n    <pattern\n      id=\"happy-sheep\"\n      x=\"0\"\n      y=\"0\"\n      width=\"40\"\n      height=\"40\"\n      patternUnits=\"userSpaceOnUse\"\n    >\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep)\" />\n</svg>","language":"html","uuid":"ec6e6c80-c706-4572-92d8-f8cb97f43961","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"200\" height=\"500\" viewBox=\"0 0 200 500\">\n  <defs>\n    <pattern\n      id=\"happy-sheep4\"\n      x=\"0\"\n      y=\"0\"\n      width=\"40\"\n      height=\"40\"\n      patternUnits=\"userSpaceOnUse\"\n    >\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"40\"\n        height=\"40\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"500\" fill=\"url(#happy-sheep4)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"<pattern>","code":true},{"type":"formatted","text":" 内部使用的单位也可以通过 "},{"type":"formatted","text":"patternContentUnits","code":true},{"type":"formatted","text":" 修改，其默认值为 "},{"type":"formatted","text":"userSpaceOnUse","code":true},{"type":"formatted","text":"，也就是相对于当前的坐标系统，如果我们修改其为 "},{"type":"formatted","text":"objectBoundingBox","code":true},{"type":"formatted","text":"，那就是相对于被填充的对象"}]},{"type":"code-block","code":"<svg width=\"200\" height=\"200\" viewBox=\"0 0 200 200\">\n  <defs>\n    <pattern\n      id=\"happy-sheep\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.3%\"\n      height=\"33.3%\"\n      patternContentUnits=\"objectBoundingBox\"\n    >\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\".333\"\n        height=\".333\"\n        preserveAspectRatio=\"none\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"200\" fill=\"url(#happy-sheep)\" />\n</svg>","language":"HTML","uuid":"e3a963bf-7e40-4c53-b525-9cf70fd1dae9","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\">\n  <defs>\n    <pattern\n      id=\"happy-sheep5\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.3%\"\n      height=\"33.3%\"\n      patternContentUnits=\"objectBoundingBox\"\n    >\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\".333\"\n        height=\".333\"\n        preserveAspectRatio=\"none\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"200\" fill=\"url(#happy-sheep5)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"图案的大小会随着形状的大小进行变化。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当图案内容使用的单位是 "},{"type":"formatted","text":"objectBoundingBox","code":true},{"type":"formatted","text":" 时，需要注意图案的比例要与形状的比例相对应，否则会使得图案进行拉伸"}]},{"type":"code-block","code":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\">\n  <defs>\n    <pattern\n      id=\"happy-sheep\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.33%\"\n      height=\"33.33%\"\n      patternContentUnits=\"objectBoundingBox\"\n      preserveAspectRatio=\"none\"\n    >\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\".3333\"\n        height=\".3333\"\n        preserveAspectRatio=\"none\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep)\" />\n</svg>","language":"html","uuid":"62974a68-0a75-4c44-8fe4-efa134cc247e","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\">\n  <defs>\n    <pattern\n      id=\"happy-sheep6\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.33%\"\n      height=\"33.33%\"\n      patternContentUnits=\"objectBoundingBox\"\n      preserveAspectRatio=\"none\"\n    >\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\".3333\"\n        height=\".3333\"\n        preserveAspectRatio=\"none\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep6)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是有的时候图案的比例就是与形状的比例不同，当比例不同的时候我们就会想到 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":"和 "},{"type":"formatted","text":"preserveAspectRatio","code":true},{"type":"formatted","text":" 属性，同样我们可以给 "},{"type":"formatted","text":"<pattern>","code":true},{"type":"formatted","text":" 定义 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"preserveAspectRatio","code":true},{"type":"formatted","text":" 属性，当我们定义了 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 以后，"},{"type":"formatted","text":"patternContentUnits","code":true},{"type":"formatted","text":" 属性将会失效"}]},{"type":"code-block","code":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\">\n  <defs>\n    <pattern\n      id=\"happy-sheep\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.3%\"\n      height=\"33.3%\"\n      viewBox=\"0 0 100 100\"\n      preserveAspectRatio=\"xMidYMid meet\"\n    >\n      <image\n        xlink:href=\"https://cdn.jsdelivr.net/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"100\"\n        height=\"100\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep)\" />\n</svg>","language":"html","uuid":"9051d3b1-dd48-4897-8721-9547b9dabbd4","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg style=\"background-color: #fff;\" width=\"200\" height=\"300\" viewBox=\"0 0 200 300\">\n  <defs>\n    <pattern\n      id=\"happy-sheep7\"\n      x=\"0\"\n      y=\"0\"\n      width=\"33.3%\"\n      height=\"33.3%\"\n      viewBox=\"0 0 100 100\"\n      preserveAspectRatio=\"xMidYMid meet\"\n    >\n      <image\n        xlink:href=\"https://jsd.cdn.zzko.cn/gh/LastKnightCoder/ImgHosting3@master/喜羊羊2022-01-19-19-06-46.svg\"\n        x=\"0\"\n        y=\"0\"\n        width=\"100\"\n        height=\"100\"\n      />\n    </pattern>\n  </defs>\n\n  <rect x=\"0\" y=\"0\" width=\"200\" height=\"300\" fill=\"url(#happy-sheep7)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用这种方案可以使得图案自适应形状大小变化，并且不会出现形状拉伸的情况。"}]},{"type":"highlight-block","color":"red","children":[{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"一开始我设置 "},{"type":"formatted","text":"patternContentUnits=\"objectBoundingBox\"","code":true},{"type":"formatted","text":" 时，想为 "},{"type":"formatted","text":"<pattern>","code":true},{"type":"formatted","text":" 里面的 "},{"type":"formatted","text":"<image>","code":true},{"type":"formatted","text":" 的宽高指定为百分比，但是失效了，经过实验发现当指定百分比的时候，其宽高是按照 "},{"type":"formatted","text":"viewBox","code":true},{"type":"formatted","text":" 指定的宽高计算的，如果指定为小数，则是按填充对象宽高计算的，所以需要指定为小数"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"除了宽高使用小数指定，还需要设置 "},{"type":"formatted","text":"preserveAspectRatio=\"none\"","code":true},{"type":"formatted","text":" 图像才会显示，目前此处尚未明白为什么"}]}]}]}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"基本概念"},{"label":"图案","href":"/docs/document/9/89.html"}],"prevPage":{"title":"渐变色","href":"/docs/document/9/88.html"},"nextPage":{"title":"文本","href":"/docs/document/9/90.html"},"createTime":1703605605388,"updateTime":1743303640566,"currentPath":"/docs/document/9/89.html"},"meta":{"type":"doc","publishTime":1764775995442}};
