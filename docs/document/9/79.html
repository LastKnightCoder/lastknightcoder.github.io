"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":79,"title":"animate","content":[{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"animate","code":true},{"type":"formatted","text":" 标签可以制作动画，该标签可以设置如下属性控制动画："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"attributeName","code":true},{"type":"formatted","text":"：要改变的属性，比如要改变元素的宽度，就设置为 "},{"type":"formatted","text":"width","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"attributeType","code":true},{"type":"formatted","text":"：属性的类型，有两种取值，分别为 XML 和 CSS"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"from, to","code":true},{"type":"formatted","text":"：属性的起始值和结束值"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"begin","code":true},{"type":"formatted","text":"：开始时间"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"dur","code":true},{"type":"formatted","text":"：持续时间"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"fill","code":true},{"type":"formatted","text":"：动画结束的状态"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"freeze","code":true},{"type":"formatted","text":"：保留终止状态"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"remove","code":true},{"type":"formatted","text":"：使用原始状态，不是动画开始时的状态"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"repeatCount","code":true},{"type":"formatted","text":"：指定动画的重复次数"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"重复无限次可以指定为 "},{"type":"formatted","text":"indefinite","code":true}]}]}]}]}]},{"type":"code-block","code":"<svg width=\"500\" height=\"100\" viewBox=\"0 0 500 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\">\n    <animate\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"100\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      fill=\"freeze\"\n      repeatCount=\"indefinite\"\n    />\n  </rect>\n</svg>","language":"html","uuid":"72701a8e-b8d1-4d8a-a388-95ac80f31396","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"500\" height=\"100\" viewBox=\"0 0 500 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"gray\">\n    <animate\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"100\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      fill=\"freeze\"\n      repeatCount=\"indefinite\"\n    />\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"formatted","text":"fill","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"remove","code":true},{"type":"formatted","text":" 时，动画结束后元素的状态是原始状态而不是动画开始时的状态，二者有何区别，看下面的例子"}]},{"type":"code-block","code":"<svg width=\"500\" height=\"100\" viewBox=\"0 0 500 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\">\n    <animate\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"0\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      fill=\"remove\"\n    />\n  </rect>\n</svg>","language":"html","uuid":"4fb4281e-e181-4223-a436-25378dd1c7b6","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们设置了矩形的原始状态为 "},{"type":"formatted","text":"width=\"100\"","code":true},{"type":"formatted","text":"，而动画的开始状态为 "},{"type":"formatted","text":"from=\"0\"","code":true},{"type":"formatted","text":"，它们是不一样的，当 "},{"type":"formatted","text":"fill","code":true},{"type":"formatted","text":" 为 "},{"type":"formatted","text":"remove","code":true},{"type":"formatted","text":" 时，元素的最终状态为原始状态。"}]},{"type":"html-block","html":"<svg width=\"500\" height=\"100\" viewBox=\"0 0 500 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"gray\">\n    <animate\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"0\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      fill=\"remove\"\n    />\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"以上动画只有两个关键帧，"},{"type":"formatted","text":"from","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"to","code":true},{"type":"formatted","text":"，除此之外，我们可以使用 "},{"type":"formatted","text":"values","code":true},{"type":"formatted","text":" 属性指定多个关键帧，关键帧的取值使用分号分隔"}]},{"type":"code-block","code":"<svg width=\"400\" height=\"100\" viewBox=\"0 0 400 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"gray\">\n    <animate\n      id=\"rec\"\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      values=\"0;400;0\"\n      begin=\"0s\" dur=\"3s\"\n      repeatCount=\"indefinite\"\n      fill=\"freeze\" />\n  </rect>\n</svg>","language":"html","uuid":"06ab60cf-9d82-4203-8994-75e2d121829e","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"400\" height=\"100\" viewBox=\"0 0 400 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"gray\">\n    <animate\n      id=\"rec\"\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      values=\"0;400;0\"\n      begin=\"0s\" dur=\"3s\"\n      repeatCount=\"indefinite\"\n      fill=\"freeze\" />\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当我们指定多个值时，值与值之间的变化所需的过渡时间是均匀的，比如指定 "},{"type":"formatted","text":"values=\"0; 400; 0\"","code":true},{"type":"formatted","text":" "},{"type":"formatted","text":"dur=\"3s\"","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"0 -> 400","code":true},{"type":"formatted","text":" 以及 "},{"type":"formatted","text":"400 -> 0","code":true},{"type":"formatted","text":" 会平分过渡时间，每个需要 "},{"type":"formatted","text":"1.5s","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以指定 "},{"type":"formatted","text":"keyTimes","code":true},{"type":"formatted","text":" 属性来控制每个状态变化的过渡时间，它也是一个数组，它所需的值的个数与 "},{"type":"formatted","text":"values","code":true},{"type":"formatted","text":" 指定的值的个数相同，二者值一一对应。比如 "},{"type":"formatted","text":"values=\"0; 400; 0\"","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"keyTimes=\"0; 0.667; 1\"","code":true},{"type":"formatted","text":"，就表示在 "},{"type":"formatted","text":"0%~66.7%","code":true},{"type":"formatted","text":" 时间段，矩形的长度由 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 变成 "},{"type":"formatted","text":"400","code":true},{"type":"formatted","text":"，在 "},{"type":"formatted","text":"66.7%~100%","code":true},{"type":"formatted","text":" 时间段，矩形长度由 "},{"type":"formatted","text":"400","code":true},{"type":"formatted","text":" 变成 "},{"type":"formatted","text":"0","code":true}]},{"type":"code-block","code":"<svg width=\"400\" height=\"100\" viewBox=\"0 0 400 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"gray\">\n    <animate\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      values=\"0; 400; 0\"\n      keyTimes=\"0; .667; 1\"\n      begin=\"0s\" dur=\"3s\"\n      repeatCount=\"indefinite\"\n      fill=\"freeze\" />\n  </rect>\n</svg>","language":"html","uuid":"8eac6fdd-e568-4b84-9350-972ab1a2540b","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"400\" height=\"100\" viewBox=\"0 0 400 100\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"gray\">\n    <animate\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      values=\"0; 400; 0\"\n      keyTimes=\"0; .667; 1\"\n      begin=\"0s\" dur=\"3s\"\n      repeatCount=\"indefinite\"\n      fill=\"freeze\" />\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"动画"},{"label":"animate","href":"/docs/document/9/79.html"}],"prevPage":{"title":"蒙版","href":"/docs/document/9/93.html"},"nextPage":{"title":"同步动画","href":"/docs/document/9/94.html"},"createTime":1703603599824,"updateTime":1743303640564,"currentPath":"/docs/document/9/79.html"},"meta":{"type":"doc","publishTime":1764822964090}};
