"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":82,"title":"线","content":[{"type":"paragraph","children":[{"type":"formatted","text":"使用 "},{"type":"formatted","text":"\u003cline\u003e","code":true},{"type":"formatted","text":" 标签来指定一条线段，两点确定一线，所以我们需要在 "},{"type":"formatted","text":"\u003cline\u003e","code":true},{"type":"formatted","text":" 指定两点 "},{"type":"formatted","text":"(x1, y1)","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"(x2, y2)","code":true}]},{"type":"code-block","code":"\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" /\u003e","language":"html","uuid":"ef28b1b7-ecf8-4cd3-9499-9218f0c1b2c7","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"此时页面会出现一条黑色的线段，线的方向由 "},{"type":"formatted","text":"(x1, y1)","code":true},{"type":"formatted","text":" 指向 "},{"type":"formatted","text":"(x2, y2)","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面通过 "},{"type":"formatted","text":"stroke","code":true},{"type":"formatted","text":" 属性指定了线的颜色，除此之外还有一些属性可以控制线的样式："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"stroke-width","code":true},{"type":"formatted","text":"：指定线的宽度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"stroke-opacity","code":true},{"type":"formatted","text":"：指定线的透明度"}]}]}]},{"type":"code-block","code":"\u003cline\n  x1=\"20\"\n  y1=\"20\"\n  x2=\"80\"\n  y2=\"80\"\n  stroke=\"gray\"\n  stroke-width=\"5\"\n  stroke-opacity=\".5\"\n/\u003e","language":"html","uuid":"776fa2a6-6f63-4c46-a2b5-4fca48b4de78","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" stroke-width=\"5\" stroke-opacity=\".5\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"还可以通过 "},{"type":"formatted","text":"stroke-dasharray","code":true},{"type":"formatted","text":" 来定义虚线，虚线就是由实线和空隙组成的，所以我们只要定义实线和空隙的长度即可，然后会不断重复"}]},{"type":"code-block","code":"\u003cline\n  x1=\"20\"\n  y1=\"20\"\n  x2=\"80\"\n  y2=\"80\"\n  stroke=\"gray\"\n  stroke-width=\"3\"\n  stroke-dasharray=\"10 5\"\n/\u003e","language":"html","uuid":"be98c177-6a49-4453-a379-47ee5ca5b534","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n\t\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" stroke-width=\"3\" stroke-dasharray=\"10 5\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们定义实线长 "},{"type":"formatted","text":"10","code":true},{"type":"formatted","text":" 个单位，空隙长 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 个单位，然后不断重复。我们也可以只指定一个值，当指定一个值时，就表示实线和空隙的长度是一样的。还可以同时指定多个值，例如我们希望实线一段长，一段短，那我们可以指定 "},{"type":"formatted","text":"stroke-dasharray=\"10 5 3 5\"","code":true}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n\t\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" stroke-width=\"3\" stroke-dasharray=\"10 5 3 5\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"stroke-dasharray","code":true},{"type":"formatted","text":" 指定的值的个数必须为偶数，依次表示实线的长度和空隙的长度，如果指定的是奇数的话，就会重复一次，使其变为偶数个数。例如指定 "},{"type":"formatted","text":"stroke-dasharray=\"12 5 3\"","code":true},{"type":"formatted","text":" 就相当于 "},{"type":"formatted","text":"stroke-dasharray=\"12 5 3 12 5 3\"","code":true}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" stroke-width=\"3\" stroke-dasharray=\"12 5 3\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一个与虚线有关的是 "},{"type":"formatted","text":"stroke-dashoffset","code":true},{"type":"formatted","text":"，用来指定偏移量。例如我们指定 "},{"type":"formatted","text":"stroke-dasharray=\"10 5\"","code":true},{"type":"formatted","text":"，表示先是 "},{"type":"formatted","text":"10","code":true},{"type":"formatted","text":" 单位的实线，然后是 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 单位的空隙，如果我们同时指定了 "},{"type":"formatted","text":"stroke-dashoffset=\"7\"","code":true},{"type":"formatted","text":"，就会产生 "},{"type":"formatted","text":"7","code":true},{"type":"formatted","text":" 个单位的偏移，变为先是 "},{"type":"formatted","text":"3","code":true},{"type":"formatted","text":" 单位的实线，然后是 "},{"type":"formatted","text":"5","code":true},{"type":"formatted","text":" 单位的空隙，然后 "},{"type":"formatted","text":"10","code":true},{"type":"formatted","text":" 单位的实线 ..."}]},{"type":"code-block","code":"\u003cline\n  x1=\"20\"\n  y1=\"20\"\n  x2=\"80\"\n  y2=\"80\"\n  stroke=\"gray\"\n  stroke-width=\"3\"\n  stroke-dasharray=\"10 5\"\n  stroke-dashoffset=\"7\"\n/\u003e","language":"html","uuid":"d5cccca6-9a9e-4db7-98f8-f8e072481d77","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n\t\u003cline x1=\"20\" y1=\"20\" x2=\"80\" y2=\"80\" stroke=\"gray\" \n      stroke-width=\"3\" stroke-dasharray=\"10 5\"\n      stroke-dashoffset=\"7\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过组合 "},{"type":"formatted","text":"stroke-dasharray","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"stroke-dashoffset","code":true},{"type":"formatted","text":"，可以实线描边动画的效果"}]},{"type":"code-block","code":"\u003csvg width=\"200\" height=\"100\" viewBox=\"0 0 200 100\"\u003e\n  \u003crect\n    x=\"10\"\n    y=\"10\"\n    width=\"180\"\n    height=\"80\"\n    fill=\"none\"\n    stroke=\"gray\"\n    stroke-dasharray=\"520\"\n    stroke-dashoffset=\"520\"\n  \u003e\n    \u003canimate\n      attributeName=\"stroke-dashoffset\"\n      attributeType=\"XML\"\n      values=\"520; 0; 520\"\n      begin=\"0s\"\n      dur=\"6s\"\n      repeatCount=\"indefinite\"\n    /\u003e\n  \u003c/rect\u003e\n\u003c/svg\u003e","language":"html","uuid":"ba6004aa-045e-43d7-b455-e0e0cd83ff92","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"200\" height=\"100\" viewBox=\"0 0 200 100\"\u003e\n  \u003crect\n    x=\"10\"\n    y=\"10\"\n    width=\"180\"\n    height=\"80\"\n    fill=\"none\"\n    stroke=\"gray\"\n    stroke-dasharray=\"520\"\n    stroke-dashoffset=\"520\"\n  \u003e\n    \u003canimate\n      attributeName=\"stroke-dashoffset\"\n      attributeType=\"XML\"\n      values=\"520; 0; 520\"\n      begin=\"0s\"\n      dur=\"6s\"\n      repeatCount=\"indefinite\"\n    /\u003e\n  \u003c/rect\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面动画的思路就是首先设置实线和虚线的长度一样长，为路径的总长度，例如上面矩形的总长度为 "},{"type":"formatted","text":"520","code":true},{"type":"formatted","text":"，然后设置 "},{"type":"formatted","text":"stroke-dashoffset","code":true},{"type":"formatted","text":" 也为路径的长度，这样就会导致页面是空白的，因为实线的长度正好等于偏移量，然后我们逐渐将 "},{"type":"formatted","text":"stroke-dashoffset","code":true},{"type":"formatted","text":" 设置为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，就会使得实线慢慢的出来，从而实现一种描边动画的效果。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"stroke-linecap","code":true},{"type":"formatted","text":" 属性用来指定线帽，线帽有三种"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"butt","code":true},{"type":"formatted","text":"：默认，方形"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"round","code":true},{"type":"formatted","text":"：圆形"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"square","code":true},{"type":"formatted","text":"：正方形"}]}]}]},{"type":"code-block","code":"\u003csvg width=\"100\" height=\"100\"\u003e\n  \u003c!-- 两条垂直线 --\u003e\n  \u003cline x1=\"10\" y1=\"0\" x2=\"10\" y2=\"90\" stroke=\"red\" stroke-width=\"2\" stroke-dasharray=\"2\" /\u003e\n  \u003cline x1=\"50\" y1=\"0\" x2=\"50\" y2=\"90\" stroke=\"red\" stroke-width=\"2\" stroke-dasharray=\"2\" /\u003e\n  \u003cline x1=\"10\" y1=\"15\" x2=\"50\" y2=\"15\" stroke=\"gray\" stroke-width=\"5\" stroke-linecap=\"butt\" /\u003e\n  \u003cline x1=\"10\" y1=\"45\" x2=\"50\" y2=\"45\" stroke=\"gray\" stroke-width=\"5\" stroke-linecap=\"round\" /\u003e\n  \u003cline x1=\"10\" y1=\"75\" x2=\"50\" y2=\"75\" stroke=\"gray\" stroke-width=\"5\" stroke-linecap=\"square\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"fabb6cbe-272c-4e3b-a550-60bd973340da","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\"\u003e\n  \u003c!-- 两条垂直线 --\u003e\n  \u003cline x1=\"10\" y1=\"0\" x2=\"10\" y2=\"90\" stroke=\"red\" stroke-width=\"2\" stroke-dasharray=\"2\" /\u003e\n  \u003cline x1=\"50\" y1=\"0\" x2=\"50\" y2=\"90\" stroke=\"red\" stroke-width=\"2\" stroke-dasharray=\"2\" /\u003e\n  \u003cline x1=\"10\" y1=\"15\" x2=\"50\" y2=\"15\" stroke=\"gray\" stroke-width=\"5\" stroke-linecap=\"butt\" /\u003e\n  \u003cline x1=\"10\" y1=\"45\" x2=\"50\" y2=\"45\" stroke=\"gray\" stroke-width=\"5\" stroke-linecap=\"round\" /\u003e\n  \u003cline x1=\"10\" y1=\"75\" x2=\"50\" y2=\"75\" stroke=\"gray\" stroke-width=\"5\" stroke-linecap=\"square\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以观察到，线帽设置为 "},{"type":"formatted","text":"round","code":true},{"type":"formatted","text":" 或 "},{"type":"formatted","text":"square","code":true},{"type":"formatted","text":" 都会比预期要长一些，左右各延申线宽的 "},{"type":"formatted","text":"1/2","code":true},{"type":"formatted","text":"。"}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"基本概念"},{"label":"基本形状"},{"label":"线","href":"/docs/document/9/82.html"}],"prevPage":{"title":"视口、viewBox 与 preserveAspectRatio","href":"/docs/document/9/80.html"},"nextPage":{"title":"折线","href":"/docs/document/9/83.html"},"createTime":1703605421409,"updateTime":1743303640565,"currentPath":"/docs/document/9/82.html"},"meta":{"type":"doc","publishTime":1764823684221}};
