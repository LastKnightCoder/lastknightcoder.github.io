4.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":87,"title":"文档组织","content":[{"type":"paragraph","children":[{"type":"formatted","text":"在本节中介绍一些有效组织文档的技术，包括对元素进行分组，复用已有的元素"}],"disableDrag":false},{"type":"header","children":[{"type":"formatted","text":"分组"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在画布中，有些形状是一体的，比如我们要绘制一只小鸟，小鸟由身体的各个部位（头、身体、翅膀等）组成，这些部位应该归为一组，这样方便我们管理，并且在阅读代码时也会比较清晰；再者也方便作为一个整体进行操作，比如整体做一个变换（旋转，缩放），或者整体填充一个颜色，不用为身体的各个部分分别单独指定相同颜色，只需要指定在其父级，子元素会自动继承颜色。"}],"disableDrag":false},{"type":"image","url":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/grouping-bird2022-01-20-19-49-59.svg","children":[{"type":"formatted","text":""}],"previewUrl":"https://github.com/LastKnightCoder/ImgHosting3/raw/master/grouping-bird2022-01-20-19-49-59.svg"},{"type":"paragraph","children":[{"type":"formatted","text":"上面的小鸟再逻辑上应该是一体的，我们有必要将其分为一组，以便统一操作。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在 SVG 中，我们通过 "},{"type":"formatted","text":"g","code":true},{"type":"formatted","text":" 标签进行分组，其中的元素是一组，给出上述小鸟的例子"}],"disableDrag":false},{"type":"code-block","code":"<svg width=\"572.06\" height=\"200\" viewBox=\"0 0 572.06 200\">\n  <g id=\"bird\">\n    <g id=\"body\" fill=\"#b8e4c2\">\n      <path \n        d=\"M48.42,78.11c0-17.45,14.14-31.58,31.59-31.58s31.59,14.14,31.59,31.58c0,17.44-14.14,31.59-31.59,31.59S48.42,95.56,48.42,78.11\"\n      />\n      <path\n        d=\"M109.19,69.88c0,0-8.5-27.33-42.51-18.53c-34.02,8.81-20.65,91.11,45.25,84.73c40.39-3.65,48.59-24.6,48.59-24.6S124.68,106.02,109.19,69.88\"\n      />\n      <path\n        id=\"wing\"\n        fill=\"#81ccaa\"\n        d=
