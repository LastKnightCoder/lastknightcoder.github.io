ocs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":95,"title":"animateTransform","content":[{"type":"paragraph","children":[{"type":"formatted","text":"animate","code":true},{"type":"formatted","text":" 标签不能做 "},{"type":"formatted","text":"transform","code":true},{"type":"formatted","text":" 动画，因为 "},{"type":"formatted","text":"transform","code":true},{"type":"formatted","text":" 的取值不是数字，而是 "},{"type":"formatted","text":"scale","code":true},{"type":"formatted","text":" "},{"type":"formatted","text":"translate","code":true},{"type":"formatted","text":" 这样的字符，要实现变换动画，我们要使用 "},{"type":"formatted","text":"animateTransform","code":true},{"type":"formatted","text":" 标签。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们需要设置 "},{"type":"formatted","text":"attributeName=\"transform\"","code":true},{"type":"formatted","text":"，并且通过 "},{"type":"formatted","text":"type","code":true},{"type":"formatted","text":" 属性指定变换的类型，有如下五种取值"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"translate","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"scale","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"rotate","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"skewX","code":true}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"skewY","code":true}]}]}]},{"type":"code-block","code":"<svg width=\"600\" height=\"400\" viewBox=\"0 0 600 400\">\n  <rect id=\"rect\" x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"translate\"\n      from=\"0 0\" to=\"-200 -100\"\n      begin=\"0s\" dur=\"2s\"\n      fill=\"freeze\"/>\n  </rect>\n  <rect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      from=\"0 200 100\" to=\"45 200 100\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/>\n  </rect>\n  <rect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"scale\"\n      from=\"1\" to=\"1.5\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/>\n  </rect>\n</svg>","language":"html","uuid":"545f9d78-768c-40cc-8507-20b7c2548eff","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"600\" height=\"400\" viewBox=\"0 0 600 400\">\n  <rect id=\"rect\" x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"translate\"\n      from=\"0 0\" to=\"-200 -100\"\n      begin=\"0s\" dur=\"2s\"\n      fill=\"freeze\"/>\n  </rect>\n  <rect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      from=\"0 200 100\" to=\"45 200 100\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/>\n  </rect>\n  <rect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"scale\"\n      from=\"1\" to=\"1.5\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/>\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们希望为一个元素连续运用多个变换动画，比如先平移，然后再旋转"}]},{"type":"code-block","code":"<svg width=\"400\" height=\"300\" viewBox=\"0 0 400 300\">\n  <rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform \n      id=\"t1\" \n      attributeName=\"transform\"\n      type=\"translate\"\n      begin=\"0s\" dur=\"2s\"\n      from=\"0 0\" to=\"100 100\"\n      fill=\"freeze\"/>\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      begin=\"t1.end\" dur=\"2s\"\n      from=\"0\" to=\"90\"\n      fill=\"freeze\"/>\n  </rect>\n</svg>","language":"html","uuid":"f58b1d5b-8199-46cc-8430-5756a678a05d","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"400\" height=\"300\" viewBox=\"0 0 400 300\">\n  <rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform \n      id=\"t1\" \n      attributeName=\"transform\"\n      type=\"translate\"\n      begin=\"0s\" dur=\"2s\"\n      from=\"0 0\" to=\"100 100\"\n      fill=\"freeze\"/>\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      begin=\"t1.end\" dur=\"2s\"\n      from=\"0\" to=\"90\"\n      fill=\"freeze\"/>\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们发现第二个动画不是从上一个动画结束的位置开始的，而是从原始状态开始的。是从上一个动画结束位置开始还是重新开始，是由 "},{"type":"formatted","text":"additive","code":true},{"type":"formatted","text":" 属性控制的，它的默认值为 "},{"type":"formatted","text":"replace","code":true},{"type":"formatted","text":"，表示替换上一个动画的状态；如果我们将其设置为 "},{"type":"formatted","text":"sum","code":true},{"type":"formatted","text":"，就会上一个动画结束的位置开始"}]},{"type":"code-block","code":"<svg width=\"400\" height=\"300\" viewBox=\"0 0 400 300\">\n  <rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform \n      id=\"t1\" \n      attributeName=\"transform\"\n      type=\"translate\"\n      begin=\"0s\" dur=\"2s\"\n      from=\"0 0\" to=\"100 100\"\n      additive=\"sum\"\n      fill=\"freeze\"/>\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      begin=\"t1.end\" dur=\"2s\"\n      from=\"0\" to=\"90\"\n      additive=\"sum\"\n      fill=\"freeze\"/>\n  </rect>\n</svg>","language":"html","uuid":"7f1c69fa-542f-4d46-a5cc-edf570b70578","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"400\" height=\"300\" viewBox=\"0 0 400 300\">\n  <rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" fill=\"gray\">\n    <animateTransform \n      id=\"t2\" \n      attributeName=\"transform\"\n      type=\"translate\"\n      begin=\"0s\" dur=\"2s\"\n      from=\"0 0\" to=\"100 100\"\n      additive=\"sum\"\n      fill=\"freeze\"/>\n    <animateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      begin=\"t2.end\" dur=\"2s\"\n      from=\"0\" to=\"90\"\n      additive=\"sum\"\n      fill=\"freeze\"/>\n  </rect>\n</svg>","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"动画"},{"label":"animateTransform","href":"/docs/document/9/95.html"}],"prevPage":{"title":"同步动画","href":"/docs/document/9/94.html"},"nextPage":{"title":"animateMotion","href":"/docs/document/9/96.html"},"createTime":1703605771768,"updateTime":1743303640566,"currentPath":"/docs/document/9/95.html"},"meta":{"type":"doc","publishTime":1764810804421}};
