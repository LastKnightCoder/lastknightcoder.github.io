m\"\n      type=\"translate\"\n      from=\"0 0\" to=\"-200 -100\"\n      begin=\"0s\" dur=\"2s\"\n      fill=\"freeze\"/\u003e\n  \u003c/rect\u003e\n  \u003crect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\"\u003e\n    \u003canimateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      from=\"0 200 100\" to=\"45 200 100\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/\u003e\n  \u003c/rect\u003e\n  \u003crect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\"\u003e\n    \u003canimateTransform\n      attributeName=\"transform\"\n      type=\"scale\"\n      from=\"1\" to=\"1.5\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/\u003e\n  \u003c/rect\u003e\n\u003c/svg\u003e","language":"html","uuid":"545f9d78-768c-40cc-8507-20b7c2548eff","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"600\" height=\"400\" viewBox=\"0 0 600 400\"\u003e\n  \u003crect id=\"rect\" x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\"\u003e\n    \u003canimateTransform\n      attributeName=\"transform\"\n      type=\"translate\"\n      from=\"0 0\" to=\"-200 -100\"\n      begin=\"0s\" dur=\"2s\"\n      fill=\"freeze\"/\u003e\n  \u003c/rect\u003e\n  \u003crect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\"\u003e\n    \u003canimateTransform\n      attributeName=\"transform\"\n      type=\"rotate\"\n      from=\"0 200 100\" to=\"45 200 100\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/\u003e\n  \u003c/rect\u003e\n  \u003crect x=\"200\" y=\"100\" width=\"100\" height=\"100\" fill=\"gray\"\u003e\n    \u003canimateTransform\n      attributeName=\"transform\"\n      type=\"scale\"\n      from=\"1\" to=\"1.5\"\n      begin=\"0\" dur=\"2s\"\n      fill=\"freeze\"/\u003e\n  \u003c/rect\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们希望为一个元素连续运用多个变换动画，比如先平移，然后再旋转"}]},{"type":"code-bl @layer theme {
  :root, :host {
    --font-sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
      "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
      "Courier New", monospace;
    --default-font-family: var(--font-sans);
    --default-mono-font-family: var(--font-mono);
  }
}
@layer base {
  *, ::after, ::before, ::backdrop, ::file-selector-button {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0 solid;
  }
  html, :host {
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    font-family: var(--default-font-family, ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji");
    font-feature-settings: var(--default-font-feature-settings, normal);
    font-variation-settings: var(--default-font-variation-settings, normal);
    -webkit-tap-highlight-color: transparent;
  }
  hr {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }
  abbr:where([title]) {
    -webkit-text-decoration: underline dotted;
    text-decoration: underline dotted;
  }
  h1, h2, h3, h4, h5, h6 {
    font-size: inherit;
    font-weight: inherit;
  }
  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }
  b, strong {
    font-weight: bolder;
  }
  code, kbd, samp, pre {
    font-family: var(--default-mono-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
    font-feature-settings: var(--default-mono-font-feature-settings, normal);
    font-variation-settings: var(--default-mono-font-variation-settings, normal);
    font-size: 1em;
  }
  small {
    font-size: 80%;
  }
  sub, sup {
    font-size: 75%;
    line-height: 0;
    position: relative;
    vertical-align: baseline;
  }
  sub {
    bottom: -0.25em;
  }
  sup {
    top: -0.5em;
  }
  table {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }
  :-moz-focusring {
    outline: auto;
  }
  progress {
    vertical-align: baseline;
  }
  summary {
    display: list-item;
  }
  ol, ul, menu {
    list-style: none;
  }
  img, svg, video, canvas, audio, iframe, embed, object {
    display: block;
    vertical-align: middle;
  }
  img, video {
    max-width: 100%;
    height: auto;
  }
  button, input, select, optgroup, textarea, ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    border-radius: 0;
    background-color: transparent;
    opacity: 1;
  }
  :where(select:is([multiple], [size])) optgroup {
    font-weight: bolder;
  }
  :where(select:is([multiple], [size])) optgroup option {
    padding-inline-start: 20px;
  }
  ::file-selector-button {
    margin-inline-end: 4px;
  }
  ::placeholder {
    opacity: 1;
  }
  @supports (not (-webkit-appearance: -apple-pay-button))  or (contain-intrinsic-size: 1px) {
    ::placeholder {
      color: currentcolor;
      @supports (color: color-mix(in lab, red, red)) {
        color: color-mix(in oklab, currentcolor 50%, transparent);
      }
    }
  }
  textarea {
    resize: vertical;
  }
  ::-webkit-search-decoration {
    -webkit-appearance: none;
  }
  ::-webkit-date-and-time-value {
    min-height: 1lh;
    text-align: inherit;
  }
  ::-webkit-datetime-edit {
    display: inline-flex;
  }
  ::-webkit-datetime-edit-fields-wrapper {
    padding: 0;
  }
  ::-webkit-datetime-edit, ::-webkit-datetime-edit-year-field, ::-webkit-datetime-edit-month-field, ::-webkit-datetime-edit-day-field, ::-webkit-datetime-edit-hour-field, ::-webkit-datetime-edit-minute-field, ::-webkit-datetime-edit-second-field, ::-webkit-datetime-edit-millisecond-field, ::-webkit-datetime-edit-meridiem-field {
    padding-block: 0;
  }
  ::-webkit-calendar-picker-indicator {
    line-height: 1;
  }
  :-moz-ui-invalid {
    box-shadow: none;
  }
  button, input:where([type="button"], [type="reset"], [type="submit"]), ::file-selector-button {
    appearance: button;
  }
  ::-webkit-inner-spin-button, ::-webkit-outer-spin-button {
    height: auto;
  }
  [hidden]:where(:not([hidden="until-found"])) {
    display: none !important;
  }
}
@layer utilities {
  .transform {
    transform: var(--tw-rotate-x,) var(--tw-rotate-y,) var(--tw-rotate-z,) var(--tw-skew-x,) var(--tw-skew-y,);
  }
}
@property --tw-rotate-x {
  syntax: "*";
  inherits: false;
}
@property --tw-rotate-y {
  syntax: "*";
  inherits: false;
}
@property --tw-rotate-z {
  syntax: "*";
  inherits: false;
}
@property --tw-skew-x {
  syntax: "*";
  inherits: false;
}
@property --tw-skew-y {
  syntax: "*";
  inherits: false;
}
@layer properties {
  @supports ((-webkit-hyphens: none) and (not (margin-trim: inline))) or ((-moz-orient: inline) and (not (color:rgb(from red r g b)))) {
    *, ::before, ::after, ::backdrop {
      --tw-rotate-x: initial;
      --tw-rotate-y: initial;
      --tw-rotate-z: initial;
      --tw-skew-x: initial;
      --tw-skew-y: initial;
    }
  }
}</style>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
