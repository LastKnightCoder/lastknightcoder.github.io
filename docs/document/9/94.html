    <script>
      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"SVG","children":[{"title":"基本概念","children":[{"title":"SVG 介绍","href":"/docs/document/9/76.html"},{"title":"视口、viewBox 与 preserveAspectRatio","href":"/docs/document/9/80.html"},{"title":"基本形状","children":[{"title":"线","href":"/docs/document/9/82.html"},{"title":"折线","href":"/docs/document/9/83.html"},{"title":"矩形","href":"/docs/document/9/84.html"},{"title":"圆和椭圆","href":"/docs/document/9/85.html"},{"title":"多边形","href":"/docs/document/9/86.html"},{"title":"路径","href":"/docs/document/9/98.html"}]},{"title":"marker","href":"/docs/document/9/99.html"},{"title":"文档组织","href":"/docs/document/9/87.html"},{"title":"渐变色","href":"/docs/document/9/88.html"},{"title":"图案","href":"/docs/document/9/89.html"},{"title":"文本","href":"/docs/document/9/90.html"},{"title":"变换","href":"/docs/document/9/91.html"},{"title":"裁剪","href":"/docs/document/9/92.html"},{"title":"蒙版","href":"/docs/document/9/93.html"}]},{"title":"动画","children":[{"title":"animate","href":"/docs/document/9/79.html"},{"title":"同步动画","href":"/docs/document/9/94.html"},{"title":"animateTransform","href":"/docs/document/9/95.html"},{"title":"animateMotion","href":"/docs/document/9/96.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":94,"title":"同步动画","content":[{"type":"paragraph","children":[{"type":"formatted","text":"当页面上多个动画有先后顺序时，比如当前一个动画完成时，后一个动画才开始，这样的动画我们称为同步动画。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个可以设置 "},{"type":"formatted","text":"begin","code":true},{"type":"formatted","text":" 属性来锚定某个动画来实现同步动画，举个🌰"}]},{"type":"code-block","code":"<svg width=\"400\" height=\"350\" viewBox=\"0 0 400 350\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"#1a66ff\">\n    <animate\n      id=\"c1\"\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"100\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      fill=\"freeze\" \n     />\n  </rect>\n  <circle cx=\"150\" cy=\"220\" r=\"0\" fill=\"#1a66ff\">\n    <animate \n      attributeName=\"r\"\n      attributeType=\"XML\"\n      from=\"0\" to=\"100\"\n      begin=\"c1.end\" dur=\"2s\"\n      fill=\"freeze\" \n    />\n  </circle>\n</svg>","language":"html","uuid":"a90255dc-f764-43c2-a6ab-91c970f3ec9f","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"400\" height=\"350\" viewBox=\"0 0 400 350\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"#1a66ff\">\n    <animate\n      id=\"c1\"\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"100\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      fill=\"freeze\" \n     />\n  </rect>\n  <circle cx=\"150\" cy=\"220\" r=\"0\" fill=\"#1a66ff\">\n    <animate \n      attributeName=\"r\"\n      attributeType=\"XML\"\n      from=\"0\" to=\"100\"\n      begin=\"c1.end\" dur=\"2s\"\n      fill=\"freeze\" \n    />\n  </circle>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面定义了一个矩形逐渐变宽的动画和一个圆逐渐变大的动画，注意到圆动画开始的时间我设置为了 "},{"type":"formatted","text":"begin=\"c1.end\"","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"c1","code":true},{"type":"formatted","text":" 是矩形动画的 "},{"type":"formatted","text":"id","code":true},{"type":"formatted","text":"，这个意思就是圆动画开始时间是矩形动画的结束时间。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们还可以添加一个偏移量，比如我们希望圆动画在矩形动画结束之后再经过两秒开始，我们就可以设置圆动画的起始时间为 "},{"type":"formatted","text":"begin=\"c1.end+2s\"","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果希望圆动画在矩形动画开始两秒后开始动画，这个时候我们可以设置圆动画的开始时间为 "},{"type":"formatted","text":"begin=\"c1.begin+2s\"","code":true},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果我们希望某个元素的动画在另一个动画重复指定次数时开始，可以指定属性 "},{"type":"formatted","text":"begin=\"id.repeat(count)+offset\"","code":true},{"type":"formatted","text":"，"},{"type":"formatted","text":"count","code":true},{"type":"formatted","text":" 从 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 开始计数"}]},{"type":"code-block","code":"<svg width=\"400\" height=\"350\" viewBox=\"0 0 400 350\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\">\n    <animate\n      id=\"rec\"\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"100\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      repeatCount=\"2\"\n      fill=\"freeze\" />\n  </rect>\n  <circle cx=\"150\" cy=\"220\" r=\"0\" >\n    <animate \n      attributeName=\"r\"\n      attributeType=\"XML\"\n      from=\"0\" to=\"100\"\n      <!-- 在矩形动画第一次重复时，圆动画开始执行。  -->\n      begin=\"rec.repeat(1)\" dur=\"3s\"\n      fill=\"freeze\" />\n  </circle>\n</svg>","language":"HTML","uuid":"f1179e1a-efd3-4968-a1ef-7f83e316aadf","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"400\" height=\"350\" viewBox=\"0 0 400 350\">\n  <rect width=\"100\" height=\"100\" x=\"0\" y=\"0\" fill=\"#1a66ff\">\n    <animate\n      id=\"rec\"\n      attributeName=\"width\"\n      attributeType=\"XML\"\n      from=\"100\" to=\"400\"\n      begin=\"0s\" dur=\"3s\"\n      repeatCount=\"2\"\n      fill=\"freeze\" \n    />\n  </rect>\n  <circle cx=\"150\" cy=\"220\" r=\"0\" fill=\"#1a66ff\">\n    <animate \n      attributeName=\"r\"\n      attributeType=\"XML\"\n      from=\"0\" to=\"100\"\n      begin=\"rec.repeat(1)\" dur=\"3s\"\n      fill=\"freeze\" \n   />\n  </circle>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"一般而言，动画的结束时间就是动画的持续时间，但是我们可以通过设置 "},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":" 属性改变这一点，它是用来设置动画的结束时间的。这个时候你可能会问，"},{"type":"formatted","text":"end","code":true},{"type":"formatted","text":" 属性如果和 "},{"type":"formatted","text":"dur","code":true},{"type":"formatted","text":" 属性设置的不一样，那不就冲突了吗？这个时候动画的结束时间以谁为准呢？"}]},{"type":"paragraph","children":[{"type":"formatted","text":"答案就是哪个先结束就以哪个为准。例如动画持续时间设置为 "},{"type":"formatted","text":"dur=\"3s\"","code":true},{"type":"formatted","text":"，结束时间设置为 "},{"type":"formatted","text":"end=\"5s\"","code":true},{"type":"formatted","text":"，那么就以 "},{"type":"formatted","text":"dur","code":true},{"type":"formatted","text":" 为准；反过来如果 "},{"type":"formatted","text":"dur=\"5s\"","code":true},{"type":"formatted","text":" 而 "},{"type":"formatted","text":"end=\"3s\"","code":true},{"type":"formatted","text":"，那么动画结束时间就是 "},{"type":"formatted","text":"3s","code":true},{"type":"formatted","text":"，并且动画处于 "},{"type":"formatted","text":"3s","code":true},{"type":"formatted","text":" 时的状态，而不是结束状态，通过这种方法我们可以查看动画的中间状态。"}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"动画"},{"label":"同步动画","href":"/docs/document/9/94.html"}],"prevPage":{"title":"animate","href":"/docs/document/9/79.html"},"nextPage":{"title":"animateTransform","href":"/docs/document/9/95.html"},"createTime":1703605686447,"updateTime":1743303640566,"currentPath":"/docs/document/9/94.html"},"meta":{"type":"doc","publishTime":1764820858555}};
