"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":92,"title":"裁剪","content":[{"type":"paragraph","children":[{"type":"formatted","text":"有时候我们只对图像的一部分感兴趣，这个时候我们可以定义一个裁剪路径，只有路径包围的区域才会显示出来，而在路径之外的区域则不予显示，这个就像是聚光灯一样，只有聚光灯照到的部分我们才能看得到。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"clipPath","code":true},{"type":"formatted","text":" 定义裁剪路径，然后通过 "},{"type":"formatted","text":"clip-path","code":true},{"type":"formatted","text":" 属性来引用该路径"}]},{"type":"code-block","code":"<svg width=\"200\" height=\"100\" viewBox=\"0 0 200 100\">\n  <defs>\n    <clipPath id=\"circle\">\n      <!-- 定义一个圆形的裁剪路径 -->\n      <circle cx=\"50\" cy=\"50\" r=\"50\" />\n    </clipPath>\n  </defs>\n  <!-- 通过 clip-path 属性引用路径 -->\n  <image xlink:href=\"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_54a6391a-330c-4a3d-8a26-ac1df7b0acb5.png\"\n  \twidth=\"100\"\n  \theight=\"100\"\n  \tx=\"0\"\n  \ty=\"0\"\n  \tclip-path=\"url(#circle)\"\n  />\n</svg>","language":"html","uuid":"6061124f-d011-43ae-923f-82c9a16c930a","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"200\" height=\"100\" viewBox=\"0 0 200 100\">\n  <defs>\n    <clipPath id=\"circle\">\n      <!-- 定义一个圆形的裁剪路径 -->\n      <circle cx=\"50\" cy=\"50\" r=\"50\" />\n    </clipPath>\n  </defs>\n  <!-- 通过 clip-path 属性引用路径 -->\n  <image xlink:href=\"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_54a6391a-330c-4a3d-8a26-ac1df7b0acb5.png\"\n  \twidth=\"100\"\n  \theight=\"100\"\n  \tx=\"0\"\n  \ty=\"0\"\n  \tclip-path=\"url(#circle)\"\n  />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"clip-path","code":true},{"type":"formatted","text":" 可以是各种形状，甚至可以是文字"}]},{"type":"code-block","code":"<svg width=\"200\" height=\"100\" viewBox=\"0 0 200 100\">\n  <defs>\n    <clipPath id=\"text\">\n      <text x=\"0\" y=\"50\" font-size=\"48\" stroke=\"gray\" fill=\"none\" >GIRL!</text>\n    </clipPath>\n  </defs>\n  <image xlink:href=\"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_54a6391a-330c-4a3d-8a26-ac1df7b0acb5.png\"\n    width=\"200\"\n    height=\"200\"\n    x=\"0\"\n    y=\"0\"\n  \tclip-path=\"url(#text)\"\n  />\n</svg>","language":"html","uuid":"fa300c51-f6c5-4988-907b-79b03a65a9fa","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"200\" height=\"100\" viewBox=\"0 0 200 100\">\n  <defs>\n    <clipPath id=\"text\">\n      <text x=\"20\" y=\"40\" font-size=\"48\" stroke=\"none\" fill=\"black\" >GIRL!</text>\n    </clipPath>\n  </defs>\n  <image xlink:href=\"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_54a6391a-330c-4a3d-8a26-ac1df7b0acb5.png\"\n    width=\"150\"\n    height=\"150\"\n    x=\"0\"\n    y=\"0\"\n    clip-path=\"url(#text)\"\n \t/>\n</svg>","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"基本概念"},{"label":"裁剪","href":"/docs/document/9/92.html"}],"prevPage":{"title":"变换","href":"/docs/document/9/91.html"},"nextPage":{"title":"蒙版","href":"/docs/document/9/93.html"},"createTime":1703605662964,"updateTime":1743303640566,"currentPath":"/docs/document/9/92.html"},"meta":{"type":"doc","publishTime":1764821904251}};
