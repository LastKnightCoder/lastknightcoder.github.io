ocs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":91,"title":"变换","content":[{"type":"paragraph","children":[{"type":"formatted","text":"有的时候我们需要对形状进行变换，比如缩放，旋转等，这个时候可以使用 "},{"type":"formatted","text":"transform","code":true},{"type":"formatted","text":" 进行变换。"}]},{"type":"header","children":[{"type":"formatted","text":"平移"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"通过设置 "},{"type":"formatted","text":"transform","code":true},{"type":"formatted","text":" 属性值为 "},{"type":"formatted","text":"translate(x-value, y-value)","code":true},{"type":"formatted","text":"，其中 "},{"type":"formatted","text":"y-value","code":true},{"type":"formatted","text":" 可省略，默认为 "},{"type":"formatted","text":"0","code":true}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"translate(20, 20)\" />\n</svg>","language":"html","uuid":"c8f47ca2-5eef-49f0-bae6-ff3d9ee77fff","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"gray\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"translate(20, 20)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了清楚变换的大小，我们绘制了网格，一个网格大小为 "},{"type":"inline-math","tex":"20 \\times 20","children":[{"type":"formatted","text":"20 \\times 20"}]},{"type":"formatted","text":"。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面我们对矩形进行了平移变换，你可能以为是对矩形进行的变换，实际上是对坐标系统进行的变换（"},{"type":"formatted","text":"每个形状都有自己的坐标系统","color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"），矩形实在变换后的坐标系中绘制出来的，从而达到对矩形进行变换的效果。"}]},{"type":"header","children":[{"type":"formatted","text":"缩放"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"scale()","code":true},{"type":"formatted","text":" 来对进行缩放，它有两种情况，当只指定一个值时，表示在 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 方向和 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 方向缩放同样的倍数；当指定两个值时，表示指定对 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 方向和 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 方向的缩放倍数"}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"20\" y=\"20\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"scale(2)\" />\n</svg>","language":"html","uuid":"f3626ca0-f437-437f-a431-e56b46562ea3","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"20\" y=\"20\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"scale(2)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"旋转"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"通过 "},{"type":"formatted","text":"rotate(angle, x, y)","code":true},{"type":"formatted","text":" 对坐标系统进行旋转"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"angle","code":true},{"type":"formatted","text":"：旋转角度，单位为度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"(x, y)","code":true},{"type":"formatted","text":"：旋转中心，可选，不指定默认为 "},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":"，即绕坐标系统原点左上角进行旋转"}]}]}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"rotate(45)\" />\n</svg>","language":"html","uuid":"97af3725-708d-46e1-9a5e-b13b1dc06303","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"rotate(45)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以指定旋转的中心，比如我们指定旋转中心为形状的左上角"}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"rotate(45, 50, 50)\" />\n</svg>","language":"html","uuid":"c389697d-b48b-4f12-a2e8-5810c5e2d128","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"rotate(45, 50, 50)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"斜切"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"斜切可以倾斜某个坐标轴一定的角度"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"skewX(thetaX)","code":true},{"type":"formatted","text":"：倾斜 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 轴"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"skewY(thetaY)","code":true},{"type":"formatted","text":"：倾斜 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 轴"}]}]}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"skewX(45)\" />\n</svg>","language":"html","uuid":"ed7dbeeb-e07c-47d7-b2a9-bfcd86adc011","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"skewX(45)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"header","children":[{"type":"formatted","text":"变换序列"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"我们可以同时使用多个变换，SVG 会"},{"type":"formatted","text":"依次","color":"#e33a32","darkColor":"#fa7873"},{"type":"formatted","text":"对坐标系统进行变换"}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <!-- 先平移再旋转 -->\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"translate(100) rotate(45)\" />\n</svg>","language":"html","uuid":"45a58211-b762-416a-ab10-684d90be9811","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <!-- 先平移再旋转 -->\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"translate(100) rotate(45)\" />\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们对坐标进行变换，在数学上相当于乘以了一个矩阵，根据矩阵相乘的性质，"},{"type":"inline-math","tex":"AB \\neq BA","children":[{"type":"formatted","text":"AB \\neq BA"}]},{"type":"formatted","text":"，也就是说最后的结果与变换的顺序有关，不同的变换顺序导致的结果是不一样的"}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <defs>\n    <pattern id=\"grid\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" patternUnits=\"userSpaceOnUse\">\n      <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"black\" />\n    </pattern>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <!-- 先旋转再平移 -->\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"rotate(45) translate(100)\" />\n</svg>","language":"html","uuid":"fca0e467-2af0-4920-b17f-07ac4b3c9164","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <rect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"url(#grid)\" />\n  <!-- 先旋转再平移 -->\n  <rect x=\"50\" y=\"50\" width=\"100\" height=\"60\" fill=\"#126bae\" transform=\"rotate(45) translate(100)\" />\n</svg>","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"基本概念"},{"label":"变换","href":"/docs/document/9/91.html"}],"prevPage":{"title":"文本","href":"/docs/document/9/90.html"},"nextPage":{"title":"裁剪","href":"/docs/document/9/92.html"},"createTime":1703605650967,"updateTime":1743303640566,"currentPath":"/docs/document/9/91.html"},"meta":{"type":"doc","publishTime":1764820858554}};
