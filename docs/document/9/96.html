:[{"type":"formatted","text":"注意到这个三角形在运动时始终是水平的，不会自动旋转使得自身与路径相切，我们可以为 "},{"type":"formatted","text":"animateMotion","code":true},{"type":"formatted","text":" 的 "},{"type":"formatted","text":"roatet","code":true},{"type":"formatted","text":" 属性指定为 "},{"type":"formatted","text":"auto","code":true},{"type":"formatted","text":"，这样就可以使得运动元素自动旋转与路径相切"}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <path d=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n  \tstroke=\"#1a66ff\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\" />\n  <path d=\"M -10 -3 L 10 -3 0 -20 z\" fill=\"#2177b8\">\n    <animateMotion \n      path=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n      begin=\"0s\" dur=\"3s\"\n      rotate=\"auto\" \n      fill=\"freeze\" \n      repeatCount=\"indefinite\" />\n  </path>\n</svg>","language":"html","uuid":"a1a978d4-8181-40cd-8e44-121848600ad1","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <path d=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n  \tstroke=\"#1a66ff\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\" />\n  <path d=\"M -10 -3 L 10 -3 0 -20 z\" fill=\"#2177b8\">\n    <animateMotion \n      path=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n      begin=\"0s\" dur=\"3s\"\n      rotate=\"auto\" \n      fill=\"freeze\" \n      repeatCount=\"indefinite\" />\n  </path>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在上面我们定义了两个重复的路径，为了复用路径，我们可以在 "},{"type":"formatted","text":"animateMotion","code":true},{"type":"formatted","text":" 中定义一个 "},{"type":"formatted","text":"mpath","code":true},{"type":"formatted","text":" 标签，然后通过 "},{"type":"formatted","text":"xlink:href","code":true},{"text":" 引用现有的路径","type":"formatted"}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <path id=\"motionpath\" d=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n  \tstroke=\"#1a66ff\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\" />\n  <path d=\"M -10 -3 L 10 -3 0 -20 z\" fill=\"#2177b8\">\n    <animateMotion \n      begin=\"0s\" dur=\"3s\" \n      rotate=\"auto\" fill=\"freeze\" \n      repeatCount=\"indefinite\"\n     >\n       <mpath xlink:href=\"#motionpath\"></mpath>\n    </animateMotion>\n  </path>\n</svg>","language":"html","uuid":"d683b77e-502a-40c5-a5b9-f9cea4071d28","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <path id=\"motionpath\" d=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n  \tstroke=\"#1a66ff\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\" />\n  <path d=\"M -10 -3 L 10 -3 0 -20 z\" fill=\"#2177b8\">\n    <animateMotion \n      begin=\"0s\" dur=\"3s\" \n      rotate=\"auto\" fill=\"freeze\" \n      repeatCount=\"indefinite\">\n        <mpath xlink:href=\"#motionpath\"></mpath>\n    </animateMotion>\n  </path>\n</svg>","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"运动动画默认是匀速的，我们可以通过 "},{"type":"formatted","text":"keyPoints","code":true},{"type":"formatted","text":" 和 "},{"type":"formatted","text":"keyTimes","code":true},{"type":"formatted","text":" 改变运动速度，并设置 "},{"type":"formatted","text":"calcMode=\"linear\"","code":true}]},{"type":"code-block","code":"<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\">\n  <path d=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n  stroke=\"#1a66ff\" stroke-width=\"2\" \n  stroke-linecap=\"round\" fill=\"none\" />\n  <path d=\"M -10 -3 L 10 -3 0 -20 z\" fill=\"#2177b8\">\n    <animateMotion \n      path=\"M 50 50 Q 100 100 150 50 200 0 250 50\" \n      begin=\"0s\" dur=\"3s\"\n      rotate=\"auto\" \n      fill=\"freeze\"\n      keyPoints=\"0;0.2;0.8;1\"\n      keyTimes=\"0;0.45;0.65;1\"\n      calcMode=\"linear\"\n      repeatCount=\"indefinite\" />\n  </path>\n</svg>","lang
