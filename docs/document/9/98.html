      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"SVG","children":[{"title":"基本概念","children":[{"title":"SVG 介绍","href":"/docs/document/9/76.html"},{"title":"视口、viewBox 与 preserveAspectRatio","href":"/docs/document/9/80.html"},{"title":"基本形状","children":[{"title":"线","href":"/docs/document/9/82.html"},{"title":"折线","href":"/docs/document/9/83.html"},{"title":"矩形","href":"/docs/document/9/84.html"},{"title":"圆和椭圆","href":"/docs/document/9/85.html"},{"title":"多边形","href":"/docs/document/9/86.html"},{"title":"路径","href":"/docs/document/9/98.html"}]},{"title":"marker","href":"/docs/document/9/99.html"},{"title":"文档组织","href":"/docs/document/9/87.html"},{"title":"渐变色","href":"/docs/document/9/88.html"},{"title":"图案","href":"/docs/document/9/89.html"},{"title":"文本","href":"/docs/document/9/90.html"},{"title":"变换","href":"/docs/document/9/91.html"},{"title":"裁剪","href":"/docs/document/9/92.html"},{"title":"蒙版","href":"/docs/document/9/93.html"}]},{"title":"动画","children":[{"title":"animate","href":"/docs/document/9/79.html"},{"title":"同步动画","href":"/docs/document/9/94.html"},{"title":"animateTransform","href":"/docs/document/9/95.html"},{"title":"animateMotion","href":"/docs/document/9/96.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document","active":true}]}],"content":{"id":98,"title":"路径","content":[{"type":"paragraph","children":[{"type":"formatted","text":"之前介绍的形状（线、折线、矩形、圆）等都可以看作是路径的简写形式，因为直接通过路径去绘制这些图形较为复杂，所以对于这些常见的形状提供一种简单的方法进行绘制。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"绘制路径使用 "},{"type":"formatted","text":"\u003cpath\u003e","code":true},{"type":"formatted","text":"，通过 "},{"type":"formatted","text":"d","code":true},{"type":"formatted","text":"(data 的缩写) 来绘制数据，"},{"type":"formatted","text":"d","code":true},{"type":"formatted","text":" 中的数据主要由绘图指令（单个字符）和坐标信息组成，下面我们就来介绍这些绘图指令。"}]},{"type":"header","children":[{"type":"formatted","text":"M(m) 和 L(l)"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"M(move) 指令后跟一坐标，表示将画笔移动到此处；L(lineTo) 指令后面可以跟一对或多对坐标，画笔会依次连接这些点。"}]},{"type":"code-block","code":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 L 10,90 90,90 90,10 10,10\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"3a86e2b2-f1b0-4a03-a486-4f1c1e77ad3d","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 L 10,90 90,90 90,10 10,10\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"l","code":true},{"type":"formatted","text":" 指令的作用同 "},{"type":"formatted","text":"L","code":true},{"type":"formatted","text":" ，不过后面指定的坐标是相对值，而不是绝对位置，假设当前坐标是 "},{"type":"formatted","text":"(x, y)","code":true},{"type":"formatted","text":"，那么 "},{"type":"formatted","text":"l 10 20","code":true},{"type":"formatted","text":" 表示的坐标就是 "},{"type":"formatted","text":"(x + 10, y + 20)","code":true}]},{"type":"code-block","code":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 l 0,80 80,0 0,-80 -80,0\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"d9ba50ed-fdf0-4f5f-956a-571049a844e5","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 l 0,80 80,0 0,-80 -80,0\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"highlight-block","color":"purple","children":[{"type":"paragraph","children":[{"type":"formatted","text":"后文出现的所有大写指令后接绝对坐标，小写指令后接相对坐标，不再解释。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"因为绘制水平线和垂直线比较常用，所以有专门的指令来绘制水平线和垂直线"}]},{"type":"table","children":[{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"指令"}]},{"type":"table-cell","children":[{"type":"formatted","text":"作用"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"H value → L value current_y","code":true},{"type":"formatted","text":"\t"}]},{"type":"table-cell","children":[{"type":"formatted","text":"绘制水平线"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"h value → l value 0","code":true},{"type":"formatted","text":"\t"}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"V value → L current_x value","code":true}]},{"type":"table-cell","children":[{"type":"formatted","text":"绘制垂直线"}]}]},{"type":"table-row","children":[{"type":"table-cell","children":[{"type":"formatted","text":"v value → v 0 value\t","code":true}]},{"type":"table-cell","children":[{"type":"formatted","text":""}]}]}]},{"type":"code-block","code":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 v 80 h 80 v -80 h -80\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"93ea0802-2ee6-4d04-9930-fdcb16a2ec6e","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 v 80 h 80 v -80 h -80\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"d","code":true},{"type":"formatted","text":" 属性中一切不必要的空格都可以省略，字母与数字之间的空格可以省略，负号前面也可以省去空格"}]},{"type":"code-block","code":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M10,10l0,80 80,0 0-80-80,0\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"015890a4-1462-4b0a-bd17-9c6402c640e3","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M10,10l0,80 80,0 0-80-80,0\" \n        fill=\"none\" stroke=\"gray\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"省略空格是为了减小文件体积，从而减小文件传输时间，但是可读性大大降低，这种事情还是交给 SVG 相关的压缩工具去做，平时还是不要这么写了。"}]}]},{"type":"header","children":[{"type":"formatted","text":"A(a)"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"A(a) 指令用来绘制（椭）圆弧，它需要指定七个值："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"椭圆 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 半径和 "},{"type":"formatted","text":"y","code":true},{"type":"formatted","text":" 半径"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"椭圆 "},{"type":"formatted","text":"x","code":true},{"type":"formatted","text":" 轴倾斜角度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"large-arc-flag","code":true},{"type":"formatted","text":"："},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 表示取小圆弧，1 表示取大圆弧"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"sweep-flag","code":true},{"type":"formatted","text":"："},{"type":"formatted","text":"0","code":true},{"type":"formatted","text":" 表示负角度，"},{"type":"formatted","text":"1","code":true},{"type":"formatted","text":" 表示正角度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"终点坐标 "},{"type":"formatted","text":"(x, y)","code":true}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"半径，倾斜角度以及终点坐标比较好理解，大小圆弧和正负角度可能不太直观。一旦我们确定半径，倾斜角度以及终点坐标后，可能存在四种情况"}]},{"type":"code-block","code":"\u003csvg width=\"200\" height=\"200\" viewBox=\"0 0 200 200\"\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 0 0 100,100\" \n    fill=\"none\" \n    stroke=\"red\" \n    stroke-dasharray=\"5\" \n  /\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 0 1 100,100\" \n    fill=\"none\" \n    stroke=\"green\" \n    stroke-dasharray=\"5\" \n  /\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 1 0 100,100\" \n    fill=\"none\" \n    stroke=\"blue\" \n    stroke-dasharray=\"3\" \n  /\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 1 1 100,100\" \n    fill=\"none\" \n    stroke=\"gray\" \n    stroke-dasharray=\"3\" \n  /\u003e\n  \u003ccircle r=\"3\" cx=\"150\" cy=\"50\" fill-opacity=\"1\" fill=\"#1a66ff\"\u003e\u003c/circle\u003e\n  \u003ccircle r=\"3\" cx=\"100\" cy=\"100\" fill-opacity=\"1\" fill=\"#c81655\"\u003e\u003c/circle\u003e\n\u003c/svg\u003e","language":"html","uuid":"13f17558-57e4-4c50-aa29-b98d541bf751","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"200\" height=\"150\" viewBox=\"0 0 200 150\"\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 0 0 100,100\" \n    fill=\"none\" \n    stroke=\"red\" \n    stroke-dasharray=\"5\" \n  /\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 0 1 100,100\" \n    fill=\"none\" \n    stroke=\"green\" \n    stroke-dasharray=\"5\" \n  /\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 1 0 100,100\" \n    fill=\"none\" \n    stroke=\"blue\" \n    stroke-dasharray=\"3\" \n  /\u003e\n  \u003cpath \n    d=\"M 150,50 A 40,40 0 1 1 100,100\" \n    fill=\"none\" \n    stroke=\"gray\" \n    stroke-dasharray=\"3\" \n  /\u003e\n  \u003ccircle r=\"3\" cx=\"150\" cy=\"50\" fill-opacity=\"1\" fill=\"#1a66ff\"\u003e\u003c/circle\u003e\n  \u003ccircle r=\"3\" cx=\"100\" cy=\"100\" fill-opacity=\"1\" fill=\"#c81655\"\u003e\u003c/circle\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"上面四种颜色的圆弧分别就表示四种情况情况，其中红绿表示小圆弧，蓝黑表示大圆弧；红蓝表示负角度（逆时针），绿黑表示正角度（顺时针）。"}]},{"type":"header","children":[{"type":"formatted","text":"贝塞尔曲线"}],"level":2},{"type":"paragraph","children":[{"type":"formatted","text":"在 SVG 中我们使用贝塞尔曲线来绘制任意的曲线，常见的贝塞尔曲线有二阶贝塞尔曲线和三阶贝塞尔曲线。一条贝塞尔曲线由三部分组成："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"起点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"控制点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"终点"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"二阶贝塞尔曲线有一个控制点，而三阶贝塞尔曲线有两个控制点，因此二阶贝塞尔曲线需要指定两个坐标（控制点坐标和终点坐标，起点不用指定），三阶贝塞尔曲线需要指定三个坐标（两个控制点，一个终点）。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"绘制二阶贝塞尔曲线的指令是 "},{"type":"formatted","text":"Q(q)","code":true}]},{"type":"code-block","code":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 Q 50,50 90,10\" fill=\"none\" stroke=\"gray\" /\u003e\n  \u003ccircle cx=\"10\" cy=\"10\" r=\"3\" fill=\"#ed556a\" /\u003e\n  \u003ccircle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#bc84a8\" /\u003e\n  \u003ccircle cx=\"90\" cy=\"10\" r=\"3\" fill=\"#2486b9\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"b4c90d80-aced-4834-a5d9-d6679b0939d0","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 Q 50,50 90,10\" fill=\"none\" stroke=\"gray\" /\u003e\n  \u003ccircle cx=\"10\" cy=\"10\" r=\"3\" fill=\"#ed556a\" /\u003e\n  \u003ccircle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#bc84a8\" /\u003e\n  \u003ccircle cx=\"90\" cy=\"10\" r=\"3\" fill=\"#2486b9\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"贝塞尔曲线有一个特点，起点与第一个控制点的连线与曲线相切，终点与最后一个控制点的连线与曲线相切（对于任意阶数的贝塞尔曲线均成立）"}]},{"type":"html-block","html":"\u003csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"\u003e\n  \u003cpath d=\"M 10,10 Q 50,50 90,10\" fill=\"none\" stroke=\"gray\" /\u003e\n  \u003ccircle cx=\"10\" cy=\"10\" r=\"3\" fill=\"#ed556a\" /\u003e\n  \u003ccircle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#bc84a8\" /\u003e\n  \u003ccircle cx=\"90\" cy=\"10\" r=\"3\" fill=\"#2486b9\" /\u003e\n  \u003cline x1=\"10\" y1=\"10\" x2=\"50\" y2=\"50\" stroke=\"red\" stroke-dasharray=\"2\" /\u003e\n  \u003cline x1=\"90\" y1=\"10\" x2=\"50\" y2=\"50\" stroke=\"red\" stroke-dasharray=\"2\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用 C(c) 指令来绘制三阶贝塞尔曲线，需要指定两个控制点和一个终点"}]},{"type":"code-block","code":"\u003csvg width=\"200\" height=\"120\" viewBox=\"0 0 200 120\"\u003e\n  \u003cpath d=\"M 10,20 C 50,80 100,10 160 50\" fill=\"none\" stroke=\"gray\" /\u003e\n  \u003ccircle cx=\"10\" cy=\"20\" r=\"3\" fill=\"#ed556a\" /\u003e\n  \u003ccircle cx=\"50\" cy=\"80\" r=\"3\" fill=\"#bc84a8\" /\u003e\n  \u003ccircle cx=\"100\" cy=\"10\" r=\"3\" fill=\"#2486b9\" /\u003e\n  \u003ccircle cx=\"160\" cy=\"50\" r=\"3\" fill=\"#1a66ff\" /\u003e\n\u003c/svg\u003e","language":"html","uuid":"09d4c153-6b5f-44c5-aaff-51f74deea678","children":[{"type":"formatted","text":""}]},{"type":"html-block","html":"\u003csvg width=\"200\" height=\"120\" viewBox=\"0 0 200 120\"\u003e\n  \u003cpath d=\"M 10,20 C 50,80 100,10 160 50\" fill=\"none\" stroke=\"gray\" /\u003e\n  \u003ccircle cx=\"10\" cy=\"20\" r=\"3\" fill=\"#ed556a\" /\u003e\n  \u003ccircle cx=\"50\" cy=\"80\" r=\"3\" fill=\"#bc84a8\" /\u003e\n  \u003ccircle cx=\"100\" cy=\"10\" r=\"3\" fill=\"#2486b9\" /\u003e\n  \u003ccircle cx=\"160\" cy=\"50\" r=\"3\" fill=\"#1a66ff\" /\u003e\n\u003c/svg\u003e","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"SVG","href":"/docs/document/9/76.html"},{"label":"基本概念"},{"label":"基本形状"},{"label":"路径","href":"/docs/document/9/98.html"}],"prevPage":{"title":"多边形","href":"/docs/document/9/86.html"},"nextPage":{"title":"marker","href":"/docs/document/9/99.html"},"createTime":1703641260180,"updateTime":1743303640567,"currentPath":"/docs/document/9/98.html"},"meta":{"type":"doc","publishTime":1764823684225}};
