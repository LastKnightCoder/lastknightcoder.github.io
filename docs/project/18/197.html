tle":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":197,"title":"第十七课：材质与外观","content":[{"type":"paragraph","children":[{"type":"formatted","text":"材质的外观，有不同的材质，在光照下表现出不同的外观，外观是材质和光照作用的结果"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_63531c4e-0b3f-4680-ba79-a12da197ea6f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在图形学中，什么是材质？渲染方程中哪一项是和材质有关的呢？BRDF，材质 = BRDF。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_30fa5920-9d49-4057-a40a-21dc826a4846.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"漫反射材质"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_055e3011-2d6c-48d0-8d6c-4fc39c2d308d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ca8e9b36-b583-458c-a529-e98609b4421c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"漫反射材质的漫反射系数，假设入射光是常数，考虑能量守恒， "},{"type":"inline-math","tex":"L_i = L_o","children":[{"type":"formatted","text":"L_i = L_o"}]},{"type":"formatted","text":"﻿。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"定义反射率 "},{"type":"inline-math","tex":"\\rho \\in [0, 1]","children":[{"type":"formatted","text":"\\rho"}]},{"type":"formatted","text":"﻿"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af25f29c-c9fe-44d2-96d0-9a4e77255e0b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Glossy 反射，抛光的金属"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_55b7f906-0c0e-45d3-a8e3-b99a520cf446.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b047b1aa-ed06-4ea3-9461-8acb82f9f160.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"玻璃，水"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_bed2117f-5145-4f55-8ce5-e644cc223aa5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7b2ecb36-4735-4162-b21b-28a04ab645e5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"完美的镜面反射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1ba84248-5fba-4f9e-9fde-246dc6aa8530.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"写出反射的公式，两种理解方式："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"利用反射定律"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"把角度投影到坐标系（不理解）"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f9944832-71a7-47d4-88bf-6e7ac0ed7dc3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"镜面反射 BRDF 是多少？写出正确的 BRDF 没那么容易。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f016e9bd-1d25-4e3e-9398-5b9b08aa18be.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"折射，当进入新材质的时候光会发生折射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b622a5e5-a1e0-4e3d-af29-45b482fce566.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Snell's Law，斯涅尔定律"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6e467271-d5eb-4506-a631-1a6ba1dda4aa.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"折射定律，如果得不到有意义的实数，折射就不可能发生，全反射，要求 "},{"type":"inline-math","tex":"\\dfrac{\\eta_i}{\\eta_t} > 1","children":[{"type":"formatted","text":"\\frac{\\_eta_i}{\\eta_t} > 1"}]},{"type":"formatted","text":"，入射的介质比折射的介质更密时才有可能发生。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"折射对应的 BRTF，和 BRDF 统称 BSDF。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_89736312-4cad-4be6-87cb-a446066a856b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_497c7d2a-7744-40e8-9686-051968903c33.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"菲涅耳项，不同的视角看过去，有个神奇的问题，垂直的往下看，几乎看不到什么反射，平看，桌子反射书特别明显，有多少光反射，和入射光的角度有关的，通过菲涅耳项可以知道多少发生了反射，多少发生了折射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c18f2b62-2b2c-4b39-934f-6ae928ff3ad8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"举个例子，如果垂直窗子看，可以看到外面，没问题，如果你看前面几排人的窗户，几乎和窗子平行，看到的都是反射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3e5131d5-13ab-4ab8-b2b4-30847c9cc732.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"金属的菲涅耳项"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b57acd0a-68fa-47ed-b2ee-b73b6c173fcc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"菲涅耳项的计算，算起来很麻烦，有一个 Schlick's 的近似算法，拟合的一条曲线，在图形学得到的广泛的应用，只要对材质的要求特别高，是一个很好的近似"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_392ba141-d318-4742-bc75-8396a1df4cee.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"真正的基于物体的材质，微表面材质。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"地球的山、树什么都看不到，说明从远处看看不到细节，微表面模型，基于这种假设，如果离得远，很多东西看不到，看到的是总体的一个效应"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_69ca6638-91dd-4186-a927-6acdd7f33319.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"表面是粗糙的，从远处看，东西是平的，看到的是外观，从近处看，可以看到微表面的细节，看到的是材质，每个微表面都认为是镜面反射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a74ff893-0167-4934-8476-eb5e77bf62d8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"微表面法线形成的一个分布，微表面的粗糙程度使用法线分布表示"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_956d22f7-d305-4b05-ad40-d07a3a3cd7c6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"微表面之间的互相遮挡，比如光线几乎和面平着进来，G 就是用来修正这个"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d6a089bf-3956-4013-a50a-7227b65c3f5f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"微表面模型的例子"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1bc92d83-60e1-447d-a511-40a437bcc589.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"区分材质的方式。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个图是电梯间的内部，电梯间四面八方都是金属，金属是平面，头顶有些小灯，打到金属表现，会形成高光，形成的高光不应该是椭圆吗，怎么看到是这种东西，仔细看材质的话，有一个问题，是被磨过的的金属，这种情况会造成奇怪的高光，这个怎么回事，区分材质一类的方法："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"各项同性材质"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"各项异性材质"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4b3f3808-3afa-43df-abcc-d6d1bbd6887b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"各向同性，微表面不存在方向性，或方向性很弱；各向异性，具有明确的方向性"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_eb629886-b356-47e5-bfa0-451819dcda8a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"各向异性反应在 BRDF 上，在方位角上旋转得到的 BRDF 不同"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d5180da2-50e9-4332-b0e0-add678e33ddd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0954ed2f-c17a-4e40-ac41-b54c598e15d6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"各项同性：分布均匀"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c54f2f9f-4efc-42f9-b920-fea9d970b248.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8fbed783-f9b1-466e-a955-eb16c0397637.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"BRDF 的性质"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"非负性"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"线性"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"可逆性"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"能量守恒"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"各项异性 vs. 各项同性"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"如果是同性，只和相对的方位角有关，四维的 BRDF -> 三维"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"可逆性，相对的方位角不用考虑正负"}]}]}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_31275e8e-128a-4d45-ace9-d26d58e312f5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8396e6b5-9ae1-4643-ba35-84b65796c2e9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5d5730c3-3bc5-4157-9757-eae8748de670.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":
