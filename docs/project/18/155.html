"text":"z-buffer"}],"disableDrag":false}]}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dea5d2a9-c749-4af0-95a3-9e1bba872c64.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dea5d2a9-c749-4af0-95a3-9e1bba872c64.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"深度图示例"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a10defe4-82dc-472c-bda0-ac529e608917.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a10defe4-82dc-472c-bda0-ac529e608917.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"首先认为所有的像素记录的深度都是无限远，遍历所有三角形，光栅化为不同的像素，对于每个像素比较当前深度与记录的深度，取最小"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a082117b-bc7b-4b8e-bd1b-9228433622c6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a082117b-bc7b-4b8e-bd1b-9228433622c6.png","width":720},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e59ea64a-74fe-4a6e-b7fc-eaf13af2dbf3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e59ea64a-74fe-4a6e-b7fc-eaf13af2dbf3.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"Z-Buffer 算法的复杂度，认为三角形不是特别大，覆盖常数个像素，复杂度多少："},{"type":"inline-math","tex":"O(n)","children":[{"type":"formatted","text":"O(n)"}]},{"type":"formatted","text":"。"}],"disableDrag":false},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"假设每个三角形只覆盖 "},{"type":"inline-math","tex":"100","children":[{"type":"formatted","text":"100"}]},{"type":"formatted","text":" 个像素，那么算法复杂度为 "},{"type":"inline-math","tex":"O(100n)","children":[{"type":"formatted","text":"O(100n)"}]},{"type":"formatted","text":"，排序的算法复杂度为 "},{"type":"inline-math","tex":"O(n\\log n)","children":[{"type":"formatted","text":"O(n\\logn)"}]},{"type":"formatted","text":"﻿，一般常数项会忽略掉，所以认为是 "},{"type":"inline-math","tex":"O(100n) = O(n)","children":[{"type":"formatted","text":"O(100n) = O(n)"}]},{"type":"formatted","text":"，但是忽略的前提是 "},{"type":"inline-math","tex":"n \\rightarrow \\infin","children":[{"type":"formatted","text":"n -\u003e \\inf"}]},{"type":"formatted","text":"﻿，实际情况 "},{"type":"inline-math","tex":"n","children":[{"type":"formatted","text":"n"}]},{"type":"formatted","text":" 肯定不会为无穷大，什么时候 "},{"type":"inline-math","tex":"\\log n \u003e 100","children":[{"type":"formatted","text":"\\log n \u003e 100"}]},{"type":"formatted","text":" 呢，"},{"type":"inline-math","tex":"n \u003e 2^{100}","children":[{"type":"formatted","text":"n \u003e 2^{100}"}]},{"type":"formatted","text":"，这是个天文数字，也就是说，其实在这种情况下，"},{"type":"inline-math","tex":"O(n\\log n)","children":[{"type":"formatted","text":"O(n\\log n)"}]},{"type":"formatted","text":" 是由于 "},{"type":"inline-math","tex":"O(100n)","children":[{"type":"formatted","text":"O(100n)"}]},{"type":"formatted","text":"，不能武断的忽略这个常数。"}],"disableDrag":false}]},{"type":"highlight-block","color":"blue","children":[{"type":"paragraph","children":[{"type":"formatted","text":"会存在两个三角形像素深度完全一样的情况吗？概率很低，但是存在，怎么处理呢？"}],"disableDrag":false}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"着色：对不同的物体应用不同的材质。"}],"disableDrag":false},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"我认为的着色就是考虑光照与物体本身颜色的作用，形成人眼看到的颜色。"}],"disableDrag":false}]},{"type":"paragraph","children":[{"type":"formatted","text":"光的观察："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"高光"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"漫反射"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"环境光"}],"disableDrag":false}]}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1185fd1e-c0ba-418a-9b7d-b8050028659d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1185fd1e-c0ba-418a-9b7d-b8050028659d.png"},{"type":"paragraph","children":[{"type":"formatted","text":"定义一些概念，定义的都是方向，是单位向量"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_150cb47a-4a90-42d9-b3ff-23ba31136036.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_150cb47a-4a90-42d9-b3ff-23ba31136036.png"},{"type":"paragraph","children":[{"type":"formatted","text":"着色不考虑其他物体的存在，只考虑自己，没有阴影"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6feaeedc-8aaa-45a5-82bc-7bb2df096772.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6feaeedc-8aaa-45a5-82bc-7bb2df096772.png"},{"type":"paragraph","children":[{"type":"formatted","text":"一根光线打到物体上，会被均匀的反射到各个方向"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4f68e063-a077-48db-8bdf-8ab3079bf9f0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4f68e063-a077-48db-8bdf-8ab3079bf9f0.png"},{"type":"paragraph","children":[{"type":"formatted","text":"物体表面的朝向和光照有一定夹角的时候，得到的明暗是不一样的，从能量的角度考虑，单位面积收到多少能量，Lambert's cosine law，与表面的法线和光线之间夹角的余弦成正比"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_37a14532-a943-496f-a3b7-f235bb5e099c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_37a14532-a943-496f-a3b7-f235bb5e099c.png","width":720},{"type":"paragraph","children":[{"type":"formatted","text":"光的强度与点光源的距离的平方成反比"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b158a24b-764c-4b06-b4cc-8cd98d1380e6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b158a24b-764c-4b06-b4cc-8cd98d1380e6.png"},{"type":"paragraph","children":[{"type":"formatted","text":"结合吸收的能量和反比，漫反射与观察的方向无关"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_93104c74-1979-4797-b63f-4e3ad81a7858.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_93104c74-1979-4797-b63f-4e3ad81a7858.png"},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_aa21d57e-4418-4d07-96c9-a1a08ecc286f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_aa21d57e-4418-4d07-96c9-a1a08ecc286f.png"}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第七课：着色I","href":"/docs/project/18/155.html"}],"prevPage":{"title":"第六课：光栅化II","href":"/docs/project/18/154.html"},"nextPage":{"title":"第八课：着色II","href":"/docs/project/18/156.html"},"createTime":1736948506944,"updateTime":1762959340221,"currentPath":"/docs/project/18/155.html"},"meta":{"type":"doc","publishTime":1764823684197}};
