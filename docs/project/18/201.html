"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":201,"title":"第二十一课：动画与模拟I","content":[{"type":"paragraph","children":[{"type":"formatted","text":"现在有一个问题，运动的物体如何表示？"}]},{"type":"paragraph","children":[{"type":"formatted","text":"动画，让东西动起来"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"交流工具"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"美学"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"动画可以理解为建模，几何的扩展，动画就是在不同的帧有不同的几何形状，把 3D 的模型衍生到了时间的维度上"}]},{"type":"paragraph","children":[{"type":"formatted","text":"视觉暂留的效应，不需要在整个时间范围内非常集中的采样"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"对于电影，每秒钟放 24 张图让人觉得很连贯的动画了"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"打游戏 60 帧，144 帧"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"虚拟现实，让人不晕，帧率必须达到 90 帧"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_14ede5e6-de8d-44f9-a300-6e35c50e0db0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"动画发展历史，早期，壁画"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e1ac3489-eb2f-47f6-91b2-c83f104e6d3f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"圆盘中心旋转，通过一个小窗口看到一块，调整速度就可以看到一个动画"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dcbde94d-91da-489b-9496-12a9a371a115.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一部电影，当做科学研究的设备，渐渐的发展电影业变成了娱乐"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2c0c60d8-e73f-498f-991a-9a1f811d5e75.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一部手绘完整长度（>40分钟）动画，白雪公主和七个小矮人"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cab8fe51-d16e-422b-9f65-c6dc2a9a3869.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"早期计算机本身生成动画"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c41d6959-8dd4-44bd-b83a-af8e014e725e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"侏罗纪公园，当时轰动一时的电影，把电脑生成的恐龙放到了屏幕上"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d519e001-542d-413e-9950-1ea4e970a75e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一部 CG 完整长度电影，整个电影完全都是电脑生成的，玩具总动员，那个时候用的是光栅化的方法"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4a9faf7d-ba0a-4df1-82e6-81ac79f65d3e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"十五年前，动画发展到看上去不错的阶段"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5886697a-d599-461c-8bd4-091d28ff2fb3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"2019 年，冰雪奇缘2，各种特效"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ef3bb7aa-7100-4a26-94da-ad14fa7492c2.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"动画是怎么制作的，关键帧动画，上面一行一个任务在不同时间有不同的动作，下面在两个动作之间补充过度的动作，上面的动作是重要的动作，关键帧"}]},{"type":"paragraph","children":[{"type":"formatted","text":"关键帧动画怎么做的，当时有最厉害的艺术家画出关键帧，助手把过渡帧补充出来"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_93cc68e3-2c14-4b06-ba5c-b94ddc2a5023.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"关键帧的技术，每一帧里面有一些重要的点，把对应关系找到后，插值算出来，"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_68cfeb05-5c50-4d7a-8bb0-c7ac3044ae5b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"插值是一门学问，线性插值是最最简单的，有时候希望更好的连续性，样条函数"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dfd36460-b5f7-4df4-814c-988a4c5ba3ec.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"物体模拟，牛顿定律"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2c3849ec-5678-4ff4-b874-7040b1e8ee36.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"使用数值模拟运动物体的轨迹，如果你模拟的好，不会出现反物理的现象"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4300c439-0af8-4343-bcc0-b0ac1314596c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"质点弹簧系统，是一系列互相连接的质点和弹簧，考虑弹簧是零长度的，胡克定律"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_79d799a8-a9c7-4366-afe8-ce67d2a9022e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"弹簧不是零长度的，问题是会永远的振动下去"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d5d3bcaa-08f7-4eb8-be83-8087156a7a07.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在物理仿真中用的一些记号"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2dd62ac8-2b38-45bf-a570-166c0d31f488.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不希望永远振动，加一个摩擦阻力。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cc365ecc-9c41-4a92-852f-d323dd87ad6a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"带来的问题：会引起所有的运动都会停下来，表示不了弹簧内部的损耗。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"摩擦力做什么事，希望弹簧恢复到正常长度，大小与相对速度有关，相对速度投影在 ab 方向，垂直的方向不会引起弹簧损耗"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c4951571-1e84-4024-83e2-f9ec75c5070c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"弹簧经过组合形成不同的形状，"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fdc3dd2f-e400-4911-bb4e-0a0007dbcb68.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么模拟一块布，问题"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"切变会受影响，布会抵抗切变的力，不影响形状"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"布很难对折成一个平面"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6e825fef-09c9-4e81-9bf9-2f15c3df3de7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"改进切变，加入斜的对角线，但是这个结构不对称，不合理"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9dc46873-9963-44cf-9244-f64a30538bcf.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在加上另外一个方向的对角线，但这个形状无法抵抗非平面的弯曲"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_41ea479a-0def-41bc-943c-f80205bacf68.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"加一个 skip connection，飞线，隔一个连一下，蓝线很强，红线不强，起辅助作用"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_87a27c9b-343f-419b-90de-263c0a493148.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"粒子系统，一堆很小很小的东西，建模的方法也很简单，把一个一个建模出来，分析每一个粒子受到的力，描述出来。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"粒子系统可以用来模拟流体"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"很多很多小水滴组成"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"需要加速结构，比如仅考虑最近的一些粒子的相互作用"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9b8aecd7-13bb-4e12-9256-336e3df655f9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"最最简单的办法："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"动态生成粒子"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"考虑粒子的作用力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"根据作用力更新粒子的位置和速度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"移除消失的例子"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"渲染例子"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"困难在于把例子之间的作用力模拟清楚。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5f6f30fd-6806-41e6-8520-e50e75daa034.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"例子系统之间的作用力："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"引力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"电磁力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"摩擦力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"空气阻力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"碰撞"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"..."}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a3f5d1c1-1de3-4e03-a30b-948dea0c2149.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"万有引力"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d94b4468-39e1-4cab-9105-936ab982c94b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"很大范围内，很小的个体就可以认为是粒子，比如鸟，怎么定义作用关系"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"鸟之间互相吸引，不想脱离"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"鸟之间不愿离得太近"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"朝向一致"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a362a248-4b45-483b-8f76-24d2d4ee7ee1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"运动学，在图形学区分为正向的和反向的，如何做出一种动画，要描述一个骨骼系统，能表示人的骨骼连接"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0ec02bff-04bc-4f13-ba3f-8f8859c93893.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"一个简单的情况，只能在平面内发生旋转，旋转后尖端在哪"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_93f01b03-8afc-41a1-b226-f8cb343ca32a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_180a57df-2bec-4187-82bc-5378ef0beb01.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"运动学的问题，定义的东西都非常的物理，艺术家们可不喜欢"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_72b49c3a-eb0b-4819-99f8-d8aa655368df.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为了让艺术家为了更好的使用，调试，引入了逆运动学，加入可以捏着这个尖端到处移动，自动调节关节位置使得尖端到这个位置"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a1190c93-10f2-40cf-99af-c4c94a5f004c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"解起来式子就非常复杂了"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_71892eeb-ee38-49a5-b554-a3c6f4c7124d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"而且有独特的问题，解并不唯一"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e6aed743-50cd-419f-a046-15c12f7347e5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"解有时不存在"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_985cc3ab-37eb-43b4-83ea-ed56f5ecabc2.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"采用优化方法找到对应位置，典型的优化问题，用梯度下降法"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8c471b71-0112-41ce-9ac2-45337945e02b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Rigging，对于一个形状对于它的控制，给东西添加动作，造型"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Ragging 很难："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"人为努力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"需要美学和技术训练"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2fecf787-5876-4c56-a66d-9bb2f7b4ab8d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外一种方式，考虑人物有两个状态，中间要插值要怎么做，控制点与控制点之间做插值，Blend Shape"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_db02cac1-d7cc-4ddc-a195-03abcb45460a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"真正的给真人添加控制点，真人的动作反应到虚拟的人物上去，建立真实的人物和虚拟的人物的关系，动作捕捉"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3c32d89d-403c-48de-90ff-01c9cfad6026.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"动作捕捉的好处，贴近真实，迅速做出来。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"问题，设置场景比较复杂，捕捉出来的这些动作合理不合理，动画人物动作都比较夸张的，有的时候捕捉条件有限制，捕捉不到好的动作。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e86340f1-174b-41fc-8347-79d9505f4b67.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不止一种定义控制点的方法"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a3ddaa90-afa4-484e-85f8-e94f9cbfe3b8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光学动作捕捉，贴一些 marker，用特别复杂的相机（不止一个）把点测出来"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e9d7c05f-ceca-42d2-87ac-34b06f0f7613.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实际的动作捕捉"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_418fea7a-f890-4241-9158-0e7830cf4321.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"一个 marker 会出现在三维空间中的哪？"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_82327642-17b0-4ecd-8215-513ca179a53e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"面部动画的挑战：恐怖谷效应，人类怕被人工智能统治世界，如果有人用来做坏事情怎么办。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_30ff091f-6901-4932-b66a-d2fc9bce56dc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"技术问题上，阿凡达用了面部的动作捕捉"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a6b993ca-07ef-416a-a815-8d0982c0e2e3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"动画、电影生成过程"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_09af2bec-3da4-4767-84b3-b552a46c87b3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第二十一课：动画与模拟I","href":"/docs/project/18/201.html"}],"prevPage":{"title":"第二十课：光场、颜色与感知","href":"/docs/project/18/200.html"},"nextPage":{"title":"第二十二课：动画与模拟II","href":"/docs/project/18/202.html"},"createTime":1741493482045,"updateTime":1743303640525,"currentPath":"/docs/project/18/201.html"},"meta":{"type":"doc","publishTime":1764821904219}};
