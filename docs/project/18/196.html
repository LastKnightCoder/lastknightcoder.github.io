":[{"type":"formatted","text":"哪些地方不对？Whitted Style 光线追踪对于 Glossy 的材质不对。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_eb3307bb-ae52-46b8-b3be-28966f80deae.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Whitted Style 在漫反射和漫反射之间的光线考虑不到"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_62734277-2a26-4611-aee8-ec2a3383196e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么解决？Whitted Style 是错的，渲染方程是对的，但是它包含两个问题："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"解决在半球上的积分"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"递归求解"}],"disableDrag":false}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a2b86d50-8feb-4370-841b-7018edfad81e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"用蒙特卡罗积分求解积分，先考虑一个像素的直接光照"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_11d86244-d548-4d03-8cb6-fcaf2e5a5380.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_40b906ea-5744-439d-81e1-a667a19e0d71.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f66aef3c-f1a0-428c-a2aa-15893cf66bfb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d550f515-044b-4532-a4a8-a4174580408c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"着色算法"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6f20c1c0-c10b-45df-9040-4e09a6168756.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑间接光照，从 Q 点反射到 P 反射了多少光照，就好必我们从 P 点观察 Q 点反射了多少光照一样"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d39379f2-2fee-401f-8bff-d1bc748ce908.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在原算法加上一个分支，如果命中了物体，递归计算物体反射的光照"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ef0ff74e-9223-481f-b3cc-72a9173a8756.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"问题是否就解决了，答案是没有。问题在哪？"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"第一个问题，这种方式打出光线，光线的数量会爆炸，N = 多少时，光线不会爆炸，N = 1。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"用一根光线解决这个问题，这就叫做路径追踪，（N != 1 就是分布式光线追踪，很少提这个）"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6f225c56-7c5f-463e-b41e-86f1e56892a1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6f2e8806-9c3b-4275-82d5-27242b91cf60.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"N = 1，结果很 noisy，用足够多的 path"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d04761d0-acd4-4d98-bed8-326e7c0845d6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在像素内均匀取 N 个位置，对任意选取的位置，连一根光线"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_bc354a93-a870-470a-a976-6d78600bc1b0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"问题2：没有完全终止的条件，无限反射，两个物体之间互相反射"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"而限制反射次数，损失了能量"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7dd84742-b1ac-438c-a4d5-3d11e6aa5669.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f23e84b1-f799-4fac-88c1-388c9fc1973e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_53a9f0fd-bfb1-425b-bce0-45f13dbe7c7c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么办？引入了俄罗斯轮盘赌，P 的概率生存，1 - P 的概率挂掉，以一定的概率停止往下追踪"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b59378d9-14a4-435f-a869-6913113e9505.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"之前得到的着色结果是 Lo，希望可以停止但是能量不衰减"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"以一定的概率 p 打出一条光线，得到的结果是 Lo / p，1 - p 的概率不打出光线，得到的结果是 0，最终的期望"}],"disableDrag":false},{"type":"block-math","tex":"E = p *\\frac{L_o}{p} + (1 - p) * 0 = L_o","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_05f9fe5c-439d-4282-a1aa-7bc420ba5cff.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑到代码上，一点小改动"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ac8e14ae-93ab-47a5-af1b-06acacf64b2a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有一个小问题，他不是多么高效，SPP（每像素采样），Low SPP 效果很 noisy，希望在 low SPP 下也很好"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_14602a5f-0b9f-4a5d-a3da-b2527b97f571.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"均匀的往四面八方采样，有很多的光线浪费掉了"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_414e46aa-9c0c-4505-927e-ea6545094361.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"蒙特卡罗允许指定采样的概率分布，如果只在光源上进行采样，效率就很高，但是渲染方程是定义在着色点上的，对着色点的立体角积分，数学上转换为在光源上的积分"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1b1528f1-e57d-44a1-b4ee-0628887314d0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"dw 和 dA 的关系"}],"disableDrag":false},{"type":"block-math","tex":"\\text{d}w = \\frac{\\text{d}A \\cos \\theta^{'}}{|| x - x^{'} ||^{2}}","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_56a3a216-d2b5-4f28-8950-a9fdf3dbc7e1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"重写渲染方程"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_64964172-c7a9-41d2-a3b8-2718e46a7896.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"typ
