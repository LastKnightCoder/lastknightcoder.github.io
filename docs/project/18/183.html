aragraph","children":[{"type":"formatted","text":"Loop Subdivision（和循环没关系，发明这个细分方法的哥们的 family name 就是 loop）拆分和调整三角形位置，区分新的顶点和老的顶点，不同的顶点用不同的规则改变三角形的位置"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d35f2cf7-bd14-4894-a5a6-47871f4ca87a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"更新新的顶点的位置，新的顶点一定在边上，只要不是边界，就会被两个三角形共享"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_307e20c6-0cc7-4de0-9639-1e05f576bf6d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于旧的顶点，一部分相信相邻的老的顶点的平均值，另一部分相信自己"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"定义："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"n，这个顶点的度，这个顶点连接的边的数量"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"u，考虑到和这个度有关的一个数"}],"disableDrag":false}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9676ca31-56a0-4f9a-9132-b4a5a6d09224.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Loop 细分的结果"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d12c58f4-bd0c-407b-b6db-c2c514c91abc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Catmull-Clark 细分，Loop 细分假设了是三角形网格，Catmull 处理一般的情况。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"定义一些概念"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"四边形面和非四边形面"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"奇异点：度不为 4 的点"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"每一个面取中点，每一条线也取中点，然后把他们连起来"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_477201dc-19c8-489e-ad5f-267525a32f00.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"经过一次细分后："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"还有多少奇异点，4"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"现在奇异点的度是多少"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"海剩多少非四边形边，没有了"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"细分之前，有多少个非四边形面，在一次细分后，就会有有多少个奇异点数，一次细分后，没有非四边形面了，这就意味着再次细分奇异点数不可能在增加了"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_276a3dde-6c2e-407e-9705-e957f6bce116.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"再次细分"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d9bc302c-9f09-46ee-8119-5657b46b454e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b83c039d-553c-44f1-a632-46bdc37f88bb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"点的调整，把点区分为三类"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在面中间的新的点"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在边的中心新的点"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"以前的老的点"}],"disableDrag":false}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7a011cb7-5606-4dfd-9f47-29dda5a6aeb3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"细分结果"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e7a5692d-3abf-48bf-973a-db7fd8d6c724.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"曲面简化，点太多了，减少点提升下性能，比如离得远了，点少点看起来也不错"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3495ddac-207c-467b-b8be-57cc4ce16097.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"边坍缩"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e9bae8f4-6dac-47c0-afb8-43670623b5a9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我要坍缩哪些边？二次误差度量。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_350e69bb-b216-4e83-97fb-002c7cc7a981.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何坍缩这些边，假设坍缩这条边，得到的二次误差是多少，然后从最小的坍缩，然后坍缩第二小的 ..."}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1eb9f9eb-3d38-4811-84ba-ec205c1d5f63.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"坍缩一条边之后，其他边会跟着变化，他们的二次度量误差不得重新算吗？"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"优先队列（堆），动态更新。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"这么做到底对不对，我希望找的是全局上最优的做法，但是我们在局部上做，贪心算法。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b67cf4bb-c455-405a-acec-318934fc97c8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实际操作"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_adc57068-02ce-4855-9bca-2fa70baf74c4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在光栅化里面是怎么生产阴影的，Shadow mapping!"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3947cefb-b11f-4b23-8ab3-4b25dd249bfc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"用了 Shadow Mapping，在生成阴影时是不需要知道几何信息的，问题是会产生走样现象。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"最重要的思想就是，点不在阴影里，又能看到这个点，说明可以在摄像机看到这个点，并且光源也可以看到这个点，如果在阴影里，你看的到这个点，但是光看不到这个点。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_59a350aa-a955-4310-936b-0e36ede16810.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"处理点光源或方向光源下生产阴影。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"第一，从光源看像场景，光源会看到什么，记录看到的任何点的深度是多少"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2245925a-9f68-42fd-af1a-ea5e4bbd13aa.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从摄像机出发再次看向场景"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_339c3cb2-e698-4e56-8f2f-81cd49c07eba.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"把看到的点投影回光源的成像平面上，比较深度，深度一致，说明点可以被光源看到"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ddd1b75e-42ac-4164-a244-bd4a0c3347a0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"否则就说明被挡住了"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0ca43568-9349-46f3-9465-ed79308af4c8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"例子"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4d1db866-03c2-472f-aa62-13a177d6b3a0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7631b0b6-7cf5-46fe-984c-3379c9a165ff.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光源视角"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_81fad903-ed4a-4043-8bf4-8805aeacb283.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ea883f76-e75c-4d14-b7c0-056ac8e502ad.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"结果有点脏，比较深度是否相等
