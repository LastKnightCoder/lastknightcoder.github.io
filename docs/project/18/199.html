    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"3D 学习","children":[{"title":"GAMES 101","children":[{"title":"第一课：总览","href":"/docs/project/18/146.html"},{"title":"第二课：线性代数","href":"/docs/project/18/145.html"},{"title":"第三课：变换I","href":"/docs/project/18/150.html"},{"title":"第四课：变换II","href":"/docs/project/18/151.html"},{"title":"第五课：光栅化I","href":"/docs/project/18/152.html"},{"title":"第六课：光栅化II","href":"/docs/project/18/154.html"},{"title":"第七课：着色I","href":"/docs/project/18/155.html"},{"title":"第八课：着色II","href":"/docs/project/18/156.html"},{"title":"第九课：着色III","href":"/docs/project/18/157.html"},{"title":"第十课：几何I","href":"/docs/project/18/159.html"},{"title":"第十一课：几何II","href":"/docs/project/18/171.html"},{"title":"第十二课：几何III","href":"/docs/project/18/183.html"},{"title":"第十三课：光线追踪I","href":"/docs/project/18/184.html"},{"title":"第十四课：光线追踪II","href":"/docs/project/18/193.html"},{"title":"第十五课：光线追踪III","href":"/docs/project/18/195.html"},{"title":"第十六课：光线追踪IV","href":"/docs/project/18/196.html"},{"title":"第十七课：材质与外观","href":"/docs/project/18/197.html"},{"title":"第十八课：高级光线传播与复杂外观建模","href":"/docs/project/18/198.html"},{"title":"第十九课：相机与透镜","href":"/docs/project/18/199.html"},{"title":"第二十课：光场、颜色与感知","href":"/docs/project/18/200.html"},{"title":"第二十一课：动画与模拟I","href":"/docs/project/18/201.html"},{"title":"第二十二课：动画与模拟II","href":"/docs/project/18/202.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project","active":true},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":199,"title":"第十九课：相机与透镜","content":[{"type":"paragraph","children":[{"type":"formatted","text":"图形学成像方法："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光栅化"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光线追踪"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"都是合成方法成像，还可以通过捕捉方法成像，比如相机拍照成照片。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"光传播是有时间的，限制光在极其微小的时间内能看到的东西，可以看到光传播的过程，计算摄影学。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"相机背后到底是什么？相机的截面图，镜头，棱镜，机身，感光元件。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_90616fa2-a793-4120-b4e2-c4a8d18bdb70.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"最早的时候，从小孔成像开始，有对应相机的，针孔相机，最常见的是带棱镜的相机"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a2fd7b43-4635-42b0-b5ec-b20c91189576.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"去掉了镜头的相机，控制光进去的部件，快门（Shutter），在多少分之一秒内光进入相机"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0593eba1-3473-4bcf-adcd-985600a814a6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光进入相机后被捕捉到，什么东西捕捉光线并记下来，传感器，记录的是什么，记录是 irradiance"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4f7355a7-aaee-48ca-9211-f0e2b468fcfc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果相机没有棱镜、没有针孔，还能拍上照吗？这是不可能的，每个像素收集的都是 irradiance，无法区分方向。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"目前在研究一些传感器分开记录不同方向的光，未来有可能。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d508fbbc-ec9f-4265-bca1-17cc9ac94020.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"针孔相机，公元前就发现小孔成像的原理"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c5783a85-baa2-4a3b-8b91-9a45a3b73ad0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"直到今天都可以利用针孔拍照，针孔相机拍出来的东西是没有深度可言的，没有虚化的东西，看到的都是锐利的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"做光线追踪的时候用的就是针孔相机的模型。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e655dfb4-2da9-43fa-9501-d645eccd6d1f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d90b3250-116f-4632-8e1e-659a596772cf.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"视场 FOV，可以看到多大的范围，广角 -> FOV 大，什么因素决定视场，焦距和传感器大小"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1b39376c-a38d-414f-afa9-ebc290dd9752.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同的视场决定不同的拍照结果，通过焦距和传感器大小这样定义视场不太好定义，以 35mm 的胶片为基准，通过定义焦距的方式定义视场。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在手机上可能会说焦距有 28mm，手机厚度不到 1cm，怎么焦距有 28mm，因为手机的传感器大小不是 35mm，这是换算过去等效的焦距。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c090dbcc-97a1-47e2-8bcb-e77624afdae4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同角度的镜头，同一地方拍的，不同的视场"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2f3db66c-54d2-4ca9-8c2f-3edec2c74159.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果能改变传感器的大小，小的传感器对应小的视场"}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在混淆使用了两个概念，传感器的胶片，这两个不一定一样，平常认为是一回事，认为传感器接收到的图像就是最终成像的图像，但是对于渲染器来说，传感器负责记录收到的 irradiance，最后胶片负责存成什么样的格式"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_11a8ad32-07df-44b7-9981-a13683ce3685.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"传感器的的不同大小，所以相机价格不相同，好的相机都是大的相机"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_348aeba4-8c0b-4190-bfb2-48e17635491b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在小的传感器上怎么维持视场，把焦距变小"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6d29eabf-db8e-4be0-aa08-4d7900c0d4f3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"曝光是什么？H = T * E，time ✖️ irradiance，亮度由进来多少光，一个是进来多长时间，累计起来就可以得到曝光"}]},{"type":"paragraph","children":[{"type":"formatted","text":"曝光时间由快门决定。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"irradiance 由相机的什么因素决定："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光圈大小"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a6d37d54-d486-4044-90c0-a3e8043922c3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"相机里面有哪些因素影响拍出来亮还是不亮呢？"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光圈大小，由 f-stop 控制，光圈是一个仿生学设计，仿照人的瞳孔，在比较暗的时候，瞳孔会放大，这样会接受到更多的光，可以看清楚更多东西，在亮的时候瞳孔会缩小，不让更多光进来灼烧视网膜"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"快门速度，快门开放的时间，时间越短，更少的光进来"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"感光度，ISO 增益，最简单的理解，ISO 是一个后期处理，当感光元件已经感知到了光，觉得太暗，可以增大光度，这个乘可以发生在硬件上，调节灵敏度"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7cbe1a0a-d450-4800-a77b-c4941c85218b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"说明了各种现象"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"不同光圈大小"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"f 数越大，光圈越小，欧洲写法，把点号写成逗号"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光圈大，就很虚，光圈小，就很锐利"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"shutter speed，用一个分数表示，相机开放时间"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"快门时间短，可以看的清楚，时间长，变模糊"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"ISO，可以理解简单的线性往上乘"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"任何信号都有噪声，对信号乘一个数，会放大信号，但同样会放大噪声，如果在很暗的房间，用来很小的光圈和很快的快门时间，用了一个很大的 ISO 把亮度拉大，但是结果会很 noise，正常情况大家不愿意调节他得到一个更亮的图，在一定的小范围条行，大了一定有噪声"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"为什么有噪声，简单看，把光认为是光子，如果快门时间不够，进入感光元件光子不够，结果就是 noisy"}]}]}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3369e8c9-aaaf-4b3c-9262-694cd2ddf327.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"ISO 就是简单的线性的乘一下"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_db1a3bf5-e8b1-4edd-bc2e-765e62e948e9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"控制其他变量，越来越暗，通过 ISO 调回来亮度，可以看到 ISO 越大噪声越明显"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_123b109b-cb58-4428-bde4-48adb9d5a27c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"F-Number（F-Stop），F 数的两种写法"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"F"},{"type":"formatted","text":"N","color":"#e33a32","darkColor":"#fa7873"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"F/"},{"type":"formatted","text":"N","color":"#e33a32","darkColor":"#fa7873"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"简单理解，F 数是什么，非正式理解，F 数就是光圈的直径分之一，N 越大光圈越小"}]},{"type":"paragraph","children":[{"type":"formatted","text":"调光圈可以得到固定时间内进入的能量"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1c377feb-6e92-429f-88e8-bd48e95c0512.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"快门是怎么控制的呢？一开始关闭的，然后升上去，快门突然打开，然后关上。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但我们关心的完全关闭到突然打开，虽说是突然，但是有一个过程的，这个过程会造成什么影响？"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果快门时间长，为什么小人就模糊了，这个就叫做运动模糊，运动模糊是怎么回事，在快门打开的这段时间内，物体发生了移动，中间的过程都会被记下来，传感器平均了一下，就模糊了。"}]},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"目前说的是机械式快门。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"反过来讲，快门时间不变，物体运动越快，越容易出现运动模糊，手抖会出现运动模糊，所以为什么拍照要保持稳定。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c850513b-4f24-4871-9a8a-c625dfc3e89e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"用更短的快门时间，运动模糊会减轻"}]},{"type":"paragraph","children":[{"type":"formatted","text":"运动模糊一定是坏事吗，比如赛车，如果没有运动模糊，就会觉得赛车很慢，作图就很快，右边感觉是摆拍。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"运动模糊是怎么来的，在不同的时间对物体进行了一个采样，反走样，引入了一定的模糊，在时间上采样，如果有运动模糊的话，有一个反走样的效果。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a29091fc-3da7-4a3e-8c02-bffde89dddf4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"快门打开需要时间，如果物体运动速度快，就会出现问题，Rolling shutter，对于高速运动的东西会造成扭曲（螺旋桨），记录的是不同时间进入的光。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fb09bee6-7d0d-4f8f-89cf-ca1d34afb4cb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"和光圈在一块考虑，快门时间短，就会暗，怎么办，提高光圈大小，用更小的 f 数"}]},{"type":"paragraph","children":[{"type":"formatted","text":"下面表格可以打到基本相同的亮度。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"是不是说排出的照片是一模一样呢，大光圈会引起浅景深的问题，正常情况下是需要权衡的。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0301657b-4377-47b1-b099-6b122ff4223c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"高速摄影，每秒钟拍更多帧数，然后按正常帧数放，那么留给快门的时间就非常短，要保证每一帧看的见，用更大的光圈和 ISO，ISO 大家不习惯，所以就用更大的光圈。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6bab4cc5-cb78-4d9d-a989-d1f8dfb7a7de.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"超低速摄影，延迟摄影，给特别长的曝光时间，给小光圈，拉丝"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a4a6ce28-749d-4760-bb8b-4c9a11e4ace8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8b0ee349-1f3e-44ad-af74-3916b2b45e8f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于真正的镜头，非常非常的复杂，现在相机都不会用单个棱镜做，用棱镜组，真正的棱镜很复杂，用一个简单的棱镜来描述"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_42cb13e8-1c40-4a97-a993-8d4df77dd2e8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"真实棱镜，没法把光线聚集到一起"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f6cff474-2d2f-4823-8add-7cd45bcee517.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"我们研究的是理想化的薄棱镜"}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"所有的平行光经过棱镜会经过焦点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"所有经过焦点的光线经过棱镜后会变为平行"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"焦距大小可以被任意改变（在现实，用棱镜组的组合就好像随意改变等价的一个薄棱镜的焦距）"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_aaf942d5-5a73-4cf0-bc64-bccb3eae76ee.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"棱镜满足的基本的物理规律，高斯薄棱镜公式。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"任何一个方向光线穿过棱镜中心，方向不会发生改变。定义两个距离，物距 "},{"type":"inline-math","tex":"z_o","children":[{"type":"formatted","text":"z_o"}]},{"type":"formatted","text":"，像距 "},{"type":"inline-math","tex":"z_i","children":[{"type":"formatted","text":"z_i"}]},{"type":"formatted","text":"，焦距 "},{"type":"inline-math","tex":"f","children":[{"type":"formatted","text":"f"}]},{"type":"formatted","text":"，满足的性质"}]},{"type":"block-math","tex":"\\frac{1}{f} = \\frac{1}{z_i} + \\frac{1}{z_o}","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对棱镜来说，如果改变物距，像距一定跟着改。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5b395b21-9d07-4f96-8629-ee2f931988a8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"推导物距、像距、焦距的关系，满足的几何关系，两个相似三角形"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9e4851b3-d1ec-4176-b142-488b33b7d541.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b050ce9a-19ff-41d6-abb6-99c7ea4d2af1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"景深问题，引入一个概念，Circle of Confusion(CoC)，指成像系统中，一个理想点光源因未完全聚焦而扩散成的圆形模糊光斑，CoC 和棱镜大小成正比"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af17c984-72cc-4cea-99f3-0e60ec7e67ae.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这就告诉我们，看到的东西模糊不模糊，取决于光圈的大小"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a9879a5e-b91d-4575-bff9-3b66cc7912a1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"精准定义 f 数，是焦距除以光圈的直径"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3ebfca59-0d91-4953-9685-05d4485e1820.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于不同的相机，可以直接求 f 数"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2a37cb87-a855-4f17-988c-9f69bccc1026.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"CoC 和 f 数是有反比关系的"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_49381d5e-3cf7-4a9d-ac94-b4f7620b4da7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"薄棱镜的光线追踪"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_22bc9efb-1c3f-43e9-a087-7ed7d2cd73f3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么做，定义场景"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"确定传感器大小，焦距和光圈大小"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"确定物距 "},{"type":"inline-math","tex":"z_o","children":[{"type":"formatted","text":"z_o"}]},{"type":"formatted","text":"﻿"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"计算像距"}]}]}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"渲染："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"对传感器上的每一个像素"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"从透镜上随机选一个点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"可以知道通过透镜后打到的点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"只用考虑这条线的 Radiance"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_da84c683-0a82-4388-acee-95d831c0c47f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_57b5749a-5d5d-4c7b-b2d5-348863d8c3ec.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"景深，大光圈和小光圈会影响模糊的范围，大小光圈会影响这个范围"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_df130940-8e39-48c8-9823-4f63f724b963.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"景深就是在实际场景中有一段深度，这段深度经过透镜后会在成像平面的形成一段区域，这段区域认为 CoC 足够小，和像素大小差不多，或者比像素小。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e2e1beca-69a8-4609-9e0a-d53c42685a3d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑景深的最远处和最近处，一顿推导"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3d9ea335-436b-445d-a8b4-2a87b7f5b809.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第十九课：相机与透镜","href":"/docs/project/18/199.html"}],"prevPage":{"title":"第十八课：高级光线传播与复杂外观建模","href":"/docs/project/18/198.html"},"nextPage":{"title":"第二十课：光场、颜色与感知","href":"/docs/project/18/200.html"},"createTime":1741430565872,"updateTime":1744963825139,"currentPath":"/docs/project/18/199.html"},"meta":{"type":"doc","publishTime":1764775995426}};
