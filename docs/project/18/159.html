tle":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":159,"title":"第十课：几何I","content":[{"type":"paragraph","children":[{"type":"formatted","text":"纹理的应用，环境光照。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"纹理其他的应用，纹理就是一块内存，可以对这块内存进行范围查询，滤波。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_94290678-2a64-414d-bbf3-05065fc92e05.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"环境映射，任何方向都有光，把光记录下来 -> 环境光照，用纹理描述整个环境光长什么样，纹理可以用来表示环境光"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0c907ac5-e9d6-492a-bb56-76c2e3031792.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9c90f5d5-8971-4bac-802b-82d5979190ed.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"把不同的环境光记录在球面上，并且展开，问题，扭曲问题，不是均匀的描述"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_94665e60-b110-481c-949b-dfe72ad10b05.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_403631cb-14cb-480d-9485-37f8da085c5c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"球有一个立方体包围盒"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_64fe5572-f74f-46f3-b953-a4780fd94550.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_942f05de-02b7-44dd-b7ac-947c726328e6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"凹凸贴图，纹理不仅可以替换颜色，可以定义任意不同位置，任意不同的属性，不把几何形体变复杂的情况，利用复杂的纹理定义任何一个点相对的高度，相对的高度发生变化，法线就会发生变化，着色就会发生变化"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e2f7fd29-ec1e-419f-b356-df71cd7aec95.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"法线贴图做了什么事,定义了复杂的纹理,但不改变几何信息,把任何一个像素的法线做一个扰动,通过定义不同位置的高度,邻近的高度差重新计算法线"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_54007ae3-b8d9-4d9d-9b86-b0341d8292f1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何计算法线如何变化,可以求得切线,如何求得法线呢,把切线逆时针旋转 90°"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2739aadb-8816-4a0b-ab33-3facfea7d9a8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ef1bff2d-040d-49c1-9803-f4771bde4932.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"位移贴图，凹凸和位移都是用一个纹理定义一个点的相对高度，输入完全一样，位移贴图实际上会把三角形的顶点、面"},{"type":"formatted","text":"真的做一个位移","bold":true},{"type":"formatted","text":",从而改变法线。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"位移贴图的效果更好，但是有代价，要求三角形足够密，模型要能跟得上纹理的变化速度"}]},{"type":"paragraph","children":[{"type":"formatted","text":"DirectX，动态切面细分，根据需要细分。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_279926c8-31a2-4091-b8d4-47431eea5603.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"三维的纹理，把球砍一半可以看到内部是什么，没有真的纹理的图，使用的噪声"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7ec0adc5-5947-44e3-99ea-71d9be357a2b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"纹理还可以记录之前算好的信息。怎么计算阴影（左侧和右侧对比，右侧阴影），可以实时算，环境光遮蔽，但是我们可以先计算好，放到纹理中，这样就非常快，把一些计算放在之前做"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b430e76e-e46d-4fe4-9335-41c20a11fee7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"目标：几何的例子，几何的表示方法。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9f163387-f294-4004-abe6-7541eb98a69b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"车子的曲面。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6979448d-ea77-4026-8c6c-77fbf763de43.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"发动机的齿轮"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a78e1afe-ee5b-40e5-86d0-0352edf2dc71.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"衣服布料，不是简单的曲面，因为是透明的，很复杂"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d6f2365d-2855-4acd-9116-ef0c202990b5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"水滴"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_49522bef-2a7f-47e0-8ab7-4689a2d4f82b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"城市，复杂在东西多，这么多几何怎么存储，怎么渲染这么大的几何的量"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_10df7ac2-cd70-45dd-baef-91fbe034d8cd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"羊毛，一股毛发都非常复杂，毛发如何表示，如果表述为三角形、面那还得了"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f47554ce-a783-4d22-8ef0-95f4a989b31d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"近距离，细胞、蛋白质"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_58a6dd58-98aa-4c87-8763-fe72d92c533a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"树，树枝，树干"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a4217f6d-8d53-4093-b07e-46f00e536d3e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对几何进行归类："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"隐式的几何"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"显式的几何"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e995ea75-cb65-40b5-a875-d3d200bcafa0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"什么叫隐式，不会告诉点具体在哪，会告诉满足什么关系（函数），给任一个点，都可以告诉你是否在曲面上"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5102e69f-aaaa-414b-b37b-592d5ecffe46.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"问题，哪些点满足这个式子，很难回答，整个的形状是什么"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_61f65a2d-3c7c-4b4c-a26b-b8dece3af0e7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"好处，判断一个点是否在不在这个面上，是否在物体内、物体外，非常简单"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_db3cef34-2c69-4e5f-867f-38283a5f411d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"显式的表达方法，直接给出所有点或者参数映射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f7a4ecf9-fb47-47a4-96ab-e24369311837.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"参数映射的例子"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4fa2e8ae-a1bb-4f6e-b4b9-e95fb71c7b4d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"显式表示的问题，判断一个点在内还是在外很困难"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_23358ebd-ad2a-4fd9-83ab-ca37f93ac877.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么用不同的表示方法，有些问题适合隐式，有些适合显式。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"没有完美的办法解决几何问题，几何很难，最好的表示方法取决于任务"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_aee2f9ed-597f-4f95-a4da-ad47565d5d72.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"隐式的表示方法还有哪些种"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a53decac-9ddd-4563-8d4f-dc6a272307d0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"最最直接的，数学公式，问题是不直观，对于复杂的形状很难表示"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d3fc5a7b-1522-417c-98f7-f0474c11d6ca.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"CSG，通过一系列基本几何的基本运算，有非常广泛的应用"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8a3f778d-47d4-48fe-820a-6e0874e387a4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"定义一个距离函数的东西表示几何，对于任何几何，我都不去描述曲面，而是描述空间中的每个点到该曲面的最短距离来进行表示，这个距离可以是正的也可以是负的，在外部为正，内部为负。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"距离函数为 0 的地方就是物体的表面。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_928fc837-1d92-46ed-9415-945ad404fc0d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"假设 A 有一个物体挡住了视口的 1/3，B 有一个物体挡住了 2/3，希望求出在移动过程中的中间状态"}]},{"type":"highlight-block","color":"blue","children":[{"type":"paragraph","children":[{"type":"formatted","text":"感觉有点像傅里叶变换的频域表示法。"}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_434941f5-c596-4f1d-b8e5-19a95d8d151c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1a218849-0886-48da-88d1-67dbf6bf8e03.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"距离函数不太好写成解析的形式，能够通过某种方法表示出来就可以，水平集，函数写在格子上的"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_48ebe7cf-c20f-48b4-8e76-776496dac1a8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"分形，自相似"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c27b79c5-e575-47a3-a328-5a681fc4a930.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"总结，隐式函数："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"优点"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"表示很容易，一个公式就可以表示一个形状"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"不是特别明显的方式定义的"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"容易判断在里面还是在外面"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"容易进行光线求交"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"... ..."}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"缺点"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"很难表示复杂的形状"}]}]}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cead32cc-46a3-4bd1-a74d-c38a8e441af7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"file-attachment","uuid":"850dd49d-9628-4cd0-ba19-59fef8a965bc","filePath":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/GAMES101_Lecture_10_f104130f-5ba9-4fde-9397-54d66e5f369d.pdf","fileName":"GAMES101_Lec
