"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":193,"title":"第十四课：光线追踪II","content":[{"type":"paragraph","children":[{"type":"formatted","text":"如何使用 AABB 加速光线追踪："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"均匀格子"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"空间划分"}]}]}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"先考虑和盒子求交，在考虑是否和里面的物体求交"}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"找到包围盒"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在做光线追踪之前，把盒子分为一堆格子"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"判定哪些格子里面可能有物体"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"开始做光线追踪"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么知道光线会打到哪个格子，最简单的办法，光线往右上方打，下一个格子要么往上，要么往右（实际上不会这么做）。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个加速的能力来自于多与盒子做求交，少于物体做求交。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1e854c01-262c-4ca0-8612-4799509bc01a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dced79de-cb38-4cb1-8aa4-1ce73863c03c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_29ac3c07-4cd9-429e-81fa-3f4f553addf0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a65c16d1-7fa7-4c2a-942e-ed7f561dab19.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个加速效果怎么样？考虑划分为 1*1，效率就下来了，如果划分的太密，效率就下来了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"平衡，一个经验数"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c50782ba-315e-4ccf-bc4f-0de10a370fb5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b220c9fe-fcd4-4ce0-b245-c3cac426383b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0170c162-a9b1-4ad2-9ab6-c3cec3f58335.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"什么时候效果比较好呢？各个地方都有些物体，分布比较均匀。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_846bd077-4a8a-4f4c-b414-28bec7ee72ac.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个就不太好，比较空，物体的分布不均匀，在运动场里面中间放了一个茶壶，不适合均匀的格子方法。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7b37eef1-8b9f-4814-a99b-2c295c844690.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"空间划分是什么意思，格子的不足之处，格子大小个数都是相同的，格子在稀疏的地方是不是不用同样大小的格子，在空气的地方用一个比较大的格子，在物体密集的地方使用小的格子。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"空间划分结构："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Oct-Tree：八叉树，一个节点有八个子节点，把整个场景想办法包起来，然后把这个包围盒切成八份，为什么是八份，三维情况，三刀下去就是八份，每块继续切，切到什么程度呢，取决于不同的标准，差不里面有足够少的物体"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是人们不喜欢，在高纬度会变成 2^n 的树"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"KD-Tree：空间可以很好划分，和维度没关系，和八叉树基本相同，每次找到格子总是沿着一个轴砍开，二叉树，每次分成两个叉"}]},{"type":"paragraph","children":[{"type":"formatted","text":"横竖交替划分，可以保证空间基本是均匀的划分方式，只沿着一个方向，会越来越窄，不太好"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"BSP-Tree：对空间二分的方法，每一次选一个方向，把节点给砍开，和 KD-Tree 的区别就是不是横平竖直砍的，在纬度高的时候，越来越不好计算"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"这节课主要讲 KD-Tree。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_085cea8b-dd05-4e5e-884d-888243ba2e4b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"KD-Tree 的例子，它的构造在做光线追踪之前。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_da024574-393c-44eb-b7aa-772e522f2ccf.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"数据结构。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"中间节点存储的信息："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"划分的轴"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"划分的位置"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"孩子节点"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"叶子节点存储的信息："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"和格子相交的几何形体"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_24ff4a48-5675-4b52-abc2-75656991559b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这个结构如何帮助做光线追踪的加速，假设有个光线，和盒子 A 有交点，那就说明有可能和盒子的左边和右边两个子节点都有交集，继续看下去和子节点是不是也有交点，直到找到叶子节点的交点。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c52db1fc-ff37-424f-97ba-1331f5e3b2f4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2a1b85f0-04f5-4735-a907-cf00e50ae2ce.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_71af2a1a-f784-40ca-bf0c-ee2e4d5a5b99.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a622e28f-ae7d-4371-9218-2af0de024cb6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7ba3ff51-02d0-436b-a454-41e9e5ae2437.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_db59e857-419e-463d-8af0-69e27ef610c0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_77e45a15-1063-4946-b059-bdc7c3e3fefd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1cf506cd-ae3f-47d8-9540-507f03eb616e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么判定一个物体和包围盒是否相交？这些很难判定，对于 KD-Tree 有个明确的问题，给你一个节点，我得知道和哪些三角形有交集，这是一个非常难的事情，很难解对。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"举个例子，三角形三个顶点都不在盒子里，但是是相交的，盒子插入在三角形里面。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"最近 10 年内，大家渐渐不同 KD-Tree 了，这是一个原因。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外一个问题，一个物体和很多 AABB 都有交集，在多个叶子节点都要存这个物体，这个性质不怎么好。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外一种办法，也可以划分，不是从空间做起，而是从物体做起，Object Partitions，这种划分形成的加速结构叫 BVH（Bounding Volumn Hierarchy），应用非常广泛。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"找一个场景，用包围盒把物体包起来，划分的不是空间，把物体划分为两部分，一直继续划分，划分到什么时候为止呢，比如一个节点里面只有 5 个三角形"}]},{"type":"paragraph","children":[{"type":"formatted","text":"性质：一个物体只可能出现在一个盒子里面。避免了 KD-Tree 的问题，一个物体可能出现在多个盒子里面，但是 BVH 引起了一个问题，对空间的划分不是完美的划分开，盒子有可能相交，要怎么划分，让重叠比较小。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0b743295-8e18-4153-ba16-3e30a2de35d5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3caf9093-0c2f-4219-bdb2-0972a745c175.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c7fde1b9-9971-418f-8c1b-611e220588fc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e3a2a4c1-d420-424a-bc6f-551efb97302b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"总结，做法："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"找到包围盒"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"递归把物体分为两个部分"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"重新计算物体的包围盒"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"按需停止"}]}]},{"type":"list-item","childr
