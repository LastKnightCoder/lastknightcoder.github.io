机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":154,"title":"第六课：光栅化II","content":[{"type":"paragraph","children":[{"type":"formatted","text":"采样存在锯齿，走样"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7fcbdd2c-1be1-4469-bcd7-a3e2b0e56c52.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"采样的理论，到底是怎么回事。光栅化就是判断一个像素中心是否在三角形内，是对 2D 空间的采样"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_26c2f25b-57a4-4c5b-9648-5527f56040f5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于采样带来的问题"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"锯齿"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7fcbdd2c-1be1-4469-bcd7-a3e2b0e56c52.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"摩尔纹"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e91b49e9-6f4c-4411-8548-c822b8ebdcdf.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"车轮效应"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3e64e077-2653-4aba-8dfa-9c0c993b18a8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"原因是信号的变化的速度太快了，采样跟不上。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在采样"},{"type":"formatted","text":"之前做一个模糊","bold":true},{"type":"formatted","text":"（滤波）"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2f072e83-2b8e-4356-a813-32fb3f5bbf82.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_df302375-2461-4ce0-b6c2-c0f6898c8d3e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_487eba52-64f7-4b5f-a2f1-4b94d5eeded9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从频域分析，一个周期函数可以表示为加权的 "},{"type":"inline-math","tex":"\\sin","children":[{"type":"formatted","text":"sin"}]},{"type":"formatted","text":" 和 "},{"type":"inline-math","tex":"\\cos","children":[{"type":"formatted","text":"cos"}]},{"type":"formatted","text":" 函数之和（傅里叶级数）"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_506338e0-219a-45f3-9bbb-3978259f3652.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"非周期的函数呢（傅里叶变换），可以理解为周期为无穷大，级数变为积分"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_709ac2a5-9262-4fa9-b2a8-11b6a058ce45.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"高频的信号需要更高的采样率，这样才能以合理的方式重构"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_616c7707-3b64-4d38-aa8d-efb040ace01b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果对高频信号进行采样的频率比较低，就会产生走样"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8dfb35e5-08f5-4e43-9370-2d3030a03aa1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"滤波，其实就是在频域上进行处理，一般是去除某些频率，因此称为滤波，常见的滤波器有低通滤波器，高通滤波器，带通滤波器，带阻滤波器。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"图像及其频率分布"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1b1595ef-f67d-47fd-9968-3b82c440289c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"高通（边缘）"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ec04bb3c-dd05-4e76-ac56-091a79421ed4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"低通（模糊）"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_72fc29ec-e4f5-4a2b-b945-83bd13c50a08.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"带通"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9151c6cc-06d7-4ec4-b654-e8f4695d8ded.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在一般不会通过滤波器去处理图像了，通过深度学习去处理图像，或者说不用手动设计的滤波器，而是使用学习到的滤波器，这些滤波器对人来说很难理解。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"频域的操作对应到时域信号的操作，乘积 <-> 卷积（加权平均）"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3287b4e4-ea6f-430d-ac1c-7752372e3796.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_45507d73-02b5-4d7f-b2b0-0c5cf3f8a5f8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从频率的角度看，什么是采样，采样就是在重复频域上的内容"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cd595ffa-b721-4364-b5d5-120608e7a1d9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"产生锯齿就是重复的频率内容重合了"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_29b74dcd-21fe-4f89-8e7f-62976d1df9de.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以反走样的方法："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"提高采样率，让频率不重合，但是成本高，并且需要非常高的分辨率"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"在采样前让图像的的频率变低，滤除高频率（模糊）✅"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_79047d90-c20c-4553-a57e-7173a1227bf8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"实际上是怎么把三角形变模糊，使用一个低通滤波"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_29cd026d-fa64-4ae0-ae18-c7ace5fb1896.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"对覆盖面积做一个平均"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7775d41a-a1b1-42a3-920d-722d2241ae3e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么做覆盖面积的平均，近似方法，用更多采样点做反走样，把一个像素划分为多个（MSAA），注意 MSAA 是为了提高近似的覆盖率计算模糊来实现反走样，而不是提高采样率完成的"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_61c99c0a-453a-4f79-a0af-6ab371aaea97.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7f0ce3b8-101c-4876-923e-55c8c16b4384.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_11ef04b3-de8b-4939-bbc2-cf4274ca2271.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6334d0fb-f5b3-455b-b520-94603466c82d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"MSAA 的效果，效果还不错"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_59b01dbf-f035-4939-ab8d-f8d35b83a410.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"牺牲了什么？用更多的点测试，增大了计算量。有没有更好的办法，减少采样的点测试，使用不规则的分布减少点，有很多的样本得到复用，光线追踪会提及使用什么样的分布。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"其他抗锯齿方法（工业界很常用）："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"FXAA（Fast Approximate AA），后期处理，对有锯齿的图片进行处理"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"TAA（Temporal AA），利用上一帧的信息"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"超分辨率，是指把小图拉大，但是存在失真（走样），怎么解决这个问题："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"DLSS（Deep Learning Super Sampling）"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"和抗锯齿不是一会儿事，但是本质相同"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第六课：光栅化II","href":"/docs/project/18/154.html"}],"prevPage":{"title":"第五课：光栅化I","href":"/docs/project/18/152.html"},"nextPage":{"title":"第七课：着色I","href":"/docs/project/18/155.html"},"createTime":1736691731434,"updateTime":1744963208436,"currentPath":"/docs/project/18/154.html"},"meta":{"type":"doc","publishTime":1764772322618}};
