机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":156,"title":"第八课：着色II","content":[{"type":"paragraph","children":[{"type":"formatted","text":"一些说明："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"着色是在一个点上"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"各个方向向量均是指从着色点出去的方向，且均为单位向量"}],"disableDrag":false}]}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"高光项，什么是高光，如何定义高光？"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"一些光滑的物体，反射的方向和观测的方向接近时就会产生高光。"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_63e4fb44-9b00-4023-a1d2-2c25d971c5af.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Blinn-Phone 模型，可以观察到一个现象，观测方向与反射方向接近等同于半程向量与法线方向接近。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"什么是半程向量，角平分线方向，根据平行四边形法则，两个向量相加都是角平分线方向。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"为什么使用半程向量，因为相比于反射方向，半程向量好算。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如何衡量接近层度呢，点乘，即余弦值。"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5eafd849-1ca9-412c-befc-22609b14c944.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"观察到有一个指数 p，余弦确实能恒量相关性，但是容忍度太高了，高光集中在很小的区域，指数 p 是为了收窄反射的 lobe。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"p 在实际中一般取 100-200。"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a5224415-9159-4fcb-90f2-25a8cb025020.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_969ad46e-f7b7-4fe2-9cb1-cea247bec8c4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光受到物体的多次反射，使用环境光模拟，非常的复杂，大胆假设环境光是一个常数（很粗略），环境光确保没有地方是黑的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"环境光和入射方向无关，和观测方向也无关。"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dfc381d6-2fea-4983-a298-9758a0c2ac12.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"把所有的项加起来，Blinn-Phong 反射模型"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_32a34ff9-4653-4823-8f6f-7b4faaf5662d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"完全相同的几何形状，着色结果不同，着色应用的部分不同："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"面"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"顶点"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"像素"}],"disableDrag":false}]}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6aca2b1a-1b8f-4672-ab3f-f364db7f52e3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Flat Shading，应用在每个面上，计算每个三角形的法向量（两个边做一个叉积），然后计算光照"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b3e04e03-a13e-4ea6-882c-b3160d615142.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Gouraud Shading，对每个顶点求法线，对每个顶点进行着色，然后进行插值"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ac6f08ae-cf7a-4ad8-99ad-9d61437d5376.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Phong Shading，对每一个像素求法向向量，然后着色"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6420a938-4abd-4a94-af05-c444f3772f40.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当几何足够复杂的时候，用简单的着色模型，效果也挺好的"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c9993809-09bd-4999-a81e-9be61578bada.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何定义顶点的法线："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"直到想表达的模型，比如球，那么球心到该点的方向就是法线，但是很难"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"任一个顶点和很多三角形关联，对这些三角形的法向量做一个平均，进一步，大的三角形认为贡献的更多，做加权平均"}],"disableDrag":false}]}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c0d00b99-a80b-40fc-a787-80c7e8bec291.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何定义每个像素的法线，使用顶点的法线进行插值（插值方法后续介绍）"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c70077d9-9974-4522-97cc-2aef488a2dda.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"从场景到一张图的所有过程，实时渲染管线（图形渲染管线），已经在硬件里面写好了"}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"顶点处理"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光栅化"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"片元着色"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"顶点处理和片元着色部分可编程。"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_bef7c2d2-45f9-46c5-a819-02de82ef46c0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"例子"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b84b6221-2d8c-4a59-b76d-a9de48ff5fb4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9239c04f-92fb-4fe3-ba54-957fba6ca1d5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c8ae945f-8e1b-4a0f-afd8-a0c85999ce44.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"顶点处理和片元着色可编程，这部分代码叫做 Shader"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d90fce10-f1de-412a-9c61-e712372c0c8b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4483b781-de9d-41a4-86e8-1e87256b208f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Shader 能在硬件上执行的语言，Shader 定义的是每个顶点、每个像素会执行的操作，每个顶点和每个像素都会执行一次。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"有两种 Shader"}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Vertex Shader，顶点着色器"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Pixel Shader/Fragment Shader，像素着色器/片元着色器"}],"disableDrag":false}]}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_bc9b0a80-d919-4435-89d2-f9ddfb1bc6bb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3221c951-f56e-45af-97c6-7ab07c79da6a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"网站推荐，shadertoy.com，可以在网页执行程序，Shader 可做的效果非常的惊人"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f9f56ebe-c743-43c5-82f4-1980bce0fc62.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"GPU，图形渲染管线的实现，有越来越多的着色器："}],"disableDrag":false},{"type":"bulleted-l tem","children":[{"type":"paragraph","children":[{"type":"formatted","text":"艺术家的创造，贴图由美工完成，我们认为已经知道这种映射关系"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"自动化（很难）"}],"disableDrag":false}]}]},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d5a03e20-2a14-4a25-9181-6da3f8c88a5e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"纹理坐标系，uv 表示纹理上的一个点，对于任意纹理，uv 的范围均在 0 到 1 之间，不管宽高比是怎样的"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fb20185a-cb44-487b-8c0b-75d18e012091.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"示例"}],"disableDrag":false},{"type":"image","url":"https://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_458d06f5-8b5c-4c92-9a21-0075165136fc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":""}],"disableDrag":false}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第八课：着色II","href":"/docs/project/18/156.html"}],"prevPage":{"title":"第七课：着色I","href":"/docs/project/18/155.html"},"nextPage":{"title":"第九课：着色III","href":"/docs/project/18/157.html"},"createTime":1737299452454,"updateTime":1745475066426,"currentPath":"/docs/project/18/156.html"},"meta":{"type":"doc","publishTime":1764774821769}};
