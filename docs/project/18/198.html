    <script>
      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"3D 学习","children":[{"title":"GAMES 101","children":[{"title":"第一课：总览","href":"/docs/project/18/146.html"},{"title":"第二课：线性代数","href":"/docs/project/18/145.html"},{"title":"第三课：变换I","href":"/docs/project/18/150.html"},{"title":"第四课：变换II","href":"/docs/project/18/151.html"},{"title":"第五课：光栅化I","href":"/docs/project/18/152.html"},{"title":"第六课：光栅化II","href":"/docs/project/18/154.html"},{"title":"第七课：着色I","href":"/docs/project/18/155.html"},{"title":"第八课：着色II","href":"/docs/project/18/156.html"},{"title":"第九课：着色III","href":"/docs/project/18/157.html"},{"title":"第十课：几何I","href":"/docs/project/18/159.html"},{"title":"第十一课：几何II","href":"/docs/project/18/171.html"},{"title":"第十二课：几何III","href":"/docs/project/18/183.html"},{"title":"第十三课：光线追踪I","href":"/docs/project/18/184.html"},{"title":"第十四课：光线追踪II","href":"/docs/project/18/193.html"},{"title":"第十五课：光线追踪III","href":"/docs/project/18/195.html"},{"title":"第十六课：光线追踪IV","href":"/docs/project/18/196.html"},{"title":"第十七课：材质与外观","href":"/docs/project/18/197.html"},{"title":"第十八课：高级光线传播与复杂外观建模","href":"/docs/project/18/198.html"},{"title":"第十九课：相机与透镜","href":"/docs/project/18/199.html"},{"title":"第二十课：光场、颜色与感知","href":"/docs/project/18/200.html"},{"title":"第二十一课：动画与模拟I","href":"/docs/project/18/201.html"},{"title":"第二十二课：动画与模拟II","href":"/docs/project/18/202.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project","active":true},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":198,"title":"第十八课：高级光线传播与复杂外观建模","content":[{"type":"paragraph","children":[{"type":"formatted","text":"高级光线传播。"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"无偏的光线传播方法："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Bidirectional path tracing，BDPT"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Metropolis light transport，MLT"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"有偏的光线传播方法"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Photon mapping，光子映射"}]}]}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Vertex connection and merging，VCM"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"实时辐射方法"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6b70df72-2321-410b-869d-1c3a415ca2b9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"蒙罗卡罗方法，如果估计出来的结果期望永远是对的，不管多少数量的样本，那么方法就是无偏的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"反之，就是有偏的，如果估计出来的期望和要的值不一样就是有偏的，在有偏的系列里，有个特殊情况，虽然不管取多少样本都是有偏的，但是在一个极限的定义下，用的样本足够多，期望会收敛到正确值，对于这种情况叫做一致的。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a60244d9-3cf7-4860-96ac-ede3d14ced72.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"双向路径追踪，BDPT。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"之前的路径是从相机开始的追踪，现在对于双向路径追踪，会生成两个半路径或叫做子路径，从光源打出一个半路径，从相机出发也会形成一个半路径，把两个半路径的端点连起来。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"思想很简单，但是实现起来很困难，而且会慢很多。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b08e3336-fb6e-4386-baf0-313e58e83b1c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"双向路线追踪在有些条件下效果特别好，为什么呢？如果想找到带有大量能量路径，对于这个场景不太容易，这个场景有一个性质就是光源往上打，大部分光都是间接光。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_131090e9-664e-4d40-ab8e-82a4d2ea0bfb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Metropolis 光线传播，MLT"}]},{"type":"paragraph","children":[{"type":"formatted","text":"用统计学上一个采样的工具帮你采样，这个工具叫马尔可夫链，当前有一个样本，根据当前样本生成下一个样本，和均匀采样的蒙特卡罗就不一样了，马尔可夫链我当前有一个样本，估计周围的样本，好处是给定足够的时间，可以生成以任意的形状为 PDF 的函数，当你生成的 PDF 和你要积分的函数形状一致的时候，偏差是最小的，马尔可夫就可以生成这样一个函数。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在有一个路径的情况了，可以产生周围相似的路径。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5b81fa4d-1831-4d79-81f0-e0b52123ce91.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在很多情况下，效果是不错的，特别适合做复杂的，困难的光路传播，只要找到一条作为种子，就可以找到更多"}]},{"type":"paragraph","children":[{"type":"formatted","text":"左边这个场景的特点，半开的门，相对比较难，右边场景类似夏天看到游泳池底下的形状，这种情况下渲染起来非常困难，但是只要能找到一些，就能找到更多"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cf461b0f-7135-4b02-b77f-7b13f7bd0e59.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"坏处，很难在理论上分析最后会收敛的速度，给你一幅图，渲染多长时间会收敛呢，一天够不够呢，不知道，还有个问题，所有操作都是局部，每个像素自己做自己的，有的像素收敛的快，有的收敛的慢，导致图像看起来脏"}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑到这种情况，不可能作为渲染动画的方法，有的像素收敛快，有的慢，上一帧和下一帧看起来抖的非常厉害"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_86044631-d3f7-426e-83ef-6dc4e93d33a1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光子映射，这是一个有偏的估计，能干什么，特别适合所谓的 causitics，一系列光经过聚焦后打到复杂的物体上，经过折射后打到一些物体上，形成了复杂的图案"}]},{"type":"paragraph","children":[{"type":"formatted","text":"适合很困难的路径"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3e32478c-f8f4-4297-ae60-d804d92452d8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光子映射怎么做的，两步的方法，光子映射的方法特别多，这里介绍一种方法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"光子的映射的第一步，从光源出发，光源一直在辐射很多的光子，光子从各个方法打出去，该反射反射，该折射折射，直到光子打到一个 diffuse 物体上，光子就停在那里。这一步做完后，把所有光子整理起来，这个时候就知道光子都在哪里，"}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二步，真正从眼睛或摄像机开始，打出各种各样的路径，同样道理，该反射反射，该折射折射，直到打到 diffuse 的物体上，那现在把这两步合起来做一个计算。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"做一个局部的密度估计计算，建立在一个观察上，光子分布越集中的地方越亮，光子分布越不集中的时候就越不亮，所以要做一个局部的密度估计。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于任一个着色点，取他周围的最近的 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 个光子，这是一个 nearest 问题，找到之后怎么办，找 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 个光子占的面积，算出来后，计算光子的密度，光子的数量除以面积。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cd1a4408-18d2-4647-963e-de3bd4d2d81b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4df9d4b6-5400-4bb8-8b73-21a4a52d1c6c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"用某一个 "},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 考虑能看到什么，"},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 取多少，"},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 很少噪声大，"},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 很大，会模糊。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么会模糊，为什么是有偏，在算密度的时候，应该是当前一个点的密度是多少，但是我们是算一定光子数的目的，正常情况下是挺相近的，但是肯定不想等，这个估计是一个不对的估计，当 "},{"type":"inline-math","tex":"\\Delta A","children":[{"type":"formatted","text":"\\Deta A"}]},{"type":"formatted","text":" 无限小才是正确的估计，什么时候 "},{"type":"inline-math","tex":"\\Delta A","children":[{"type":"formatted","text":""}]},{"type":"formatted","text":" 会很小呢，如果打出了超级多的光子，"},{"type":"inline-math","tex":"N","children":[{"type":"formatted","text":"N"}]},{"type":"formatted","text":" 不变，那么就会集中的特别厉害，这个 "},{"type":"inline-math","tex":"\\Delta A","children":[{"type":"formatted","text":""}]},{"type":"formatted","text":" 就会更小，就会更接近真实的 "},{"type":"inline-math","tex":"\\text{d}A","children":[{"type":"formatted","text":"dA"}]},{"type":"formatted","text":"﻿。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么说是一致的方法，当光子打出的足够多的情况下，就会得到正确的结果，否则就不是正确的，多少有点模糊。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e580cf55-1614-4744-8367-e3fa9288a35d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在回过头看，什么是有偏无偏，你得到的结果有模糊，就是有偏的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"一致，虽然有模糊，但样本足够多，就会收敛到正确的结果。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"能不能在着色点就取一个固定的面积，然后算里面的光子，理论上可以，但是你得到的结果一定是有偏的，并且是不一致的，因为你不管用多少个光子，这个面积都不变，不会和 "},{"type":"inline-math","tex":"dA","children":[{"type":"formatted","text":"dA"}]},{"type":"formatted","text":" 相同。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_816edebf-c14d-4359-9214-16e010b93227.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Vertex Connection and Merging，VCM"}]},{"type":"paragraph","children":[{"type":"formatted","text":"VCM 推导很复杂，但是想法很简单，把双向路径追踪和光子映射结合起来，想法是什么呢？做 BDPT，生成两个半路径，如果两个半路径满足这么一个性质，两个端点非常接近，在同一面上，这种情况下认为其中一半过来的就是光子，用光子映射把半路径结合在一块。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"VCM 用的蛮广泛的，很多电影就是用这种方法来做的。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e97b0189-6159-4c6a-92a0-61d6b75b26ee.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实时辐射度方法，IR，有时候人们把这个叫 many-light 方法，很多光源的方法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"分析光线传播的时候，我们并不太区分说光线到底是反射来的还是自己发出来的，不管怎么样都是光线，都是 Radiance，利用这种思想，已经被照亮的面，都认为是光源，然后利用他们来照亮别人，这就是实时辐射度的想法。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先从光线打出很多的半路径，停在某些地方后，停住的地方就认为就变成了新的光源，当看到一个点的时候，用所有新的光源去照亮这个着色点，这样用直接光照的方法就得到了间接光照的结果。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9ba622a7-af16-4c26-95e3-ea7f376bf58e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实际应用起来非常快。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"问题，有一些地方莫名其妙会发光，窄的缝隙啊，和距离的平方项有关系，VPL 不能做 glossy 的物体"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1e5c7ca4-8ee1-4f15-b383-76d67dcaa73d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"工业界在用什么办法，到现在还在用 path tracing。"}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"更复杂的外观建模。"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"非表面的模型"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"散射介质"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"毛发"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"沙粒"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"表面模型"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"半透明"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"布料"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"有细节度的模型"}]}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"程序化生成的模型"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a8e0fd8b-c5a2-4c86-ba6c-062a5de54295.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"非表面模型，散射介质，雾、云等。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么定义散射介质，如果光在行进过程中，如果进入了散射介质，会有若干事情发生："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光线会随机的打到其他方向上去，也可能接受到其他方向反射过来的光"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"传播的能量传播传播的就没了，能量会被吸收"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c5c6d889-f7f2-4f9a-ae69-d5ba70e9405c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么反射，是均匀的反射吗，对于散射介质，怎么散，由一个函数定义，Phase 函数，"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cd4bd823-0ce6-4771-8b5b-2cc7492bcd67.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"散射介质很好渲染，光线从某个方向走，走多远取决于介质吸收能力有多强，得到了非常广泛的应用。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0b79e40b-c5d6-41e1-b10e-279f0e2f7093.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外一种散射介质，有些东西看似是表面，其实光线其实是有可能进去的，只是多少的问题。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c8ae66cc-a764-48bc-a41f-6956cf4fcc48.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"毛发材质，头发是一根一根的，描述一个头发的光学属性，光线如何和一根曲线作用，头发有高光，高光很碎，而且可以观察到有两种高光，无色的高亮，有色的高光，这两种高光是怎么形成的呢"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2f40682f-33b6-4c9d-8a74-cec3bee8cc9e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"简单模型，有一根光线，打到头发（建模为圆柱），头发考虑成会散射出圆锥来，有一些光线又会散射到四面八方。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"Kajiya-Kay 模型，不对。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_66f5afdc-8e72-411a-ab8b-0acc590c5bf3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_624d849f-c5a9-49dd-a8c7-7491ff558ba5.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"真实头发和光线怎么作用，广泛应用的模型，Marschner Model。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑了什么事，光线打到圆柱的时候肯定有一部分被反射掉，也有一部分会穿进去，穿到头发里面去发生折射，然后穿出去，还有一部分光线进入里面了，在头发的内壁发生反射往回走，然后发生第二次穿透"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b53cc3ad-a482-49d7-b088-0ff9d5c98200.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"把头发当做玻璃的圆柱，有两个结构，外层的叫表皮，内层叫 cortex，头发他本身有色素，产生能量损失"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f26a3dd3-991d-43cb-9053-94021159c8ee.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"得到一个非常好的渲染结果"}]},{"type":"paragraph","children":[{"type":"formatted","text":"只能算光线和一根头发作用，和多根头发怎么作用，多次反射，所以渲染会很困难，计算量很大，所以头发渲染非常难"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9527a3b8-899d-41f7-a6a0-0dce08881f55.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"人的头发能不能用来描述动物的毛发呢，会发现不对，说明人的头发模型不足以描述和动物的毛发的作用"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8da2b26d-2141-4c96-9344-65f690cf817c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"生物上的结构，共同点，"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"表皮"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"cortex"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"髓质，内部结构非常之复杂，就跟进入了散射介质一样"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"区别：动物的髓质大的可怕，光线进去后更容易发生散射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f5cd89c2-746e-4279-9281-8933dd8b2150.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"验证，模拟髓质是有必要的"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6a4a5ff7-3c16-4c5c-952b-cc96c9a56dfb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"人的髓质这么小，作用就很大，有很大区别"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_066f0f71-c476-4146-bbf2-fc6b43b80537.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"双层圆柱模型，把髓质精准的描述出来"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f8ef2d7d-93ff-49e8-8aea-9854b5069da6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dd26870c-7f8c-4840-9272-3e85a9e88d83.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"加上两个散射的贡献"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_387e53ca-1c4c-4e9b-878f-f0fa38862926.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"Granular 材质，一粒一粒的这种模型"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_20d3723e-eeed-4972-ae99-091f9159f0f7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_56864e8a-f0fc-44c9-b944-015f624c291c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"很麻烦，计算量非常非常的大，沙子每一个单元有好多不同的石子，计算量很大，目前没有得到很好的解决。"}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"表面模型，散射介质现象，玉石是一类材质的典型代表，半透明"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6ce7643f-0418-4325-9041-e93413ce41d9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"反应在物体上，光线从一个点，进入了物体表面，在里面发生了大量的反射，从另外一个点钻出去了，次表面散射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_99a393b4-378a-4b4c-8f0e-f24e4ec0f152.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"次表面散射可以理解为对 BRDF 的延伸，BRDF 可以理解为光线打到了这个点，然后从这个点出来，所有的作用发生在一个点上，BSSRDF，中间加了一个散射"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_213472f0-bfbb-4f6a-9f7d-dd2dcf0986b1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"算起来很复杂，人们发现，就好像物体底下有个光源，为了物体上的真实，一个光源还不够，上面还有一个光源，Dipole 近似方法"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9df18ceb-0823-4e92-9cc1-6bc18ea6c001.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"应用，多么厉害，三幅图的共同点，都是假的，没有一副是照片，很厉害"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_74b50465-9fff-4f77-949c-b293b99c38bb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"布料，布料的制作原理，一系列缠绕的纤维制成的，不同纤维经过第一次缠绕，形成股，不同的股进行缠绕，会形成线，线会被织成布"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_539d8dca-7b74-4b78-915b-0605c2b51464.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"算表面模型，非常头疼，和针织和纺织的方向有关，根据形状可以算出来是什么样子，然后根据 BRDF 进行渲染"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ba90cb48-3fea-4ac0-ae99-ffd9d95bb27b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"BRDF 模型的问题，天鹅绒的纤维往外分布的，有问题"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7a947eb3-6127-4e05-8492-8e7d03cbda96.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"更准确的做法，把织物认为是空间中分布的体积，而空间分布的体积可以划分为超级细小的格子，每个格子里面知道纤维的朝向分布等，把性质转化为光线的反射和吸收，每一个格子当做散射介质处理计算量很大，一幅图都要几个小时"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_db2837d4-edd7-4339-941c-fed96a595574.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"布料本身就是纤维，把每一根纤维都渲染出来，得到的结果自然而然很真实，计算量惊人，直到今天，渲染布料的这三种方法都有人用"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6474b0fd-4ac8-4b52-ae5b-dae2f596bebc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有细节的材质，看起来不错，但是看起来不真实，为什么？很多情况下，得到的结果过于完美"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b022ae14-ac87-45d9-b55f-ef679a072c18.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"真实情况，车子有高光，蜘蛛网结构，有划痕，鼠标有高亮，但是高亮由很多凸起形成"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_45b931c0-0b38-4c5b-b246-366615a78200.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"微表面模型重要的是表面的法线分布，描述这个分布用的是非常简单的模型，比如正态分布，没有体现出变化，细节"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_81e7d021-b2f4-495d-a74d-4314849daeff.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6089e418-c985-47e9-aa58-0acf9d64dc55.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"蜗牛，壳上贴了一个法线贴图，200k * 200k，每一个面都产生一个高光，所有的高光形成一个大的高光"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c600d6c4-db16-45cd-af85-3e1ff05e62b3.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以虽然可以定义不同的细节，但是渲染出来非常困难，用 path tracing 做要多久，两小时都得不到，要将近一个月"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b233196e-f031-42ac-b090-410f468d1554.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"困难在哪，认为小的微表面是一个镜面，从摄像机打出一根光线，打到表面就知道反射的方向是什么，很难让光线打到光源上去，光源打过来也是一样，反射不到摄像机上"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_91723b68-6789-4729-b0e6-8f2d79d5f94e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么做，考虑一个像素会覆盖很多的微表面，把一定范围内的微表面的分布算出来，就可以替代原来光滑的分布，用在微表面模型里"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_df128ded-afcd-4b32-ba93-eb3a92cb5c49.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"考虑一个像素的覆盖范围，可以得到神奇的法线分布"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7494fe4f-59ab-4871-bef7-c0d4ff72b0b4.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同类型的法线贴图，会引起不同的法线分布"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f988b571-58e4-4e95-994a-f7f6c7f54f0f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当引入这些细节的时候，是有几何光学解决起来就不对，当小到和光的波长差不多的时候，就不是直线了，最近的趋势，波动光学"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_bd26359d-827e-4aff-a029-1ef57f3ac340.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在小黑屋里面，照亮金属片，可以在金属片上观察到不同的颜色，这就反应一定有波动光学发生了"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_310eed6d-1839-4df5-8564-d6fe2c00a375.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_9c0e0740-eeab-4be2-939d-c60dad209988.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"把波动光学解出来，得出来的波动光学 BRDF，特点不连续"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cd4ce78f-e91a-47db-9a6e-ef5707bc4c30.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"程序化生成的表面，材质，外观。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"不存纹理，通过一个函数去查，噪声函数，定义在空间中，砍成两半可以看到中间的纹理"}]},{"type":"paragraph","children":[{"type":"formatted","text":"程序化生成，随用随取，我不生成，用的时候查就行了"}]},{"type":"paragraph","children":[{"type":"formatted","text":"噪声函数，普遍会应用几种，应用最广泛的柏林噪声"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2b06cba8-928a-45f6-843d-2fb6a3cb8070.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f734e84d-bf53-4d7c-8ced-9fef74f882ba.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"噪声函数非常有用，生成地形"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_09ce3efe-24ba-4895-80b8-ecc1d642f9d0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"生成水面"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7dd0088f-0e83-4fd3-a6ff-a80b5685a24c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"生成木头"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b1401463-8dd7-463c-8934-c1310e992692.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第十八课：高级光线传播与复杂外观建模","href":"/docs/project/18/198.html"}],"prevPage":{"title":"第十七课：材质与外观","href":"/docs/project/18/197.html"},"nextPage":{"title":"第十九课：相机与透镜","href":"/docs/project/18/199.html"},"createTime":1741418377783,"updateTime":1743303640524,"currentPath":"/docs/project/18/198.html"},"meta":{"type":"doc","publishTime":1764774821772}};
