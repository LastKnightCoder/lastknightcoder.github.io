各种颜色）"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ce6f3515-6ee1-4031-bc6d-1b8b45af66fa.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"进一步扩展，引入时间，这就是电影"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_bb44f221-e693-437b-af45-2f5a5118e370.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"进一步扩展，人站的位置固定，现在考虑人的位置在三维空间任意一个位置，看到的是什么，全息电影"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ccf68f3e-df81-4ea9-9031-ba4874c652b8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在改进一步，理解为在任何位置，往任何方向看，在任何时间，看到的不同颜色，这就是看到的世界"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4c92b567-ae85-4412-9b2d-8e485245b692.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以从全光函数提取一部分信息，表示更复杂的光，所谓光场就是全光函数的一个小部分。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"定义光线，三维空间空的任意一条光线"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e7e13f46-1e73-4b8a-a1c5-58e59df2ce39.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"取光线上任意两点就可以定义一条光线，定义一条光线只要二维的位置和二维的方向"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_255344e3-0100-449e-9313-42757d236af8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光场（Light Field） 是描述光在空间中传播方向和位置信息的完整数据集。它记录了光线在三维空间中每一点的"},{"type":"formatted","text":"方向","bold":true},{"type":"formatted","text":"和"},{"type":"formatted","text":"强度","bold":true},{"type":"formatted","text":"，相当于用更高维度的数据来表征光的分布。与传统成像（仅记录投影到传感器上的光线强度）不同，光场能捕捉光线的"},{"type":"formatted","text":"全向信息。","bold":true}]},{"type":"paragraph","children":[{"type":"formatted","text":"想象用无数微型摄像头从不同角度拍摄同一场景，再将所有数据融合成一个可交互的光线数据库。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1db578e6-161d-4559-8418-efb64570b3b7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有了物体的光场，从任意一个位置从物体看，都可以知道看到物体什么，可以得到任意物体的一个不同的观测"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_360b47e8-2a63-4444-8b3a-73e152176f94.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光场定义在物体表面，不需要知道光场表示的是什么，我只关心表面到观测点的能量是多少"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5a2de97b-568d-4e13-874a-a5b6db1b5834.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这种方式可以理解为取一个平面，平面的右边是发光物体，可以忽略，我只关心平面左边是什么"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_221c8f08-c968-4af8-b3d4-9e6e18876ffc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"是不是说，对于任意光场，可以用两个平面定义一个光场，两个点定义光线，光场是一个四维函数，这是一种描述的方式"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a6eca2b1-63b0-440a-97b5-972b42651d9f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可以有不同的理解方式，"}]},{"type":"paragraph","children":[{"type":"formatted","text":"从 uv 上取固定一个点，看向所有 st 平面，会看到什么，会看到完整的物体的图。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_29e7dd74-4632-4725-aa15-38ac0e751a47.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在 st 固定一个点，看 uv 长什么样，等价于反过来，从 uv 各个点看向 st 同一个点，可以看到同一个物体不同方向是什么"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fe59a421-b573-44fb-8524-a9445e5e4239.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"斯坦福做的摄像机的矩阵，12 * 8，相当于在不同的位置对场景拍不同的图，每一个位置就是 uv，拍到的就是 st，最后得到一个光场"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dd5f998c-29a6-4d2a-980b-6c2e2355e17d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外一种，在自然界，苍蝇，复眼，呈现的就是光场，有一个透镜，把各个方向的光分到不同的地方，就可以把不同方向的光记录到不同的位置"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2e39003f-a1ff-4acf-a5a1-1d7d3d53c87c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光场照相机，Ren Ng，创立了公司，Lytro Light Field Camera，原理就是微透镜原理，把像素替换为透镜，把不同方向的光区分开，有什么功能，支持后期的聚焦，动态调节虚拟的焦距，先拍照，在调。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2a2c1c89-6c10-430f-94d0-703dd7c6bc95.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光场照相机的原理，就是光场的原理。在以前普通的相机里，把像素换成了微透镜，微透镜把不同方向的光分散到不同地方，然后感光元件记录下来，以前记录一个像素，现在记录一块像素"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_d4c3054e-e43f-419b-892b-31c36e979df9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"拍的光场的图，怎么还原成普通的照片，把每一个透镜的光线的方向选一条，把结果记录在一个像素上。去不同方向的光线，就好像在移动照相机的位置。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"重新聚焦是同样的道理，在重新聚焦的过程中知道光场的变化，可以算出来查哪个方向的光线，按需取即可"}]},{"type":"paragraph","children":[{"type":"formatted","text":"这一切是因为记录了光场的信息"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_778d7aa9-2e89-483b-b4f5-b1cbc408078c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光场摄像机有什么问题？光场摄像机分辨率不足，一个小块对应一个像素的信息，假设是 10 * 10，要用 100 个像素记录原来一个像素的信息，对胶片的分辨率要求很高，成本高。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"对于微透镜实现起来非常复杂，成本也很高。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"计算机图形学是关于各种方面的权衡。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_23a0187d-127c-4c86-b674-be327fd4ff71.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"颜色到底是什么，在早期，牛顿做的实现，光线经过棱镜形成了彩虹的颜色，不同的颜色可以合成其他颜色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4961e9a4-da60-4ab4-b99b-b5823e3028ac.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同的波长对应不同的折射率，按照波长划分可以得到一个波普，我们关注可见光光谱"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a9603bfb-1f8d-4b91-b89b-3d7f0de4d78f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"谱功率密度，不同的波长表现是不一样，用谱功率密度就可以描述任意一个光的分布是什么样子"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6fa92b60-61d2-4114-94ca-b98254488d46.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同光对应不用的 SPD"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8f8935c1-1f00-44b9-8f84-2e563ba544a7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_743425ca-27ce-4fa9-b3b1-80f764ded344.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"SPD 有一个性质，线性的性质"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_525177e6-dbec-413e-a393-cdbc14ec8700.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"最终要回答的问题是颜色，看到的颜色是什么的东西，颜色其实是人的感知，不是物理上的东西，颜色和人有关。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_588a1f78-90d4-4dee-9697-10712d836c7e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"人怎么样感知到颜色，人的眼睛就是摄像机："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"瞳孔 -\u003e 光圈"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"晶状体 -\u003e 透镜，通过肌肉拽调节焦距"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"视网膜 -\u003e 感光"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_256b2af3-88a4-46d9-9968-cb11777bd216.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"视网膜是最终光线最终到达的点，视网膜是怎么感知颜色的，视网膜上存在感光细胞，可以分为两个种类："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"棒状细胞 Rods，可以用来感知光的强度，不感知颜色，可以得到一个灰度的图"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"锥形细胞 Cones，少很多，锥形的细胞可以用来感知颜色"}]},{"type":"paragraph","children":[{"type":"formatted","text":"内部分为三种不同的锥形细胞"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f2230bf6-6e6d-403b-9926-c427fad1d603.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"锥形细胞分为三类，对波长的感知不同"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"S"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"M"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"L"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ef9e4bf3-2bcb-42d9-aab4-19f7a67a25ca.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同的人，这三种细胞的分布非常非常不一样，12 个人锥形细胞的分布"}]},{"type":"paragraph","children":[{"type":"formatted","text":"颜色是人感知的结果"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2f00e033-9599-4a62-8ca8-09019c120cf7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"三种细胞对三种光线是如何感知的呢？感知的结果就是对光线不同波长的积分"}]},{"type":"paragraph","children":[{"type":"formatted","text":"三种细胞，感应出三个数，对任一种光线，人们感知到的是三个数"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_81174766-3069-4238-b8f9-f81fcbb1818d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"看到的不是光谱，看到的是三个数"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af8507d7-f927-4056-88b8-b7d32a0d94f8.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"既然看到的不是光线的光谱，看到的是光线积分出来的结果，会不会有两种光线，光谱不同，可是被我们看到的颜色相同，✅"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_08824633-4a32-4d9e-9440-393e8fe08f04.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"利用这种现象，调和不同的光谱得到一种颜色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_fbe40751-13f6-4f37-b90b-1a1a8fc81770.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"实际的例子"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4d5838aa-29cd-4535-9f75-6dfa6dbce697.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"给任一个颜色，就可以去匹配他，颜色该如何混合。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"加色系统，RGB，把 RGB 不同强度混合起来，得到一种颜色。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ffdefa8d-7158-4807-96b0-c9f40e282421.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"允许通过线性组合匹配任意的颜色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a59cbb47-7e98-4a7a-a425-6fc18b8094e6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_68ae6eff-6834-47d7-bd5c-9e1f1d102680.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有些情况很奇怪，有些颜色怎么混都混不出来，可以把左边的颜色往上加一个颜色得到可以混合出来的结果，如果左边不加一个颜色，对应右边减掉一个颜色，可能会有负的系数"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cc940681-055c-4dee-b172-7c33a73fbba9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b1adb1a3-7085-4d96-abfa-f86fc7d6f195.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"CIE RGB 颜色匹配，给任何一个单色，用三种不同的单色的光如何混合得到这个颜色，做了实验，可以得到一个匹配函数"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果给一个实际的光的光谱，怎么算，把每一个波长需要多少的红色、绿色和蓝色算出来，积分"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_514843a0-36b7-4724-99d7-8addb7990c9a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c3c194b4-6ca3-44fd-99a1-6a447433dc31.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e61da05b-fcaa-4ad1-be3f-ce5140f66ece.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"颜色空间，标准 RGB(sRGB)，广泛用于成像设备，RGB 的颜色的空间形成的色域有限"}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"为什么选择的是 RGB 这三个颜色混合"}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2af9c36b-58ab-4c3e-8839-6bb6e151206c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"另外的系统，CIE XYZ，定义颜色匹配函数，不是实验测出来的，是人造的，定义好不同的曲线，没有负数，所有函数覆盖在可见范围内，可以用三个数表示某种颜色，Y 可以表示亮度"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_dc81398a-b33b-4fc0-aa11-4e8876783acd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"可不可以把 XYZ 可以表示的颜色都显示出来，是三维的，可不可以只显示其中两位，显示前两位，对任意 XYZ，做一个归一化，Y 表示亮度，可以让亮度固定，让 X 和 Z 发生变化，可视化 xy，看到的东西就是色域，一个颜色空间可以显示的颜色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e4e78c2f-b6a6-4391-8022-2858b997ee0d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"中心就是白色的颜色，白色是最不纯的颜色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_1df8ae39-b438-4d0e-a2e4-30f8a2cb1943.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_b91844a4-2516-4c62-b376-f7803a703800.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"色域定义一个颜色空间可以表示的颜色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_538855c6-b80f-433d-b028-c5fe60eff8e6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"不同的颜色空间"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f1c6a704-9105-4f11-b172-5f472b3440bd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"其他的空间，HSV"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"色调"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"饱和度"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"亮度"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_828f90b5-72da-4e44-93e3-8b7b2788737a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e7e42be1-b915-473d-ad71-8dbb1b46c416.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"CIE，Lab 空间，感知空间"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"L，黑和白"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"a，红和绿"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"b，蓝和黄"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"两端是互补色，根据实验得到的，和人脑有关系。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"通过人眼的视觉暂留验证互补色，看一幅图看的时间长了，突然切换到另一个颜色，你会看到这个颜色的互补色"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_03bbfc7e-3fbd-4cd3-819b-1f8aedd239c7.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_eb97bfe0-d6ae-4d64-9ad1-0dd7e4ea9630.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_deacb64d-cda7-4057-a8a5-238fb02c14ff.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"颜色很多是相对的"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c348f9f1-c789-4263-9514-64083b007049.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"减色系统，打印，印刷，把颜色混合在一起，越混越黑"}]},{"type":"paragraph","children":[{"type":"formatted","text":"CMYK，通过混合，得到不同颜色，黑可以混合得到，为什么还需要 K，在印刷上要考虑成本的，打印以黑色居多，黑色好造，便宜，其他的贵，混合得到的贵。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_01d1a4c7-6eca-4796-8dc5-f1711cdb6d20.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第二十课：光场、颜色与感知","href":"/docs/project/18/200.html"}],"prevPage":{"title":"第十九课：相机与透镜","href":"/docs/project/18/199.html"},"nextPage":{"title":"第二十一课：动画与模拟I","href":"/docs/project/18/201.html"},"createTime":1741479676432,"updateTime":1743303640524,"currentPath":"/docs/project/18/200.html"},"meta":{"type":"doc","publishTime":1777564860220}};
