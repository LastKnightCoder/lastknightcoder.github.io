      window._INIT_DATA_ = {"site":{"title":"我的博客","description":"","basePath":"/publish/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"3D 学习","children":[{"title":"GAMES 101","children":[{"title":"第一课：总览","href":"/docs/project/18/146.html"},{"title":"第二课：线性代数","href":"/docs/project/18/145.html"},{"title":"第三课：变换I","href":"/docs/project/18/150.html"},{"title":"第四课：变换II","href":"/docs/project/18/151.html"},{"title":"第五课：光栅化I","href":"/docs/project/18/152.html"},{"title":"第六课：光栅化II","href":"/docs/project/18/154.html"},{"title":"第七课：着色I","href":"/docs/project/18/155.html"},{"title":"第八课：着色II","href":"/docs/project/18/156.html"},{"title":"第九课：着色III","href":"/docs/project/18/157.html"},{"title":"第十课：几何I","href":"/docs/project/18/159.html"},{"title":"第十一课：几何II","href":"/docs/project/18/171.html"},{"title":"第十二课：几何III","href":"/docs/project/18/183.html"},{"title":"第十三课：光线追踪I","href":"/docs/project/18/184.html"},{"title":"第十四课：光线追踪II","href":"/docs/project/18/193.html"},{"title":"第十五课：光线追踪III","href":"/docs/project/18/195.html"},{"title":"第十六课：光线追踪IV","href":"/docs/project/18/196.html"},{"title":"第十七课：材质与外观","href":"/docs/project/18/197.html"},{"title":"第十八课：高级光线传播与复杂外观建模","href":"/docs/project/18/198.html"},{"title":"第十九课：相机与透镜","href":"/docs/project/18/199.html"},{"title":"第二十课：光场、颜色与感知","href":"/docs/project/18/200.html"},{"title":"第二十一课：动画与模拟I","href":"/docs/project/18/201.html"},{"title":"第二十二课：动画与模拟II","href":"/docs/project/18/202.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project","active":true},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":184,"title":"第十三课：光线追踪I","content":[{"type":"paragraph","children":[{"type":"formatted","text":"为什么需要光线追踪？先说说光栅化存在的问题，不能很好表示全局效果："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"软阴影"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"Glossy，物体表面像镜子，但又没镜子那么光滑"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"间接光照，光线不断弹射，然后打到人眼，光栅化非常非常的低效、麻烦且不能保证物理上的正确性"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0de2f235-42ad-44cf-9810-51764b540dfb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a38b374f-1563-45fc-b955-ca5500f13a18.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线追踪是一个准确的算法，质量高，符合物理规律，但是非常慢，用来做一些离线的应用，一帧就需要 10k CPU 小时"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_876b576e-c8aa-441f-b3a0-92780abeaf7d.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线是什么？"}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光沿直线传播"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光线与光线之间不会发生碰撞"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光线会从光源发出，经过场景反射折射然后进入我们的眼睛，光线的可逆性，也可以认为眼睛可以发出感知光线，经过场景进入到光源"}]}]}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当你凝视深渊时，深渊也在凝视你。"}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2924c493-36e9-4bf3-bff4-383e78e3f5e9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线投影，眼前放了一个投影平面，对于平面的每一个像素，从相机连一条线，这个光线会打到物体上，把这个点与光源连接，如果不能连到，就说明在阴影中，否则就形成了一条有效的光路"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4ee4f632-e9fe-4fb2-869a-95f7de83d4a9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线追踪假设：眼睛是一个点，光源也是点光源，光线的反射和折射是完美的。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"从眼睛发出一条光线，与最近的物体的交点，拿到交点后，这个点会不会照亮，与光源连一根线，这根线如果没被物体遮挡，就能看到"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_0c83878b-1c4d-48f1-b123-524d022a5625.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8cd57c00-c701-4b06-8b94-ce75caa07467.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何计算着色？"}]},{"type":"paragraph","children":[{"type":"formatted","text":"从光线投射开始，考虑球为玻璃球（反射和折射），计算着色也发生了变化，每一个弹射的点，都计算着色的值，把着色值相加。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线的简单归类："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"primary ray"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"second ray：一次弹射后"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"shadow ray：判断可视性"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cbbbfceb-0a8a-49f6-9fcc-5110b124c14b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_968514e0-e72b-432c-bb07-72f7fe76058e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a939f69c-12b0-40e0-950e-0480ecc238dd.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8b2e3349-aff2-41b1-82db-395a005a88cb.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_7519550b-6db0-46eb-8c3f-1a51cc33dcdc.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"结果"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6553d2c5-7cc3-41d2-afe2-b857907c8474.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线方程，光线在数学上是一个射线，如何表示光线"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_5c00d441-1324-40a7-8005-ccc68ca5d5e1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线如何和球求交点"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c245db9d-df1a-4c0f-96f8-f5abb7abcd27.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_6a6a392d-64bf-4fe0-b3cb-461c7b27de3c.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何与一般的隐式表面求交"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_3306dfc0-f7df-4975-9d26-4e781cd5249b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何与显示表面求交，大部分显示表面都是使用三角形表示的，那么就相当于与每一个三角形求交，非常简单，但是很慢"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_f1ab9baa-d47f-4e8d-998b-62216ae9026a.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么求光线和三角形的交点，三角形在一个平面内，将这个问题转化为两个问题："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"光线和平面求交"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"交点是否在三角形内"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_cd0f209f-c555-4e84-a3c6-2e8783d3f3a9.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么和平面求交，一个平面由两个条件决定："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"平面的法线"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"平面上的一个点"}]}]}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a94a164a-fac9-42ea-a9a3-3a7b80775ae1.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"光线和平面的交点计算"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_adced126-a073-4d1c-b01f-f0495c41afe6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"有没有一步到位的方法，Mollor Trumbore 算法"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_51f99e03-8e91-4b87-bcc0-54637ce7646f.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"怎么加速光线和表面求交，要和所有的三角形求交实在太慢了"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_8178f4cf-e254-40fa-8aac-36e9a11db9d0.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"在极其复杂的场景下，不能使用原始的方法求交"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_ffa941c9-e5e4-4a58-8a35-2d55712c6d4b.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_a41c315f-1406-4b36-aee9-5f38020e0642.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"将物体使用一个简单的形状包起来（包围盒），如果光线连包围盒都碰不到，更别说碰到里面的物体了"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_e3a4b3ce-3dec-4906-90a5-06eccec2c6e6.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"三维的情况，常用的包围盒是长方体，长方体是三个不同对面形成的交集，常用的包围盒是轴对齐包围盒（AABB），任一个轴都沿着坐标轴"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_87851943-bded-4d78-9928-307cb844049e.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"当光线和包围盒求交，2D 的例子，3D 同样，知道什么时候进出两个轴的时间，怎么知道进出包围盒，求交集"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_c4b561ae-4c13-46b5-ad40-d92a19b3b760.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"一个盒子有三个对面，什么时候算进入了三维盒子，当光线进入了所有三个对面。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"什么时候进：进入了所有面的时候，"},{"type":"inline-math","tex":"t_{\\text{enter}} = \\max\\{t_{\\text{min}}\\}","children":[{"type":"formatted","text":"t_enter = \\max{t_{min}}"}]},{"type":"formatted","text":"﻿"}]},{"type":"paragraph","children":[{"type":"formatted","text":"什么时候出：从任一个面都出去的时候，"},{"type":"inline-math","tex":"t_{\\text{exit}} = \\min\\{t_{\\text{max}}\\}","children":[{"type":"formatted","text":"t_exit = \\min{t_{max}}"}]},{"type":"formatted","text":"﻿"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果 "},{"type":"inline-math","tex":"t_{\\text{enter}} < t_{\\text{exit}}","children":[{"type":"formatted","text":"t_{\\text{enter}} \\le t_{\\text{exit}}"}]},{"type":"formatted","text":" 说明在这段时间，光线在盒子里。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_af029a5d-42a1-4e72-9279-0d61ef25e953.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"负的值怎么考虑"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"t_{\\text{exit}} < 0","children":[{"type":"formatted","text":"t_{\\text{exit}}"}]},{"type":"formatted","text":"，说明盒子在光线背后，不可能有交点"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"当 "},{"type":"inline-math","tex":"t_{\\text{exit}} \\geq 0, t_{\\text{enter}} < 0","children":[{"type":"formatted","text":"t_{\\text{exit}} geq 0, t_{\\text{enter}} le 0"}]},{"type":"formatted","text":"﻿，说明光源在盒子里面，肯定有交点"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"总结，光线和 AABB 有交点，当且仅当"}]},{"type":"block-math","tex":"t_{\\text{exit}} > t_{\\text{enter}} \\quad \\text{and} \\quad t_{\\text{exit}} \\geq 0","children":[{"type":"formatted","text":""}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_2a79179e-8e1d-4926-8831-ff89a703dbf2.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"为什么要轴对齐，因为计算更方便"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_edcd5e20-7b4c-4760-91ca-f8cbeecc8e00.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"3D 学习","href":"/docs/project/18/146.html"},{"label":"GAMES 101"},{"label":"第十三课：光线追踪I","href":"/docs/project/18/184.html"}],"prevPage":{"title":"第十二课：几何III","href":"/docs/project/18/183.html"},"nextPage":{"title":"第十四课：光线追踪II","href":"/docs/project/18/193.html"},"createTime":1740532829252,"updateTime":1743303640522,"currentPath":"/docs/project/18/184.html"},"meta":{"type":"doc","publishTime":1764774821771}};
