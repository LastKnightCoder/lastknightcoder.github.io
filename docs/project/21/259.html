充分生效。解决方案也很简单，别太干净，别总洗手，多接触微生物，以此训练免疫系统。"}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"不干不净，吃了没病？"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"实际情况要复杂和微妙的多，普通大众凭直觉得到的结论，结论不说全错，也是极有问题的。没有考虑到人类免疫系统和周遭微小生物的共同演化。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"保持卫生是预防生病的极重要措施。卫生≠无菌，关键是保持接触多样化的微生物，如果没有获得足够的微生物资料，免疫系统就无法充分学习，出现过激反应，过敏风险就会增加。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"剖宫产的问题：在顺产时会和母亲的阴道中、还有粪便中的微生物组亲密接触，是免疫系统适应为什无的第一部。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"母乳喂养少也是影响因素之一，母乳包含丰富多样的物质，可以滋养新生微生物组，滋养多种细菌。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"现代饮食中的纤维大大少于过去，纤维是许多益生菌的重要食粮。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"只要人类在长大的地方能接触到更多和人类有多年交情的微生物，免疫系统就能发育的更好。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"启发："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"上完厕所要洗手"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"要打扫房间，但是别消毒"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"好好清洁厨具"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"让孩子去森林里玩耍"}]}]}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"41 卫生假说和老朋友","href":"/docs/project/21/259.html"}],"prevPage":{"title":"40 自身免疫性疾病","href":"/docs/project/21/258.html"},"nextPage":{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},"createTime":1741914243991,"updateTime":1743303640538,"currentPath":"/docs/project/21/259.html"},"meta":{"type":"doc","publishTime":1764810804400}};
