      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"《战斗细胞》","children":[{"title":"第二部分，惨重损伤","children":[{"title":"14 淋巴：高速路和大都市","href":"/docs/project/21/170.html"},{"title":"15 超级武器降临","href":"/docs/project/21/172.html"},{"title":"16 宇宙最大的图书馆","href":"/docs/project/21/173.html"},{"title":"17 烹饪美味的受体菜谱","href":"/docs/project/21/174.html"},{"title":"18 胸腺 -- 杀手大师","href":"/docs/project/21/175.html"},{"title":"19 抗原层递","href":"/docs/project/21/203.html"},{"title":"20 唤醒适应性免疫系统：T细胞","href":"/docs/project/21/204.html"},{"title":"21 军工厂和狙击枪","href":"/docs/project/21/205.html"},{"title":"22 T 细胞和 B 细胞的共舞","href":"/docs/project/21/206.html"},{"title":"23 抗体","href":"/docs/project/21/207.html"}]},{"title":"第三部分，恶意接管","children":[{"title":"24 沼泽之国：黏膜","href":"/docs/project/21/210.html"},{"title":"条目 #222","href":"/docs/project/21/222.html"},{"title":"26 病毒是什么","href":"/docs/project/21/223.html"},{"title":"27 肺部免疫系统","href":"/docs/project/21/224.html"},{"title":"28 流感——威力被低估的病毒","href":"/docs/project/21/231.html"},{"title":"29 化学战：干扰素，干扰起来！","href":"/docs/project/21/232.html"},{"title":"30 细胞之窗","href":"/docs/project/21/236.html"},{"title":"31 专业杀手：杀伤性 T 细胞","href":"/docs/project/21/237.html"},{"title":"32 天生杀手","href":"/docs/project/21/238.html"},{"title":"33 如何清除病毒感染","href":"/docs/project/21/242.html"},{"title":"34 关闭免疫应答","href":"/docs/project/21/243.html"},{"title":"35 免疫系统是怎样牢记敌人的","href":"/docs/project/21/244.html"},{"title":"36 疫苗和人工免疫","href":"/docs/project/21/245.html"}]},{"title":"第四部分 反叛与内战","children":[{"title":"37 免疫系统太弱：HIV 和艾滋病","href":"/docs/project/21/247.html"},{"title":"38 免疫系统太激进：过敏","href":"/docs/project/21/256.html"},{"title":"39 免疫系统可能想念寄生虫","href":"/docs/project/21/257.html"},{"title":"40 自身免疫性疾病","href":"/docs/project/21/258.html"},{"title":"41 卫生假说和老朋友","href":"/docs/project/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":247,"title":"37 免疫系统太弱：HIV 和艾滋病","content":[{"type":"paragraph","children":[{"type":"formatted","text":"HIV，人类免疫缺陷病毒，影响辅助性 T 细胞。HIV 是导致艾滋病的病毒。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"HIV 的传染性不是特别强，需要通过血液等体液或性行为传播，大部分 HIV 都是通过性行为、肉眼不可见的伤口感染。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"HIV 通过 CD4 的受体进入细胞体内，这些受体主要位于辅助性 T 细胞表面。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"HIV 属于逆转录病毒，一旦感染，就会永久成为你的一部分。人类 DNA 有数千种病毒的基因遗迹，占比越 8%，也就是说你有 8% 是病毒，不过大部分没有功能，也没有危害，但是能表示逆转录病毒会伴随终身。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"HIV 病毒感染的三个过程："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"急性期"}]},{"type":"paragraph","children":[{"type":"formatted","text":"树突细胞会把 HIV 病毒带到淋巴结，HIV 病毒能接触大量辅助性 T 细胞，其数量会暴增，此时会激活适应性免疫系统，会有一些感染反应，轻微的感染症状，不会引起重视。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"体内会有足够的杀伤性细胞和浆细胞活化，杀死感染细胞，清除几十亿病毒，症状消失，体内也生成了记忆细胞，走运的情况下，HIV 感染也被清除。"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"慢性期"}]},{"type":"paragraph","children":[{"type":"formatted","text":"HIV 会尽可能延长感染细胞的生命，还有一些狡猾的方法寻找新目标，免疫细胞之间相互作用时，会靠的很近，使用触手相互作用，称为免疫突触，HIV 利用突触从一个细胞跳去一个细胞。这样有好处，第一不用杀死细胞，引起免疫系统反应，第二，病毒也不用游离在细胞外，不会被免疫系统发现，第三，这种方式相比游离在外感染细胞的成功率高。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当辅助性感染 T 细胞增殖时，HIV 复制的非常快，即使杀伤性 T 细胞在找它，它也能逃离，感染大量新细胞。这是因为 HIV 变异的速度太快了，遗传编码极易发生复制错误，存在非常多的 HIV 变体，而适应性免疫系统一周才生成几千个杀伤性 T 细胞核几百万清除 HIV 的抗体（这里我有个疑问，不是有记忆细胞吗，为什么要这么久，难道是因为这些记忆细胞处理不了这些变异的 HIV 病毒），适应性免疫系统跟不上变异的速度。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每天 HIV 生成十亿百亿病毒，免疫系统也在持续不断生成抗体核杀伤性 T 细胞，可以持续十年之久，在这个过程中，辅助性 T 细胞不仅被感染，还要被杀伤性 T 细胞追杀，长期下来辅助性 T 细胞一直在减少，直到到达一个阈值，适应性免疫系统崩溃，病毒布满全身，毫无抵抗之力。"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"重度免疫抑制"}]},{"type":"paragraph","children":[{"type":"formatted","text":"身体出现获得性免疫缺陷综合征，即艾滋病。此时适应性免疫系统失效，将受到千百种病原体、微生物、癌细胞的侵袭，但是免疫系统已经不行了。艾滋病的患者的主要死因是各种癌症、细菌或病毒感染。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在医学界使得艾滋病成为慢性病，延缓 HIV 患者进入最后阶段，但是一旦进入最后阶段，必死无疑。"}]}]}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"37 免疫系统太弱：HIV 和艾滋病","href":"/docs/project/21/247.html"}],"prevPage":{"title":"36 疫苗和人工免疫","href":"/docs/project/21/245.html"},"nextPage":{"title":"38 免疫系统太激进：过敏","href":"/docs/project/21/256.html"},"createTime":1741827868267,"updateTime":1743303640528,"currentPath":"/docs/project/21/247.html"},"meta":{"type":"doc","publishTime":1764822964061}};
