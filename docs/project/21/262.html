t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":262,"title":"44 免疫系统与癌症","content":[{"type":"paragraph","children":[{"type":"formatted","text":"癌症是指某些部位的细胞不受控制地生长和增殖，可以分为两种："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"发生于肺、肌肉、大脑、骨骼或性器官等实质性器官，形成肿瘤"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"良性肿瘤不会像癌细胞侵犯其他组织和器官，局限在某个部位，甚至不用切除，除非长得太大，压迫大脑等器官。"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"非实体癌，起源于骨髓，会影响血液、骨髓、淋巴液、淋巴系统这些业务成分，这类癌症被统称为白血病，或者血癌"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"基本上，所有的组织和细胞都有可能癌变，近 1/4 人会在一生中患癌，1/6 死于癌症。患癌最简单的办法就是活的足够久。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"细胞要发展成癌症，必须发生突变，使得抑制癌症的三种机制都失效："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"癌基因监控癌细胞的生长和增殖，在胚胎期时，癌基因表达就非常活跃，因为需要快速的分别和生长，当胚胎发育充分，能引发快速增殖的基因就会关闭。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"当几年后几十年后，某个突变重新开启这些癌基因时，细胞就会开始快速分裂增殖"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"修复编码算上的基因，肿瘤抑制基因，这种基因会不停扫描 DNA，一旦发现异常和错误，就会修正，一旦发生突变，就失去了自我修复的能力"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"让细胞通过凋亡和有序自毁的基因，一旦失去自毁能力，错误就会累积下来"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"当以上三种突变都发生时，就会引发癌变，这是癌症发病的基本原理。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"癌细胞不在和其他细胞合作，只会抢夺资源，不断分裂，夺走身体营养，破坏原本器官。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"体内长出来的癌细胞，绝大部分会被不知不觉干掉。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"免疫系统和癌细胞的较量，分为如下几个阶段："}],"disableDrag":false},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"免疫清除阶段"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"体内有了癌细胞，癌细胞疯狂复制、增殖，需要更多的营养，引起周围健康细胞的死亡，细胞的非正常死亡引起免疫系统的注意，巨噬细胞和 NK 细胞来到现场，杀死癌细胞，并释放细胞因子，引起炎症，树突状细胞受到信号后激活为紧急状态，把癌细胞的样本送往辅助性 T 细胞和杀伤性 T 细胞，但是癌细胞原来也是体细胞，怎么识别出来是异物呢，因为癌细胞发生基因突变后，导致蛋白质异常，有些适应性细胞能和这些蛋白结合。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"T 细胞开始抑制血管的生长，饿死癌细胞，至少让肿瘤难以生长。杀伤性细胞会检查癌细胞体内情况，发现了异常的蛋白质就令其自毁，NK 细胞会杀死哪些隐藏了 MHC 分子的癌细胞。（癌细胞不是不能自毁吗？），巨噬细胞会清理癌细胞的尸体"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"平衡阶段"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"正常情况下肿瘤会被清除掉，但是如果发展不顺利，癌细胞会疯狂增殖，由于自我纠正机制损坏，因此突变发生的可能更大，就可能突变出那种善于躲藏，不被免疫系统发现的癌细胞。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"癌细胞发生的这种突变，可以让杀手细胞失活，它通过干扰杀伤性 T 细胞和 NK 细胞上的抑制受体，从而抑制免疫细胞的杀戮。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"新的肿瘤开始生长"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"逃逸阶段"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"经免疫锤炼的癌细胞，已经对免疫系统有了免疫力。随着肿瘤增长，又开始造成健康组织死亡，再次引起注意。癌细胞打造自己的世界，形成肿瘤微环境，让免疫细胞难以穿越。如果不做治疗，这些癌细胞将会有转移性，一旦扩展到肺、大脑或肝脏这些重要器官，人体这台机器就开始崩坏。"}],"disableDrag":false}]}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"44 免疫系统与癌症","href":"/docs/project/21/262.html"}],"prevPage":{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},"nextPage":{"title":"45 新冠病毒","href":"/docs/project/21/263.html"},"createTime":1741916586707,"updateTime":1743303640538,"currentPath":"/docs/project/21/262.html"},"meta":{"type":"doc","publishTime":1764810804400}};
