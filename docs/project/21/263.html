t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":263,"title":"45 新冠病毒","content":[{"type":"paragraph","children":[{"type":"formatted","text":"在疫情初始阶段，这种名为严重急性呼吸综合征冠状病毒2（SARS-2），被称为冠状病毒，但冠状病毒是一类病毒，而非某一种病毒，当时由于传播一太快，错过了去一个恰当名字的机会。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"能感染人类的有好几种不同的冠状病毒，15% 的感冒就是由某种冠状病毒。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"过去爆发的几种冠状病毒："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"SARS 病毒，引起严重的呼吸系统疾病，在全球造成了 8000 多人感染，900 人死亡"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"MERS，中东呼吸综合征，比 SARS 更致命，感染人数只有 2500 人，但是超过 1/3 的感染者人死亡"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"新冠病毒，传染性比前两种强，但是致死性弱得多。这种病毒针对的是 ACE2 这种受体，和调节血压有关，这意味着很多细胞都有这种受体，因此感染，比如鼻腔和肺部的上皮细胞。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"新冠病毒能终止干扰素的释放，但是被感染的细胞仍可以释放各种各样的细胞因子引发炎症，惊动免疫系统，所以病毒可以感染大量细胞，不由限制的扩散，同时引发炎症，激发免疫系统后又引发炎症。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"炎症和活化的免疫系统会严重损伤肺部，随着上皮细胞死去，肺泡裸漏出来，并在后面战斗中死亡，如果到了这种地步，就需要机械通气，但是这样会让细菌长驱直入，可能引发并发的细菌感染，导致免疫系统引发更严重的炎症，形成恶性循环。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"大面积的肺部炎症会造成不可逆的损伤。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"在重症患者身上，还出现凝血级联反应，血液中负责让伤口愈合的成分机会，在血管中凝结，导致器官缺氧，同时肺部充满液体，呼吸更困难。同时凝血还会导致中风、心肌梗死。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"45 新冠病毒","href":"/docs/project/21/263.html"}],"prevPage":{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},"createTime":1742173389652,"updateTime":1743303640538,"currentPath":"/docs/project/21/263.html"},"meta":{"type":"doc","publishTime":1764823684207}};
