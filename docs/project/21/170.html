t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":170,"title":"14 淋巴：高速路和大都市","content":[{"type":"paragraph","children":[{"type":"formatted","text":"淋巴系统：免疫系统的高速公路和大都市网络。拥有广泛的淋巴管网和专门的淋巴液。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"部分血液会从血管渗出到组织和器官，直接运送物资，之后部分血液会被血管重新吸收，但有部分血浆仍残留在组织细胞间，淋巴系统会负责把组织细胞间多余的液体重新运回血液，重新循环。"}],"disableDrag":false},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_31d2be5e-9de0-48f4-96c1-e704370593d2.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_31d2be5e-9de0-48f4-96c1-e704370593d2.png"},{"type":"paragraph","children":[{"type":"formatted","text":"淋巴管的构造：组织液可以流进，但不能流出，淋巴液也只朝一个方向流动。淋巴液的流动速度很慢。如果将细胞比作一个人，血液的流速相当于声速的好几倍，而淋巴液的速度相当于乘船观光旅行。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"淋巴系统不仅运送体液，它也是废物管理系统和预警系统。在回收细胞间多余体液时，淋巴系统也会收集各种残渣和垃圾：受损的残破体细胞、死去甚至活的细菌或其他入侵者，还有各种各样的化学信号及游离分子。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"在有感染的情况下，淋巴液会收集感染处的化学信号并把信号传递回免疫系统的情报中心"},{"type":"formatted","text":"淋巴结","bold":true},{"type":"formatted","text":"进行过滤和分析。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"淋巴最主要的任务是充当免疫细胞的高速公路，每秒有几十亿免疫细胞在淋巴管中流动，寻找工作，而发布招聘启事的就是淋巴结，大部分淋巴结分布在肠道周围、腋下、头颈部和腹股沟。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"当淋巴结检测到异常信号时，会立即启动紧急预案：树突状细胞将病原体碎片（抗原）呈递给 T 细胞和 B 细胞，T 细胞开始克隆自己，B 细胞则开始批量生产抗体。克隆出来的 T 细胞通过淋巴管这条"},{"type":"formatted","text":"高速公路","bold":true},{"type":"formatted","text":"，直奔感染部位，抗体通过血液运输，像磁铁一样粘住病菌，让它们失去行动能力"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"当身体在对抗严重感染时，淋巴结里的兵工厂全速运转，免疫细胞数量暴涨，新生产的抗体和细胞把淋巴结撑大，就像快递爆仓的仓库，通常 1-2 周后，随着战斗结束会自动。"}],"disableDrag":false}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第二部分，惨重损伤"},{"label":"14 淋巴：高速路和大都市","href":"/docs/project/21/170.html"}],"nextPage":{"title":"15 超级武器降临","href":"/docs/project/21/172.html"},"createTime":1740003087345,"updateTime":1755938801892,"currentPath":"/docs/project/21/170.html"},"meta":{"type":"doc","publishTime":1764822964056}};
