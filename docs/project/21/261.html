t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":261,"title":"43 免疫系统与应激","content":[{"type":"paragraph","children":[{"type":"formatted","text":"在几百万年前，人类组建为了应对环境，例如野兽袭击，需要对感知到的危险做出强烈反应，不管危险是否存在，能快速做出反应的生物更容易存活。在这种自然选择下，人类组建变得很擅长快速识别应激源并迅速做出反应，这是自动过程。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"免疫系统也会被应激状态做出响应，让各种免疫机制有些加速，有些减慢。虽然我们现在的环境已经有了很大的变化，但是机制仍然没有改变，在实际需要保持冷静和清醒的情况下，身体仍然会出现应激反应，心理应激会对免疫系统产生直接的生理影响。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"之前的应激源是狮子，会很快消失，现在我们的应激源是应付考试、给挑剔的客户出方案，应激状态会持续数周甚至数月，长期慢性应激会涉及抑郁、孤独。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"慢性应激会干扰身体终止炎症反应的功能，从而导致慢性炎症，会改变辅助性 T 细胞的行为，做出误判，导致免疫反应失衡；会导致皮质醇等激素释放，抑制关系免疫系统，让免疫系统变弱。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果还在寻找增强免疫系统的方法，消除生活中的应激源，呵护心理健康，是可以做的实实在在的事情。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"43 免疫系统与应激","href":"/docs/project/21/261.html"}],"prevPage":{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},"nextPage":{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},"createTime":1741915996365,"updateTime":1743303640538,"currentPath":"/docs/project/21/261.html"},"meta":{"type":"doc","publishTime":1764821904223}};
