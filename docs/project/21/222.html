t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":222,"title":"条目 #222","content":[{"type":"paragraph","children":[{"type":"formatted","text":"肠道黏膜是那个生活了 1000 多种细菌，数量达三四十万亿，还有几千种病毒，组成了肠道微生物群。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"肠道免疫系统是一个半封闭系统，和其他部位的免疫系统保持一定界限。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"肠道黏膜的最大挑战，它的防线一直在被攻破，要持续响应分辨敌友。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"90% 以上人体所需营养都是在肠道吸收的，这里有大量人体必需的细菌，进一步分解食物，共生细菌。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"细菌有可能侵入肠道内部，如果进入血流，会带来可怕后果，所以黏膜的一大目标就是防止这种情况。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"肠道黏膜有三层："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"黏液层，内含大量抗体，防御素和杀伤细菌的蛋白质，具有一定通透性，可以让营养物质通过"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"肠道上皮细胞，人体内外真正的屏障"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"固有层，有特殊巨噬细胞、B 细胞和树突状细"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"若非必要，免疫系统会极力避免发炎，因为发炎会导致肠道产生大量多余液体，造成腹泻，不仅会损伤上皮层，还是导致重度脱水。腹泻仍是重要死因，每年约 50 万儿童因此死去。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"肠道的巨噬细胞的特点："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"很擅长吞噬细菌"}],"disableDrag":false}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"不会召集中性粒细胞而引发炎症的细胞因子"}],"disableDrag":false}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"肠道树突细胞会待在上皮细胞下面，把长触手从上皮细胞挤过去，伸入黏液进行采样，识别入侵细菌。有个谜题，树突细胞是怎么识别是危险的病原体还是共生的细菌的。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"肠道的 B 细胞会生成大量的 IgA，把黏液中的细菌黏在一起，然后成为粪便的一部分，粪便的三成多都是细菌。"}],"disableDrag":false},{"type":"paragraph","children":[{"type":"formatted","text":"如果真有致命病菌经过了胃酸洗礼，来到了肠道，上述机制就是可怕的漏洞，所以在肠道上有一个“派尔集合淋巴结”，它直接长到肠道上，有微皱褶细胞深入肠壁，对感兴趣的对象采样，这样就相当拥有一个快速的免俗筛查。"}],"disableDrag":false}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第三部分，恶意接管"},{"label":"条目 #222","href":"/docs/project/21/222.html"}],"prevPage":{"title":"24 沼泽之国：黏膜","href":"/docs/project/21/210.html"},"nextPage":{"title":"26 病毒是什么","href":"/docs/project/21/223.html"},"createTime":1741652988665,"updateTime":1743303640526,"currentPath":"/docs/project/21/222.html"},"meta":{"type":"doc","publishTime":1764823684203}};
