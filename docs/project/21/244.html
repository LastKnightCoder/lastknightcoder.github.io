t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":244,"title":"35 免疫系统是怎样牢记敌人的","content":[{"type":"paragraph","children":[{"type":"formatted","text":"记住旧对手，并保持鲜活记忆，是免疫系统的重要能力。人体有免疫记忆，对于遭受过的感染，免疫系统会记住，再次感染可迅速消灭。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以有些病小孩更致命，因为小孩没有免疫记忆，而成年人有免疫记忆，等到老去，记忆细胞无法工作后，老年阶段也更容易生病。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"B 细胞被 T 细胞激活后，其中一部分会变成各种类型的记忆细胞，分为几类："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"长寿命浆细胞，位于骨髓，能活很久，它可以持续的生成一定量的抗体，它保证体液中时刻都有特定的抗体，每一滴血液中都有  13 万亿抗体"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"记忆 B 细胞，位于淋巴结，静静扫描淋巴液，寻找抗原，一旦发现，就会迅速大量增殖，不用辅助性 T 细胞激活，这就是为什么能免疫病原体的原因，记忆 B 细胞可以直接活化"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"活化后的 T 细胞也能生成记忆细胞，"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"90% 的 T 细胞在作战完成后凋亡，剩下 10% 变成组织驻留记忆 T 细胞，一旦发现敌人就激活周围的免疫系统"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"效应 T 细胞，常年在淋巴系统和血液系统巡逻，寻找抗原"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"中心记忆 T 细胞，驻扎淋巴结，什么都不做，只存储战斗记忆，一旦活化，可以快速生成发动攻击的效应 T 细胞"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"记忆细胞威力很强，再次感染相同病原体是，往往都注意不到。"}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"麻疹病毒会杀死记忆细胞，它的感染性非常强，比新冠病毒强的多，麻疹病毒最喜欢攻击 T 细胞和 B 细胞，特别是长寿命浆细胞、记忆 B 细胞和记忆 T 细胞。感染麻疹后，免疫系统就失去了曾经得过的疾病的免疫能力，还会清除因接种疫苗而获得的保护。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第三部分，恶意接管"},{"label":"35 免疫系统是怎样牢记敌人的","href":"/docs/project/21/244.html"}],"prevPage":{"title":"34 关闭免疫应答","href":"/docs/project/21/243.html"},"nextPage":{"title":"36 疫苗和人工免疫","href":"/docs/project/21/245.html"},"createTime":1741823329068,"updateTime":1743303640528,"currentPath":"/docs/project/21/244.html"},"meta":{"type":"doc","publishTime":1764820858534}};
