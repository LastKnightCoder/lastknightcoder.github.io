ren":[{"type":"formatted","text":"同样 B 细胞经过训练后，游离在淋巴系统，等待被激活"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_818c9ff9-4fb5-4c02-9f13-c3649292f8ce.png","pasteUploading":false,"children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"B 细胞激活不需要树突细胞传递抗原，树突细胞传递的抗源都是短抗原，B 细胞能直接识别大分子抗原。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"B 细胞不仅能识别到死去的细菌抗原，还能识别补体蛋白的特殊受体，就像是在跟 B 细胞正式确认有危险，B 细胞活化效率提升 100 倍。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"现在是早期活化阶段，活化的 B 细胞去淋巴结中的一个区域进行自我复制，直到生产两万个，分泌到血液中奔赴战场。这个时候不是最厉害的抗体，如果没有第二次激活，大部分 B 细胞会在一天内凋亡（没有第二次激活就认为症状很轻，为避免不必要损伤，自行毁灭）。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"B 细胞和大块抗原结合后，会分解抗原，然后细胞表面的 MHC 分子夹住，这样活化的辅助性 T 细胞的受体才能识别。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第二部分，惨重损伤"},{"label":"21 军工厂和狙击枪","href":"/docs/project/21/205.html"}],"prevPage":{"title":"20 唤醒适应性免疫系统：T细胞","href":"/docs/project/21/204.html"},"nextPage":{"title":"22 T 细胞和 B 细胞的共舞","href":"/docs/project/21/206.html"},"createTime":1741565497207,"updateTime":1743303640525,"currentPath":"/docs/project/21/205.html"},"meta":{"type":"doc","publishTime":1764772322621}};
