      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"《战斗细胞》","children":[{"title":"第二部分，惨重损伤","children":[{"title":"14 淋巴：高速路和大都市","href":"/docs/project/21/170.html"},{"title":"15 超级武器降临","href":"/docs/project/21/172.html"},{"title":"16 宇宙最大的图书馆","href":"/docs/project/21/173.html"},{"title":"17 烹饪美味的受体菜谱","href":"/docs/project/21/174.html"},{"title":"18 胸腺 -- 杀手大师","href":"/docs/project/21/175.html"},{"title":"19 抗原层递","href":"/docs/project/21/203.html"},{"title":"20 唤醒适应性免疫系统：T细胞","href":"/docs/project/21/204.html"},{"title":"21 军工厂和狙击枪","href":"/docs/project/21/205.html"},{"title":"22 T 细胞和 B 细胞的共舞","href":"/docs/project/21/206.html"},{"title":"23 抗体","href":"/docs/project/21/207.html"}]},{"title":"第三部分，恶意接管","children":[{"title":"24 沼泽之国：黏膜","href":"/docs/project/21/210.html"},{"title":"条目 #222","href":"/docs/project/21/222.html"},{"title":"26 病毒是什么","href":"/docs/project/21/223.html"},{"title":"27 肺部免疫系统","href":"/docs/project/21/224.html"},{"title":"28 流感——威力被低估的病毒","href":"/docs/project/21/231.html"},{"title":"29 化学战：干扰素，干扰起来！","href":"/docs/project/21/232.html"},{"title":"30 细胞之窗","href":"/docs/project/21/236.html"},{"title":"31 专业杀手：杀伤性 T 细胞","href":"/docs/project/21/237.html"},{"title":"32 天生杀手","href":"/docs/project/21/238.html"},{"title":"33 如何清除病毒感染","href":"/docs/project/21/242.html"},{"title":"34 关闭免疫应答","href":"/docs/project/21/243.html"},{"title":"35 免疫系统是怎样牢记敌人的","href":"/docs/project/21/244.html"},{"title":"36 疫苗和人工免疫","href":"/docs/project/21/245.html"}]},{"title":"第四部分 反叛与内战","children":[{"title":"37 免疫系统太弱：HIV 和艾滋病","href":"/docs/project/21/247.html"},{"title":"38 免疫系统太激进：过敏","href":"/docs/project/21/256.html"},{"title":"39 免疫系统可能想念寄生虫","href":"/docs/project/21/257.html"},{"title":"40 自身免疫性疾病","href":"/docs/project/21/258.html"},{"title":"41 卫生假说和老朋友","href":"/docs/project/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":232,"title":"29 化学战：干扰素，干扰起来！","content":[{"type":"paragraph","children":[{"type":"formatted","text":"人体细胞抵抗入侵病毒。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一步，细胞要意识到自己受到了袭击，Toll 样可以识别病毒一类敌人的最常见形状，上皮细胞有一些不同的受体，可以扫描自己内部，看看有没有危险信号。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"先天性免疫系统对付病毒没有对付细菌那么厉害，需要适应性免疫系统的帮助，但是适应性免疫系统反应很慢，需要几天时间才能苏醒，所以先天性免疫系统要争取时间，减慢感染速度，如何做到，发动化学战。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"细胞因子是激活并指挥免疫系统的分子，当细胞发现自己被感染时，它会想周围的细胞核免疫系统释放一系列细胞因子，其中有一类很特殊，干扰素，它是干扰病毒的细胞因子。细胞接收到干扰素，就会令细胞活动发生剧变，第一批剧变，暂停蛋白的生产，这样在被感染的情况下也不会合成大量病毒蛋白。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"细胞可以生成几十种干扰素，有很多针对性干扰病毒的例子，这些不重要，重要的是干扰素可以干扰病毒复制的每一步。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但有些病毒如甲型流感病毒适应了人类的免疫系统，它会生成一些攻击蛋白，摧毁和阻断感染细胞的内部防御机制，虽然并不总能阻止细胞释放干扰素，但是可以给自己争取时间。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"浆细胞树突状细胞（pDC），随血液流动或驻扎淋巴网络，专门扫描病毒特征（干扰素或者病毒颗粒），一旦发现病毒痕迹，就会活化，释放大量干扰素，是免疫系统活化做好战斗准备。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当免疫细胞意识到面对的是病毒感染，就会释放另一组细胞因子，热原质。热原质就是引起发热的化学物质，发热会形成不利于病原体的生活环境，同时让免疫细胞更有利的战斗。热原质进入脑内，会和神经细胞发生作用，改变人体的恒温设定，从而升高体温。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"两种方式升高体温："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"让人打寒战，肌肉快速收缩，同时产生热作为副作用"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"让体表血管收缩，减少热量散失"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"所以发热时会感觉很冷。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"免疫细胞可以耐受升高的体温，甚至高温常会加快某些蛋白的反应，而病毒很难适应升高的温度，可以直接减缓病毒和细菌的增殖。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"流感和普通感冒的区别："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"流感属于急性病毒性上呼吸道感染，得流感的时候，发热等其他症状大批袭来，头疼，无法思考，甚至会浑身疼痛，让人难受"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"普通赶跑，健康成年人一年可能得 2-5 次，小孩一年可能得 7 次，大体上无甚危害，可能都察觉不到"}]}]}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第三部分，恶意接管"},{"label":"29 化学战：干扰素，干扰起来！","href":"/docs/project/21/232.html"}],"prevPage":{"title":"28 流感——威力被低估的病毒","href":"/docs/project/21/231.html"},"nextPage":{"title":"30 细胞之窗","href":"/docs/project/21/236.html"},"createTime":1741736178589,"updateTime":1743303640527,"currentPath":"/docs/project/21/232.html"},"meta":{"type":"doc","publishTime":1764823684203}};
