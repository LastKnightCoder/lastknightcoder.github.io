      window._INIT_DATA_ = {"site":{"title":"Tau's Blog","description":"人生天地间，忽如远行客","basePath":"/"},"navigation":[{"label":"首页","href":"/"},{"label":"卡片","href":"/cards/"},{"label":"文章","href":"/articles/"}],"sidebar":[{"title":"《战斗细胞》","children":[{"title":"第二部分，惨重损伤","children":[{"title":"14 淋巴：高速路和大都市","href":"/docs/project/21/170.html"},{"title":"15 超级武器降临","href":"/docs/project/21/172.html"},{"title":"16 宇宙最大的图书馆","href":"/docs/project/21/173.html"},{"title":"17 烹饪美味的受体菜谱","href":"/docs/project/21/174.html"},{"title":"18 胸腺 -- 杀手大师","href":"/docs/project/21/175.html"},{"title":"19 抗原层递","href":"/docs/project/21/203.html"},{"title":"20 唤醒适应性免疫系统：T细胞","href":"/docs/project/21/204.html"},{"title":"21 军工厂和狙击枪","href":"/docs/project/21/205.html"},{"title":"22 T 细胞和 B 细胞的共舞","href":"/docs/project/21/206.html"},{"title":"23 抗体","href":"/docs/project/21/207.html"}]},{"title":"第三部分，恶意接管","children":[{"title":"24 沼泽之国：黏膜","href":"/docs/project/21/210.html"},{"title":"条目 #222","href":"/docs/project/21/222.html"},{"title":"26 病毒是什么","href":"/docs/project/21/223.html"},{"title":"27 肺部免疫系统","href":"/docs/project/21/224.html"},{"title":"28 流感——威力被低估的病毒","href":"/docs/project/21/231.html"},{"title":"29 化学战：干扰素，干扰起来！","href":"/docs/project/21/232.html"},{"title":"30 细胞之窗","href":"/docs/project/21/236.html"},{"title":"31 专业杀手：杀伤性 T 细胞","href":"/docs/project/21/237.html"},{"title":"32 天生杀手","href":"/docs/project/21/238.html"},{"title":"33 如何清除病毒感染","href":"/docs/project/21/242.html"},{"title":"34 关闭免疫应答","href":"/docs/project/21/243.html"},{"title":"35 免疫系统是怎样牢记敌人的","href":"/docs/project/21/244.html"},{"title":"36 疫苗和人工免疫","href":"/docs/project/21/245.html"}]},{"title":"第四部分 反叛与内战","children":[{"title":"37 免疫系统太弱：HIV 和艾滋病","href":"/docs/project/21/247.html"},{"title":"38 免疫系统太激进：过敏","href":"/docs/project/21/256.html"},{"title":"39 免疫系统可能想念寄生虫","href":"/docs/project/21/257.html"},{"title":"40 自身免疫性疾病","href":"/docs/project/21/258.html"},{"title":"41 卫生假说和老朋友","href":"/docs/project/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":245,"title":"36 疫苗和人工免疫","content":[{"type":"paragraph","children":[{"type":"formatted","text":"接种疫苗的历史，几百年前，通过人痘接种，认为诱发免疫力。在一千年前的北宋，从轻微感染者身上取一些痘痂，晾干，磨成粉末，吹入受种痘着鼻孔，一切顺利的情况下，接种人会感染轻度天花，将会就会对重度天花免疫。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"天花在历史上引起了巨大的灾难，在 20 世纪天花夺走了 3 亿人生命。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"疫苗接种真正开启，人们发现没必要使用真正的天花病毒进行接种，使用更安全的牛痘（天花病毒的一种变体，感染对象是牛），就开发出了第一种疫苗，后来天花得到了根除。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"生成记忆细胞不简单，要让免疫吸引认为受到了攻击，还不能因为疫苗而感染上这种病。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"产生免疫力的方法："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"被动免疫：从其他幸存者身上获得对某疾病或某病原体的免疫力过程"}]},{"type":"paragraph","children":[{"type":"formatted","text":"抗体不仅能对抗病原体，还能对抗毒素，在微观层面，毒素就是某种分子。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"以毒蛇抗蛇毒血清为例，从毒蛇身上采集毒液，注入马或兔子这些哺乳动物体内，剂量在动物的耐受范围内，让动物产生免疫力，体内就会生成大量抗体，人们采集这些血液，把抗体分离出来，去掉血液其他成分，就得到了抗毒血清。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"怀孕时某些抗体可以通过胎盘进入胎儿体内，让胎儿获得母体的免疫力，从而获得被动免疫，另外大量抗体还可以通过母乳传给孩子"}]},{"type":"paragraph","children":[{"type":"formatted","text":"抗体采集也可以从人类身上进行，从血库的捐献血液采集抗体，汇集到一起，在输给免疫缺陷、不能产生抗体的病人"}]},{"type":"paragraph","children":[{"type":"formatted","text":"被动免疫的缺点是：效果只是暂时的，没有记忆能力"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"主动免疫，生成记忆细胞，为特定病原体做准备"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在不得病的情况下，让身体以为得了病，从而对疾病进行免疫。从安全且充分的触发免疫应答，但同时避免引发真正的疾病。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一种办法，在某种程度上染上疾病，但是症状很轻，如人痘接种，这就是减毒活疫苗的原理，注射真病原体，但致病性大大减轻，如麻疹疫苗，麻疹病毒经过培养，没什么毒性，但是会引起强烈的免疫应答"}]},{"type":"paragraph","children":[{"type":"formatted","text":"活疫苗的缺点，需要在适当温度下储存，也不是所有的病原体都可以制成活疫苗"}]},{"type":"paragraph","children":[{"type":"formatted","text":"另一种办法，注射前直接杀死病原体，叫做灭活疫苗，但是会导致病原体变得太过无害，无法充分激活免疫系统，需要和可以高度激活免疫系统的化学物质混合在一起"}]},{"type":"paragraph","children":[{"type":"formatted","text":"再一种办法，亚单位疫苗，利用的不是完整的病原体，而是其中的特种部分（抗原），这种方法很安全，这些抗原也需要和激活免疫系统的化学物质混合在一起"}]},{"type":"paragraph","children":[{"type":"formatted","text":"新型的 mRNA 疫苗，让人体自身细胞生成抗原，供免疫系统识别，注射 mRNA 后，少数体细胞会生成病毒抗原，免疫系统被激活，发动防御"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"接种疫苗是一种社会责任，如果健康的人都接种疫苗，就能形成群体免疫，可以保护那些无法接种的人。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第三部分，恶意接管"},{"label":"36 疫苗和人工免疫","href":"/docs/project/21/245.html"}],"prevPage":{"title":"35 免疫系统是怎样牢记敌人的","href":"/docs/project/21/244.html"},"nextPage":{"title":"37 免疫系统太弱：HIV 和艾滋病","href":"/docs/project/21/247.html"},"createTime":1741826099783,"updateTime":1743303640528,"currentPath":"/docs/project/21/245.html"},"meta":{"type":"doc","publishTime":1764822964060}};
