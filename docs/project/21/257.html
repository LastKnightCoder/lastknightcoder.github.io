html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":22,"title":"《第二大脑》","href":"/docs/project/22/212.html","kind":"project"},{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":257,"title":"39 免疫系统可能想念寄生虫","content":[{"type":"paragraph","children":[{"type":"formatted","text":"世界上有近 300 种寄生虫可以感染人类，其中有十几种广泛传播。寄生虫感染在欠发达的地区猖獗。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"IgE 的奇怪机制就是为了应对寄生虫感染而生。首先认出寄生虫，在寄生虫在身体于外界的交界处，驻扎在皮肤，肠道，呼吸道的特殊 B 细胞会开始生成大量 IgE 抗体，预热肥大细胞，等再次遇到寄生虫时，肥大细胞就可以近距离向寄生虫吐出杀伤性武器，同时引发的炎症会惊动免疫系统的其他部分，巨噬细胞和中性粒细胞会涌过来攻击寄生虫，同时嗜碱性粒细胞也被机会，确保寄生虫被杀死之前一直持续，来自骨髓的嗜酸性粒细胞后续也会加入战团。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"寄生虫也在演化对抗免疫系统的防御，有多种免疫抑制机制，释放各种化学物质，下调免疫系统的反应。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"由于卫生条件的提高，人类现在很少受到寄生虫的感染，免疫系统但还未适应这种情况，在与寄生虫对抗的过程中，会导致免疫系统对这种情况非常亢进，所以对于过敏免疫系统显得亢进。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"39 免疫系统可能想念寄生虫","href":"/docs/project/21/257.html"}],"prevPage":{"title":"38 免疫系统太激进：过敏","href":"/docs/project/21/256.html"},"nextPage":{"title":"40 自身免疫性疾病","href":"/docs/project/21/258.html"},"createTime":1741910102499,"updateTime":1743303640538,"currentPath":"/docs/project/21/257.html"},"meta":{"type":"doc","publishTime":1764774821778}};
