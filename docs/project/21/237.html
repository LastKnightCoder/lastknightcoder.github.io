t/21/259.html"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":237,"title":"31 专业杀手：杀伤性 T 细胞","content":[{"type":"paragraph","children":[{"type":"formatted","text":"辅助性 T 细胞和杀伤性 T 细胞均有 T 细胞分化而来，在 T 细胞中，杀伤性 T 细胞占 40%，它们也有几十亿中独特的受体，用以识别抗原。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"杀伤性细胞需要靠 MHC-I 类分子激活。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"树突状细胞可以对战场中的病毒进行采样，分解为抗原，通过 MHC-II 类分子呈递，激活辅助性 T 细胞，但是不会激活杀伤性 T 细胞，但是树突状细胞还可以采集病毒抗原，并在 MHC-I 类分子展示出来，激活杀伤性 T 细胞，因此树突状细胞可以同时激活辅助性 T 细胞和杀伤性 T 细胞。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"杀伤性 T 细胞真正苏醒还需要一个信号，在此之前只能少量的克隆，不久后会很快凋亡，因为杀伤性细胞非常危险，不能意外活化，第二个信号来自辅助性 T 细胞，完全活化的杀伤性 T 细胞会快速增殖。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"杀伤性 T 细胞一个个扫描细胞，贴脸检查，如果发现自己的 T 细胞可以结合的抗原就会给细胞下达指令：快点自行了断吧。感染细胞会有序死亡，病毒微粒仍在死细胞内，知道巨噬细胞把它吞掉。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是这套机制有个漏洞，病毒会抑制受感染的细胞生成 MHC-I 类分子。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第三部分，恶意接管"},{"label":
