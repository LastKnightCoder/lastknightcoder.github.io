ml"},{"title":"42 如何强化免疫系统","href":"/docs/project/21/260.html"},{"title":"43 免疫系统与应激","href":"/docs/project/21/261.html"},{"title":"44 免疫系统与癌症","href":"/docs/project/21/262.html"},{"title":"45 新冠病毒","href":"/docs/project/21/263.html"}]}]}],"docCollections":[{"type":"project","label":"项目","items":[{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project","active":true},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":14,"title":"软件使用文档","href":"/docs/document/14/609.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":258,"title":"40 自身免疫性疾病","content":[{"type":"paragraph","children":[{"type":"formatted","text":"免疫系统对自身免疫非常小心，只有能区分自身和异物的细胞才能离开胸腺。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"自身免疫正常的情况下，T 细胞和 B 细胞可以识别自体细胞的蛋白（自身抗原）。一旦受到误导，T 细胞和 B 细胞和自身抗原结合，免疫系统不能区分自身和异物，麻烦就大了。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"什么情况下会发生这种情况，满足以下条件："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"MHC 分子能和自身抗原结合，由遗传决定"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"身体能生成可以识别自身抗原的 T 细胞和 B 细胞，且这些细胞不被身体杀死"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"自身免疫性疾病的可能的发生步骤："}]},{"type":"numbered-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"有遗传易感性（非必需）"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"体内能生成可以识别自身抗原的 B 细胞和 T 细胞"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"人体有感染，刺激先天性免疫系统激活上述 B 细胞和 T 细胞"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"具体怎么引发的，还不完全清楚，有一个流行的理论，分子相似，是指微生物的抗原和体细胞抗原很相似。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每个 T 细胞和 B 细胞都能识别某一特定抗原的受体，实际上每个 T 细胞和 B 的受体识别的范围要更宽一些，也能和其他一些抗原结合，例如 B 细胞受体出了可以识别某种特定抗原，还能识别另外八种相似，但不完全相同的抗原。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如果病原体它带有的抗原类似于某种自身抗原，就会导致激活适应性免疫系统，凑巧适应性细胞也能和自身抗原结合，那就麻烦了。"}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"无反应性，一种巧妙的抑制策略，可以抑制自身反应性 T 细胞。树突状细胞不仅仅是在战场上采样，其实抑制处于采样模式，所以可以预料到其中有很多自身抗原，通过于自身性 T 细胞结合，但是不释放激活信号，T 细胞随后会自行失活。"}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第四部分 反叛与内战"},{"label":"40 自身免疫性疾病","href":"/docs/project/21/258.html"}],"prevPage":{"title":"39 免疫系统可能想念寄生虫","href":"/docs/project/21/257.html"},"nextPage":{"title":"41 卫生假说和老朋友","href":"/docs/project/21/259.html"},"createTime":1741912905099,"updateTime":1743303640538,"currentPath":"/docs/project/21/258.html"},"meta":{"type":"doc","publishTime":1767266228178}};
