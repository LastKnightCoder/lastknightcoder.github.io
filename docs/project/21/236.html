{"type":"paragraph","children":[{"type":"formatted","text":"想办法了解细胞内部，把细胞内的东西拿出来看看，一种起窗口作用的特殊分子，可以把细胞内部的情况呈现出来。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"I 型主要组织相容性复合体（MHC-I），所有包含细胞核的体细胞都有 MHC-I 类分子，细胞在回收蛋白时，会随机采集蛋白碎片，转运到细胞膜上，对外部呈现出来，这样就可以知道细胞内部情况，为确保都是最新情况，有成千上万个 MHC-I 类分子，每个 MHC-I 类分子大约一天换一个蛋白。并且在收到干扰素后，会开始生产更多的 MHC-I 类分子。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"当免疫细胞发现细胞正在受到感染，这个受感染的细胞就会被杀死。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"每个人的 MHC-I 类分子都有些许的不同，这一点对器官移植很不幸，因为免疫系统通过 MHC 分子识别出移植的器官上的细胞不是你，免疫系统会发起攻击，杀死移植的器官。所以接受器官移植后，病人要终身服用强效免疫抑制剂，但这无疑会大大降低病人抗感染的能力。"}]},{"type":"paragraph","children":[{"type":"formatted","text":""}]}],"breadcrumb":[{"label":"《战斗细胞》","href":"/docs/project/21/170.html"},{"label":"第三部分，恶意接管"},{"label":"30 细胞之窗","href":"/docs/project/21/236.html"}],"prevPage":{"title":"29 化学战：干扰素，干扰起来！","href":"/docs/project/21/232.html"},"nextPage":{"title":"31 专业杀手：杀伤性 T 细胞","href":"/docs/project/21/237.html"},"createTime":1741742757820,"updateTime":1743303640527,"currentPath":"/docs/project/21/236.html"},"meta":{"type":"doc","publishTime":1764820858533}};
