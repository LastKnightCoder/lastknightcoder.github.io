text":"这节讲了什么：首先讲了古代人的追求，在史书上留下好名声，实现不朽，如果没有办法进入史书，普通人如何实现不朽，作者提出了一个畅想，将我们的数字遗产通过一个算法生成一个虚拟数字人，这个人将是永久不朽的。"}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"首先，我觉得可能已经不是畅想了，人工智能的到来感觉会让这一切很快成为现实，另外，其实我觉得这种数字生命，如果没有价值，那还会不朽吗，没有穿越时代的价值，是否就随风而逝了呢？如果存在穿越时代的价值，为何不会青史留名？"}]},{"type":"paragraph","children":[{"type":"formatted","text":"可能还是仅在子孙这一辈能起作用，这些都是我们身体力行的，到了下一代，遗传的应当是他们的数字遗产，我们的价值感觉会很小了。"}]}],"breadcrumb":[{"label":"《第二大脑》","href":"/docs/project/22/212.html"},{"label":"第五章 正在改变的个人遗产和家族传承"},{"label":"普通人将拥有的不朽之路","href":"/docs/project/22/253.html"}],"prevPage":{"title":"个人的真正遗产究竟是什么","href":"/docs/project/22/252.html"},"nextPage":{"title":"第二大脑如何继承","href":"/docs/project/22/254.html"},"createTime":1741841280435,"updateTime":1743303640538,"currentPath":"/docs/project/22/253.html"},"meta":{"type":"doc","publishTime":1764810804404}};
