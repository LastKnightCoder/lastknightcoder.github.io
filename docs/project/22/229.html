,{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":229,"title":"构建网状立体的结构","content":[{"type":"paragraph","children":[{"type":"formatted","text":"思考和记忆是两个相反的活动："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"记忆，由外而内，人接受外部的感受，成为印象"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"思考，由内而外，对印象进行梳理，在思维中重构和连接印象"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"从印象到认识、掌握、理解还很远。"}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"事物的本质是其他事物关系的总和。 ---马克思"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"掌握事物的关系，就能掌握本质。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"将信息块放置到网络中时，不能是孤立的，要和其他节点发生联系。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"信息块会根据标签进行聚类，和其他块产生的了联系，将块标上多个标签，和更多的块保持联系，作者认为三个最好，因为三点成面，四点构成立体空间，我本人觉得完全没有道理可言。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"在添加新的信息块的时候，要想到未来怎么去使用它。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"如何确定信息块的标签"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"对内容和非内容标签并重"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"内容标签，和内容相关的标签"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"非内容标签"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"场景"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"修辞"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"思维"}]}]}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"仅把内容限制于内容，很闹做到多维"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"关注细节"}]}]}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这节讲了什么：引入第二大脑的第二个功能，思考和创新。思考是将记忆的印象进行消化，才能理解和掌握。借用马克思的话，强调了关系的作用，所以在建立新的信息块，要和已有的块之间建立联系，而在作者的笔记组织形式中，是通过标签的方式为笔记建立联系，因此要为块打上多个标签，这样就能建立更多的联系，以及为块打上合适的标签，所以阐述了如何为块打标签，作者介绍了它是怎么打标签的，举了两个例子。"}]}],"breadcrumb":[{"label":"《第二大脑》","href":"/docs/project/22/212.html"},{"label":"第三章 创建高级的思考特质"},{"label":"构建网状立体的结构","href":"/docs/project/22/229.html"}],"prevPage":{"title":"使用全新的、革命性的日记模式","href":"/docs/project/22/227.html"},"nextPage":{"title":"洞察、发现新的联系","href":"/docs/project/22/233.html"},"createTime":1741692248749,"updateTime":1743303640527,"currentPath":"/docs/project/22/229.html"},"meta":{"type":"doc","publishTime":1764820858537}};
