rmatted","text":"帮助我们记忆和思考"}]}]}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这节讲了什么？为什么互联网不是好的思考工具，因为互联网是发散的，而我们思考需要聚焦。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"但是人又容易健忘，需要外部记忆辅助思考，既然互联网不是好的思考工具，那就打造一个适合思考的外部记忆载体，第二大脑。"}]}],"breadcrumb":[{"label":"《第二大脑》","href":"/docs/project/22/212.html"},{"label":"第一章 为什么需要第二大脑"},{"label":"互联网不是好的思考工具","href":"/docs/project/22/213.html"}],"prevPage":{"title":"令人恐惧的失忆症和不自知的健忘","href":"/docs/project/22/212.html"},"nextPage":{"title":"什么是第二大脑","href":"/docs/project/22/214.html"},"createTime":1741570821919,"updateTime":1743303640526,"currentPath":"/docs/project/22/213.html"},"meta":{"type":"doc","publishTime":1764775995430}};
