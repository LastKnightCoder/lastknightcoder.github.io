,{"id":21,"title":"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":4,"title":"读书笔记","href":"/docs/document/4/58.html","kind":"document"},{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"},{"id":8,"title":"Webpack","href":"/docs/document/8/70.html","kind":"document"}]}],"content":{"id":239,"title":"改写、化用和互文：创建新的脑细胞","content":[{"type":"paragraph","children":[{"type":"formatted","text":"当看到受到启发的信息的时候，我们会把它记录下来，如果仅是复制粘贴，这个叫摘录，摘录的过程是没有思考的，没有思考就不可能理解和掌握，仅仅是一个印象，摘录是思考的敌人。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"需要对摘录进行思考和改造，按照你会使用的语境，用自己的语言进行组织。这个改造过程可能会进行多次，不断对比摘录内容和自己转录的内容，直到满意为止。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"富兰克林的仿写，卢曼的改写，在当代文学里面成为互文，把别人的思想转化为自己的语言，这种转换需要经过多次的努力完成。"}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这节讲了什么：对摘录的行为进行讨论，摘录它未经思考，从印象到认知、理解和掌握有很长一段距离，因此摘录是不行的。举了叔本华的一段话，论证了这个观点，强调一定要思考，需要对摘录的内容结合要使用的语境使用自己的语言进行改造，这个改造是一个持续的过程，不是一次就好的。接着举了富兰克林和卢曼的例子，讲了富兰克林通过仿写到投稿，卢曼的改写形成了自己的卡片笔记盒，说明改造的必要性。最后举了自己的例子，说自己如何在第二大脑的帮助了，仅用了 40 分钟就准备好了一个演讲稿的初稿，这个和《卡片笔记写作法》提出的一个场景很像，不用对着空白纸张从零开始。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"其实从《这才是心理学》中论述的观点，这些都是见证性叙事，给的都是单例，这个是否可信呢？我是倾向于相信的，但是这不是科学。"}]}],"breadcrumb":[{"label":"《第二大脑》","href":"/docs/project/22/212.html"},{"label":"第三章 创建高级的思考特质"},{"label":"改写、化用和互文：创建新的脑细胞","href":"/docs/project/22/239.html"}],"prevPage":{"title":"使用 Query 和搜索的技巧","href":"/docs/project/22/235.html"},"nextPage":{"title":"误区一：记忆力好≠不需要记录","href":"/docs/project/22/241.html"},"createTime":1741753556390,"updateTime":1743303640527,"currentPath":"/docs/project/22/239.html"},"meta":{"type":"doc","publishTime":1764820858538}};
