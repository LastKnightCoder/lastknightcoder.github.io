:"《战斗细胞》","href":"/docs/project/21/170.html","kind":"project"},{"id":18,"title":"3D 学习","href":"/docs/project/18/146.html","kind":"project"},{"id":23,"title":"笔记的方法","href":"/docs/project/23/276.html","kind":"project"}]},{"type":"document","label":"知识库","items":[{"id":11,"title":"计算机基础理论","href":"/docs/document/11/107.html","kind":"document"},{"id":1,"title":"数据结构","href":"/docs/document/1/8.html","kind":"document"},{"id":2,"title":"Canvas","href":"/docs/document/2/14.html","kind":"document"},{"id":5,"title":"CSS","href":"/docs/document/5/65.html","kind":"document"},{"id":12,"title":"LeetCode","href":"/docs/document/12/158.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":234,"title":"脑机协作催化新的创意","content":[{"type":"paragraph","children":[{"type":"formatted","text":"人与人之间的差异可以从两个层次考察："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"感觉，先天健全的人差距不会很大"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"记忆和思考的能力，理性，差异主要来自于后天教育"}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"随着义务制教育的普及，在理性方面的差距在缩小"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"但是创新能力差异很大"}]}]}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二大脑可以帮助创新。"}]},{"type":"paragraph","children":[{"type":"formatted","text":"第二大脑对第一大脑的帮助："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"为第一大脑减负，把东西放入第二大脑，脑海不要有太多东西，从记忆工作解放出来"}]},{"type":"highlight-block","color":"red","children":[{"type":"paragraph","children":[{"type":"formatted","text":"这个对第二大脑的检索能力要求很高，确保任意记忆在第二大脑中的东西都可以被检索到。"}]}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"发现联系，通过图谱等工具发现更多的信息，潜在的关系"}]},{"type":"blockquote","children":[{"type":"paragraph","children":[{"type":"formatted","text":"人类创造的本质，只是将不同的事物联系起来，这个联系越是意想不到，创造出来的东西就可能越有意思。"}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"例子，911 事件，早有预兆，不过发生在各地，未发现这种联系，没有上报。"}]}]}]},{"type":"paragraph","children":[{"type":"formatted","text":"第一大脑如何配合，三个经验："}]},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"要经常回访第二大脑，随机漫游"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"盯着看，以神经中枢为单位，对反射区一个一个进行浏览，在不同的信息之间进行切换浏览"}]}]},{"type":"list-item","children":[{"type":"paragraph","children":[{"type":"formatted","text":"保持诵读习惯，不同重复时，会将声音渗入意识中，成为潜意识"}]}]}]},{"type":"divide-line","children":[{"type":"formatted","text":""}]},{"type":"paragraph","children":[{"type":"formatted","text":"这节讲了什么：首先引入创新的话题，即使受过教育，人与人之间的创新能力依旧差异很大，第二大脑可以帮助我们创新。两个方面，第一、可以让第一大脑卸下记忆，专注思考，第二、可以通过第二大脑的图谱分析能力发现联系，将不同的事物联系起来就是创新。最后给出了三个经验如何使用第二大脑，第一经常回访，随机查看记录的信息，第二集中查看某个神经中枢，在不同的反射区之间进行浏览，最后保持诵读的习惯。"}]}],"breadcrumb":[{"label":"《第二大脑》","href":"/docs/project/22/212.html"},{"label":"第三章 创建高级的思考特质"},{"label":"脑机协作催化新的创意","href":"/docs/project/22/234.html"}],"prevPage":{"title":"洞察、发现新的联系","href":"/docs/project/22/233.html"},"nextPage":{"title":"使用 Query 和搜索的技巧","href":"/docs/project/22/235.html"},"createTime":1741739805333,"updateTime":1743303640527,"currentPath":"/docs/project/22/234.html"},"meta":{"type":"doc","publishTime":1764775995432}};
