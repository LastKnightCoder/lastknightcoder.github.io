58.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":291,"title":"为什么要使用标签进行分类","content":[{"type":"paragraph","children":[{"type":"formatted","text":"笔记为什么需要分类，方便后续查找，比如需要输出的时候，一篇文章，一场演讲，一个汇报，可以通过标签迅速查找到相关内容。"}],"disableDrag":false},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"为什么要使用标签分类而不是文件夹，其实我相信很多人使用文件夹分类的时候都遇到过这样的问题，一篇笔记似乎可以放在多个地方，不知道放在哪个文件夹下面比较好，如果放在某个文件夹下面，就丢失了与其他主题的连接关系，如果同时放在多个文件夹下面，除非你熟悉计算机的硬链接技术，否则你要维护多份笔记，每次修改都要修改多次，没有人愿意这么做。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"而使用标签分类，你可以把笔记打上多个标签，自然而然的就分为了多类，你可能会问，使用标签如何表示层级关系呢？所谓的文件夹下的文件，底层也不过是一个文件路径，只不过在资源管理器里面显示的时候把路径自动划分了，让你感觉到了层级结构，这样的事情标签也可以做到，你在记录标签的时候把层级通过 / 分割，看起来是一个标签，但实际显示的时候会处理标签，划分为多份，这样就可以看到层级结构。"}]},{"type":"image","url":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4f9869cf-6e84-44a5-9f66-5ff6c7b2e107.png","pasteUploading":false,"children":[{"type":"formatted","text":""}],"previewUrl":"http://blog-hostimaging.oss-cn-beijing.aliyuncs.com/image_4f9869cf-6e84-44a5-9f66-5ff6c7b2e107.png"}],"breadcrumb":[{"label":"笔记的方法","href":"/docs/project/23/276.html"},{"label":"记录篇，如何记笔记，做好信息预处理"},{"label":"用标签为笔记分类"},{"label":"为什么要使用标签进行分类","href":"/docs/project/23/291.html"}],"prevPage":{"title":"用自己的话记笔记的建议","href":"/docs/project/23/285.html"},"nextPage":{"title":"标签分类方法","href":"/docs/project/23/290.html"},"createTime":1743648856569,"updateTime":1752924448623,"currentPath":"/docs/project/23/291.html"},"meta":{"type":"doc","publishTime":1764821904229}};
