58.html","kind":"document"},{"id":6,"title":"Rust","href":"/docs/document/6/74.html","kind":"document"},{"id":9,"title":"SVG","href":"/docs/document/9/76.html","kind":"document"}]}],"content":{"id":283,"title":"为什么要用自己的话记笔记","content":[{"type":"paragraph","children":[{"type":"formatted","text":"记笔记遇到的问题："}],"disableDrag":false},{"type":"bulleted-list","children":[{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"需要解决问题时想不起来记的笔记"}]}]},{"type":"list-item","children":[{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"找到了相关的笔记，却难以应用"}]}]}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"第一个问题，为什么想不起来，有一个"},{"type":"content-link","children":[{"type":"formatted","text":"必要难度理论"}],"refId":30,"contentType":"card","contentTitle":"","contentId":27},{"type":"formatted","text":"，存储越容易，提取就越困难，反之存储越困难，提取就越容易。我们经常会把收集和记笔记弄错，收藏文章、划线、摘录存储太容易了，提取就会很困难。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"第二个问题在于在记录笔记时没有预思考，即使找到了相关的笔记，由于是摘录，收藏，复制粘贴的内容，缺少上下文，或者没有经过整理，即使找到了还需要重新阅读思考整理，导致无法拿来即用，甚至难以应用。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"使用自己的话记录能解决以上问题，第一用自己的话记录，需要不停的思考，"},{"type":"content-link","children":[{"type":"formatted","text":"写作即思考"}],"refId":33,"contentType":"card","contentTitle":"","contentId":30},{"type":"formatted","text":"，而思考就是在增加存储的难度，这样印象就会深刻，提取时就会更加容易；第二，用自己的话记录的笔记是自己的思考过的内容，这样在后续被发现时，已经被理解消化过，我们能很快地进行应用。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"用自己的话记笔记和费曼学习法有异曲同工之妙，费曼学习法强调将知识讲给别人听，如果别人能听懂，那么就可以认为自己掌握了知识，做笔记就相当于讲给未来的自己听，你假想给未来的自己讲述，如果未来的自己在遗失大部分记忆的情况下还能看懂，那么这则笔记就是成功的。"}]},{"type":"paragraph","disableDrag":false,"children":[{"type":"formatted","text":"但并不是所有的笔记都适用于用自己的话重新复述一遍，比如对于操作步骤、诗句、令人启发的金句，这些还是可以摘录的。"}]}],"breadcrumb":[{"label":"笔记的方法","href":"/docs/project/23/276.html"},{"label":"记录篇，如何记笔记，做好信息预处理"},{"label":"用自己的话做笔记"}
